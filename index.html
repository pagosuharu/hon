<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4EEF3">
<title>にっぽんと せかいの おはなしばこ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<style>
/* ===== いろ と もじ の きまり ===== */
:root{
  --wall:#E4EEF3;
  --wall-dot:#D2E2EA;
  --wood:#C98E57;
  --wood-light:#DDA771;
  --wood-dark:#9C6636;
  --back:#F2E4CF;
  --ink:#2E2B36;
  --ink-soft:#5E5A68;
  --paper:#FFFDF6;
  --font:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Zen Maru Gothic","BIZ UDPGothic","Hiragino Sans","Meiryo",sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:var(--font);
  color:var(--ink);
  background-color:var(--wall);
  background-image:radial-gradient(var(--wall-dot) 2px,transparent 2.5px);
  background-size:22px 22px;
  padding-left:var(--safe-l);
  padding-right:var(--safe-r);
  padding-bottom:var(--safe-b);
  -webkit-tap-highlight-color:transparent;
}

/* ===== いちばん うえ（タイトル） ===== */
.hero{
  padding:calc(var(--safe-t) + 28px) 20px 22px;
  max-width:980px;margin:0 auto;
}
.hero-small{font-size:18px;margin:0 0 10px 4px;color:var(--ink-soft);letter-spacing:.1em}
.blocks{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.blocks li{
  width:clamp(46px,13vw,68px);height:clamp(46px,13vw,68px);
  display:grid;place-items:center;
  font-size:clamp(28px,8.4vw,44px);
  color:#fff;
  border-radius:10px;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.18), 0 3px 0 rgba(0,0,0,.08);
  text-shadow:0 2px 0 rgba(0,0,0,.18);
}
.blocks li:nth-child(odd){transform:rotate(-3deg)}
.blocks li:nth-child(even){transform:rotate(2.5deg) translateY(3px)}
.hero-lead{margin:18px 0 0 4px;font-size:16px;line-height:1.8;color:var(--ink-soft)}

/* ===== ジャンルの ボタン ===== */
.genre-nav{
  position:sticky;top:0;z-index:5;
  background:rgba(228,238,243,.94);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:calc(var(--safe-t) + 8px) 0 8px;
  border-bottom:2px solid var(--wall-dot);
}
.genre-nav ul{
  display:flex;gap:8px;overflow-x:auto;margin:0 auto;max-width:980px;
  padding:2px 16px 4px;list-style:none;scrollbar-width:none;
}
.genre-nav ul::-webkit-scrollbar{display:none}
.genre-nav a,.genre-nav button{
  appearance:none;font:inherit;cursor:pointer;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  padding:8px 14px;border-radius:999px;
  background:var(--paper);color:var(--ink);text-decoration:none;
  font-size:15px;border:2px solid var(--c);
}
.genre-nav button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.genre-nav button.kana{min-width:44px;justify-content:center;font-weight:700}
.genre-nav button.kana::before{display:none}
.genre-nav button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none !important}

/* ===== さいしょの がめん（3つの グループ） ===== */
.groups{max-width:980px;margin:0 auto;padding:8px 16px 26px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:760px){ .groups{grid-template-columns:repeat(3,minmax(0,1fr))} }
.group{
  appearance:none;font:inherit;color:var(--ink);cursor:pointer;text-align:left;
  display:block;width:100%;
  padding:18px 18px 0;border-radius:20px;
  background:var(--paper);border:4px solid var(--c);
  box-shadow:0 5px 0 var(--c);
  transition:transform .15s ease, box-shadow .15s ease;
}
.group:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c)}
.group:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.group-top{display:flex;align-items:center;gap:14px}
.group-ico{
  flex:none;width:64px;height:64px;border-radius:50%;
  display:grid;place-items:center;font-size:36px;
  background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);
}
.group-name{margin:0;font-size:clamp(21px,5.8vw,25px);font-weight:700;line-height:1.35;word-break:keep-all}
.group-lead{margin:4px 0 0;font-size:14px;color:var(--ink-soft);line-height:1.6}
.group-count{
  display:inline-block;margin-top:6px;padding:2px 12px;border-radius:999px;
  background:var(--c);color:#fff;font-size:14px;
}
.mini{
  display:flex;align-items:flex-end;gap:3px;height:58px;
  margin:16px -4px 0;padding:0 10px;
  border-bottom:8px solid var(--wood);
  overflow:hidden;
}
.mini span{flex:none;width:12px;border-radius:3px 3px 0 0;box-shadow:inset -2px 0 0 rgba(0,0,0,.12)}
@media (prefers-reduced-motion:reduce){ .group{transition:none} }

/* ===== ほんだなの がめんの うえ ===== */
.viewbar{
  display:flex;align-items:center;gap:10px;
  max-width:980px;margin:0 auto;padding:0 16px 8px;
}
.back{
  flex:none;appearance:none;border:2px solid var(--wall-dot);cursor:pointer;font:inherit;
  padding:8px 14px;border-radius:999px;background:var(--paper);color:var(--ink);font-size:15px;
}
.back:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.view-title{
  margin:0;min-width:0;font-size:clamp(18px,5.2vw,22px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.modes{
  display:flex;max-width:480px;margin:4px auto 22px;padding:4px;
  background:var(--paper);border-radius:999px;border:2px solid var(--wall-dot);
}
.modes button{
  flex:1;appearance:none;border:0;cursor:pointer;font:inherit;
  padding:10px 4px;border-radius:999px;background:transparent;color:var(--ink-soft);font-size:14px;
  white-space:nowrap;
}
.modes button[aria-pressed="true"]{background:var(--c);color:#fff;font-weight:700}
.modes button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ===== ほんだな ===== */
main{max-width:980px;margin:0 auto;padding:18px 12px 10px}
.shelf{margin:0 0 34px;scroll-margin-top:calc(var(--safe-t) + 120px)}
.plate.kana-plate .ico2{
  display:grid;place-items:center;width:30px;height:30px;border-radius:8px;
  background:var(--c);color:#fff;font-size:18px;
}
.plate{
  display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px 8px;
  margin:0 0 10px 6px;padding:8px 16px;
  font-size:clamp(16px,4.8vw,19px);
  background:var(--paper);border:3px solid var(--c);border-radius:12px;
  font-weight:700;
}
.plate .count{font-size:14px;font-weight:400;color:var(--ink-soft);white-space:nowrap}
.case{
  border:10px solid var(--wood);
  border-bottom-width:0;
  border-radius:8px 8px 4px 4px;
  background:
    repeating-linear-gradient(to bottom,
      transparent 0 210px,
      var(--wood-light) 210px 213px,
      var(--wood) 213px 221px,
      var(--wood-dark) 221px 224px),
    var(--back);
}
.books{
  display:flex;flex-wrap:wrap;align-items:flex-end;
  row-gap:14px;column-gap:3px;
  margin:0;padding:0 10px 14px;list-style:none;
}
.slot{height:210px;display:flex;align-items:flex-end}
.book{
  appearance:none;border:0;cursor:pointer;font:inherit;color:var(--ink);
  width:var(--w);min-height:var(--h);
  display:flex;flex-direction:column;align-items:center;
  padding:10px 0 12px;
  border-radius:5px 5px 2px 2px;
  background:
    linear-gradient(to bottom,
      transparent 0 6px, rgba(0,0,0,.16) 6px 9px,
      transparent 9px calc(100% - 9px),
      rgba(0,0,0,.16) calc(100% - 9px) calc(100% - 6px),
      transparent calc(100% - 6px)),
    var(--c);
  box-shadow:inset -4px 0 0 rgba(0,0,0,.12), inset 3px 0 0 rgba(255,255,255,.22);
  transition:transform .15s ease;
}
.book.alt{filter:brightness(.9) saturate(1.05)}
.book .ico{font-size:22px;line-height:1;margin-top:4px}
.book .lbl{
  margin-top:6px;
  flex:none;min-height:var(--lh);
  writing-mode:vertical-rl;text-orientation:upright;
  white-space:nowrap;text-align:center;
  background:var(--paper);
  font-size:var(--fs);letter-spacing:.04em;line-height:1.1;
  padding:6px 4px;border-radius:3px;
}
/* せびょうしの さくしゃめい */
.book .lbl .au{font-size:var(--afs);color:var(--ink-soft);letter-spacing:0}
@media (hover:hover){ .book:hover{transform:translateY(-6px)} }
.book:active{transform:translateY(-8px)}
.book:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){ .book{transition:none} }

footer{
  max-width:980px;margin:0 auto;padding:6px 22px 40px;
  font-size:14px;line-height:1.9;color:var(--ink-soft);
}

/* ===== おはなしを ひらいたところ ===== */
.overlay{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(34,44,66,0);
  transition:background .28s ease;
}
.overlay[hidden]{display:none}
.overlay.open{background:rgba(34,44,66,.5)}
.sheet{
  width:min(720px,100%);
  max-height:calc(100% - var(--safe-t) - 16px);
  display:flex;flex-direction:column;
  background:var(--paper);
  border-radius:24px 24px 0 0;
  overflow:hidden;
  transform:translateY(104%);
  transition:transform .3s cubic-bezier(.2,.8,.25,1);
  box-shadow:0 -6px 30px rgba(0,0,0,.18);
}
.overlay.open .sheet{transform:translateY(0)}
@media (min-width:760px){
  .overlay{align-items:center}
  .sheet{border-radius:24px;max-height:calc(100% - 60px)}
}
@media (prefers-reduced-motion:reduce){ .sheet,.overlay{transition:none} }

.sheet-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-head{
  position:relative;
  padding:22px 20px 22px;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 12px,transparent 12px 24px),
    var(--c);
  display:flex;align-items:center;gap:16px;
}
.big-ico{
  flex:none;width:72px;height:72px;border-radius:50%;
  background:var(--paper);display:grid;place-items:center;font-size:40px;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);
}
.head-text{min-width:0;padding-right:70px}
.head-yomi{margin:0;font-size:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.head-title{margin:2px 0 0;font-size:clamp(24px,7vw,32px);line-height:1.3;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.25)}
.head-sub[hidden]{display:none}
.head-sub{margin:6px 0 0;display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--ink)}
.close{
  position:absolute;top:14px;right:14px;
  appearance:none;border:0;cursor:pointer;font:inherit;
  padding:10px 14px;border-radius:999px;
  background:var(--paper);color:var(--ink);font-size:15px;
  box-shadow:0 2px 0 rgba(0,0,0,.12);
}
.close:focus-visible,.pager button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.story{padding:26px 22px 6px;max-width:36em;margin:0 auto}
.story p{margin:0 0 1.1em;font-size:18px;line-height:2;letter-spacing:.02em}
.story p.uta{
  margin:0 0 1.1em;padding:14px 16px;border-radius:12px;
  background:var(--wall);line-height:1.9;text-align:center;
}
.fin{
  text-align:center;margin:10px 0 22px;font-size:17px;color:var(--ink-soft);
}
.fin span{display:inline-block;padding:4px 18px;border-top:3px dotted var(--c);border-bottom:3px dotted var(--c)}
.pager{
  display:flex;gap:10px;padding:0 16px 20px;max-width:720px;margin:0 auto;
}
.pager button{
  flex:1;min-height:60px;
  appearance:none;border:0;cursor:pointer;font:inherit;color:var(--ink);
  padding:8px 12px;border-radius:14px;background:var(--wall);
  display:flex;flex-direction:column;justify-content:center;gap:2px;
}
.pager .dir{font-size:13px;color:var(--ink-soft)}
.pager .nt{font-size:16px}
.pager .prev{text-align:left}
.pager .next{text-align:right}
.pager button:disabled{visibility:hidden}
.sheet-pad{height:var(--safe-b)}
</style>
</head>

      text   … あらすじ。["だんらく1","だんらく2",…] と ならべてね

============================================================ -->

"ある秋の日のこと。およめさんは庭にさく菊の花に見とれているうちに、うっかり、着物のすそから、ふさふさのきつねのしっぽを出してしまいました。それを見てしまったのは、小さな子どもでした。",
"じつは、およめさんは、むかし男にたすけられたきつねだったのです。正体を知られてしまったからには、もう人間の世界にはいられません。",
"その夜、およめさんは泣きながら、しょうじに歌を書きのこしました。",
"♪恋しくば　たずねきてみよ　和泉なる　信太の森の　うらみ葛の葉",
"（会いたくなったら、和泉の国の信太（しのだ）の森に、たずねてきてね）という意味です。",
"およめさんはそっと家を出て、森へ帰っていきました。父と子はこの歌をたよりに信太の森をたずね、そこで、きつねのすがたにもどったお母さんと、なみだのおわかれをしたといいます。"
]},

/* ---------- しょうじき・よくばり ---------- */
{ cat:"inga", title:"花咲か爺", yomi:"はなさかじいさん", icon:"🌸", text:[
"むかし、正直でやさしいおじいさんとおばあさんが、シロという白い犬をかわいがっていました。",
"ある日、シロが畑で「ここほれワンワン、ここほれワンワン」とほえます。おじいさんがくわでほってみると、大判小判がざっくざく！",
"それを見ていたのが、となりのよくばりじいさんです。「わしにもシロをかしてくれ」とむりやりつれていき、ほらせてみましたが、出てくるのはガラクタばかり。おこったよくばりじいさんは、なんとシロを死なせてしまいました。",
"悲しんだおじいさんは、シロをうめたところに小さな木をうえました。木はみるみる大きくなり、その木でうすをつくっておもちをつくと、うすの中から小判があふれ出しました。ところが、またもやよくばりじいさんがうすをかりていき、ガラクタしか出なかったので、うすを燃やして灰にしてしまいました。",
"おじいさんが、せめてもとその灰を持ち帰ると、風がふいて灰がかれ木にかかりました。すると、かれ木にぱあっとさくらの花がさいたのです。",
"おじいさんが「かれ木に花をさかせましょう」と町でさくらをさかせてみせると、通りかかったお殿さまは大よろこびで、たくさんのごほうびをくれました。まねをしたよくばりじいさんが灰をまくと、花はさかず、灰がお殿さまの目に入ってしまい、きつくおしかりを受けたのでした。"
]},
{ cat:"inga", title:"こぶとり爺", yomi:"こぶとりじいさん", icon:"💃", text:[
"むかし、ほっぺたに大きなこぶのあるおじいさんが、ふたりいました。ひとりは明るくてほがらかなおじいさん、もうひとりはいじわるなおじいさんです。",
"ある日、ほがらかなおじいさんが山で木を切っていると、大雨がふってきました。木のうろで雨やどりをしているうちにねむってしまい、目をさますと、もう夜。どこからか、にぎやかな歌声が聞こえてきます。",
"そっとのぞいてみると、鬼たちがたき火をかこんで、さかもりをしていました。たのしそうなおはやしに、おじいさんはうずうず。とうとう輪の中にとび出して、ひょうきんにおどりはじめました。",
"「こりゃあおもしろい！」鬼たちは大よろこび。「じいさん、あしたもまたおどりにこい。やくそくのしるしに、このこぶをあずかっておくぞ」。鬼がほっぺのこぶをもぎとると、ふしぎなことに、ちっともいたくありませんでした。",
"この話を聞いたいじわるなおじいさんは、「わしもこぶをとってもらおう」と、つぎの夜、鬼たちのところへ出かけました。ところが、こぶをとってもらうことばかり考えて、おどりはぎこちなく、ちっとも楽しくありません。",
"「なんだ、へたくそなおどりだ！こぶは返してやる！」鬼はおこって、あずかっていたこぶを、いじわるじいさんのもう片方のほっぺにぺたり。いじわるじいさんのこぶは、ふたつになってしまいました。"
]},
{ cat:"inga", title:"おむすびころりん", yomi:"おむすびころりん", icon:"🍙", text:[
"むかし、はたらきもののおじいさんが、山でしばかりをしていました。お昼になって、おばあさんがつくってくれたおむすびを食べようとすると、手がすべって、おむすびがころころころりん。坂をころがって、小さなあなの中へすとんとおちてしまいました。",
"あなに耳をあててみると、中から歌声が聞こえてきます。「おむすびころりん、すっとんとん。ころころころりん、すっとんとん」。おもしろくなったおじいさんが、もうひとつおむすびをころがすと、また楽しい歌が聞こえてきました。",
"あなをのぞきこんだおじいさんは、足をすべらせて、自分もころころころりん。あなの中は、ねずみたちのごてんでした。「おいしいおむすびを、ありがとうございました」。ねずみたちはごちそうとおもちつきでおじいさんをもてなし、おみやげに小さなつづらをくれました。家であけると、中にはたからものがいっぱいでした。",
"それを聞いたとなりのよくばりじいさんは、おむすびをあなにおしこみ、自分もむりやりもぐりこみました。そして「たからをみんなよこせ。さもないと……ニャーオ！」と、ねこのなきまねをしたのです。",
"ねずみたちはびっくりしてにげだし、あかりがふっと消えて、あなの中はまっくら。よくばりじいさんは出口がわからず、土の中をいつまでもさまよいつづけ、とうとうもぐらになってしまったともいわれています。"
]},
{ cat:"inga", title:"わらしべ長者", yomi:"わらしべちょうじゃ", icon:"🌾", text:[
"むかし、まずしくて、なにをやってもうまくいかない若者がいました。若者は観音（かんのん）さまに、「どうか、わたしをおたすけください」と、毎日おいのりしました。",
"するとある夜、ゆめの中で観音さまが言いました。「お寺を出て、さいしょに手にふれたものを、たいせつに持っていきなさい」。",
"お寺を出たとたん、若者はつまずいてころび、にぎったのは一本のわら（わらしべ）でした。「これをたいせつに……？」ふしぎに思いながら歩いていると、ぶんぶんとあぶがとんできたので、つかまえてわらの先にむすびました。",
"すると、泣いていた小さな子が、あぶのついたわらを見て大よろこび。お母さんがお礼に、みかんをくれました。",
"つぎに、のどがかわいてたおれそうな人にみかんをあげると、お礼にきれいな布をもらいました。そのつぎに、弱った馬をかかえてこまっている人に出会い、布と馬をとりかえました。若者が水をのませて一生けんめい世話をすると、馬はすっかり元気になりました。",
"さいごに、旅に出るという屋しきの主人から「その馬と、この屋しきをとりかえてくれないか」とたのまれます。こうして、一本のわらからはじまった若者は、大きな屋しきのあるじ、「わらしべ長者」になったのでした。"
]},
{ cat:"inga", title:"貧乏神と福の神", yomi:"びんぼうがみとふくのかみ", icon:"🏮", text:[
"むかし、ある村に、まずしいけれどまじめな若い夫婦がすんでいました。じつはその家の天井うらには、ずっとむかしから貧乏神がすみついていました。",
"夫婦は朝から晩まで、なかよく一生けんめいはたらきました。そのせいで、貧乏神はだんだん居心地がわるくなってきます。",
"大みそかの夜。夫婦が年こしのしたくをしていると、天井うらから、しくしく泣く声が聞こえてきました。見ると、やせこけた貧乏神が泣いています。「もうすぐ福の神がやってきて、わしはこの家を追い出されてしまうんじゃ」。",
"夫婦は顔を見あわせました。「長いあいだ、この家でいっしょにくらしてきたんだもの。追い出すなんてかわいそうだ」。",
"やがて、りっぱなすがたの福の神がやってきて、「さあ、貧乏神は出ていけ！」と言いました。すると夫婦は貧乏神のみかたをして、「えいっ、えいっ」と力をあわせ、福の神のほうを追い返してしまったのです。",
"貧乏神はなみだを流して大よろこび。「こんなにやさしくしてもらったのは、はじめてじゃ」。それからというもの、夫婦の家はどんどんゆたかになり、貧乏神といっしょに、いつまでもしあわせにくらしたということです。"
]},

/* ---------- とんち・わらい ---------- */
{ cat:"tonchi", title:"三年寝太郎", yomi:"さんねんねたろう", icon:"😴", text:[
"むかし、ある村に、朝から晩までねてばかりの若者がいました。一年たっても、二年たっても起きてこないので、村の人たちは「三年寝太郎」とよんで、なまけものだとわらっていました。",
"その村は雨が少なく、田んぼがからからにかわいて、みんなこまっていました。",
"ちょうど三年がたったある日。寝太郎はむっくりと起きあがると、だまって山へのぼっていきました。そして山の上にある大きな大きな岩を、「うーん、うーん」と力いっぱいおしはじめたのです。",
"岩はごろんごろんと山をころがりおち、ドッシーン！と川のまん中でとまりました。すると、せきとめられた川の水の流れがかわり、からからだった田んぼへ、水がどんどんながれこんでいきました。",
"村は、お米がたくさんとれる、ゆたかな村になりました。寝太郎は、ねているあいだ、ずっと村をすくう方法を考えていたのです。村の人たちはもう寝太郎をわらったりせず、みんなで感しゃしたということです。"
]},
{ cat:"tonchi", title:"一休さん", yomi:"いっきゅうさん", icon:"🌉", text:[
"むかし、京都のお寺に、一休さんという、かしこい小ぼうさんがいました。一休さんは、どんなむずかしい問題も、とんちですらすらととくことで有名でした。",
"あるとき、橋のたもとに「このはしわたるべからず」と書いた立てふだがありました。みんなが困っていると、一休さんは平気な顔で、橋のまん中を歩いてわたってしまいます。「『はし（端）』をわたるな、と書いてあったので、まん中をわたりました」。",
"うわさを聞いた将軍さまは、一休さんをためしてみようと、お城によびました。そして、虎の絵がかかれた屏風（びょうぶ）を指さして言いました。「この屏風の虎が、夜な夜なぬけ出してあばれるのじゃ。一休、しばりあげてみよ」。",
"一休さんはなわを手にして、屏風の前でかまえました。「わかりました。では将軍さま、虎を屏風から追い出してください。出てきたら、すぐにしばってみせます」。",
"絵の虎を追い出すことなど、だれにもできません。将軍さまは「まいった、まいった」と大わらいして、一休さんにたくさんのごほうびをくれたということです。"
]},
{ cat:"tonchi", title:"吉四六さん", yomi:"きっちょむさん", icon:"😆", text:[
"大分県の野津（のつ）という村に、吉四六さんという、とんちの名人がいました。いばりんぼうのお役人や、よくばりな商人を、ゆかいな知恵でぎゃふんと言わせては、村の人たちをわらわせていた人気ものです。吉四六さんのお話はたくさんのこっていますが、ここでは、そのひとつをごしょうかいしましょう。",
"ある町に、けちで有名なうなぎ屋さんがありました。お店の前をとおると、うなぎをやくいいにおいが、ぷうんとただよってきます。",
"吉四六さんは、そのにおいをかぎながら、自分のおべんとうのごはんを、おいしそうに食べていました。するとうなぎ屋の主人がとび出してきて言いました。「おまえさん、うちのうなぎのにおいで、ごはんを食べたな。においのお代をはらってもらおうか」。",
"吉四六さんは「わかりました」と、ふところからさいふを出すと、中のお金をじゃらじゃらとふって、音を聞かせました。「なにをしているんだ。はやくお金をよこせ」。",
"「においをかいだだけですから、お代はお金の音でおはらいしました。これでおあいこでしょう」。けちなうなぎ屋の主人はぐうの音も出ず、見ていた町の人たちは大わらいしたということです。"
]},
{ cat:"tonchi", title:"彦一ばなし", yomi:"ひこいちばなし", icon:"🎋", text:[
"熊本県の八代（やつしろ）に、彦一（ひこいち）という、とんちのきく男がいました。いたずらもののタヌキやキツネも、彦一との化かしあいでは、いつも負けてしまうほどです。",
"ある日、彦一は、山にすむ天狗が「かくれみの」という宝ものを持っていると聞きました。着ると、すがたがすっかり見えなくなる、ふしぎなみのです。",
"そこで彦一は、ただの竹づつを持って山へ行き、それを目にあてて大声で言いました。「わあ、よく見える！大阪の町が、まるで目の前みたいだ！」。",
"気になった天狗が「その竹づつを、わしにも見せろ」と言うと、彦一は「これは遠くまで見える、たいせつな宝ものです。でも、そのかくれみのと取りかえてくれるなら……」。",
"天狗は大よろこびで取りかえっこ。けれど、いくら竹づつをのぞいても何も見えません。「だまされた！」と気づいたときには、彦一はかくれみのを着て、すうっとすがたを消していました。天狗がどんなにさがしても、見えない彦一を見つけることはできなかったということです。"
]},
{ cat:"tonchi", title:"たのきゅう", yomi:"たのきゅう", icon:"🎭", text:[
"むかし、たのきゅうという旅の役者がいました。ふるさとのお母さんが病気だと聞き、いそいで山をこえて帰ることにしました。",
"とうげの茶屋のおばあさんが言いました。「夜の山道には、うわばみ（大へび）が出るから気をつけなされ」。",
"山の中で日がくれて休んでいると、白いひげのおじいさんがあらわれました。じつはこれが、うわばみのばけたすがたです。「おまえは何者だ」「たのきゅうです」。するとうわばみは「たぬき」と聞きまちがえて、「なんだ、なかまのたぬきか。それならばけてみせろ」と言いました。",
"たのきゅうは、役者の道具で女の人のすがたにへんそう。うわばみはすっかり感心して、たぬきだと信じこみました。",
"「ところで、たぬきどん、おまえのこわいものは何だ」「わたしは、お金がいちばんこわいです。うわばみどんは？」「わしは、たばこのヤニと柿のしぶが、だいきらいなんじゃ」。",
"山をおりたたのきゅうは、村の人たちにこのことを知らせます。村人たちは、たばこのヤニと柿のしぶを集めて山へ行き、うわばみにたっぷりあびせて追いはらいました。",
"「たぬきめ、しゃべったな！しかえしに、おまえのこわいものをおみまいしてやる！」。うわばみは、たのきゅうの家に小判をどっさりなげこんでいきました。たのきゅうはそのお金でお母さんの病気をなおし、しあわせにくらしましたとさ。"
]},
{ cat:"tonchi", title:"屁こき嫁", yomi:"へこきよめ", icon:"💨", text:[
"むかし、ある家に、気立てのやさしいおよめさんがきました。ところが、しばらくすると、およめさんの顔色がだんだん青白くなっていきます。",
"夫のお父さんが心配してたずねると、およめさんははずかしそうに言いました。「じつは、おならをずっとがまんしているのです」。「なんだ、そんなこと。えんりょしないで、ぷうっとしなさい」。",
"「では……」。およめさんがおしりをむけて、ブォォォーン！！そのいきおいのすごいこと。しょうじはやぶれ、たたみはまいあがり、お父さんは天井までふきとばされてしまいました。",
"「こんなおよめさんとは、いっしょにくらせない」。およめさんは、実家へ帰されることになりました。",
"そのとちゅう、とうげで、商人たちが高い木の梨（なし）の実をとれずにこまっていました。「わたしがおとしてあげましょう」。およめさんが木にむかってブォーン！とおならをすると、梨の実がばらばらばらっとおちてきました。商人たちは大よろこびで、たくさんのお礼をくれました。",
"「こんなにすごい力があるなら、たからものだ」。夫はおよめさんを家へつれて帰り、それからは家族みんなで、なかよくわらってくらしました。"
]},
{ cat:"tonchi", title:"団子婿", yomi:"だんごむこ", icon:"🍡", text:[
"むかし、ちょっとのんびりやのおむこさんがいました。ある日、およめさんの実家へ遊びに行くと、「だんご」をごちそうしてもらいました。",
"「こんなにおいしいものははじめてだ！家に帰ったら、およめさんにつくってもらおう」。わすれないように、おむこさんは「だんご、だんご、だんご」ととなえながら、帰り道を歩きます。",
"ところが、とちゅうの小川をぴょんととびこえたひょうしに、「どっこいしょ！」。そのあとは、「どっこいしょ、どっこいしょ」とおぼえまちがえてしまいました。",
"家に帰ると、「おい、どっこいしょをつくってくれ」。およめさんは「どっこいしょって、なんのこと？」と首をかしげるばかり。「どっこいしょはどっこいしょだ！」「そんなもの、知りませんよ」。",
"ふたりが言いあっているうちに、およめさんはふりむいたひょうしに、はしらにおでこをごつん！「いたた……。まあ見て、おでこに、だんごみたいなこぶができちゃった」。",
"「それだ！だんごだ、だんご！」。おむこさんはようやく思い出して、ぽんと手をたたきました。"
]},

/* ---------- ふしぎ ---------- */
{ cat:"fushigi", title:"塩ふきうす", yomi:"しおふきうす", sub:"なぜ海の水はしょっぱいか", icon:"🧂", text:[
"むかし、まずしいけれど心のやさしい弟と、よくばりな兄がいました。大みそかになっても、お正月のお米もない弟は、山でひとりのおじいさんに出会い、ふしぎな石うすをもらいました。「右にまわせば、ほしいものが何でも出てくる。止めたいときは、左にまわすんじゃ」。",
"弟が「お米出ろ」とまわすと、お米がざらざら。「おもち出ろ」「さかな出ろ」。何でも出てきます。弟はゆたかになり、村の人たちにもわけてあげました。",
"それをねたんだ兄は、夜中にうすをぬすみ出して、舟で海へにげました。沖に出た兄は、「そうだ、塩はとても高く売れる。塩を出してもうけよう」と、「塩出ろ」とうすをまわしました。",
"塩はどんどん出てきます。「もういい、止まれ！」。けれど兄は、止め方を知りません。塩は舟いっぱいにあふれ、とうとう舟はうすといっしょに、海のそこへしずんでしまいました。",
"うすは今でも、海のそこで塩を出しつづけています。だから、海の水はしょっぱいのだそうです。"
]},
{ cat:"fushigi", title:"聞き耳頭巾", yomi:"ききみみずきん", icon:"👂", text:[
"むかし、信心ぶかく、心のやさしいおじいさんがいました。いつも村のおいなりさんにおまいりしていたおじいさんは、ある日、ふしぎな頭巾（ずきん）をさずかりました。この頭巾をかぶると、鳥やけもの、木や草の話す言葉が、ぜんぶわかるようになるのです。",
"おじいさんが木の下で頭巾をかぶってみると、からすたちの話し声が聞こえてきました。「町の長者のむすめさんが、重い病気でねこんでいるそうだ」「あれはな、長者の家の蔵（くら）をたてたとき、屋根うらに一ぴきのへびがはさまってしまって、そのへびがくるしんでいるからなんだ」。",
"おじいさんはいそいで長者の家へ行き、「わたしが、むすめさんの病気をなおしてみせましょう」と言いました。そして蔵の屋根うらをしらべると、ほんとうに、柱のあいだにへびがはさまって、弱っていたのです。",
"おじいさんがへびをそっとたすけ出してあげると、そのとたん、むすめさんの病気はうそのようによくなりました。長者は大よろこびで、おじいさんにたくさんのお礼をさしあげたということです。"
]},
{ cat:"fushigi", title:"天狗の隠れ蓑", yomi:"てんぐのかくれみの", icon:"👺", text:[
"むかし、ある村に、いたずら好きな男がいました。男は、竹づつを「遠くが見える宝もの」だとうそをついて天狗をだまし、着るとすがたが見えなくなる「かくれみの」と取りかえてしまいました。",
"すがたの見えなくなった男は、酒屋でこっそりお酒をのんだり、町でいたずらをしたりして、やりたいほうだい。",
"ところがある日、男のおよめさんが、物置にあった古ぼけたみのを「きたないゴミだわ」と思って、燃やしてしまいました。",
"男はがっかりしましたが、「そうだ！」と、のこった灰を体じゅうにぬってみました。するとまた、すがたが消えたのです。",
"男はまたお酒をのみに行きましたが、お酒をのんだ口のまわりの灰がとれて、口だけがうかんで見えてしまいます。さらに汗で灰がはげおちて、とうとう「どろぼうだ！」と見つかり、みんなに追いかけられて、はだかのまま川にとびこんだのでした。"
]},
{ cat:"fushigi", title:"十二支のはじまり", yomi:"じゅうにしのはじまり", icon:"🐮", text:[
"むかしむかし、神さまが動物たちにおふれを出しました。「一月一日の朝、わたしのごてんにあいさつに来なさい。先に着いた十二ばんめまでを、一年ずつ、その年の大将にしよう」。",
"動物たちは大はりきり。ところが、ねこはうっかり日にちをわすれてしまい、ねずみにたずねました。するといじわるなねずみは、「一月二日だよ」とうそを教えました。",
"足のおそい牛は、「わたしはおそいから、夜のうちに出発しよう」と、まだ暗いうちから歩きはじめました。そのせなかに、こっそりねずみがのっていたのです。",
"朝、牛がごてんの門の前に着くと、せなかのねずみがぴょんととびおりて、いちばんのり！こうして一ばんはねずみ、二ばんは牛になりました。それから、とら、うさぎ、たつ、へび、うま、ひつじ、さる、とり、いぬ、いのししの順に着きました。",
"つぎの日、ねこが「いちばんのりだ！」とやってくると、神さまは「おや、あいさつはきのうだったよ」。だまされたと知ったねこは、かんかんにおこりました。それからというもの、ねこはねずみを見ると、追いかけまわすようになったのだそうです。"
]},
{ cat:"fushigi", title:"若返りの水", yomi:"わかがえりのみず", icon:"💧", text:[
"むかし、山の近くに、おじいさんとおばあさんがすんでいました。ある暑い日、おじいさんはしばかりのとちゅうで、きれいなわき水を見つけ、ごくごくとのみました。",
"すると体がかるくなり、こしもぴんとのびて、みるみる若いころのすがたにもどったのです。",
"家に帰ると、おばあさんは「あなた、どなた？」とびっくり。わけを聞いたおばあさんは、「わたしも若くなりたい！」と、いそいで山へ出かけていきました。",
"ところが、いつまでたっても、おばあさんは帰ってきません。しんぱいになったおじいさんがわき水のところへ行ってみると、おばあさんのすがたはなく、おばあさんの着物の中で、赤ちゃんが「おぎゃあ、おぎゃあ」と泣いていました。",
"おばあさんは、もっと若くなろうと、水をのみすぎてしまったのです。おじいさんはしかたなく赤ちゃんをだいて帰り、たいせつにそだてたということです。"
]},
{ cat:"fushigi", title:"夢買い", yomi:"ゆめかい", icon:"🐝", text:[
"むかし、ふたりの男がいっしょに旅をしていました。とちゅうで、ひとりの男がつかれて、木かげでひるねをはじめました。",
"もうひとりの男が見ていると、ねている男の鼻の穴から、一ぴきのはちがぶーんととび出して、どこかへとんでいき、しばらくしてまた鼻の中へもどっていきました。",
"目をさました男は言いました。「ふしぎなゆめを見たよ。どこかの長者のお屋しきの庭の、白いつばきの木の根もとに、金のつぼがうまっているゆめだった」。",
"それを聞いたもうひとりの男は、「そのゆめ、わたしに売ってくれないか」とたのみ、お金をはらってゆめを買いとりました。",
"男はさっそく、ゆめに出てきたような長者のお屋しきをさがして歩きました。そしてついに、白いつばきの木のある屋しきを見つけ、そこではたらかせてもらいました。ある日、つばきの根もとをほってみると……ほんとうに、金がいっぱいつまったつぼが出てきたのです！男はお金持ちになり、しあわせにくらしました。"
]},

/* ---------- ちょっぴりこわい ---------- */
{ cat:"kowai", title:"三枚のお札", yomi:"さんまいのおふだ", icon:"📜", text:[
"むかし、山のお寺に、おしょうさんと小ぞうさんがくらしていました。秋になり、小ぞうさんが「山へくりひろいに行きたい」と言うと、おしょうさんは「山んばが出るかもしれん。これを持っていきなさい」と、三枚のおふだをわたしてくれました。",
"くりひろいにむちゅうになるうちに日がくれて、道にまよった小ぞうさん。やさしそうなおばあさんが「うちにとまっていきなさい」と声をかけてくれました。",
"ところが夜中にふと目をさますと、「シャーッ、シャーッ」とほうちょうをとぐ音。そっとのぞくと、そこには口が耳までさけた山んばがいました！",
"小ぞうさんは「おしっこに行きたい」と言ってべんじょに入り、一枚目のおふだに「わたしのかわりに返事をしておくれ」とたのんで、まどからにげだしました。山んばが「まだか」と聞くたびに、おふだが「まあだだよ」と返事をします。",
"やがてだまされたと気づいた山んばが、ものすごいいきおいで追いかけてきました。小ぞうさんが二枚目のおふだを投げて「大きな川になれ！」とさけぶと、目の前に大きな川があらわれます。山んばがそれをがぶがぶのみほして追ってくると、三枚目のおふだで「火の海になれ！」。山んばは、のんだ川の水をはき出して火をけし、まだまだ追いかけてきます。",
"ようやくお寺にたどりついた小ぞうさん。おしょうさんは山んばに「術くらべをしよう。どれだけ小さくなれるかな？」ともちかけます。山んばが豆つぶほどに小さくなると、おしょうさんはそれをひょいとおもちにはさんで、ぱくりと食べてしまいましたとさ。"
]},
{ cat:"kowai", title:"牛方と山姥", yomi:"うしかたとやまんば", icon:"🐂", text:[
"むかし、牛のせなかにさばをたくさんつんで、山道をこえる「牛方（うしかた）」がいました。とうげにさしかかると、山んばがあらわれて言いました。「さばを一ぴきおくれ。くれなければ、おまえを食べてしまうぞ」。",
"牛方がこわくなってさばをなげると、山んばはあっというまに食べてしまい、「もっとよこせ」。とうとう、さばはぜんぶなくなってしまいました。すると山んばは「こんどは牛をよこせ」と、牛まで食べてしまいます。",
"「つぎはおまえだ！」。牛方はむちゅうでにげだし、山おくに見つけた一けんの家にとびこんで、天井のはりの上にかくれました。ところが、そこは山んばの家だったのです！",
"帰ってきた山んばは、「あー、つかれた。きょうはかまの中でねよう」と、大きなかまの中にもぐりこみ、ぐうぐうとねむってしまいました。",
"牛方はしずかにおりてくると、かまのふたに大きな石をのせ、かまの下に火をたきはじめました。こうして牛方は山んばをやっつけ、ぶじに村へ帰ることができたのでした。"
]},
{ cat:"kowai", title:"瓜子姫", yomi:"うりこひめ", icon:"🍈", text:[
"むかし、おばあさんが川でひろった大きなうりをわってみると、中からかわいい女の子が出てきました。「瓜子姫」と名づけられた女の子は、はたおりの上手な、やさしいむすめにそだちました。",
"ある日、おじいさんとおばあさんは町へ出かけることになりました。「あまのじゃくが来るかもしれないから、だれが来ても、けっして戸をあけてはいけないよ」。",
"瓜子姫が「トンカラリ、トンカラリ」とはたをおっていると、戸の外から声がします。「瓜子姫、ちょっとだけ戸をあけておくれ。ゆびが入るだけでいいから」。やさしい瓜子姫が少しだけ戸をあけると、あまのじゃくは「手が入るだけ」「頭が入るだけ」と言って、とうとう家の中に入ってきてしまいました。",
"あまのじゃくは瓜子姫を外へつれ出して柿の木にしばりつけ、瓜子姫の着物を着て、瓜子姫になりすましました。",
"やがて、瓜子姫をおよめさんにむかえるかごがやってきて、「瓜子姫」をのせて出かけます。そのとき、柿の木の上から声がしました。「瓜子姫をのせないで、あまのじゃくがのってった！」。",
"おどろいたおじいさんたちは、かごの中のあまのじゃくの正体をあばき、こらしめて追いはらいました。そして木から瓜子姫をたすけ出し、みんなでよろこびあったということです。"
]},
{ cat:"kowai", title:"姥捨て山", yomi:"うばすてやま", icon:"⛰️", text:[
"むかし、ある国のお殿さまが、とんでもないおふれを出しました。「六十歳になった年よりは、山へすてること」。",
"ある若者も、泣く泣くお母さんをせおって山へ入っていきました。すると、せなかのお母さんが、とちゅうで木の枝をぽきん、ぽきんとおっています。「おっかさん、何をしているんだい？」「おまえが帰り道にまよわないように、しるしをつけているんだよ」。",
"自分がすてられるというのに、息子の心配をするお母さん。若者はなみだがとまらなくなり、お母さんをせおったまま家へつれ帰りました。そして、だれにも見つからないよう、ゆかの下にかくしてくらしました。",
"そのころ、となりの国から、むずかしい問題がとどきます。「灰でなわをつくれ。できなければ、この国をせめる」。だれにもこたえられず、お殿さまはこまりはてました。若者がお母さんに相談すると、「なわを塩水にひたしてから燃やせば、形がくずれずに灰のなわができるよ」。",
"つぎの問題は「曲がりくねった穴のあいた玉に、糸を通せ」。お母さんは言いました。「ありに糸をむすんで、穴の出口にはちみつをぬってごらん」。ありは、はちみつのにおいにさそわれて、みごとに玉に糸を通しました。",
"となりの国は「こんなにかしこい者がいる国にはかなわない」と、せめてくるのをやめました。お殿さまに問われた若者が、お母さんのことを正直に話すと、お殿さまは「年よりの知恵は、たいせつな宝だ」と、おふれをとりやめたということです。"
]},
{ cat:"kowai", title:"羽衣伝説", yomi:"はごろもでんせつ", sub:"天人女房（てんにんにょうぼう）", icon:"👘", text:[
"むかし、ひとりの男が、森の泉のそばを歩いていると、木の枝に、見たこともないほど美しい布がかかっていました。あまりにきれいなので、男は家に持って帰ろうとしました。",
"そこへ、泉で水あびをしていた美しい天女があらわれました。「それはわたしの羽衣（はごろも）です。それがないと、天に帰ることができません。どうか返してください」。",
"けれど男は羽衣をかくしてしまい、帰れなくなった天女は、男のおよめさんになりました。やがて子どももうまれ、家族はなかよくくらしました。それでも天女は、ときどき空を見あげては、さびしそうな顔をしていました。",
"ある日、天女は、子どもがうたう歌から、羽衣が米ぐらのわらの中にかくされていることを知りました。",
"天女は羽衣を見つけ出して身にまといます。そして、美しい天の舞（まい）をまいながら、ふわり、ふわりと空へのぼり、雲の上へと帰っていってしまいました。"
]},
{ cat:"kowai", title:"雪女", yomi:"ゆきおんな", icon:"❄️", text:[
"むかし、北の国の村に、茂作（もさく）というおじいさんと、巳之吉（みのきち）という若いきこりがいました。ある冬の日、ふたりは山で大ふぶきにあい、川の渡し守の小屋ににげこみました。",
"夜中、巳之吉は顔にかかるつめたい雪で目をさましました。見ると、白い着物を着た、雪のように白い女の人が、茂作に白いいきをふきかけています。茂作はそのまま、こおりついて動かなくなってしまいました。",
"女の人は巳之吉に顔をよせて言いました。「おまえも同じようにしようと思ったけれど、まだ若いから、たすけてあげよう。でも、今夜のことをだれかに話したら、そのときは命はないよ」。そう言うと、女の人はすうっと消えていきました。",
"つぎの年の冬、巳之吉は、お雪という美しいむすめと出会い、けっこんしました。子どももたくさん生まれ、ふしぎなことに、お雪は何年たっても若くて美しいままでした。",
"ある夜、ろうそくのあかりでぬいものをするお雪の横顔を見て、巳之吉は思わずあの夜の話をしてしまいます。「むかし、おまえによくにた、雪のように白い女の人を見たことがあるんだよ」。",
"するとお雪は立ちあがって言いました。「それは、わたしです！あれほど話してはいけないと言ったのに。子どもたちがいなければ、あなたの命をもらうところです。子どもたちを、どうかたいせつにそだててください」。お雪のすがたは白いきりのようにとけて、二度ともどってはきませんでした。"
]},
{ cat:"kowai", title:"耳なし芳一", yomi:"みみなしほういち", icon:"🪕", text:[
"むかし、下関（しものせき）の阿弥陀寺（あみだじ）というお寺に、芳一（ほういち）という目の見えない琵琶（びわ）ひきがすんでいました。芳一の琵琶の弾き語りはすばらしく、とくに平家（へいけ）一族がほろんだ「壇ノ浦（だんのうら）の合戦」の場面は、聞く人がみな涙をながすほどでした。",
"ある夏の夜、おしょうさんのるすに、ひとりのお侍が芳一をたずねてきました。「わが殿が、そなたの琵琶を聞きたいとおおせだ。ついてまいれ」。",
"芳一がつれていかれたのは、大きなお屋しきのようなところ。たくさんの人がいるけはいの中で弾き語りをすると、みんながすすり泣きました。それから芳一は、毎晩そこへよばれるようになります。",
"ところが、じつはそこは平家の人たちのお墓の前。芳一は、平家の亡霊（ぼうれい）たちによばれていたのです。このままでは、芳一は命をとられてしまいます。",
"おしょうさんは、芳一の体じゅうに、亡霊からすがたが見えなくなるお経の文字を書きました。「今夜はだれによばれても、けっして返事をしてはいけないよ」。",
"その夜、いつものお侍の亡霊がやってきました。「芳一、芳一」。けれど、お経を書いた芳一のすがたは見えません。ただ、空中にふたつの耳だけがうかんでいます。おしょうさんが、耳にだけお経を書きわすれていたのです。",
"「返事がないなら、せめてこの耳を殿へのしるしに持っていこう」。亡霊は芳一の耳をもぎとって、帰っていきました。芳一は痛みにたえ、声を出さずにがまんしました。",
"それからというもの、亡霊があらわれることはなくなり、芳一は「耳なし芳一」とよばれて、ますます名高い琵琶の名人となったということです。"
]},
{ cat:"kowai", title:"酒呑童子", yomi:"しゅてんどうじ", icon:"🍶", text:[
"むかし、丹波（たんば）の国の大江山（おおえやま）に、酒呑童子という鬼のかしらがすんでいました。酒呑童子はたくさんの鬼の家来をひきつれて、都にあらわれては、お姫さまたちをさらっていきます。",
"都の人たちはふるえあがり、帝（みかど）さまは、つよい武将の源頼光（みなもとのらいこう）に鬼たいじをめいじました。頼光は、藤原保昌（ふじわらのやすまさ）と、坂田金時（そう、あの金太郎！）たち「四天王」とよばれる家来をつれて、大江山へむかいます。",
"山へむかうとちゅう、一行は神さまの化身である老人たちに出会い、「神便鬼毒酒（じんべんきどくしゅ）」というふしぎなお酒をさずかりました。人がのめば力がわき、鬼がのめば力がぬけてしまうお酒です。",
"頼光たちは、山ぶし（山で修行するお坊さん）にへんそうして、鬼の住みかにもぐりこみました。酒呑童子はすっかり気をゆるし、頼光たちがすすめたお酒を、ぐびぐびとのみほしていきます。",
"やがて、鬼たちはみんな、ぐっすりとねむりこんでしまいました。いまだ！頼光たちはかくしていたよろいを身につけ、いっせいに鬼たちにとびかかりました。はげしいたたかいのすえ、頼光は酒呑童子をたいじし、さらわれていたお姫さまたちをたすけ出して、都へ帰ったのでした。"
]},
{ cat:"kowai", title:"座敷童子", yomi:"ざしきわらし", icon:"🧒", text:[
"座敷わらしは、岩手県など東北地方の古いお家にすむといわれる、ふしぎな子どもの神さまです。見た目は五、六歳くらいの子どもで、おかっぱ頭に赤い顔、着物を着ていることが多いそうです。",
"座敷わらしがいる家は、どんどんお金持ちになって、さかえるといわれています。夜中に、だれもいないはずのざしきで、とことこと小さな足音がしたり、ねている人のまくらをひっくりかえしたり。そんないたずらをするのも、座敷わらしのしわざです。",
"岩手県の遠野（とおの）には、こんなお話がつたわっています。ある男が橋のそばで、見なれないふたりの女の子に出会いました。「どこから来たの？」とたずねると、女の子たちは、村いちばんのお金持ちの家の名前を言い、「これから、よその村の家へ行くの」とこたえたのです。",
"男は「あの家も、もうおしまいだな」と思いました。そのとおり、女の子たちが出ていったお金持ちの家は、それからまもなく、すっかりおとろえてしまったということです。",
"座敷わらしは、家にいるあいだは幸せをはこんでくれますが、出ていってしまうと、幸運もいっしょに去っていくのです。だから、座敷わらしのいる家では、いつまでもいてもらえるよう、たいせつにしたといいます。"
]},
{ cat:"kowai", title:"蛇女房", yomi:"へびにょうぼう", icon:"🐍", text:[
"むかし、ある若者が、子どもたちにいじめられていた小さな白いへびをたすけてあげました。",
"しばらくすると、若者の家に美しいむすめがたずねてきて、およめさんになりました。やがて赤ちゃんがうまれることになると、およめさんは言いました。「赤ちゃんをうむあいだは、けっして部屋をのぞかないでくださいね」。",
"けれど若者は心配でたまらず、そっと戸のすきまからのぞいてしまいました。そこには、大きな大きなへびが、とぐろをまいて、生まれたばかりの赤ちゃんをやさしくだいていたのです。",
"すがたを見られたおよめさんは、泣きながら言いました。「わたしは、あのときたすけていただいたへびです。正体を知られたからには、もういっしょにはいられません。この子が泣いたら、これをしゃぶらせてください」。およめさんは、自分の片方の目玉をとり出して若者にわたし、山の池へと帰っていきました。",
"目玉をしゃぶると、赤ちゃんはふしぎと泣きやみ、すくすくそだちます。ところが、そのふしぎな玉のうわさを聞いたお殿さまに、目玉をとりあげられてしまいました。",
"若者が赤ちゃんをだいて池へ行くと、およめさんは、もう片方の目玉もさし出してくれました。「これで、わたしは何も見えなくなります。どうか朝と晩に、お寺のかねをついてください。その音を聞いて、あなたたちがぶじだと知ることができますから」。それから若者は、毎日かかさず、お寺のかねをつきつづけたということです。"
]},

/* ---------- 名作どうわ ---------- */
{ cat:"meisaku", title:"ごんぎつね", yomi:"ごんぎつね", sub:"新美南吉（にいみなんきち）", author:"新美南吉", authorYomi:"にいみなんきち", icon:"🦊", text:[
"むかし、村の近くの山に、「ごん」という、ひとりぼっちの小ぎつねがすんでいました。ごんはいたずらが大すきで、村の畑をあらしたりして、いつも村の人たちをこまらせていました。",
"ある秋の日、ごんは川で、兵十（ひょうじゅう）という男の人が魚をとっているのを見つけます。兵十がはなれたすきに、ごんはいたずらで、びくの中の魚やうなぎを川へにがしてしまいました。",
"十日ほどたって、ごんは兵十の家で、おそうしきがあるのを見かけます。なくなったのは兵十のお母さんでした。ごんは思いました。「あのうなぎは、病気のお母さんに食べさせるためのものだったんだ。それなのに、ぼくがいたずらをしたから……」。",
"兵十も、ひとりぼっちになってしまいました。ごんはつぐないのために、毎日くりやまつたけをひろってきては、兵十の家にこっそりとどけるようになりました。",
"けれど兵十は、だれがとどけてくれているのかわかりません。「それは神さまのしわざだよ」と友だちに言われているのを聞いて、ごんは少しさびしく思います。",
"ある日、兵十は、家にこっそり入ってきたごんを見つけました。「あのいたずらぎつねめ、またわるさをしに来たな」。兵十は火縄銃（ひなわじゅう）で、ごんをうってしまいました。",
"かけよった兵十が土間を見ると、くりがかためておいてありました。「ごん、おまえだったのか。いつもくりをくれたのは」。ごんはぐったりと目をつぶったまま、うなずきました。兵十の手から火縄銃がばたりとおち、つつ口からは、青いけむりが、まだほそく出ていました。"
]},
{ cat:"meisaku", title:"てぶくろを買いに", yomi:"てぶくろをかいに", sub:"新美南吉（にいみなんきち）", author:"新美南吉", authorYomi:"にいみなんきち", icon:"🧤", text:[
"寒い冬、きつねの親子のすむ森にも雪がやってきました。はじめて雪を見た子ぎつねは、大はしゃぎで雪の中をかけまわります。けれど、ほら穴にもどってくると、「お母ちゃん、おててがつめたい」と、赤くなった手をさし出しました。",
"「かわいそうに。夜になったら町へ行って、ぼうやのおててにあうような毛糸の手ぶくろを買ってあげようね」。",
"夜、お母さんぎつねは子ぎつねをつれて町のそばまで来ましたが、むかし人間にこわい目にあわされたことを思い出し、足がすくんで動けなくなってしまいます。そこでお母さんぎつねは、子ぎつねの片方の手を、人間の子どもの手にかえてやりました。",
"「いいかい、町に行ったら、ぼうし屋さんをさがして、戸をすこしだけあけて、こっちの人間の手を出すんだよ。けっして、もうひとつの手を出してはいけないよ」。そう言って、お金をにぎらせました。",
"子ぎつねは、ぼうし屋さんを見つけて、トントンと戸をたたきました。ところが、戸のすきまからさしこんだまぶしい光にびっくりして、まちがえて、きつねの手のほうを出してしまったのです。",
"ぼうし屋さんは「おやおや、きつねの手だ」と気づきました。でも、わたされたお金が本物だとたしかめると、だまって、子ども用の毛糸の手ぶくろを子ぎつねの手にもたせてくれました。",
"帰り道、子ぎつねは、まどから聞こえる人間のお母さんのやさしい子守歌を聞きました。お母さんぎつねのところへかけもどると、子ぎつねは言いました。「お母ちゃん、人間って、ちっともこわくないや」。お母さんぎつねは「ほんとうに人間はいいものかしら」と、そっとつぶやいたのでした。"
]},
{ cat:"meisaku", title:"注文の多い料理店", yomi:"ちゅうもんのおおいりょうりてん", sub:"宮沢賢治（みやざわけんじ）", author:"宮沢賢治", authorYomi:"みやざわけんじ", icon:"🍽️", text:[
"ぴかぴかの鉄砲をかついだ、ふたりのわかい紳士が、山おくへかりにやってきました。ところが、えものは一ぴきも見つからず、つれてきた二ひきの大きな犬もたおれてしまいます。霧（きり）の中で道にまよい、おなかはぺこぺこ。",
"そのとき、うしろに一けんのりっぱな西洋料理店があらわれました。看板には「山猫軒（やまねこけん）」。入口には「どなたもどうかお入りください。けっしてごえんりょはありません」と書いてあります。ふたりは大よろこびで中へ入りました。",
"中には、いくつも扉がならんでいて、そのたびに注文が書いてあります。「かみをきちんとして、はきもののどろをおとしてください」「鉄砲とたまをここへおいてください」「ぼうしと外とう、くつをおとりください」。",
"「ずいぶん注文の多い店だなあ」「きっと、えらい人がたくさん来るんだよ」。ふたりは言われるとおりにしていきます。「クリームを顔や手足にすっかりぬってください」「からだじゅうに、つぼの中の塩をたくさんもみこんでください」。",
"そこで、ふたりははっと気がつきました。「これは……ぼくたちが料理を食べるんじゃない。ぼくたちが料理されて、食べられるんだ！」。さいごの扉のかぎあなからは、青い目玉がふたつ、きょろきょろとこちらをのぞいています。",
"ふたりはがたがたふるえて泣き出しました。そのとき、「ワン！」と、あの犬たちがとびこんできて、扉のむこうへとびかかりました。そのとたん、料理店はけむりのように消え、ふたりは草の中に立っていました。",
"ふたりはぶじに東京へ帰りましたが、こわさのあまりくしゃくしゃになった顔は、お湯に入っても、もう元にはもどりませんでした。"
]},
{ cat:"meisaku", title:"銀河鉄道の夜", yomi:"ぎんがてつどうのよる", sub:"宮沢賢治（みやざわけんじ）", author:"宮沢賢治", authorYomi:"みやざわけんじ", icon:"🚂", text:[
"ジョバンニは、病気のお母さんのために、学校のあとも活版所（かっぱんじょ）ではたらく、まずしい少年です。遠くへ出かけたお父さんは帰ってこず、学校ではからかわれることも多く、いつもさびしい思いをしていました。ただ、同じクラスのカムパネルラだけは、ジョバンニにやさしくしてくれます。",
"星まつりの夜、みんなの輪に入れなかったジョバンニは、ひとり丘の上にねころんで、星空を見あげていました。すると、どこからか「銀河ステーション、銀河ステーション」という声がして、気がつくと、夜空を走る小さな汽車にのっていました。",
"前の席には、なんとカムパネルラがすわっています。ふたりをのせた銀河鉄道は、天の川にそって、白鳥の停車場や、りんどうの花のさく野原、光りかがやく十字架のそばを走っていきます。とちゅうでは、鳥をとる人や、しずんだ船にのっていたという姉弟と青年など、ふしぎな人たちがのりおりしていきました。",
"ふたりは語りあいます。「みんなのほんとうのさいわいのためなら、ぼくはどこまでもいっしょに行くよ」「うん、ぼくだってそうだ」。",
"ところが、ジョバンニがふとふりかえると、カムパネルラのすがたが消えていました。ジョバンニは大声で泣きさけび……気がつくと、もとの丘の上でねむっていたのでした。",
"丘をおりたジョバンニは、川のほうがさわがしいのに気がつきます。カムパネルラが、川におちた友だちのザネリをたすけようとして、流されてしまったというのです。",
"ジョバンニは、胸がいっぱいになりながら、お母さんのもとへと走っていきました。"
]},
{ cat:"meisaku", title:"泣いた赤おに", yomi:"ないたあかおに", sub:"浜田広介（はまだひろすけ）", author:"浜田広介", authorYomi:"はまだひろすけ", icon:"👹", text:[
"ある山に、心のやさしい赤おにがすんでいました。赤おには、人間となかよくなりたくてたまりません。家の前に「だれでもあそびに来てください。おいしいお茶とおかしを用意しています」という立てふだを出しました。",
"けれど村の人たちは「おにの言うことなんて、信じられない」とこわがって、だれも近よってくれません。赤おにはがっかりして、立てふだをこわしてしまいました。",
"そこへ、なかよしの青おにがやってきました。わけを聞いた青おには、こんな作戦を考えます。「ぼくが村で大あばれをするから、きみがぼくをこらしめるんだ。そうすれば、人間たちは、きみがやさしいおにだとわかってくれるよ」。",
"赤おには、青おにに悪いと思いましたが、作戦は実行されました。村であばれる青おにを、赤おにがぽかぽかとこらしめると、青おには山へにげていきました。",
"作戦は大成功。村の人たちは赤おにの家へあそびにくるようになり、赤おには毎日たのしくすごしました。",
"けれど、しばらくして赤おには気がつきます。あの日から、青おにがいちども顔を見せていないのです。心配になって青おにの家をたずねると、戸はしまっていて、一まいのはり紙がありました。",
"そこには、こんなことが書かれていました。自分となかよくしているところを見られたら、赤おにまで悪いおにだと思われてしまう。だから遠くへ旅に出る。どこへ行っても、きみのことはわすれない、と。",
"赤おには、そのはり紙をなんどもなんども読みかえし、いつまでも泣いていました。"
]},
{ cat:"meisaku", title:"蜘蛛の糸", yomi:"くものいと", sub:"芥川龍之介（あくたがわりゅうのすけ）", author:"芥川龍之介", authorYomi:"あくたがわりゅうのすけ", icon:"🕸️", text:[
"ある日の朝、お釈迦（しゃか）さまは、極楽（ごくらく）の蓮池（はすいけ）のふちを、ひとりでぶらぶらと歩いていらっしゃいました。池の蓮の葉のあいだから、はるか下をのぞくと、そこは地獄のそこ。たくさんの罪人たちが、血の池でもがきくるしんでいます。",
"その中に、カンダタという大どろぼうの男がいました。カンダタは、わるいことばかりしてきた男です。けれど、たったひとつだけ、よいことをしたことがありました。森の中で小さなくもをふみつぶそうとして、「いや、これも小さな命だ」と思いなおし、たすけてやったことがあったのです。",
"お釈迦さまはそのことを思い出し、極楽のくもの銀色の糸を一本、地獄のそこへとおろしてあげました。",
"カンダタはくもの糸に気づくと、大よろこびでよじのぼりはじめました。けれど地獄から極楽までは、とても遠い道のり。ひと休みして下を見ると、なんと、ほかの罪人たちが、ありの行列のように、ぞろぞろと糸をのぼってくるではありませんか。",
"「こら、罪人ども。このくもの糸はおれのものだぞ。下りろ、下りろ！」。",
"カンダタがそうさけんだとたん、糸はカンダタのぶら下がっているところから、ぷつりと切れてしまいました。カンダタはくるくるとまわりながら、またまっくらな地獄のそこへおちていきました。",
"お釈迦さまは、そのようすを悲しそうなお顔でごらんになると、また、ぶらぶらと歩いていかれました。極楽の蓮の花は、なにごともなかったように、いいかおりをただよわせていました。"
]},
{ cat:"meisaku", title:"モチモチの木", yomi:"もちもちのき", sub:"斎藤隆介 作・滝平二郎 絵", author:"斎藤隆介", authorYomi:"さいとうりゅうすけ", icon:"🌳", text:[
"とうげのりょうし小屋に、豆太（まめた）という五歳の男の子が、じさま（おじいさん）とふたりでくらしていました。豆太はとってもおくびょう。夜になると、家の前に立つ大きなトチの木がおばけのように見えて、ひとりではおしっこにも行けません。夜中には、いつもじさまを起こして、ついてきてもらうのでした。",
"豆太はその木を「モチモチの木」とよんでいました。秋になると、トチの実でじさまがおいしいおもちをつくってくれるからです。昼間は木にむかっていばってみせるのに、夜はこわくてたまらないのです。",
"ある日、じさまが教えてくれました。「冬の、ある決まった晩の真夜中に、モチモチの木に灯がともる。けれど、それを見られるのは、勇気のある子どもだけなんだ」。豆太は「おらには、とても見られっこない」と、あきらめてしまいます。",
"その真夜中。豆太が目をさますと、じさまがおなかをおさえて、くるしそうにうなっていました。「じさまっ！」。",
"「お医者さまをよばなくっちゃ」。豆太は、ねまきのまま、はだしで外へとび出しました。霜（しも）がつめたくて、足がいたくて、こわくてたまりません。それでも豆太は、泣きながら、まっくらな山道をふもとの村までかけおりていきました。",
"お医者さまをつれて小屋へもどるとき、豆太は見ました。モチモチの木に、ぽうっと灯がともっているのを。",
"元気になったじさまは、「やさしい心があれば、いざというとき、ちゃんと勇気が出せるものなんだよ」と、豆太をほめてくれました。……でも豆太は、じさまが元気になると、また夜中に「じさまぁ」と起こすのでした。"
]},
{ cat:"meisaku", title:"花さき山", yomi:"はなさきやま", sub:"斎藤隆介 作・滝平二郎 絵", author:"斎藤隆介", authorYomi:"さいとうりゅうすけ", icon:"🌺", text:[
"山菜をとりに山へ入った女の子・あやは、いつのまにか、見たこともない場所に出ていました。そこは、見わたすかぎり一面に、色とりどりの花がさきみだれる山でした。",
"ふりかえると、そこには山んばが立っていました。あやはびくりとしますが、山んばはやさしく話しかけてきます。「ここの花はな、ふもとの村の人間が、やさしいことをひとつすると、ひとつさくんだよ」。",
"山んばは、あやの足もとの、赤い小さな花を指さしました。「この花は、おまえがきのうさかせた花だよ」。",
"きのう、あやの家では、お祭りの着物を買ってほしいと、妹のそよが泣いてお母さんをこまらせていました。家はまずしく、ふたりぶんの着物を買うことはできません。そのとき、あやは「おらはいらないから、そよに買ってやって」と言ったのです。ほんとうは、あやもほしくてたまらなかったのに。",
"「自分のことより人のことを思って、なみだをこらえてがまんする。そのやさしさが、この花をさかせるんだ。あの花もこの花も、みんなだれかがさかせた花なんだよ」。",
"村に帰ったあやは、みんなにその話をしましたが、だれも信じてくれませんでした。それでもあやは、だれかにやさしくできたとき、「いま、花さき山で、わたしの花がひとつさいたかな」と思うのでした。"
]},

{ cat:"grimm", title:"白雪姫", yomi:"しらゆきひめ", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🍎", text:[
"むかし、ある国に、雪のように白いはだと、赤いほっぺ、黒いかみの、かわいいお姫さまが生まれました。お姫さまは「白雪姫」と名づけられました。",
"やがてお母さんがなくなり、新しいおきさきがやってきました。おきさきは、なんでも答えるふしぎな鏡を持っていて、毎日たずねます。「鏡よ、鏡、この国でいちばん美しいのはだあれ？」。ある日、鏡はこたえました。「それは、白雪姫です」。",
"おこったおきさきは、かりゅうどに、白雪姫を森のおくでころしてくるよう命じます。けれど、かりゅうどはかわいそうになって、白雪姫をにがしてあげました。",
"森のおくへにげた白雪姫は、小さな家を見つけます。そこは七人の小人の家でした。白雪姫は小人たちのために家の仕事をして、なかよくくらしはじめました。",
"ところが、鏡から白雪姫が生きていると聞いたおきさきは、物売りのおばあさんにばけて、なんども白雪姫をねらいます。そしてさいごに、毒のりんごを食べさせてしまいました。白雪姫はたおれて、動かなくなってしまいます。",
"悲しんだ小人たちは、白雪姫をガラスのひつぎに入れて、ずっと見まもっていました。そこへ通りかかった王子さまが、白雪姫をひと目見て、「どうか、このひつぎをわたしにゆずってください」とたのみます。家来たちがひつぎを運んでいると、つまずいたひょうしに、のどにつかえていたりんごのかけらがぽろりととび出し、白雪姫は目をさましました。",
"白雪姫と王子さまはけっこんし、しあわせにくらしました。わるいおきさきは、きびしい罰を受けたということです。"
]},
{ cat:"grimm", title:"ヘンゼルとグレーテル", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🍬", text:[
"むかし、森のそばに、まずしい木こりの一家がくらしていました。子どもは、兄のヘンゼルと、妹のグレーテル。ある年、国じゅうが食べものにこまるききんになり、まま母は「子どもたちを森においてこよう」と言い出しました。",
"それを聞いたヘンゼルは、夜のうちに白い小石をポケットいっぱいにひろっておき、森へつれていかれるとちゅうで、ぽとん、ぽとんとおとしていきました。月の光で小石がきらきら光り、ふたりはぶじに家へ帰ることができました。",
"けれど二度目は、小石をひろえませんでした。ヘンゼルはかわりにパンくずをおとしていきましたが、小鳥たちにみんな食べられてしまい、ふたりは森で道にまよってしまいます。",
"おなかをすかせて歩きまわっていると、森のおくに、パンとケーキでできた、まどは砂糖でできたお菓子の家がありました。むちゅうで食べていると、中からおばあさんが出てきて、「さあ、お入り」とやさしくまねき入れてくれました。",
"ところが、おばあさんは子どもを食べてしまうおそろしい魔女でした。魔女はヘンゼルをおりにとじこめて、ごちそうを食べさせて太らせ、グレーテルには家の仕事をさせました。",
"ある日、魔女はグレーテルに「かまどの中に入って、火かげんを見ておいで」と言いました。グレーテルが「どうやって入るのかわからないわ」とこたえると、「ばかだね、こうやるのさ」と、魔女は自分でかまどに頭を入れました。そのとたん、グレーテルはえいっと魔女をつきとばし、とびらをしめてしまいました。",
"ヘンゼルをおりから出したグレーテルは、魔女の家にあった宝石を持ち、白いアヒルに川をわたしてもらって、お父さんの待つ家へ帰りました。いじわるなまま母はもういなくなっていて、三人はいつまでもしあわせにくらしました。"
]},
{ cat:"grimm", title:"赤ずきん", yomi:"あかずきん", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🧺", text:[
"むかし、赤いずきんがよくにあうので「赤ずきん」とよばれている、かわいい女の子がいました。",
"ある日、お母さんが言いました。「森のおばあさんが病気なの。このお菓子とぶどう酒をとどけてあげて。道草をしてはいけませんよ」。",
"森の道を歩いていると、おおかみがやってきて話しかけてきました。「赤ずきんちゃん、どこへ行くの？」「おばあさんのおうちよ」。おおかみは「まわりにきれいな花がさいているよ。おばあさんにつんでいってあげたら？」とすすめます。赤ずきんが花つみにむちゅうになっているあいだに、おおかみはひとあし先におばあさんの家へ行き、おばあさんをぺろりとのみこんでしまいました。",
"そしておばあさんのふりをして、ベッドの中で待っていたのです。家に着いた赤ずきんは、ふしぎに思います。「おばあさん、なんて大きなお耳なの？」「おまえの声がよく聞こえるようにさ」「なんて大きなお目めなの？」「おまえがよく見えるようにさ」「なんて大きなお口なの？」「おまえを食べるためさ！」。おおかみは赤ずきんものみこんでしまいました。",
"おなかいっぱいになったおおかみが大きないびきをかいてねていると、通りかかったかりゅうどが「おばあさんのいびきにしては、へんだぞ」と家に入ってきました。かりゅうどがおおかみのおなかをはさみで切ると、中から赤ずきんとおばあさんが、元気にとび出してきました。",
"三人は、おおかみのおなかに石をつめこみました。目をさましたおおかみはにげようとしましたが、石が重くて、ばったりたおれて、それっきりでした。赤ずきんは「もう、道草はしないわ」と心にきめたのでした。"
]},
{ cat:"grimm", title:"ブレーメンの音楽隊", yomi:"ブレーメンのおんがくたい", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🐓", text:[
"むかし、年をとって、もう重い荷物を運べなくなったろばがいました。「このままでは、ご主人にすてられてしまう」。ろばは町の音楽隊に入ろうと、ブレーメンの町をめざして出発しました。",
"とちゅうで、年をとって狩りができなくなった犬、ねずみをとれなくなったねこ、あしたのスープにされそうなおんどりに出会います。「いっしょにブレーメンへ行って、音楽隊に入ろうよ」。こうして四ひきは、なかよく旅をつづけました。",
"夜になり、森の中で明かりのついた一けんの家を見つけました。まどからのぞくと、どろぼうたちが、テーブルいっぱいのごちそうをかこんでいます。",
"四ひきは作戦を立てました。ろばのせなかに犬がのり、犬の上にねこ、ねこの上におんどり。そして一せいに「ヒヒーン！」「ワン！」「ニャーオ！」「コケコッコー！」とさけびながら、まどからとびこみました。どろぼうたちは「おばけだ！」と、森へにげていきました。",
"真夜中、どろぼうのひとりが、ようすを見にもどってきました。すると、くらやみでねこにひっかかれ、犬にかまれ、ろばにけとばされ、おんどりに「コケコッコー！」とさけばれて、「あの家には、おそろしいかいぶつがいる！」と、にげかえりました。",
"それからどろぼうたちは二度ともどってこず、四ひきはその家がすっかり気にいって、ブレーメンには行かずに、いつまでもなかよくくらしました。"
]},
{ cat:"grimm", title:"ラプンツェル", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🗼", text:[
"むかし、赤ちゃんが生まれるのを楽しみにしている夫婦がいました。おくさんは、となりの魔女の畑にはえている「ラプンツェル」という野菜が、どうしても食べたくなってしまいます。夫がこっそりとりに行くと、魔女に見つかってしまいました。",
"魔女は言いました。「ゆるしてやるかわりに、生まれてくる子どもをよこしなさい」。こうして生まれた女の子は魔女につれていかれ、「ラプンツェル」と名づけられました。",
"ラプンツェルが十二歳になると、魔女は彼女を、入口もかいだんもない、森の高い塔にとじこめました。魔女は塔の下から「ラプンツェル、ラプンツェル、おまえのかみをたらしておくれ」とよびかけ、長い長い金色のかみの毛をつたって、上へのぼっていくのでした。",
"ある日、塔の近くを通りかかった王子さまが、ラプンツェルの美しい歌声を聞き、魔女がかみをのぼるようすを見ていました。王子さまも同じようにかみをのぼって会いにいき、ふたりはなかよくなりました。",
"けれど、魔女にそれを知られてしまいます。魔女はラプンツェルのかみをばっさり切って、遠いあれ野へ追い出してしまいました。そして、会いにきた王子さまはおどろいて塔からおち、いばらのとげで、目が見えなくなってしまいました。",
"王子さまは、目の見えないまま何年も森をさまよいました。ある日、なつかしい歌声が聞こえてきます。ラプンツェルです！ラプンツェルが王子さまをだきしめて泣くと、そのなみだが王子さまの目にこぼれおち、王子さまの目はふたたび見えるようになりました。ふたりは王子さまの国へ帰り、しあわせにくらしました。"
]},
{ cat:"grimm", title:"狼と七匹の子山羊", yomi:"おおかみとななひきのこやぎ", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🐐", text:[
"むかし、お母さんやぎと、七ひきの子やぎがくらしていました。ある日、お母さんは森へ出かけるときに言いました。「おおかみに気をつけてね。おおかみは、がらがら声で、足が黒いから、すぐにわかりますよ」。",
"しばらくすると、戸をたたく音。「お母さんですよ、あけておくれ」。でも、がらがら声です。「お母さんの声は、もっときれいだよ。おまえはおおかみだ！」。",
"おおかみはチョークを食べて声をきれいにし、もういちどやってきました。でも、まどから黒い足が見えています。「お母さんの足は白いよ。おまえはおおかみだ！」。おおかみは粉屋で足に小麦粉をぬって白くし、またやってきました。こんどは声もきれいで、足も白い。子やぎたちが戸をあけると、とびこんできたのはおおかみでした！",
"子やぎたちは、あわててかくれましたが、つぎつぎに見つかって、おおかみにのみこまれてしまいました。ただ、大時計の中にかくれたいちばん小さな子やぎだけは、見つかりませんでした。",
"帰ってきたお母さんは、すえっ子から話を聞くと、いっしょに外へさがしに出ました。すると、木の下でおおかみが、おなかをふくらませていびきをかいています。お母さんがはさみでおなかを切ると、六ぴきの子やぎがつぎつぎにとび出してきました。丸のみにされていたので、みんなぶじだったのです。",
"お母さんと子やぎたちは、おおかみのおなかに石をつめて、ぬいあわせました。目をさましたおおかみは、のどがかわいて井戸へ水をのみに行きましたが、石が重くて、井戸の中へどぼん！もう二度と出てはこられませんでした。子やぎたちは、お母さんといっしょに大よろこびしました。"
]},
{ cat:"grimm", title:"カエルの王さま", yomi:"かえるのおうさま", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🐸", text:[
"むかし、ある国に、とても美しいお姫さまがいました。お姫さまのお気に入りは、金のまり。ある日、森の泉のそばでまりあそびをしていると、手がすべって、まりが泉の中へぽちゃんとおちてしまいました。",
"お姫さまが泣いていると、一ぴきのかえるが顔を出しました。「わたしをお友だちにして、いっしょにごはんを食べ、いっしょのベッドでねさせてくれるなら、まりをとってきてあげましょう」。お姫さまは「ええ、やくそくするわ」とこたえました。",
"かえるがまりをひろってくると、お姫さまはまりをうけとり、かえるをおいて、さっさとお城へ走って帰ってしまいました。",
"つぎの日、お城で食事をしていると、ぴちゃぴちゃと足音がして、あのかえるがやってきました。「お姫さま、やくそくをまもってください」。王さまはお姫さまに言いました。「やくそくしたことは、まもらなければいけないよ」。",
"お姫さまはしかたなく、かえるといっしょにごはんを食べました。でも夜になって、かえるが「ベッドにいれてください」と言うと、お姫さまはとうとうがまんできなくなり、かえるをつかんで、かべにむかってなげつけてしまいました。",
"するとそのとたん、かえるは、やさしい目をしたりっぱな王子さまにかわったのです。王子さまは、わるい魔女の魔法でかえるにされていたのでした。ふたりはやがてけっこんし、王子さまの国でしあわせにくらしました。"
]},
{ cat:"grimm", title:"灰かぶり", yomi:"はいかぶり", sub:"シンデレラ（グリム版）", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🕊️", text:[
"むかし、お金持ちの家に、心のやさしい女の子がいました。お母さんはなくなるとき、「いつもやさしい子でいてね。わたしは天から見まもっていますよ」と言いのこしました。女の子は毎日、お母さんのお墓の前で泣きました。",
"やがて、お父さんは新しいおくさんをもらいました。まま母には、ふたりのむすめがいました。女の子は美しい服をとりあげられ、朝から晩まではたらかされ、夜はかまどの灰のそばでねかされたので、「灰かぶり」とよばれるようになりました。",
"灰かぶりは、お父さんからもらったハシバミの小枝をお母さんのお墓にうえ、毎日なみだで水をやりました。枝はりっぱな木にそだち、そこにやってくる白い小鳥が、灰かぶりのねがいをかなえてくれるようになりました。",
"ある日、お城で三日間のぶとう会がひらかれることになりました。灰かぶりも行きたいとたのみますが、まま母は「灰の中にまいた豆をひろいおえたらね」といじわるをします。灰かぶりが小鳥たちをよぶと、ハトたちがあっというまに豆をひろってくれました。それでも、まま母はつれていってくれません。",
"灰かぶりがハシバミの木の下で「木よ、ゆれて、わたしに金と銀をなげて」とたのむと、小鳥が美しいドレスとくつをおとしてくれました。ぶとう会で、王子さまは灰かぶりとばかりおどりました。三日目の夜、王子さまはかいだんにねばねばしたものをぬっておき、にげる灰かぶりの金のくつが、かたほうだけのこりました。",
"王子さまは「このくつがぴったりあう人を花よめにする」と言いました。姉たちはむりやり足をくつにおしこみましたが、ハトたちが「くつに血がついているよ。ほんとうの花よめは、まだ家にいる」と教えます。さいごに灰かぶりがくつをはくと、ぴったり！王子さまは、ぶとう会でおどったあの人だと気づきました。",
"灰かぶりは王子さまとけっこんしました。いじわるだった姉たちは、ハトたちにきびしくこらしめられたということです。"
]},
{ cat:"grimm", title:"いばら姫", yomi:"いばらひめ", sub:"眠れる森の美女（グリム版）", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🌿", text:[
"むかし、ある国の王さまとおきさきに、かわいいお姫さまが生まれました。お祝いの会には、国の十二人のうらない女（魔法をつかう女の人）がまねかれ、ひとりずつ、お姫さまにすてきなおくりものをしていきました。",
"ところが、十一人目がおくりものをしたところで、まねかれなかった十三人目のうらない女がやってきて、さけびました。「お姫さまは十五歳になったら、糸をつむぐ道具の『つむ』にさされて死ぬのだ！」。",
"まだおくりものをしていなかった十二人目のうらない女は、のろいを消すことはできませんでしたが、こうやわらげました。「お姫さまは死ぬのではなく、百年のあいだ、ふかいねむりにつくのです」。王さまは、国じゅうのつむをもやしてしまいました。",
"お姫さまが十五歳になった日。お城の古い塔をのぼっていくと、小さな部屋で、おばあさんが糸をつむいでいました。「それは何？」。お姫さまがつむにさわったとたん、指にちくりとささり、お姫さまはベッドにたおれてねむってしまいました。",
"すると、王さまもおきさきも、家来たちも、馬も犬も、かまどの火までも、お城じゅうがねむりにつきました。お城のまわりにはいばらがどんどんのびて、すっかりかくれてしまいました。",
"それから百年。ひとりの王子さまが、いばらのお城の話を聞いてやってきました。ちょうど百年がすぎた日だったので、いばらは美しい花になって、王子さまに道をあけてくれました。塔の部屋でねむるお姫さまに王子さまがくちづけをすると、お姫さまはぱちりと目をさまし、お城じゅうのみんなも目をさましました。",
"ふたりの結婚式は、それはそれはにぎやかにおこなわれ、ふたりはしあわせにくらしました。"
]},
{ cat:"grimm", title:"ルンペルシュティルツヒェン", spine:"ルンペル|シュティルツヒェン", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🧵", text:[
"むかし、まずしい粉屋が、王さまに見えをはって、「わたしのむすめは、わらをつむいで金にすることができます」と言ってしまいました。",
"王さまはむすめをお城によび、わらでいっぱいの部屋にとじこめました。「あしたの朝までに、このわらを金にしなさい」。むすめは、そんなことはできないので、泣き出してしまいました。",
"すると、小さな小人があらわれました。「なにをくれる？そうしたら、かわりに金にしてやろう」。むすめが首かざりをわたすと、小人は糸車をくるくるまわし、わらをすっかり金の糸にしてしまいました。つぎの日も、むすめは指輪をわたして、たすけてもらいました。",
"三日目、もっと大きな部屋にとじこめられたむすめには、もうわたすものがありません。「それなら、おまえがおきさきになったら、さいしょの子どもをよこすとやくそくしろ」。むすめはしかたなくやくそくし、わらは金になり、むすめは王さまのおきさきになりました。",
"一年後、かわいい赤ちゃんが生まれると、あの小人がやってきました。おきさきが泣いてたのむと、小人は言いました。「三日のうちに、わたしの名前をあてられたら、子どもはあきらめてやろう」。",
"おきさきは、国じゅうに使いを出して名前をさがさせました。すると、使いのひとりが山おくで、たき火のまわりをとびはねながら歌う小人を見つけます。「おれの名前はルンペルシュティルツヒェン、だれにもわかるもんか！」。",
"三日目、おきさきは小人に言いました。「あなたの名前は、ルンペルシュティルツヒェンね！」。「だれが教えた！」。小人はかんかんにおこってじだんだをふみ、そのまま地面にめりこんで、二度とあらわれませんでした。"
]},
{ cat:"grimm", title:"ハーメルンの笛吹き男", yomi:"ハーメルンのふえふきおとこ", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🎶", text:[
"むかし、ドイツのハーメルンという町で、ねずみがものすごくふえて、町の人たちはこまりはてていました。ねずみたちは、食べものをかじり、服をかじり、町じゅうをかけまわっていました。",
"そこへ、色とりどりのふしぎな服を着た男があらわれました。「お金をくれるなら、ねずみをのこらず追いはらってみせましょう」。町の人たちは「もちろん、たくさんはらうよ」とやくそくしました。",
"男が笛をふきはじめると、町じゅうの家からねずみがぞろぞろ出てきて、男のあとについていきます。男が川にはいっていくと、ねずみたちもつぎつぎに川にとびこみ、ながされていきました。",
"ところが、ねずみがいなくなると、町の人たちはお金がおしくなって、「そんなにはらえない」と、やくそくのお金をはらおうとしませんでした。男はおこって、町を出ていきました。",
"しばらくたったある朝、男がまた町にやってきて、さっきとはちがう、ふしぎなメロディーを笛でふきはじめました。すると、こんどは町じゅうの子どもたちが家からとび出してきて、男のあとについていったのです。",
"男と子どもたちは町の外の山へむかい、山の中へ消えていきました。そして、二度と帰ってはきませんでした。やくそくをやぶったことを、町の人たちはいつまでもくやんだということです。"
]},
{ cat:"grimm", title:"星の銀貨", yomi:"ほしのぎんか", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"⭐", text:[
"むかし、お父さんもお母さんもいない、ひとりぼっちの女の子がいました。住む家もなく、持っているのは、着ている服と、手にもった一切れのパンだけ。それでも女の子は、いつも心やさしく、神さまを信じていました。",
"女の子が野原を歩いていると、まずしい男の人が言いました。「おなかがすいてたまらないんだ。なにか食べものをおくれ」。女の子は、たったひとつのパンを、そのままあげました。",
"つぎに、「頭がさむいよ」と泣く子どもに、自分のぼうしをあげました。またつぎの子には上着を、そのつぎの子にはスカートをあげました。",
"すっかり暗くなった森で、また別の子どもが、さむさにふるえていました。女の子は「もう暗いから、だれにも見えないわ」と思い、さいごにのこった下着まであげてしまいました。",
"もう何ひとつ持っていない女の子が、夜空を見あげていると……。空から星がつぎつぎにおちてきて、ぴかぴか光るお金になって、女の子のまわりにふりそそぎました。そして、気がつくと女の子は、上等な新しい服を着ていたのです。",
"女の子はお金をひろいあつめて、それから一生、こまることなくしあわせにくらしました。"
]},
{ cat:"grimm", title:"がちょう番の娘", yomi:"がちょうばんのむすめ", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🐴", text:[
"むかし、ある国のお姫さまが、遠い国の王子さまのおよめさんになるため、旅に出ることになりました。お供は、ひとりの侍女（じじょ）と、人間の言葉を話せる馬のファラダです。",
"ところが旅のとちゅう、わるい侍女は、お姫さまをおどして服をとりかえさせ、馬もとりかえてしまいました。「このことをだれかに話したら、ただではすまないよ」。こうして、侍女がお姫さまのふりをして、王子さまのお城に着いたのです。",
"にせもののお姫さまは、ほんもののお姫さまを、がちょうの番をする仕事にまわしてしまいました。そして、ほんとうのことを話せるファラダがじゃまになり、ファラダを殺させてしまいます。ほんもののお姫さまは、せめてファラダの首を、毎日通る町の門にかけてもらうようたのみました。",
"毎朝、がちょうをつれて門をくぐるとき、お姫さまは「ああ、ファラダ、そこにいるのね」と話しかけます。するとファラダの首はこたえました。「ああ、お姫さま、あなたのお母さまが知ったら、どんなに悲しむことでしょう」。",
"そのふしぎな話を聞いた年よりの王さまは、がちょう番のむすめをよんで、わけをたずねました。けれど、むすめは「だれにも話さないと、やくそくさせられたのです」と言います。そこで王さまは「それなら、この鉄のストーブに話してごらん」と言って、部屋を出ていきました。",
"むすめはストーブにむかって、泣きながらすべてを話しました。王さまは、それをえんとつごしに聞いていたのです。ほんとうのことを知った王さまは、にせもののお姫さまをきびしくばっし、ほんもののお姫さまは王子さまとけっこんして、しあわせにくらしました。"
]},
{ cat:"grimm", title:"金の鳥", yomi:"きんのとり", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🦜", text:[
"むかし、ある王さまの庭に、金のりんごがなる木がありました。ところが毎晩、りんごがひとつずつなくなってしまいます。見はりをしていたすえの王子が見たのは、金の羽をかがやかせてとんでくる「金の鳥」でした。",
"王さまは金の鳥がほしくなり、三人の王子を、つぎつぎに旅に出しました。とちゅうで、一ぴきのきつねが「あの明るくにぎやかな宿にはとまらず、さびしい宿にとまりなさい」と教えてくれます。兄たちはきつねの言うことを聞かず、にぎやかな宿で遊んでばかりで、家に帰ってきませんでした。",
"すえの王子は、きつねの言うとおりにしました。きつねは王子をしっぽにのせて、金の鳥のいるお城へつれていってくれました。ところが王子は、きつねの注意をわすれて、金の鳥を美しい金のかごに入れようとしたため、つかまってしまいます。",
"そのお城の王さまは言いました。「ゆるしてほしければ、金の馬をとってこい」。金の馬のお城でも、王子はまた注意をわすれてつかまり、「黄金のお城の美しいお姫さまをつれてこい」と言われます。それでも、きつねはそのたびに知恵をかして、王子をたすけてくれました。",
"こうして王子は、お姫さまと金の馬と金の鳥をつれて、帰り道につきました。ところが、町で兄たちに出会い、王子は兄たちに井戸へつきおとされ、宝ものをぜんぶうばわれてしまいます。",
"井戸の底にいる王子を、またきつねがたすけ出してくれました。お城に帰った王子を見て、悲しそうだったお姫さまはにっこり。兄たちのわるだくみはあばかれ、王子はお姫さまとけっこんしました。そして、きつねのねがいで魔法がとけると、きつねは人間のすがたにもどりました。じつは、お姫さまのお兄さんだったのです。"
]},
{ cat:"grimm", title:"漁師と妻", yomi:"りょうしとつま", author:"グリム兄弟", authorYomi:"グリムきょうだい", icon:"🐟", text:[
"むかし、海べの小さなぼろ小屋に、まずしいりょうしとおかみさんがくらしていました。ある日、りょうしが大きなかれいをつりあげると、かれいが話しだしました。「わたしは魔法をかけられた王子です。どうか、にがしてください」。りょうしは、かれいを海にかえしてあげました。",
"家に帰ってその話をすると、おかみさんは言いました。「なにもおねがいしなかったのかい？きれいな家がほしいって、たのんでおいで」。りょうしが海へ行ってたのむと、かれいは「帰ってごらん」。家に帰ると、ぼろ小屋は、かわいらしい家にかわっていました。",
"けれど、おかみさんはすぐにまんぞくできなくなりました。「もっと大きな、石のお城がほしい」。りょうしがたのみに行くと、海は少しにごっていましたが、かれいはねがいをかなえてくれました。",
"「わたしは王さまになりたい」「こんどは皇帝（こうてい）よ」「法王（ほうおう）にだってなってみせるわ」。ねがいがかなうたびに、海はどんどん黒くあれていきます。それでも、おかみさんのよくばりはとまりません。",
"そしてある朝、おかみさんは言いました。「お日さまやお月さまを、わたしの思いのままにのぼらせたい。神さまのようになりたいの」。",
"りょうしが大あらしの海でそれをつたえると、かれいはこたえました。「帰ってごらん。おかみさんは、もとのぼろ小屋にすわっているよ」。こうしてふたりは、いまでもそのぼろ小屋でくらしているということです。"
]},

/* ---------- アンデルセン童話 ---------- */
{ cat:"andersen", title:"人魚姫", yomi:"にんぎょひめ", author:"アンデルセン", icon:"🧜‍♀️", text:[
"海のそこのお城に、人魚の王さまと、六人のお姫さまがくらしていました。いちばん下のお姫さまは、しずかでかんがえぶかく、海の上の人間の世界にあこがれていました。人魚は十五歳になると、海の上へ出てもいいことになっていました。",
"十五歳のたんじょう日、海の上に出た人魚姫は、船の上でお祝いをしている若い王子さまを見つけます。その夜、船は大あらしでしずんでしまい、人魚姫は、海におちた王子さまをけんめいにたすけて、はまべへはこびました。",
"王子さまのことがわすれられない人魚姫は、海の魔女のところへ行きました。魔女は言いました。「おまえの美しい声とひきかえに、人間の足をあげよう。でも歩くたびに、ナイフの上を歩くようにいたむよ。それに、王子がほかのむすめとけっこんしたら、そのつぎの朝、おまえは海のあわになって消えてしまうのだ」。",
"人間になった人魚姫は、王子さまのお城でくらすようになりました。王子さまは人魚姫をかわいがってくれましたが、声の出ない人魚姫は、自分があのときたすけたのだと、つたえることができません。そして王子さまは、自分をたすけてくれたのはとなりの国のお姫さまだと思いこみ、そのお姫さまとけっこんすることになりました。",
"けっこん式の夜、人魚姫のお姉さんたちが海からあらわれました。お姉さんたちは、自分の長いかみとひきかえに、魔女からナイフをもらってきたのです。「このナイフで王子の胸をさせば、あなたは人魚にもどれるわ」。",
"けれど人魚姫は、ねむっている王子さまを見つめると、ナイフを海へなげすて、自分も海へとびこみました。人魚姫の体はあわになりましたが、そのたましいは空の風の精たちにむかえられ、天へとのぼっていきました。"
]},
{ cat:"andersen", title:"醜いアヒルの子", yomi:"みにくいアヒルのこ", author:"アンデルセン", icon:"🐣", text:[
"夏のある日、アヒルのお母さんが、たまごをあたためていました。たまごがつぎつぎにかえって、かわいいひなが生まれます。けれど、いちばん大きなたまごからだけは、なかなか生まれてきません。",
"やっと生まれてきたのは、体が大きくて、灰色で、ほかのひなとはぜんぜんちがうひなでした。「なんてみにくい子だろう」。アヒルのきょうだいにも、にわとりにも、農場の人たちにも、そのひなはいじめられてばかりいました。",
"とうとう、みにくいアヒルの子は農場からにげ出しました。どこへ行っても「みにくい」「へんなやつ」と言われ、なかまに入れてもらえません。",
"ある秋の夕ぐれ、空を、白くて美しい鳥のむれがとんでいくのを見ました。アヒルの子は、なぜか胸がいっぱいになりました。",
"やがて、きびしい冬がやってきました。アヒルの子は、こおりつきそうな池で、ひとりぼっちでさむさとひもじさにたえながら、冬をすごしました。",
"そして春。つばさを広げてみると、ふしぎなことに、力づよく空へとびあがれました。庭の池におりると、あの白い美しい鳥たちがいます。「きっと、ぼくなんか追いはらわれる」。そう思って水面を見ると、そこにうつっていたのは、みにくいアヒルの子ではなく、美しい一羽の白鳥でした。白鳥たちはやさしくむかえてくれて、子どもたちは「新しい白鳥が、いちばんきれい！」とよろこびました。"
]},
{ cat:"andersen", title:"マッチ売りの少女", yomi:"マッチうりのしょうじょ", author:"アンデルセン", icon:"🔥", text:[
"大みそかの夜。雪のふるさむい町を、ひとりの女の子が、はだしで歩いていました。女の子はマッチ売り。でも、きょうは一本も売れていません。売れないまま家に帰ったら、お父さんにしかられてしまいます。",
"さむさにたえられなくなった女の子は、家と家のあいだにすわりこみ、一本のマッチをすりました。シュッ！すると、あたたかいストーブがあらわれたように見えました。でも、火が消えると、ストーブも消えてしまいました。",
"二本目をすると、ごちそうのならんだテーブルが見えました。ほかほかのがちょうの丸やきです。三本目をすると、光りかがやく大きなクリスマスツリーが見えました。ツリーのあかりは、空へのぼって星になりました。",
"そのとき、星がひとつ、空をすうっとながれおちました。「だれかが天にのぼるとき、星がひとつおちるのよ」。女の子は、やさしかったおばあさんが言っていたことを思い出しました。",
"四本目のマッチをすると、光の中に、あのおばあさんがあらわれました。「おばあちゃん！マッチが消えたら、おばあちゃんもいなくなっちゃう。おねがい、わたしもつれていって！」。女の子はのこりのマッチを、ぜんぶいっぺんにすりました。",
"おばあさんは女の子をだきしめ、ふたりは光につつまれて、さむさもひもじさもない、天の国へのぼっていきました。新年の朝、町の人たちは、ほほえみをうかべてつめたくなっている女の子を見つけました。女の子がどんなに美しいものを見たのか、だれも知りませんでした。"
]},
{ cat:"andersen", title:"おやゆび姫", yomi:"おやゆびひめ", author:"アンデルセン", icon:"🌷", text:[
"むかし、子どもがほしいとねがうおばあさんが、魔法使いから、ふしぎな大麦のつぶをもらいました。植木ばちにまくと、チューリップのような美しいつぼみがつき、花がひらくと、中に親指ほどの小さな女の子がすわっていました。女の子は「おやゆび姫」とよばれました。",
"ある夜、ひきがえるのお母さんがおやゆび姫をさらっていきました。「むすこのおよめさんにちょうどいい」。おやゆび姫は川のスイレンの葉の上におかれ、泣いていると、魚たちが葉のくきをかみきって、にがしてくれました。",
"その後、こがね虫につれていかれたり、ひとりで森で夏をすごしたりしたおやゆび姫。やがてさむい冬がくると、野ねずみのおばあさんの家においてもらうことになりました。ところが野ねずみは、お金持ちのもぐらとけっこんするよう、すすめてきます。もぐらは、お日さまも花もきらいな、目の見えない紳士でした。",
"ある日、もぐらのトンネルで、おやゆび姫はさむさでたおれたつばめを見つけました。おやゆび姫はこっそりつばめをあたため、冬のあいだ、せっせと世話をしました。春になると、元気になったつばめは空へとびたっていきました。",
"いよいよ、もぐらとのけっこん式の日。「もう二度と、お日さまを見られないのね」。おやゆび姫が悲しんでいると、あのつばめがとんできました。「いっしょに、あたたかい南の国へ行きましょう！」。",
"南の国の花の中には、おやゆび姫と同じくらい小さな、花の国の王子さまがいました。王子さまはおやゆび姫をおきさきにむかえ、おやゆび姫には、花の精のような美しい羽がおくられました。"
]},
{ cat:"andersen", title:"裸の王様", yomi:"はだかのおうさま", author:"アンデルセン", icon:"👑", text:[
"むかし、新しい服が大すきで、服のことばかり考えている王さまがいました。",
"ある日、ふたりの男がやってきて言いました。「わたしたちは、世界でいちばんすばらしい布をおることができます。その布は、自分の仕事にむいていない人や、おろかな人には、見えないのです」。王さまは大よろこびで、たくさんのお金をはらって、布をおらせることにしました。",
"じつは、ふたりはさぎし（人をだます人）でした。はたおりきの前で、なにもおっていないのに、おっているふりをするだけです。",
"ようすを見に行った大臣には、なにも見えません。でも「見えない」と言えば、自分が仕事にむいていないことになってしまいます。大臣は「なんと美しい布だ！」とほめました。つぎの家来も、王さまも、なにも見えないのに、みんな「すばらしい！」と言いました。",
"いよいよ服ができあがり、王さまはその「服」を着て、町をパレードすることになりました。町の人たちも、なにも見えないのに「なんてすてきなお召しものでしょう！」と口々にほめます。",
"そのとき、ひとりの小さな子どもが言いました。「王さま、はだかだよ！」。その声は、あっというまに広がり、みんなが「王さまははだかだ！」とさけびはじめました。王さまも、そうかもしれないと思いましたが、パレードをやめるわけにもいかず、むねをはって歩きつづけたのでした。"
]},
{ cat:"andersen", title:"雪の女王", yomi:"ゆきのじょおう", author:"アンデルセン", icon:"🧊", text:[
"むかし、わるい悪魔が、いいものがわるく、わるいものがもっとわるく見える鏡をつくりました。その鏡がわれて、こなごなのかけらが世界じゅうにとびちりました。",
"ある町に、カイという男の子と、ゲルダという女の子がすんでいました。ふたりは大のなかよし。ところがある日、カイの目と心臓に、あの鏡のかけらが入ってしまいます。やさしかったカイは、いじわるで、つめたい子になってしまいました。",
"冬のある日、カイがそりあそびをしていると、白い大きなそりがやってきて、カイをのせたまま走りだしました。そりにのっていたのは、こおりのように美しい雪の女王。カイは、北のはての、こおりのお城へつれていかれてしまったのです。",
"ゲルダは、カイをさがしに、ひとりで旅に出ました。ふしぎな花園のおばあさん、かしこいカラス、やさしい王子と王女、そして山ぞくのむすめとトナカイ……。たくさんの人や動物にたすけられて、ゲルダは雪ときりの中を、北へ北へとすすんでいきました。",
"とうとうこおりのお城にたどりついたゲルダは、こおりのかけらをならべて遊ぶ、つめたくなったカイを見つけました。ゲルダはカイにだきつき、あたたかいなみだをながします。そのなみだがカイの胸にしみこむと、心臓の中の鏡のかけらがとけていきました。",
"カイもわっと泣き出し、なみだといっしょに、目のかけらもながれおちました。「ゲルダ！」。カイは、もとのやさしいカイにもどったのです。ふたりは手をつないでふるさとへ帰りました。帰ってみると、ふたりはいつのまにか大人になっていて、外は、あたたかい夏でした。"
]},
{ cat:"andersen", title:"赤い靴", yomi:"あかいくつ", author:"アンデルセン", icon:"👠", text:[
"むかし、カーレンというまずしい女の子がいました。お母さんがなくなったあと、カーレンは、お金持ちのおばあさんにひきとられて、大切にそだてられました。",
"ある日、カーレンは、つやつやの赤いくつを見つけます。おばあさんは目がよく見えなかったので、カーレンはその赤いくつを買ってもらいました。そして、黒いくつをはいていくのがきまりの、教会のだいじな式にも、赤いくつをはいていったのです。教会でも、カーレンは赤いくつのことばかり考えていました。",
"ある日、教会の前で、赤いひげの年よりの兵隊が言いました。「なんときれいなおどりぐつだ。おどるときは、ぬげないでおくれよ」。",
"やがて、おばあさんは重い病気になりました。それなのに、カーレンはおばあさんの世話をせず、赤いくつをはいて、ぶとう会へ出かけてしまいます。",
"すると、どうでしょう。カーレンの足が、かってにおどりだしたのです。止まろうとしても、止まりません。くつはぬげず、カーレンは夜も昼も、野原も森も、おどりつづけました。",
"くたくたになったカーレンは、とうとう自分の足を、赤いくつごと切りはなしてもらいました。赤いくつは、おどりながら森のおくへ消えていきました。",
"木の足をつけたカーレンは、心から自分のしたことをくやみ、やさしい心で、牧師さんの家ではたらきました。ある日曜日、ひとりでいのっていたカーレンの部屋に天使があらわれ、カーレンの心はあたたかい光でいっぱいになり、そのたましいは、天へとのぼっていきました。"
]},
{ cat:"andersen", title:"すずの兵隊", yomi:"すずのへいたい", sub:"しっかり者のすずの兵隊", author:"アンデルセン", icon:"💂", text:[
"ある男の子のたんじょう日に、二十五人のすずの兵隊のおもちゃがおくられました。みんな一本の古いスプーンをとかしてつくられたのですが、さいごのひとりだけは、すずがたりなくて、片足しかありませんでした。それでも、その兵隊は、ほかのみんなと同じように、しっかりと立っていました。",
"同じテーブルの上には、紙でできたお城があり、その入口に、紙の踊り子が立っていました。踊り子は片足を高く上げていたので、兵隊には、自分と同じ片足に見えました。「あの人を、およめさんにしたいなあ」。",
"ある朝、兵隊はまどべから下の道へおちてしまいます。雨のあと、通りかかった男の子たちが、兵隊を紙の舟にのせて、みぞへながしました。舟はどんどんながされ、とうとう大きな魚に、ぱくりとのみこまれてしまいます。",
"ところが、その魚がつりあげられて市場で売られ、なんと、もとの家の台所にやってきました。魚のおなかから出てきた兵隊を見て、家の人たちはびっくり。兵隊はまたテーブルの上にもどされ、踊り子と見つめあいました。",
"けれど、なぜか男の子のひとりが、兵隊をストーブの火の中へなげこんでしまいました。兵隊が、あつさの中でもしっかりと立ったまま踊り子を見つめていると、そのとき風がふいて、踊り子もストーブの中へまいこんできました。",
"つぎの朝、ストーブの灰の中から、小さなハートの形をしたすずのかたまりと、まっ黒にこげた、踊り子のかざりのスパンコールが見つかりました。"
]},
{ cat:"andersen", title:"ナイチンゲール", sub:"夜鳴きうぐいす", author:"アンデルセン", icon:"🐤", text:[
"むかし、中国の皇帝の、美しいごてんの庭のおくの森に、ナイチンゲールという小鳥がすんでいました。見た目は地味な灰色の小鳥ですが、その歌声は、聞いた人がなみだをながすほどすばらしいものでした。",
"ナイチンゲールのうわさを聞いた皇帝は、小鳥をごてんにまねきました。その歌声を聞いた皇帝はなみだをながして感動し、小鳥をごてんでかうことにしました。",
"ある日、日本の皇帝から、宝石でかざられた、ぜんまいじかけの金の小鳥がおくられてきました。ねじをまくと、いつでも同じ歌をうたいます。みんなはぴかぴかのつくりものの小鳥にむちゅうになり、ほんもののナイチンゲールは、いつのまにか森へ帰っていきました。",
"何年かたって、つくりものの小鳥はこわれて、ほとんど歌えなくなりました。そして皇帝は、重い病気になってしまいます。皇帝がベッドでくるしんでいると、胸の上に死神がすわっていました。",
"そのとき、まどの外から、美しい歌声がひびいてきました。ほんもののナイチンゲールが、皇帝の病気を聞いてかけつけ、歌をうたいにきたのです。その歌声にうっとりした死神は、白いきりになって、まどから出ていきました。",
"元気になった皇帝に、ナイチンゲールは言いました。「わたしは森にすんで、ときどきここへ歌いにきます。しあわせな人のことも、かなしい人のことも、歌ってあげましょう」。つぎの朝、家来たちがおそるおそる部屋へ入ると、皇帝は元気に「おはよう」とあいさつをしたのでした。"
]},
{ cat:"andersen", title:"野の白鳥", yomi:"ののはくちょう", author:"アンデルセン", icon:"🦢", text:[
"むかし、ある国に、十一人の王子と、エリサというお姫さまがいました。ところが、新しくきたおきさきはわるい魔女で、魔法で十一人の王子を白鳥にかえて、お城から追い出してしまいました。王子たちは、お日さまがしずんでいるあいだだけ、人間のすがたにもどることができました。",
"エリサもお城を追われましたが、お兄さんたちをさがして旅をつづけ、とうとう会うことができました。ある夜、エリサのゆめに妖精があらわれて、のろいをとく方法を教えてくれました。",
"「いらくさをつんで糸にし、十一まいの上着をあみなさい。いらくさは、手にやけどのような水ぶくれをつくるでしょう。そして、あみおわるまで、ひとことも口をきいてはいけません。ひとことでも話せば、お兄さんたちは死んでしまうのです」。",
"エリサは、いたみにたえながら、だまって上着をあみつづけました。ある日、森で狩りをしていた王さまがエリサを見つけ、お城へつれて帰って、おきさきにむかえます。けれど、夜中にお墓のそばでいらくさをつむエリサを見た人たちは、「あのむすめは魔女だ」と言い出しました。",

"とうとうおおかみは、えんとつからしのびこもうとしました。それに気づいた子ぶたは、だんろにお湯をぐらぐらわかした大なべをおいておきます。えんとつからすべりおりたおおかみは、なべの中へざぶん！「あちちちち！」。おおかみはとびあがってにげていき、二度ともどってはきませんでした。三びきの子ぶたは、レンガの家でなかよくくらしました。",

{ cat:"eibei", title:"金髪と三匹の熊", yomi:"きんぱつとさんびきのくま", sub:"ゴルディロックスと三びきのくま", icon:"🥣", text:[

"テーブルには、大・中・小のおかゆのおわん。大きいおわんのおかゆはあつすぎ。中くらいのはつめたすぎ。小さいおわんのおかゆはちょうどよくて、ぜんぶ食べてしまいました。",
"つぎに、いすにすわってみます。大きいいすはかたすぎ、中くらいのいすはやわらかすぎ。小さいいすはちょうどいい！と思ったら、ばきっ！いすはこわれてしまいました。",

"くまたちが帰ってくると、「だれかが、わたしのおかゆを食べたな」「わたしのいすに、だれかがすわったわ」「ぼくのいすがこわれてる！」。二階へ上がると、子ぐまがさけびました。「ぼくのベッドに、だれかねてるよ！」。その声で目をさましたゴルディロックスは、三びきのくまを見てびっくり。まどからとびおりて、森のむこうへいちもくさんににげていきました。"

{ cat:"eibei", title:"ジンジャーブレッドマン", spine:"ジンジャー|ブレッドマン", icon:"🍪", text:[

"やきあがってオーブンのとびらをあけると、なんと、ジンジャーブレッドマンがぴょんととび出して、走りだしました！「まって！」。おじいさんとおばあさんが追いかけますが、ジンジャーブレッドマンはうたいながらにげていきます。「走れ、走れ、どんどん走れ。ぼくはつかまらないよ、ジンジャーブレッドマンだもの！」。",
"とちゅうで、牛や馬、畑ではたらく人たちも「おいしそう！」と追いかけてきましたが、だれもジンジャーブレッドマンに追いつけません。",
"ところが、目の前に大きな川があらわれました。こまっていると、きつねがやってきて言いました。「わたしのしっぽにのりなさい。むこうぎしまで、はこんであげよう」。",
"きつねが泳ぎだすと、だんだん水がふかくなってきます。「しっぽだと、ぬれてしまうよ。せなかにのりなさい」。つぎは「肩にのりなさい」。そして「鼻の上にのりなさい」。",
"ジンジャーブレッドマンがきつねの鼻の上にのったとたん……。きつねはひょいっと頭をふりあげ、ぱくり！ジンジャーブレッドマンは、きつねに食べられてしまいましたとさ。"

{ cat:"eibei", title:"親指トム", yomi:"おやゆびトム", icon:"🐁", text:[
"むかし、アーサー王の時代のイギリスに、子どもがほしいとねがう農夫の夫婦がいました。「親指くらいの大きさでもいいから、子どもがほしい」。そのねがいを聞いた魔法使いマーリンが魔法をかけると、ほんとうに、親指ほどの男の子が生まれました。男の子は「親指トム」と名づけられました。",
"トムは、小さな体のせいで、いつもとんでもないさわぎにまきこまれました。お母さんがつくっていたプディングのなべにおっこちたり、牛に草といっしょにぱくりと食べられたり、からすにくわえられて海の上までとばされたりしたのです。",
"海におちたトムは、大きな魚にのみこまれてしまいます。ところが、その魚がつりあげられて、アーサー王のお城の台所へ。魚のおなかから出てきた小さなトムに、アーサー王はびっくり。トムは王さまにかわいがられ、お城でくらすことになりました。",
"トムは、ねずみを馬にし、はりを剣にして、小さな騎士（きし）になりました。小さいながらも、知恵と勇気で王さまのためにはたらき、みんなの人気ものになりました。",
"けれどある日、トムは大きな毒ぐもとたたかい、くもの毒をあびてしまいます。小さな勇者トムは、そこで命をおとしてしまいました。アーサー王とお城の人たちは、トムのためにりっぱなお墓をつくり、その勇気をいつまでもたたえたということです。"
]},
{ cat:"eibei", title:"巨人殺しのジャック", yomi:"きょじんごろしのジャック", icon:"🗡️", text:[
"むかし、アーサー王の時代のイギリスのコーンウォールに、コーモランという大男の巨人がいました。巨人は、海をわたって村へやってきては、牛やひつじをつぎつぎにさらっていくので、村の人たちはこまりはてていました。",
"そこへ、農家のむすこのジャックが名のり出ました。ジャックは夜のうちに、巨人のすむ山のふもとに大きなおとしあなをほり、上から草でかくしておきます。そして朝になると、らっぱを高らかにふきならしました。",
"「だれだ、わしのねむりをじゃまするのは！」。おこった巨人は山をかけおりてきて、おとしあなにどすーん！ジャックは巨人をやっつけました。村の人たちは大よろこびで、ジャックに「巨人殺しのジャック」という名前と、ほうびの剣をおくりました。",
"それからもジャックは、各地で人々をくるしめる巨人たちに立ちむかいました。あるときは、服の下にかくした皮ぶくろにおかゆをつめて、自分のおなかを切ってみせるふりをし、それをまねした巨人をやっつけました。",
"やがてジャックは、着ると見えなくなるマントや、ものすごくはやく走れるくつ、なんでも切れる剣などを手に入れて、頭がいくつもある巨人や、おそろしい魔法使いまでたおしていきました。",
"さいごに、魔法使いにつかまっていた公爵のむすめをすくい出したジャックは、アーサー王にたたえられ、そのむすめとけっこんして、しあわせにくらしたということです。"
]},
{ cat:"eibei", title:"ディック・ウィッティントンと猫", spine:"ディック・|ウィッティントン|と猫", yomi:"ディック・ウィッティントンとねこ", icon:"🐱", text:[
"むかし、イギリスのいなかに、ディック・ウィッティントンというまずしい男の子がいました。「ロンドンの道は、金でできているらしい」。そんなうわさを信じて、ディックはひとりでロンドンへ出かけていきました。",
"けれど、ロンドンの道は、ふつうの石の道でした。おなかをすかせてたおれていたディックを、フィッツウォーレンというお金持ちの商人が見つけ、家の台所の下ばたらきとしてやとってくれました。",
"ディックのねる屋根うら部屋には、ねずみがたくさんいて、ねむれません。そこでディックは、一ペニーでねこを買いました。ねこはねずみをどんどんつかまえて、ディックの大切な友だちになりました。",
"あるとき、商人の船が遠い国へ貿易に出かけることになり、家の人たちは、それぞれ自分の品物を船にのせることになりました。ディックが持っているのは、ねこだけ。ディックはさびしい気持ちで、ねこを船にあずけました。",
"船が着いた遠い国の王さまのごてんは、ねずみだらけで、こまりはてていました。ディックのねこがあっというまにねずみを追いはらうと、王さまは大よろこび。ねこをゆずってもらうかわりに、船いっぱいの宝ものをくれたのです。",
"大金持ちになったディックは、商人のむすめのアリスとけっこんしました。そしてディックは、のちに三回もロンドンの市長になったということです。"
]},
{ cat:"eibei", title:"赤いめんどり", yomi:"あかいめんどり", icon:"🐔", text:[
"むかし、ある農場に、小さな赤いめんどりがすんでいました。いっしょにくらしているのは、アヒルと、ぶたと、ねこです。",
"ある日、めんどりは小麦のたねを見つけました。「だれか、たねをまくのを手つだってくれない？」。「いやだよ」とアヒル。「いやだね」とぶた。「いやよ」とねこ。「それなら、わたしがやるわ」。めんどりは、ひとりでたねをまきました。",
"小麦がそだつと、「だれか、草とりを手つだってくれない？」。「いやだよ」「いやだね」「いやよ」。めんどりは、ひとりで草をとりました。",
"かりいれも、こなにひくのも、みんな「いやだ」と言うばかり。めんどりは、ぜんぶ自分ひとりでがんばりました。",
"「だれか、パンをやくのを手つだってくれない？」。「いやだよ」「いやだね」「いやよ」。めんどりは、ひとりでパンをやきました。すると、こうばしい、いいにおいが農場じゅうにひろがりました。",
"「さあ、このパンを食べるのはだれかしら？」。「ぼく！」「おれ！」「わたし！」。三びきはいっせいに手をあげました。めんどりは言いました。「いいえ。なにも手つだってくれなかったみんなには、あげません。わたしと、ひよこたちで食べます」。そうして、めんどりとひよこたちは、おいしいパンをのこらず食べたのでした。"
]},
{ cat:"eibei", title:"モリー・ウォッピー", icon:"💍", text:[
"むかし、まずしい夫婦に、三人のむすめがいました。食べものがなくなり、三人は森においていかれてしまいます。いちばん下のモリー・ウォッピーは、とてもかしこくて、勇気のある女の子でした。",
"森をさまよう三人は、一けんの家を見つけました。そこは巨人の家で、巨人にも三人のむすめがいました。巨人は、モリーたち三人の首にはわらのひもを、自分のむすめたちの首には金のくさりをかけて、ねかせました。夜中に、わらのひものほうをつかまえるつもりだったのです。",
"それに気づいたモリーは、夜中にこっそり、ひもとくさりをとりかえておきました。真夜中、くらやみでやってきた巨人は、わらのひもをたよりに、自分のむすめたちのほうをつかまえてしまいました。そのすきに、モリーは姉たちをつれてにげ出し、「一本のかみの毛の橋」をわたって、王さまのお城へたどりつきました。",
"話を聞いた王さまは言いました。「かしこい子だ。巨人の剣をとってきたら、いちばん上の姉を、わたしの長男のおよめさんにしよう」。モリーは巨人の家にしのびこみ、みごと剣をとってきました。つぎは巨人のさいふ、そのつぎは巨人の指輪。モリーは、ひとつずつとってきました。",
"さいごの指輪をとるときに、モリーは巨人につかまって、ふくろにとじこめられてしまいます。けれど、モリーはふくろの中から「ここから見える景色は、なんてすばらしいの！」と、巨人のおかみさんに言いました。見たくなったおかみさんがモリーとかわってふくろに入ると、モリーはそのすきににげ出しました。",
"巨人に追いかけられながらも、モリーはかみの毛の橋をかけぬけました。体の大きな巨人は、その橋をわたることができません。こうして三人の姉妹はそれぞれ王子さまとけっこんし、モリーは、いちばん下の王子さまのおよめさんになりました。"
]},
{ cat:"eibei", title:"タム・リン", icon:"🎃", text:[
"むかし、スコットランドに、カーターホウという森がありました。「あの森には、タム・リンという妖精の騎士がいる」と、みんなはこわがって近づきませんでした。",
"けれど、勇気のあるむすめジャネットは森へ入り、バラの花をつみました。するとタム・リンがあらわれます。ふたりはやがて、心から愛しあうようになりました。",
"タム・リンは、自分の秘密をうちあけました。「ぼくは、もともと人間なんだ。子どものころ、馬からおちたところを、妖精の女王にさらわれてしまった。妖精の国では、七年に一度、地の底の国へ、ささげものをしなければならない。こんどのハロウィンの夜、それにえらばれるのは、きっとぼくなんだ」。",
"「どうしたら、あなたをたすけられるの？」「ハロウィンの真夜中、妖精たちは馬にのって十字路をとおる。ぼくは白い馬にのっている。ぼくを馬からひきずりおろして、なにがあっても、はなさずにだきしめていてほしい」。",
"ハロウィンの夜。ジャネットは十字路で待ちぶせ、白い馬にのったタム・リンを、力いっぱいひきずりおろしました。すると妖精の女王の魔法で、タム・リンは、とかげに、へびに、まっ赤にやけた鉄のかたまりにと、つぎつぎとすがたをかえられます。それでもジャネットは、ぜったいに手をはなしませんでした。",
"さいごに、タム・リンはもとの人間のすがたにもどりました。ジャネットは自分のマントでタム・リンをつつみこみ、妖精の女王の魔法はやぶれました。女王はくやしがりながら去っていき、ふたりはけっこんして、しあわせにくらしました。"
]},

{ cat:"aesop", title:"蟻とキリギリス", yomi:"ありとキリギリス", author:"イソップ", icon:"🐜", text:[

"そのそばで、キリギリスは、木かげでバイオリンをひき、歌をうたって遊んでいました。「ありさんたち、こんなに暑いのに、よくはたらくねえ。いっしょに遊ぼうよ」「冬になったら食べものがなくなるから、いまのうちにためておくんだよ」。キリギリスは「冬のことなんて、そのときに考えればいいさ」とわらいました。",
"やがて秋がすぎ、きびしい冬がやってきました。野山は雪におおわれ、食べものはどこにもありません。キリギリスはおなかをすかせて、さむさにふるえていました。",
"こまったキリギリスは、ありの家の戸をたたきました。「ありさん、なにか食べるものをわけてください」。",
"ありたちは言いました。「夏のあいだ、きみはなにをしていたの？」「歌をうたっていたんだ」「それなら、冬はおどっていたらどうだい」。ありは、戸をしめてしまいました。",
"（おはなしによっては、ありがやさしく食べものをわけてあげて、キリギリスが心を入れかえる、という終わり方もあります。）"
]},
{ cat:"aesop", title:"北風と太陽", yomi:"きたかぜとたいよう", author:"イソップ", icon:"☀️", text:[
"あるとき、北風と太陽が、「どっちが強いか」で言いあいをはじめました。",
"そこへ、ひとりの旅人が、マントを着て道を歩いてきました。「あの旅人のマントを、先にぬがせたほうが勝ちにしよう」。",
"まずは北風の番です。北風は、びゅうびゅうと、つめたい風を思いきりふきつけました。けれど旅人は「うう、さむい」と、マントを体にしっかりまきつけます。北風が強くふけばふくほど、旅人はマントをぎゅっとおさえて、ぜったいにぬぎません。北風は、とうとうあきらめました。",
"つぎは太陽の番です。太陽は雲のあいだから顔を出し、ぽかぽかと、あたたかい光をてらしました。",
"旅人は「ああ、あたたかくなってきた」と、マントのボタンをはずしました。太陽がもっとあたたかくてらすと、旅人は「暑い、暑い」とあせをふきながら、とうとう自分からマントをぬいでしまいました。勝負は、太陽の勝ちでした。"
]},
{ cat:"aesop", title:"兎と亀", yomi:"うさぎとかめ", author:"イソップ", icon:"🏁", text:[
"ある日、足のはやいうさぎが、のろのろ歩くかめをからかいました。「かめさんは、なんて足がおそいんだろう」。",
"かめはこたえました。「それなら、かけっこで勝負しよう。あの山のてっぺんまで、どっちが先に着くか」。「ぼくに勝てるわけないよ」。うさぎはわらいながら、勝負をうけました。",
"「よーい、どん！」。うさぎはぴょんぴょんと走りだし、あっというまにかめを引きはなしてしまいました。ふりかえっても、かめのすがたは、はるか遠く。",
"「かめさんが来るまで、ずいぶん時間がかかりそうだ。ひとねむりしよう」。うさぎは道ばたの木かげで、ぐうぐうねむってしまいました。",
"そのあいだも、かめは休まずに、のっし、のっしと、一歩ずつ歩きつづけます。そして、ねむっているうさぎの横を、そっと追いこしていきました。",
"うさぎがはっと目をさましたときには、もう夕方。あわてて山のてっぺんまでかけのぼりましたが、そこではもう、かめがゴールして待っていました。"
]},
{ cat:"aesop", title:"狼少年", yomi:"おおかみしょうねん", sub:"ひつじかいとおおかみ", author:"イソップ", icon:"🐑", text:[
"むかし、村はずれで、ひつじの番をしているひつじかいの男の子がいました。毎日ひつじを見はっているだけなので、男の子はたいくつでたまりません。",
"ある日、男の子は大きな声でさけびました。「たいへんだ！おおかみが来たぞー！」。村の人たちは、畑仕事をほうり出して、くわやぼうを持ってかけつけてきました。ところが、おおかみなんて、どこにもいません。「あはは、うそだよ！」。男の子はおなかをかかえてわらいました。",
"何日かたって、男の子はまた「おおかみが来たぞー！」とさけびました。村の人たちはまたかけつけましたが、やっぱりうそでした。村の人たちは、かんかんにおこって帰っていきました。",
"そしてある日。ほんとうに、おそろしいおおかみがあらわれて、ひつじのむれにおそいかかってきました。",
"「たいへんだ！おおかみが来たぞー！たすけて！」。男の子はひっしでさけびつづけました。けれど村の人たちは、「また、あの子のうそだろう」と思って、だれもたすけに来てくれません。",
"こうして、ひつじたちは、おおかみにみんな食べられてしまいました。"
]},
{ cat:"aesop", title:"金の斧と銀の斧", yomi:"きんのおのとぎんのおの", author:"イソップ", icon:"🪓", text:[
"むかし、まずしい木こりが、川のそばで木を切っていました。ところが、手がすべって、大切な鉄のおのを、ふかい川の中へおとしてしまいました。「ああ、あのおのがないと、仕事ができない」。木こりは、川のほとりで泣いていました。",
"すると、川の中から神さまがあらわれました。神さまは川にもぐると、ぴかぴかの金のおのを持ってきて言いました。「おまえがおとしたのは、この金のおのか？」「いいえ、ちがいます」。",
"神さまはまたもぐって、こんどは銀のおのを持ってきました。「では、この銀のおのか？」「いいえ、それでもありません」。",
"神さまは三たびもぐって、古い鉄のおのを持ってきました。「では、このおのか？」「はい！それがわたしのおのです。ありがとうございます」。",
"神さまは木こりの正直さにたいへん感心して、「正直なおまえに、三本ともあたえよう」と、金と銀と鉄のおのを、ぜんぶくれました。",
"この話を聞いたとなりのよくばりな男は、わざと自分のおのを川になげこみ、泣いたふりをしました。神さまが金のおのを持ってあらわれると、「それです！それがわたしのおのです！」。神さまはおこって、なにも言わずに川へ消えてしまいました。男は金のおのどころか、自分のおのまでなくしてしまったのです。"
]},
{ cat:"aesop", title:"酸っぱい葡萄", yomi:"すっぱいぶどう", author:"イソップ", icon:"🍇", text:[
"ある日、おなかをすかせたきつねが、森を歩いていました。ふと見あげると、高いぶどうだなに、むらさき色のおいしそうなぶどうが、たっぷりとなっていました。",
"「ああ、おいしそう！」。きつねは、ぶどうをとろうと、思いきりジャンプしました。けれど、あとちょっとのところで、とどきません。",
"「えいっ！」「それっ！」。いきおいをつけて走ってきたり、高くとびあがったり、きつねはなんども、なんどもチャレンジしました。でも、どうしてもとどきません。",
"とうとうつかれはてたきつねは、ぶどうを見あげて言いました。「ふん。あんなぶどう、どうせすっぱくて、まずいにきまってるさ」。",
"そうして、きつねはぷいっと横をむいて、立ちさっていきました。"
]},
{ cat:"aesop", title:"田舎のネズミと都会のネズミ", yomi:"いなかのネズミととかいのネズミ", author:"イソップ", icon:"🧀", text:[
"むかし、いなかにすむねずみが、友だちの都会のねずみを、自分の家にまねきました。いなかのねずみは、大麦や野菜の根っこなどで、せいいっぱいもてなしました。",
"けれど都会のねずみは、「こんなそまつな食べものばかりで、よくがまんできるね。都会へおいでよ。ごちそうが山ほどあるよ」と言いました。",
"そこで、いなかのねずみは、都会のねずみの家へ行くことになりました。そこは大きなお屋しき。テーブルには、お肉やチーズ、くだもの、ケーキなど、見たこともないごちそうがならんでいます。「すごい！」。",
"ところが、食べようとしたそのとき、ばたんと戸があいて、人間が入ってきました。二ひきはあわてて、かべのあなへにげこみます。しばらくして、また食べようとすると、こんどは大きな犬が、ワンワンほえながらとびこんできました！",
"ぶるぶるふるえながら、いなかのねずみは言いました。「きみのごちそうはすばらしいけれど、こんなにびくびくしながら食べるのは、ごめんだよ。ぼくは、そまつでも、安心して食べられるいなかのほうがいいな。さようなら」。",
"そうして、いなかのねずみは、自分の家へ帰っていきました。"
]},
{ cat:"aesop", title:"カラスと水差し", yomi:"カラスとみずさし", author:"イソップ", icon:"🏺", text:[
"ある、とても暑い夏の日。雨もずっとふらず、のどがかわいてしにそうなカラスが、水をさがしてとんでいました。",
"カラスは、庭におかれた水さしを見つけました。のぞいてみると、底のほうに、水が少しだけのこっています。",
"けれど、水さしの口は細くて長く、カラスのくちばしでは、どうしても水にとどきません。水さしをたおそうとしても、重くて、びくともしませんでした。",
"「どうしたらいいかな……」。カラスはあたりを見まわして、いいことを思いつきました。まわりにおちている小石を、くちばしで一つずつひろって、水さしの中へ、ぽとん、ぽとんと入れていったのです。",
"小石がどんどん底にたまっていくと、水がだんだん上のほうへあがってきました。とうとう、水はカラスのくちばしがとどくところまで、あがってきました。",
"カラスは、おいしい水を、思うぞんぶんのむことができました。"
]},

/* ---------- アラビアンナイト ---------- */
{ cat:"arabian", title:"アラジンと魔法のランプ", yomi:"アラジンとまほうのランプ", icon:"🪔", text:[
"むかし、中国の町に、アラジンというまずしい若者が、お母さんとくらしていました。ある日、アラジンのおじさんだとなのる、ふしぎな男があらわれました。じつは男は、遠い西の国からやってきた、わるい魔法使いでした。",
"魔法使いはアラジンを町の外へつれ出し、地面にかくされたほらあなの入口をひらきました。「この中に、古いランプがある。それをとってきておくれ。これはおまもりだよ」。魔法使いは、アラジンに指輪をわたしました。",
"ほらあなの中には、宝石のなる木がありました。アラジンはランプを見つけて、ポケットを宝石でいっぱいにしました。けれど、出口で「先にランプをわたせ」と言う魔法使いに、アラジンが「外に出してくれたらね」とこたえると、魔法使いはおこって、入口をとじてしまいました。",
"くらやみの中で、アラジンがこまって手をこすると、指輪から魔人があらわれました。「ご主人さま、なんなりと」。アラジンは、家に帰してもらいます。そして、お母さんがランプをみがくと、こんどはもっと大きな、ランプの魔人があらわれたのです。",
"ランプの魔人の力で、アラジンは大金持ちになりました。やがて、王さまのむすめのバドルルブドゥール姫とけっこんし、魔人がひと晩でたてた、りっぱなごてんにすむようになりました。",
"けれど、それを知った魔法使いは、ランプ売りのふりをして「古いランプを、新しいランプととりかえます」と町を歩き、なにも知らないお姫さまから、魔法のランプを手に入れてしまいました。そして、ごてんをお姫さまごと、遠いアフリカへうつしてしまったのです。",
"アラジンは指輪の魔人にたのんで、お姫さまのいるごてんへとびました。そして、お姫さまと力をあわせて魔法使いをやっつけ、ランプをとりもどしました。ごてんはもとの場所にもどり、アラジンとお姫さまは、しあわせにくらしました。"
]},
{ cat:"arabian", title:"アリババと四十人の盗賊", yomi:"アリババとよんじゅうにんのとうぞく", icon:"💰", text:[
"むかし、ペルシャの町に、アリババというまずしい木こりがいました。ある日、森で木を切っていると、四十人の盗賊たちが馬にのってやってきました。アリババは、あわてて木の上にかくれます。",
"盗賊のかしらは、大きな岩の前に立ってとなえました。「ひらけ、ごま！」。すると岩の戸がひらき、盗賊たちは中へ入っていきました。そこは、盗賊たちが宝ものをかくしている、ほらあなだったのです。",
"盗賊たちが帰ったあと、アリババも「ひらけ、ごま！」ととなえ、金貨のふくろをいくつか持ち帰りました。それを知ったよくばりな兄のカシムは、ほらあなへ宝ものをとりに行きます。けれど、宝ものにむちゅうになるうちに、出るためのじゅもんをわすれてしまい、もどってきた盗賊たちに見つかって、命をおとしてしまいました。",
"宝ものをとったのがだれか、しらべはじめた盗賊たちは、とうとうアリババの家をつきとめます。かしらは油売りのふりをして、たくさんの油のつぼを運びこみ、アリババの家にとめてもらいました。つぼの中には、手下の盗賊たちがかくれていたのです。",
"それに気づいたのが、アリババの家の、かしこいめしつかいのモルジアナでした。モルジアナは、ほんものの油をぐらぐらにわかしてつぼにそそぎ、かくれていた盗賊たちを、こっそりやっつけてしまいました。",
"さいごに、にげのびたかしらが商人にばけて、ふたたびアリババの家へやってきます。モルジアナはその正体を見やぶり、おどりをひろうしながら、みごとにかしらをたおしました。アリババはモルジアナにふかく感謝し、むすこのおよめさんとしてむかえました。"
]},
{ cat:"arabian", title:"船乗りシンドバッドの冒険", spine:"船乗り|シンドバッドの冒険", yomi:"ふなのりシンドバッドのぼうけん", icon:"⛵", text:[
"むかし、バグダッドの町に、シンドバッドという大金持ちの商人がいました。シンドバッドは、若いころ七回も海へ旅に出て、おどろくような冒険をしてきたのです。",
"一回目の旅では、船が小さな島に着き、みんなで上陸して火をたきました。ところが、その島は、じつは海の上でねむっていた巨大な魚のせなかだったのです！魚があばれだし、シンドバッドは海へなげ出されてしまいました。",
"二回目の旅では、ひとりで島にとりのこされてしまいます。そこへ、空をおおうほど大きな鳥「ロック鳥」がやってきました。シンドバッドは、ターバンで自分の体を鳥の足にしばりつけ、空をとんで島を脱出。おりたところは、ダイヤモンドがごろごろしている谷でした。",
"三回目の旅では、一つ目の巨人の島につかまってしまいます。巨人は、船のりたちを食べようとしていました。シンドバッドたちは、巨人がねむっているあいだに、火であつくした鉄のくしで巨人の目をつき、いかだをつくってにげ出しました。",
"ほかにも、おくさんがなくなると夫もいっしょに地下のお墓へうめられてしまう国から、知恵をしぼってにげ出したり、せなかにのったままはなれない、海のおじいさんをやっつけたり。シンドバッドは何度もあぶない目にあいながら、そのたびに知恵と勇気でのりこえました。",
"そして、旅のたびにたくさんの宝ものを持って帰ったシンドバッドは、バグダッドいちの大金持ちになったのでした。"
]},
{ cat:"arabian", title:"空飛ぶ絨毯", yomi:"そらとぶじゅうたん", sub:"三人の王子とふしぎな宝もの", icon:"🪄", text:[
"むかし、インドの王さまに、三人の王子がいました。王さまは、早くに両親をなくしためいのヌーロンニハール姫も、自分の子のようにそだてていました。やがて三人の王子は、そろって「お姫さまとけっこんしたい」と言いだしました。",
"こまった王さまは言いました。「三人とも旅に出て、世界でいちばんめずらしい宝ものを持って帰ってきなさい。いちばんすばらしい宝を持ってきた者に、姫をおよめさんにやろう」。",
"長男のフセイン王子は、すわれば、どこへでもひとっとびで行ける「空とぶじゅうたん」を見つけました。次男のアリ王子は、どんなに遠くのものでも見ることができる「象牙のぼうえんきょう」を。三男のアーメッド王子は、かいだだけで、どんな病気もなおる「魔法のりんご」を手に入れました。",
"帰り道で落ちあった三人がぼうえんきょうをのぞいてみると、なんと、お姫さまが重い病気で、しにそうになっているではありませんか。三人はいそいでじゅうたんにのり、ひとっとびでお城へ。魔法のりんごをかがせると、お姫さまはたちまち元気になりました。",
"三つの宝ものは、どれがなくても、お姫さまはたすからなかったでしょう。そこで王さまは弓矢で勝負をさせ、いちばん遠くまで矢をとばした者を勝ちにしました。勝ったのは次男のアリ王子で、お姫さまとけっこんしました。",
"三男のアーメッド王子は、見えなくなるほど遠くへとんでいった自分の矢をさがしに行きました。そして矢をたどった先で、美しい妖精のパリ・バヌーに出会い、けっこんして、しあわせにくらしたということです。"
]},
{ cat:"arabian", title:"漁師と魔神", yomi:"りょうしとまじん", icon:"🧞", text:[
"むかし、まずしい年よりのりょうしがいました。ある日、海にあみをなげると、ずっしりと重いものがかかりました。ひきあげてみると、それは、ソロモン王のふういんがされた、しんちゅうのつぼでした。",
"「売れば、お金になるぞ」。りょうしがふたをあけると、つぼから、もくもくと黒いけむりが立ちのぼりました。けむりはみるみる大きな魔神のすがたになり、おそろしい声で言いました。「おまえの命をもらうぞ！」。",
"「なぜです！わたしはあなたをたすけたのに」。魔神は言いました。「わしは何百年もこのつぼにとじこめられていた。はじめのうちは、たすけてくれた者を大金持ちにしてやろうと思っていた。けれど、いつまでたってもだれもたすけに来ない。それでわしは、つぎにたすけた者の命をうばってやると、ちかったのだ」。",
"りょうしは、いっしょうけんめい考えて言いました。「わかりました。でも、さいごにひとつだけ教えてください。あなたのような大きな体が、こんな小さなつぼに入っていたなんて、とても信じられません」。",
"「なんだと？それならよく見ておれ！」。魔神はけむりになって、しゅるしゅるとつぼの中へもどっていきました。そのしゅんかん、りょうしはすばやくふたをしめてしまいました！",
"「出してくれ！出してくれたら、おまえを大金持ちにしてやる！」。魔神はつぼの中から、ひっしにたのみました。りょうしは魔神にかたいやくそくをさせてから、つぼをあけてやりました。魔神はやくそくどおり、ふしぎな湖へりょうしをあんないし、りょうしはそこでとれためずらしい魚のおかげで、ゆたかになったということです。"
]},

{ cat:"russia", title:"おおきなかぶ", icon:"🥬", sub:"ロシア", text:[
"おじいさんが、かぶのたねをまきました。「大きくなあれ、おいしくなあれ」。",
"かぶは、あまくて、とてつもなく大きなかぶになりました。おじいさんはかぶをぬこうとしました。「うんとこしょ、どっこいしょ」。ところが、かぶはぬけません。",
"おじいさんは、おばあさんをよんできました。おばあさんがおじいさんをひっぱって、おじいさんがかぶをひっぱって、「うんとこしょ、どっこいしょ」。それでも、かぶはぬけません。",
"おばあさんは、まごむすめをよんできました。まごがおばあさんを、おばあさんがおじいさんを、おじいさんがかぶをひっぱって、「うんとこしょ、どっこいしょ」。まだまだ、かぶはぬけません。",
"まごは、犬をよんできました。犬は、ねこをよんできました。みんなでひっぱっても、「うんとこしょ、どっこいしょ」。やっぱり、かぶはぬけません。",
"ねこは、ねずみをよんできました。ねずみがねこを、ねこが犬を、犬がまごを、まごがおばあさんを、おばあさんがおじいさんを、おじいさんがかぶをひっぱって……「うんとこしょ、どっこいしょ！」。とうとう、かぶは、すっぽーんとぬけました。"
]},
{ cat:"russia", title:"三匹のやぎのがらがらどん", yomi:"さんびきのやぎのがらがらどん", sub:"ノルウェー", icon:"🧌", text:[
"むかし、三びきのやぎがいました。三びきとも、名前は「がらがらどん」。山の草をおなかいっぱい食べて太ろうと、山へ出かけることにしました。",
"山へ行くとちゅうには谷川があり、橋をわたらなければなりません。その橋の下には、ぎょろりとした大きな目の、おそろしいトロルがすんでいました。",
"さいしょに、いちばん小さいやぎのがらがらどんが、とこ、とこ、と橋をわたりました。「だれだ、おれの橋をわたるのは！おまえを、ひとのみにしてやるぞ」「ぼくは小さいから、おいしくないよ。あとから、もっと大きいやぎが来るから、そっちにしてよ」「そうか。それなら、さっさと行け」。",
"つぎに、二番目のやぎのがらがらどんが、どこ、どこ、と橋をわたりました。トロルが出てくると、「あとから、もっと大きいやぎが来るよ」「そうか。それなら、さっさと行け」。",
"さいごに、大きいやぎのがらがらどんが、ドシン、ドシン、と橋をわたってきました。橋がきしむほどの重さです。「だれだ、おれの橋をわたるのは！」「おれだ！大きいやぎのがらがらどんだ！」。",
"大きいやぎはトロルにとびかかり、二本の大きなつのでつきとばし、ひづめでふみつけて、トロルを谷川へけおとしてしまいました。それから三びきは山へのぼり、草をたっぷり食べて、まるまると太ったということです。"
]},
{ cat:"russia", title:"バーバ・ヤーガ", sub:"ロシア", icon:"🧹", text:[
"むかし、まま母にいじめられている女の子がいました。ある日、まま母は言いました。「森のおばさんのところへ行って、針と糸をかりておいで」。そのおばさんとは、森にすむおそろしい魔女、バーバ・ヤーガのことだったのです。",
"女の子は、まず、やさしいほんとうのおばさんのところへ行って相談しました。おばさんは教えてくれました。「白かばの木がおまえの目をうとうとしたら、リボンでむすんでおやり。門がきいきい鳴ったら、油をさしておやり。犬にはパンを、ねこにはハムをあげなさい」。",
"森のおくには、にわとりの足の上に立って、くるくるまわるふしぎな小屋がありました。バーバ・ヤーガは女の子にはたおりの仕事をいいつけると、こっそりめしつかいに「おふろをわかしておくれ。あの子を洗ったら、食べてやる」と言いました。",
"女の子が、おなかをすかせたねこにハムをあげると、ねこは言いました。「ここにタオルとくしがあるよ。これを持ってにげなさい。魔女が追いかけてきたら、うしろになげるんだ」。ねこは、女の子のかわりにはたおりをつづけてくれました。",
"女の子がにげだすと、犬はパンのお礼にだまって通し、門は油のお礼にしずかにひらき、白かばはリボンのお礼に道をあけてくれました。気づいたバーバ・ヤーガは、うすにのり、きねでこぎながら、ものすごいいきおいで追いかけてきます。",
"女の子がタオルをなげると、大きな川があらわれました。魔女が川の水をのみほして追ってくると、こんどはくしをなげます。するとくしは、ふかい森になりました。魔女は森をぬけられず、引き返していきました。",
"家に帰った女の子がお父さんにすべてを話すと、お父さんはまま母を追い出し、女の子とふたりで、なかよくしあわせにくらしました。"
]},
{ cat:"russia", title:"火の鳥とイワン王子", yomi:"ひのとりとイワンおうじ", sub:"ロシア", icon:"✨", text:[
"むかし、ある国の王さまの庭に、金のりんごがなる木がありました。ところが毎晩、りんごがぬすまれます。三人の王子が見はりをすると、すえっ子のイワン王子が、りんごをついばみに来た、光りかがやく「火の鳥」を見つけました。火の鳥はにげましたが、イワンの手には、美しい羽が一まいのこりました。",
"王さまは火の鳥がほしくなり、三人の王子を旅に出しました。イワン王子が旅のとちゅうで、灰色のおおかみに馬を食べられてしまうと、おおかみは言いました。「おわびに、わたしがあなたをたすけましょう」。",
"おおかみはイワンをせなかにのせて、火の鳥のいる国へつれていってくれました。イワンが注意をわすれて失敗しても、おおかみは知恵をかして、火の鳥、金のたてがみの馬、そして美しいエレーナ姫を、つぎつぎに手に入れさせてくれました。",
"ところが帰り道、イワンがねむっていると、ふたりの兄がやってきて、イワンの命をうばい、宝ものとエレーナ姫をつれさってしまいました。",
