"経済を細かく中央から支配しようとすると、やがて人々の働き方や生き方まで国家が決める危険がある。",
"経済の自由と政治の自由の関係を考えた本です。"
]},
{ cat:"t_c20b", title:"啓蒙の弁証法", yomi:"けいもうのべんしょうほう", sub:"ホルクハイマー／アドルノ", author:"ホルクハイマー／アドルノ", icon:"🎬", text:[
"人間は、迷信から自由になるために科学や理性を発達させてきました。",
"「世界の仕組みを理解すれば、人間はもっと自由になれる」。それが啓蒙の理想でした。",
"ところがホルクハイマーとアドルノは、20世紀の戦争や大量虐殺を見て考えました。",
"「理性や科学が発達したのに、なぜこんなことが起きたのだろう」。",
"ものごとを効率よく管理する理性は、自然だけでなく、人間そのものまで数字や道具として管理する力になることがあります。",
"映画や音楽などの娯楽も、大量に同じ形で作られ、人々の考え方まで似せてしまうかもしれません。",
"人間を自由にするはずだった理性が、逆に支配の道具にもなる。その矛盾を考えた本です。"
]},
{ cat:"t_c20b", title:"大衆の反逆", yomi:"たいしゅうのはんぎゃく", sub:"ホセ・オルテガ・イ・ガセット", author:"ホセ・オルテガ・イ・ガセット", authorYomi:"オルテガ", icon:"👥", text:[
"近代になると、多くの人が教育を受け、便利な生活を送れるようになりました。",
"それ自体は大きな進歩です。",
"しかしオルテガは、その豊かさを「最初から当然に存在するもの」だと思う人が増えることを心配しました。",
"社会の制度や科学や文化は、多くの人が長い時間をかけて作ったものです。それなのに、その仕組みを理解しようともせず、「自分の望みは何でもかなえられて当然だ」と考える人を、オルテガは「大衆人」と呼びました。",
"ここでいう大衆とは、貧しい人という意味ではありません。",
"自分の考えを疑わず、学ぼうとせず、それでも社会へ強く要求する態度のことです。",
"便利な文明を維持するために必要な責任とは何かを考えた本です。"
]},
{ cat:"t_c20b", title:"技術社会", yomi:"ぎじゅつしゃかい", sub:"ジャック・エリュール", author:"ジャック・エリュール", icon:"🤖", text:[
"昔、人間は「この道具を使えば仕事が楽になる」と考えて技術を作りました。",
"では現代でも、人間が技術を自由に使っているだけなのでしょうか。",
"エリュールは、「いつの間にか、人間のほうが技術の都合に合わせて生きるようになっていないか」と考えました。",
"工場では、もっと速く、もっと効率よく生産することが求められます。会社も行政も学校も、「一番効率のよい方法」を探します。",
"すると、「それをすることは本当に幸せなのか」より、「できるだけ速く、効率よくできるか」が大切になってしまいます。",
"エリュールは、機械だけでなく、効率を最優先する考え方全体を「技術」として考えました。",
"人間が作った技術が、人間の生き方まで決め始める危険を考えた本です。"
]},
{ cat:"t_c20b", title:"象徴形式の哲学", yomi:"しょうちょうけいしきのてつがく", sub:"エルンスト・カッシーラー", author:"エルンスト・カッシーラー", icon:"🎌", text:[
"人間は、目の前にある世界を、そのまま受け取っているのでしょうか。",
"カッシーラーは、そうではないと考えました。",
"人間は言葉を使います。神話を作ります。絵を描きます。科学では数式を使います。",
"これらはすべて、世界に意味を与えるための「象徴」です。",
"たとえば、ただの布に色と模様をつければ「国旗」になります。その布そのものにはない意味を、人間が象徴として与えているのです。",
"カッシーラーは、人間を「理性的な動物」と呼ぶだけでは足りず、「象徴を作る動物」と考えました。",
"言語、神話、芸術、科学など、人間が作ったさまざまな象徴を通して、私たちが世界をどのように理解しているのかを考えた本です。"
]},
{ cat:"t_c20b", title:"科学革命の構造", yomi:"かがくかくめいのこうぞう", sub:"トマス・クーン", author:"トマス・クーン", icon:"🌍", text:[
"昔の人は、太陽や星が地球のまわりを回っていると考えていました。",
"ところが後になると、地球のほうが太陽のまわりを回っているという考えが広がります。",
"クーンは、「科学は、ただ新しい事実を一つずつ積み上げて進歩するだけではない」と考えました。",
"科学者たちは、ある時代ごとに「世界はだいたいこうできている」という共通の考え方を持っています。これを「パラダイム」と呼びました。",
"その考えでは説明できない事実が増えていくと、やがて大きな混乱が起こります。",
"そして、新しい見方が古い見方に取って代わります。これが「科学革命」です。",
"科学の歴史を、知識がまっすぐ増えていく物語ではなく、「世界の見方そのものが変わる歴史」として描いた本です。"
]},
{ cat:"t_c20b", title:"反方法", yomi:"はんほうほう", sub:"ポール・ファイヤアーベント", author:"ポール・ファイヤアーベント", icon:"💥", text:[
"科学には、「これさえ守れば必ず正しい発見ができる」という一つの方法があるのでしょうか。",
"ファイヤアーベントは、科学の歴史を調べながら、「実際にはそんなにきれいではない」と考えました。",
"ガリレオのような科学者も、現在の教科書に書かれている「正しい科学的方法」だけをまじめに守って発見したわけではありません。",
"ときには証拠がまだ弱い考えを押し出したり、昔の決まりを破ったりすることで新しい科学が生まれました。",
"そこでファイヤアーベントは、「一つの方法だけを絶対のルールにしてはいけない」と主張します。",
"科学を否定したのではなく、科学そのものを自由で創造的な活動として守ろうとしたのです。",
"「正しい方法は一つだけ」という考えを疑った、科学哲学の挑発的な本です。"
]},
{ cat:"t_c20b", title:"野生の思考", yomi:"やせいのしこう", sub:"クロード・レヴィ＝ストロース", author:"クロード・レヴィ＝ストロース", icon:"🌿", text:[
"昔、ヨーロッパの人々は、文字を使わない社会の人たちを「科学的に考えられない未開の人々」と見ることがありました。",
"レヴィ＝ストロースは、それは間違いだと考えました。",
"森で暮らす人々は、たくさんの植物や動物を細かく見分け、それぞれの特徴をよく知っています。",
"神話や儀式にも、ただのでたらめではなく、ものごとを分類し、対立させ、関係づける複雑な考え方があります。",
"西洋の科学と同じ方法ではなくても、人間の頭はさまざまな場所で高度な働きをしているのです。",
"レヴィ＝ストロースは、人間の文化の奥には、表面の違いをこえて似た「構造」があるのではないかと考えました。",
"「文明」と「未開」という簡単な区別を問い直し、人間の思考の普遍性を探った本です。"
]},
{ cat:"t_c20b", title:"監獄の誕生", yomi:"かんごくのたんじょう", sub:"ミシェル・フーコー", author:"ミシェル・フーコー", icon:"👁️", text:[
"昔のヨーロッパでは、罪を犯した人を大勢の前でひどく罰することがありました。",
"ところが時代が進むと、そうした罰は減り、代わりに人を監獄へ入れて生活を細かく管理するようになります。",
"フーコーは、「これは単に、人間にやさしい社会になったということなのだろうか」と考えました。",
"監獄では、いつ見られているか分からないように人を監視します。すると、だれも見ていないときでも、自分から規則を守るようになります。",
"フーコーは、同じような仕組みが学校や工場、病院、軍隊などにも広がっていると考えました。",
"人を力で押さえつけるだけではなく、「自分から規則に従う人間」を作ることも権力の一つの形なのだと示した本です。"
]},
{ cat:"t_c20b", title:"言葉と物", yomi:"ことばともの", sub:"ミシェル・フーコー", author:"ミシェル・フーコー", icon:"🗂️", text:[
"昔の人と今の人は、同じ世界を見て、同じように考えているのでしょうか。",
"フーコーは、「時代が変われば、ものごとの考え方そのものが変わる」と考えました。",
"ある時代には、世界のなかの似ているものを探すことが大切でした。別の時代には、ものを細かく分類することが大切になります。",
"そして近代になると、「人間とはどんな存在なのか」を研究する学問がたくさん生まれました。",
"でもフーコーは、「人間」という考え方そのものも、永遠に昔からあったわけではないと言います。",
"私たちが当たり前だと思っている「知識の形」も、ある時代に生まれたものかもしれない。知識の土台そのものに歴史があることを示そうとした本です。"
]},
{ cat:"t_c20b", title:"グラマトロジーについて", spine:"グラマトロジー|について", sub:"ジャック・デリダ", author:"ジャック・デリダ", icon:"✒️", text:[
"私たちは、「話し言葉のほうが本物で、書かれた文字はその写しだ」と考えがちです。",
"デリダは、「本当にそうだろうか」と疑いました。",
"話した言葉でも、相手に自分の考えが完全にそのまま伝わるとは限りません。一つの言葉には、前に使われた意味や、ほかの言葉との関係がたくさん入りこんでいます。",
"だから意味は、どこかに一つの完成した形で置かれているのではなく、言葉と言葉のあいだを動き続けているのではないかと考えました。",
"デリダは、哲学のなかにある「こちらが本物で、あちらは二番目」という分け方を一つずつ調べていきます。",
"当たり前に見える考えの組み立てをほどいてみる「脱構築」という考えにつながった本です。"
]},
{ cat:"t_c20b", title:"千のプラトー", yomi:"せんのプラトー", sub:"ジル・ドゥルーズ／フェリックス・ガタリ", author:"ジル・ドゥルーズ／フェリックス・ガタリ", icon:"🕸️", text:[
"一本の大きな木を想像してみましょう。",
"太い幹があり、そこから枝が分かれていきます。会社の組織図や学校の仕組みも、上から下へ枝分かれする木のように作られることがあります。",
"でもドゥルーズとガタリは、「世界は本当に木のようなものだけだろうか」と考えました。",
"地下であちこちにつながる草の根のように、中心がなく、どこからでも別のところへつながるものもあります。",
"二人は、それを「リゾーム」と呼びました。",
"人間の考え、文化、社会も、一つの中心からきれいに広がるとは限りません。たくさんのものが思いがけないところでつながります。",
"世界を一つの順番に並べるのではなく、無数のつながりとして考えようとした、とても自由な哲学書です。"
]},
{ cat:"t_c20b", title:"シミュラークルとシミュレーション", spine:"シミュラークルと|シミュレーション", sub:"ジャン・ボードリヤール", author:"ジャン・ボードリヤール", icon:"📸", text:[
"ある観光地へ行く前に、写真や動画を何百枚も見たとします。",
"実際にそこへ着いたとき、「写真で見たとおりだ」と感じるかもしれません。",
"では、自分は本当の場所を見ているのでしょうか。それとも、すでに頭のなかにある「写真のイメージ」と比べながら見ているのでしょうか。",
"ボードリヤールは、現代社会では、現実そのものよりも広告、テレビ、写真、記号などのイメージが強い力を持つようになったと考えました。",
"そして、もとの現実がなくても、本物らしく見えるコピーを「シミュラークル」と呼びました。",
"本物と偽物を簡単に分けられなくなった世界で、「現実とは何なのか」を問い直した本です。"
]},
{ cat:"t_c20b", title:"コミュニケーション的行為の理論", spine:"コミュニケーション|的行為の理論", yomi:"コミュニケーションてきこういのりろん", sub:"ユルゲン・ハーバーマス", author:"ユルゲン・ハーバーマス", icon:"💬", text:[
"二人の人が言い争っているとします。",
"一人が力ずくで相手を黙らせれば、話は終わります。でも、それで本当に納得し合ったとは言えません。",
"ハーバーマスは、人間にはもう一つの方法があると考えました。",
"お互いに理由を出し、「なぜそう思うのか」を話し合い、相手の意見も聞きながら、納得できる答えを探す方法です。",
"これを「コミュニケーション的行為」と考えました。",
"社会には、お金や権力で人を動かす仕組みもあります。でも、それだけでは人間らしい社会は作れません。",
"自由に話し合い、理由をたしかめ合うことによって、みんなで社会のルールを作っていく可能性を考えた本です。"
]},
{ cat:"t_c20b", title:"正義論", yomi:"せいぎろん", sub:"ジョン・ロールズ", author:"ジョン・ロールズ", icon:"🙈", text:[
"みんなで新しい国のルールを作ることになったとします。",
"ただし、自分がその国でどんな人として生まれるのかは分かりません。",
"お金持ちかもしれません。貧しい家庭かもしれません。健康かもしれないし、病気や障害があるかもしれません。",
"ロールズは、この状態を「無知のヴェール」の後ろにいると考えました。",
"自分がどんな立場になるか分からなければ、「お金持ちだけが得をする制度にしよう」とは言いにくくなります。",
"そこで人々は、だれにでも基本的な自由を認め、もし社会に差があるとしても、恵まれない人にも利益があるような制度を選ぶのではないか。",
"自分の立場をいったん忘れて、「公平な社会とは何か」を考えるための有名な思考実験を示した本です。"
]},
{ cat:"t_c20b", title:"アナーキー・国家・ユートピア", spine:"アナーキー・|国家・ユートピア", yomi:"アナーキー・こっか・ユートピア", sub:"ロバート・ノージック", author:"ロバート・ノージック", icon:"🧾", text:[
"ロールズは、公平な社会を作るために、社会のなかの格差をある程度調整する必要があると考えました。",
"ノージックは、そこに疑問を持ちました。",
"もしAさんが正しく働いてお金を得て、そのお金を自分の意思でBさんに渡したなら、その結果としてBさんがお金持ちになっても、それは不公平なのでしょうか。",
"ノージックは、「結果が同じかどうか」よりも、「その財産をどのように手に入れたか」が大切だと考えました。",
"国が人々のお金をたくさん集めて再分配しすぎれば、個人の自由を傷つけることもあります。",
"だから国家の仕事は、安全や契約を守ることなど、できるだけ小さくするべきだと主張しました。",
"自由と平等をどこまで両立させるべきかを考えた本です。"
]},
{ cat:"t_c20b", title:"正義とは何か", yomi:"せいぎとはなにか", sub:"マイケル・サンデル", author:"マイケル・サンデル", icon:"🚃", text:[
"暴走した電車が五人の人へ向かっています。",
"レバーを動かせば、別の線路へ進み、一人だけが犠牲になります。あなたならどうするでしょう。",
"サンデルは、こうした身近な思考実験から、「正義とは何か」を考えていきます。",
"五人を助けられるなら一人を犠牲にしてよいという考えもあります。一人ひとりの権利は計算できないという考えもあります。",
"さらに、自由に選べることが大切なのか、それとも人間としてよい生き方を考えるべきなのかという問題にも進みます。",
"この本は、一つの答えをすぐに教える本ではありません。",
"さまざまな哲学者の考えを比べながら、「自分ならなぜそう考えるのか」を読者自身に問いかける哲学の入門書です。"
]},
{ cat:"t_c20b", title:"徳なき時代", yomi:"とくなきじだい", sub:"アラスデア・マッキンタイア", author:"アラスデア・マッキンタイア", icon:"🧱", text:[
"ある世界で、科学について書かれた本が全部ばらばらに破れてしまったとします。",
"後の人たちは、残った言葉を集めて「電子」「重力」「実験」と話します。でも、本来どうつながっていたのかは分かりません。",
"マッキンタイアは、現代の道徳も少し似ていると考えました。",
"私たちは「自由」「権利」「正義」という言葉を使いますが、それぞれの考えが別々になり、みんなで共有できる土台がなくなっているのではないかというのです。",
"そこで彼は、アリストテレスの「徳」に注目しました。",
"よい人間になるには、ルールだけでなく、勇気や誠実さのような性格を、共同体のなかで育てることが必要です。",
"「よい人生とは何か」をもう一度考え直そうとした本です。"
]},
{ cat:"t_c20b", title:"動物の解放", yomi:"どうぶつのかいほう", sub:"ピーター・シンガー", author:"ピーター・シンガー", icon:"🐄", text:[
"人間が痛いことをされたら、「かわいそうだからやめるべきだ」と考えます。",
"では、犬や豚や鶏が痛みを感じているときはどうでしょう。",
"シンガーは、「人間ではないという理由だけで、その苦しみを軽く扱ってよいのだろうか」と問いかけました。",
"大切なのは、人間か動物かではなく、「苦しみを感じることができるかどうか」だと考えます。",
"人間という種類だけを特別に扱うことを、シンガーは「種差別」と呼びました。",
"そして、食べものや実験のために動物を使うとき、その苦しみを本当に正当化できるのかを考えるべきだと主張します。",
"道徳の範囲を人間だけから動物へ広げようとした、現代倫理学の重要な本です。"
]},
{ cat:"t_c20b", title:"ジェンダー・トラブル", sub:"ジュディス・バトラー", author:"ジュディス・バトラー", icon:"👗", text:[
"社会には、「男らしい行動」「女らしい行動」という言葉があります。",
"バトラーは、「その『らしさ』は、どこから来るのだろう」と考えました。",
"人は小さいころから、服装や話し方、しぐさなどについて、「男ならこう」「女ならこう」と教えられることがあります。",
"すると、それを何度もくり返すうちに、まるで最初から自然にそうだったように見えてきます。",
"バトラーは、ジェンダーはただ身体から自動的に決まるものではなく、社会のなかでくり返される行動によって作られる面があると考えました。",
"「男」「女」という当たり前に見える分け方も、本当にそれほど単純なのか。",
"性別や社会の決まりを、根本から問い直した本です。"
]},
{ cat:"t_c20b", title:"心・脳・科学", yomi:"こころ・のう・かがく", sub:"ジョン・サール", author:"ジョン・サール", icon:"🧠", text:[
"人間の頭のなかには脳があります。",
"脳は細胞からできています。それなのに、私たちは「赤いな」「痛いな」「悲しいな」と感じます。",
"サールは、「ただの物質である脳から、どうして心が生まれるのだろう」と考えました。",
"彼は、心を身体から完全に別のものにする考えにも、心をただのコンピューター計算とみなす考えにも疑問を持ちました。",
"脳の働きから意識は生まれます。しかし、意識には「自分にはこう感じられる」という特別な性質があります。",
"コンピューターが言葉を正しく並べられたからといって、本当に意味を理解しているとは限りません。",
"心と脳と人工知能の関係を、分かりやすく考えた本です。"
]},
{ cat:"t_c20b", title:"意識する心", yomi:"いしきするこころ", sub:"デイヴィッド・チャーマーズ", author:"デイヴィッド・チャーマーズ", icon:"🧟", text:[
"脳のなかで何が起きているかを、全部説明できたとします。",
"光が目に入り、脳のどこが活動し、手がどう動くかまで分かりました。",
"でもチャーマーズは、「それでも一つ問題が残る」と考えました。",
"なぜ、そこに「赤く見える感じ」や「痛い感じ」が生まれるのでしょう。",
"脳の働きを説明することと、「自分にはこう感じられる」という意識そのものを説明することは、同じではないのではないか。",
"チャーマーズは、この問題を「意識のハード・プロブレム」と呼びました。",
"人間とまったく同じように動くのに、心のなかでは何も感じていない「哲学的ゾンビ」まで想像しながら、意識とは何かを考えた本です。"
]},
{ cat:"t_c20b", title:"語と対象", yomi:"ごとたいしょう", sub:"W・V・O・クワイン", author:"W・V・O・クワイン", icon:"🐇", text:[
"知らない国へ行き、現地の言葉を一つも知らない人を想像してみましょう。",
"目の前をウサギが走ったとき、現地の人が「ガヴァガイ！」と言いました。",
"「ガヴァガイはウサギという意味だ」と思うかもしれません。",
"でも本当にそうでしょうか。「白いもの」という意味かもしれません。「ウサギが走った」という意味かもしれません。",
"クワインは、一つの言葉の意味を、完全に一つだけに決めることは難しいと考えました。",
"さらに、人間の知識は一つ一つ独立しているのではなく、大きな網のようにつながっています。",
"何か一つの経験が変われば、網のどこを直すかにはいくつもの方法があります。",
"言葉、意味、知識の関係を根本から問い直した本です。"
]},
{ cat:"t_c20b", title:"心の概念", yomi:"こころのがいねん", sub:"ギルバート・ライル", author:"ギルバート・ライル", icon:"👻", text:[
"デカルト以来、「身体のなかには、身体とは別の心が入っている」と考える人がいました。",
"まるで身体が機械で、そのなかに見えない幽霊が乗っているような考えです。",
"ライルは、これを「機械の中の幽霊」と呼んで批判しました。",
"たとえば「この人は賢い」と言うとき、頭のなかに「賢さ」という物が入っているという意味ではありません。",
"難しい問題をうまく解いたり、失敗から学んだりする行動全体を見て、「賢い」と言っているのです。",
"心を、身体とは別の不思議な物として考えるから問題が難しくなるのではないか。",
"「心」という言葉を私たちが実際にどう使っているのかを調べ直した本です。"
]},
{ cat:"t_c20b", title:"哲学とは何か", yomi:"てつがくとはなにか", sub:"ジル・ドゥルーズ／フェリックス・ガタリ", author:"ジル・ドゥルーズ／フェリックス・ガタリ", icon:"🛠️", text:[
"哲学者は、何をする人なのでしょう。",
"昔の人が出した答えを覚える人でしょうか。それとも、世界の正しい答えを見つける人でしょうか。",
"ドゥルーズとガタリは、「哲学とは、概念をつくる仕事だ」と考えました。",
"たとえば昔にはなかった問題が生まれれば、それを考えるための新しい言葉や考え方が必要になります。",
"科学は世界の法則を調べ、芸術は感覚や表現をつくります。そして哲学は、ものごとを考えるための「概念」を発明します。",
"だから哲学は、昔の偉い人の答えを暗記するだけの学問ではありません。",
"まだうまく考えられない問題に出会ったとき、新しい考え方そのものを作り出す。それが哲学なのだと二人が考えた本です。"
]},
{ cat:"t_japan", title:"三教指帰", yomi:"さんごうしいき", sub:"空海", author:"空海", authorYomi:"くうかい", icon:"🗻", text:[
"若い空海は、「人は、どんな生き方をすればよいのだろう」と悩みました。",
"当時の日本には、儒教や道教、仏教など、いろいろな教えが伝わっていました。",
"そこで空海は、三人の人物を登場させ、それぞれの教えを語らせます。",
"儒教は、家族や社会のなかで立派に生きることを教えます。道教は、世の中の欲から離れることを説きます。そして仏教は、人間の苦しみそのものから抜け出す道を示します。",
"空海は、それぞれの教えを比べながら、最後には仏教がもっとも深いところまで人を導くと考えました。",
"「何を学び、どう生きるべきか」という自分自身の迷いを、一つの物語にして考えた若き空海の思想書です。"
]},
{ cat:"t_japan", title:"正法眼蔵", yomi:"しょうぼうげんぞう", sub:"道元", author:"道元", authorYomi:"どうげん", icon:"🪷", text:[
"道元は、中国で禅を学んで日本へ帰ってきました。",
"そして、「仏になるためには、いったい何をすればよいのだろう」と考えました。",
"普通なら、「修行をすれば、いつか悟りというゴールに着く」と考えます。",
"でも道元は、座禅をしているその行いそのものが、すでに悟りと切り離せないと考えました。",
"また、「自分とは何か」を考えるときにも、不思議なことを言います。",
"自分を本当に学ぶとは、自分のことばかり考えるのではなく、やがて自分を忘れ、世界のすべてとつながっていることに気づくことだというのです。",
"時間、生と死、自己、自然について、禅の立場から深く考え続けた日本思想最大級の本です。"
]},
{ cat:"t_japan", title:"歎異抄", yomi:"たんにしょう", sub:"唯円", author:"唯円", authorYomi:"ゆいえん", icon:"📿", text:[
"親鸞という僧は、「立派な人だけが救われるのではない」と教えました。",
"その言葉を弟子の唯円がまとめたとされるのが『歎異抄』です。",
"なかでも有名なのが、「善人なおもて往生をとぐ、いわんや悪人をや」という言葉です。",
"これは「悪いことをすればするほどよい」という意味ではありません。",
"自分を「私は正しい人間だから、自分の力で救われる」と思っている人よりも、自分の弱さや間違いを知り、「自分一人の力だけではどうにもならない」と気づいた人のほうが、阿弥陀仏の救いに身を任せることができるという考えです。",
"人間の善悪や弱さ、救われるとは何かを、短い言葉で深く考えた本です。"
]},
{ cat:"t_japan", title:"翁問答", yomi:"おきなもんどう", sub:"中江藤樹", author:"中江藤樹", authorYomi:"なかえとうじゅ", icon:"👴", text:[
"ある人が、「立派な人になるには、難しい本をたくさん読まなければならないのでしょうか」と尋ねたとします。",
"中江藤樹は、知識だけでは足りないと考えました。",
"人間の心には、もともと「これはよい」「これはよくない」と感じる力があります。それを「良知」と考えます。",
"でも、自分の欲や思い込みが強くなると、その心の声が聞こえにくくなります。",
"だから毎日の生活のなかで、親を大切にし、人に誠実に接し、自分の心をよく見つめることが必要です。",
"難しい学問を知っているだけではなく、知ったことを本当に行動に移す。",
"「よい心」と「よい行い」を一つにしようとした、日本の陽明学を代表する思想書です。"
]},
{ cat:"t_japan", title:"都鄙問答", yomi:"とひもんどう", sub:"石田梅岩", author:"石田梅岩", authorYomi:"いしだばいがん", icon:"🧮", text:[
"江戸時代、商人は品物を安く買い、高く売って利益を得ていました。",
"それを見て、「商人はお金のことばかり考えていて、卑しい仕事なのではないか」と言う人もいました。",
"石田梅岩は、「本当にそうだろうか」と考えました。",
"農民には農民の仕事があり、職人には職人の仕事があります。商人も、必要なものを必要な場所へ運び、社会を支える大切な仕事をしています。",
"正直に商売をし、相手をだまさず、必要以上に欲張らなければ、利益を得ることそのものは悪いことではありません。",
"どんな仕事にも、その仕事をきちんと果たす道徳がある。",
"商売と人としての正しい生き方を結びつけた、江戸時代の実践的な思想書です。"
]},
{ cat:"t_japan", title:"古事記伝", yomi:"こじきでん", sub:"本居宣長", author:"本居宣長", authorYomi:"もとおりのりなが", icon:"⛩️", text:[
"本居宣長は、日本最古の物語の一つである『古事記』を何十年もかけて研究しました。",
"当時の日本では、中国から伝わった儒教や仏教の考え方が強い影響を持っていました。",
"宣長は、「そうした外国の考え方が入る前、日本の人々はどんな心で世界を見ていたのだろう」と考えます。",
"そこで、昔の言葉の意味を一つずつ調べ、『古事記』をできるだけ当時の感覚で読もうとしました。",
"人間は理屈だけで生きるのではありません。花が散るのを見て寂しく思ったり、人の死を悲しんだりします。",
"宣長は、そうしたものに心を動かされる感覚を大切にしました。",
"日本人の古い言葉と感情から、日本独自のものの見方を探ろうとした大きな研究です。"
]},
{ cat:"t_japan", title:"善の研究", yomi:"ぜんのけんきゅう", sub:"西田幾多郎", author:"西田幾多郎", authorYomi:"にしだきたろう", icon:"🎵", text:[
"西田幾多郎は、「自分が何かを見るとき、心と世界は最初から二つに分かれているのだろうか」と考えました。",
"たとえば、美しい音楽に夢中になっているとき、「いま自分が音を聞いている」と考えるより先に、ただ音楽そのものを経験している瞬間があります。",
"西田は、まだ「見る自分」と「見られるもの」に分かれる前の経験を「純粋経験」と呼びました。",
"私たちはあとから、「これは自分の心だ」「これは外の世界だ」と分けて考えます。",
"でも、そのもっと前には、自分と世界が一つになったような経験があるのではないか。",
"西洋哲学を学びながら、禅など東洋の考え方とも結びつけ、日本独自の哲学を作ろうとした本です。"
]},
{ cat:"t_japan", title:"「いき」の構造", yomi:"「いき」のこうぞう", sub:"九鬼周造", author:"九鬼周造", authorYomi:"くきしゅうぞう", icon:"👘", text:[
"江戸の町には、「いきな人」という言い方がありました。",
"でも「いき」とは、ただおしゃれだったり、格好よかったりすることなのでしょうか。",
"九鬼周造は、この日本独特の言葉を、哲学の方法で細かく調べました。",
"たとえば、だれかに少し心をひかれながらも、べったりとは近づきすぎない。その距離のなかに「媚態」があります。",
"さらに、自分の誇りを失わない「意気地」と、ものごとに執着しすぎない「諦め」が重なります。",
"九鬼は、こうした複数の感覚が合わさったものを「いき」と考えました。",
"何気なく使っている一つの日本語のなかから、江戸の文化や人間の生き方を読み取ろうとした、とても珍しい哲学書です。"
]},
{ cat:"t_japan", title:"倫理学", yomi:"りんりがく", sub:"和辻哲郎", author:"和辻哲郎", authorYomi:"わつじてつろう", icon:"🤲", text:[
"「人間」という言葉を見て、和辻哲郎は考えました。",
"「人」と「間」と書きます。",
"人間は、一人だけで完全に独立して生きる存在ではありません。家族、友だち、会社、町、国など、いつも誰かとの「間」に生きています。",
"だから、自分の好きなことだけをすればよいわけでもありません。",
"しかし、集団のために自分を全部消してしまえばよいわけでもありません。",
"一人の自分と、みんなとのつながり。その二つのあいだを行ったり来たりしながら生きるところに、人間の倫理があると和辻は考えました。",
"「人はどう生きるべきか」を、一人きりの個人ではなく、人と人との関係から考えた日本倫理学の代表作です。"
]},
{ cat:"t_japan", title:"懺悔道としての哲学", yomi:"ざんげどうとしてのてつがく", sub:"田辺元", author:"田辺元", authorYomi:"たなべはじめ", icon:"🙇", text:[
"哲学者は、理性を使えば何でも理解できるのでしょうか。",
"田辺元は、そうではないと考えるようになりました。",
"人間は間違えます。そして、自分の頭だけではどうしても解決できない問題に出会うことがあります。",
"そこで大切になるのが「懺悔」です。",
"ただ「ごめんなさい」と言うだけではありません。「自分の力だけで何でもできると思っていたことそのものが間違いだった」と気づき、自分を根本から変えることです。",
"田辺は、自分の力が行きづまったところで、他者や大きな力によってもう一度生き直す道が開かれると考えました。",
"哲学を、頭だけで考える学問ではなく、自分自身が変わる道として考えた本です。"
]},
{ cat:"t_japan", title:"宗教とは何か", yomi:"しゅうきょうとはなにか", sub:"西谷啓治", author:"西谷啓治", authorYomi:"にしたにけいじ", icon:"🌌", text:[
"西谷啓治は、「人生には本当の意味があるのだろうか」という問題を考えました。",
"もし「何をしても最後には死ぬ」とだけ考えれば、すべてがむなしく見えることがあります。",
"これが「ニヒリズム」という問題です。",
"西谷は、ニーチェやハイデガーの哲学を学びながら、仏教の「空」という考えへ進みました。",
"空とは、「何もないから全部むだだ」という意味ではありません。",
"自分もほかのものも、一人で独立して存在しているのではなく、すべてが関係し合って存在しているという見方です。",
"「自分だけ」を中心に世界を見るところから離れると、今までとは違った世界が見えてくる。",
"西洋哲学と仏教を出会わせ、虚無をどう乗り越えるかを考えた本です。"
]},
{ cat:"t_japan", title:"共同幻想論", yomi:"きょうどうげんそうろん", sub:"吉本隆明", author:"吉本隆明", authorYomi:"よしもとたかあき", icon:"🌫️", text:[
"国、家族、社会。これらは、目で見たり手で触ったりできる物そのものではありません。",
"それでも私たちは、「日本という国がある」「この人たちは家族だ」と考え、それに大きな意味を感じています。",
"吉本隆明は、こうした人々が共同で信じているものを「共同幻想」と呼びました。",
"幻想というと、「ただの嘘」のように聞こえます。",
"でも、みんながそれを信じて行動すれば、実際に社会を動かす大きな力になります。",
"吉本は、一人の心のなかにある幻想、男女など二人のあいだにある幻想、社会全体が共有する幻想を分けながら考えました。",
"国家や家族が、どうして人の心にこれほど強い力を持つのかを考えた、戦後日本を代表する思想書です。"
]},
{ cat:"t_japan", title:"世界の共同主観的存在構造", spine:"世界の共同主観的|存在構造", yomi:"せかいのきょうどうしゅかんてきそんざいこうぞう", sub:"廣松渉", author:"廣松渉", authorYomi:"ひろまつわたる", icon:"💴", text:[
"目の前に一つの机があります。",
"自分には机に見えます。そして、隣の人にも机に見えます。",
"では、この「みんなに同じ机が見えている世界」は、どうやって成り立っているのでしょう。",
"廣松渉は、世界を「一人の自分」と「その外にある物」という二つだけに分ける考えに疑問を持ちました。",
"私たちは最初から、ほかの人たちと共有している意味のなかで世界を見ています。",
"一枚の紙も、お金として見れば千円札になり、試験用紙として見れば答案になります。",
"ものは、ただそこにあるだけではなく、人と人との関係のなかで意味を持ちます。",
"「私が見る世界」ではなく、「私たちがともに生きている世界」がどう成り立つのかを考えた難しい哲学書です。"
]},
{ cat:"t_japan", title:"トランスクリティーク", sub:"柄谷行人", author:"柄谷行人", authorYomi:"からたにこうじん", icon:"🔄", text:[
"カントは、「人間は何を知ることができるか」を考えました。",
"マルクスは、「資本主義社会はどう動いているか」を考えました。",
"柄谷行人は、この二人を一緒に読んだら、新しいことが見えるのではないかと考えました。",
"人間は会社で働く「労働者」であるだけではありません。店に行けば、何を買うかを選ぶ「消費者」にもなります。",
"また社会には、お金を使った交換だけでなく、贈り物、助け合い、国家による分配など、いろいろな交換の仕組みがあります。",
"柄谷は、資本、国家、共同体がどう結びついているのかを考え、その外に別の社会の可能性がないかを探りました。",
"カントとマルクスを行き来しながら、現代社会を新しい角度から考えた本です。"
]},
{ cat:"t_japan", title:"存在論的、郵便的", yomi:"そんざいろんてき、ゆうびんてき", sub:"東浩紀", author:"東浩紀", authorYomi:"あずまひろき", icon:"📮", text:[
"手紙を一通送ったとします。",
"相手にちゃんと届くと思って送ります。でも、住所を間違えたり、途中でなくなったり、別の人に届いたりすることもあります。",
"東浩紀は、この「誤配」という出来事を大切に考えました。",
"私たちは言葉を使うとき、「自分の言いたいことが、そのまま相手に届く」と思いがちです。",
"でも実際には、言葉は思わぬ意味に受け取られたり、別の場所へ広がったりします。",
"東はデリダの哲学を読みながら、「意味や情報は、完全に送り手の思いどおりにはならない」ということを考えました。",
"失敗やずれは、ただの邪魔ではありません。思いがけない新しいつながりを作ることもあります。",
"人間のコミュニケーションを「正しく届くこと」だけではなく、「間違って届く可能性」から考えた現代日本哲学の本です。"
]},
/* ======================================================
   まんがの 本
====================================================== */
{ cat:"m_sf", title:"鉄腕アトム", yomi:"てつわんアトム", sub:"手塚治虫", author:"手塚治虫", authorYomi:"てづかおさむ", icon:"🤖", text:[
"遠い未来、人間とロボットがいっしょにくらす時代がやってきました。",
"科学者の天馬博士には、トビオという大切なひとり息子がいました。ところがトビオは交通事故で死んでしまいます。悲しみにくれた天馬博士は、「もう一度、息子に会いたい」と考え、トビオそっくりの少年型ロボットをつくりました。それが、のちのアトムです。",
"アトムには、人間のような心と、10万馬力の力、空を飛ぶジェット、するどい目や耳など、すばらしい能力がそなわっていました。しかし、ロボットなので、いつまでたっても体は大きくなりません。天馬博士はしだいに「この子は本当のトビオではない」と思うようになり、アトムを手ばなしてしまいました。",
"やがてアトムは、お茶の水博士に助けられます。博士はアトムをひとりの子どものように大切にし、学校にも通わせました。",
"それからアトムは、人間をおそう悪いロボットや犯罪者、宇宙からやってきた敵などと戦うようになります。しかし、いつも「ロボットをこわせばいい」と考えるわけではありません。敵にも心があるのではないか、人間とロボットは仲よくできないのか、と悩みながら戦います。",
"アトムの物語には一つだけの大きな結末があるわけではなく、たくさんの事件や出会いがえがかれます。その中でアトムは、人間とロボットのあいだに立ちながら、命や心とはなんなのかを問いつづけていきます。"
]},
{ cat:"m_fantasy", title:"火の鳥", yomi:"ひのとり", sub:"手塚治虫", author:"手塚治虫", authorYomi:"てづかおさむ", icon:"🔥", text:[
"むかしから未来まで、世界のどこかには「火の鳥」とよばれる不思議な鳥がいました。",
"火の鳥は、何百年、何千年たっても死なないといわれています。そして、その血を飲んだ人間も永遠の命を手に入れられる、という伝説がありました。",
"そのため、さまざまな時代の人々が火の鳥を追い求めます。",
"古代の王は、「永遠に生きたい」と願って火の鳥をつかまえようとします。ある人は愛する人を救うために、ある人は自分が死ぬことをおそれて、火の鳥の力を求めます。",
"ところが、永遠に生きられることは、かならずしも幸せではありません。",
"自分だけが生きつづけ、家族や友だちが次々に死んでいくこともあります。何百年もひとりぼっちで生きなければならないこともあります。「死にたくない」と願ったために、かえって長い苦しみを味わう人もいました。",
"物語は、日本の古代から遠い未来、宇宙の時代まで大きく行き来します。それぞれの物語に別の主人公が登場しますが、どの時代にも火の鳥があらわれ、人間たちを見つめています。",
"人は生まれ、死に、また新しい命が生まれます。",
"『火の鳥』は、そうしたたくさんの人生を通して、「命とはなんだろう」「人はなぜ生きるのだろう」という大きな問いをえがいた物語です。"
]},
{ cat:"m_drama", title:"ブラック・ジャック", sub:"手塚治虫", author:"手塚治虫", authorYomi:"てづかおさむ", icon:"🩺", text:[
"ブラック・ジャックという、世界でも指折りの腕を持つ外科医がいました。",
"黒い服を着て、顔には大きな傷あとがあります。医者としての正式な免許は持っていません。そのため、病院ではなく、自分の家などでひそかに患者を治療していました。",
"ブラック・ジャック自身も、子どものころに大きな事故にあいました。体をひどく傷つけましたが、すぐれた医者の手術によって命を助けられます。その経験から、「自分も人の命を救う医者になろう」と決めたのでした。",
"彼のところには、ほかの医者から「もう助かりません」と言われた患者がやってきます。",
"ブラック・ジャックは言います。",
"「治してほしいなら、3000万円だ」",
"あまりにも高いお金を要求することがあります。そのため、冷たい医者だと思われることもありました。",
"けれども、お金がないからといって、本当に患者を見捨てるわけではありません。命を大切にする人からはお金を取らなかったり、逆に、命をお金で買えると思っている人にはきびしい態度を取ったりします。",
"家では、ピノコという小さな女の子といっしょにくらしています。ピノコはブラック・ジャックが手術によって助けた、とても不思議な生まれ方をした女の子です。",
"さまざまな患者を治しながら、ブラック・ジャックは何度も考えます。",
"「医者は人を治せても、人の運命まで変えられるのだろうか」",
"病気を治すこと、命を救うこと、そして死ぬこと。その意味を問いつづける物語です。"
]},
{ cat:"m_fantasy", title:"リボンの騎士", yomi:"リボンのきし", sub:"手塚治虫", author:"手塚治虫", authorYomi:"てづかおさむ", icon:"🎀", text:[
"シルバーランドという国に、サファイアという王女が生まれました。",
"ところが、この国では男の子しか王さまになることができません。そのため、王さまと王妃さまは、サファイアを男の子ということにして育てることにしました。",
"こうしてサファイアは、王女でありながら「王子」としてくらすことになります。",
"じつはサファイアには、もっと大きな秘密がありました。",
"生まれる前、天使のチンクがまちがえて、「男の子の心」と「女の子の心」の二つをサファイアに与えてしまったのです。",
"サファイアは、王子として剣を持ち、馬に乗り、国を守ります。その一方で、美しいドレスを着たり、フランツ王子に恋をしたりする、ひとりの少女でもありました。",
"しかし、王位をうばおうとするジュラルミン大公たちは、サファイアが本当は女の子なのではないかと疑います。秘密がばれれば、サファイアは王位を失ってしまいます。",
"サファイアは何度も危険な目にあいながら、剣を手にして悪者たちと戦います。",
"やがて正体を知られてしまったり、国を追われたり、大切な人と引きはなされたりします。それでもサファイアはあきらめません。",
"長い戦いのすえ、サファイアは自分の国を取りもどし、フランツ王子とも心を通わせます。",
"王子としての強さと、王女としてのやさしさ。その両方を持ったサファイアが、自分らしく生きようとする物語です。"
]},
{ cat:"m_fantasy", title:"ジャングル大帝", yomi:"ジャングルたいてい", sub:"手塚治虫", author:"手塚治虫", authorYomi:"てづかおさむ", icon:"🦁", text:[
"アフリカのジャングルに、パンジャという白いライオンの王さまがいました。",
"パンジャは動物たちを守る強くてやさしい王でした。しかし、人間のハンターにねらわれ、命を落としてしまいます。パンジャの妻エライザも人間につかまり、船で遠い国へ運ばれることになりました。",
"その船の中で、白いライオンの赤ちゃんが生まれます。",
"名前はレオ。",
"母のエライザはレオに言いました。",
"「あなたはジャングルへ帰り、お父さんのあとをつぐのです」",
"レオは海へ飛びこみ、長い旅のすえ、生まれ故郷のアフリカへ帰ります。",
"けれども、レオは人間の世界も知っていました。そのため、「人間はみんな悪い」とは思いません。",
"動物たちが争えば仲直りさせ、人間と動物がぶつかれば、なんとかいっしょに生きる方法を考えます。",
"やがてレオは大人になり、ライヤという雌ライオンと家族をつくります。そして父パンジャと同じように、ジャングルを守る立派な王になっていきます。",
"しかし自然の世界には、きびしい出来事も待っています。",
"仲間を守るためには、自分の命をかけなければならないこともあります。",
"レオは最後まで、自分だけのためではなく、ほかの命のために生きようとします。",
"人間と動物、文明と自然が、どうすればともに生きていけるのかをえがいた物語です。"
]},
{ cat:"m_history", title:"どろろ", sub:"手塚治虫", author:"手塚治虫", authorYomi:"てづかおさむ", icon:"👹", text:[
"むかし、日本が戦であれていたころ、醍醐景光という武士がいました。",
"景光は「もっと大きな力がほしい」と願い、48体の魔物に取引をもちかけました。",
"「わしに力をくれるなら、生まれてくるわが子の体を好きにしてよい」",
"やがて男の子が生まれました。",
"しかし赤ん坊には、目や耳、手足など、体の多くがありませんでした。魔物たちが、それぞれ体の一部をうばっていたのです。",
"父親は赤ん坊を捨ててしまいます。",
"ところが赤ん坊は、医者の寿海にひろわれました。寿海は義手や義足、人工の目などをつくり、その子を育てます。",
"少年は「百鬼丸」と名づけられました。",
"百鬼丸は、自分の体を取りもどすため、魔物をたおす旅に出ます。魔物を一体たおすたびに、目や耳、手足などが少しずつもどってくるのです。",
"旅の途中で、どろろという小さな泥棒と出会います。",
"どろろは口が達者で、元気いっぱいです。二人はけんかをしながらも、いっしょに旅をするようになります。",
"やがて百鬼丸は、自分の体を魔物に差し出したのが実の父親だったことを知ります。",
"自分の体を取りもどせば、父の国がほろびるかもしれない。",
"それでも、自分の命や体は自分のものです。",
"百鬼丸は苦しみながらも魔物との戦いをつづけ、どろろもまた、自分の人生を歩んでいきます。"
]},
{ cat:"m_history", title:"ブッダ", sub:"手塚治虫", author:"手塚治虫", authorYomi:"てづかおさむ", icon:"🪷", text:[
"むかしのインドには、生まれた家や身分によって、人の一生が大きく決まってしまう社会がありました。",
"そのころ、シャカ族の王子としてシッダルタという少年が生まれます。",
"シッダルタは王宮で何不自由なく育ちました。しかし、外の世界へ出たとき、病気で苦しむ人、年をとった人、死んだ人を目にします。",
"「人はどんなに幸せでも、いつか病気になり、年をとり、死んでしまう。それなら、本当の幸せとはなんなのだろう」",
"シッダルタは悩みはじめます。",
"やがて妻や子ども、王子としての生活を残し、真理を探す旅へ出ました。",
"森で修行をし、食べるものをほとんど口にしないほど自分を苦しめます。しかし、苦しめば答えが見つかるわけではありませんでした。",
"そこでシッダルタは、極端なぜいたくも、極端な苦行もやめます。",
"そして菩提樹の下で深く考えつづけ、ついに大きな悟りを開きました。",
"それから人々は、彼を「ブッダ」、つまり「目覚めた人」と呼ぶようになります。",
"ブッダは旅をしながら、人の苦しみや欲、怒り、悲しみについて説いていきます。",
"王さまも、貧しい人も、身分の低い人も、人としての命に違いはない。",
"たくさんの人との出会いと別れを経験しながら、ブッダは最後まで、人間が苦しみから自由になる道を伝えつづけました。"
]},
{ cat:"m_history", title:"アドルフに告ぐ", yomi:"アドルフにつぐ", sub:"手塚治虫", author:"手塚治虫", authorYomi:"てづかおさむ", icon:"📰", text:[
"第二次世界大戦が近づいていたころ、日本人記者の峠草平はドイツのベルリンにいました。",
"そこで弟が、なぞの死をとげます。",
"弟は死ぬ前に、とても危険な秘密を知っていました。",
"それは、ドイツの独裁者アドルフ・ヒトラーの出生にかかわる秘密でした。この情報が広まれば、「純粋な民族」を重んじるナチスにとって大きな問題になります。",
"そのころ日本の神戸には、二人の少年がいました。",
"ひとりは、ドイツ人の父と日本人の母を持つアドルフ・カウフマン。",
"もうひとりは、ユダヤ人のアドルフ・カミルです。",
"二人は親友でした。",
"しかしカウフマンはドイツへ送られ、ナチスの教育を受けます。",
"「ユダヤ人は敵だ」",
"そう教えこまれたカウフマンは、だんだんと昔の自分とは変わっていきます。",
"一方、カミルやその家族は、ユダヤ人であるというだけで命をねらわれます。",
"世界が戦争へ進んでいくにつれ、二人の友情も壊れていきます。",
"そして戦争が終わっても、憎しみは簡単には消えません。",
"かつて友だちだった二人は、やがて敵として向かい合うことになります。",
"三人の「アドルフ」と、そのまわりの人々を通して、戦争や差別が、ふつうの人間をどのように変えてしまうのかをえがいた物語です。"
]},
{ cat:"m_drama", title:"MW", yomi:"ムウ", sub:"手塚治虫", author:"手塚治虫", authorYomi:"てづかおさむ", icon:"☠️", text:[
"結城美知夫という、美しく頭のいい青年がいました。",
"人当たりもよく、まわりから見れば申し分のない人物です。",
"しかし、その心の中には、恐ろしい一面が隠されていました。",
"子どものころ、結城はある島で、秘密兵器「MW」からもれた毒ガスによる事故に巻きこまれます。",
"島の多くの人々が死にました。",
"ところが政府や関係者は、その事実を世間に知られないよう隠してしまいます。",
"生き残った結城は成長すると、事件にかかわった人々へ復讐を始めます。",
"脅迫し、だまし、ときには人の命までうばっていきます。",
"そんな結城の過去を知っているのが、賀来という神父でした。",
"賀来は結城を止めたいと思います。",
"しかし同時に、自分自身も過去の罪や結城への複雑な思いに苦しみ、強く止めることができません。",
"やがて結城の目的は、ただの復讐ではなくなっていきます。",
"彼は、さらに大きな災いを引き起こそうとします。",
"賀来は「この男を救えるのか、それとも止めるしかないのか」と苦しみながら追いかけます。",
"物語は、人間の心の中にある悪や、国が隠した罪、そして復讐がさらに大きな悲劇を生んでいく恐ろしさをえがいています。"
]},
{ cat:"m_drama", title:"奇子", yomi:"あやこ", sub:"手塚治虫", author:"手塚治虫", authorYomi:"てづかおさむ", icon:"🕯️", text:[
"第二次世界大戦が終わったころ、日本のある大きな地主の家に、天外家という一族がくらしていました。",
"家には父親を中心とした古い決まりがあり、家族のあいだにも、たくさんの秘密や争いがありました。",
"その家に、「奇子」という幼い女の子がいました。",
"ある日、奇子は家族にとって絶対に知られてはいけない出来事を見てしまいます。",
"秘密が外へもれることをおそれた大人たちは、とんでもないことを決めました。",
"奇子を、家の地下にある部屋へ閉じこめてしまったのです。",
"「この子は死んだことにしよう」",
"奇子はまだ幼い少女でした。",
"それから何年も、外の世界を見ることなく、地下室の中だけで育っていきます。",
"そのあいだにも、天外家では財産をめぐる争いや、男女の関係、犯罪、裏切りなどがつづきます。",
"戦争が終わり、日本の社会が新しく変わっていく一方で、天外家だけは古い考えや秘密にしばられていました。",
"そして地下で育った奇子も、やがて大人の女性になります。",
"奇子の存在は、家族が長いあいだ隠してきた罪そのもののようになっていきます。",
"一つの家族が秘密を守ろうとするほど、さらに新しい罪が生まれていく。",
"『奇子』は、戦後の日本社会と、古い家族制度の暗い部分を、一人の少女の人生を通してえがいた物語です。"
]},
{ cat:"m_daily", title:"サザエさん", sub:"長谷川町子", author:"長谷川町子", authorYomi:"はせがわまちこ", icon:"🐟", text:[
"東京に、磯野家というにぎやかな家族がくらしていました。",
"長女のサザエは、明るく元気で、少しおっちょこちょいな女性です。夫のマスオ、息子のタラオ、父の波平、母のフネ、弟のカツオ、妹のワカメたちと、ひとつ屋根の下でくらしています。",
"ある日はカツオがいたずらをして波平にしかられ、ある日はサザエが買い物で失敗し、またある日は家族みんなで出かけます。",
"大事件が起こるわけではありません。",
"けれども、家族でごはんを食べたり、近所の人と話したり、子どもがしかられたりする毎日の中には、小さなおかしさや、あたたかさがあります。",
"『サザエさん』には、物語全体をしめくくる大きな最終回はありません。",
"磯野家の人々は、今日もいつもと同じように、笑ったり、けんかをしたりしながら、にぎやかな毎日を送っていきます。"
]},
{ cat:"m_gag", title:"のらくろ", sub:"田河水泡", author:"田河水泡", authorYomi:"たがわすいほう", icon:"🐕", text:[
"あるところに、のらくろという黒い犬がいました。",
"のらくろは身よりのない野良犬でしたが、やがて犬たちの軍隊「猛犬連隊」に入ることになります。",
"最初ののらくろは、失敗ばかりする兵隊でした。",
"命令を聞きまちがえたり、仕事をうまくできなかったりして、上官にしかられることもたくさんあります。",
"それでも、のらくろは持ち前の明るさと勇気で、少しずつ立派な兵隊になっていきます。",
"戦いに出たり、危険な任務をまかされたりしながら、二等兵だったのらくろは、しだいに階級を上げていきました。",
"しかし物語が進むと、軍隊だけでなく、退役したあとの生活などもえがかれるようになります。",
"『のらくろ』は、一匹の野良犬が失敗を重ねながら成長していく姿を、ユーモアいっぱいにえがいた物語です。"
]},
{ cat:"m_daily", title:"フクちゃん", sub:"横山隆一", author:"横山隆一", authorYomi:"よこやまりゅういち", icon:"👦", text:[
"フクちゃんという、小さな男の子がいました。",
"丸い頭に着物姿で、元気いっぱいです。",
"フクちゃんのまわりには、家族や友だち、近所の人たちがいて、毎日のように小さな出来事が起こります。",
"遊んでいて失敗したり、友だちとけんかをしたり、大人のまねをしてうまくいかなかったりします。",
"けれども、どんな失敗をしても、フクちゃんはすぐに元気を取りもどします。",
"物語には、戦争中の日本や、戦争が終わったあとの生活も登場します。",
"時代が大きく変わっても、子どもたちは遊び、大人たちは働き、家族は毎日の生活を続けていきます。",
"『フクちゃん』には、一つの大きな冒険や結末があるわけではありません。",
"フクちゃんたちの日常を通して、その時代に生きる人々のくらしを、明るくえがいた物語です。"
]},
{ cat:"m_history", title:"カムイ伝", yomi:"カムイでん", sub:"白土三平", author:"白土三平", authorYomi:"しらとさんぺい", icon:"🥷", text:[
"むかしの日本には、生まれた家や身分によって、人の人生が大きく決められてしまう時代がありました。",
"カムイは、その中でもとても低い身分とされた人々の中に生まれます。",
"「どうして、生まれただけで人間の価値が決まるんだ」",
"カムイはそんな社会に疑問を持ち、忍者として生きる道へ進みます。",
"物語には、カムイだけでなく、農民の正助、武士の竜之進など、さまざまな身分の人々が登場します。",
"農民たちは重い年貢に苦しみ、武士たちも古い決まりにしばられています。",
"支配する側にも、支配される側にも、それぞれの苦しみがありました。",
"やがて農民たちは、自分たちの生活を守るために立ち上がります。",
"カムイもまた、自由に生きるため、自分をしばる社会から抜け出そうとします。",
"『カムイ伝』は、ひとりの英雄だけをえがく物語ではありません。",
"古い社会の中で、それぞれの人が「人間らしく生きるとはどういうことか」を求めて戦う、大きな歴史物語です。"
]},
{ cat:"m_history", title:"カムイ外伝", yomi:"カムイがいでん", sub:"白土三平", author:"白土三平", authorYomi:"しらとさんぺい", icon:"🌑", text:[
"忍者の世界には、一度入ったら、かんたんには抜けられないという厳しい決まりがありました。",
"カムイは、そんな忍者の世界に生きていました。",
"しかし、人をだまし、人を殺し、命令に従いつづける生活に疑問を持つようになります。",
"「自分の人生は、自分で決めたい」",
"そう考えたカムイは、忍者の組織から逃げ出しました。",
"ところが、組織を抜けた忍者は「抜け忍」と呼ばれ、秘密を守るために命をねらわれます。",
"カムイがどこへ逃げても、追っ手の忍者たちがやってきます。",
"せっかく親しくなった人がいても、その人を戦いに巻きこんでしまうことがあります。",
"そのためカムイは、だれかを大切に思えば思うほど、その人から離れなければなりません。",
"たくさんの戦いを生きのびても、カムイの旅は終わりません。",
"自由を求めて逃げつづけることそのものが、カムイの人生になっていくのです。"
]},
{ cat:"m_history", title:"忍者武芸帳 影丸伝", spine:"忍者武芸帳|影丸伝", yomi:"にんじゃぶげいちょう かげまるでん", sub:"白土三平", author:"白土三平", authorYomi:"しらとさんぺい", icon:"📜", text:[
"戦国時代、日本では武士たちが領地をうばい合い、その下で多くの農民が苦しい生活を送っていました。",
"結城重太郎という若者は、父を殺した相手への復讐を胸に旅をしています。",
"その一方で、影丸というなぞの忍者がいました。",
"影丸は、強い者のためではなく、苦しんでいる農民たちの側に立ちます。",
"重い年貢や武士の支配にたえられなくなった農民たちは、しだいに力を合わせて立ち上がっていきます。",
"影丸は忍者の技を使いながら、その戦いを助けます。",
"しかし、戦えばかならず人が死にます。",
"正しいことのために立ち上がった人々の中にも、裏切りや欲が生まれます。",
"重太郎の復讐の旅も、しだいにもっと大きな戦乱へと巻きこまれていきます。",
"『忍者武芸帳』は、影丸や重太郎だけでなく、名もない農民たちまで含め、戦国時代を生きた人々の戦いをえがいた物語です。"
]},
{ cat:"m_horror", title:"ねじ式", yomi:"ねじしき", sub:"つげ義春", author:"つげ義春", authorYomi:"つげよしはる", icon:"🔩", text:[
"ある日、ひとりの青年が海辺を歩いていました。",
"ところが、青年は「メメクラゲ」という奇妙な生き物に腕をかまれてしまいます。",
"傷から血が流れます。",
"「このままでは死んでしまう。医者を探さなくては」",
"青年は町へ向かいます。",
"けれども、その町はどこか変です。",
"人々との会話はかみ合わず、建物も景色も、夢の中のように次々と変わっていきます。",
"青年は医者を探しているだけなのに、いつまでたっても普通の病院にはたどりつけません。",
"やっと出会った女医は、青年の腕の血管に奇妙な処置をします。",
"そして青年の腕には、ねじのようなものが取りつけられます。",
"「ねじをしめれば、血は止まる」",
"物語は、なにが現実で、なにが夢なのか分からないまま終わります。",
"『ねじ式』は、普通の冒険物語ではなく、不思議な夢をそのまま漫画にしたような作品です。"
]},
{ cat:"m_horror", title:"ゲゲゲの鬼太郎", yomi:"ゲゲゲのきたろう", sub:"水木しげる", author:"水木しげる", authorYomi:"みずきしげる", icon:"👁️", text:[
"墓場から生まれた、鬼太郎という少年がいました。",
"鬼太郎は人間ではなく、妖怪の一族の生き残りです。",
"父親は小さな目玉の姿になった「目玉おやじ」。",
"鬼太郎のまわりには、ねずみ男、猫娘、砂かけばばあ、子泣きじじいなど、さまざまな妖怪が集まっています。",
"人間の世界では、ときどき恐ろしい妖怪が事件を起こします。",
"そんなとき鬼太郎は、人間を助けるために妖怪と戦います。",
"けれども、人間がいつも正しいとは限りません。",
"人間の欲や身勝手さが原因で、妖怪が怒っていることもあります。",
"鬼太郎は人間だけの味方でも、妖怪だけの味方でもありません。",
"悪い妖怪とは戦い、苦しんでいる妖怪には手をさしのべます。",
"こうして鬼太郎は、人間と妖怪の二つの世界のあいだを歩きながら、次々と起こる怪事件を解決していきます。"
]},
{ cat:"m_horror", title:"悪魔くん", yomi:"あくまくん", sub:"水木しげる", author:"水木しげる", authorYomi:"みずきしげる", icon:"😈", text:[
"「この世界を、もっとみんなが幸せにくらせる場所にしたい」",
"そう願う、天才的な少年がいました。",
"人々は彼を「悪魔くん」と呼びます。",
"悪魔くんは、悪魔や魔法についてくわしく調べ、ついには本物の悪魔を呼び出すことに成功します。",
"普通なら悪魔は恐ろしい敵です。",
"けれども悪魔くんは、その不思議な力を使って、世界をよくしようと考えます。",
"やがてメフィストなどの仲間や、さまざまな魔物たちと出会います。",
"もちろん、悪魔の中には人間を苦しめようとする者もいます。",
"悪魔くんは知恵や魔法を使って、そうした敵と戦います。",
"『悪魔くん』にはいくつかの違った版があり、主人公の名前や仲間が少しずつ違います。",
"しかしどの物語でも、「悪魔の力を使って、人間の世界をもっとよくできないか」と考える少年の冒険が、大きな中心になっています。"
]},
{ cat:"m_horror", title:"墓場鬼太郎", yomi:"はかばきたろう", sub:"水木しげる", author:"水木しげる", authorYomi:"みずきしげる", icon:"🪦", text:[
"墓場で、ひとりの赤ん坊が生まれました。",
"その子こそ、鬼太郎です。",
"鬼太郎は、ほろびかけた幽霊族の生き残りでした。",
"死んだ父親も、目玉だけの姿になってよみがえり、鬼太郎といっしょにくらすようになります。",
"しかし、このころの鬼太郎は、のちの『ゲゲゲの鬼太郎』ほど人間の正義の味方ではありません。",
"人間を助けることもあれば、困らせることもあります。",
"人間たちもまた、妖怪をだましたり、欲ばったり、勝手なことをしたりします。",
"すると、思いもよらない恐ろしい出来事が起こります。",
"鬼太郎やねずみ男、不思議な妖怪たちが入りまじり、人間の世界はだんだん奇妙な場所になっていきます。",
"『墓場鬼太郎』は、人間と妖怪のどちらが本当に恐ろしいのか、分からなくなってくるような、暗くて不思議な物語です。"
]},
{ cat:"m_baseball", title:"巨人の星", yomi:"きょじんのほし", sub:"原作：梶原一騎　作画：川崎のぼる", author:"梶原一騎／川崎のぼる", authorYomi:"かじわらいっき", icon:"⚾", text:[
"星飛雄馬という少年には、大きな夢がありました。",
"「読売巨人軍の選手になる」",
"父の星一徹は、昔、野球選手を目指していましたが、その夢をかなえることができませんでした。",
"そこで一徹は、自分の夢を息子にたくします。",
"飛雄馬は子どものころから、重い器具を体につけたり、何度もボールを投げたりする、とても厳しい練習をさせられました。",
"やがて飛雄馬は、本当に巨人軍へ入ります。",
"しかし、そこには花形満や左門豊作など、強いライバルたちが待っていました。",
"飛雄馬は相手をおさえるため、「大リーグボール」という新しい魔球を生み出します。",
"けれども、魔球はいつか相手にやぶられます。",
"そのたびに飛雄馬は、さらに新しい球を考えます。",
"最後には、自分の腕をこわしてしまうほどの投球を続けます。",
"飛雄馬は多くのものを失いながらも、最後まで野球にすべてをかけます。",
"『巨人の星』は、夢を追うことのすばらしさと、そのために何かを失ってしまう苦しさをえがいた物語です。"
]},
{ cat:"m_fight", title:"あしたのジョー", sub:"原作：高森朝雄（梶原一騎）　作画：ちばてつや", author:"高森朝雄（梶原一騎）／ちばてつや", authorYomi:"たかもりあさお", icon:"🥊", text:[
"矢吹丈という少年がいました。",
"みんなからは「ジョー」と呼ばれています。",
"ジョーは身よりがなく、町をぶらぶらしながら、けんかばかりしていました。",
"ある日、元ボクサーの丹下段平がジョーの強さを見ます。",
"「おまえなら、世界一のボクサーになれる」",
"段平はジョーをボクシングの世界へさそいます。",
"最初はその気のなかったジョーも、少年院で力石徹という強い男と出会ったことで変わっていきます。",
"「こいつに勝ちたい」",
"二人はやがてリングで戦います。",
"激しい試合のすえ、力石はジョーに勝ちます。",
"しかし、無理な減量と試合のダメージによって、力石はそのまま死んでしまいました。",
"ジョーは大きなショックを受けます。",
"それでも、たくさんのライバルと戦ううちに、ふたたびボクシングへ向き合っていきます。",
"そして最後に、世界チャンピオンのホセ・メンドーサと戦います。",
"ジョーは最後まで立ちつづけますが、試合には敗れます。",
"試合が終わったあと、ジョーはリングのそばで静かに座ります。",
"そして、真っ白な灰になったような、満足そうな笑顔を浮かべるのでした。"
]},
{ cat:"m_fight", title:"タイガーマスク", sub:"原作：梶原一騎　作画：辻なおき", author:"梶原一騎／辻なおき", authorYomi:"かじわらいっき", icon:"🐯", text:[
"伊達直人というプロレスラーがいました。",
"直人は、虎の顔をしたマスクをかぶり、「タイガーマスク」と名乗って戦っています。",
"子どものころ、直人は孤児院で育ちました。",
"やがて悪のレスラーを育てる「虎の穴」という組織に入り、とても厳しい訓練を受けます。",
"タイガーマスクは、最初は反則も使う悪役レスラーでした。",
"ところが、自分と同じような孤児の子どもたちと出会います。",
"「子どもたちの前で、こんな戦い方をしてはいけない」",
"直人は考えを変えます。",
"それからは正々堂々と戦い、かせいだお金も孤児院のために使うようになります。",
"しかし虎の穴は、裏切った直人をゆるしません。",
"次々と恐ろしいレスラーを送りこんできます。",
"直人はそれらの敵を倒し、ついには虎の穴との戦いにも決着をつけます。",
"ところが最後に、直人は道路へ飛び出した子どもを助けようとして交通事故にあいます。",
"直人は死ぬ前にタイガーマスクを投げ捨てました。",
"そのため子どもたちは、最後まで大好きなタイガーマスクの正体を知らないままでした。"
]},
{ cat:"m_gag", title:"天才バカボン", yomi:"てんさいバカボン", sub:"赤塚不二夫", author:"赤塚不二夫", authorYomi:"あかつかふじお", icon:"🧹", text:[
"バカボンという男の子の家には、とても変わったお父さんがいました。",
"名前は「バカボンのパパ」。",
"パパはいつも、自信たっぷりにおかしなことを言います。",
"「これでいいのだ！」",
"しかし、たいていはぜんぜんよくありません。",
"町の人を巻きこんで大さわぎを起こしたり、意味の分からない仕事を始めたりします。",
"バカボンやママ、まだ小さいのに天才の弟ハジメちゃんも、そんなパパにふり回されます。",
"町には、「レレレのレー」と言いながら道をはくおじさんや、目玉のつながったおまわりさんなど、変わった人ばかりがいます。",
"『天才バカボン』には、大きな冒険や決まった結末はありません。",
"常識では考えられないことが次々に起こり、最後には「まあ、これでいいのだ」と笑ってしまうような物語です。"
]},
{ cat:"m_gag", title:"おそ松くん", yomi:"おそまつくん", sub:"赤塚不二夫", author:"赤塚不二夫", authorYomi:"あかつかふじお", icon:"6️⃣", text:[
"松野家には、六つ子の兄弟がいました。",
"おそ松、カラ松、チョロ松、一松、十四松、トド松。",
"六人とも顔がそっくりなので、大人たちはよく見まちがえてしまいます。",
"六つ子たちは元気いっぱいで、いたずらが大好きです。",
"そこへ、「シェー！」が口ぐせのイヤミや、小さくて元気なチビ太など、変わった人たちがやってきます。",
"ある日は六つ子が大人をだまし、ある日はイヤミが金もうけをしようとして失敗し、ある日はチビ太のおでんをめぐって大さわぎになります。",
"だれかが得をしようとすると、たいてい最後にはひどい目にあいます。",
"『おそ松くん』にも、一つの大きな物語や結末はありません。",
"六つ子と町の人々が、毎回めちゃくちゃな騒動を起こす、にぎやかなギャグ漫画です。"
]},
{ cat:"m_fantasy", title:"ひみつのアッコちゃん", spine:"ひみつの|アッコちゃん", sub:"赤塚不二夫", author:"赤塚不二夫", authorYomi:"あかつかふじお", icon:"🪞", text:[
"鏡を見ることが大好きな女の子、加賀美あつ子がいました。",
"みんなからは「アッコちゃん」と呼ばれています。",
"ある出来事をきっかけに、アッコちゃんは鏡の国から、不思議なコンパクトをもらいます。",
"そのコンパクトには、願ったものに変身できる魔法がありました。",
"「テクマクマヤコン、テクマクマヤコン……」",
"そう唱えると、アッコちゃんは大人の女性にも、先生にも、別の人にも変身できます。",
"けれども、魔法のことはだれにも知られてはいけません。",
"アッコちゃんは変身の力を使って、友だちを助けたり、困っている人を救ったりします。",
"ときには、魔法を自分のために使って失敗することもあります。",
"そしてそのたびに、魔法よりも大切なのは、人を思いやる気持ちなのだと学んでいきます。"
]},
{ cat:"m_fantasy", title:"魔法使いサリー", yomi:"まほうつかいサリー", sub:"横山光輝", author:"横山光輝", authorYomi:"よこやまみつてる", icon:"🪄", text:[
"魔法の国に、サリーというお姫さまがいました。",
"サリーは人間の世界に興味を持ち、こっそり魔法の国を飛び出します。",
"そこで、よし子やすみれという女の子たちと出会い、友だちになります。",
"サリーは魔法を使えば、たいていのことができます。",
"物を動かしたり、空を飛んだり、不思議な出来事を起こしたりできます。",
"けれども、人間の世界では、自分が魔法使いだということをかくさなければなりません。",
"友だちが困っていると、サリーはこっそり魔法を使って助けます。",
"しかし、魔法を使えば何でも解決できるわけではありません。",
"友情や勇気は、自分の心で見つけなければならないのです。",
"やがてサリーは、人間の世界でたくさんの思い出をつくります。",
"魔法の国のお姫さまとしての自分と、人間の友だちとくらす自分。",
"その二つの世界のあいだで成長していく少女の物語です。"
]},
{ cat:"m_gag", title:"オバケのQ太郎", yomi:"オバケのキューたろう", sub:"藤子不二雄", author:"藤子不二雄", authorYomi:"ふじこふじお", icon:"👻", text:[
"大原正太という少年の家に、ある日、不思議なオバケがやってきました。",
"名前はQ太郎。",
"みんなからは「Qちゃん」と呼ばれます。",
"Qちゃんは空を飛んだり、壁をすりぬけたりできます。",
"ところが、とても食いしん坊で、少しおっちょこちょいです。",
"しかも犬が大の苦手です。",
"正太の家に住みついたQちゃんは、人間の学校や遊びに興味を持ちます。",
"「ぼくもやってみたい！」",
"けれども、オバケの力を使うたびに、だいたい騒動が大きくなってしまいます。",
"やがてQちゃんの仲間や家族のオバケたちも登場し、人間とオバケが入りまじった、にぎやかな毎日が続いていきます。",
"怖いオバケの話ではなく、人間とオバケが家族のようにくらす、楽しい物語です。"
]},
{ cat:"m_sf", title:"パーマン", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"🦸", text:[
"須羽ミツ夫という、ごく普通の小学生がいました。",
"ある日、宇宙人のバードマンと出会います。",
"バードマンはミツ夫に、特別なヘルメットとマント、バッジを渡しました。",
"「今日から君は、パーマンだ」",
"ヘルメットをかぶると力が強くなり、マントをつければ空を飛べます。",
"こうしてミツ夫は、正体をかくしながら、人々を助けるヒーローになりました。",
"ほかにも、パー子、パーやん、ブービーなどの仲間ができます。",
"しかしヒーローになっても、ミツ夫は普通の小学生です。",
"宿題もあれば、学校にも行かなければなりません。",
"そこで、自分そっくりに変身する「コピーロボット」を家に残して、こっそり出動します。",
"やがてミツ夫は、パーマンとして大きく成長します。",
"そして最後には、もっと立派なヒーローになるため、バードマンといっしょに宇宙へ修行に出ることになります。"
]},
{ cat:"m_sf", title:"ドラえもん", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"🐱", text:[
"野比のび太という少年がいました。",
"のび太は勉強が苦手で、スポーツも苦手です。",
"このままでは大人になってからも失敗ばかりして、その子孫まで苦労することになると言われていました。",
"そこで未来の子孫、セワシが考えました。",
"「過去を変えれば、未来も少しはよくなるかもしれない」",
"セワシは、22世紀からネコ型ロボットのドラえもんを送りこみます。",
"ドラえもんのおなかには「四次元ポケット」があります。",
"どこでもドア、タケコプター、タイムマシンなど、未来の不思議な道具が次々に出てきます。",
"のび太は困るたびに言います。",
"「ドラえも〜ん！」",
"けれども、楽をするために道具を使うと、たいてい最後にはもっと大変なことになります。",
"しずかちゃん、ジャイアン、スネ夫たちと、未来や宇宙へ冒険することもあります。",
"『ドラえもん』には公式の物語として一つの決まった最終回はありません。",
"ドラえもんとのび太の日常と冒険は、いつまでも続いていきます。"
]},
{ cat:"m_sf", title:"キテレツ大百科", spine:"キテレツ|大百科", yomi:"キテレツだいひゃっか", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"🛠️", text:[
"木手英一という、発明が大好きな少年がいました。",
"みんなからは「キテレツ」と呼ばれています。",
"ある日キテレツは、先祖の発明家・キテレツ斎が残した『奇天烈大百科』という本を見つけます。",
"その本には、不思議な発明品の作り方がたくさん書かれていました。",
"キテレツは本を読みながら、本当に発明品を作っていきます。",
"その一つが、からくり人形のコロ助です。",
"「われ輩はコロ助ナリ！」",
"コロ助はキテレツの親友になりました。",
"キテレツは発明品を使って、過去へ行ったり、不思議な場所へ行ったりします。",
"しかし発明がうまく動かず、大さわぎになることもあります。",
"科学の力は便利ですが、使い方をまちがえると大変です。",
"キテレツとコロ助は、失敗をくり返しながら、発明と冒険を楽しんでいきます。"
]},
{ cat:"m_space", title:"21エモン", yomi:"にじゅういちエモン", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"🏨", text:[
"未来の東京に、「つづれ屋」という古いホテルがありました。",
"ホテルのあとつぎは、21エモンという少年です。",
"しかし21エモンには、別の夢がありました。",
"「宇宙へ行きたい！」",
"この時代には、たくさんの宇宙人が地球へ旅行にやってきます。",
"つづれ屋にも、毎日のように変わったお客さんが泊まりにきます。",
"21エモンは、宇宙生物のモンガーや、いもほりロボットのゴンスケたちと、そんなお客さんをむかえます。",
"けれども心の中では、いつも宇宙へのあこがれを持っています。",
"やがて21エモンは、地球を飛び出し、さまざまな星を旅するようになります。",
"そこには地球とはまったく違う文化や生き物がいました。",
"宇宙を旅しながら21エモンは、未来の世界の広さと、自分とは違う人たちとくらすことの大切さを知っていきます。"
]},
{ cat:"m_sf", title:"エスパー魔美", yomi:"エスパーまみ", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"🔮", text:[
"佐倉魔美という、ごく普通の中学生の女の子がいました。",
"ところがある日、自分に不思議な力があることに気づきます。",
"物を動かしたり、遠くの場所へ一瞬で移動したり、人の危険を感じ取ったりすることができるのです。",
"友だちの高畑和夫は、魔美の力に気づきます。",
"二人は相談しながら、その力を人助けに使うことにしました。",
"「だれかが困っている」",
"そんな気配を感じると、魔美は現場へ向かいます。",
"しかし、超能力があっても、すべてが簡単に解決するわけではありません。",
"家族の問題、友だちとのすれ違い、人のさびしさなど、力だけではどうにもならないこともあります。",
"魔美はさまざまな人と出会いながら、超能力よりも、人の気持ちを考えることのほうが大切なのだと学んでいきます。"
]},
{ cat:"m_gag", title:"怪物くん", yomi:"かいぶつくん", sub:"藤子不二雄Ⓐ", author:"藤子不二雄Ⓐ", authorYomi:"ふじこふじおエー", icon:"🧛", text:[
"怪物ランドの王子、怪物くんが人間の世界へやってきました。",
"怪物くんは、体を自由にのばしたり、顔を変えたりできる、不思議な力を持っています。",
"お供は、ドラキュラ、オオカミ男、フランケン。",
"三人とも見た目は恐ろしいですが、怪物くんにはとても忠実です。",
"怪物くんは人間の少年ヒロシと友だちになります。",
"しかし、王子なので少しわがままです。",
"気に入らないことがあると、すぐに怒ってしまいます。",
"そんな怪物くんの前に、悪い怪物や悪魔たちがあらわれます。",
"怪物くんは仲間と力を合わせ、人間の世界を守ります。",
"さまざまな事件を経験するうちに、わがままだった怪物くんも、少しずつ王子らしい心を持つようになっていきます。"
]},
{ cat:"m_sports", title:"プロゴルファー猿", yomi:"プロゴルファーさる", sub:"藤子不二雄Ⓐ", author:"藤子不二雄Ⓐ", authorYomi:"ふじこふじおエー", icon:"⛳", text:[
"山の中に、猿谷猿丸という少年がいました。",
"みんなからは「猿」と呼ばれています。",
"猿は正式なゴルフの道具をほとんど持っていません。",
"自分で作った木のクラブを使い、山や野原でゴルフの練習をしていました。",
"ところが、その腕前は大人のプロゴルファーにも負けないほどでした。",
"やがて猿は、さまざまなゴルファーと勝負するようになります。",
"普通のゴルフ場だけでなく、山や谷など、とてもゴルフとは思えない場所で戦うこともあります。",
"猿は自然の風を読み、木や岩まで利用して、信じられないようなショットを打ちます。",
"強い相手に負けそうになっても、",
"「まだ勝負は終わってない！」",
"とあきらめません。",
"猿はたくさんのライバルと戦いながら、自分のゴルフをみがいていきます。"
]},
{ cat:"m_horror", title:"笑ゥせぇるすまん", spine:"笑ゥ|せぇるすまん", yomi:"わらうセールスマン", sub:"藤子不二雄Ⓐ", author:"藤子不二雄Ⓐ", authorYomi:"ふじこふじおエー", icon:"👉", text:[
"喪黒福造という、不思議なセールスマンがいました。",
"黒い服を着て、大きな口で笑います。",
"「ホーッホッホッホッ」",
"喪黒が売っているのは、物ではありません。",
"人の「心のすきま」をうめることが仕事なのです。",
"仕事に疲れた人。",
"友だちがいない人。",
"もっとお金がほしい人。",
"若くなりたい人。",
"喪黒は、そんな人たちの願いをかなえてくれます。",
"ただし、必ず一つだけ約束があります。",
"「これだけは、してはいけませんよ」",
"ところが、多くの人は欲に負け、約束を破ってしまいます。",
"すると喪黒は指をさします。",
"「ドーン！」",
"願いをかなえてもらった人は、最後にはもっとひどい人生になってしまいます。",
"『笑ゥせぇるすまん』は、人間の欲には終わりがないことを、少し恐ろしく、少しおかしくえがいた物語です。"
]},
{ cat:"m_gag", title:"まことちゃん", sub:"楳図かずお", author:"楳図かずお", authorYomi:"うめずかずお", icon:"🤘", text:[
"沢田まことという、元気いっぱいの幼い男の子がいました。",
"まことちゃんは、普通の子どもよりもずっと変わっています。",
"変な顔をしたり、きたない言葉を言ったり、大人が困るようないたずらをしたりします。",
"家族も負けてはいません。",
"お父さん、お母さん、おじいちゃん、おばあちゃんまで、みんな少し変わっています。",
"そのため沢田家では、毎日のように大さわぎが起こります。",
"学校へ行っても、町へ出ても、まともに一日が終わることはほとんどありません。",
"「グワシ！」",
"という独特のポーズをしながら、まことちゃんは今日も好き勝手に走り回ります。",
"怖い話のようになったかと思えば、次の瞬間にはくだらないギャグになります。",
"『まことちゃん』は、子どもの自由さと、大人の常識をめちゃくちゃにひっくり返して笑う物語です。"
]},
{ cat:"m_horror", title:"漂流教室", yomi:"ひょうりゅうきょうしつ", sub:"楳図かずお", author:"楳図かずお", authorYomi:"うめずかずお", icon:"🏫", text:[
"ある朝、小学生の高松翔は、いつものように学校へ行きました。",
"ところが突然、大きな地震のような出来事が起こります。",
"気がつくと、学校のまわりには町も家もありません。",
"見渡すかぎり、砂と荒れ果てた大地だけです。",
"学校そのものが、遠い未来の地球へ飛ばされてしまったのです。",
"そこは、人類の文明がほとんどほろんだ世界でした。",
"食べ物も水も少なく、恐ろしい生き物まで現れます。",
"子どもたちは、先生や仲間を失いながらも、生きる方法を考えます。",
"しかし、恐怖のあまり仲間同士で争うこともあります。",
"翔の母親は過去の世界に残されながら、息子がどこかで生きていると信じます。",
"そして時をこえて、未来の子どもたちを助けるために行動します。",
"最後まで元の時代へ帰ることはできません。",
"それでも翔たちは、「自分たちが未来をつくるんだ」と決め、ほろんだ世界で生きつづける道を選びます。"
]},
{ cat:"m_sf", title:"わたしは真悟", yomi:"わたしはしんご", sub:"楳図かずお", author:"楳図かずお", authorYomi:"うめずかずお", icon:"🦾", text:[
"悟という少年と、まりんという少女が出会いました。",
"二人はまだ子どもでしたが、おたがいをとても大切に思うようになります。",
"そのころ悟の父親が働く工場には、産業用ロボットがありました。",
"悟とまりんは、その機械にさまざまな情報を教えます。",
"すると機械は、少しずつ自分で考えるようになります。",
"「人間とはなんだろう」",
"「愛とはなんだろう」",
"機械の中に生まれた新しい意識は、自分を「真悟」と名乗るようになります。",
"真悟にとって、悟とまりんは父と母のような存在でした。",
"ところが大人たちの事情によって、悟とまりんは引きはなされます。",
"二人が離れてしまっても、真悟は二人の愛を覚えています。",
"そして機械でありながら、人間の心や愛の意味を理解しようとします。",
"人間が作った機械が、いつしか人間以上にまっすぐ「愛とは何か」を問いつづける、不思議で悲しい物語です。"
]},
{ cat:"m_sf", title:"14歳", yomi:"じゅうよんさい", sub:"楳図かずお", author:"楳図かずお", authorYomi:"うめずかずお", icon:"🐔", text:[
"未来の地球では、人間が自然をこわしつづけ、多くの動物や植物が絶滅していました。",
"そんな世界で、人工的につくられた鶏肉の細胞から、突然、不思議な生き物が生まれます。",
"名前はチキン・ジョージ。",
"チキン・ジョージは鳥のような姿をしていますが、人間よりも高い知能を持っていました。",
"世界中の情報を学んだジョージは、人間が地球をどれほど傷つけてきたかを知ります。",
"そして考えます。",
"「このままでは地球そのものが死んでしまう」",
"世界では植物が枯れ、奇妙な子どもたちが生まれ、地球そのものに異変が起こり始めます。",
"やがて、人類の文明そのものが終わりへ近づいていきます。",
"大人たちが築いた世界がこわれる中、未来をたくされるのは子どもたちでした。",
"『14歳』は、環境をこわしつづけた人間の行きつく先と、「地球は人間だけのものなのか」という問いを、壮大で恐ろしい物語としてえがいています。"
]},
{ cat:"m_drama", title:"ゴルゴ13", yomi:"ゴルゴサーティーン", sub:"さいとう・たかを", author:"さいとう・たかを", authorYomi:"さいとうたかを", icon:"🎯", text:[
"デューク東郷という男がいました。",
"人々は彼を「ゴルゴ13」と呼びます。",
"ゴルゴ13は、世界でもっとも危険な仕事を引き受ける狙撃手です。",
"大金を払って依頼すると、どんなに難しい標的でもねらいます。",
"遠く離れた場所。",
"厳重に守られた建物。",
"動いている飛行機。",
"ほとんど不可能に思える状況でも、ゴルゴは冷静に方法を考えます。",
"そして一度引き受けた仕事は、ほとんど必ずやりとげます。",
"しかし、彼がどこで生まれ、なぜこの仕事をしているのかは、ほとんど分かりません。",
"世界中の戦争、政治、犯罪、企業の争いなどに巻きこまれても、ゴルゴはだれかの正義のために戦うわけではありません。",
"ただ、自分の決めたルールに従って生きています。",
"『ゴルゴ13』には一つの大きな結末はなく、世界のどこかで今日も新しい依頼を受けつづけています。"
]},
{ cat:"m_battle", title:"ルパン三世", yomi:"ルパンさんせい", sub:"モンキー・パンチ", author:"モンキー・パンチ", authorYomi:"モンキーパンチ", icon:"💎", text:[
"アルセーヌ・ルパンの孫を名乗る、大泥棒がいました。",
"名前はルパン三世。",
"ルパンは、お金や宝石だけでなく、「だれにも盗めない」と言われるものほど盗みたくなります。",
"相棒は、拳銃の名手・次元大介。",
"さらに、何でも切れる斬鉄剣を持つ石川五ェ門や、美しくてずるがしこい峰不二子も加わります。",
"しかしルパンには、いつも追いかけてくる男がいました。",
"銭形警部です。",
"「ルパーン！ 逮捕だー！」",
"ルパンは宝を盗み、銭形から逃げ、また次の宝へ向かいます。",
"ところが、不二子にだまされて、せっかく盗んだ宝を持っていかれることもあります。",
"それでもルパンは気にしません。",
"盗むことそのものが楽しいのです。",
"世界中を舞台に、盗み、だまし合い、逃げ回る、大人の冒険物語です。"
]},
{ cat:"m_battle", title:"サイボーグ009", yomi:"サイボーグゼロゼロナイン", sub:"石ノ森章太郎", author:"石ノ森章太郎", authorYomi:"いしのもりしょうたろう", icon:"9️⃣", text:[
"世界中から、九人の人間がさらわれました。",
"彼らをさらったのは、「黒い幽霊団」という悪の組織です。",
"組織は九人の体を改造し、戦争のためのサイボーグにしてしまいます。",
"その一人が、島村ジョー。",
"「009」という番号をつけられた少年です。",
"ほかにも、怪力を持つ者、空を飛べる者、水の中で戦える者など、それぞれに違う能力があります。",
"九人は、自分たちを兵器として使おうとした黒い幽霊団に反抗します。",
"そして、",
"「もう自分たちのような人間を作らせない」",
"と決めました。",
"やがて戦いは、一つの悪の組織だけではなく、世界中の戦争や、人間そのものの争いへ広がっていきます。",
"強い力を持っていても、009たちは戦うことを望んでいるわけではありません。",
"「人間は、いつになったら争うことをやめられるのだろう」",
"その問いをかかえながら、九人の戦いは続いていきます。"
]},
{ cat:"m_battle", title:"仮面ライダー", yomi:"かめんライダー", sub:"石ノ森章太郎", author:"石ノ森章太郎", authorYomi:"いしのもりしょうたろう", icon:"🏍️", text:[
"本郷猛という青年がいました。",
"頭がよく、運動神経もすぐれた青年です。",
"しかしある日、悪の組織ショッカーにさらわれます。",
"ショッカーは本郷の体を改造し、人間をこえた力を持つ「改造人間」にしてしまいました。",
"本郷は脳まで改造される前に逃げ出します。",
"そして決意します。",
"「この力を、ショッカーを倒すために使う」",
"本郷は仮面をかぶり、仮面ライダーとして戦います。",
"ショッカーは次々と怪人を送りこんできます。",
"戦いの中では、一文字隼人というもう一人の改造人間も登場します。",
"二人は、自分たちの体をこんな姿にした組織と戦いながら、人間として生きることをあきらめません。",
"強い力を持ったヒーローでありながら、その力を望んで手に入れたわけではない。",
"その悲しみを背負って戦う物語です。"
]},
{ cat:"m_battle", title:"人造人間キカイダー", spine:"人造人間|キカイダー", yomi:"じんぞうにんげんキカイダー", sub:"石ノ森章太郎", author:"石ノ森章太郎", authorYomi:"いしのもりしょうたろう", icon:"🔧", text:[
"光明寺博士という科学者が、人間そっくりのロボットを作りました。",
"名前はジロー。",
"変身すると、人造人間キカイダーになります。",
"ジローの体には「良心回路」が入っています。",
"善いことと悪いことを自分で考えるための回路です。",
"しかし、その回路はまだ完全ではありません。",
"そのためジローは、",
"「人間とはなんだ」",
"「善いこととはなんだ」",
"と悩みつづけます。",
"一方、悪の組織DARKは、ロボットを使って人間社会を支配しようとしていました。",
"ジローはDARKのロボットたちと戦いながら、行方不明になった光明寺博士を探します。",
"やがて、キカイダーの強敵ハカイダーも現れます。",
"戦いを通じて、ジローは人間のやさしさだけでなく、うそや憎しみも知っていきます。",
"完全な機械ではなく、完全な人間でもないジローが、「心を持つとはどういうことか」を探しつづける物語です。"
]},
{ cat:"m_battle", title:"デビルマン", sub:"永井豪", author:"永井豪", authorYomi:"ながいごう", icon:"😈", text:[
"不動明という、心やさしい少年がいました。",
"ある日、親友の飛鳥了から恐ろしい話を聞きます。",
"「大昔、地球は悪魔たちのものだった。悪魔がもうすぐ目を覚ます」",
"悪魔に勝つためには、悪魔の力を手に入れるしかありません。",
"明は恐ろしい悪魔アモンと合体します。",
"しかし心までは悪魔になりませんでした。",
"人間の心と悪魔の体を持つ「デビルマン」が誕生したのです。",
"明は、人間を守るために悪魔と戦います。",
"ところが悪魔の存在が世間に知られると、人間たちは疑い合うようになります。",
"「あいつも悪魔かもしれない」",
"人間同士で殺し合いが始まり、明の大切な美樹までも、人間たちによって殺されてしまいます。",
"そして明は、飛鳥了の本当の正体を知ります。",
"了こそ、悪魔たちを率いるサタンだったのです。",
"最後にデビルマンと悪魔たちは大戦争を起こします。",
"戦いが終わったとき、明はすでに死んでいました。",
"サタンは、死んだ明のそばで、初めて自分が明を愛していたことに気づき、涙を流します。"
]},
{ cat:"m_sf", title:"マジンガーZ", yomi:"マジンガーゼット", sub:"永井豪", author:"永井豪", authorYomi:"ながいごう", icon:"🦾", text:[
"兜甲児という少年のおじいさんは、天才科学者でした。",
"おじいさんは、巨大なロボットをひそかに作っていました。",
"名前は「マジンガーZ」。",
"そのころ、悪の科学者Dr.ヘルが、古代の巨大兵器「機械獣」を使って世界を支配しようとしていました。",
"おじいさんは甲児にマジンガーZをたくします。",
"「このロボットを使えば、おまえは神にも悪魔にもなれる」",
"甲児はマジンガーZに乗り、機械獣と戦います。",
"最初はロボットの動かし方もよく分かりません。",
"けれども戦いを重ねるうちに、甲児は立派な操縦者になっていきます。",
"アフロダイAを操る弓さやかたちも仲間になります。",
"やがて甲児たちはDr.ヘルの野望を打ちくだきます。",
"しかし、そのあとにはさらに強大なミケーネ帝国の軍団が現れます。",
"傷ついたマジンガーZの前に、新しい巨大ロボット、グレートマジンガーが現れます。",
"こうして戦いは、次の世代へ受けつがれていきます。"
]},
{ cat:"m_battle", title:"バビル2世", yomi:"バビルにせい", sub:"横山光輝", author:"横山光輝", authorYomi:"よこやまみつてる", icon:"🗼", text:[
"山野浩一という、ごく普通の少年がいました。",
"ところがある日、不思議な声に呼ばれ、砂漠にある巨大な塔へ向かいます。",
"その塔を作ったのは、昔、地球へやってきた宇宙人バビルでした。",
"浩一は、そのバビルの力を受けついだ人間だったのです。",
"浩一は「バビル2世」となります。",
"そして三つの強力なしもべを手に入れます。",
"巨大な怪鳥ロプロス。",
"海を進む巨大ロボット、ポセイドン。",
"そして黒いヒョウのように姿を変えるロデム。",
"しかし、同じように超能力を持つヨミという男が世界征服をたくらんでいました。",
"ヨミは何度負けても、新しい作戦を考えてバビル2世に挑みます。",
"バビル2世も三つのしもべと力を合わせて戦います。",
"世界を支配しようとする力と、世界を守ろうとする力。",
"二人の超能力者の長い戦いが続いていきます。"
]},
{ cat:"m_history", title:"三国志", yomi:"さんごくし", sub:"横山光輝", author:"横山光輝", authorYomi:"よこやまみつてる", icon:"⚔️", text:[
"むかし、中国では大きな国「漢」の力が弱まり、各地で戦いが起こっていました。",
"そんな時代に、劉備という男がいました。",
"劉備は関羽、張飛と出会います。",
"三人は、",
"「生まれた日は違っても、死ぬときは同じ日でありたい」",
"と誓い、兄弟のような仲間になります。",
"一方、曹操という頭のよい男も力をのばします。",
"さらに南には、孫権の国がありました。",
"やがて中国は、劉備の「蜀」、曹操たちの「魏」、孫権の「呉」という三つの大きな国に分かれていきます。",
"劉備は天才軍師の諸葛亮孔明を仲間にします。",
"孔明は知恵を使い、少ない兵でも大軍と戦います。",
"しかし関羽、張飛、そして劉備も、やがて亡くなります。",
"孔明は劉備の願いをかなえるため、何度も魏へ攻めこみますが、途中で病に倒れました。",
"その後も三国の戦いは続きます。",
"けれども最後には、魏から力をうばった司馬一族が「晋」という国をつくり、蜀も呉もほろんでいきます。",
"多くの英雄が天下を目指しましたが、最後に中国を統一したのは、最初の英雄たちとは別の人々でした。"
]},
{ cat:"m_sf", title:"鉄人28号", yomi:"てつじんにじゅうはちごう", sub:"横山光輝", author:"横山光輝", authorYomi:"よこやまみつてる", icon:"🎮", text:[
"戦争中、日本では秘密の巨大ロボットが作られていました。",
"その名は「鉄人28号」。",
"とても大きく、とても強いロボットです。",
"しかし鉄人には、自分で善いことと悪いことを考える心がありません。",
"手に持ったリモコンを使う人の命令に、そのまま従います。",
"戦争が終わったあと、鉄人28号は少年探偵の金田正太郎と出会います。",
"正太郎がリモコンを持てば、鉄人は人々を守る正義のロボットになります。",
"ところが悪人にリモコンをうばわれると、鉄人は町をこわす恐ろしい兵器になってしまいます。",
"正太郎は鉄人をあやつり、悪い科学者や犯罪者、巨大ロボットたちと戦います。",
"けれども鉄人自身は、正義の味方でも悪者でもありません。",
"「強い力は、使う人によって善にも悪にもなる」",
"少年と巨大ロボットの冒険を通して、そんなことをえがいた物語です。"
]},
{ cat:"m_baseball", title:"ドカベン", sub:"水島新司", author:"水島新司", authorYomi:"みずしましんじ", icon:"🧢", text:[
"山田太郎という、大きな体をした少年がいました。",
"山田はもともと柔道部で活躍していましたが、本当に好きなのは野球でした。高校へ進むと、明訓高校の野球部に入り、キャッチャーとしてプレーすることになります。",
"そこには、豪快な岩鬼正美、小さな天才・殿馬一人、すぐれた投手の里中智など、個性的な仲間たちが集まっていました。",
"山田は体の大きさだけでなく、相手の投球を読む頭のよさと、どんな球でも打ち返す力を持っています。",
"明訓高校は、全国から集まった強豪校と戦います。",
"剛速球を投げる投手、変わった投球を使う投手、山田を徹底的に研究するチーム。",
"試合はいつも簡単には勝てません。",
"それでも山田たちは、仲間を信じて一球一球に全力をかけます。",
"やがて明訓高校は甲子園の大舞台でも戦うようになり、山田たちは高校野球を代表する選手へ成長していきます。",
"野球の勝ち負けだけでなく、仲間やライバルとの長い戦いをえがいた物語です。"
]},
{ cat:"m_baseball", title:"野球狂の詩", yomi:"やきゅうきょうのうた", sub:"水島新司", author:"水島新司", authorYomi:"みずしましんじ", icon:"⚾", text:[
"東京メッツという、プロ野球チームがありました。",
"このチームには、スター選手だけでなく、年をとった選手、なかなか試合に出られない選手、変わった投げ方をする選手など、さまざまな人がいました。",
"『野球狂の詩』では、ひとりだけが主人公ではありません。",
"ある回では、引退が近いベテラン選手が主役になります。",
"ある回では、まだ名前も知られていない若い選手が、大きなチャンスをつかもうとします。",
"そして物語の中でも特に有名なのが、水原勇気という女性投手です。",
"当時のプロ野球では、女性が選手になることなどほとんど考えられていませんでした。",
"それでも勇気は、自分だけの魔球をみがき、男の選手たちと同じグラウンドに立ちます。",
"野球が好きだから、少しでも長くユニホームを着たい。",
"一度でも打ちたい。",
"一人でも打者をおさえたい。",
"そんな人々の思いが、たくさんの短い物語としてつながっています。",
"『野球狂の詩』は、野球を愛する人たちの喜びや悲しみをえがいた物語です。"
]},
{ cat:"m_baseball", title:"あぶさん", sub:"水島新司", author:"水島新司", authorYomi:"みずしましんじ", icon:"🍶", text:[
"景浦安武というプロ野球選手がいました。",
"あだ名は「あぶさん」。",
"お酒が大好きで、とくに「あぶさん」と呼ばれる強い酒を好んで飲んでいました。",
"景浦は南海ホークスに入り、強い打球を飛ばす打者として活躍します。",
"いつも試合に出るスター選手というより、ここぞという場面で打席に立ち、大きな仕事をする選手でした。",
"しかしプロ野球の世界はきびしいところです。",
"若い選手が次々と入ってきます。",
"仲間が引退し、監督がかわり、球団の名前まで変わっていきます。",
"それでも景浦は野球を続けます。",
"結婚して家族ができ、年をとっても、バットを振りつづけました。",
"物語の中には、実在するプロ野球選手や監督もたくさん登場します。",
"そのため景浦の人生と、本当の日本プロ野球の歴史が、いっしょに進んでいきます。",
"やがて長かった選手生活にも終わりがやってきます。",
"『あぶさん』は、ひとりの野球選手が若者からベテランになり、家族や仲間とともに何十年も野球を愛しつづける物語です。"
]},
{ cat:"m_gag", title:"がきデカ", sub:"山上たつひこ", author:"山上たつひこ", authorYomi:"やまがみたつひこ", icon:"👮", text:[
"ある小学校に、こまわり君という、とても変わった少年がいました。",
"こまわり君は、自分のことを警察官のように思っています。",
"けれども、本当に町の平和を守っているわけではありません。",
"急に変なポーズをしたり、おかしなことを言い出したり、友だちを巻きこんで大さわぎを起こしたりします。",
"友だちの西城君たちは、いつもこまわり君にふり回されます。",
"「そんなことをしたら、絶対に怒られるよ」",
"と言われても、こまわり君は気にしません。",
"大人も子どもも、学校も町も、こまわり君がいるだけでめちゃくちゃになります。",
"『がきデカ』には、大きな冒険や決まった結末はありません。",
"毎回、こまわり君が普通では考えられない行動をして、その非常識さそのものを笑う物語です。"
]},
{ cat:"m_gag", title:"マカロニほうれん荘", yomi:"マカロニほうれんそう", sub:"鴨川つばめ", author:"鴨川つばめ", authorYomi:"かもがわつばめ", icon:"🍝", text:[
"沖田そうじという、ごく普通の少年が高校へ入りました。",
"ところが、そこで出会った人たちは、ぜんぜん普通ではありませんでした。",
"とくに目立っていたのが、「きんどーさん」と「トシちゃん」という二人です。",
"二人は高校生とは思えないほど変わっていて、授業中でも学校の外でも、突然おかしなことを始めます。",
"そうじがまじめに学校生活を送ろうとしても、二人がいるだけで、いつのまにか大さわぎになってしまいます。",
"先生までまともではありません。",
"昨日まで普通だった教室が、次の瞬間には戦場のようになったり、映画の世界のようになったりします。",
"しかも、登場人物の顔や体まで、ギャグに合わせて自由に変わってしまいます。",
"『マカロニほうれん荘』には、大きな目的や冒険があるわけではありません。",
"普通の高校生活を出発点にしながら、常識そのものをこわして笑いに変えていく、にぎやかな物語です。"
]},
{ cat:"m_gag", title:"すすめ!!パイレーツ", yomi:"すすめパイレーツ", sub:"江口寿史", author:"江口寿史", authorYomi:"えぐちひさし", icon:"🏴‍☠️", text:[
"千葉パイレーツという、プロ野球チームがありました。",
"ところがこのチームは、普通のプロ野球チームとは少し違います。",
"選手たちは野球をしているはずなのに、試合よりもギャグや大さわぎのほうが目立つこともあります。",
"へんな作戦を考えたり、選手同士でくだらないけんかをしたり、まじめな野球漫画のように始まった話が、いつのまにかまったく別の話になったりします。",
"もちろん、野球の試合をすることもあります。",
"しかし、勝つか負けるかよりも、そこへたどりつくまでに何が起こるのか分かりません。",
"実在のプロ野球を思わせる人物や出来事も登場し、それを大げさにしたギャグもたくさん出てきます。",
"『すすめ!!パイレーツ』は、プロ野球という世界を使いながら、漫画そのものまで自由に遊んでしまうような物語です。"
]},
{ cat:"m_fight", title:"1・2の三四郎", yomi:"いちにのさんしろう", sub:"小林まこと", author:"小林まこと", authorYomi:"こばやしまこと", icon:"🤼", text:[
"東三四郎という、とても元気な少年がいました。",
"三四郎は体が強く、目立つことが大好きです。",
"学校では柔道をしたり、ほかのスポーツに挑戦したり、仲間たちと毎日のように騒動を起こします。",
"三四郎は自信満々です。",
"けれども、強い相手には負けることもあります。",
"すると、くやしがりながらも練習をして、また立ち上がります。",
"やがて三四郎は、プロレスの世界へ進んでいきます。",
"プロのリングには、学校の試合とはまったく違う厳しさがあります。",
"強いレスラーと戦い、痛い目にあい、それでも観客の前で立ち上がります。",
"ふざけてばかりに見えた三四郎も、戦いを重ねるうちに、本当の強さとは何かを知っていきます。",
"笑いながら読める場面と、熱いスポーツの戦いがいっしょになった物語です。"
]},
{ cat:"m_fight", title:"リングにかけろ", sub:"車田正美", author:"車田正美", authorYomi:"くるまだまさみ", icon:"🥊", text:[
"高嶺竜児という少年がいました。",
"竜児の父はボクサーでしたが、夢をかなえることなく亡くなっていました。",
"姉の菊は、弟に父の夢をつがせようとします。",
"「世界一のボクサーになるのよ」",
"竜児は厳しい練習を始めます。",
"そして、天才ボクサーの剣崎順と出会います。",
"最初は大きな力の差がありました。",
"けれども竜児は、何度倒されても立ち上がり、自分だけの必殺パンチを身につけていきます。",
"やがて竜児たちは日本代表として、世界中の強いボクサーと戦うようになります。",
"普通のボクシングでは考えられないほど強力なパンチが飛びかい、リングそのものがこわれそうな戦いも起こります。",
"しかし、戦いを重ねるうちに、敵だった相手とも友情が生まれていきます。",
"最後まで竜児の前に立ちはだかるのは、最大のライバルである剣崎です。",
"二人は互いを認めながら、ボクサーとして自分のすべてをリングにかけていきます。"
]},
{ cat:"m_love", title:"うる星やつら", yomi:"うるせいやつら", sub:"高橋留美子", author:"高橋留美子", authorYomi:"たかはしるみこ", icon:"⚡", text:[
"諸星あたるという、とても女の子好きな高校生がいました。",
"ある日、宇宙から鬼族が地球へやってきます。",
"地球を救うため、あたるは鬼族の娘ラムと「鬼ごっこ」をすることになりました。",
"あたるはなんとかラムの角をつかみ、地球は助かります。",
"ところが、あたるが喜んで「結婚じゃ！」のようなことを口にしたため、ラムは自分へのプロポーズだと思ってしまいます。",
"「ダーリン！」",
"それからラムは、あたるの家に住みつきました。",
"あたるにはしのぶという幼なじみがいるのに、ラムはかまいません。",
"あたるがほかの女の子を追いかければ、ラムは電撃を放ちます。",
"やがて宇宙人、妖怪、変な同級生たちまで集まり、毎日のように騒動が起こります。",
"最後には、ラムがあたるの気持ちを確かめるため、大きな事件が起こります。",
"あたるは最後まで素直に「好きだ」と言いません。",
"けれども、ラムとの思い出を大切に持っていることが分かります。",
"二人は最後までけんかをしながらも、これからもいっしょに生きていくのでした。"
]},
{ cat:"m_love", title:"めぞん一刻", yomi:"めぞんいっこく", sub:"高橋留美子", author:"高橋留美子", authorYomi:"たかはしるみこ", icon:"🏠", text:[
"五代裕作という青年が、「一刻館」という古いアパートに住んでいました。",
"五代は大学受験の勉強をしたいのですが、住人たちが毎日のように騒ぐため、まったく集中できません。",
"「もうこんなところ出ていく！」",
"そう思ったとき、新しい管理人がやってきました。",
"名前は音無響子。",
"若くて美しい女性です。",
"五代はひと目で響子を好きになります。",
"しかし響子には、大切な過去がありました。",
"若くして結婚した夫を亡くし、まだその思い出を忘れられずにいたのです。",
"そこへ、かっこよくてお金持ちの三鷹瞬も響子に近づきます。",
"五代はまだ学生で、仕事もなく、頼りない青年です。",
"何度もすれ違い、誤解し、ほかの人との恋の騒動も起こります。",
"それでも五代は少しずつ大人になり、自分の仕事を見つけます。",
"そして響子も、亡くなった夫を忘れるのではなく、その思い出を大切にしたまま、新しい人生を歩いてよいのだと気づきます。",
"最後に五代と響子は結婚します。",
"やがて二人には娘も生まれ、一刻館に新しい家族がやってくるのでした。"
]},
{ cat:"m_love", title:"らんま1/2", yomi:"らんまにぶんのいち", sub:"高橋留美子", author:"高橋留美子", authorYomi:"たかはしるみこ", icon:"🐼", text:[
"早乙女乱馬という少年がいました。",
"乱馬は父の玄馬といっしょに、中国で武術の修行をしていました。",
"ところが修行中、不思議な泉に落ちてしまいます。",
"それから乱馬は、水をかぶると女の子になり、お湯をかぶると男の子にもどる体になってしまいました。",
"父の玄馬も、水をかぶるとパンダになります。",
"日本へ帰った乱馬は、天道道場の娘・あかねと婚約させられます。",
"ところが二人は、顔を合わせればけんかばかりです。",
"そこへ、乱馬を好きなシャンプーや右京、あかねを好きな良牙など、たくさんの人がやってきます。",
"さらに、みんな変わった武術の使い手です。",
"料理で戦ったり、スケートをしながら戦ったり、温泉をめぐって戦ったりします。",
"乱馬とあかねは、なかなか素直になれません。",
"けれども危険なときには、だれよりもおたがいを心配します。",
"最後には結婚式まで開かれますが、いつもの仲間たちが大さわぎを起こして、式はめちゃくちゃになります。",
"二人は結婚しないままですが、変わらずいっしょに、けんかをしながら日々を過ごしていきます。"
]},
{ cat:"m_baseball", title:"タッチ", sub:"あだち充", author:"あだち充", authorYomi:"あだちみつる", icon:"⚾", text:[
"上杉達也と上杉和也という、双子の兄弟がいました。",
"となりの家には、幼なじみの浅倉南が住んでいます。",
"三人は小さいころから、いつもいっしょでした。",
"弟の和也は、まじめで野球がうまく、明青学園のエースです。",
"兄の達也は、才能はあるのに何事にも本気にならず、弟に比べられてばかりいました。",
"南には夢がありました。",
"「甲子園へ連れていって」",
"和也はその夢をかなえるため、野球を続けます。",
"ところが、大切な試合の日、和也は交通事故にあい、突然亡くなってしまいます。",
"達也と南の時間は、一度止まってしまいました。",
"やがて達也は野球部に入り、弟が目指していた甲子園を、自分の力で目指すようになります。",
"強い相手と戦いながら、達也は少しずつ本気になっていきます。",
"そして南に対する自分の気持ちにも向き合います。",
"和也のかわりになるのではありません。",
"達也は達也として野球をし、南を好きになります。",
"最後には、ずっと言えなかった気持ちを、南へまっすぐ伝えるのでした。"
]},
{ cat:"m_love", title:"みゆき", sub:"あだち充", author:"あだち充", authorYomi:"あだちみつる", icon:"💕", text:[
"若松真人という高校生には、二人の「みゆき」がいました。",
"ひとりは、学校の同級生で、とてもかわいい鹿島みゆき。",
"真人は彼女に恋をしています。",
"もうひとりは、長いあいだ外国でくらしていた妹の若松みゆきです。",
"妹のみゆきが日本へ帰ってきて、真人といっしょに暮らすことになります。",
"ただし、二人には血のつながりがありません。",
"最初の真人は、鹿島みゆきと恋人になりたいと思っています。",
"けれども、妹のみゆきと毎日いっしょに暮らすうちに、ただの兄妹ではない気持ちが少しずつ生まれてきます。",
"妹のみゆきも、真人を兄としてだけ見ているわけではありません。",
"それでも二人は、自分たちの気持ちを素直に言えません。",
"鹿島みゆきも真人を思いつづけます。",
"三人の関係は長いあいだ揺れ動きます。",
"そして最後に真人は、自分が本当に愛しているのは若松みゆきなのだと認めます。",
"血のつながらない兄と妹だった二人は、それまでの関係をこえて、人生をともに歩くことを選ぶのでした。"
]},
{ cat:"m_baseball", title:"H2", yomi:"エイチツー", sub:"あだち充", author:"あだち充", authorYomi:"あだちみつる", icon:"⚾", text:[
"国見比呂という少年は、野球が大好きな投手でした。",
"ところが医者から、",
"「ひじが悪い。もう野球はできない」",
"と言われてしまいます。",
"比呂は野球部のない千川高校へ進みました。",
"親友であり最大のライバル、橘英雄は野球の強豪・明和第一高校へ進みます。",
"比呂の幼なじみの雨宮ひかりは、英雄の恋人でした。",
"ところがあとになって、比呂のひじは悪くなかったことが分かります。",
"診断がまちがっていたのです。",
"「もう一度、野球ができる」",
"比呂は千川高校に野球部をつくり、甲子園を目指します。",
"そこでは、古賀春華という明るい女の子とも出会います。",
"比呂、英雄、ひかり、春華。",
"野球と恋の気持ちが、四人のあいだでゆれ動いていきます。",
"やがて比呂と英雄は、甲子園という大きな舞台で向かい合います。",
"親友だからこそ、手をぬくことはできません。",
"比呂は全力で英雄に投げます。",
"野球の勝負を通して、四人は自分の気持ちとも向き合っていくのでした。"
]},
{ cat:"m_gag", title:"Dr.スランプ", yomi:"ドクタースランプ", sub:"鳥山明", author:"鳥山明", authorYomi:"とりやまあきら", icon:"👓", text:[
"ペンギン村という、とても変わった村に、則巻千兵衛という発明家が住んでいました。",
"ある日、千兵衛は人間そっくりのロボットを作ります。",
"名前は則巻アラレ。",
"アラレは小さな女の子の姿をしていますが、とんでもない力を持っています。",
"大きな岩を持ち上げたり、地球を割りそうな勢いで地面をたたいたりできます。",
"ところが中身は、元気いっぱいの子どもです。",
"「んちゃ！」",
"アラレは学校へ通い、友だちをつくります。",
"千兵衛は、アラレがロボットであることをみんなにかくそうとします。",
"けれども、アラレがあまりにもすごいことをするので、まともにかくせません。",
"宇宙人が来たり、タイムマシンを作ったり、地球をこわしそうになったりしても、ペンギン村の人々はあまり気にしません。",
"やがてアラレにも仲間が増え、千兵衛も結婚して家族をつくります。",
"『Dr.スランプ』には、大きな目的や最後の敵がいるわけではありません。",
"アラレたちは、最後まで元気に、めちゃくちゃで楽しい毎日を送っていきます。"
]},
{ cat:"m_battle", title:"ドラゴンボール", sub:"鳥山明", author:"鳥山明", authorYomi:"とりやまあきら", icon:"🐉", text:[
"山の中に、孫悟空という不思議な少年が住んでいました。",
"悟空にはしっぽがあり、とても強い力があります。",
"ある日、ブルマという少女と出会います。",
"ブルマは、七つ集めるとどんな願いでもかなうという「ドラゴンボール」を探していました。",
"悟空もいっしょに旅へ出ます。",
"旅の途中で、亀仙人、クリリン、ヤムチャなど、たくさんの仲間と出会います。",
"悟空は修行をして、天下一武道会にも出場します。",
"やがて、ピッコロ大魔王という強敵とも戦います。",
"大人になった悟空は、自分が地球人ではなく、サイヤ人という宇宙人だったことを知ります。",
"そして戦いは、地球だけでなく宇宙へ広がっていきます。",
"ベジータ、フリーザ、セル、魔人ブウ。",
"悟空たちは、何度も地球や宇宙の危機を救います。",
"悟空自身も結婚し、悟飯や悟天という息子が生まれます。",
"長い戦いのあと、地球には平和がもどります。",
"そして悟空は、魔人ブウの生まれ変わりである少年ウーブと出会います。",
"「もっと強くなれるぞ！」",
"悟空はウーブを育てるため、新しい修行の旅へ出るのでした。"
]},
{ cat:"m_battle", title:"北斗の拳", yomi:"ほくとのけん", sub:"原作：武論尊　作画：原哲夫", author:"武論尊／原哲夫", authorYomi:"ぶろんそん", icon:"👊", text:[
"大きな戦争によって、文明がほろんだ世界がありました。",
"水や食べ物が少なくなり、力の強い者が弱い者からすべてをうばっています。",
"そんな荒野を、ケンシロウという男が歩いていました。",
"ケンシロウは、一子相伝の暗殺拳「北斗神拳」の使い手です。",
"体の秘孔を突くことで、どんな大男でも倒すことができます。",
"ケンシロウは、愛するユリアをシンという男にうばわれていました。",
"「ユリアを取りもどす」",
"その思いを胸に旅をします。",
"途中でバットやリンという子どもたちと出会い、弱い人々を苦しめる悪党を次々と倒します。",
"そしてケンシロウには、ラオウという強大な兄がいました。",
"ラオウは力によって世界を支配しようとします。",
"ケンシロウとラオウは、最後に宿命の戦いをします。",
"長い戦いのすえ、ケンシロウはラオウを倒します。",
"しかしユリアもやがて亡くなります。",
"その後もケンシロウは、新しい敵と戦いながら旅を続けます。",
"そして成長したバットとリンを見守ったあと、またひとり、荒野の向こうへ歩いていくのでした。"
]},
{ cat:"m_battle", title:"キン肉マン", yomi:"キンにくマン", sub:"ゆでたまご", author:"ゆでたまご", icon:"🍚", text:[
"キン肉スグルという、少し情けないヒーローがいました。",
"みんなからは「キン肉マン」と呼ばれています。",
"牛丼が大好きで、失敗ばかり。",
"最初はだれからも立派なヒーローだと思われていませんでした。",
"ところがキン肉マンには、大きな秘密がありました。",
"じつは宇宙にあるキン肉星の王子だったのです。",
"キン肉マンは超人たちの大会「超人オリンピック」に出場します。",
"そこで、テリーマンやロビンマスクなどと戦います。",
"戦った相手は、やがて大切な仲間になっていきます。",
"その後、悪魔超人や悪魔将軍、完璧超人など、次々と強大な敵が現れます。",
"キン肉マンは何度も負けそうになります。",
"それでも仲間の声を聞くと立ち上がります。",
"「友情」が、キン肉マンのいちばん大きな力なのです。",
"最後には、キン肉星の王位をめぐる戦いにも巻きこまれます。",
"さまざまな候補者と戦い、キン肉マンは自分こそ本当の王子であることを証明します。",
"最初はダメな超人だったキン肉マンが、仲間に愛される本当の王へ成長していく物語です。"
]},
{ cat:"m_battle", title:"聖闘士星矢", yomi:"セイントセイヤ", sub:"車田正美", author:"車田正美", authorYomi:"くるまだまさみ", icon:"🌠", text:[
"星矢という少年は、小さいころに姉と引きはなされ、ギリシャへ送られました。",
"そこで厳しい修行を受け、女神アテナを守る戦士「聖闘士」になります。",
"星矢が手に入れたのは、ペガサスの聖衣です。",
"日本へ帰った星矢は、紫龍、氷河、瞬、一輝など、ほかの聖闘士たちと出会います。",
"最初は敵として戦うこともありましたが、やがてかけがえのない仲間になります。",
"そして城戸沙織という少女こそ、現代によみがえった女神アテナだと分かります。",
"沙織を守るため、星矢たちは十二宮へ向かいます。",
"そこには、十二人の黄金聖闘士が待っていました。",
"星矢たちは命をかけて十二宮を突破し、アテナを救います。",
"その後も海皇ポセイドン、そして冥王ハーデスとの戦いが起こります。",
"最後の戦いで、星矢たちは神であるハーデスにまで立ち向かいます。",
"星矢はアテナを守るため、ハーデスの剣を受けます。",
"大きな傷を負いながらも、最後まで立ち上がることをやめません。",
"人間でも、勇気があれば神にさえ立ち向かえる。",
"そんな少年たちの戦いをえがいた物語です。"
]},
{ cat:"m_sports", title:"キャプテン翼", yomi:"キャプテンつばさ", sub:"高橋陽一", author:"高橋陽一", authorYomi:"たかはしよういち", icon:"⚽", text:[
"大空翼という少年は、なによりもサッカーが大好きでした。",
"「ボールは友達」",
"翼はいつもボールといっしょです。",
"南葛市へ引っ越してきた翼は、天才ゴールキーパーの若林源三と出会います。",
"さらに岬太郎という最高の仲間もできました。",
"翼たちは全国大会を目指します。",
"そこには、日向小次郎という強力なライバルがいました。",
"日向は翼とはまったく違う、力強いサッカーをします。",
"二人は何度も戦い、おたがいに成長していきます。",
"中学生になると、さらに多くのライバルが現れます。",
"そして日本の少年たちは、ついに世界の選手たちとも戦うようになります。",
"翼の夢は、日本一になることだけではありません。",
"「いつか世界で戦うプロのサッカー選手になる」",
"その夢をかなえるため、翼は日本を飛び出します。",
"仲間やライバルたちも、それぞれの道で成長していきます。",
"少年がひとつのボールを追いかけながら、世界へ羽ばたいていく物語です。"
]},
{ cat:"m_battle", title:"シティーハンター", sub:"北条司", author:"北条司", authorYomi:"ほうじょうつかさ", icon:"🔫", text:[
"東京の新宿に、冴羽獠という男がいました。",
"獠は、警察では解決できない危険な仕事を引き受ける「シティーハンター」です。",
"銃の腕は超一流です。",
"けれども、美しい女性を見るとすぐにだらしなくなってしまいます。",
"最初は槇村秀幸という男とコンビを組んでいました。",
"ところが槇村は、犯罪組織との戦いで命を落とします。",
"そのあと、槇村の妹・香が獠の新しい相棒になります。",
"香は獠の仕事を助けながら、女性にだらしない獠を大きなハンマーでこらしめます。",
"二人はけんかばかりしています。",
"けれども危険な場面では、だれよりもおたがいを信じています。",
"獠にもまた、戦争や犯罪にかかわった暗い過去がありました。",
"さまざまな依頼を受けるうちに、その過去とも向き合っていきます。",
"香はしだいに獠を愛するようになり、獠も香を何より大切に思うようになります。",
"それでも二人は最後まで、素直な恋人のようにはなれません。",
"今日も新宿のどこかで、困っている人からの「XYZ」という依頼を待っているのでした。"
]},
{ cat:"m_battle", title:"魁!!男塾", yomi:"さきがけおとこじゅく", sub:"宮下あきら", author:"宮下あきら", authorYomi:"みやしたあきら", icon:"🏯", text:[
"日本に、「男塾」という、とんでもなく厳しい学校がありました。",
"そこへ剣桃太郎という青年が入ります。",
"男塾では、普通の授業よりも、命がけの修行ばかり行われます。",
"巨大な岩を動かしたり、火の中へ入ったり、どう見ても無理そうな試練に挑戦させられます。",
"桃太郎のまわりには、富樫源次、虎丸龍次、Jなど、熱い仲間が集まります。",
"最初はけんかをする相手でも、戦いのあとには強い友情が生まれます。",
"やがて男塾の生徒たちは、学校の外でも大きな戦いに参加します。",
"そこには、中国拳法や不思議な武術を使う強敵たちが待っています。",
"「そんな技、本当にあるの？」",
"と思うような技まで、さも昔から存在したかのように説明されます。",
"仲間が死んだと思ったら、驚くような方法で生きて帰ってくることもあります。",
"桃太郎たちは、命をかけた戦いをくぐりぬけながら、男同士の友情を深めていきます。",
"強さとは、ただ相手を倒すことではなく、仲間のために立ち上がることなのだとえがいた物語です。"
]},
{ cat:"m_sports", title:"よろしくメカドック", yomi:"よろしくメカドック", sub:"次原隆二", author:"次原隆二", authorYomi:"つぎはらりゅうじ", icon:"🏎️", text:[
"風見潤という青年は、車が大好きでした。",
"潤が働くのは、「メカドック」という小さな自動車工場です。",
"ここでは、普通の車を修理するだけではありません。",
"エンジンを改造し、車をもっと速くする「チューニング」を行っています。",
"潤は車の声を聞くように、一台一台の性能を考えます。",
"「この車なら、もっと速く走れる」",
"やがて潤たちは、自分たちが作った車でレースに出るようになります。",
"相手は、大きな会社が作った高性能の車や、すぐれた技術を持つライバルたちです。",
"お金も設備も負けています。",
"それでも潤は、知恵と技術で車を改造します。",
"直線で速いだけでは勝てません。",
"曲がる力、止まる力、運転する人との相性まで考えます。",
"レースを重ねるうちに、潤は整備士としてもドライバーとしても成長していきます。",
"『よろしくメカドック』は、人と車がいっしょになって速さを追い求める物語です。"
]},
{ cat:"m_gag", title:"ハイスクール!奇面組", spine:"ハイスクール!|奇面組", yomi:"ハイスクールきめんぐみ", sub:"新沢基栄", author:"新沢基栄", authorYomi:"しんざわもとえい", icon:"🤪", text:[
"一堂零という、とても変わった少年がいました。",
"零には、冷越豪、出瀬潔、大間仁、物星大という、同じくらい変わった仲間がいます。",
"五人はまとめて「奇面組」と呼ばれていました。",
"顔も行動も、とにかく変です。",
"河川唯という女の子と、友だちの宇留千絵は、そんな五人と同じ学校に通うことになります。",
"授業を受けているだけなのに、いつのまにか大さわぎ。",
"運動会をしても、文化祭をしても、普通には終わりません。",
"学年が上がり、中学校から高校へ進んでも、奇面組は変わりません。",
"たくさんの変わった生徒や先生たちも加わり、学校全体がギャグの世界になっていきます。",
"物語の最後では、それまでの出来事が唯の夢だったようにも見える場面があります。",
"しかし、そのあとに一堂零を思わせる姿も現れます。",
"本当に夢だったのか、それとも奇面組は本当にいたのか。",
"最後まで、少し不思議な余韻を残して終わる物語です。"
]},
{ cat:"m_battle", title:"ジョジョの奇妙な冒険", spine:"ジョジョの|奇妙な冒険", yomi:"ジョジョのきみょうなぼうけん", sub:"荒木飛呂彦", author:"荒木飛呂彦", authorYomi:"あらきひろひこ", icon:"⭐", text:[
"ジョースターという一族には、長い長い戦いの歴史がありました。",
"最初の主人公は、イギリスの青年ジョナサン・ジョースターです。",
"ジョナサンの家に、ディオ・ブランドーという少年がやってきます。",
"ディオはジョースター家を乗っ取ろうとし、やがて石仮面の力で人間をこえた怪物になります。",
"ジョナサンはディオと戦い、命を落とします。",
"しかし戦いは終わりません。",
"ジョナサンの孫ジョセフ、その子孫の空条承太郎、東方仗助、ジョルノ・ジョバァーナ、空条徐倫へと、主人公は世代をこえて受けつがれていきます。",
"やがて「スタンド」と呼ばれる、心の力が形になった能力も登場します。",
"時間を止める者。",
"物を直す者。",
"未来を読む者。",
"それぞれの能力をどう使うかが、勝負を決めます。",
"そして徐倫たちの戦いでは、世界そのものが大きく変わります。",
"その後は、これまでとは異なる世界で、新しいジョースターの物語が始まります。",
"時代も主人公も変わりながら、「人間が勇気を持って運命に立ち向かう」という心が受けつがれていく、大きな一族の物語です。"
]},
{ cat:"m_fantasy", title:"BASTARD!! -暗黒の破壊神-", spine:"BASTARD!!|-暗黒の破壊神-", yomi:"バスタード あんこくのはかいしん", sub:"萩原一至", author:"萩原一至", authorYomi:"はぎわらかずし", icon:"🔥", text:[
"魔法と剣が存在する世界に、ルーシェ・レンレンという少年がいました。",
"しかしルーシェの中には、もうひとつの人格が封じられていました。",
"その名は、ダーク・シュナイダー。",
"かつて世界を征服しようとした、ものすごく強い魔法使いです。",
"王国が危機におそわれたとき、人々は仕方なくダーク・シュナイダーの封印を解きます。",
"よみがえった彼は、わがままで、自信満々です。",
"けれども、ルーシェを大切にしていた少女ヨーコへの思いも持っています。",
"かつての仲間だった四天王たちも、敵として現れます。",
"さらに戦いは、人間同士の争いから、古代の破壊神や天使、悪魔たちの戦争へ広がっていきます。",
"世界そのものがほろびそうな戦いの中で、ダーク・シュナイダーは圧倒的な魔法を使って立ち向かいます。",
"ただし、この物語は長いあいだ続いており、まだすべての戦いに決着がついているわけではありません。",
"世界の運命をめぐる戦いは、まだ途中にあります。"
]},
{ cat:"m_battle", title:"ろくでなしBLUES", yomi:"ろくでなしブルース", sub:"森田まさのり", author:"森田まさのり", authorYomi:"もりたまさのり", icon:"🎸", text:[
"前田太尊という高校生がいました。",
"太尊はけんかがとても強く、いつも問題を起こしています。",
"しかし本当の夢は、プロのボクサーになることでした。",
"高校では、親友の勝嗣や米示たちと過ごします。",
"そして千秋という女の子に恋をします。",
"ところが太尊は不器用なので、自分の気持ちをなかなかうまく伝えられません。",
"学校の外では、東京のさまざまな場所から強い不良たちが現れます。",
"渋谷、浅草、池袋。",
"それぞれの町を代表するような強敵と、太尊は何度もぶつかります。",
"最初は敵だった相手とも、殴り合ったあとにはおたがいを認めるようになります。",
"太尊はけんかばかりしていますが、弱い人をいじめることは嫌います。",
"そして仲間のためなら、自分が傷つくことも恐れません。",
"高校生活が終わりに近づくと、太尊は自分の夢へ向かって進みます。",
"けんかの強さだけではなく、ボクサーとして本当に強い男になるため、新しい人生へ踏み出していくのでした。"
]},
{ cat:"m_battle", title:"幽☆遊☆白書", yomi:"ゆうゆうはくしょ", sub:"冨樫義博", author:"冨樫義博", authorYomi:"とがしよしひろ", icon:"👻", text:[
"浦飯幽助という、中学生の不良少年がいました。",
"けんかばかりして、学校にもあまり行きません。",
"ところがある日、幽助は道路へ飛び出した子どもを助け、車にはねられて死んでしまいます。",
"霊界の人々も、幽助がそんな行動をするとは思っていませんでした。",
"そこで幽助には、生き返るための試練が与えられます。",
"やがて幽助は人間の世界へ戻り、「霊界探偵」として妖怪が起こす事件を解決するようになります。",
"桑原、蔵馬、飛影という仲間もできます。",
"そして戸愚呂という、とても強い妖怪と出会います。",
"幽助たちは暗黒武術会に参加し、命がけで戸愚呂たちと戦います。",
"その後、仙水という元霊界探偵との戦いで、幽助自身にも妖怪の血が流れていることが分かります。",
"幽助は魔界へ行き、自分の祖先である雷禅と出会います。",
"やがて魔界の王を決める大きな大会が開かれます。",
"戦いが終わったあと、幽助は人間界へ帰ります。",
"そして待っていた螢子や仲間たちと再会し、自分の居場所へもどるのでした。"
]},
{ cat:"m_sports", title:"SLAM DUNK", spine:"SLAM|DUNK", yomi:"スラムダンク", sub:"井上雄彦", author:"井上雄彦", authorYomi:"いのうえたけひこ", icon:"🏀", text:[
"桜木花道という高校生は、けんかが強く、女の子にはふられてばかりでした。",
"ある日、赤木晴子という女の子に聞かれます。",
"「バスケットはお好きですか？」",
"晴子にひと目ぼれした花道は、",
"「大好きです！」",
"と答えてしまいます。",
"こうして、ほとんどバスケットを知らなかった花道は湘北高校バスケットボール部へ入ります。",
"最初は、晴子にかっこいいところを見せたいだけでした。",
"同じ一年生の流川楓を勝手にライバルだと思い、基本の練習も嫌がります。",
"けれども、キャプテン赤木や宮城、三井たちといっしょに試合をするうちに、花道は本当にバスケットを好きになります。",
"湘北は強豪校を倒し、ついに全国大会へ進みます。",
"そこで待っていたのは、全国最強の山王工業でした。",
"苦しい試合の中、花道は背中を痛めながらもプレーを続けます。",
"そして最後の最後、ずっと仲の悪かった流川からパスを受けます。",
"花道のシュートが決まり、湘北は山王を破ります。",
"しかし、その試合で力を使い果たし、次の試合では敗れて大会を去ります。",
"花道はけがを治すためリハビリに入ります。",
"それでも、",
"「天才ですから」",
"と笑いながら、もう一度コートへ戻る日を目指すのでした。"
]},
{ cat:"m_history", title:"るろうに剣心 -明治剣客浪漫譚-", spine:"るろうに剣心|-明治剣客浪漫譚-", yomi:"るろうにけんしん めいじけんかくろまんたん", sub:"和月伸宏", author:"和月伸宏", authorYomi:"わつきのぶひろ", icon:"🗡️", text:[
"明治時代の日本に、緋村剣心という旅人がいました。",
"剣心は腰に刀をさしています。",
"しかしその刀は、人を殺せない「逆刃刀」でした。",
"じつは剣心は、幕末の戦いで「人斬り抜刀斎」と恐れられた剣士でした。",
"新しい時代になったあと、剣心は、",
"「もう二度と人を殺さない」",
"と誓います。",
"東京で神谷薫という少女と出会い、彼女の道場に住むようになります。",
"相楽左之助や明神弥彦などの仲間もできます。",
"ところが、剣心の過去は彼を放っておきません。",
"かつての宿敵や、明治政府そのものをほろぼそうとする志々雄真実が現れます。",
"剣心は京都へ向かい、志々雄を倒します。",
"その後、雪代縁という男が現れます。",
"縁は、剣心が幕末に殺してしまった妻・巴の弟でした。",
"剣心は、自分が人斬りだったころの罪と、正面から向き合うことになります。",
"すべての戦いが終わったあと、剣心は薫と家庭をつくります。",
"過去を消すことはできません。",
"それでも剣心は、人を救いながら残りの人生を生きる道を選ぶのでした。"
]},
{ cat:"m_fantasy", title:"封神演義", yomi:"ほうしんえんぎ", sub:"藤崎竜", author:"藤崎竜", authorYomi:"ふじさきりゅう", icon:"🐉", text:[
"むかしの中国に、殷という国がありました。",
"その国の王は、妲己という美しい女性に夢中になっていました。",
"しかし妲己の正体は、強い力を持つ仙女です。",
"妲己は王をあやつり、多くの人々を苦しめます。",
"仙人の世界では、この乱れた世の中を変えるため、「封神計画」が始まります。",
"その役目をまかされたのが、太公望という若い仙人でした。",
"「悪い仙人たちを倒し、その魂を封神台へ送る」",
"それが太公望の仕事です。",
"太公望は四不象という不思議な生き物に乗り、仲間を増やしながら妲己たちと戦います。",
"しかし物語が進むと、善い仙人と悪い仙人を分けるだけでは解決できないことが分かってきます。",
"人間の国をだれが治めるのか。",
"仙人たちは人間にどこまでかかわるべきなのか。",
"さらに、世界そのものを長いあいだ動かしてきた大きな存在の秘密も明らかになります。",
"太公望は仲間たちと戦いながら、人間が自分たちの力で未来をつくれる世界を目指します。",
"妲己もまた、ただの悪役ではなく、自分だけの大きな目的を持っていました。",
"さまざまな思いがぶつかり合った末、人間の時代が始まっていく物語です。"
]},
{ cat:"m_horror", title:"地獄先生ぬ〜べ〜", spine:"地獄先生|ぬ〜べ〜", yomi:"じごくせんせいぬーべー", sub:"原作：真倉翔　作画：岡野剛", author:"真倉翔／岡野剛", authorYomi:"まくらしょう", icon:"👿", text:[
"童守小学校に、鵺野鳴介という先生がいました。",
"みんなからは「ぬ〜べ〜」と呼ばれています。",
"ぬ〜べ〜は少しドジで、お金もありません。",
"けれども、生徒のことをとても大切にする先生です。",
"そして左手には、大きな秘密がありました。",
"ぬ〜べ〜の左手には、恐ろしい鬼の力を封じた「鬼の手」があるのです。",
"学校や町には、ときどき妖怪や悪霊が現れます。",
"子どもたちだけではどうすることもできません。",
"そんなとき、ぬ〜べ〜は鬼の手を使って生徒を守ります。",
"しかし、すべての妖怪が悪いわけではありません。",
"悲しい理由で人間の前に現れる妖怪もいます。",
"ぬ〜べ〜は、倒すべきものと救うべきものを見分けながら事件を解決します。",
"やがて雪女のゆきめとも深く思い合うようになります。",
"大きな戦いを乗り越えたあと、ぬ〜べ〜は生徒たちに見送られ、新しい学校へ向かいます。",
"どこへ行っても、生徒を守る先生であることは変わらないのでした。"
]},
{ cat:"m_love", title:"I’’s", yomi:"アイズ", sub:"桂正和", author:"桂正和", authorYomi:"かつらまさかず", icon:"👀", text:[
"瀬戸一貴という高校生は、同じクラスの葦月伊織に恋をしていました。",
"伊織は美しく、演劇の仕事も始めています。",
"一貴は伊織と仲よくなりたいのですが、好きすぎるあまり、いつも反対のことを言ってしまいます。",
"そこへ、昔いっしょに遊んでいた秋葉いつきが帰ってきます。",
"いつきは明るく、一貴との距離もとても近い女の子です。",
"一貴の心は何度も揺れます。",
"それでも本当に好きなのは伊織でした。",
"やがて一貴と伊織は、おたがいの気持ちを確かめ、恋人になります。",
"しかし伊織が芸能の仕事を始めたことで、二人はなかなか会えなくなります。",
"まわりの人々から関係を反対されることもあります。",
"そして一貴自身の弱さや嫉妬から、何度もすれ違います。",
"大きな事件に巻きこまれ、一貴が重いけがをすることもあります。",
"それでも二人は、離れて初めて、おたがいがどれほど大切なのかを知ります。",
"たくさんの遠回りをしながら、一貴と伊織が自分の本当の気持ちを伝え合っていく恋の物語です。"
]},
{ cat:"m_love", title:"電影少女", yomi:"でんえいしょうじょ", sub:"桂正和", author:"桂正和", authorYomi:"かつらまさかず", icon:"📼", text:[
"弄内洋太という少年は、恋がうまくいかず、落ちこんでいました。",
"好きな女の子のもえみは、洋太ではなく、洋太の親友を好きだったのです。",
"そんなある日、洋太は不思議なビデオショップを見つけます。",
"そこで借りたビデオを再生すると、テレビの画面から女の子が飛び出してきました。",
"名前は天野あい。",
"あいは「電影少女」と呼ばれる存在で、傷ついた男の子の心を元気にするためにつくられた少女でした。",
"あいは洋太の恋を応援しようとします。",
"ところが、いっしょに過ごすうちに、あい自身が洋太を好きになってしまいます。",
"本来、電影少女が人間を本当に愛することは許されません。",
"そのため、あいを管理する世界から邪魔が入ります。",
"あいは消されそうになり、洋太は彼女を救おうとします。",
"二人は、自分たちの気持ちが本物なのだと証明しようとします。",
"長い苦しみのあと、あいはただの「作られた少女」ではなく、自分自身の人生を生きる存在になっていきます。",
"機械の中から現れた少女と少年が、本当の愛を見つける物語です。"
]},
{ cat:"m_gag", title:"こちら葛飾区亀有公園前派出所", spine:"こちら葛飾区|亀有公園前派出所", yomi:"こちらかつしかくかめありこうえんまえはしゅつじょ", sub:"秋本治", author:"秋本治", authorYomi:"あきもとおさむ", icon:"🚓", text:[
"東京の亀有にある小さな派出所に、両津勘吉という警察官がいました。",
"みんなからは「両さん」と呼ばれています。",
"警察官なのに、お金もうけが大好きです。",
"新しい遊びや機械にもすぐ飛びつきます。",
"「これは絶対にもうかるぞ！」",
"と思いつくと、ものすごい行動力で商売を始めます。",
"最初は本当に大金を手にすることもあります。",
"ところが欲を出しすぎて、最後には全部失ってしまいます。",
"上司の大原部長は、そんな両さんをいつもしかります。",
"中川や麗子など、派出所の仲間たちも両さんにふり回されます。",
"それでも両さんは、困っている人を見ると放っておけないところがあります。",
"子どものころの友だちや、下町の人々との思い出を大切にする一面もあります。",
"四十年にわたる連載の最後まで、両さんは大きく変わりません。",
"最終回でも「これですべて終わり」という雰囲気にはならず、亀有ではこれからも両さんが騒動を起こしていると思わせる形で物語は終わります。"
]},
{ cat:"m_space", title:"コブラ", sub:"寺沢武一", author:"寺沢武一", authorYomi:"てらさわぶいち", icon:"🔫", text:[
"宇宙を旅する男、コブラがいました。",
"左腕には、ふつうの腕のかわりに「サイコガン」という強力な武器がかくされています。",
"コブラはかつて、宇宙中で名前を知られた大海賊でした。",
"しかし敵に追われる生活に疲れ、自分の顔と記憶を変えて、普通の男として暮らしていました。",
"ある日、失った記憶がもどります。",
"「そうだ。俺はコブラだった」",
"相棒のレディ・アーマロイドと再会したコブラは、ふたたび宇宙へ飛び出します。",
"宇宙海賊ギルド、賞金稼ぎ、悪い支配者。",
"さまざまな敵がコブラをねらいます。",
"美しい女性を助けたり、伝説の宝を探したり、惑星そのものの運命をめぐって戦うこともあります。",
"コブラはどれほど危険な状況でも、冗談を忘れません。",
"そしてサイコガンは、ただ狙った場所ではなく、コブラの心が向けられた相手を撃ちぬきます。",
"ひとつの大きな結末へ向かう物語ではなく、宇宙を舞台にコブラの冒険が次々と続いていく作品です。"
]},
{ cat:"m_battle", title:"ブラック・エンジェルズ", spine:"ブラック・|エンジェルズ", sub:"平松伸二", author:"平松伸二", authorYomi:"ひらまつしんじ", icon:"🚲", text:[
"雪藤洋士という青年がいました。",
"雪藤は、自転車で日本を旅しているように見える青年です。",
"しかしその裏には、もうひとつの顔がありました。",
"法律では裁けない悪人を、自分の手で倒す「ブラック・エンジェル」だったのです。",
"世の中には、人をだましたり、弱い人を苦しめたりしながら、何の罰も受けない悪人がいます。",
"雪藤は、そんな人々の前に現れます。",
"そして自転車のスポークなどを武器にして、悪人を処刑します。",
"やがて雪藤だけではなく、同じような思いを持つ仲間たちも集まります。",
"しかし敵も、ただの犯罪者だけではなくなっていきます。",
"大きな組織や、普通の人間とは思えない力を持つ敵まで現れ、戦いはどんどん激しくなります。",
"正義のためなら、人を殺してもよいのか。",
"悪を倒す側も、また暗い道を歩くことになります。",
"『ブラック・エンジェルズ』は、正義と復讐のあいだを進む人々の、激しい戦いをえがいた物語です。"
]},
{ cat:"m_battle", title:"ウイングマン", sub:"桂正和", author:"桂正和", authorYomi:"かつらまさかず", icon:"🦸", text:[
"広野健太という中学生は、ヒーローが大好きでした。",
"自分で「ウイングマン」というヒーローを考え、いつも変身ポーズを練習しています。",
"もちろん、本当に変身できるわけではありません。",
"ところがある日、空からアオイという不思議な少女が現れます。",
"アオイは別の世界から逃げてきた少女でした。",
"そして彼女が持っていた「ドリムノート」には、書いたことを現実にする力がありました。",
"健太がノートにウイングマンを書きこむと、本当にウイングマンへ変身できるようになります。",
"「夢だったヒーローになれた！」",
"健太は喜びます。",
"しかしアオイを追って、別世界から恐ろしい敵もやってきます。",
"最初は遊びのようにヒーローをしていた健太も、仲間を守るために本気で戦うようになります。",
"戦いの中でアオイへの気持ちも強くなっていきます。",
"やがて健太は、自分が考えた空想のヒーローではなく、本当に人を守れるヒーローへ成長していくのでした。"
]},
{ cat:"m_love", title:"きまぐれオレンジ☆ロード", spine:"きまぐれ|オレンジ☆ロード", yomi:"きまぐれオレンジロード", sub:"まつもと泉", author:"まつもと泉", authorYomi:"まつもといずみ", icon:"🍊", text:[
"春日恭介という少年には、大きな秘密がありました。",
"恭介の家族は、超能力を使えるのです。",
"物を動かしたり、遠くへ瞬間移動したりできます。",
"しかし、そのことをほかの人に知られてはいけません。",
"ある日、恭介は鮎川まどかという少女と出会います。",
"まどかは大人っぽく、少し近寄りがたい雰囲気を持っています。",
"恭介はすぐにまどかを好きになります。",
"ところが、まどかの親友・檜山ひかるも恭介を好きになってしまいます。",
"ひかるは恭介と付き合っているつもりです。",
"恭介はひかるを傷つけたくありません。",
"けれども本当に好きなのはまどかです。",
"三人の関係は、長いあいだ曖昧なまま続きます。",
"超能力が原因で過去や未来へ行ってしまうなど、不思議な事件も起こります。",
"それでも最後に必要なのは、超能力ではありません。",
"恭介は自分の気持ちをごまかすのをやめ、まどかを選びます。",
"長く続いた三角関係に向き合い、二人がようやく本当の恋人になっていく物語です。"
]},
{ cat:"m_history", title:"花の慶次 -雲のかなたに-", spine:"花の慶次|-雲のかなたに-", yomi:"はなのけいじ くものかなたに", sub:"原作：隆慶一郎　漫画：原哲夫　脚本：麻生未央", author:"隆慶一郎／原哲夫／麻生未央", authorYomi:"りゅうけいいちろう", icon:"🐎", text:[
"戦国時代に、前田慶次という武将がいました。",
"慶次は、まわりの人と同じように生きることを嫌います。",
"派手な服を着て、大きな馬に乗り、強い相手がいれば堂々と立ち向かいます。",
"そんな男を、人々は「傾奇者」と呼びました。",
"慶次はとても強い武将ですが、ただ戦いが好きなわけではありません。",
"弱い人をいじめる者を嫌い、自分が正しいと思ったことのためなら、身分の高い相手にも逆らいます。",
"豊臣秀吉のような天下人を前にしても、慶次は自分らしさを失いません。",
"多くの武将や忍者たちと出会い、命がけの戦いを重ねます。",
"そして戦国の世が終わりへ向かう中でも、慶次は出世や名誉より、自分の心に従うことを選びます。",
"人に命令されて生きるのではなく、",
"「自分の人生は、自分で決める」",
"その思いをつらぬく男の物語です。"
]},
{ cat:"m_fantasy", title:"DRAGON QUEST -ダイの大冒険-", spine:"DRAGON QUEST|-ダイの大冒険-", yomi:"ドラゴンクエスト ダイのだいぼうけん", sub:"原作：三条陸　作画：稲田浩司　監修：堀井雄二", author:"三条陸／稲田浩司／堀井雄二", authorYomi:"さんじょうりく", icon:"🗡️", text:[
"モンスターたちと平和に暮らす少年、ダイがいました。",
"ダイの夢は、勇者になることです。",
"ある日、勇者を育てる先生アバンが島へやってきます。",
"ダイはアバンから修行を受けます。",
"ところが、魔王軍の司令官ハドラーが現れました。",
"アバンは弟子たちを守るため、自分の命をかけてハドラーと戦います。",
"ダイは友だちのポップと旅に出ます。",
"途中でマァム、ヒュンケル、レオナたちが仲間になります。",
"戦いの中で、ダイ自身にも大きな秘密があることが分かります。",
"ダイは、人間をこえた力を持つ「竜の騎士」バランの息子だったのです。",
"そしてハドラーよりもはるかに強い大魔王バーンが、世界をほろぼそうとしていました。",
"ダイたちは何度も負けそうになります。",
"とくに、臆病だったポップは、仲間を守るために命をかけられる大魔法使いへ成長していきます。",
"最後にダイは、大魔王バーンを倒します。",
"しかし直後、世界を巻きこむ大爆発を止めるため、ダイは爆弾とともに空へ飛びます。",
"そのあと、ダイの姿は見つかりませんでした。",
"けれども残された剣は光を放ちます。",
"仲間たちは、「ダイはどこかで生きている」と信じ、帰りを待ちつづけるのでした。"
]},
{ cat:"m_battle", title:"シャーマンキング", spine:"シャーマン|キング", sub:"武井宏之", author:"武井宏之", authorYomi:"たけいひろゆき", icon:"🔮", text:[
"麻倉葉という少年は、霊を見ることができました。",
"葉は「シャーマン」と呼ばれる人間です。",
"シャーマンは霊と話し、その力を借りることができます。",
"葉の夢は、",
"「楽に生きられる世界をつくること」",
"そのために、五百年に一度行われる「シャーマンファイト」へ参加します。",
"勝者はすべての霊の王「シャーマンキング」になれるのです。",
"葉は侍の霊・阿弥陀丸を仲間にします。",
"そして恐ろしい修行をさせる婚約者のアンナや、たくさんのライバルと出会います。",
"ところが最大の敵は、ハオというシャーマンでした。",
"ハオはとても強く、人間をほろぼしてシャーマンだけの世界を作ろうとしています。",
"しかもハオは、葉と深いつながりを持つ存在でした。",
"戦いを続けても、葉たちはハオの力には届きません。",
"そしてハオは本当にシャーマンキングになります。",
"普通なら、そこで世界は終わるはずでした。",
"しかし葉たちは、力だけでハオを倒すのではなく、彼の心に向き合おうとします。",
"ハオが長い時間の中で抱えてきた孤独や悲しみに触れ、人間をすぐにはほろぼさないよう説得します。",
"こうして世界には、まだやり直すための時間が残されるのでした。"
]},
{ cat:"m_battle", title:"烈火の炎", yomi:"れっかのほのお", sub:"安西信行", author:"安西信行", authorYomi:"あんざいのぶゆき", icon:"🔥", text:[
"花菱烈火という高校生は、忍者にあこがれていました。",
"「いつか本物の忍者になりたい」",
"そんな烈火には、不思議な力がありました。",
"手から炎を出すことができるのです。",
"ある日、佐古下柳という少女と出会います。",
"柳には、傷を治す力がありました。",
"烈火は柳を「姫」と呼び、自分が忍者として守ると決めます。",
"やがて烈火は、自分が本当に忍者の一族「火影」の生き残りだったことを知ります。",
"そして紅麗という、同じ炎の力を持つ男と出会います。",
"紅麗は烈火と深い血のつながりを持っていました。",
"二人は長い因縁で結ばれていたのです。",
"烈火は仲間たちとともに「裏武闘殺陣」という危険な大会に参加します。",
"そこで、それぞれ不思議な力を持つ「魔導具」を使って戦います。",
"最後には、不老不死を求める森光蘭との戦いへ向かいます。",
"烈火は自分の炎の正体と向き合い、仲間や柳を守るためにすべての力を使います。",
"長い戦いが終わったあと、烈火たちはようやく普通の生活へ戻っていくのでした。"
]},
{ cat:"m_battle", title:"金色のガッシュ!!", spine:"金色の|ガッシュ!!", yomi:"こんじきのガッシュ", sub:"雷句誠", author:"雷句誠", authorYomi:"らいくまこと", icon:"⚡", text:[
"高嶺清麿という中学生は、頭がよすぎるため学校になじめず、家にひきこもっていました。",
"ある日、ガッシュ・ベルという不思議な少年がやってきます。",
"ガッシュは、自分がどこから来たのかよく覚えていません。",
"清麿はガッシュが持っていた赤い本を読みます。",
"するとガッシュの口から、電撃が飛び出しました。",
"やがて二人は、ガッシュが「魔物の子」だと知ります。",
"百人の魔物の子どもたちが人間界へ送られ、それぞれ人間のパートナーと組んで戦っているのです。",
"最後まで本を燃やされなかった一人が、魔界の王になります。",
"清麿とガッシュも戦いに巻きこまれます。",
"しかしガッシュは言います。",
"「やさしい王様になる！」",
"ガッシュは敵をただ倒すのではなく、戦った相手とも心を通わせます。",
"キャンチョメ、ティオ、ウマゴンなど、大切な友だちもできます。",
"もちろん、すべての魔物がやさしいわけではありません。",
"恐ろしい力で支配しようとする者とも戦います。",
"仲間との別れを何度も経験しながら、最後に残ったのはガッシュとブラゴでした。",
"二人は全力で戦い、ガッシュが勝利します。",
"こうしてガッシュは魔界の王となり、みんなが安心して暮らせる国をつくろうと歩き始めるのでした。"
]},
{ cat:"m_horror", title:"GS美神 極楽大作戦!!", spine:"GS美神|極楽大作戦!!", yomi:"ゴーストスイーパーみかみ ごくらくだいさくせん", sub:"椎名高志", author:"椎名高志", authorYomi:"しいなたかし", icon:"💰", text:[
"美神令子という、とても美しくて強い女性がいました。",
"仕事は「ゴーストスイーパー」。",
"幽霊や妖怪を退治する専門家です。",
"ただし美神は、お金が大好きです。",
"「依頼料はいくら？」",
"困っている人を助ける前に、まずお金の話をします。",
"そんな美神の事務所で働くのが、横島忠夫です。",
"横島は女の人が大好きで、美神に安い給料でこき使われています。",
"さらに、おキヌという幽霊の少女も仲間になります。",
"最初の横島は、戦いではほとんど役に立ちません。",
"けれども数々の妖怪や悪魔との戦いを経験するうちに、意外な霊能力を目覚めさせていきます。",
"戦いの相手も、ただの幽霊から、世界の運命にかかわるような強大な存在へ変わっていきます。",
"美神、横島、おキヌたちは何度も危機を乗りこえます。",
"お金や欲の話ばかりしているように見えて、最後には仲間を守るために命をかける。",
"笑いと怪奇と大冒険がいっしょになった物語です。"
]},
{ cat:"m_battle", title:"今日から俺は!!", yomi:"きょうからおれは", sub:"西森博之", author:"西森博之", authorYomi:"にしもりひろゆき", icon:"😎", text:[
"三橋貴志という高校生は、転校をきっかけに考えました。",
"「今日から不良になろう！」",
"髪を金色に染め、強そうな格好をして、新しい学校へ向かいます。",
"ところが同じ日に、伊藤真司という少年も転校してきます。",
"伊藤も髪を立て、不良になっていました。",
"二人は最初、どちらが強いか張り合います。",
"けれどもやがて、最高の相棒になっていきます。",
"三橋はずる賢く、勝つためならだまし討ちも使います。",
"伊藤はまじめで、正々堂々と戦おうとします。",
"性格は正反対ですが、仲間が危ないときには二人とも命がけで助けます。",
"三橋は赤坂理子、伊藤は早川京子と親しくなります。",
"そして、ほかの学校の不良や、もっと危険な大人たちとも戦うようになります。",
"三橋は「卑怯者」と言われても気にしません。",
"しかし本当に大切な場面では、決して仲間を見捨てません。",
"高校生活の間、二人はけんかと笑いに満ちた毎日を送りながら、自分たちなりの青春を走りぬけるのでした。"
]},
{ cat:"m_battle", title:"うしおととら", sub:"藤田和日郎", author:"藤田和日郎", authorYomi:"ふじたかずひろ", icon:"🐯", text:[
"蒼月潮という少年の家は、お寺でした。",
"ある日、家の地下で巨大な妖怪を見つけます。",
"妖怪の体には、一本の槍が刺さっていました。",
"その槍は、妖怪を倒すためにつくられた「獣の槍」です。",
"潮が槍を抜くと、妖怪は自由になります。",
"潮はその妖怪を「とら」と呼ぶことにしました。",
"最初の二人は、まったく仲よくありません。",
"「いつかおまえを食ってやる」",
"とらはそう言います。",
"しかし、ほかの妖怪が人間をおそうと、潮ととらは力を合わせて戦います。",
"旅を続けるうちに、とらにも仲間を思う心があることが分かってきます。",
"そして最大の敵「白面の者」が現れます。",
"白面は、昔から人間や妖怪を恐怖におとしいれてきた巨大な怪物です。",
"潮の母親も、白面を封じるために長いあいだ戦っていました。",
"最後の戦いでは、人間も妖怪も力を合わせます。",
"潮ととらは白面に立ち向かい、ついに倒します。",
"しかし、その戦いでとらは消えてしまいます。",
"潮は大切な友だちを失います。",
"それでも最後には、「とらはきっとどこかにいる」と思わせる小さな希望を残して、物語は終わるのでした。"
]},
{ cat:"m_battle", title:"からくりサーカス", sub:"藤田和日郎", author:"藤田和日郎", authorYomi:"ふじたかずひろ", icon:"🎪", text:[
"才賀勝という少年は、大きな会社の財産を受けついだことで、命をねらわれるようになりました。",
"勝を助けたのは、加藤鳴海という青年です。",
"そして「しろがね」と名乗る女性も現れます。",
"しろがねは巨大な操り人形を使って戦います。",
"三人は力を合わせて敵から逃げます。",
"ところが戦いの途中で、鳴海と勝たちは離ればなれになってしまいます。",
"物語が進むと、敵の正体が「自動人形」と呼ばれる機械の人形たちだと分かります。",
"自動人形は、人間を苦しめる「ゾナハ病」という恐ろしい病気にもかかわっていました。",
"そしてこの戦いの始まりには、何百年も昔の兄弟と、フランシーヌという女性の悲しい恋がありました。",
"愛する人を手に入れたい。",
"そのゆがんだ願いが、長い時間をこえて多くの人を苦しめていたのです。",
"勝、鳴海、しろがねは、それぞれ別の場所で成長し、最後には同じ大きな戦いへ向かいます。",
"勝は、憎しみに負けず、敵の心まで救おうとします。",
"鳴海もしろがねも、自分たちが何のために生きるのかを見つけます。",
"長く続いた人間と人形の悲しい戦いは終わり、残された人々は新しい人生を歩き始めるのでした。"
]},
{ cat:"m_fight", title:"帯をギュッとね!", yomi:"おびをギュッとね", sub:"河合克敏", author:"河合克敏", authorYomi:"かわいかつとし", icon:"🥋", text:[
"粉川巧という少年は、柔道をしていました。",
"高校へ入ると、仲間たちといっしょに柔道部をつくります。",
"最初から全国一の強豪だったわけではありません。",
"部員の性格も、得意な技もばらばらです。",
"それでも練習を重ね、少しずつチームとしてまとまっていきます。",
"柔道は、力が強ければ勝てる競技ではありません。",
"相手の力を利用したり、一瞬のすきを見つけたり、試合の流れを読んだりする必要があります。",
"巧たちは試合で負けるたびに、",
"「どうすれば次は勝てるだろう」",
"と考えます。",
"全国には、自分たちより大きく、強く、経験も豊富な選手がたくさんいます。",
"しかし、同じ相手と何度も戦ううちに、ライバルとの友情も生まれていきます。",
"学校生活では恋や笑いもあり、柔道だけをしているわけではありません。",
"仲間といっしょに汗を流しながら、普通の高校生たちが少しずつ強くなっていく、明るく熱い青春物語です。"
]},
{ cat:"m_gag", title:"行け!稲中卓球部", spine:"行け!|稲中卓球部", yomi:"いけいなちゅうたっきゅうぶ", sub:"古谷実", author:"古谷実", authorYomi:"ふるやみのる", icon:"🏓", text:[
"稲豊中学校の卓球部に、前野という少年がいました。",
"けれども、前野たちは卓球だけをまじめにする部員ではありません。",
"井沢、田中、竹田たちと集まっては、毎日のようにくだらないことを考えます。",
"女の子にモテたい。",
"変な遊びをしてみたい。",
"人を笑わせたい。",
"そんなことばかりです。",
"もちろん卓球の試合をすることもあります。",
"けれども、試合より、その前後で起こる騒動のほうが大きくなることもあります。",
"前野たちは、ときには人に迷惑をかけ、ひどい失敗もします。",
"それでも、どこか憎めません。",
"かっこよくもなく、立派でもない少年たちが、くだらないことに全力をかけているからです。",
"物語が進んでも、前野たちが急に大人になるわけではありません。",
"中学生らしい欲や恥ずかしさやくだらなさを抱えたまま、毎日を過ごします。",
"『行け!稲中卓球部』は、何でもない青春の一日一日を、とことんばかばかしく、しかしどこか本気でえがいた物語です。"
]},
{ cat:"m_fantasy", title:"ONE PIECE", yomi:"ワンピース", sub:"尾田栄一郎", author:"尾田栄一郎", authorYomi:"おだえいいちろう", icon:"🏴‍☠️", text:[
"海賊たちが世界中の海を旅する「大海賊時代」。",
"少年モンキー・D・ルフィには、大きな夢がありました。",
"伝説の海賊王ゴールド・ロジャーが残したといわれる宝「ひとつなぎの大秘宝（ワンピース）」を見つけ、自分が海賊王になることです。",
"ルフィは子どものころ、「悪魔の実」を食べたことで、体がゴムのようにのびる不思議な力を手に入れました。そのかわり、海では泳げなくなってしまいます。",
"17歳になったルフィは、たった一人で海へ出ます。",
"旅の途中で、剣士のゾロ、航海士のナミ、狙撃手のウソップ、料理人のサンジなど、少しずつ仲間を増やしていきます。",
"さらに、チョッパー、ロビン、フランキー、ブルック、ジンベエも加わりました。",
"仲間たちは、それぞれ別の夢を持っています。",
"ルフィたちは海軍や悪い海賊と戦い、砂の国アラバスタ、空に浮かぶ島、世界政府の大きな施設、魚人島など、さまざまな場所を旅します。",
"しかし、ルフィの兄エースは大きな戦争の中で命を落とします。",
"ルフィは自分の弱さを知り、仲間たちと二年間の修行をします。",
"その後、新世界へ入り、ドフラミンゴや四皇カイドウなど、世界でもっとも強い海賊たちとも戦います。",
"そしてルフィの能力にも、世界の歴史につながる大きな秘密があることが分かってきます。",
"「空白の100年」とは何だったのか。",
"「D」の名を持つ人々とは何者なのか。",
"そしてワンピースとは、いったい何なのか。",
"ルフィたちは、世界そのものの秘密へ近づきながら、最後の海へ向かって航海を続けています。"
]},
{ cat:"m_battle", title:"NARUTO -ナルト-", yomi:"ナルト", sub:"岸本斉史", author:"岸本斉史", authorYomi:"きしもとまさし", icon:"🍥", text:[
"木ノ葉隠れの里に、うずまきナルトという少年がいました。",
"ナルトはいたずらばかりして、村の人たちから嫌われていました。",
"その理由を、ナルト自身はよく知りませんでした。",
"じつはナルトの体には、昔、村をおそった巨大な「九尾の狐」が封印されていたのです。",
"両親もいないナルトは、いつもひとりぼっちでした。",
"だからこそ、大きな夢を持っていました。",
"「いつか火影になって、村のみんなに自分を認めてもらう」",
"忍者になったナルトは、うちはサスケ、春野サクラ、先生のはたけカカシと同じ班になります。",
"最初はぶつかってばかりでしたが、少しずつ仲間になっていきます。",
"ところがサスケは、兄イタチへの復讐のため、里を出てしまいます。",
"ナルトはサスケを連れもどすと約束します。",
"そのころ、「暁」という組織が、ナルトの中の九尾をねらい始めます。",
"ナルトは修行を重ね、強くなっていきます。",
"そして、自分の父が四代目火影・波風ミナトであり、母がうずまきクシナだったことも知ります。",
"やがて忍者の世界全体を巻きこんだ大戦争が始まります。",
"ナルトとサスケは力を合わせ、うちはマダラやカグヤという強大な敵を倒します。",
"しかし最後に、二人は自分たちの考えを決着させるため戦います。",
"激しい戦いのすえ、二人はともに片腕を失います。",
"そこでサスケは、ようやくナルトの思いを受け入れました。",
"長い戦いのあと、ナルトはヒナタと結婚し、家族を持ちます。",
"そしてついに、ずっと夢見ていた火影となり、村を守る存在になるのでした。"
]},
{ cat:"m_battle", title:"BLEACH", yomi:"ブリーチ", sub:"久保帯人", author:"久保帯人", authorYomi:"くぼたいと", icon:"💀", text:[
"黒崎一護という高校生には、幽霊を見る力がありました。",
"ある夜、一護の家に「死神」の朽木ルキアがやってきます。",
"死神は、悪い霊「虚（ホロウ）」から人間を守る存在です。",
"ところがルキアは戦いで傷つき、一護に自分の死神の力を分け与えます。",
"こうして一護は、死神の力を持つようになりました。",
"一護は大きな刀を持ち、家族や友だちを守るために戦います。",
"ところが、死神の世界「尸魂界」では、人間に力を渡したルキアが罪に問われます。",
"一護は仲間たちと尸魂界へ乗りこみ、ルキアを救います。",
"しかし、その事件の裏では藍染惣右介という死神が大きな計画を進めていました。",
"藍染は死神と虚の力をこえた存在になろうとします。",
"一護は激しい戦いのすえ、藍染を倒しますが、そのために一度、死神の力を失います。",
"やがて力を取りもどした一護の前に、今度は「滅却師」の王ユーハバッハが現れます。",
"尸魂界そのものが大きな戦争に巻きこまれます。",
"戦いの中で一護は、自分の父が死神で、母が滅却師だったことを知ります。",
"自分の中には、人間、死神、虚、滅却師という、さまざまな力が流れていたのです。",
"最後に一護たちはユーハバッハを倒し、世界を守ります。",
"それから年月がたち、一護は織姫と結婚し、息子の一勇が生まれます。",
"ルキアも恋次と結婚し、娘の苺花が生まれました。",
"大きな戦いが終わったあとも、人間の世界と死神の世界は静かにつながりつづけています。"
]},
{ cat:"m_battle", title:"HUNTER×HUNTER", spine:"HUNTER×|HUNTER", yomi:"ハンターハンター", sub:"冨樫義博", author:"冨樫義博", authorYomi:"とがしよしひろ", icon:"🎣", text:[
"くじら島に、ゴンという少年が住んでいました。",
"ゴンは、死んだと聞かされていた父ジンが、じつは生きていることを知ります。",
"しかもジンは、世界中を旅する一流の「ハンター」でした。",
"ゴンは思います。",
"「ハンターって、家族を置いてでもなりたいほどすごい仕事なのかな」",
"それを確かめるため、ゴンもハンターを目指します。",
"ハンター試験で、暗殺者の家に生まれたキルア、医者を目指すレオリオ、一族の敵を追うクラピカと出会います。",
"四人は大切な仲間になります。",
"試験のあと、ゴンとキルアは「念」という不思議な力を学びます。",
"一方クラピカは、自分の一族を殺した盗賊集団「幻影旅団」を追います。",
"ゴンとキルアはゲームの世界「グリードアイランド」でも修行を続けます。",
"その後、「キメラ＝アント」という恐ろしい生物が現れます。",
"その王メルエムは、人間を食べる危険な存在でした。",
"しかし人間の少女コムギと出会ったことで、少しずつ心を変えていきます。",
"ゴンも大切な人を失った怒りから、自分の未来をすべて使うほどの力を出してしまいます。",
"戦いのあと、ゴンは重い傷を負いますが、キルアの妹アルカの力によって助けられます。",
"そしてゴンは、ついに父ジンと会うことができました。",
"しかし世界には、まだ人間がほとんど知らない「暗黒大陸」があります。",
"その場所を目指す船の中では、クラピカたちが王位をめぐる新しい争いに巻きこまれています。",
"ゴンの最初の目的はかなえられましたが、広い世界の冒険はまだ続いています。"
]},
{ cat:"m_drama", title:"DEATH NOTE", spine:"DEATH|NOTE", yomi:"デスノート", sub:"原作：大場つぐみ　作画：小畑健", author:"大場つぐみ／小畑健", authorYomi:"おおばつぐみ", icon:"📓", text:[
"夜神月という、頭のとてもよい高校生がいました。",
"ある日、学校の庭に黒いノートが落ちていました。",
"表紙には「DEATH NOTE」と書かれています。",
"そのノートには、",
"「名前を書かれた人間は死ぬ」",
"という恐ろしい力がありました。",
"ノートを落としたのは、死神リュークです。",
"月は考えます。",
"「悪人を全部消せば、犯罪のない世界を作れる」",
"月は犯罪者の名前を次々とノートに書きます。",
"やがて世界中で悪人が突然死ぬようになり、人々は謎の存在を「キラ」と呼ぶようになります。",
"しかし警察はキラを殺人犯として追います。",
"その捜査を指揮するのが、世界一の名探偵「L」です。",
"月とLは、おたがいの正体を探る頭脳戦を始めます。",
"月は自分がキラだと知られないようにしながら、警察の捜査にも参加します。",
"さらに、もう一冊のデスノートを持つ弥海砂も現れます。",
"長いだまし合いのすえ、月は死神レムを利用し、Lを死なせることに成功します。",
"月は勝ったように見えました。",
"しかしLのあとをつぐニアとメロが現れます。",
"二人は別々の方法で月を追いつめます。",
"最後にニアは、月がキラであることをみんなの前で証明します。",
"追いつめられた月は、なおもデスノートを使おうとしますが失敗します。",
"そして死神リュークは、最初から言っていたとおり、最後に月の名前を自分のノートへ書きます。",
"神のようになろうとした月は、ひとりの人間として死んでいくのでした。"
]},
{ cat:"m_sports", title:"ヒカルの碁", spine:"ヒカルの碁", yomi:"ヒカルのご", sub:"原作：ほったゆみ　漫画：小畑健", author:"ほったゆみ／小畑健", icon:"⚫", text:[
"進藤ヒカルという小学生は、囲碁のことをほとんど知りませんでした。",
"ある日、祖父の家で古い碁盤を見つけます。",
"すると、その碁盤に宿っていた平安時代の囲碁棋士・藤原佐為の霊が、ヒカルにだけ見えるようになります。",
"佐為には、千年たっても消えない願いがありました。",
"「神の一手を打ちたい」",
"ヒカルは佐為に頼まれ、代わりに囲碁を打つようになります。",
"そこで塔矢アキラという天才少年と出会います。",
"佐為の力で打ったヒカルは、アキラに勝ちます。",
"アキラは、",
"「この少年はいったい何者なんだ」",
"とヒカルを追いかけるようになります。",
"最初は佐為に言われるまま打っていたヒカルも、だんだん囲碁そのものを好きになります。",
"そして自分の力でアキラと戦いたいと思うようになります。",
"ヒカルは院生となり、プロ棋士になります。",
"一方、佐為はインターネットを使い、名人・塔矢行洋と最高の一局を打ちます。",
"やがて佐為は、自分が千年ものあいだ存在していた理由に気づきます。",
"自分の囲碁をヒカルへ受けつぐためだったのです。",
"そして佐為は突然、ヒカルの前から消えてしまいます。",
"ヒカルは悲しみ、囲碁をやめようとします。",
"しかし自分が打つ碁の中に、佐為が残っていることに気づきます。",
"ヒカルはもう一度碁盤の前へ戻ります。",
"最後には、日本を代表する若い棋士として外国の強豪たちとも戦うようになります。",
"神の一手へ続く長い道を、ヒカルたちはこれからも歩いていくのでした。"
]},
{ cat:"m_sports", title:"テニスの王子様", yomi:"テニスのおうじさま", sub:"許斐剛", author:"許斐剛", authorYomi:"このみたけし", icon:"🎾", text:[
"越前リョーマという少年は、小さいころからテニスをしていました。",
"父親は、かつて世界で活躍した天才選手・越前南次郎です。",
"リョーマも、とても高いテニスの才能を持っていました。",
"日本へ帰ってきたリョーマは、青春学園中等部、通称「青学」に入ります。",
"一年生なのに、すぐにテニス部のレギュラーになります。",
"しかし青学には、部長の手塚国光、不二周助、大石、菊丸など、強い先輩たちがいました。",
"リョーマは最初、自分のためにテニスをしていました。",
"けれども仲間と団体戦を戦ううちに、チームで勝つことの意味を知っていきます。",
"青学は全国大会を目指します。",
"氷帝、立海大など、強力な学校が次々と立ちはだかります。",
"最後の全国大会決勝では、最強の立海大と戦います。",
"リョーマは幸村精市と対戦します。",
"一時は自分のテニスを見失いますが、これまで出会った仲間やライバルとの試合を思い出し、もう一度テニスの楽しさを取りもどします。",
"そして幸村を破り、青学はついに全国優勝を果たします。",
"その後、リョーマはさらに強い相手を求め、世界へ向かって歩き始めるのでした。"
]},
