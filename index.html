{ cat:"shou", title:"スイミー", sub:"レオ・レオニ ／ 小学2年", author:"レオ・レオニ", icon:"🐠", text:[
"広い海のどこかに、小さな魚のきょうだいたちが、たのしくくらしていました。みんな赤いのに、一ぴきだけ、まっ黒な魚がいました。名前はスイミー。およぐのは、だれよりもはやい魚でした。",
"ある日、おなかをすかせたおそろしいまぐろが、ものすごいはやさでつっこんできて、赤い魚たちを、一口でのみこんでしまいました。にげのびたのは、スイミーだけでした。",
"スイミーはひとりぼっちで、くらい海のそこをおよぎました。こわくて、さびしくて、とても悲しい気もちでした。けれど、海には、すばらしいものがたくさんありました。すきとおって光るくらげ、力もちのいせえび、ゆらゆらゆれるこんぶやわかめの林……。見るたびに、スイミーは少しずつ元気をとりもどしました。",
"そんなある日、岩かげに、スイミーのきょうだいたちとそっくりな、小さな赤い魚たちを見つけました。「出てきて、いっしょにあそぼうよ」。でも、「だめだよ。大きな魚に食べられてしまう」。",
"スイミーは、うんとうんと考えました。そして、さけびました。「そうだ！みんないっしょにおよぐんだ。海でいちばん大きな魚のふりをして！」。スイミーはみんなに、けっしてはなればなれにならないこと、みんなもちばをまもることを教えました。",
"みんなが一ぴきの大きな魚みたいにおよげるようになったとき、まっ黒なスイミーは、その大きな魚の「目」のところに入りました。こうしてみんなは、朝のつめたい水の中を、ひるのかがやく光の中をおよぎ、大きな魚をおいだしたのです。"
]},
{ cat:"shou", title:"お手紙", yomi:"おてがみ", sub:"アーノルド・ローベル ／ 小学2年", author:"アーノルド・ローベル", icon:"📨", text:[
"がまくんは、げんかんの前にすわって、かなしそうにしていました。そこへ、親友のかえるくんがやってきます。「どうしたの、がまくん」。",
"「いまね、お手紙をまつ時間なんだ。でも、ぼくはいちども、お手紙をもらったことがないんだよ。だから、この時間は、とってもかなしいんだ」。ふたりは、いっしょにかなしい気分で、げんかんの前にこしをおろしました。",
"しばらくして、かえるくんは「ぼく、もう家へかえらなくちゃ」と、いそいで家へ帰りました。そして紙とえんぴつを出して、なにかを書き、ふうとうに入れて「がまくんへ」と書きました。",
"かえるくんは、知り合いのかたつむりくんに「この手紙を、がまくんの家へとどけてくれないかい」とたのみます。かたつむりくんは、はりきって引きうけてくれました。",
"がまくんの家にもどったかえるくんは、「もう少し、まってみたら」と言いますが、がまくんは「もうあきあきしたよ」とねころんでしまいます。とうとう、かえるくんは言いました。「だって、ぼくが、きみに手紙を出したんだもの」。そして、手紙に書いたことを話しました。きみが親友で、ぼくはうれしい、と。",
"「ああ、とてもいいお手紙だ」。ふたりは、げんかんに出て、しあわせな気もちで、いっしょにお手紙をまちました。四日たって、かたつむりくんがやっと家につき、がまくんにお手紙をわたしました。がまくんは、それをもらって、とてもよろこびました。"
]},
{ cat:"shou", title:"スーホの白い馬", yomi:"スーホのしろいうま", sub:"モンゴルの民話 ／ 小学2年", icon:"🎻", text:[
"むかし、モンゴルの草原に、スーホというまずしいひつじかいの少年が、おばあさんとくらしていました。スーホは歌がとてもじょうずな少年でした。",
"ある日の夕方、スーホは、地面にたおれてもがいている、生まれたばかりの白い子馬を見つけました。スーホは子馬をだいて帰り、心をこめてそだてました。子馬は、雪のように白い、りっぱな馬になりました。",
"ある夜、おおかみがひつじをおそいに来たときも、白い馬はひつじたちの前に立ちふさがって、ひっしにまもってくれました。スーホと白い馬は、きょうだいのように、なかよしになりました。",
"ある年、とのさまが競馬の大会をひらき、「一等になった者を、むすめのむこにする」と言いました。スーホは白い馬にのって、みごと一等になります。ところが、スーホがまずしいひつじかいだとわかると、とのさまはやくそくをやぶり、銀貨三まいをなげつけて、白い馬をむりやりとりあげてしまいました。",
"とのさまがみんなの前で白い馬にのろうとすると、白い馬はとのさまをふりおとし、スーホのもとへかけだしました。とのさまの家来たちは、にげる白い馬に、つぎつぎと矢をはなちました。白い馬は、体にたくさんの矢をうけながらも走りつづけ、スーホの家にたどりついたところで、力つきてしまいました。",
"悲しみにくれるスーホのゆめに、白い馬があらわれて言いました。「わたしの骨や皮や毛で、楽器をつくってください。そうすれば、いつまでもあなたのそばにいられます」。スーホはそのとおりに楽器をつくりました。それが、馬頭琴（ばとうきん）です。スーホがひく馬頭琴の音は、やがてモンゴルの草原じゅうに広がっていきました。"
]},
{ cat:"shou", title:"白いぼうし", yomi:"しろいぼうし", sub:"あまんきみこ ／ 小学4年", author:"あまんきみこ", icon:"🧢", text:[
"タクシーの運転手の松井さんの車には、夏みかんがひとつのっていました。いなかのお母さんが、送ってくれたものです。あまりにいいにおいなので、とくべつに一つ、車にのせてきたのでした。",
"ある暑い日、道のわきに、小さな白いぼうしがおちているのを見つけました。車をとめて、ひろいあげたとたん、中から一ぴきのもんしろちょうが、ひらりととびだしていきました。",
"ぼうしのうらには、赤いししゅう糸で、男の子の名前が書いてありました。「せっかくつかまえたちょうを、にがしてしまった。あの子、がっかりするだろうな」。そこで松井さんは、ぼうしの中に夏みかんを入れて、とばないように石でつばをおさえておきました。",
"車にもどると、いつのまにか、うしろのせきに、おかっぱのかわいい女の子がちょこんとすわっていました。女の子は、道にまよってしまったと言い、菜の花のさく町へ行きたいとたのみます。遠くから、さっきの男の子が、お母さんの手を引いてやってくるのが見えました。女の子は、なぜかあわてたように「早く行って」とせかします。",
"松井さんはふしぎに思いながらも、車を走らせました。ぼうしの中から夏みかんが出てきたら、男の子はどんな顔をするだろう、と考えると、思わずわらってしまいます。",
"ところが、ふと気がつくと、うしろのせきには、だれもいませんでした。車をとめた小さな団地の前の野原には、白いちょうがたくさんとんでいます。そのとき松井さんには、ちょうたちが「よかったね」とよろこびあう、小さな小さな声が聞こえたような気がしました。"
]},
{ cat:"shou", title:"ちいちゃんのかげおくり", sub:"あまんきみこ ／ 小学3年", author:"あまんきみこ", icon:"👥", text:[
"「かげおくり」というのは、晴れた日に、自分のかげをじっと見つめて、十かぞえるあいだまばたきをせず、それから空を見あげると、白いかげが空にうつって見える、という遊びです。",
"せんそうに行くお父さんが、出かける前の日、ちいちゃんとお兄ちゃん、お母さんといっしょに、家族四人でかげおくりをしました。空には、四つの白いかげが、くっきりとうつりました。",
"やがて、ちいちゃんの住む町も、空しゅうをうけるようになりました。夏のある夜、ばくだんがおちてきて、町は火の海になります。ちいちゃんはお母さんとお兄ちゃんといっしょににげましたが、人ごみの中で、ひとりはぐれてしまいました。",
"ちいちゃんは、近所の人に助けられ、やけてしまった家のあとへもどりました。「お母ちゃんとお兄ちゃんは、きっとここに帰ってくる」。こわれかかった暗いぼうくうごうの中で、ちいちゃんはひとりで、家族をまちつづけました。",
"何日かたった、明るい朝。ちいちゃんが、ふらふらと立ちあがってかげおくりをすると、空に、お父さんとお母さんとお兄ちゃんのかげがうかびあがりました。そして、ちいちゃんの体は、ふわりと空にすいこまれていきました。ちいちゃんは、空いちめんの花畑の中で、家族みんなとわらいながら走っていきました。こうして、小さな女の子の命が、空にきえていったのです。",
"それから何十年もたって、町にはまた家が建ちならび、ちいちゃんがかげおくりをした場所は、小さな公園になりました。青い空の下、いまは子どもたちが、元気な声をあげて遊んでいます。"
]},
{ cat:"shou", title:"一つの花", yomi:"ひとつのはな", sub:"今西祐行 ／ 小学4年", author:"今西祐行", authorYomi:"いまにしすけゆき", icon:"💐", text:[
"せんそうがはげしかったころ、食べるものは、じゅうぶんにありませんでした。赤ちゃんのゆみ子がはじめておぼえた言葉は、「一つだけちょうだい」でした。",
"お母さんは、自分の分からゆみ子に分けてあげるとき、いつも「一つだけよ」と言っていたのです。お父さんは、「この子は、一つだけのよろこびさえ、もらえないかもしれないね」と、ゆみ子を高い高いしてあげるのでした。",
"やがて、体のあまりじょうぶでないお父さんも、せんそうに行かなければならない日がやってきました。お母さんにおぶわれたゆみ子もいっしょに、駅までお父さんを見おくりに行きます。",
"駅で、ゆみ子は、おにぎりを「一つだけちょうだい」と、ぜんぶ食べてしまい、また泣きだしそうになりました。そのとき、お父さんは、ホームのはしのごみすて場のようなところに、わすれられたようにさいていたコスモスの花を見つけて、一輪つんできました。",
"お父さんは、「一つだけのお花だよ。大切にするんだよ」と、ゆみ子に花をわたしました。ゆみ子は花をもらうと、キャッキャッとよろこびました。お父さんはそれを見て、にっこりわらうと、なにも言わずに汽車にのっていきました。ゆみ子のにぎっている、一つの花を見つめながら……。",
"それから十年の年月がすぎました。ゆみ子は、お父さんの顔をおぼえていません。けれど、ゆみ子の小さな家は、コスモスの花でいっぱいにつつまれています。ゆみ子はお母さんのために、明るい声で、お昼のしたくをしているのでした。"
]},
{ cat:"shou", title:"大造じいさんとガン", yomi:"だいぞうじいさんとガン", sub:"椋鳩十 ／ 小学5年", author:"椋鳩十", authorYomi:"むくはとじゅう", icon:"🦅", text:[
"りょうしの大造じいさんがかりをする沼地に、毎年、ガンのむれがやってきます。そのむれをひきいるのは、左右のつばさに、まっ白なまじり毛がある一羽のガン。「残雪（ざんせつ）」とよばれる、とてもかしこい頭領でした。残雪がきてからは、一羽のガンもとれなくなってしまったのです。",
"大造じいさんは、たくさんのうなぎつりばりをしかけて、一羽をつかまえることに成功しました。ところがつぎの日からは、残雪がなかまを引きつれて、はりのない場所ばかりをえらぶようになります。つぎの年には、えさのタニシをまいて、小屋にかくれて待ちぶせましたが、残雪はあやしいと気づいて、むれをべつの場所へみちびいていきました。",
"その翌年。大造じいさんは、前につかまえて飼いならしたガンを「おとり」にして、残雪のなかまをつかまえようと考えました。ところが、そのとき、空からハヤブサがおそいかかってきたのです。むれはにげましたが、おとりのガンだけは、飼いならされていたのでにげおくれてしまいました。",
"そのとき、一羽のガンがハヤブサの前にとびだしてきました。残雪です。残雪は、なかまを助けるために、ハヤブサにはげしくぶつかっていきました。大造じいさんはじゅうをかまえましたが、なぜか、うつことができませんでした。",
"ハヤブサとの戦いで、残雪はきずつき、沼地におちました。大造じいさんがかけつけると、残雪はむねのあたりを赤くそめながらも、首を持ちあげて、じいさんを正面からにらみつけました。それは、頭領としてのいげんを、きずつけまいとする、りっぱなすがたでした。大造じいさんは、強く心をうたれました。",
"大造じいさんは残雪をつれて帰り、ひと冬、たいせつに手当てをしてやりました。春になり、残雪がすっかり元気になると、大造じいさんはおりをあけてやります。そして、心の中で、「ガンの英雄よ、また正々堂々と勝負しよう」とよびかけました。残雪は、北へむかって、まっすぐにとびさっていきました。大造じいさんは、いつまでもそれを見まもっていました。"
]},
{ cat:"shou", title:"やまなし", sub:"宮沢賢治 ／ 小学6年", author:"宮沢賢治", authorYomi:"みやざわけんじ", icon:"🫧", text:[
"これは、小さな谷川のそこをうつした、二まいの青いげんとうのお話です。",
"一まい目は、五月。二ひきのかにの子どもたちが、青白い水のそこで話をしています。「クラムボンはわらったよ」「クラムボンはかぷかぷわらったよ」。クラムボンがなんなのかは、だれにもわかりません。上のほうを、魚が行ったり来たりしています。",
"すると、とつぜん、天井から青びかりのするとがったものが、鉄砲だまのようにとびこんできました。そして、魚はどこかへ消えてしまいました。かにの子どもたちは、ぶるぶるふるえます。お父さんのかにが言いました。「それは、かわせみだ。だいじょうぶ、おれたちは、かまわないんだから」。",
"二まい目は、十二月。かにの子どもたちは、すっかり大きくなりました。月の光がすきとおる水のそこで、兄弟は、どっちのあわが大きいか、くらべっこをしていました。",
"そのとき、トブン。黒いまるいものが、上からおちてきました。「かわせみだ！」とかにの子どもたちは首をすくめますが、お父さんのかには、よく見て言いました。「そうじゃない、あれはやまなしだ。いいにおいだろう」。",
"やまなしは、水の上をぷかぷかながれていき、木の枝にひっかかってとまりました。「もう二日ばかり待つと、ひとりでにおいしいお酒ができるから」。三びきのかには、自分たちの穴へ帰っていきました。水のそこでは、月の光が、まるでダイヤモンドのこなをはいているように、青くゆらゆらとかがやいていました。"
]},
{ cat:"shou", title:"わらぐつの中の神様", yomi:"わらぐつのなかのかみさま", sub:"杉みき子 ／ 小学5年", author:"杉みき子", authorYomi:"すぎみきこ", icon:"🥾", text:[
"雪のふる日、マサエは、ぬれたスキーぐつをかわかしながら、おばあちゃんに「わらぐつなんて、みっともないよ」と言いました。すると、おばあちゃんは、「わらぐつの中には、神様がいるんだよ」と、むかし話をはじめました。",
"むかし、おみつさんという、わかいむすめがいました。おみつさんは、町の朝市で見た、きれいな雪げたがほしくてたまりません。そこで、自分でわらぐつをあんで、それを売ったお金で、雪げたを買おうと考えました。",
"おみつさんがあんだわらぐつは、形はあまりよくありませんでした。けれど、はく人が、あたたかく、長く、気もちよくはけるように、心をこめて、しっかりとあんだものでした。朝市に持っていっても、形がぶかっこうなので、なかなか売れません。",
"そこへ、わかい大工さんがやってきて、わらぐつを買ってくれました。それからも、大工さんはおみつさんのわらぐつを、なんどもなんども買ってくれるのでした。",
"ある日、大工さんは言いました。「おれたち大工は、使う人の身になって、いい仕事をするのがだいじなんだ。このわらぐつは、そういう心でつくってある。あんたのような人に、うちへきてもらいたいんだ」。そして、おみつさんに、あの雪げたをプレゼントしてくれたのです。",
"「その大工さんがね、マサエのおじいちゃんなんだよ」。おばあちゃんが、そう話しおえたとき、ちょうど、おじいちゃんが帰ってきました。心をこめてつくったものには、神様がやどる――。マサエは、わらぐつを、あたたかい気もちで見つめるのでした。"
]},
{ cat:"shou", title:"海の命", yomi:"うみのいのち", sub:"立松和平 ／ 小学6年", author:"立松和平", authorYomi:"たてまつわへい", icon:"🌊", text:[
"太一の父は、海にもぐって魚をとる、村いちばんのもぐり漁師でした。ある日、父は、「瀬の主（せのぬし）」とよばれる、とてつもなく大きなクエにいどみ、そのまま帰らぬ人となってしまいました。",
"大きくなった太一は、与吉じいさという年よりの漁師に弟子入りしました。与吉じいさは、魚を必要な分しかとりません。たくさんいる魚のうち、ほんの少しだけをいただけば、ずっとこの海で生きていける――それが、じいさんの教えでした。太一は、じいさのもとで、海とともに生きることを学んでいきました。",
"やがて与吉じいさは年をとり、しずかに息を引きとりました。太一は、じいさんも海に帰っていったのだと思い、心から感謝しました。",
"りっぱな漁師になった太一は、ついに、父がなくなった瀬へもぐります。そこで太一は、青い宝石のような目をした、巨大なクエと出会いました。これこそが、父のかたきかもしれない、瀬の主です。",
"クエは、おだやかな目で太一を見つめ、動こうとしません。太一は、もりをつき出そうとしましたが、どうしてもそれができませんでした。太一は、このクエを「お父さんなのだ」と思うことにしました。そう思うと、ころさずにすむのです。太一はにっこりほほえむと、クエをうたずに、海の上へもどっていきました。",
"それから太一は、村のむすめとけっこんし、四人の子どもにめぐまれ、村いちばんの漁師として、海とともに生きました。太一は、あの日、瀬の主をうたなかったことを、だれにも話しませんでした。"
]},
{ cat:"shou", title:"カレーライス", sub:"重松清 ／ 小学6年", author:"重松清", authorYomi:"しげまつきよし", icon:"🍛", text:[
"小学六年生のひろしは、お父さんとけんかをしていました。ゲームを長くやりすぎて、お父さんにむりやり電源を切られてしまったのです。「ごめんなさい」と言えばいいのはわかっているのに、どうしてもすなおになれません。",
"ちょうどそのころ、ひろしの家は「お父さんウィーク」でした。お母さんの仕事がいそがしい一週間は、お父さんが早く帰ってきて、晩ごはんをつくるのです。お父さんのつくるカレーは、ひろしのすきな味でした。でも、けんかのせいで、話もしないまま日がすぎていきます。",
"ある日、お父さんがかぜをひいて、早く帰ってきました。ひろしは、晩ごはんに、自分でカレーをつくることにします。台所をさがすと、お父さんが買っておいたカレーのルーは、「あまくち」でした。",
"「ひろしは、あまくちじゃないとだめだからな」。お父さんは、まだひろしのことを、小さな子どもだと思っているのです。「ぼく、もう『中辛』だよ」とひろしが言うと、お父さんはびっくりして、それから、なんだかうれしそうに笑いました。",
"ふたりは、いっしょに台所に立って、中辛のカレーをつくりました。いつものカレーより、ちょっとからくて、ちょっとあまい。ひろしは、お父さんとならんでカレーを食べながら、心の中のもやもやが、すうっととけていくのを感じていました。"
]},
{ cat:"shou", title:"森へ", yomi:"もりへ", sub:"星野道夫 ／ 小学6年", author:"星野道夫", authorYomi:"ほしのみちお", icon:"🌲", text:[
"写真家の星野道夫さんが、アラスカの南東部の、ふかい森を旅したときのお話です。",
"朝のきりの中、星野さんはカヌーで入り江をすすみ、しずかな森へと上陸しました。森の中は、こけにおおわれた大きな木々がどこまでもつづき、しんと、音のない世界でした。",
"森をあるくと、たおれた木の上に、たくさんの小さな芽がはえているのが見えます。たおれた木が、新しい木をそだてるベッドになっているのです。長い時間をかけて、森の命は、そうやって、つぎへとつながっていきます。",
"川には、たくさんのサケがのぼってきていました。そのサケを食べたクマの足あとや、食べのこしも見つけます。サケは、海の栄養を森へ運び、森の木々をそだてているのです。海と森は、ちゃんとつながっているのでした。",
"ふかい森の中で、星野さんは、自分もまた、この大きな命のつながりの中の一つなのだと感じました。森をあとにするとき、星野さんの心には、生きものたちの命のふしぎさと、そのたくましさが、しずかにのこっていました。"
]},

/* ---------- 中学校 ---------- */
{ cat:"chuu", title:"少年の日の思い出", yomi:"しょうねんのひのおもいで", sub:"ヘルマン・ヘッセ ／ 中学1年", author:"ヘルマン・ヘッセ", icon:"🦋", text:[
"ある夏の夕方、「私」の家をたずねた友人は、「私」のちょうの標本を見て、ふしぎそうな顔をしました。そして、自分が少年のころのつらい思い出を、ぽつりぽつりと話しはじめました。",
"少年のころ、「僕」はちょうあつめにむちゅうでした。となりの家には、エーミールという、なにもかもきちんとした、先生の息子がいました。「僕」は、エーミールのことが、うらやましくもあり、きらいでもありました。",
"ある日、エーミールが、とてもめずらしい「クジャクヤママユ」というちょうを、さなぎからかえしたといううわさを聞きます。どうしても見たくなった「僕」は、エーミールのるすの部屋にしのびこみ、そのちょうを見てしまいました。そして、どうしてもほしくなって、ポケットに入れて持ちだしてしまったのです。",
"階段で人の気配がして、「僕」はあわててポケットの中にちょうをかくしました。けれど、すぐに、たいへんなことをしたと気づいて部屋にもどり、ちょうをとりだすと……。ちょうは、ポケットの中で、こなごなにつぶれてしまっていました。",
"お母さんに話すと、「エーミールのところへ行って、あやまりなさい」と言われました。「僕」は、自分のおもちゃや、ちょうの標本をぜんぶあげると言って、あやまりました。けれどエーミールは、おこりもせず、ただつめたく「僕」を見て、きみは、そういう人間なんだね、というように言いはなちました。",
"その夜、「僕」は、自分の部屋で、大切にしていたちょうの標本を、一つずつ、指でこなごなにおしつぶしてしまいました。一度おかしたあやまちは、もう二度ととりかえしがつかない。「僕」は、そのことを思い知ったのでした。"
]},
{ cat:"chuu", title:"盆土産", yomi:"ぼんみやげ", sub:"三浦哲郎 ／ 中学1年", author:"三浦哲郎", authorYomi:"みうらてつお", icon:"🍤", text:[
"東北の山あいの村に、「ぼく」は、ねえちゃんと、ばあちゃんとくらしていました。お母さんは、もうなくなっていて、お父さんは、東京へ出かせぎに行っています。",
"お盆に、お父さんが帰ってくることになりました。電報には「えびフライ」とだけ書いてありました。えびフライ？ぼくは、それがどんな食べものなのか、よくわかりません。川でとってきた、はやという魚を食べさせてもらおうと、とりに行ったりしました。",
"帰ってきたお父さんのおみやげは、こおらせたえびフライでした。ドライアイスでひやして、とけないように、東京から大切に持ってきたのです。",
"その夜、お父さんが油であげたえびフライは、ぱりぱりとこうばしく、しっぽまでおいしくて、ぼくもねえちゃんもばあちゃんも、むちゅうで食べました。ばあちゃんは、うまく言えずに「えんびフライ」と言っていました。",
"つぎの日は、お墓まいりです。ばあちゃんは、お墓の前で、なくなったお母さんに、えびフライのことを話していました。",
"お盆がおわると、お父さんはまた東京へもどります。バスにのるお父さんに、ぼくは「さよなら」と言おうとしたのに、口から出たのは、なぜか「えんびフライ」という言葉でした。お父さんは、ちょっとわらって、こんどはもっとたくさん買ってくると言いながら、バスにのっていきました。"
]},
{ cat:"chuu", title:"オツベルと象", yomi:"オツベルとぞう", sub:"宮沢賢治 ／ 中学1年", author:"宮沢賢治", authorYomi:"みやざわけんじ", icon:"🐘", text:[
"ある牛かいが話したお話です。オツベルという男は、新しい機械をならべた大きな仕事場を持ち、たくさんの百姓をはたらかせている、たいへんなお金持ちでした。",
"ある日、そこへ、一ぴきの白い象が、ぶらりとやってきました。オツベルは、うまいことを言って白い象を自分のものにすると、足に重い鎖をつけて、はたらかせはじめました。",
"白い象は、はじめのうちは「ああ、せいせいした。仕事はおもしろいね」と、よろこんではたらいていました。けれどオツベルは、しだいに仕事をふやし、あたえるわらはへらしていきます。白い象は、だんだんやせて、弱っていきました。",
"ある晩、白い象は月にむかって、「もう、さようなら、サンタマリア」と、つぶやきました。すると月が、「なかまへ手紙を書いたらいいや」と教えてくれました。白い象は、赤い着物の子どもに手紙をとどけてもらいました。",
"手紙を読んだ山の象たちは、「オツベルをやっつけよう」と、大声をあげて、どしどしと、オツベルの屋しきへおしよせました。象たちは、へいをこわして中へなだれこみ、オツベルは、象たちにふみつぶされてしまいました。",
"鎖をとかれた白い象は、すっかりやせていました。「ああ、ありがとう。ほんとうにぼくは助かったよ」。白い象は、さびしそうに、わらったのでした。"
]},
{ cat:"chuu", title:"トロッコ", sub:"芥川龍之介 ／ 中学2年", author:"芥川龍之介", authorYomi:"あくたがわりゅうのすけ", icon:"🛤️", text:[
"良平が八つのとき、村で鉄道の工事がはじまりました。良平は、土を運ぶトロッコにのってみたくてたまりません。ある日の夕方、わかい二人の土工（工事の人）に、「おじさん、おしてやろうか」と声をかけると、「おお、おしてくよう」と、いっしょにトロッコをおさせてくれました。",
"のぼり坂ではトロッコをおし、くだり坂ではトロッコにとびのって、風をきって走ります。良平は楽しくてたまりませんでした。「いつまでもおしていいか」「いいとも」。",
"ところが、トロッコは、どんどん遠くへ行ってしまいます。竹やぶをぬけ、海が見えるところまで来たとき、良平は、急に心ぼそくなってきました。「もう帰ってくれればいい」。",
"土工たちは、茶店でひと休みしたあと、良平に言いました。「われ（おまえ）はもう帰んな。おれたちは、きょうはむこうどまりだから」。良平は、ぼうぜんとしました。ひとりで、あの長い道を歩いて帰らなければならないのです。",
"日がくれていく中、良平は泣きそうになりながら、線路にそって走りだしました。じゃまになるぞうりをぬぎすて、羽織もぬぎすて、ただひっしに走りつづけます。",
"ようやく村のあかりが見え、家にかけこんだとたん、良平は、わっと大声で泣きだしました。大人になった良平は、いまでも、つかれてどうしようもないとき、あのときの、うす暗いやぶや坂のある道が、細く長くつづいているのを思い出すのでした。"
]},
{ cat:"chuu", title:"字のない葉書", yomi:"じのないはがき", sub:"向田邦子 ／ 中学2年", author:"向田邦子", authorYomi:"むこうだくにこ", icon:"📮", text:[
"筆者の父は、いつもいばっていて、すぐにどなる、こわいお父さんでした。けれど、はなれてくらす娘への手紙では、ていねいな言葉で、やさしい父親のすがたを見せる人でもありました。",
"せんそうがはげしくなったころ、まだ字の書けない、いちばん下の妹が、ひとりで遠くの町へ疎開（そかい）することになりました。父は、自分あての住所を書いたはがきをたくさん用意して、妹に言いました。「元気な日は、丸を書いて、毎日一まいずつポストに入れなさい」。",
"さいしょにとどいたはがきには、はみ出しそうなほど大きな、赤い丸が書いてありました。けれど、つぎの日から、丸はだんだん小さくなっていきます。そしてとうとう、「バツ」が書かれたはがきがとどき、やがて、はがきは来なくなりました。",
"母がむかえに行くと、妹は病気になって、やせほそっていました。家にのこっていた子どもたちは、妹をよろこばせようと、畑のかぼちゃを、大きいのも小さいのも、ぜんぶとって、家の前にならべました。",
"妹が帰ってくる日、「帰ってきたよ！」という声を聞いた父は、はだしのままで外へとびだしました。そして、やせた妹のかたをだきしめて、声をあげて泣いたのです。筆者は、大人の男の人が声をあげて泣くのを、そのときはじめて見たのでした。"
]},
{ cat:"chuu", title:"走れメロス", yomi:"はしれメロス", sub:"太宰治 ／ 中学2年", author:"太宰治", authorYomi:"だざいおさむ", icon:"🏃", text:[
"羊かいの若者メロスは、妹の結婚式の買いものをしに、町へやってきました。ところが、町はしずまりかえっています。王さまが、人を信じることができず、つぎつぎに人を死刑にしているというのです。まっすぐなメロスは、かっとなって、王さまのお城へのりこみ、つかまってしまいました。",
"死刑を言いわたされたメロスは、王さまにたのみます。「三日だけ待ってください。妹の結婚式をすませたら、かならずもどってきます。そのあいだ、わたしの親友のセリヌンティウスを、人じちにおいていきます」。王さまは、「どうせ帰ってこないだろう」と、あざわらいながら、それをゆるしました。",
"メロスは夜どおし走って村へ帰り、妹の結婚式をあげました。そして三日目の朝、親友を助けるために、町へむかって走りだしました。",
"けれど、大雨で川があふれて橋がながされ、メロスは濁流をおよいでわたりました。つぎには山ぞくにおそわれ、たたかって切りぬけました。はげしい日ざしの中で、とうとう力つきて、メロスはたおれこんでしまいます。「もう、どうでもいい……」。",
"そのとき、どこからか水のながれる音が聞こえてきました。わき水を一口のむと、メロスは、ふたたび立ちあがりました。「わたしは、信じられている。走れ、メロス！」。服もやぶれ、ほとんどはだかのようなすがたで、メロスは風のように走りつづけました。",
"しずみかけた夕日がきえる、まさにそのとき。メロスは、処刑場にとびこみました。メロスとセリヌンティウスは、一度だけ、たがいをうたがってしまったことをうちあけて、ほおをなぐりあい、そして、かたくだきあいました。それを見た王さまは、「わしも、なかまに入れてくれないか」と言い、人びとからは大きな歓声があがりました。"
]},
{ cat:"chuu", title:"握手", yomi:"あくしゅ", sub:"井上ひさし ／ 中学3年", author:"井上ひさし", authorYomi:"いのうえひさし", icon:"🤝", text:[
"「わたし」は、子どものころ、親とはなれて、「光ヶ丘天使園」という施設でくらしていました。その施設の園長が、カナダから来たルロイ修道士でした。",
"ある日、「わたし」は、何年ぶりかでルロイ修道士と、上野の洋食屋で会いました。修道士は、日本での仕事をやめて、カナダに帰ることになったので、むかしの子どもたちに会ってまわっているのだと言います。",
"修道士は、むかしと同じように、指をつかった、ふしぎな合図で話しました。右の親指をぴんと立てれば「よし」。両手の人さし指を交差させてうちつければ、「こら」とおこっているしるし。「わたし」は、施設でのなつかしい思い出を、つぎつぎに思い出しました。",
"けれど、修道士は、料理をほとんど食べませんでした。そして、むかしは、手がいたくなるほど強かった握手が、この日はとても弱々しかったのです。「わたし」は、修道士が重い病気で、もう長くはないのではないかと感じました。",
"上野駅で別れるとき、「わたし」は思わず、両手の人さし指を交差させて、修道士に「こら」の合図をしてしまいました。修道士はわらって、それにこたえ、もういちど、「わたし」の手を強くにぎりました。",
"それからまもなく、ルロイ修道士はなくなりました。おそうしきで、修道士が重い病気だったことを知らされたとき、「わたし」は、知らずしらずのうちに、両手の人さし指を交差させ、はげしくうちつけていました。"
]},
{ cat:"chuu", title:"故郷", yomi:"こきょう", sub:"魯迅（中国） ／ 中学3年", author:"魯迅", authorYomi:"ろじん", icon:"🍉", text:[
"「私」は、二十年ぶりに、ふるさとの村へ帰ってきました。家を売って、家族を引っこしさせるためです。けれど、なつかしいはずのふるさとは、さびれて、どんよりとした、さびしい村になっていました。",
"「私」には、子どものころの、わすれられない友だちがいました。ルントウという、村の少年です。ルントウは、海べで貝がらをひろうことや、すいか畑で、すいかを食べにくる動物をつかまえる話など、ふしぎで楽しいことを、たくさん教えてくれました。ふたりは、身分のちがいなど気にせず、大のなかよしでした。",
"「私」がルントウに会えるのを楽しみにしていると、ある日、ひとりの男の人がたずねてきました。それはルントウでした。けれど、日にやけた顔には深いしわがきざまれ、まずしいくらしにつかれはてて、すっかりかわってしまっていました。",
"ルントウは、うれしそうな顔をしたあと、うやうやしく頭を下げて、「だんなさま」と言いました。その一言で、「私」は、ふたりのあいだに、悲しい、厚いかべができてしまったことを知りました。",
"ふるさとをはなれる船の上で、「私」は、自分のおいと、ルントウの子どもが、なかよくなったことを思い出します。この子たちには、自分たちのようなへだてのない、新しい生き方をしてほしい。",
"希望というものは、もともとあるものでも、ないものでもない。それは、地面の道のようなものだ。はじめは道なんてなくても、歩く人が多くなれば、それが道になるのだ――。「私」は、そう考えるのでした。"
]},
{ cat:"chuu", title:"サーカスの馬", yomi:"サーカスのうま", sub:"安岡章太郎 ／ 中学2年", author:"安岡章太郎", authorYomi:"やすおかしょうたろう", icon:"🎪", text:[
"中学生の「僕」は、勉強もできず、先生にしかられてばかりで、なにをやってもだめな生徒でした。「僕」は、いつも「まあ、いいや」と、自分をごまかしてすごしていました。",
"ある年のお祭りのころ、学校のそばの神社に、サーカスがやってきました。テントのうらには、一頭の馬がつながれていました。やせていて、せなかのまん中がくぼんでいる、みすぼらしい馬です。",
"「僕」は、その馬を見て思いました。あの馬は、年をとって、もう役に立たなくなったから、あんなところにつながれているんだ。自分と同じで、なにもできないんだ――。「僕」は、その馬に、自分のすがたを重ねていました。",
"ある日、「僕」は、サーカスのテントの中をのぞいてみました。すると、音楽が鳴りひびく中、あの馬が、背中に曲芸師をのせて、力づよく、ぐるぐるとまわっているではありませんか。くぼんだせなかは、人をのせるのにちょうどいい形だったのです。",
"馬は、みんなの前で、どうどうと、りっぱに芸をしていました。「僕」はおどろいて、そして、思わず、むちゅうで手をたたいていました。"
]},
{ cat:"chuu", title:"坊っちゃん", yomi:"ぼっちゃん", sub:"夏目漱石 ／ 中学", author:"夏目漱石", authorYomi:"なつめそうせき", icon:"🏫", text:[
"「おれ」は、子どものころから、むてっぽうで、まがったことが大きらい。二階からとびおりて、こしをぬかしたこともあります。家族にはあまりかわいがられませんでしたが、家につかえるおばあさんの清（きよ）だけは、「あなたは、まっすぐでよいご気性だ」と、いつもほめてくれました。",
"物理学校を卒業した「おれ」は、四国の中学校に、数学の先生として行くことになりました。ところが、生徒たちは新しい先生をからかって、「おれ」が天ぷらそばを四はい食べたことを黒板に書いたり、宿直の夜、ふとんの中にいなごを入れたりします。",
"学校には、いつも赤いシャツを着ている教頭の「赤シャツ」と、そのごきげんとりの「野だいこ」がいました。いっぽう、数学の先生の「山嵐（やまあらし）」は、正直でまっすぐな人でした。",
"やがて「おれ」は、赤シャツが、かげでずるいことをしているのを知ります。おとなしい「うらなり」先生を遠くの学校へ追いやったり、うそのうわさをながして、山嵐を学校からやめさせたりしたのです。",
"「おれ」と山嵐は、たまりかねて、赤シャツと野だいこを待ちぶせし、さんざんこらしめてやりました。そして、そのまま学校をやめて、町を出ていきました。",
"東京に帰った「おれ」は、まっさきに清に会いに行きました。清はなみだをながしてよろこび、「おれ」は清と、いっしょにくらすことになったのでした。"
]},
{ cat:"chuu", title:"星の花が降るころに", yomi:"ほしのはながふるころに", sub:"安東みきえ ／ 中学1年", author:"安東みきえ", authorYomi:"あんどうみきえ", icon:"💮", text:[
"小学生のころ、「私」と夏実は、大のなかよしでした。秋になると、ふたりはいつも、銀木犀（ぎんもくせい）の木の下で、星のような小さな白い花がふりつもるのをひろいあつめていました。",
"ところが、中学生になって、夏実とはクラスがはなれ、ちょっとした行きちがいから、話をしなくなってしまいました。「私」はなかなおりしたいと思って、夏実に声をかけようとしますが、夏実は、ほかの友だちといっしょに、行ってしまいます。",
"ひとりぼっちの気もちでいた「私」に、同じクラスの戸部くんが話しかけてきました。サッカーばかりしている、ふざけた男の子だと思っていたのに、話してみると、戸部くんには、「私」の知らない、しっかりしたところがありました。",
"帰り道、「私」は、ひさしぶりに、あの銀木犀の木の下へ行きました。木は、常緑樹。いつも同じように見えますが、ほんとうは、古い葉を落としながら、少しずつ新しい葉と入れかわっているのだと教えてもらったことを、思い出します。",
"「私」は、ずっとポケットに入れていた、夏実との思い出の、かれた花を、木の根もとにそっとすてました。むりに、元どおりにならなくてもいい。「私」は、また新しい季節をむかえようと、前をむいて歩きだすのでした。"
]},
{ cat:"chuu", title:"扇の的", yomi:"おうぎのまと", sub:"『平家物語』より ／ 中学2年", icon:"🎯", text:[
"むかし、源氏と平家が、屋島の海べでたたかっていました。夕ぐれどき、平家のほうから一そうの小舟がこぎだしてきて、赤い地に金色の日の丸がかかれた扇を、さおの先に立てました。「これを、うち落としてみよ」と、源氏をさそっているのです。",
"源氏の大将、源義経は、弓の名人である、わかい武士の那須与一（なすのよいち）に命じました。「あの扇を、射てみよ」。",
"与一は、馬にのったまま、海の中へ入っていきました。北風がつよくふき、波は高く、小舟はゆらゆらゆれて、扇も、さおの先でひらひらとゆれています。海の上には平家の舟がならび、浜には源氏の武士たちが、じっと見まもっています。",
"与一は目をとじて、心の中でいのりました。「八幡さま、どうか、あの扇のまん中を射させてください。もし外したら、生きては帰りません」。目をひらくと、風が少しおさまり、扇も射やすくなっていました。",
"与一がはなった矢は、ひゅうっと音を立てて、扇のかなめの近くを、みごとに射切りました。扇は空へ高くまいあがり、春風にひらひらとまってから、夕日にかがやく海へ、ぱさっと落ちていきました。",
"海の上の平家は、舟ばたをたたいて、ほめたたえました。浜の源氏も、えびらをたたいて、大きな歓声をあげました。敵も味方もなく、みんなが与一の弓のうでに、心をうばわれたのです。"
]},
{ cat:"chuu", title:"敦盛の最期", yomi:"あつもりのさいご", sub:"『平家物語』より ／ 中学2年", icon:"⚔️", text:[
"一ノ谷の戦いで、平家は源氏にやぶれ、船で海へにげようとしていました。源氏の武士、熊谷次郎直実（くまがいのじろうなおざね）は、「りっぱな大将と戦いたい」と、浜べを見まわしていました。",
"すると、美しいよろいを着た武士が、船を目ざして、馬で海へ入っていくのが見えました。直実は、「うしろを見せるとは、ひきょうだぞ。もどってこい」とよびかけます。武士は、ひきかえしてきました。",
"直実は、その武士を組みふせ、かぶとをとりました。すると、それは、十六、七歳ほどの、うす化粧をした、美しい少年でした。自分の息子と同じくらいの年です。直実は、どうにかしてにがしてあげたいと思いました。",
"けれど、うしろを見ると、源氏のなかまたちが、大ぜいかけつけてきます。ここでにがしても、少年は、ほかの人にうたれてしまうでしょう。直実は、なみだながらに、「同じことなら、わたしの手で。のちのご供養もいたしましょう」と言って、少年をうちとりました。",
"少年の腰には、錦のふくろに入った笛がさしてありました。その朝、平家の陣から聞こえてきた、美しい笛の音。それは、この少年がふいていたものだったのです。少年の名は、平敦盛（たいらのあつもり）でした。",
"戦いの世の悲しさに、直実は心をいため、やがて武士をやめて、お坊さんになったということです。"
]},

{ cat:"kou", title:"山月記", yomi:"さんげつき", sub:"中島敦", author:"中島敦", authorYomi:"なかじまあつし", icon:"🐯", text:[
"むかしの中国に、李徴（りちょう）という、とてもかしこい男がいました。李徴は、自分の才能に自信があり、役人の仕事をやめて、詩人として名をあげようとしました。けれど、なかなか有名になれず、くらしにもこまって、ふたたび、ひくい地位の役人にもどることになりました。",
"かつて自分よりずっと下だと思っていた人たちの命令を聞かなければならない毎日に、李徴のプライドはきずつき、心はすさんでいきました。そしてある夜、李徴はとつぜん、わけのわからないことをさけんで、やみの中へかけだしていき、そのまま、ゆくえがわからなくなってしまいました。",
"一年後、李徴の親友だった袁傪（えんさん）が、旅のとちゅうで山道を通ると、草むらから一ぴきの虎がとびだしてきました。けれど虎は、袁傪を見ると草むらにかくれ、「あぶないところだった」と、人間の言葉でつぶやきました。その声は、あの李徴の声でした。",
"草むらの中から、李徴は語りました。自分は、なぜか虎になってしまったこと。そして、その理由を考えたこと。自分は、才能がないとわかるのをこわがって、努力することからにげていた。そのくせ、プライドが高くて、人とまじわることもしなかった。その心こそが、自分を虎にしてしまったのだ――。",
"李徴は、自分がつくった詩を袁傪に書きとらせ、さいごに、「のこしてきた妻と子どもの生活を、どうか助けてほしい」とたのみました。そして、「本当は、詩のことよりも、まず家族のことをたのむべきだった。だから虎になったのかもしれない」と、はずかしそうに言いました。",
"別れのとき、李徴は袁傪に、「丘の上まで行ったら、ふりかえってみてくれ」と言いました。袁傪がふりかえると、一ぴきの虎が草むらからあらわれ、白く光る月にむかって、二声、三声ほえると、ふたたび草むらの中へ消えて、もう二度とすがたを見せませんでした。"
]},
{ cat:"kou", title:"羅生門", yomi:"らしょうもん", sub:"芥川龍之介", author:"芥川龍之介", authorYomi:"あくたがわりゅうのすけ", icon:"⛩️", text:[
"むかしの京都。地しんや火事、ききんがつづいて、町はすっかりあれはてていました。ある日の夕ぐれ、羅生門という大きな門の下で、ひとりの下人（けにん・めしつかい）が、雨がやむのを待っていました。",
"下人は、つかえていた主人から、ひまを出されたばかりでした。行くところも、食べるものもありません。このままうえ死にするか、それとも、ぬすびとになるか。下人には、ぬすびとになる勇気は、まだありませんでした。",
"ひと晩ねる場所をさがして、門の上へのぼると、そこにはひきとり手のない、たくさんのなきがらがおかれていました。そして、そのあいだに、やせたおばあさんがしゃがみこんで、なきがらの女の人のかみの毛を、一本ずつぬいていたのです。",
"下人は、そのおそろしいようすに、はげしいいかりを感じ、刀をぬいて、おばあさんをつかまえました。「なにをしている！」。おばあさんは、「かみの毛をぬいて、かつらにして売ろうと思ったのさ」と答えます。",
"そしておばあさんは、言いわけをしました。「この女だって、生きているあいだ、へびの肉を魚だといつわって売っていたんだよ。そうしなければ、うえ死にするからさ。わたしだって、そうしなければ、うえ死にするんだ。だから、この女も、わたしのすることを、ゆるしてくれるだろうよ」。",
"それを聞いた下人の心に、さっきまではなかった勇気がうまれました。「それなら、おれがお前の着物をうばっても、うらむなよ。おれも、そうしなければ、うえ死にする体なのだ」。下人は、おばあさんの着物をはぎとると、夜のやみの中へかけおりていきました。下人のゆくえは、だれも知りません。"
]},
{ cat:"kou", title:"こころ", sub:"夏目漱石", author:"夏目漱石", authorYomi:"なつめそうせき", icon:"🖋️", text:[
"学生の「私」は、夏の海べで、ある男の人と知りあい、「先生」とよんで、したうようになりました。先生は、りっぱな学問を身につけているのに、仕事もせず、世の中から身をひくようにして、しずかにくらしていました。先生は、人間というものを、どこか信じられないようでした。",
"あるとき、「私」のもとに、先生から、あつい手紙がとどきます。それは、先生が、自分の過去をすべて書きのこした、遺書でした。",
"若いころ、先生は、ある家に下宿していました。その家には、おくさんと、お嬢さんがいました。先生は、同じ学生で、親友の「K」を、その下宿によびよせます。Kは、とてもまじめで、自分をきびしくみがこうとする人でした。",
"やがて先生は、お嬢さんを好きになりました。ところが、ある日、Kから「自分も、お嬢さんを好きになってしまった」とうちあけられます。先生は、先をこされるのがこわくなり、Kが大切にしていた考えを持ちだして、Kの心をまよわせるようなことを言いました。そして、Kにだまって、おくさんに「お嬢さんと結婚させてください」とたのみ、ゆるしをもらったのです。",
"それを知ったKは、先生をせめることもなく、ある夜、自分で命を絶ってしまいました。先生あての手紙には、先生をうらむ言葉は、一つも書いてありませんでした。",
"先生は、お嬢さんと結婚しましたが、Kへのつぐないの気もちに、ずっと苦しみつづけてきました。そして、明治という時代のおわりをきっかけに、自分も、この世を去る決心をしたのです。人の心の弱さと、その重さを、手紙は「私」に語りかけていました。"
]},
{ cat:"kou", title:"舞姫", yomi:"まいひめ", sub:"森鴎外", author:"森鴎外", authorYomi:"もりおうがい", icon:"🩰", text:[
"明治のはじめ、太田豊太郎（おおたとよたろう）は、国の期待をせおって、ドイツのベルリンへ留学した、優秀な若者でした。",
"ある夕ぐれ、豊太郎は、古い教会の前で泣いている、美しい少女に出会います。少女の名はエリス。まずしい家の娘で、劇場で踊り子をしていました。父親のおそうしきを出すお金もなく、こまりはてていたのです。豊太郎はエリスを助け、ふたりはやがて、愛しあうようになりました。",
"ところが、それが問題となり、豊太郎は仕事をやめさせられてしまいます。友人の相沢謙吉（あいざわけんきち）のしょうかいで、新聞の記事を書く仕事をしながら、豊太郎はエリスとまずしくくらしはじめました。やがて、エリスのおなかには、赤ちゃんができました。",
"そんなとき、相沢が、大臣の通訳の仕事を持ってきてくれました。うまくいけば、日本に帰って、また出世できるかもしれません。相沢は「エリスとは別れるべきだ」と言い、豊太郎は、まよいながらも、つい、うなずいてしまいました。",
"豊太郎は、エリスに本当のことを言えないまま、苦しみのあまり、雪の夜に、たおれてしまいます。そのあいだに、相沢から、豊太郎が日本に帰ることを聞かされたエリスは、深い悲しみのあまり、心がこわれてしまいました。",
"豊太郎は、エリスとおなかの子のための生活費をのこして、ひとり日本へ帰る船にのりました。「相沢のような親友は、めったにいない。けれど、わたしの心には、いまも彼をうらむ気もちが、ひとすじのこっている」。豊太郎は、そう書きしるしています。"
]},
{ cat:"kou", title:"高瀬舟", yomi:"たかせぶね", sub:"森鴎外", author:"森鴎外", authorYomi:"もりおうがい", icon:"🛶", text:[
"江戸時代、京都の高瀬川では、つみをおかして島へ送られる人を、小さな舟で大坂へ運んでいました。ある春の夕ぐれ、役人の羽田庄兵衛（はねだしょうべえ）は、喜助（きすけ）という男を舟で送ることになりました。喜助は、弟を死なせたつみで、島流しになったのです。",
"ふつう、島へ送られる人は、悲しそうに泣いています。ところが喜助は、晴れやかで、どこか楽しそうな顔をしていました。ふしぎに思った庄兵衛が、わけをたずねると、喜助はこたえました。",
"「わたしは、これまで、どこへ行っても、おちついていられる場所がありませんでした。でも、これからは島で、ゆるされたところに、ずっといられます。それに、島へ行くときにいただいた、この二百文のお金。わたしは、自分のお金を持つのは、生まれてはじめてなのです」。",
"庄兵衛は、自分もお給料をもらっても、ほとんどそのまま出ていってしまうくらしをしていることを思いました。もっと、もっとと思ってしまう自分とくらべて、喜助の、足ることを知る心に、庄兵衛はおどろきました。",
"つぎに庄兵衛が、弟のことをたずねると、喜助は話しました。弟は重い病気で、兄に苦労をかけたくないと、自分で命を絶とうとしました。けれど死にきれず、苦しみながら「たのむから、らくにしてくれ」と兄にたのんだのです。喜助は、弟の苦しみを終わらせるため、そのねがいを聞いてしまったのでした。",
"話を聞いた庄兵衛は、「これは、本当につみなのだろうか」と、深く考えこみました。けれど、答えは出ません。おぼろ月夜の中、ふたりをのせた高瀬舟は、黒い水の上を、しずかにすべっていきました。"
]},
{ cat:"kou", title:"檸檬", yomi:"れもん", sub:"梶井基次郎", author:"梶井基次郎", authorYomi:"かじいもとじろう", icon:"🍋", text:[
"「私」の心は、いつも、なにかおもくるしいものに、おさえつけられていました。病気で体も弱く、お金もありません。むかしは大すきだった、きれいなものも、いまは見ても、ちっとも楽しくありませんでした。",
"ある日、京都の町をさまよっていた「私」は、お気に入りの果物屋で、一つのレモンを見つけて買いました。レモンの、あざやかな黄色。ひんやりとしたつめたさ。鼻をつくような、さわやかなかおり。手の中のレモンの重さに、「私」の心は、ふしぎと軽くなっていきました。",
"うれしくなった「私」は、ずっと足が遠のいていた、丸善（まるぜん）という大きな本屋に入ってみました。けれど、店に入ったとたん、またあのおもくるしい気もちがもどってきます。",
"「私」は、たなから画集をつぎつぎにぬきだして、つみかさねていきました。そして、ふと思いついて、そのいちばん上に、あのレモンをそっと置いてみたのです。色とりどりの画集の上で、黄色いレモンが、しんと、すみきったように光っていました。",
"「私」は、そのまま、なにくわぬ顔で店を出ました。あのレモンが、じつは、おそろしい爆弾だったら。十分後には、丸善が、こっぱみじんになってしまうとしたら――。そんなとっぴな空想をしながら、「私」は、なんだかゆかいな気もちで、町を歩いていくのでした。"
]},
{ cat:"kou", title:"城の崎にて", yomi:"きのさきにて", sub:"志賀直哉", author:"志賀直哉", authorYomi:"しがなおや", icon:"♨️", text:[
"「自分」は、東京で電車にはねられて大けがをし、そのあとの養生のために、兵庫県の城崎温泉にやってきました。一歩まちがえれば、死んでいたかもしれない。そんな思いを胸に、「自分」は、しずかな温泉町で、ひとりすごしていました。",
"ある朝、宿の屋根の上で、一ぴきのはちが死んでいるのを見つけました。ほかのはちたちは、いそがしそうに、そのそばを行き来しています。動かなくなったはちの死は、とてもしずかで、「自分」は、そのしずけさに、どこか親しみを感じました。",
"また、ある日、川で、首にくしをさされた、ねずみを見ました。ねずみは、なんとか助かろうと、ひっしに泳ぎまわり、そのまわりで人びとが、石をなげてわらっていました。死ぬ前に、あんなに苦しまなければならないのか。「自分」は、その光景を、おそろしく思いました。",
"夕方、川べを歩いていた「自分」は、石の上にじっとしている、いもりを見つけました。おどかしてやろうと、なにげなく小石をなげると、それが、ぐうぜん、いもりに当たってしまい、いもりは死んでしまいました。「自分」は、殺すつもりなどなかったのです。",
"自分は、ぐうぜん死ななかった。いもりは、ぐうぜん死んだ。生きていることと、死んでしまうことは、それほどかけはなれたものではないのかもしれない――。「自分」は、そう感じるのでした。やがて、三週間ほどで、「自分」は城崎をあとにしました。"
]},
{ cat:"kou", title:"鼻", yomi:"はな", sub:"芥川龍之介", author:"芥川龍之介", authorYomi:"あくたがわりゅうのすけ", icon:"👃", text:[
"むかし、京都の池の尾という村に、禅智内供（ぜんちないぐ）という、えらいお坊さんがいました。内供の鼻は、長さが五、六寸（十五センチほど）もあり、ソーセージのように、あごの下までぶらさがっていました。",
"内供は、口では「気にしていない」と言いながら、じつは、この鼻のことで、心の中ではずっとなやんでいました。人に笑われるのがいやで、なんとか鼻を短くしようと、いろいろなことをためしてみましたが、どれもうまくいきません。",
"ある年、弟子のお坊さんが、鼻を短くする方法を教わってきました。鼻をお湯でゆでて、足でふみつける、というものです。ためしてみると、なんと、内供の鼻は、ふつうの人と同じくらいの長さに、ちぢまりました。",
"「これでもう、だれにも笑われない」。ところが、そうはいきませんでした。まわりの人たちは、前よりも、もっとおかしそうに、内供の顔を見て笑うのです。人は、だれかの不幸に同情するけれど、その人が不幸からぬけだすと、なんだか物足りなくて、またもとにもどってほしいような気もちになってしまうのでした。",
"内供は、すっかりきげんがわるくなりました。「鼻が長かったときのほうが、よかった」。",
"ある寒い朝、目をさますと、内供の鼻は、またもとのように長くなって、あごの下までぶらさがっていました。内供は、なぜか、すっきりと晴れやかな気もちになり、心の中でつぶやきました。「こうなれば、もうだれも笑うものはないに、ちがいない」。"
]},
{ cat:"kou", title:"蜜柑", yomi:"みかん", sub:"芥川龍之介", author:"芥川龍之介", authorYomi:"あくたがわりゅうのすけ", icon:"🍊", text:[
"ある冬の夕ぐれ、「私」は、横須賀から東京へむかう汽車の二等車にすわっていました。「私」の心は、いいようのない、つかれと、たいくつにしずんでいました。",
"汽車が動きだそうとしたとき、ひとりの女の子が、あわててとびのってきました。十三、四歳ほどの、いかにもいなかから出てきたような娘です。ほおは、赤くひびわれていて、ひざの上には大きなふろしきづつみをかかえています。手には、三等車の切符をにぎっていました。「私」は、その娘のすべてが、なんだか、うっとうしく思えました。",
"汽車がトンネルに入るころ、娘は、しめきった窓を、むりやりあけようとしはじめました。ようやく窓があいた、ちょうどそのとき、汽車はトンネルに入り、まっ黒なけむりが、車の中へどっとながれこんできました。「私」は、せきこみながら、娘をしかりつけようとしました。",
"汽車がトンネルをぬけると、そこは、まずしい町はずれのふみきりでした。ふみきりの柵のむこうに、ほおの赤い、三人の小さな男の子が、ならんで立っています。子どもたちは、汽車にむかって、いっせいに手をあげ、なにかさけんでいました。",
"そのとき、窓から身をのりだした娘が、ふところから、あざやかな色のみかんを五つ六つ、子どもたちの上へなげたのです。夕日の中、みかんは、あたたかな色にかがやきながら、子どもたちの上にふっていきました。",
"「私」には、すべてがわかりました。娘は、これから町へ、はたらきに出るのです。見おくりにきてくれた弟たちに、お礼のかわりのみかんをなげたのでした。「私」の心の中の、重たいつかれは、いつのまにか、すっかり消えていました。"
]},
{ cat:"kou", title:"富嶽百景", yomi:"ふがくひゃっけい", sub:"太宰治", author:"太宰治", authorYomi:"だざいおさむ", icon:"🗻", text:[
"つらいことがつづき、心もつかれはてていた「私」は、気分をかえようと、山梨県の御坂峠（みさかとうげ）にある茶屋に、しばらくとまることにしました。茶屋の窓からは、大きな富士山が、まっ正面に見えました。",
"けれど「私」は、その富士山が、あまりすきになれませんでした。「まるで、おふろ屋のかべのペンキの絵みたいだ。はずかしくなるほど、注文どおりの景色だ」。いかにも絵はがきのような富士山が、なんだか、うさんくさく思えたのです。",
"茶屋ですごすうちに、「私」は、師匠の井伏さんのしょうかいで、ある娘さんとお見合いをしました。また、茶屋の、明るい娘さんや、おかみさんとも、なかよくなっていきます。",
"ある日、バスにのっていると、となりにすわったおばあさんが、富士山には目もくれず、道ばたに咲く小さな花を見つめて、「おや、月見草」とつぶやきました。どうどうとした富士山にも負けず、けなげに咲く黄色い月見草。「私」は、「富士には、月見草がよく似合う」と思いました。",
"人とふれあい、自分を見つめなおすうちに、「私」の心は、少しずつ、前むきになっていきました。月夜の富士、雪の富士……。いろいろな顔を見せる富士山に、「私」は、しだいに親しみを感じるようになります。",
"やがて寒くなり、「私」は山をおりることにしました。さいごの日、茶屋の前で、若い娘さんたちに写真をたのまれた「私」は、富士山だけを画面に入れて、シャッターを切りました。富士山にさよならを言いながら、「私」は、新しい生活へと歩きだしたのです。"
]},
{ cat:"kou", title:"棒", yomi:"ぼう", sub:"安部公房", author:"安部公房", authorYomi:"あべこうぼう", icon:"🪵", text:[
"ある、むしあつい日曜日。「私」は、ふたりの子どもをつれて、デパートの屋上にいました。手すりにもたれて、下の通りを歩く人びとを見おろしていたとき、ふと、体がうきあがったような気がしました。",
"気がつくと、「私」は、一本の棒になって、下の通りへ落ちていました。子どもたちが、屋上から「お父さん、お父さん」とよんでいる声が聞こえます。けれど、棒になった「私」には、もう、へんじをすることも、動くこともできません。",
"そこへ、先生らしい男と、ふたりの学生がやってきて、棒の「私」をひろいあげました。三人は、棒になった人間をしらべて、その人がどういう人間だったのかを、見きわめる役目の人たちのようでした。",
"学生たちは、棒をしらべて、あれこれと話しあいます。「この棒は、手あかでよごれている」「きっと、いつもだれかに使われてきたんだ」。棒のように、自分から何かをするのではなく、ただ、人に使われるだけの人生だったのではないか――。",
"先生は言いました。「こういう人間に、ばつをあたえる必要はない。棒は棒のまま、ここにすてておけばいい。それが、いちばんふさわしいのだ」。三人は、棒をそこにのこして、どこかへ去っていきました。",
"人ごみの中、だれにも気づかれずにころがる一本の棒。遠くでは、まだ子どもたちが、「お父さん」とよびつづけていました。"
]},
{ cat:"kou", title:"鞄", yomi:"かばん", sub:"安部公房", author:"安部公房", authorYomi:"あべこうぼう", icon:"💼", text:[
"ある雨の夜、「私」の事務所に、ひとりの青年がやってきました。新聞の求人広告を見て、はたらかせてほしいと言うのです。青年は、大きくて重そうな鞄を、大事そうにさげていました。",
"前の仕事をやめたわけをたずねると、青年は、「この鞄のせいなんです」と答えます。鞄が重いので、歩ける道が決まってしまう。のぼり坂や、でこぼこの道は、鞄を持っていては歩けない。だから、行ける場所が、鞄に決められてしまうのだ、と。",
"「そんなもの、すててしまえばいいじゃないか」と「私」が言うと、青年は「すてられないから、こまっているんです」と言いました。「私」は、なんだか気味がわるくなり、とりあえず、ようすを見ることにして、鞄をあずかることにしました。",
"青年が帰ったあと、「私」は、ためしにその鞄を持ちあげて、歩いてみました。鞄は、思ったより重くはありません。ところが、歩いているうちに、「私」は、自分がえらんで歩いているのではなく、鞄を持って歩きやすい道だけを、自然とえらんでいることに気づきました。",
"坂をのぼろうとすると、足がとまる。まがろうとしても、うまくいかない。気がつくと、「私」は、見たこともない場所を、鞄にみちびかれるまま、どんどん歩いていました。",
"それでも、「私」は、ふしぎと、いやな気もちではありませんでした。どこへ行けばいいのか、なやむ必要がない。自由をうしなったはずなのに、なぜか、とても自由な気もちで、「私」は鞄とともに歩きつづけるのでした。"
]},
{ cat:"kou", title:"山椒魚", yomi:"さんしょううお", sub:"井伏鱒二", author:"井伏鱒二", authorYomi:"いぶせますじ", icon:"🦎", text:[
"山椒魚（さんしょううお）は、谷川の岩屋を、自分のすみかにしていました。ところが、二年のあいだに、体がすっかり大きくなってしまい、岩屋の出入り口に頭がつかえて、外へ出られなくなってしまったのです。",
"「なんということだ！」。山椒魚は、悲しみました。岩屋の外では、めだかたちが、自由に、むれになって泳いでいます。山椒魚は、それを見て、「なんと、不自由なやつらだろう」と、ばかにしてみたりしますが、本当は、自分がいちばん不自由なのでした。",
"山椒魚は、神さまにむかって、「どうして、わたしだけが、こんな目にあわなければならないのですか」とうったえます。けれど、どうにもなりません。山椒魚の心は、だんだん、いじわるになっていきました。",
"ある日、一ぴきの蛙（かえる）が、岩屋の中へまよいこんできました。山椒魚は、出入り口に頭をおしつけて、蛙を、とじこめてしまいました。自分と同じように、外へ出られないようにしてやったのです。",
"山椒魚と蛙は、はげしく言いあらそいました。そして、そのまま一年がすぎ、また一年がすぎていきました。ふたりとも、すっかり、やせおとろえてしまいました。",
"ある日、山椒魚は、弱々しい声で、蛙にたずねました。「おまえは、いまでも、おれのことをおこっているのか」。蛙は、少しのあいだだまっていましたが、やがて、しずかに、もうおこってはいない、とこたえたのでした。",
"（作者の井伏鱒二は、のちに、この物語の最後の場面をけずってしまいました。そのため、どこで終わるかは、本によってちがいます。）"
]},
{ cat:"kou", title:"変身", yomi:"へんしん", sub:"フランツ・カフカ（チェコ）", author:"フランツ・カフカ", icon:"🪲", text:[
"ある朝、グレーゴル・ザムザが、なやましいゆめから目をさますと、自分が、ベッドの中で、一ぴきの大きな虫にかわっていることに気がつきました。",
"グレーゴルは、セールスマンとして、朝から晩まではたらき、家族のくらしを、ひとりでささえていました。虫になっても、グレーゴルがまず心配したのは、「会社におくれてしまう」ということでした。けれど、もう人間の言葉を話すことも、仕事に行くこともできません。",
"虫になったグレーゴルを見て、家族は、おどろき、こわがりました。はじめのうち、妹のグレーテは、グレーゴルの部屋へ、食べものを運んで世話をしてくれました。けれど、家族は、だんだんとグレーゴルのことを、めんどうに思うようになっていきます。",
"ある日、部屋から出てきたグレーゴルに、お父さんがりんごをなげつけました。りんごは、グレーゴルのせなかにめりこみ、グレーゴルは、そのきずのせいで、どんどん弱っていきました。",
"家族は、くらしのために、はたらきに出るようになり、部屋を人に貸すようにもなりました。けれど、ある晩、グレーゴルがすがたを見せたことで、下宿人たちはおこって出ていこうとします。妹は、泣きながら言いました。「もう、あれを家から出すしかないわ。あれは、お兄さんなんかじゃない」。",
"その夜、グレーゴルは、家族のことを、やさしい気もちで思いうかべながら、しずかに息を引きとりました。つぎの朝、家族は、ひさしぶりに、そろって電車で郊外へ出かけました。春の日ざしの中で、家族は、これからの生活のことや、すっかり大人になった妹の将来について、明るく話しあうのでした。"
]},
{ cat:"kou", title:"鏡", yomi:"かがみ", sub:"村上春樹", author:"村上春樹", authorYomi:"むらかみはるき", icon:"🪞", text:[
"みんなで、こわい話をしていたとき、「僕」は、自分が一度だけ体験した、ふしぎな話をはじめました。",
"高校を卒業したあと、「僕」は大学には行かず、いろいろな仕事をしながら、日本じゅうをまわっていました。そのころ、ある中学校で、夜の見まわりをする、警備員の仕事をしていたことがあります。",
"ある秋の夜、風がつよくふいて、学校のどこかで、戸がばたんばたんと鳴っていました。「僕」は、見まわりに出かけます。げんかんのところを通りすぎたとき、なにかが動いた気がして、ふりかえると、そこには大きな鏡があり、「僕」のすがたがうつっていました。",
"けれど、なにかがおかしい。鏡の中の「僕」は、たしかに「僕」なのに、「僕」ではないのです。それは、「僕」のことを、心の底からにくんでいる、もうひとりの自分でした。体が、こおりついたように動かなくなりました。",
"「僕」は、ありったけの力で、手に持っていた木刀を、鏡にむかってなげつけました。鏡がわれる音がして、「僕」は、にげるように部屋へもどりました。",
"つぎの朝、おそるおそる、げんかんに行ってみると……。そこには、鏡など、どこにもありませんでした。はじめから、鏡なんて、なかったのです。「僕」はいまでも、家に一まいも鏡を置いていないのだと、話をしめくくりました。"
]},
{ cat:"kou", title:"なめとこ山の熊", yomi:"なめとこやまのくま", sub:"宮沢賢治", author:"宮沢賢治", authorYomi:"みやざわけんじ", icon:"🏔️", text:[
"なめとこ山は、大きな山です。そこには、熊がたくさんすんでいました。そして、その熊をとる名人の、小十郎（こじゅうろう）という猟師がいました。",
"小十郎は、熊をうつと、いつも、「熊。おれはてまえをにくくて殺したのでねえんだぞ。おれも商売ならてめえもうたなけぁならねえ」と、話しかけるのでした。小十郎は、ほかに仕事もなく、熊をとらなければ、家族を食べさせることができなかったのです。熊たちも、小十郎のことが、なぜか、すきなのでした。",
"ある春の夜、小十郎は、山の上で、月の光をあびながら、熊のお母さんと子どもが話しているのを聞きました。そのやさしいようすに、小十郎は、そっとその場をはなれました。",
"小十郎は、熊の皮と胆（い）を、町の荒物屋に売りに行きます。けれど、荒物屋の主人は、小十郎の足もとを見て、いつも、ずっと安く買いたたくのでした。",
"ある日、小十郎が一ぴきの熊にじゅうをむけると、熊が言いました。「もう二年ばかり待ってくれ。二年目には、おれもおまえの家の前で、ちゃんと死んでいてやるから」。小十郎は、それをゆるしてやりました。そして、ちょうど二年目の朝、その熊は、本当に、小十郎の家の前で、死んでいたのです。",
"ある冬の日、小十郎は、山で大きな熊におそわれ、命をおとしました。「熊ども、ゆるせよ」。それが、小十郎のさいごの言葉でした。その夜、雪の山の上で、たくさんの熊たちが、小十郎のなきがらのまわりに、まるくなってすわり、まるでおいのりをするように、いつまでも、じっとひれふしていました。"
]},
{ cat:"kou", title:"桜の樹の下には", yomi:"さくらのきのしたには", sub:"梶井基次郎", author:"梶井基次郎", authorYomi:"かじいもとじろう", icon:"🥀", text:[
"この作品は、「俺」が、話し相手に語りかける、短いお話です。",
"春になると、桜の花が、いっせいにさきほこります。そのあまりのみごとさ、美しさが、「俺」には、なぜか信じられず、見ていると、かえって不安になってしまうのでした。",
"どうして、桜は、あんなにも美しいのだろう。考えつづけた「俺」は、とうとう思いつきます。「桜の樹の下には、なきがらがうまっている。桜は、そこから養分をすいあげて、あんなに美しくさいているのだ」。",
"そう考えたとたん、「俺」の不安は、すうっと消えていきました。美しいものには、それと同じくらいの、くらく、おそろしいものがかくれている。そう思うことで、やっと、桜を、心から見られるようになったのです。",
"美しさと、おそろしさ。生きることと、死ぬこと。正反対に見えるものが、じつは、となりあってつながっているのかもしれない――。この作品は、ふしぎで、少しこわい、心の中の風景をえがいています。"
]},
{ cat:"kou", title:"有難う", yomi:"ありがとう", sub:"川端康成", author:"川端康成", authorYomi:"かわばたやすなり", icon:"🚌", text:[
"秋の伊豆の山道を、一台の乗合バスが走っていました。その運転手は、道ですれちがう馬車や、道のはしによけてくれる人たちに、いつも、ていねいに「ありがとう」と声をかけていました。そのため、みんなから「ありがとうさん」とよばれていました。",
"ある日、ありがとうさんのバスに、ひとりの娘と、そのお母さんがのってきました。家がまずしく、娘は、遠い町へ、はたらきに出されることになったのです。娘は、ずっと、うつむいたままでした。",
"バスは、山道をゆっくり走っていきます。ありがとうさんは、すれちがう人たちに、いつものように、「ありがとう」と声をかけつづけます。そのやさしい声を聞きながら、娘は、ありがとうさんのせなかを、じっと見つめていました。",
"町に着いた夜、お母さんは、娘のようすを見て、ありがとうさんにそっと話しかけました。娘は、どうやら、ありがとうさんのことを、すきになってしまったようなのです。",
"つぎの朝、ありがとうさんのバスには、村へ帰る、お母さんと娘がのっていました。娘は、ひとまず、町へ行くのをやめて、春まで家にいることになったのでした。バスは、秋の山道を、またゆっくりと走っていきます。「ありがとう」の声を、ひびかせながら。"
]},
{ cat:"kou", title:"雨傘", yomi:"あまがさ", sub:"川端康成", author:"川端康成", authorYomi:"かわばたやすなり", icon:"☂️", text:[
"霧のような、こまかい春の雨がふる日。少年と少女が、写真屋さんへむかって、町を歩いていました。少年の家族が、遠くへ引っこすことになり、そのお別れに、ふたりで写真をとることにしたのです。",
"少年は、自分の傘を、少女にさしかけていました。けれど少女は、ぬれながらも、少年の傘の中に、なかなか入ろうとしません。少年は、自分の肩がぬれるのもかまわず、そっと傘をかたむけていました。",
"写真屋さんで、ふたりはならんで、いすにすわりました。写真屋さんに「もう少しよって」と言われても、ふたりはぎこちなく、はずかしそうにするばかり。それでも、少女は少年のために、そっと、かみをなおしたりするのでした。",
"写真をとりおえて、店を出ようとしたとき、少年は、傘をさがしてあたりを見まわしました。すると、先に外へ出ていた少女が、少年の傘を手に持って、待っていてくれたのです。",
"少女は、あたりまえのように、少年の傘を持っていました。行きには、傘に入るのもためらっていたのに。そのしぐさは、まるで、長くつれそった夫婦のように、自然なものでした。ふたりの心が、いつのまにか、しずかに近づいていたのです。"
]},
{ cat:"kou", title:"水の東西", yomi:"みずのとうざい", sub:"山崎正和（評論）", author:"山崎正和", authorYomi:"やまざきまさかず", icon:"⛲", text:[
"これは、物語ではなく、日本と西洋の「水」の楽しみ方のちがいについて考えた、評論（考えをのべた文章）です。",
"日本の庭には、「ししおどし」というものがあります。竹のつつに、少しずつ水がたまっていき、いっぱいになると、かたむいて水を落とし、コトン、と石をたたく音がします。そして、またしずかに、水がたまっていきます。",
"ししおどしは、水そのものを見せるのではなく、水が流れていく、その「時間」や「間（ま）」を、音で感じさせるしかけです。音と音のあいだの、しんとしたしずけさこそが、ししおどしの楽しみなのです。",
"いっぽう、西洋の町の広場や庭には、「ふんすい」があります。ふんすいは、水を空高くふきあげて、まるで彫刻のように、形をつくって見せます。水を、目で見て楽しむものとして、かざっているのです。",
"日本人は、流れる水、形のない水を楽しんできました。そして、目に見えない、気配やうつりかわりを、心で感じとることを大切にしてきました。「見えない水」を楽しむ心。それが、日本の文化のひとつのとくちょうなのだと、筆者は考えています。"
]},

{ cat:"t_china", title:"論語", yomi:"ろんご", sub:"孔子と弟子たち", author:"孔子と弟子たち", authorYomi:"こうし", icon:"📜", text:[
"むかしの中国に、孔子という先生がいました。孔子のところには、たくさんの若者がやってきて、「立派な人になるには、どうしたらいいですか」「国をよくするには、何が大切ですか」と質問しました。",
"孔子は、「まず、人を思いやる心をもちなさい」と教えました。自分だけが得をしようとするのではなく、親を大切にし、友だちには誠実に接し、約束を守る。そういう毎日の小さな行いが、よい人間をつくるというのです。",
"孔子は、知ったかぶりをすることもよくないと言いました。「知っていることは知っている、知らないことは知らないと言える人こそ、本当に知っている人なのだ」と考えました。",
"『論語』は、孔子自身が一冊の本として書いたものではありません。孔子が亡くなったあと、弟子たちが先生との会話や教えを集めました。「人はどう生きればいいのか」を、日常の言葉から考えていく本です。"
]},
{ cat:"t_china", title:"老子（道徳経）", yomi:"ろうし（どうとくきょう）", sub:"老子", author:"老子", authorYomi:"ろうし", icon:"💧", text:[
"人は、つい「もっと強くなろう」「もっと上へ行こう」「ほかの人に勝とう」と考えます。けれど老子は、「本当にそれでいいのだろうか」と考えました。",
"老子が大切にしたのは「道」という考えです。道とは、川が低いところへ流れ、草木が自然に育つような、世界そのものの大きな流れです。人間も、その流れに逆らって何でも無理やり動かそうとしないほうがよいというのです。",
"たとえば水は、とてもやわらかく、いつも低いところへ流れていきます。けれど長い時間をかければ、かたい岩さえ削ります。老子は、そんな水のような生き方を高く評価しました。",
"無理に目立たず、争わず、必要以上に欲しがらない。「何もしない」という意味ではなく、余計なことをしすぎない。それが老子のいう「無為自然」という生き方です。"
]},
{ cat:"t_china", title:"荘子", yomi:"そうし", sub:"荘子", author:"荘子", authorYomi:"そうし", icon:"🦋", text:[
"ある男が、夢のなかで蝶になりました。蝶になった男は、ひらひらと楽しく飛びまわり、自分が人間だったことなどすっかり忘れていました。",
"やがて目を覚ますと、男はまた人間に戻っていました。そこで考えます。「人間の自分が蝶になる夢を見ていたのだろうか。それとも、本当は蝶で、いま人間になる夢を見ているのだろうか」。",
"この有名な話を残したのが荘子です。荘子は、「正しい」「間違っている」「役に立つ」「役に立たない」といった人間の判断は、本当に絶対なのだろうかと問いかけます。",
"大きな木が曲がっていて木材に使えなければ、人は「役に立たない木だ」と言います。しかし、切られないからこそ、その木は長生きできます。見方を変えれば価値も変わる。そんなふうに、決めつけから自由になることを教えてくれる本です。"
]},
{ cat:"t_china", title:"孟子", yomi:"もうし", sub:"孟子", author:"孟子", authorYomi:"もうし", icon:"🌱", text:[
"孟子は、人間というものをじっと見つめて、「人はもともと、よい心を持っているのではないか」と考えました。",
"たとえば、小さな子どもが井戸に落ちそうになっているところを見たとします。そのとき、多くの人は「助けたらほめてもらえるぞ」と計算するより先に、「危ない！」と思って手を伸ばすでしょう。",
"孟子は、その心こそ、人間のなかに最初からある善の芽だと考えました。その芽をきちんと育てれば、人は思いやりのある立派な人になれるというのです。これが有名な「性善説」です。",
"国を治める王にも、孟子は同じことを求めました。人々を力でおさえつけるのではなく、生活を守り、思いやりのある政治をしなければならない。人間への信頼を土台にした哲学です。"
]},
{ cat:"t_china", title:"荀子", yomi:"じゅんし", sub:"荀子", author:"荀子", authorYomi:"じゅんし", icon:"📐", text:[
"孟子が「人間はもともと善い心を持っている」と考えたのに対して、荀子は少し違った見方をしました。",
"人はおなかがすけば食べものを欲しがり、きれいなものを見れば自分のものにしたくなります。みんなが欲望のままに行動したら、取り合いや争いが起きてしまいます。",
"そこで荀子は、「人間は、そのままでは欲望に流されやすい。だからこそ教育が必要なのだ」と考えました。礼儀やルールを学び、自分の欲望を整えることで、人は立派になれるというのです。",
"木は曲がっていても、道具を使えばまっすぐにできます。それと同じように、人間も学びによって変わることができる。厳しいようでいて、教育の力を強く信じた思想です。"
]},
{ cat:"t_china", title:"韓非子", yomi:"かんぴし", sub:"韓非", author:"韓非", authorYomi:"かんぴ", icon:"⚖️", text:[
"ある国に、とても立派な王様がいたとします。王様がやさしく、頭もよければ、国はうまくいくかもしれません。",
"でも韓非は考えました。「王様が立派な人だったときしか動かない国では困る。悪い王様や普通の王様でも、国が動く仕組みが必要なのではないか」。",
"韓非は、人間は利益があれば動き、損をするなら避けようとするものだと考えました。だから政治では、人の善意だけをあてにせず、はっきりした法律をつくり、賞と罰をきちんと決めるべきだと説きます。",
"大切なのは「いい人が政治をすること」だけではなく、「だれが政治をしても動く仕組みをつくること」。かなり厳しい考えですが、制度や法律の力を重視した哲学です。"
]},
{ cat:"t_china", title:"墨子", yomi:"ぼくし", sub:"墨子", author:"墨子", authorYomi:"ぼくし", icon:"🕊️", text:[
"墨子は、戦争の多い時代の中国で暮らしていました。国と国が争い、人々が傷つく様子を見ながら、「なぜ人間はこんなに争うのだろう」と考えました。",
"そして、人が「自分の家族だけ」「自分の国だけ」を特別に愛しすぎることが争いの原因の一つではないかと考えます。",
"そこで墨子は「兼愛」を説きました。自分の家族だけではなく、ほかの人も大切にする。自分の国だけではなく、ほかの国の人も人間として大切にするという考えです。",
"また、豪華なお葬式やぜいたくな音楽にお金を使うより、人々の生活に役立つことへ使うべきだとも主張しました。「本当にみんなの役に立つのか」を大切にした、とても実用的な哲学です。"
]},
{ cat:"t_china", title:"易経", yomi:"えききょう", icon:"☯️", text:[
"むかしの中国では、人々は大切なことを決めるとき、占いをすることがありました。その占いの知恵が長い時間をかけてまとめられ、やがて『易経』という本になりました。",
"けれど『易経』は、ただ「未来を当てる本」ではありません。そこにある大きな考えは、「この世界では、すべてのものが変わり続けている」ということです。",
"昼が来ればやがて夜になり、夏が過ぎれば冬が来ます。うまくいっているときも永遠には続かず、苦しいときもいつか変わっていきます。",
"だから大切なのは、変化を止めようとすることではなく、「いまはどんなときなのか」をよく見て、それに合った行動をすることです。世界を固定されたものではなく、大きな変化の流れとして見る思想です。"
]},
{ cat:"t_india", title:"ウパニシャッド", icon:"🕉️", text:[
"むかしのインドで、人々は不思議に思いました。「この広い世界は、いったい何からできているのだろう」「そして、自分とは何なのだろう」。",
"目に見えるものをどんどん調べても、その奥にはまだ何かがありそうです。そこで思想家たちは、世界のいちばん深いところにあるものを「ブラフマン」と呼びました。",
"一方、人間のいちばん奥にも、身体や名前とは違う本当の自己があると考え、それを「アートマン」と呼びました。",
"そして驚くべき考えにたどりつきます。「世界の根本であるブラフマンと、自分の根本であるアートマンは、本当は一つなのではないか」。『ウパニシャッド』は、自分を深く知ることから宇宙そのものへ向かっていく、古代インド哲学の大きな出発点です。"
]},
{ cat:"t_india", title:"バガヴァッド・ギーター", spine:"バガヴァッド・|ギーター", icon:"🏹", text:[
"戦場に、一人の戦士アルジュナがいました。これから戦わなければならない相手を見ると、そこには自分の親せきや先生までいます。",
"アルジュナは武器を置き、「こんな人たちを殺してまで戦う意味があるのだろうか」と悩みました。すると戦車を動かしていたクリシュナが、アルジュナに語りかけます。",
"人には、それぞれ果たすべき役目があります。けれど「勝ちたい」「ほめられたい」と結果ばかり考えてはいけません。自分がなすべき行いを、結果への執着から離れて行うことが大切だとクリシュナは教えます。",
"さらに、人間の本当の自己とは何か、神とは何か、どうすれば苦しみから自由になれるのかまで話は広がります。戦場での会話から、人間の生き方そのものを考える本です。"
]},
{ cat:"t_india", title:"ミリンダ王の問い", yomi:"ミリンダおうのとい", icon:"🛞", text:[
"ある日、ミリンダ王が仏教の僧ナーガセーナに質問しました。「あなたはナーガセーナというそうだが、そのナーガセーナとは、いったい何なのだ」。",
"身体でしょうか。心でしょうか。それとも魂のようなものが、身体のなかにいるのでしょうか。",
"ナーガセーナは王に「馬車」を例に出します。車輪だけでは馬車ではありません。軸だけでも、座席だけでも馬車ではありません。いくつもの部分が集まったものを、私たちは便利だから「馬車」と呼んでいるのです。",
"人間も同じです。「変わらない本当の私」というものが奥に隠れているのではなく、身体や感覚や記憶などが集まったものを「私」と呼んでいる。それが仏教の「無我」という考えを、対話で分かりやすく説明する本です。"
]},
{ cat:"t_india", title:"中論", yomi:"ちゅうろん", sub:"ナーガールジュナ（龍樹）", author:"ナーガールジュナ（龍樹）", authorYomi:"ナーガールジュナ", icon:"🌀", text:[
"ナーガールジュナは、ものには「それだけで成り立つ、変わらない本質」が本当にあるのかを考えました。",
"たとえば「木」があります。でも木は、種、水、太陽、土など、たくさんのものがなければ生まれません。木だけで存在しているわけではありません。",
"人間も同じです。親がいて、食べものがあり、社会があり、たくさんの関係のなかで生きています。何か一つだけを取り出して、「これが絶対に変わらない私だ」と言うことはできません。",
"ナーガールジュナは、すべてのものは関係によって成り立ち、固定した本質を持たないと考えました。これを「空」と呼びます。「何も存在しない」という意味ではなく、「何も単独では存在していない」という、とても深い仏教哲学です。"
]},
{ cat:"t_india", title:"ヨーガ・スートラ", sub:"パタンジャリ", author:"パタンジャリ", icon:"🧘", text:[
"人の心には、いつもたくさんの考えが浮かびます。「昨日あんなことを言われた」「明日はどうしよう」「あれが欲しい」。頭のなかは、なかなか静かになりません。",
"パタンジャリは、そんな心を、波の立っている水面のように考えました。波が激しいと、水の底は見えません。",
"そこで、身体を整え、呼吸を整え、心を集中させていきます。すると少しずつ心の波が静まり、自分や世界をよりはっきり見ることができるようになります。",
"現在「ヨガ」というと体を伸ばす運動を思い浮かべますが、『ヨーガ・スートラ』で大切なのは心の修行です。心に振り回されず、自由になるにはどうすればよいのかを説いた本です。"
]},
{ cat:"t_greece", title:"ソクラテスの弁明", yomi:"ソクラテスのべんめい", sub:"プラトン", author:"プラトン", icon:"🦉", text:[
"アテネの町に、ソクラテスという変わった哲学者がいました。彼は人々に近づいて、「勇気とは何ですか」「正義とは何ですか」と質問してまわりました。",
"人々は最初、「そんなことは知っている」と答えます。ところがソクラテスが質問を続けると、だんだん答えられなくなります。ソクラテス自身も、「自分は知らないということを知っているだけだ」と考えていました。",
"やがてソクラテスは、「若者を悪くした」「国の神々を信じていない」と訴えられ、裁判にかけられます。それでも彼は、命を助けてもらうために哲学をやめるとは言いませんでした。",
"「ただ生きることではなく、よく生きることが大切なのだ」。自分の考えを曲げず、死刑を受け入れたソクラテスの姿を、弟子プラトンが描いた作品です。"
]},
{ cat:"t_greece", title:"国家", yomi:"こっか", sub:"プラトン", author:"プラトン", icon:"🕯️", text:[
"ソクラテスと仲間たちは、「正義って、いったい何だろう」と話し始めます。約束を守ることでしょうか。悪い人に悪いことを返すことでしょうか。",
"話を分かりやすくするため、彼らは「それなら、正しい国を一つ想像してみよう」と考えます。そして、どんな人が国を治めるべきか、どんな教育が必要かを話し合います。",
"途中で、有名な「洞窟のたとえ」が登場します。洞窟のなかで影しか見たことのない人々は、その影を本物の世界だと思っています。しかし一人が外へ出ると、太陽の光のなかに本当の世界が広がっていました。",
"プラトンは、人間も目の前のものだけを本当だと思い込んでいるかもしれないと考えました。本当に善いものや正しいものを知った哲学者こそ国を導くべきだという、壮大な哲学書です。"
]},
{ cat:"t_greece", title:"饗宴", yomi:"きょうえん", sub:"プラトン", author:"プラトン", icon:"🍷", text:[
"ある夜、アテネの人々が宴会を開きました。そこで「今日はお酒ばかり飲まず、一人ずつ『愛とは何か』について話そう」ということになりました。",
"ある人は「愛は人を勇敢にする」と言い、別の人は「人は自分に足りない半分を探して愛するのだ」と語ります。それぞれが、違った愛の話をします。",
"やがてソクラテスは、昔ディオティマという女性から聞いた話を紹介します。最初は一人の美しい人を愛していても、やがて美しい心、美しい知識へと進み、最後には「美そのもの」を求めるようになるというのです。",
"恋愛の話から始まりながら、最後には「人間はなぜ美しいものを求めるのか」「愛は人をどこへ連れていくのか」という哲学へ進んでいく作品です。"
]},
{ cat:"t_greece", title:"パイドン", sub:"プラトン", author:"プラトン", icon:"⚱️", text:[
"ソクラテスが死刑になる日がやってきました。弟子たちは牢屋に集まり、先生との最後の時間を過ごします。",
"ところがソクラテスは、死を前にしても取り乱していませんでした。弟子たちに、「哲学者は、一生をかけて死について考えているようなものなのだ」と話します。",
"身体は暑さや寒さ、欲望や痛みに振り回されます。しかし魂は、目には見えない真理を求めることができる。では身体が死んだあと、魂はどうなるのでしょう。ソクラテスたちは魂が死後も存在する可能性について議論します。",
"最後にソクラテスは毒杯を飲み、静かに死を迎えます。「死とは何か」「魂とは何か」「本当に大切なものは何か」を、哲学者の最期を通して考える本です。"
]},
{ cat:"t_greece", title:"形而上学", yomi:"けいじじょうがく", sub:"アリストテレス", author:"アリストテレス", icon:"🔭", text:[
"アリストテレスは、世界を見ながら不思議に思いました。「そもそも『ある』って、どういうことなのだろう」。",
"木があります。犬がいます。人間がいます。石があります。どれもまったく違うものなのに、「存在している」という点では同じです。",
"さらに、「なぜこれはこうなっているのだろう」と考えました。家があるなら材料があり、家の形があり、建てた人がいて、建てた目的があります。アリストテレスは、ものごとを理解するには、こうしたいくつもの「原因」を調べなければならないと考えます。",
"そして最後には、「世界全体が動いているなら、その動きの根本には何があるのか」という問題まで進みます。「存在そのもの」を研究しようとした、後の哲学に大きな影響を与えた本です。"
]},
{ cat:"t_greece", title:"ニコマコス倫理学", yomi:"ニコマコスりんりがく", sub:"アリストテレス", author:"アリストテレス", icon:"🎯", text:[
"アリストテレスは、「人間がいちばん求めているものは何だろう」と考えました。お金でしょうか。名誉でしょうか。楽しいことでしょうか。",
"けれどお金は、何かを買うために欲しいものです。名誉も、それだけで人生の目的とは言い切れません。アリストテレスは、人間が最後に求めているのは「よく生きて、幸せになること」だと考えました。",
"そのために大切なのが「徳」です。たとえば勇気は、何も怖がらない無謀さと、何でも怖がる臆病さの間にあります。多すぎず、少なすぎない、ちょうどよいところを「中庸」と呼びました。",
"しかも徳は、知っているだけでは身につきません。正しい行動を何度もくり返し、習慣にすることで人はよい人間になっていく。幸福な人生とは何かを、具体的に考えた本です。"
]},
{ cat:"t_greece", title:"政治学", yomi:"せいじがく", sub:"アリストテレス", author:"アリストテレス", icon:"🏙️", text:[
"人間は、一人きりでは生きていけません。家族をつくり、村をつくり、やがて町や国をつくります。",
"アリストテレスは、人間を「政治的な動物」と呼びました。これは、いつも選挙の話をするという意味ではありません。人間は仲間と集まり、言葉を使って「何が正しいか」を話し合いながら生きる存在だという意味です。",
"では、どんな国がよい国なのでしょう。王が一人で治める国、少数の人が治める国、多くの人が参加する国。それぞれによい形と悪い形があるとアリストテレスは分析しました。",
"大切なのは、権力を持つ人のためではなく、国全体がよく生きるために政治が行われることです。「よい社会とは何か」を現実の国々を比べながら考えた本です。"
]},
{ cat:"t_greece", title:"詩学", yomi:"しがく", sub:"アリストテレス", author:"アリストテレス", icon:"📝", text:[
"アリストテレスは、芝居を見ながら考えました。「どうして人は、作り話なのに泣いたり、ハラハラしたりするのだろう」。",
"そこで特に悲劇を研究しました。主人公が失敗し、大きな不幸に向かっていく物語を見ると、観客は「かわいそうだ」という気持ちや、「自分にも起きるかもしれない」という恐れを感じます。",
"ところが物語が終わると、不思議と心がすっきりすることがあります。アリストテレスは、それを「カタルシス」と呼びました。",
"そして、物語では登場人物だけでなく「何が起こるか」という筋書きがとても重要だと考えます。二千年以上前に書かれた本ですが、映画や小説やゲームの「面白い物語とは何か」を考えるときにもつながる作品です。"
]},
{ cat:"t_greece", title:"エピクロス 教説と手紙", yomi:"エピクロス きょうせつとてがみ", sub:"エピクロス", author:"エピクロス", icon:"🍞", text:[
"エピクロスは、「人生の目的は快楽だ」と言いました。そう聞くと、毎日ごちそうを食べて遊び続ける哲学のように思えます。",
"ところが、エピクロスが言う快楽は少し違います。豪華な料理を食べ続ければ、もっと豪華なものが欲しくなります。欲望を増やしすぎると、かえって苦しくなってしまいます。",
"パンと水があり、安心できる家があり、よい友だちがいる。それで満足できるなら、人はずっと穏やかに暮らせます。エピクロスが求めたのは、苦痛や不安の少ない静かな幸福でした。",
"「死ぬのが怖い」という人には、「生きているあいだ死はここにない。死が来たときには、もう自分はいない」と考えます。必要以上の恐怖や欲望から自由になるための哲学です。"
]},
{ cat:"t_greece", title:"人生の短さについて", yomi:"じんせいのみじかさについて", sub:"セネカ", author:"セネカ", icon:"⏳", text:[
"ある人が言いました。「人生は短すぎる。やりたいことをする時間がない」。",
"するとセネカは、「本当にそうだろうか」と問いかけます。人生そのものが短いのではなく、私たちがたくさんの時間をむだにしているのではないかというのです。",
"他人の顔色ばかり気にしたり、お金を増やすことだけに夢中になったり、どうでもいい争いに時間を使ったりしているうちに、何年も過ぎていきます。",
"お金を盗まれれば怒るのに、自分の時間を奪われることには驚くほど無頓着です。時間こそ、二度と戻ってこない大切な財産なのだとセネカは教えます。",
"「長く生きること」よりも、「自分の時間を自分のものとして生きること」が大切なのだと語る本です。"
]},
{ cat:"t_greece", title:"提要", yomi:"ていよう", sub:"エピクテトス", author:"エピクテトス", icon:"☔", text:[
"雨の日に出かけようとして、「どうして今日にかぎって雨なんだ」と腹を立てたとします。でも、いくら怒っても雨は止みません。",
"エピクテトスは、世界には「自分で変えられるもの」と「自分では変えられないもの」があると考えました。",
"自分の考え方や行動は変えられます。でも天気、他人の気持ち、過去に起きたことなどは、自分の思いどおりにはできません。",
"変えられないものまで支配しようとすると、人は苦しくなります。だから、自分にできることに力を使い、自分ではどうにもならないことは受け入れる。その区別ができれば、心はずっと自由になると教えるストア哲学の本です。"
]},
{ cat:"t_greece", title:"自省録", yomi:"じせいろく", sub:"マルクス・アウレリウス", author:"マルクス・アウレリウス", authorYomi:"マルクス・アウレリウス", icon:"📓", text:[
"マルクス・アウレリウスは、巨大なローマ帝国の皇帝でした。けれど戦争や病気、政治の問題など、毎日のように困難がやってきました。",
"そんな彼は夜になると、自分自身へ向けて文章を書きました。「人に腹を立てるな」「いつか死ぬことを忘れるな」「いまできる正しいことをしよう」と、自分に言い聞かせます。",
"ほかの人が嫌なことを言っても、その人を完全に変えることはできません。でも、自分がどう受け止めるかは選べます。",
"『自省録』は、もともと誰かに読ませるための本ではありませんでした。一人の皇帝が、苦しい毎日のなかで「どうすれば立派な人間でいられるか」を何度も自分に問いかけた、心の日記のような哲学書です。"
]},
{ cat:"t_greece", title:"懐疑論概説", yomi:"かいぎろんがいせつ", sub:"セクストス・エンペイリコス", author:"セクストス・エンペイリコス", authorYomi:"セクストス・エンペイリコス", icon:"❓", text:[
"二人の人が、同じ食べものを食べました。一人は「おいしい」と言い、もう一人は「まずい」と言いました。",
"では、その食べものは本当に「おいしい」のでしょうか。それとも「まずい」のでしょうか。",
"セクストス・エンペイリコスは、私たちが「絶対にこうだ」と言っていることの多くには、反対の考え方もできるのではないかと考えました。",
"だから、すぐに「これが真実だ」と決めつけるのではなく、「まだ分からない」と判断をいったん止めてみる。これを「判断停止」といいます。",
"不思議なことに、何が何でも正解を決めようとしなくなると、心の争いも静かになります。疑うことによって心の平静を目指した、古代懐疑主義の本です。"
]},
{ cat:"t_greece", title:"エネアデス", sub:"プロティノス", author:"プロティノス", icon:"☀️", text:[
"プロティノスは、この世界にあるものをずっとたどっていけば、最後には何に行き着くのだろうと考えました。",
"木も人間も星も、それぞれ別のものです。けれど世界が完全にばらばらなら、一つの世界としてまとまっているのは不思議です。",
"そこでプロティノスは、すべての根本には「一者」という、言葉では説明しきれない究極のものがあると考えました。そこから「知性」が生まれ、さらに「魂」が生まれ、やがて私たちの世界が現れると考えます。",
"太陽から光があふれ出すように、すべての存在が一者から流れ出してくる。そして人間の魂は、もう一度その根源へ帰ろうとする。神秘的で大きな世界観を描いた哲学です。"
]},
{ cat:"t_middle", title:"告白", yomi:"こくはく", sub:"アウグスティヌス", author:"アウグスティヌス", icon:"🙏", text:[
"若いころのアウグスティヌスは、勉強もできましたが、欲望に振り回され、どんな生き方が正しいのか分からず悩んでいました。",
"いろいろな思想や宗教をさまよった末、彼はキリスト教へとたどりつきます。そして、自分がどんな人生を歩いてきたのかを振り返りながら、神に語りかけるように『告白』を書きました。",
"話は自分の思い出だけでは終わりません。「記憶とは何だろう」「時間とは何だろう」と考え始めます。過去はもうなく、未来はまだありません。それなのに、なぜ私たちは時間を感じるのでしょう。",
"自分の心を深く見つめていくうちに、いつの間にか世界や時間や神の問題へ進んでいく。自伝と哲学が一つになったような本です。"
]},
{ cat:"t_middle", title:"神の国", yomi:"かみのくに", sub:"アウグスティヌス", author:"アウグスティヌス", icon:"🏰", text:[
"西暦410年、長いあいだ強大だったローマの町が敵に攻められました。人々は大きなショックを受け、「キリスト教を信じるようになったからローマが弱くなったのではないか」と言う人まで現れました。",
"そこでアウグスティヌスは、「一つの国が滅びたからといって、世界の意味まで失われるわけではない」と考えます。",
"人間の歴史には、自分の欲望や権力を求める「地上の国」と、神への愛を中心とする「神の国」という二つの方向が重なっていると説明しました。",
"どんなに大きな帝国でも永遠ではありません。歴史全体を見れば、人間の国の栄えや滅びよりも大きな意味がある。政治と宗教と歴史を一つの大きな視点から考えた本です。"
]},
{ cat:"t_middle", title:"哲学の慰め", yomi:"てつがくのなぐさめ", sub:"ボエティウス", author:"ボエティウス", icon:"🎡", text:[
"ボエティウスは高い地位についていましたが、突然反逆の疑いをかけられ、牢屋に入れられてしまいました。やがて死刑になることも決まります。",
"「なぜ自分がこんな目にあうのだろう」。絶望しているボエティウスの前に、物語のなかで「哲学」という女性が現れます。",
"哲学は言います。「地位やお金や名声は、運命によって簡単に失われるものです」。今日は王様でも、明日は何も持たない人になるかもしれません。",
"では、運命に奪われない幸福とは何でしょう。ボエティウスは哲学との対話を通して、善、幸福、神、自由について考えていきます。苦しいとき、哲学は人をどこまで支えられるのかを描いた本です。"
]},
{ cat:"t_middle", title:"プロスロギオン", sub:"アンセルムス", author:"アンセルムス", icon:"✨", text:[
"アンセルムスは修道院で、「神がいるということを、信じるだけではなく、考えることによって理解できないだろうか」と思いました。",
"そこで彼は、神を「それより大きなものを考えることができないほど、最高の存在」と考えます。",
"もし、その神が頭のなかにしか存在しないとしましょう。すると、頭のなかだけでなく現実にも存在する神のほうが、もっと大きな存在になってしまいます。それでは最初の定義と矛盾する。だから神は現実にも存在しなければならない、とアンセルムスは論じました。",
"これが後に「神の存在論的証明」と呼ばれる議論です。「信じていることを、理性によってどこまで説明できるか」に挑戦した中世哲学の重要な作品です。"
]},
{ cat:"t_middle", title:"哲学者の意図", yomi:"てつがくしゃのいと", sub:"アル＝ガザーリー", author:"アル＝ガザーリー", authorYomi:"ガザーリー", icon:"📖", text:[
"イスラーム世界では、アリストテレスなど古代ギリシャの哲学が盛んに研究されていました。アル＝ガザーリーも、その哲学を詳しく勉強しました。",
"しかし彼は、いきなり哲学者を批判することはしませんでした。まず「相手が何を言っているのかを正確に知らなければ、正しい批判はできない」と考えます。",
"そこで『哲学者の意図』では、論理学、自然についての考え、神や存在についての考えなど、当時の哲学者たちの思想を整理して説明しました。",
"この本そのものは、哲学を攻撃する本ではありません。むしろ、「まず相手の考えをきちんと理解する」という仕事です。そのあとガザーリーは、その哲学のどこに問題があると考えたのかを別の本で論じることになります。"
]},
{ cat:"t_middle", title:"治癒の書", yomi:"ちゆのしょ", sub:"イブン・シーナー", author:"イブン・シーナー", authorYomi:"イブン・シーナー", icon:"🩺", text:[
"イブン・シーナーは、医学者としても哲学者としても有名な人物でした。彼は「人間が知ることのできる世界を、大きな一つの体系にまとめよう」と考えました。",
"そのため『治癒の書』には、論理学、数学、自然科学、魂、存在、神についての議論まで、たくさんの分野が入っています。",
"イブン・シーナーは、「存在するものには、それがなくてもよかったものと、絶対になければならないものがある」と考えました。そして世界の根本には、自分以外の何かによって存在させられたのではない「必然的な存在」が必要だと考えます。",
"また、「もし身体からの感覚が全部なくなっても、自分が存在していることは分かるのではないか」と考え、魂とは何かも探りました。中世イスラーム哲学の巨大な百科事典のような本です。"
]},
{ cat:"t_middle", title:"哲学者の自己矛盾", yomi:"てつがくしゃのじこむじゅん", sub:"アル＝ガザーリー", author:"アル＝ガザーリー", authorYomi:"ガザーリー", icon:"⚔️", text:[
"ガザーリーは、哲学者たちの考えを十分に学んだあと、「では、その主張は本当に正しいのか」と一つずつ調べ始めました。",
"特に問題にしたのは、神や世界についての議論です。たとえば「世界には始まりがなく、ずっと存在していた」という哲学者の考えに対して、「本当にそこまで理性だけで証明できるのか」と問いかけました。",
"また、神が一人ひとりの出来事をどのように知るのか、死後に人間はどうなるのか、といった問題でも哲学者を批判します。",
"ガザーリーは哲学そのものを全部否定したわけではありません。数学や論理学などは認めながら、理性だけで神について何でも決められるという態度を問題にしました。「理性にはどこまでできるのか」をめぐる本です。"
]},
{ cat:"t_middle", title:"矛盾の矛盾", yomi:"むじゅんのむじゅん", sub:"イブン・ルシュド", author:"イブン・ルシュド", authorYomi:"イブン・ルシュド", icon:"🔁", text:[
"ガザーリーが哲学者たちを厳しく批判してからしばらくして、イブン・ルシュドという哲学者が現れました。",
"彼はガザーリーの本を読み、「その批判のほうにも問題がある」と考えます。そして題名からして真正面から反論する『矛盾の矛盾』を書きました。",
"イブン・ルシュドは、神を信じることと哲学することは敵同士ではないと考えました。世界を神がつくったのなら、その世界を理性によって調べることもまた大切なはずだというのです。",
"聖典の言葉と哲学の結論がぶつかって見えるときには、言葉を表面的に読むだけでなく、その深い意味を考える必要があるとも主張しました。信仰と理性は一緒に歩けるのかを考えた本です。"
]},
{ cat:"t_middle", title:"迷える者の手引き", yomi:"まよえるもののてびき", sub:"マイモニデス", author:"マイモニデス", icon:"🗺️", text:[
"マイモニデスのまわりには、悩んでいる人たちがいました。ユダヤ教の教えを信じている一方で、アリストテレスの哲学を学ぶと、二つが合わないように見えることがあったからです。",
"「聖書が正しいなら、哲学は間違いなのか。それとも哲学が正しいなら、聖書を捨てなければならないのか」。",
"マイモニデスは、「どちらか一つを捨てなくてもよい」と考えました。聖書には、すべてを文字どおりに読むのではなく、比喩として理解すべき部分もあるというのです。",
"また神について、人間と同じように「こういう性格だ」と簡単に言うことはできないと考えました。むしろ「神はこれではない」と語るほうが正確なのだと説きます。信仰と哲学のあいだで迷う人のための案内書です。"
]},
{ cat:"t_middle", title:"神学大全", yomi:"しんがくたいぜん", sub:"トマス・アクィナス", author:"トマス・アクィナス", authorYomi:"トマス・アクィナス", icon:"⛪", text:[
"トマス・アクィナスは、「キリスト教の教えと、アリストテレスの哲学を一つの大きな体系にできないだろうか」と考えました。",
"そこでまず問いを出します。「神は存在するのか」「人間の魂とは何か」「善い行いとは何か」。そして反対意見もきちんと並べ、それに答えていきます。",
"神の存在については、動いているものには原因があることや、世界に原因と結果があることなどから、「すべての根本となるものが必要なのではないか」といくつかの道筋を示しました。",
"さらに法律や道徳、人間の幸福まで話は広がります。信仰だけでなく理性も使って世界全体を整理しようとした、中世ヨーロッパ哲学最大級の作品です。"
]},
{ cat:"t_middle", title:"無知について", yomi:"むちについて", sub:"ニコラウス・クザーヌス", author:"ニコラウス・クザーヌス", icon:"⭕", text:[
"人間は、たくさん勉強すれば何でも知ることができるのでしょうか。クザーヌスは、「むしろ、本当に賢い人ほど、自分がどれだけ知らないかを知っている」と考えました。",
"たとえば、多角形の辺をどんどん増やしていけば、だんだん円に近づきます。でも、何本増やしても完全な円そのものにはなりません。",
"人間の知識もそれと似ています。私たちは世界や神について少しずつ理解を深めることはできます。でも、無限のものを有限な人間の頭で完全にとらえることはできません。",
"だから「私は全部分かった」と思うのではなく、自分の知識の限界を知ることが大切です。クザーヌスはこれを「知ある無知」と考えました。知らないことを知ることから始まる哲学です。"
]},
{ cat:"t_early", title:"君主論", yomi:"くんしゅろん", sub:"ニッコロ・マキャヴェリ", author:"ニッコロ・マキャヴェリ", icon:"👑", text:[
"ある国の君主が、「よい王様になるにはどうしたらいいのだろう」と考えたとします。",
"それまでなら、「正直で、慈悲深く、立派な人になりなさい」と答える人が多かったでしょう。ところがマキャヴェリは、もっと厳しい現実を見ました。",
"政治の世界では、相手が約束を守らないこともあります。戦争が起こることもあります。そんな世界で、自分だけがいつも理想どおりに行動すれば、国そのものを失うかもしれません。",
"そこで彼は、「政治家がどうあるべきか」ではなく、「実際の政治はどう動いているのか」を考えました。ときには恐れられることや、策略を使うことまで必要になる場合があると論じます。",
"政治をきれいごとだけではなく、権力と現実の世界として見つめたことで、近代政治思想の出発点の一つになった本です。"
]},
{ cat:"t_early", title:"ユートピア", sub:"トマス・モア", author:"トマス・モア", icon:"🏝️", text:[
"ある旅人が、「私はユートピアという不思議な島へ行ったことがある」と話し始めます。",
"その島では、土地や財産の多くを個人が独り占めしません。みんなが働き、必要なものを分け合います。働く時間も、当時のヨーロッパよりずっと短くされています。",
"トマス・モアがこの島を描いたころの社会では、貧しい人が苦しむ一方で、豊かな人がたくさんの土地や財産を持っていました。そこで架空の国を描くことで、「いまの社会は本当に正しいのだろうか」と読者に問いかけたのです。",
"ただし、ユートピアの制度がすべて理想として描かれているのか、それとも皮肉も含まれているのかは簡単には決められません。",
"「もし社会の仕組みを最初から作り直せるなら、どんな国をつくるだろう」。そんな想像を通して、現実の社会を見直すための本です。"
]},
{ cat:"t_early", title:"エセー", sub:"モンテーニュ", author:"モンテーニュ", icon:"✍️", text:[
"モンテーニュは、あるとき「人間というものを知りたいなら、まず自分自身をよく見てみよう」と考えました。",
"そこで、自分が何を怖がるのか、どんなときに怒るのか、友情とは何か、死とは何か、さまざまなことを思いつくままに書いていきました。",
"けれどモンテーニュは、「これが絶対に正しい答えだ」とはあまり言いませんでした。人間の考えは変わるし、自分自身でさえ完全には分からないからです。",
"そこで彼が大切にしたのが、「私は何を知っているのだろう」という問いでした。自分の考えを疑いながら、自分自身を材料にして人間という存在を探っていく本です。"
]},
{ cat:"t_early", title:"ノヴム・オルガヌム", sub:"フランシス・ベーコン", author:"フランシス・ベーコン", icon:"🔬", text:[
"ベーコンは、「昔の偉い人がそう言ったから正しい」と考えるだけでは、新しい知識は生まれないと思いました。",
"たとえば、自然について知りたいなら、本のなかだけで考えるのではなく、実際に観察したり、実験したりする必要があります。",
"けれど人間には、ものごとを正しく見るのを邪魔する思い込みがあります。自分の経験だけで決めつけたり、みんなが信じていることをそのまま信じたり、言葉にだまされたりします。",
"ベーコンは、こうした思い込みを「イドラ」と呼びました。それを少しずつ取りのぞき、たくさんの観察から共通する法則を見つけていく。それが新しい科学の方法だと考えた本です。"
]},
{ cat:"t_early", title:"方法序説", yomi:"ほうほうじょせつ", sub:"ルネ・デカルト", author:"ルネ・デカルト", icon:"💭", text:[
"デカルトは、ある日考えました。「自分が信じていることのなかに、間違いが混じっているかもしれない」。",
"そこで彼は、少しでも疑えるものは、いったん全部疑ってみることにしました。",
"目で見たものも間違うことがあります。夢を見ているときには、夢を現実だと思っています。では、いま自分が見ている世界も、本当に確かなものなのでしょうか。",
"けれど、どれだけ疑っても、「疑っている自分がいる」ということだけは疑えません。そこでデカルトは、「我思う、ゆえに我あり」という考えにたどりつきます。",
"絶対に確かな一点から、知識をもう一度組み立て直そうとした、近代哲学の出発点となる本です。"
]},
{ cat:"t_early", title:"省察", yomi:"せいさつ", sub:"ルネ・デカルト", author:"ルネ・デカルト", icon:"😈", text:[
"デカルトは、『方法序説』で始めた「すべてを疑う」という考えを、さらに深く進めました。",
"もし、とても強力な悪い存在がいて、自分をずっとだましているとしたらどうでしょう。目の前の机も、自分の身体も、数学の答えさえ、本当ではないかもしれません。",
"それでも、「だまされている自分がいる」ということだけは消せません。考えているかぎり、自分の存在だけは確かです。",
"そこからデカルトは、神の存在や、心と身体の違いについて考えていきます。心は考えるもの、身体は空間をもつものだと区別しました。",
"「人間が本当に確実に知ることのできるものは何か」を、徹底的に疑うことから探した哲学書です。"
]},
{ cat:"t_early", title:"リヴァイアサン", sub:"トマス・ホッブズ", author:"トマス・ホッブズ", icon:"🐋", text:[
"ホッブズは、「もし国も法律も警察もなかったら、人間はどうなるのだろう」と考えました。",
"人はみんな、自分の命を守りたいし、自分に必要なものを手に入れたいと思います。しかし、欲しいものがぶつかれば争いが起きます。",
"だれも止める人がいなければ、人はいつ襲われるか分からず、安心して暮らすことができません。ホッブズは、そんな状態を「万人の万人に対する闘争」と考えました。",
"そこで人々は、「勝手に何でもする自由の一部を手放すから、その代わりに安全を守ってほしい」と約束し、強い国家をつくります。",
"国家はなぜ必要なのかを、人々どうしの約束から説明した社会契約論の代表的な本です。"
]},
{ cat:"t_early", title:"パンセ", sub:"ブレーズ・パスカル", author:"ブレーズ・パスカル", icon:"🌾", text:[
"パスカルは、人間というものを見て、不思議に思いました。",
"人間は宇宙に比べれば、とても小さく弱い存在です。少しの病気や事故で死んでしまいます。",
"けれど人間は、その大きな宇宙について考えることができます。宇宙は人間を押しつぶすことはできても、「自分が人間を押しつぶしている」と考えることはできません。",
"だから人間は、とても弱いのに、考えるという点ではとても偉大だとパスカルは言います。",
"その一方で、人は自分がいつか死ぬことを考えたくないため、遊びや仕事に夢中になって気をまぎらわせます。人間の偉大さと惨めさを見つめながら、最後には信仰の問題へ向かっていく本です。"
]},
{ cat:"t_early", title:"エチカ", sub:"バールーフ・スピノザ", author:"バールーフ・スピノザ", icon:"🌳", text:[
"スピノザは、世界には神と自然という二つのものが別々にあるのではなく、実は一つなのではないかと考えました。",
"神が世界の外にいて、ときどき奇跡を起こすのではありません。自然そのもの、存在するすべての根本が神なのだというのです。",
"そして人間も、その大きな自然の一部です。怒りや悲しみも、理由もなく起こるのではなく、自然の法則のなかで生まれます。",
"だから、自分の感情をただ責めるのではなく、「なぜ自分はこう感じるのか」を理解することが大切だとスピノザは考えました。",
"ものごとの原因を深く理解するほど、人は感情に振り回されにくくなり、より自由になれる。神、自然、人間、自由を一つの体系として描いた本です。"
]},
{ cat:"t_early", title:"神学・政治論", yomi:"しんがく・せいじろん", sub:"スピノザ", author:"スピノザ", icon:"🗞️", text:[
"スピノザの時代には、「聖書にこう書いてあるから、これが絶対に正しい」と言って、人々の考えをしばることがありました。",
"スピノザは、「聖書は本当に、自然科学や政治の教科書として書かれたのだろうか」と疑います。",
"聖書を書いた人たちは、それぞれの時代や社会のなかで生きていました。だから文章を理解するときには、「だれが、いつ、どんな人に向けて書いたのか」を調べる必要があると考えます。",
"そして宗教の大切な役割は、人々に愛や正義を教えることであって、自由な思考を禁止することではないと主張しました。",
"国家もまた、人々が安心して自由に考えられるために存在すべきだと説いた、宗教と政治と言論の自由についての本です。"
]},
{ cat:"t_early", title:"人間知性論", yomi:"にんげんちせいろん", sub:"ジョン・ロック", author:"ジョン・ロック", icon:"📄", text:[
"赤ちゃんが生まれたとき、その頭のなかには、最初からたくさんの知識が入っているのでしょうか。",
"ロックは、「そうではない」と考えました。生まれたばかりの心は、何も書かれていない白い紙のようなものだというのです。",
"そこへ、見る、聞く、触るといった経験が入ってきます。さらに、自分の心が考えたり感じたりしていることも経験します。",
"そうした材料を組み合わせて、「赤い」「丸い」「りんご」といった知識を少しずつ作っていくのです。",
"つまり人間の知識は、最初から持っているのではなく、経験から始まる。人はどのようにものを知るのかを考えた、イギリス経験論の代表的な本です。"
]},
{ cat:"t_early", title:"統治二論", yomi:"とうちにろん", sub:"ジョン・ロック", author:"ジョン・ロック", icon:"🛡️", text:[
"ロックは、「王様は神から選ばれているのだから、何をしてもよい」という考えに疑問を持ちました。",
"人間は生まれながらに、命を守る権利、自由に生きる権利、自分のものを持つ権利を持っていると考えます。",
"けれど、一人ひとりが自分で自分の権利を守っていたら争いになることもあります。そこで人々は政府をつくり、権利を守る仕事を任せます。",
"大切なのは、政府が人々の上に立つ主人ではないということです。政府は、人々から仕事を任されているにすぎません。",
"もし政府が人々の権利を壊し始めたなら、人々にはその政府を変える権利がある。近代の自由主義や民主主義に大きな影響を与えた本です。"
]},
{ cat:"t_early", title:"モナドロジー", sub:"ゴットフリート・ライプニッツ", author:"ゴットフリート・ライプニッツ", icon:"🫧", text:[
"ライプニッツは、「この世界をいちばん細かいところまで分けていったら、最後には何が残るのだろう」と考えました。",
"石を小さく割っても、それはまだ物です。けれど本当の世界の基本は、物の粒ではないのではないかと考えます。",
"そこで彼は、世界は「モナド」という、目には見えない精神的な単位からできていると考えました。",
"一つ一つのモナドは、直接ほかのモナドと物をやり取りするわけではありません。それなのに世界全体は、不思議なほど調和して動いています。",
"ライプニッツは、それを神が最初からうまく合わせた「予定調和」だと説明しました。世界のすべてを、小さな精神的存在から説明しようとした哲学です。"
]},
{ cat:"t_early", title:"人知原理論", yomi:"じんちげんりろん", sub:"ジョージ・バークリー", author:"ジョージ・バークリー", icon:"🪑", text:[
"机が目の前にあります。では、目を閉じても、その机は存在しているのでしょうか。",
"バークリーは、「そもそも私たちが知っている机とは、色や形や硬さなど、感じ取ったものの集まりではないか」と考えました。",
"人間は、感じられるものとは別に「物質そのもの」があると思っています。でも、感じることのできない物質そのものを、どうやって知るのでしょう。",
"そこでバークリーは、「存在するとは、知覚されることだ」と考えました。",
"では、だれも見ていないときに世界は消えるのでしょうか。バークリーは、神が常にすべてを知覚しているため、世界は存在し続けると説明しました。",
"「物がある」とはどういうことかを、根本から問い直した本です。"
]},
{ cat:"t_kant", title:"人間本性論", yomi:"にんげんほんせいろん", sub:"デイヴィッド・ヒューム", author:"デイヴィッド・ヒューム", icon:"🎱", text:[
"ヒュームは、「人間の心そのものを、科学のように調べてみよう」と考えました。",
"たとえば、ビリヤードの球を一つぶつけると、もう一つの球が動きます。私たちは「最初の球が、次の球を動かした」と思います。",
"けれど実際に見えるのは、一つの出来事のあとに、もう一つの出来事が起きたことだけです。「原因」というものそのものを目で見ることはできません。",
"同じことが何度も起きるので、「次もそうなるだろう」と心が習慣的に期待しているだけではないか、とヒュームは考えました。",
"さらに、「変わらない自分」というものも、本当に見つかるのか疑います。知識、自我、原因と結果など、当たり前だと思っていたものを徹底的に調べ直した本です。"
]},
{ cat:"t_kant", title:"人間知性研究", yomi:"にんげんちせいけんきゅう", sub:"デイヴィッド・ヒューム", author:"デイヴィッド・ヒューム", icon:"🌅", text:[
"『人間本性論』があまり読まれなかったため、ヒュームは自分の考えを、もう少し分かりやすく書き直しました。",
"人間の考えは、どこから生まれるのでしょう。ヒュームは、まず実際に見たり、聞いたり、感じたりした強い経験があり、そのあとに薄いコピーのような「考え」が生まれると説明しました。",
"また、「明日も太陽は昇る」と私たちは思います。でも、それは論理だけで絶対に証明できることでしょうか。",
"過去に毎日昇ったから、明日も昇るだろうと期待しているだけです。つまり、人間の生活は、証明できない「習慣」に大きく支えられています。",
"人間の理性に何ができ、何ができないのかを、分かりやすく問い直した本です。"
]},
{ cat:"t_kant", title:"法の精神", yomi:"ほうのせいしん", sub:"モンテスキュー", author:"モンテスキュー", icon:"🏛️", text:[
"モンテスキューは、たくさんの国の法律や政治を調べながら、「なぜ国によって制度がこんなに違うのだろう」と考えました。",
"法律は、どの国にもまったく同じ形で当てはめればよいものではありません。国の広さ、気候、歴史、人々の暮らし方などによって、合う制度は変わると考えます。",
"そして、もっとも有名なのが「権力分立」の考えです。",
"一人の人や一つの組織が、法律を作り、実行し、裁判まで全部行ったら、強すぎる力を持ってしまいます。",
"だから、立法、行政、司法の力を分け、お互いを抑え合うほうが自由を守りやすい。現代の多くの国の政治制度に大きな影響を与えた本です。"
]},
{ cat:"t_kant", title:"社会契約論", yomi:"しゃかいけいやくろん", sub:"ジャン＝ジャック・ルソー", author:"ジャン＝ジャック・ルソー", icon:"🤝", text:[
"ルソーは、「人間は自由なものとして生まれた。それなのに、なぜいたるところで何かにしばられているのだろう」と考えました。",
"国家には法律があります。もし法律がただ王様から命令されるだけなら、人は自由とは言えません。",
"では、自分たち自身で法律をつくったならどうでしょう。",
"ルソーは、人々がみんなで「どんな社会にするか」を決め、その共通の意思に従う社会を考えました。この共通の意思を「一般意志」と呼びます。",
"ただ好き勝手に行動することが自由なのではなく、自分も参加して決めたルールに従うことこそ、政治的な自由なのだと考えました。",
"「人民が主権を持つ」とはどういうことかを考えた、近代政治思想の重要な本です。"
]},
{ cat:"t_kant", title:"人間不平等起源論", yomi:"にんげんふびょうどうきげんろん", sub:"ジャン＝ジャック・ルソー", author:"ジャン＝ジャック・ルソー", icon:"🚧", text:[
"ルソーは、「人間社会には、なぜ貧しい人と豊かな人、支配する人とされる人がいるのだろう」と考えました。",
"そこで、社会がまだ存在しなかったころの人間を想像します。",
"もともとの人間は、一人で静かに生き、自分に必要なものだけを求めていたのではないか。ところが人が集まるようになると、他人と自分を比べ始めます。",
"「あの人より立派に見られたい」「もっとたくさん持ちたい」という気持ちが生まれます。",
"さらに、ある人が土地を囲って「これは私のものだ」と言い、ほかの人がそれを認めたところから、大きな不平等が始まったのではないかとルソーは考えました。",
"社会と文明は本当に人間を幸せにしたのかを問い直す本です。"
]},
{ cat:"t_kant", title:"百科全書", yomi:"ひゃっかぜんしょ", sub:"ディドロ／ダランベール編", author:"ディドロ／ダランベール編", icon:"📚", text:[
"18世紀のフランスで、ディドロたちは大きな計画を立てました。",
"「人間が知っていることを、できるだけ全部、一つの本に集めよう」。",
"科学、技術、哲学、宗教、芸術、職人の仕事まで、さまざまな知識を集めて説明しました。",
"大切なのは、ただ知識を並べただけではありません。当時は王や教会が強い力を持っていましたが、『百科全書』には、「昔からそうだから」という理由だけで信じるのではなく、自分の理性で考えようという精神が流れていました。",
"知識を一部の人だけが持つのではなく、多くの人に広げる。人間は理性と知識によって社会をよりよくできるという、啓蒙思想を象徴する巨大な本です。"
]},
{ cat:"t_kant", title:"道徳感情論", yomi:"どうとくかんじょうろん", sub:"アダム・スミス", author:"アダム・スミス", icon:"💞", text:[
"アダム・スミスというと経済学で有名ですが、彼はまず「人はなぜ他人を思いやるのだろう」と考えました。",
"たとえば、知らない人が転んで痛がっているのを見ると、自分まで少し痛そうな気持ちになることがあります。",
"スミスは、人間には他人の立場を想像する「共感」の力があると考えました。",
"さらに、自分の行動を考えるときには、「公平な第三者が見ていたら、自分の行動をどう思うだろう」と想像できます。",
"自分の欲望だけでなく、ほかの人から見ても正しいと思える行動を選ぶ。そうした心の働きから道徳が生まれると考えました。",
"人間社会が成り立つ理由を、共感という感情から説明した本です。"
]},
{ cat:"t_kant", title:"感覚論", yomi:"かんかくろん", sub:"コンディヤック", author:"コンディヤック", icon:"👃", text:[
"コンディヤックは、「人間の心の働きは、どこまで感覚だけから説明できるのだろう」と考えました。",
"そこで、最初は何も知らない一体の像を想像します。",
"まず匂いを感じられるようにします。次に味、音、色、触った感じを、一つずつ加えていきます。",
"すると感覚から、注意、記憶、比較、判断、欲望など、さまざまな心の働きが少しずつ生まれていくのではないかと考えました。",
"つまり、人間には生まれつき複雑な考えが備わっているのではなく、すべては感覚という小さな入口から始まる。",
"ロックの経験論をさらに強く押し進め、人間の精神を感覚から説明しようとした本です。"
]},
{ cat:"t_kant", title:"人間機械論", yomi:"にんげんきかいろん", sub:"ラ・メトリ", author:"ラ・メトリ", icon:"⚙️", text:[
"人間が考えたり、喜んだり、悲しんだりするのは、魂という特別なものが身体のなかにあるからなのでしょうか。",
"ラ・メトリは、医者として人間の身体を見ながら、「心の状態は身体ととても深く結びついている」と考えました。",
"熱が出れば考え方も変わります。お酒を飲めば気分が変わります。脳を傷つければ性格や記憶が変わることもあります。",
"それなら、心も身体とは別の神秘的なものではなく、身体、とくに脳の働きとして説明できるのではないか。",
"ラ・メトリは、人間を非常に複雑な「機械」のような存在として考えました。",
"心と身体を完全に分ける考えに反対し、人間も自然の一部として理解しようとした本です。"
]},
{ cat:"t_kant", title:"道徳および立法の諸原理序説", spine:"道徳および立法の|諸原理序説", yomi:"どうとくおよびりっぽうのしょげんりじょせつ", sub:"ジェレミー・ベンサム", author:"ジェレミー・ベンサム", icon:"😊", text:[
"ベンサムは、「よい行いと悪い行いを、何を基準にして決めればいいのだろう」と考えました。",
"そこで、とても分かりやすい基準を出します。",
"その行いによって、人々の喜びが増えるのか。それとも苦しみが増えるのか。",
"多くの人に、できるだけ大きな幸福をもたらす行いがよい行いだと考えました。これが「最大多数の最大幸福」と呼ばれる功利主義の考えです。",
"しかもベンサムは、個人の道徳だけではなく、法律を作るときにもこの考えを使えると考えました。",
"「昔からある法律だから守る」のではなく、「この法律は本当に人々の幸福を増やしているのか」と調べるべきだと考えた本です。"
]},
{ cat:"t_kant", title:"純粋理性批判", yomi:"じゅんすいりせいひはん", sub:"イマヌエル・カント", author:"イマヌエル・カント", icon:"🔎", text:[
"カントは、合理論と経験論の争いを見ていました。",
"ある人たちは「理性で考えれば真理にたどりつける」と言い、別の人たちは「知識は経験からしか生まれない」と言います。",
"そこでカントは、「そもそも人間は、世界をそのまま見ているのだろうか」と考えました。",
"人間の心には、入ってきた情報を時間や空間、原因と結果といった形に整理する働きがあります。",
"つまり私たちは、世界そのものを直接見ているのではなく、人間の認識の仕組みを通して世界を見ています。",
"だから人間が知ることのできる範囲には限界があります。「人間は何を知ることができるのか」を、知識そのものの仕組みから調べ直した大きな哲学書です。"
]},
{ cat:"t_kant", title:"実践理性批判", yomi:"じっせんりせいひはん", sub:"イマヌエル・カント", author:"イマヌエル・カント", icon:"🧭", text:[
"カントは、次に「人間は何をすべきなのか」を考えました。",
"もし「ほめられるから親切にする」のなら、ほめられないときには親切にしないかもしれません。",
"では、損得とは関係なく、「それが正しいからする」という行動はあるのでしょうか。",
"カントは、人間には「こうすべきだ」と自分自身に命令する理性があると考えました。",
"本当に道徳的な行動とは、欲望や利益ではなく、自分の理性が正しいと認めた法則に従うことです。",
"そして、自分で道徳の法則を選び、それに従えるという意味で、人間には自由があると考えました。",
"「善い行動とは何か」と「自由とは何か」を結びつけて考えた本です。"
]},
{ cat:"t_kant", title:"判断力批判", yomi:"はんだんりょくひはん", sub:"イマヌエル・カント", author:"イマヌエル・カント", icon:"🌄", text:[
"美しい夕焼けを見たとき、「これは美しい」と感じることがあります。",
"でも、おいしい食べものなら「自分が好きだから好き」で終わります。それに対して美しいものを見ると、「ほかの人も美しいと思うはずだ」と感じることがあります。",
"カントは、この不思議な「美」の感じ方を考えました。",
"また、とても大きな山や激しい嵐を見ると、怖いのにどこか圧倒されることがあります。これを「崇高」と呼びました。",
"さらに、生き物を見ると、まるで身体の一つ一つが目的をもって作られているように見えます。",
"美、芸術、自然、生き物を、人間がどのように判断しているのかを考えた、カント三大批判書の最後の一冊です。"
]},
{ cat:"t_kant", title:"道徳形而上学の基礎づけ", yomi:"どうとくけいじじょうがくのきそづけ", sub:"イマヌエル・カント", author:"イマヌエル・カント", icon:"📏", text:[
"ある人が、「うそをつけば自分だけ助かる」という場面に出会ったとします。",
"カントは、そこで「この一回だけならいいだろう」と考えるのではなく、「みんながいつでも同じことをしてよいルールにできるだろうか」と考えるべきだと言います。",
"もし、みんなが都合の悪いときにはうそをついてよいことになれば、だれも約束を信じなくなります。",
"だから、自分だけを例外にしてはいけません。",
"カントは、「自分の行動のルールが、すべての人に通用する法則になってもよいか」を考えることを大切にしました。",
"さらに、人間を自分の目的のための道具としてだけ扱ってはいけないとも説きます。近代の義務論を代表する本です。"
]},
{ cat:"t_c19", title:"知識学", yomi:"ちしきがく", sub:"ヨハン・フィヒテ", author:"ヨハン・フィヒテ", icon:"🪞", text:[
"デカルトやカントは、「人間はどのように世界を知るのか」を考えてきました。",
"フィヒテは、さらに一歩進んで、「そもそも『私』がなければ、世界について語ることもできないのではないか」と考えました。",
"まず「私」が自分自身を意識します。そして、自分ではないもの、つまり世界が「私」の前に現れます。",
"すると「私」は、世界という抵抗にぶつかりながら行動します。",
"フィヒテにとって人間は、ただ世界を眺めている存在ではありません。世界に働きかけ、自分自身をつくっていく能動的な存在です。",
"「自我」を哲学の出発点にして、カントの哲学をさらに押し進めようとした本です。"
]},
{ cat:"t_c19", title:"人間的自由の本質", yomi:"にんげんてきじゆうのほんしつ", sub:"フリードリヒ・シェリング", author:"フリードリヒ・シェリング", icon:"😇", text:[
"もし神が完全に善い存在で、この世界をつくったのなら、なぜ世界には悪があるのでしょう。",
"シェリングは、この難しい問題を考えました。",
"人間が最初から善いことしかできない存在なら、その人は本当に「善い」と言えるでしょうか。",
"善いことも悪いこともできるのに、それでも善を選ぶからこそ、そこには本当の自由があります。",
"つまり、自由があるということは、悪を選ぶ可能性もあるということです。",
"シェリングは、人間の自由をただ「好きなことができる」という意味ではなく、善と悪の両方を選ぶ可能性として考えました。自由と悪の関係を深く考えた本です。"
]},
{ cat:"t_c19", title:"精神現象学", yomi:"せいしんげんしょうがく", sub:"ゲオルク・ヘーゲル", author:"ゲオルク・ヘーゲル", icon:"🪜", text:[
"ヘーゲルは、人間の意識がどのように成長していくのかを、大きな物語のように描きました。",
"最初、人は「目の前に見えているものこそ確かなものだ」と思います。ところが考えていくと、その考えでは説明できない矛盾が出てきます。",
"すると今までの考え方を乗り越えて、もっと広い見方へ進みます。",
"有名なのが「主人と奴隷」の話です。主人は奴隷を支配しますが、主人の生活は奴隷の働きに頼っています。一方、奴隷は働いて世界を変えるなかで、自分自身の力を知っていきます。",
"意識は、矛盾にぶつかってはそれを乗り越えながら成長する。個人の心から歴史全体までを一つの発展として描いた大作です。"
]},
{ cat:"t_c19", title:"法の哲学", yomi:"ほうのてつがく", sub:"ゲオルク・ヘーゲル", author:"ゲオルク・ヘーゲル", icon:"👨‍👩‍👧", text:[
"人間は自由でいたいと思います。",
"では、自由とは「何をしてもいい」ということでしょうか。ヘーゲルは、そうではないと考えました。",
"人は家族のなかで育ち、仕事をし、社会のなかでほかの人と関わり、国家の一員として生きています。",
"そうした制度が全部なくなれば、自由になるどころか、安心して自分の人生を送ることさえ難しくなります。",
"だから本当の自由は、社会から逃げることではなく、よい制度のなかで自分の意思を実現することだとヘーゲルは考えました。",
"家族、市民社会、国家という三つの段階を通して、人間の自由が社会のなかでどのように形になるかを考えた本です。"
]},
{ cat:"t_c19", title:"大論理学", yomi:"だいろんりがく", sub:"ゲオルク・ヘーゲル", author:"ゲオルク・ヘーゲル", icon:"♾️", text:[
"ヘーゲルは、「考えるということそのものは、どのように進むのだろう」と考えました。",
"たとえば「存在」という、とても単純な考えから始めます。",
"何の特徴もない「ただ存在している」という考えを突きつめると、それは何も決まっていないので、「無」とほとんど区別できなくなります。",
"すると「存在」と「無」が行き来する「生成」という新しい考えが現れます。",
"このように、一つの考えを最後まで進めると、そのなかに矛盾が現れ、その矛盾からもっと豊かな考えが生まれるとヘーゲルは考えました。",
"世界や思考を、止まったものではなく、矛盾を通して動き続けるものとして捉えた、とても難しい哲学書です。"
]},
{ cat:"t_c19", title:"意志と表象としての世界", spine:"意志と表象として|の世界", yomi:"いしとひょうしょうとしてのせかい", sub:"アルトゥル・ショーペンハウアー", author:"アルトゥル・ショーペンハウアー", icon:"🌊", text:[
"ショーペンハウアーは、「なぜ人間は、満足してもすぐにまた何かを欲しがるのだろう」と考えました。",
"欲しいものを手に入れるまでは苦しい。手に入れば少しうれしい。でも、しばらくするとまた別のものが欲しくなります。",
"彼は、この終わりのない欲望の力を「意志」と呼びました。",
"そして、人間だけでなく、生き物や自然の根本にも、この盲目的な意志が働いていると考えます。",
"だから人生には苦しみが多い。しかし芸術を見ているときや、他人の苦しみに深く共感するときには、しばらく自分の欲望から離れることができます。",
"「なぜ生きることは苦しいのか」を、欲望の仕組みから説明した哲学です。"
]},
{ cat:"t_c19", title:"死に至る病", yomi:"しにいたるやまい", sub:"セーレン・キルケゴール", author:"セーレン・キルケゴール", icon:"🥀", text:[
"キルケゴールは、「人間にとって、もっとも深い病気とは何だろう」と考えました。",
"身体の病気ではありません。彼が「死に至る病」と呼んだのは「絶望」です。",
"人は、「こんな自分になりたくない」と自分から逃げようとすることがあります。反対に、「自分は自分の力だけで何にでもなれる」と思い込むこともあります。",
"どちらも、本当の自分との関係がうまくいっていない状態だとキルケゴールは考えました。",
"自分とは、完成したものではなく、自分自身と関わりながら生きていく存在です。",
"「私は本当は何者なのか」という、とても個人的な問いから、人間の絶望と信仰を考えた実存哲学の代表作です。"
]},
{ cat:"t_c19", title:"あれか、これか", sub:"セーレン・キルケゴール", author:"セーレン・キルケゴール", icon:"🔀", text:[
"人生には、たくさんの楽しみがあります。",
"おいしいものを食べ、美しい音楽を聞き、恋をして、毎日を楽しく過ごす。キルケゴールは、これを「美的な生き方」と呼びました。",
"でも、楽しさだけを追い続けると、やがて空しさがやってくることがあります。",
"そこで別の生き方があります。結婚したり、仕事を引き受けたり、自分で選んだことに責任を持って生きる「倫理的な生き方」です。",
"人生では、すべての選択肢を残しておくことはできません。「あれもこれも」ではなく、「あれか、これか」を選ばなければならない。",
"選択することによって自分自身をつくるとはどういうことかを考えた本です。"
]},
{ cat:"t_c19", title:"キリスト教の本質", yomi:"キリストきょうのほんしつ", sub:"ルートヴィヒ・フォイエルバッハ", author:"ルートヴィヒ・フォイエルバッハ", icon:"✝️", text:[
"フォイエルバッハは、人々が「神は愛にあふれ、完全で、永遠の存在だ」と語るのを聞いて考えました。",
"「もしかすると、人間は自分たちが理想とする性質を、神という存在に映しているのではないか」。",
"人間は愛を大切だと思うから、「神は完全な愛を持つ」と考えます。知恵を大切にするから、「神はすべてを知っている」と考えます。",
"つまり神とは、人間自身の理想を大きくしたものではないかというのです。",
"それなら、神について考えているようで、実は人間自身について考えていることになります。",
"宗教を否定するだけではなく、宗教を通して「人間とは何か」を理解しようとした本です。"
]},
{ cat:"t_c19", title:"共産党宣言", yomi:"きょうさんとうせんげん", sub:"カール・マルクス／フリードリヒ・エンゲルス", author:"カール・マルクス／フリードリヒ・エンゲルス", icon:"🚩", text:[
"マルクスとエンゲルスは、工場が増えていくヨーロッパを見ていました。",
"工場を持つ人は大きなお金を得る一方、そこで働く人たちは長い時間働いても、貧しい生活を送ることがありました。",
"二人は、歴史を動かしてきた大きな力の一つは「階級どうしの争い」だと考えました。",
"昔には支配する人と奴隷がいて、封建社会には領主と農民がいました。そして資本主義社会では、工場や資本を持つ「ブルジョワジー」と、働いて賃金を得る「プロレタリアート」が向き合います。",
"この対立はやがて社会そのものを変えるだろう。資本主義社会への批判と革命への呼びかけを、短く力強くまとめた本です。"
]},
{ cat:"t_c19", title:"資本論", yomi:"しほんろん", sub:"カール・マルクス", author:"カール・マルクス", icon:"💰", text:[
"マルクスは、「資本主義という仕組みは、どうやって動いているのだろう」と細かく調べました。",
"まず、一つの商品を考えます。商品には、実際に役立つ価値と、ほかの商品と交換できる価値があります。",
"そして商品を作るためには、人間の労働が必要です。",
"労働者は一日働き、賃金を受け取ります。しかし、その人が一日に生み出した価値が、受け取る賃金より大きければ、その差は資本を持つ人の利益になります。",
"マルクスは、この差を「剰余価値」と考えました。",
"お金がさらに大きなお金を生み出し続ける資本主義の仕組みを、商品、労働、賃金、利益から細かく分析した巨大な本です。"
]},
{ cat:"t_c19", title:"ドイツ・イデオロギー", sub:"マルクス／エンゲルス", author:"マルクス／エンゲルス", icon:"🏭", text:[
"哲学者たちは長いあいだ、「人間の考えが社会を動かす」と考えることがありました。",
"マルクスとエンゲルスは、その順番を逆に見ました。",
"人間は、まず食べなければ生きていけません。家をつくり、服をつくり、生活に必要なものを生産します。",
"その「どのように働き、どのように物を作っているか」という生活の仕組みが変われば、社会制度や人々の考え方も変わるのではないか。",
"つまり、考えが生活を作るだけではなく、現実の生活や経済の仕組みが考えを作るというのです。",
"歴史を思想だけではなく、人々の実際の生活や生産の仕組みから理解しようとした本です。"
]},
{ cat:"t_c19", title:"自由論", yomi:"じゆうろん", sub:"ジョン・スチュアート・ミル", author:"ジョン・スチュアート・ミル", icon:"🗽", text:[
"ある人が、とても変わった服を着て、変わった生活をしていたとします。",
"ほかの人たちが「普通ではないからやめさせよう」と言ったら、それは正しいでしょうか。",
"ミルは、「その人がほかの人を傷つけていないなら、できるだけ自由にさせるべきだ」と考えました。",
"これを「危害原則」と呼びます。",
"本人のためを思っていても、「あなたのためだから」と無理やり生き方を決めてはいけません。",
"また、間違っているように見える意見でも、話す自由を守るべきだと考えました。反対意見とぶつかることで、自分が信じている考えも本当に正しいのか確かめられるからです。",
"個人の自由を社会はどこまで認めるべきかを考えた本です。"
]},
{ cat:"t_c19", title:"功利主義論", yomi:"こうりしゅぎろん", sub:"ジョン・スチュアート・ミル", author:"ジョン・スチュアート・ミル", icon:"🐖", text:[
"ベンサムは、「できるだけ多くの人に、できるだけ多くの幸福を」と考えました。",
"ミルも、その功利主義を受け継ぎました。",
"しかし彼は、「すべての快楽を、同じ一個の快楽として数えてよいのだろうか」と疑問を持ちます。",
"おなかいっぱいになる喜びもあれば、音楽を理解する喜び、勉強して世界が分かる喜び、友情の喜びもあります。",
"ミルは、人間には質の高い喜びと、そうでない喜びがあると考えました。",
"そして有名な言葉で、「満足した豚であるより、不満足な人間であるほうがよい」と考えます。",
"ただ気持ちよさの量を増やすだけではなく、人間らしい幸福とは何かまで考え直した功利主義の本です。"
]},
{ cat:"t_c19", title:"デモクラシー・イン・アメリカ", spine:"デモクラシー・|イン・アメリカ", sub:"アレクシ・ド・トクヴィル", author:"アレクシ・ド・トクヴィル", icon:"🗳️", text:[
"トクヴィルはフランスからアメリカへ渡り、「民主主義の国とは、いったいどんな社会なのだろう」と観察しました。",
"そこでは、昔のヨーロッパのように、生まれた身分だけで人生が大きく決まる社会が少しずつ崩れ、人々は「自分たちは平等な市民だ」と考えるようになっていました。",
"トクヴィルは、これは大きな進歩だと考えます。しかし同時に、少し心配もしました。多数の人が同じ意見を持つと、少数の人が「みんなと違うことを言いにくい」社会になるかもしれないからです。",
"また、人々が自分の生活のことだけを考え、政治をすべて政府に任せてしまえば、いつの間にか強い国家に管理される可能性もあります。",
"民主主義は、ただ選挙をすれば完成するものではありません。人々が地域の活動や政治に参加し、自分で考え続けることが必要だと説いた本です。"
]},
{ cat:"t_c19", title:"自由・平等・友愛", yomi:"じゆう・びょうどう・ゆうあい", sub:"ジェームズ・フィッツジェームズ・スティーヴン", author:"ジェームズ・フィッツジェームズ・スティーヴン", icon:"🔗", text:[
"「自由は大切だ」と言われると、多くの人はその通りだと思うでしょう。",
"けれどスティーヴンは、「自由なら、いつでも多ければ多いほどよいのだろうか」と疑いました。",
"社会には、法律や道徳やルールがあります。それらは人間の自由を少し制限します。しかし、まったく制限がなければ、強い人が弱い人を好き勝手に傷つける社会になるかもしれません。",
"スティーヴンは、ミルの『自由論』を批判しながら、「社会を守るためには、ある程度の強制や権威も必要なのではないか」と考えました。",
"自由、平等、友愛はどれも大切です。でも、それらはいつも簡単に仲よく並ぶわけではありません。社会ではそれぞれをどう組み合わせればよいのかを考えた本です。"
]},
{ cat:"t_c19", title:"単一者とその所有", yomi:"たんいつしゃとそのしょゆう", sub:"マックス・シュティルナー", author:"マックス・シュティルナー", icon:"🧍", text:[
"シュティルナーは、人間がたくさんの「大きな言葉」に従って生きていることに気づきました。",
"「国家のため」「社会のため」「道徳のため」「神のため」。人は、そうしたものを自分よりも大切な存在として扱うことがあります。",
"でもシュティルナーは問いかけます。「なぜ自分が、自分で作った考えの奴隷にならなければならないのだろう」。",
"彼は、自分より上にある絶対的なものをできるだけ認めず、一人ひとりの具体的な「この私」を大切にしようとしました。",
"国や宗教だけでなく、「人類」や「正義」という立派に聞こえる言葉でさえ、人間をしばるものになるかもしれません。",
"「自分の人生はいったい誰のものなのか」を、かなり激しい言葉で問いかける個人主義の哲学書です。"
]},
{ cat:"t_c19", title:"相互扶助論", yomi:"そうごふじょろん", sub:"ピョートル・クロポトキン", author:"ピョートル・クロポトキン", icon:"🐝", text:[
"自然界では、「強いものが弱いものに勝つこと」だけが、生き残るための方法なのでしょうか。",
"クロポトキンは動物たちを観察しながら、そうではないと考えました。",
"鳥たちは仲間と群れをつくります。草食動物は危険を知らせ合います。人間も、村をつくり、助け合いながら生きてきました。",
"生き物は競争するだけではなく、仲間どうしで協力することで生き残ってきたのではないかというのです。",
"クロポトキンは、人間社会でも、上から命令されなくても、人々が自発的に助け合うことができると考えました。",
"「自然界は弱肉強食だけでできている」という見方に対して、「助け合いもまた進化の大きな力なのだ」と主張した本です。"
]},
{ cat:"t_c19", title:"ツァラトゥストラはこう語った", spine:"ツァラトゥストラは|こう語った", yomi:"ツァラトゥストラはこうかたった", sub:"フリードリヒ・ニーチェ", author:"フリードリヒ・ニーチェ", icon:"🏔️", text:[
"山のなかで長く一人で暮らしていたツァラトゥストラは、ある日、人々のいる町へ下りていくことにしました。",
"そして人々に、「神は死んだ」と語ります。",
"これは、本当に神様が死んだという物語ではありません。昔のヨーロッパで、人々の生き方を支えていた宗教や価値観が、以前ほど絶対的ではなくなったことを表しています。",
"では、昔の価値がなくなったあと、人は何を目標に生きればよいのでしょう。",
"ニーチェは、人間が自分自身を乗り越え、新しい価値をつくっていく存在を「超人」と呼びました。",
"誰かから与えられた「正しい生き方」に従うのではなく、自分の生を肯定し、自分自身で価値を生み出すことを、詩のような物語で語った哲学書です。"
]},
{ cat:"t_c19", title:"善悪の彼岸", yomi:"ぜんあくのひがん", sub:"フリードリヒ・ニーチェ", author:"フリードリヒ・ニーチェ", icon:"🌗", text:[
"人はよく、「これは善い」「これは悪い」と言います。",
"でもニーチェは、「その善悪の基準は、いったい誰が作ったのだろう」と考えました。",
"哲学者たちは、自分の考えをまるで永遠の真理のように語ります。しかし実は、その人自身の性格や欲望、時代の価値観が、その哲学のなかに入りこんでいるのではないかというのです。",
"ニーチェは、善悪についても同じように疑いました。「みんなが善いと言っているから善い」と簡単に信じてはいけません。",
"自分が信じている価値観の後ろには、どんな力や欲望が隠れているのか。",
"善と悪という二つの箱に世界を簡単に分けることをやめ、その「向こう側」まで考えてみようとする本です。"
]},
{ cat:"t_c19", title:"道徳の系譜", yomi:"どうとくのけいふ", sub:"フリードリヒ・ニーチェ", author:"フリードリヒ・ニーチェ", icon:"🧬", text:[
"ニーチェは、「道徳にも歴史があるのではないか」と考えました。",
"たとえば「善い人」と聞くと、やさしくて、謙虚で、欲張らない人を思い浮かべるかもしれません。",
"でも、昔からずっと「善い」という言葉が同じ意味だったのでしょうか。",
"ニーチェは、昔の強い貴族たちは、自分たちの力強さや誇りを「善い」と考えていたと説明します。しかし、支配される側の人々は、その価値観をひっくり返し、「強く威張ることは悪い」「弱く謙虚であることこそ善い」と考えるようになったのではないかと論じました。",
"つまり道徳は、空から落ちてきた永遠のルールではなく、人間どうしの力関係のなかで生まれてきた。",
"私たちが当たり前だと思っている善悪の「生まれ方」を調べた本です。"
]},
{ cat:"t_c19", title:"悲劇の誕生", yomi:"ひげきのたんじょう", sub:"フリードリヒ・ニーチェ", author:"フリードリヒ・ニーチェ", icon:"🎭", text:[
"古代ギリシャには、悲しい結末をむかえる「悲劇」という芝居がたくさんありました。",
"ニーチェは、「どうして人は、わざわざ悲しく苦しい物語を見るのだろう」と考えました。",
"そこでギリシャ文化には、二つの力があると考えます。一つは、形や秩序、美しい姿を大切にする「アポロン的」な力。もう一つは、音楽や酒のように、自分という境界を忘れて激しく生命を感じる「ディオニュソス的」な力です。",
"悲劇では、この二つが出会います。",
"人生には苦しみや死があります。それを隠すのではなく、真正面から見ながら、それでも「生きることには価値がある」と感じさせるのが芸術なのだとニーチェは考えました。",
"芸術と人生の深い関係を考えた若きニーチェの本です。"
]},
{ cat:"t_c19", title:"自殺論", yomi:"じさつろん", sub:"エミール・デュルケーム", author:"エミール・デュルケーム", icon:"📊", text:[
"自殺というと、一人ひとりの悩みや性格だけの問題だと思われがちです。",
"デュルケームは、「本当にそれだけなのだろうか」と考えました。",
"そこで、国や地域、宗教、結婚しているかどうかなど、たくさんの統計を調べました。",
"すると、自殺する人の割合には社会によって違いがあることが見えてきました。",
"人が社会からひどく孤立している場合もあれば、逆に集団に強くのみこまれすぎている場合もあります。また、社会のルールが急に崩れ、人々が「何を目標に生きればよいのか」分からなくなるときにも危険が高まると考えました。",
"とても個人的に見える出来事にも、社会の力が働いていることを示し、社会学を大きく発展させた本です。"
]},
{ cat:"t_c19", title:"時間と自由", yomi:"じかんとじゆう", sub:"アンリ・ベルクソン", author:"アンリ・ベルクソン", icon:"🕰️", text:[
"時計を見ると、一分、一分、一分と、同じ長さの時間が進んでいきます。",
"でも、楽しい一時間はあっという間に過ぎ、退屈な一時間はとても長く感じることがあります。",
"ベルクソンは、「時計が測る時間と、私たちが実際に生きている時間は同じではない」と考えました。",
"心のなかの時間は、一秒ずつ切り分けられるものではありません。昔の記憶が今の気持ちに溶けこみ、それが次の瞬間へ続いていきます。",
"ベルクソンは、この流れるような時間を「持続」と呼びました。",
"人間の自由を理解するためには、数字で区切られた時間だけでなく、この生きられた時間を見なければならない。時間と意識を新しい角度から考えた本です。"
]},
{ cat:"t_c19", title:"プラグマティズム", sub:"ウィリアム・ジェームズ", author:"ウィリアム・ジェームズ", icon:"🔧", text:[
"二人の人が、ある難しい問題について言い争っていたとします。",
"一人は「世界は本当はこうできている」と言い、もう一人は「いや、こうだ」と言います。",
"ジェームズは、そこで「その二つの考えを信じると、実際には何が変わるのですか」と問いかけました。",
"もし二つの考えから生まれる結果がまったく同じなら、その争いは言葉だけの争いかもしれません。",
"彼は、考えの意味や真理を、その考えが私たちの経験のなかでどのように働くかから考えようとしました。",
"「真理とは、ただ遠くに置かれた動かないものではなく、経験のなかで確かめられていくものではないか」。",
"ものごとの意味を、実際の働きから考えるプラグマティズムを説明した本です。"
]},
{ cat:"t_c20a", title:"探究の理論", yomi:"たんきゅうのりろん", sub:"ジョン・デューイ", author:"ジョン・デューイ", icon:"🌉", text:[
"ある日、いつもの道を歩いていたら、橋が壊れていました。",
"いつもなら何も考えず進めますが、今日は「どうやって向こう側へ行こう」と考えなければなりません。",
"デューイは、人間の「考える」という働きは、こうした問題に出会ったところから始まると考えました。",
"まず困った状況があり、何が問題なのかを確かめます。そして「こうすればいいのではないか」と予想を立て、実際に試してみます。",
"うまくいかなければ、また考え直します。",
"つまり知識とは、ただ頭のなかにためておくものではなく、問題を解決するために使われる道具です。",
"科学も日常生活も、こうした「探究」のくり返しとして理解しようとした本です。"
]},
{ cat:"t_c20a", title:"民主主義と教育", yomi:"みんしゅしゅぎときょういく", sub:"ジョン・デューイ", author:"ジョン・デューイ", icon:"🏫", text:[
"学校では、先生が答えを言い、生徒がそれを覚えればよいのでしょうか。",
"デューイは、「それだけでは、本当に学んだことにはならない」と考えました。",
"子どもは、自分で何かをやってみて、失敗したり、友だちと協力したりしながら学びます。",
"たとえば植物について本で読むだけでなく、実際に育てれば、水や光の大切さを自分の経験として理解できます。",
"デューイは、学校そのものを小さな社会のように考えました。みんなで話し合い、協力し、問題を解決する経験が、民主主義を生きる練習になるというのです。",
"教育とは知識を一方的に渡すことではなく、自分で考え、社会に参加できる人を育てることだと説いた本です。"
]},
{ cat:"t_c20a", title:"算術の基礎", yomi:"さんじゅつのきそ", sub:"ゴットロープ・フレーゲ", author:"ゴットロープ・フレーゲ", icon:"🔢", text:[
"「1＋1＝2」は、どうして正しいのでしょう。",
"小さいころから当たり前のように使っていますが、フレーゲは、その「当たり前」を一から考え直しました。",
"そもそも「1」や「2」という数は何なのでしょう。リンゴ二個と犬二匹はまったく違うものなのに、どちらにも同じ「2」が使えます。",
"それなら数は、物そのものではなさそうです。",
"フレーゲは、数学をできるだけ厳密な論理から説明しようとしました。そして、数を「ものを数える考え方」と深く結びつけて分析していきます。",
"ふだん何気なく使っている数学の土台を調べることで、論理と言語の研究にも大きな影響を与えた本です。"
]},
{ cat:"t_c20a", title:"論理学研究", yomi:"ろんりがくけんきゅう", sub:"エトムント・フッサール", author:"エトムント・フッサール", icon:"🍎", text:[
"「赤いリンゴを見る」とき、私たちの心では何が起きているのでしょう。",
"フッサールは、意識というものを細かく調べようとしました。",
"考えてみると、意識はいつも「何か」についての意識です。見るときには何かを見て、思い出すときには何かを思い出し、怖がるときには何かを怖がっています。",
"フッサールは、この「意識はいつも何かに向かっている」という性質を大切にしました。",
"そして、世界について先に説明を決めてしまうのではなく、「ものが私たちの意識にどのように現れているのか」を丁寧に見ようとします。",
"のちに「現象学」と呼ばれる大きな哲学の流れへつながった本です。"
]},
{ cat:"t_c20a", title:"イデーン", sub:"エトムント・フッサール", author:"エトムント・フッサール", icon:"🔍", text:[
"私たちは、机を見れば「机がそこにある」と何の疑いもなく考えます。",
"フッサールは、「いったん、その当たり前を横に置いてみよう」と言いました。",
"机が本当に存在するかどうかを否定するのではありません。ただ、「存在する」と決める前に、自分には机がどのように現れているのかを調べようというのです。",
"これを「エポケー」や「判断停止」と呼びます。",
"そうすると、見る、思う、記憶する、想像するといった意識の働きそのものが見えてきます。",
"世界とは何かを考える前に、「世界が人間にどう現れるのか」を調べる。フッサールが現象学の方法を本格的に説明した本です。"
]},
{ cat:"t_c20a", title:"デカルト的省察", yomi:"デカルトてきせいさつ", sub:"エトムント・フッサール", author:"エトムント・フッサール", icon:"🫂", text:[
"デカルトは、すべてを疑って「考えている私」にたどりつきました。",
"フッサールも、そこからもう一度考えてみます。",
"自分の意識については調べられます。でも、もしすべてが「私の意識に現れているもの」なら、ほかの人が本当に心を持っていることをどうやって知ればよいのでしょう。",
"目の前に人がいます。その身体は見えますが、その人の心を直接見ることはできません。",
"それでも私たちは、その人も自分と同じように世界を感じている存在だと理解します。",
"フッサールは、こうした「他者」との関係から、私たちが一緒に暮らす共通の世界が成り立つと考えました。",
"自分の意識から出発しながら、他者と世界へ進んでいく本です。"
]},
{ cat:"t_c20a", title:"プリンキピア・エティカ", spine:"プリンキピア・|エティカ", sub:"G・E・ムーア", author:"G・E・ムーア", icon:"💡", text:[
"「親切は善い」「幸福は善い」と言うとき、この「善い」とはいったい何なのでしょう。",
"ムーアは、「善い」というものを、ほかの何かに簡単に言い換えることはできないと考えました。",
"たとえば「善いとは、楽しいことである」と説明したとします。",
"すると、「楽しいことは、本当にいつでも善いの？」とまだ質問できます。だから「善い」と「楽しい」は完全には同じではありません。",
"ムーアは、自然にある何かを指して「これこそ善そのものだ」と説明してしまうことを問題にしました。",
"当たり前のように使っている「善」という言葉を細かく分析し、20世紀の倫理学に大きな影響を与えた本です。"
]},
{ cat:"t_c20a", title:"哲学の諸問題", yomi:"てつがくのしょもんだい", sub:"バートランド・ラッセル", author:"バートランド・ラッセル", icon:"🧩", text:[
"目の前に一つの机があります。",
"でも、ある場所から見ると茶色く見え、光が当たると白く光り、角度を変えると形まで違って見えます。",
"では、「本当の机」はどれなのでしょう。",
"ラッセルは、こうした身近な疑問から、哲学の大きな問題へ進んでいきます。",
"私たちが直接知っているのは、色や形などの「見え方」だけなのか。その向こうに、本当の物が存在するとどうして分かるのか。",
"さらに知識、真理、普遍的なものについても考えていきます。",
"哲学にはすぐ答えが出ない問題がたくさんあります。それでも問い続けることで、世界を見る目が広がるのだと教えてくれる哲学入門の名著です。"
]},
{ cat:"t_c20a", title:"プリンキピア・マテマティカ", spine:"プリンキピア・|マテマティカ", sub:"ラッセル／ホワイトヘッド", author:"ラッセル／ホワイトヘッド", icon:"➗", text:[
"「数学を、すべて論理だけから作ることはできるだろうか」。",
"ラッセルとホワイトヘッドは、とても大きな計画を立てました。",
"普通なら「1＋1＝2」くらい、すぐ分かると思うでしょう。しかし二人は、「1とは何か」「＋とは何か」「＝とは何か」まで、すべて論理の決まりから説明しようとしました。",
"そのため、簡単な計算を証明するだけでも、非常に長い準備が必要になります。",
"二人が目指したのは、数学の土台をできるだけ確かなものにすることでした。",
"計画そのものにはのちに限界が見つかりますが、数学、論理学、哲学の関係を大きく変えた、20世紀を代表する巨大な研究です。"
]},
{ cat:"t_c20a", title:"論理哲学論考", yomi:"ろんりてつがくろんこう", sub:"ルートヴィヒ・ウィトゲンシュタイン", author:"ルートヴィヒ・ウィトゲンシュタイン", icon:"🤫", text:[
"ウィトゲンシュタインは、「言葉は、どうして世界について語ることができるのだろう」と考えました。",
"たとえば「猫が机の上にいる」と言えば、言葉の並びが、現実の一つの状態を表しています。",
"ウィトゲンシュタインは、正しい文章は、世界のあり方を小さな絵のように写し取っていると考えました。",
"しかし、何でも言葉で説明できるわけではありません。",
"倫理、美しさ、人生の意味など、大切なのに事実を説明する文章と同じ方法では語れないものがあります。",
"そこで最後に、「語りえないものについては、沈黙しなければならない」と述べます。",
"言葉で言えることと言えないことの境界線を引こうとした、不思議で短い哲学書です。"
]},
{ cat:"t_c20a", title:"哲学探究", yomi:"てつがくたんきゅう", sub:"ルートヴィヒ・ウィトゲンシュタイン", author:"ルートヴィヒ・ウィトゲンシュタイン", icon:"🎲", text:[
"若いころのウィトゲンシュタインは、言葉は世界を写すものだと考えていました。",
"しかし、だんだん「言葉はそんな単純なものではない」と思うようになります。",
"「ありがとう」「痛い」「約束する」「ゲームをしよう」。これらは、すべて何かを写している言葉でしょうか。",
"言葉の意味は、辞書のなかに一つだけ隠れているのではありません。人々が実際の生活のなかで、その言葉をどう使っているかによって決まります。",
"彼は、こうした言葉の使われ方を「言語ゲーム」と呼びました。",
"哲学の多くの問題は、言葉を本来の使い方から離して考えすぎることで生まれるのではないか。",
"言葉を日常生活へ戻すことで、哲学の混乱をほどこうとした本です。"
]},
{ cat:"t_c20a", title:"論理的構文論", yomi:"ろんりてきこうぶんろん", sub:"ルドルフ・カルナップ", author:"ルドルフ・カルナップ", icon:"🔤", text:[
"哲学者たちは昔から、「世界の本当の姿は何か」「存在とは何か」と議論してきました。",
"カルナップは、「もしかすると、その争いの一部は、世界についてではなく、言葉の使い方についての争いではないか」と考えました。",
"科学では、言葉の意味や文章の作り方をはっきり決める必要があります。",
"そこでカルナップは、哲学の仕事の一つは、言語がどんな規則で作られているかを論理的に調べることだと考えました。",
"「この文章は正しいか」と聞く前に、「どんな言葉のルールを使っているのか」を確認するのです。",
"哲学を、世界についての大きな物語から、言語を整理する仕事へ近づけようとした本です。"
]},
{ cat:"t_c20a", title:"存在と時間", yomi:"そんざいとじかん", sub:"マルティン・ハイデガー", author:"マルティン・ハイデガー", icon:"⌛", text:[
"ハイデガーは、とても単純なのに不思議な質問をしました。",
"「『ある』って、どういうことだろう」。",
"机があります。猫がいます。自分もいます。でも私たちは、「存在する」ということ自体を、ほとんど考えずに暮らしています。",
"ハイデガーは、この問いを考えられる人間を「現存在」と呼びました。",
"人間は、何もない空間にぽつんと現れるわけではありません。家族や社会や歴史のなかに、気づいたときにはすでに生まれています。",
"そして、自分がいつか死ぬ存在だと知っています。",
"死を自分自身の問題として引き受けるとき、人は「みんながそうしているから」という生き方から離れ、自分自身の生を選べるのではないか。",
"存在と時間と死を結びつけて考えた20世紀哲学の大著です。"
]},
{ cat:"t_c20a", title:"存在と無", yomi:"そんざいとむ", sub:"ジャン＝ポール・サルトル", author:"ジャン＝ポール・サルトル", icon:"✂️", text:[
"紙を切るはさみを作るときには、最初に「紙を切る道具にしよう」という目的があります。",
"では、人間にも、生まれる前から「こう生きるための存在だ」という目的が決められているのでしょうか。",
"サルトルは、「人間には最初から決められた本質はない」と考えました。",
"人はまずこの世界に生まれ、そのあと自分で選び、行動することで「自分が何者なのか」を作っていきます。",
"だから人間は自由です。しかし自由であるということは、選んだことへの責任も自分で引き受けなければならないということです。",
"「仕方がなかった」と自由から逃げようとする態度を、サルトルは「自己欺瞞」と考えました。",
"自由とは楽なものではないということを徹底的に考えた本です。"
]},
{ cat:"t_c20a", title:"シーシュポスの神話", yomi:"シーシュポスのしんわ", sub:"アルベール・カミュ", author:"アルベール・カミュ", icon:"🪨", text:[
"ギリシャ神話のシーシュポスは、大きな岩を山の頂上まで運ぶ罰を受けます。",
"やっと頂上に着きそうになると、岩は下まで転がり落ちます。そして、また最初から運ばなければなりません。",
"これが永遠に続きます。",
"カミュは、人間の人生にも似たところがあると考えました。働き、食べ、眠り、また次の日が来ます。「そもそも、この人生にどんな意味があるのだろう」と考えると、世界は答えてくれません。",
"この人間の問いと、答えない世界とのずれを「不条理」と呼びました。",
"しかしカミュは、だから死ねばよいとは考えません。",
"答えがないことを知りながら、それでも岩を押し続け、自分の人生を生きる。そこに人間の反抗と自由があると考えた本です。"
]},
{ cat:"t_c20a", title:"第二の性", yomi:"だいにのせい", sub:"シモーヌ・ド・ボーヴォワール", author:"シモーヌ・ド・ボーヴォワール", icon:"♀️", text:[
"社会には長いあいだ、「男とはこういうもの」「女とはこういうもの」という考えがありました。",
"ボーヴォワールは、「その違いは、すべて生まれたときから決まっているのだろうか」と問いかけました。",
"女の子には「おとなしくしなさい」「こういう服を着なさい」「将来はこうなりなさい」と、社会からいろいろな期待が向けられます。",
"そうした経験を長く受けながら、人は「女性らしい」とされる生き方を身につけていきます。",
"そこでボーヴォワールは、「人は女に生まれるのではない。女になるのだ」と考えました。",
"生物としての違いだけでなく、教育、仕事、結婚、文化などを調べながら、女性が社会のなかでどのように位置づけられてきたかを考えた本です。"
]},
{ cat:"t_c20a", title:"我と汝", yomi:"われとなんじ", sub:"マルティン・ブーバー", author:"マルティン・ブーバー", icon:"🌲", text:[
"目の前に一本の木があります。",
"その木を「高さ十メートル、木材として使える」と見ることもできます。このとき、木は自分が利用したり調べたりする「もの」です。",
"ブーバーは、こうした関係を「我―それ」と呼びました。",
"でも、人間どうしが本当に向き合うときには、相手を便利な道具や数字としてではなく、「あなた」というかけがえのない存在として感じることがあります。",
"それが「我―汝」の関係です。",
"友だちでも家族でも、相手を自分の目的のための道具としてだけ見ると、本当の出会いは失われます。",
"「人は、一人だけで『私』になるのではなく、誰かとの関係のなかで『私』になる」ということを考えた本です。"
]},
{ cat:"t_c20a", title:"全体性と無限", yomi:"ぜんたいせいとむげん", sub:"エマニュエル・レヴィナス", author:"エマニュエル・レヴィナス", icon:"👤", text:[
"人は、知らないものに出会うと、「これはこういうものだ」と理解しようとします。",
"理解できれば安心します。",
"でもレヴィナスは、「ほかの人まで、自分の考えのなかに全部おさめてしまってよいのだろうか」と考えました。",
"目の前にいる他者には、自分には完全には理解できない部分があります。",
"その人の「顔」と出会ったとき、私たちは「この人を傷つけてはいけない」という呼びかけを感じるとレヴィナスは考えました。",
"つまり哲学の出発点は、「世界とは何か」を知ることよりも先に、目の前の他者にどう向き合うかという倫理にあるのではないか。",
"自分ではのみこめない他者を、そのまま尊重することを考えた本です。"
]},
{ cat:"t_c20a", title:"全体主義の起源", yomi:"ぜんたいしゅぎのきげん", sub:"ハンナ・アーレント", author:"ハンナ・アーレント", icon:"⛓️", text:[
"20世紀には、ナチス・ドイツやスターリン時代のソ連のように、国家が人々の生活や考え方まで強く支配する政治が現れました。",
"アーレントは、「どうしてこんな政治が生まれたのだろう」と考えました。",
"ただ一人の悪い独裁者が現れたから、というだけでは説明できません。",
"人々が社会から切り離され、孤独になり、今までの政治や制度を信じられなくなったとき、強い運動にのみこまれやすくなることがあります。",
"さらに宣伝や恐怖によって、現実そのものを判断する力まで奪われていきます。",
"アーレントは、反ユダヤ主義、帝国主義、大衆社会などをたどりながら、全体主義が生まれた歴史を調べました。",
"人間の自由な世界がどのように壊れてしまうのかを考えた本です。"
]},
{ cat:"t_c20a", title:"人間の条件", yomi:"にんげんのじょうけん", sub:"ハンナ・アーレント", author:"ハンナ・アーレント", icon:"🗣️", text:[
"人間は毎日、いろいろなことをしています。",
"ごはんを作り、掃除をし、生活を続けるために働きます。家や道具のような、長く残るものも作ります。そして、人と話し合い、社会のなかで行動します。",
"アーレントは、これらを「労働」「仕事」「活動」という三つに分けて考えました。",
"そのなかでも特に大切にしたのが、人々が同じ場所に集まり、自分の言葉で語り、新しいことを始める「活動」です。",
"人間は一人きりで完成するのではありません。違う人たちと一緒に世界をつくるときに、その人らしさが現れます。",
"政治とは、誰かに支配されることではなく、人々が共に語り行動する場所なのだと考えた本です。"
]},
{ cat:"t_c20b", title:"開かれた社会とその敵", yomi:"ひらかれたしゃかいとそのてき", sub:"カール・ポパー", author:"カール・ポパー", icon:"🚪", text:[
"「歴史には決まった法則があり、未来は必ずこうなる」と言う人がいたとします。",
"ポパーは、その考えを危険だと思いました。",
"もし「自分たちは歴史の正しい道を知っている」と信じれば、「その未来を作るためなら、反対する人を無理やり従わせてもよい」と考えてしまうかもしれません。",
"ポパーは、完全な理想社会を一度に作ろうとするより、社会の問題を一つずつ直していくほうがよいと考えました。",
"そして、政府を批判でき、間違いを平和的に直せる社会を「開かれた社会」と呼びました。",
"「絶対に正しい政治」を求めるのではなく、間違いを直せる仕組みを守ることが大切だと論じた本です。"
]},
{ cat:"t_c20b", title:"隷従への道", yomi:"れいじゅうへのみち", sub:"フリードリヒ・ハイエク", author:"フリードリヒ・ハイエク", icon:"🛤️", text:[
"国が「みんなの生活をもっとよくするため、経済をすべて計画しよう」と考えたとします。",
"何を作るか、いくらで売るか、誰がどこで働くかまで国が決めれば、社会をきれいに整理できそうです。",
"でもハイエクは、「一つの政府が、社会のすべての情報を知ることなどできるのだろうか」と疑いました。",
"人が何を欲しがっているか、どこに何が足りないかという情報は、社会中にばらばらに存在しています。",
"価格や市場は、そうした情報を集める働きをします。",
