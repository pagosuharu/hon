"よつばは、とても元気です。",
"そして見るものすべてが新しく見えます。",
"となりの家には、あさぎ、風香、恵那という三人姉妹が住んでいます。",
"よつばはすぐに仲良くなります。",
"スーパーへ行くだけでも大冒険。",
"雨が降れば大喜び。",
"セミをつかまえたり、花火を見たり、自転車に乗ったりします。",
"大人なら見すごしてしまうようなものでも、よつばにとっては、",
"「なにこれ!? すごい！」",
"という大発見です。",
"ときどき失敗して、お父さんに怒られることもあります。",
"でも次の日になると、また新しい何かを見つけます。",
"この物語には、大きな悪者も、大きな目標もありません。",
"よつばが毎日少しずつ世界を知っていくこと、そのものがお話になっています。",
"「ふつうの一日も、子どもの目で見ればこんなに面白いんだ」。",
"そんなことを感じさせてくれる、やさしい日常の物語です。"
]},
{ cat:"m_daily", title:"あずまんが大王", yomi:"あずまんがだいおう", sub:"あずまきよひこ", author:"あずまきよひこ", icon:"🏫", text:[
"高校に、ちょっと変わった女の子たちが集まりました。",
"ちよちゃんは、まだ小学生くらいの年なのに、とても頭がよく、高校へ飛び級してきた女の子です。",
"大阪から転校してきた春日歩は、みんなから「大阪」と呼ばれるようになります。",
"榊さんは背が高くてかっこいいのですが、本当はかわいい動物が大好きです。",
"ほかにも、元気すぎる智、しっかり者のよみ、運動が得意な神楽がいます。",
"先生たちも、なかなか変わっています。",
"女の子たちは文化祭へ行ったり、体育祭で走ったり、修学旅行へ行ったりします。",
"テストで失敗したり、夏休みに遊んだりもします。",
"特別な事件は起こりません。",
"でも高校生活の三年間は、少しずつ過ぎていきます。",
"一年生だったみんなは二年生になり、やがて三年生になります。",
"そして最後には卒業式の日がやってきます。",
"毎日いっしょにいた友達とも、これからは別々の道へ進みます。",
"笑ってばかりだった何でもない高校生活が、終わってみると、とても大切な時間だったことに気づく物語です。"
]},
{ cat:"m_daily", title:"日常", yomi:"にちじょう", sub:"あらゐけいいち", author:"あらゐけいいち", icon:"🔩", text:[
"高校生のゆっこ、みお、まいは、いつもいっしょに学校で過ごしています。",
"三人は普通の高校生……のはずです。",
"ところが、この町では「普通」があまり普通ではありません。",
"校長先生が鹿と戦っていたり、突然ものすごい爆発が起きたりします。",
"一方、東雲研究所には、はかせという小さな女の子と、なのというロボットの少女が暮らしています。",
"なのの背中には、大きなねじがついています。",
"なのは、",
"「みんなにロボットだとばれたくない」",
"と思っています。",
"でも背中のねじは、どう見ても目立ちます。",
"やがてなのも学校へ通うようになり、ゆっこたちと出会います。",
"猫の阪本さんまで人間の言葉を話し始め、ますますにぎやかになります。",
"ほんの小さなことを、まるで世界の終わりのように大げさに描いたり、逆に大事件をみんなが普通に受け入れたりします。",
"題名は『日常』ですが、その日常はとても不思議です。",
"それでもみんなにとっては、そんな毎日こそが普通なのです。"
]},
{ cat:"m_gag", title:"男子高校生の日常", spine:"男子高校生の|日常", yomi:"だんしこうこうせいのにちじょう", sub:"山内泰延", author:"山内泰延", authorYomi:"やまうちやすのぶ", icon:"🏞️", text:[

{ cat:"m_gag", title:"坂本ですが?", yomi:"さかもとですが", sub:"佐野菜見", author:"佐野菜見", authorYomi:"さのなみ", icon:"✨", text:[

"ただかっこいいだけではなく、人の心まで少しずつ変えていきます。",
"そして最後には、坂本は学校のみんなと別れ、海外へ向かうことになります。",
"みんなはさびしがりますが、坂本は最後まで坂本らしく、かっこよく去っていきます。",
"「どんなときでも、自分らしくいればいい」。",
"そんな少し不思議な少年のお話です。"
]},
{ cat:"m_gag", title:"ヒナまつり", yomi:"ヒナまつり", sub:"大武政夫", author:"大武政夫", authorYomi:"おおたけまさお", icon:"🎎", text:[

"アンズは苦しい生活を経験しながら、人への感謝を覚えていきます。",
"普通の中学生だった瞳は、なぜか仕事の才能を発揮しすぎて、とんでもない大人になっていきます。",
"最後には、ヒナたち超能力者が音楽フェスへ集まり、未来にかかわる大騒動に挑みます。全19巻で完結しています。",
"最初は他人だった新田とヒナが、いつの間にか親子のような家族になっていく物語です。"

{ cat:"m_love", title:"かぐや様は告らせたい〜天才たちの恋愛頭脳戦〜", spine:"かぐや様は|告らせたい", yomi:"かぐやさまはこくらせたい", sub:"赤坂アカ", author:"赤坂アカ", authorYomi:"あかさかあか", icon:"🌙", text:[

"かぐやは大財閥のお嬢さま。",

"二人は、お互いを好きでした。",
"ところが二人とも、とてもプライドが高いのです。",
"「自分から好きと言ったら負けだ！」",
"そう考えた二人は、",
"「どうすれば相手から告白させられるか」",
"という、おかしな頭脳戦を始めます。",
"生徒会には、藤原千花、石上優、伊井野ミコなどの仲間も集まり、毎日大騒ぎです。",
"でもいっしょにいるうち、かぐやと白銀は本当に相手を信じるようになります。",
"そして長い戦いの末、二人はついに気持ちを伝え合い、恋人になります。",
"ところが今度は、かぐやの大きな家が二人を引き離そうとします。",
"白銀や生徒会の仲間たちは、かぐやを一人にしません。",
"最後にはかぐやも、自分の人生を家に決めてもらうのではなく、自分で選ぶようになります。",
"白銀は海外の大学へ進み、かぐやも自分の夢を追います。",
"「告白したら負け」と考えていた二人が、「好きだと言えることは負けではない」と知っていく恋のお話です。"

{ cat:"m_love", title:"月刊少女野崎くん", spine:"月刊少女|野崎くん", yomi:"げっかんしょうじょのざきくん", sub:"椿いづみ", author:"椿いづみ", authorYomi:"つばきいづみ", icon:"✏️", text:[

{ cat:"m_love", title:"ヲタクに恋は難しい", spine:"ヲタクに恋は|難しい", yomi:"ヲタクにこいはむずかしい", sub:"ふじた", author:"ふじた", icon:"🎮", text:[

"「じゃあ、俺と付き合えば？」",

{ cat:"m_love", title:"古見さんは、コミュ症です。", spine:"古見さんは、|コミュ症です。", yomi:"こみさんはコミュしょうです", sub:"オダトモヒト", author:"オダトモヒト", icon:"💬", text:[

"そんな古見さんの気持ちに最初に気づいたのが、只野仁人です。",
"古見さんは黒板に、",
"「友達を100人作りたい」",
"と書きます。",
"只野は、",
"「じゃあ、僕が一人目になるよ」",
"と答えます。",
"そこから古見さんの高校生活が始まります。",
"変わったクラスメートたちと少しずつ話し、文化祭へ行き、修学旅行へ行きます。",

{ cat:"m_love", title:"からかい上手の高木さん", spine:"からかい上手の|高木さん", yomi:"からかいじょうずのたかぎさん", sub:"山本崇一朗", author:"山本崇一朗", authorYomi:"やまもとそういちろう", icon:"😏", text:[

"でも高木さんは、いつも西片の考えていることを先に読んでしまいます。",

"西片は、とうとう自分の気持ちから逃げずに高木さんへ伝えます。",

{ cat:"m_daily", title:"それでも町は廻っている", spine:"それでも町は|廻っている", yomi:"それでもまちはまわっている", sub:"石黒正数", author:"石黒正数", authorYomi:"いしぐろまさかず", icon:"☕", text:[

{ cat:"m_gag", title:"斉木楠雄のΨ難", yomi:"さいきくすおのサイなん", sub:"麻生周一", author:"麻生周一", authorYomi:"あそうしゅういち", icon:"🔮", text:[

{ cat:"m_love", title:"ニセコイ", sub:"古味直志", author:"古味直志", authorYomi:"こみなおし", icon:"🔐", text:[
"一条楽は、高校生です。",
"でも家はヤクザです。",
"楽自身は争いごとが好きではなく、",
"「普通の人生を送りたい」",
"と思っています。",
"そんな楽の前に、桐崎千棘という女の子が現れます。",
"千棘の家も大きなギャングでした。",
"二つの組織がケンカをしないために、",
"「二人が恋人ということにしよう」",
"という話になります。",
"楽と千棘は、",
"「こんなやつ大きらい！」",
"と思いながら、みんなの前では恋人のふりをします。",
"一方、楽には小さいころ、",
"「大きくなったら結婚しよう」",
"と約束した女の子がいました。",
"楽はそのときにもらった鍵つきのペンダントを、ずっと持っています。",
"同級生の小野寺小咲をはじめ、何人もの女の子がその昔の約束に関係していることが分かってきます。",
"本当の約束の相手は小咲でした。",
"でも長い高校生活の中で、楽の心は変わっていました。",
"楽が本当に好きになったのは千棘だったのです。",
"最後に楽は千棘へ気持ちを伝えます。",
"二人は本当の恋人になり、のちに結婚します。",
"「昔の約束」より「今の自分の気持ち」を選ぶ恋のお話です。"
]},
{ cat:"m_love", title:"いちご100%", yomi:"いちごひゃくパーセント", sub:"河下水希", author:"河下水希", authorYomi:"かわしたみずき", icon:"🍓", text:[
"真中淳平は、映画監督になることを夢見る中学生です。",
"ある日、学校の屋上で、一人のかわいい女の子を見かけます。",
"女の子はすぐに走り去ってしまいます。",
"淳平の記憶に残ったのは、いちご模様の下着でした。",
"「今の子はいったいだれなんだ？」",
"淳平は、その女の子を学校一の美少女・西野つかさだと思います。",
"でも実は、屋上にいたのは東城綾でした。",
"綾は地味に見えますが、眼鏡を外すととてもかわいく、物語を書く才能もあります。",
"淳平は西野とつき合いながら、東城とも夢を語り合います。",
"さらに北大路さつきなど、淳平を好きになる女の子たちが現れます。",
"淳平自身も、だれを本当に好きなのか分からなくなります。",
"東城とは、映画を作る夢で深くつながっています。",
"でも淳平が最後に選んだのは西野でした。",
"高校卒業後、淳平は映画を学び、西野も自分の夢へ進みます。",
"離れている時間があっても、二人はまた再会します。",
"たくさん迷いながら、「自分が本当に会いたい人」を見つける青春恋愛物語です。"
]},
{ cat:"m_daily", title:"Papa told me", spine:"Papa|told me", yomi:"パパトールドミー", sub:"榛野なな恵", author:"榛野なな恵", authorYomi:"はしのななえ", icon:"🫖", text:[
"的場知世は、小学生の女の子です。",
"知世は、小説家のお父さん・信吉と二人で暮らしています。",
"お母さんは、知世が小さいころに亡くなりました。",
"でも知世は、",
"「お父さんと二人だから、かわいそう」",
"とは思っていません。",
"お父さんと本を読み、お茶を飲み、町へ出かけます。",
"信吉も、知世をただの小さな子どもとしてではなく、一人の人間として話を聞きます。",
"二人の家には、親せきや友達、仕事仲間など、いろいろな人がやってきます。",
"大人たちの中には、",
"「子どもなんだから、そんなことは分からないでしょう」",
"と言う人もいます。",
"でも知世は、大人が思っているよりずっと多くのことを考えています。",
"恋。",
"家族。",
"仕事。",
"一人で生きること。",
"そうした問題を、知世は子どもの目から静かに見つめます。",
"大きな事件を追う漫画ではありません。",
"父と娘が、お互いを大切にしながら暮らす小さな毎日の中に、",
"「家族って何だろう」",
"という答えを見つけていく物語です。"
]},
{ cat:"m_love", title:"ラブひな", sub:"赤松健", author:"赤松健", authorYomi:"あかまつけん", icon:"🏠", text:[
"浦島景太郎は、子どものころ、一人の女の子と約束しました。",
"「大きくなったら、いっしょに東大へ行こうね」。",
"景太郎はその約束をずっと覚えています。",
"でも勉強はあまり得意ではなく、東京大学の試験に何度も落ちてしまいます。",

"ところが、そこはいつの間にか女子寮になっていました。",
"景太郎は寮の管理人として、女の子たちといっしょに暮らすことになります。",
"中でも成瀬川なるとは、最初からケンカばかりです。",
"なるも東大を目指しています。",
"二人はいっしょに勉強したり、旅行したり、何度も大騒ぎに巻きこまれます。",
"景太郎は少しずつ、子どものころの約束だけではなく、今目の前にいるなる自身を好きになります。",
"なるもまた、何度失敗しても立ち上がる景太郎を大切に思うようになります。",
"二人は大学へ進み、長いすれ違いをこえて恋人になります。",
"最後には景太郎となるは結婚します。",
"昔の小さな約束から始まった夢が、本当の人生へつながっていく恋のお話です。"
]},
{ cat:"m_love", title:"スクールランブル", sub:"小林尽", author:"小林尽", authorYomi:"こばやしじん", icon:"✏️", text:[
"塚本天満は、明るい高校生です。",
"天満は、同じクラスの烏丸大路が大好きです。",
"「どうすれば烏丸くんに好きになってもらえるんだろう！」",
"と、毎日一生懸命考えます。",
"一方、不良のように見える播磨拳児は、天満が大好きです。",
"でも天満は、その気持ちにまったく気づきません。",
"播磨は天満に告白しようとするのですが、毎回ものすごい勘違いが起きます。",
"しかも播磨は漫画を描く才能を見つけ、いつの間にか漫画家を目指すようになります。",
"学校では、天満の妹・八雲や、沢近愛理など、多くの生徒たちの恋も入りまじります。",
"「この人はあの人が好き。でもあの人は別の人が好き」。",
"そんな恋のすれ違いが、どんどん大きくなっていきます。",
"ところが烏丸には、重い病気があることが分かります。",
"烏丸は外国へ行って治療を受けることになります。",
"天満は、烏丸のそばにいるため、自分も外国へ向かいます。",
"播磨の恋は最後まで思いどおりにはなりません。",
"それでも播磨は漫画を描き、自分の道を進みます。",
"恋がかなうかどうかだけでなく、好きだったからこそ成長できた高校生たちの物語です。"
]},
{ cat:"m_gag", title:"かってに改蔵", yomi:"かってにかいぞう", sub:"久米田康治", author:"久米田康治", authorYomi:"くめたこうじ", icon:"🧪", text:[

{ cat:"m_gag", title:"さよなら絶望先生", yomi:"さよならぜつぼうせんせい", sub:"久米田康治", author:"久米田康治", authorYomi:"くめたこうじ", icon:"😱", text:[

{ cat:"m_daily", title:"みなみけ", sub:"桜場コハル", author:"桜場コハル", authorYomi:"さくらばこはる", icon:"🏡", text:[
"南家には、三人の姉妹が暮らしています。",

{ cat:"m_gag", title:"WORKING!!", spine:"WORKING!!", yomi:"ワーキング", sub:"高津カリノ", author:"高津カリノ", authorYomi:"たかつかりの", icon:"🍽️", text:[

{ cat:"m_daily", title:"ばらかもん", sub:"ヨシノサツキ", author:"ヨシノサツキ", icon:"🖌️", text:[
"半田清舟は、若い書道家です。",
"ある日、自分の書を悪く言われて腹を立て、相手を殴ってしまいます。",
"お父さんは、",

"と半田を長崎県の五島列島へ送ります。",

"虫。",
"畑。",

"なるは半田の家へ毎日のように遊びに来ます。",
"半田は最初、",

]},
{ cat:"m_food", title:"甘々と稲妻", yomi:"あまあまといなずま", sub:"雨隠ギド", author:"雨隠ギド", authorYomi:"あまがくれぎど", icon:"🍳", text:[
"犬塚公平は、高校の先生です。",
"公平には、つむぎという小さな娘がいます。",
"二人のお母さんは亡くなってしまいました。",
"公平は一生懸命つむぎを育てていますが、一つ苦手なことがありました。",
"料理です。",
"毎日の食事は、買ってきたお弁当などが多くなっていました。",

"小鳥のお母さんは料理のお店をしていますが、忙しくて家にいないことが多いのです。",
"公平、つむぎ、小鳥の三人は、少しずつ料理を覚えます。",

]},
{ cat:"m_daily", title:"ゆるキャン△", yomi:"ゆるキャン", sub:"あfろ", author:"あfろ", authorYomi:"あふろ", icon:"⛺", text:[
"志摩リンは、一人でキャンプをするのが大好きな高校生です。",
"人の少ない冬のキャンプ場へ行き、テントを張り、静かに本を読みます。",
"そんなある日、キャンプ場で一人の女の子と出会います。",
"各務原なでしこです。",
"なでしこは富士山を見るために自転車で来たのですが、疲れて眠ってしまい、帰れなくなっていました。",
"リンは焚き火のそばで、なでしこに食べ物を分けてあげます。",
"なでしこは、",
"「キャンプって楽しい！」",
"とすっかり気に入ります。",
"学校では大垣千明、犬山あおいたちの「野外活動サークル」へ入り、みんなでキャンプへ行くようになります。",
"リンは一人で静かにキャンプするのが好きです。",
"なでしこはみんなで楽しむのが好きです。",
"二人はやり方が違いますが、",
"「キャンプが好き」",

"山梨、長野、静岡など、いろいろな土地へ出かけます。",
"寒い朝に富士山を見たり、温泉に入ったり、土地のおいしいものを食べたりします。",
"大きな大会も悪者もありません。",
"少しずつ道具をそろえ、新しい場所へ行き、友達との思い出を増やしていきます。",
"2026年10月にも第19巻が刊行されており、リンとなでしこたちの旅はまだ続いています。",
"寒い外で食べるあたたかいごはんや、一人の静かな時間、友達と見る景色。",
"そんな小さな楽しさを集めていく物語です。"
]},
/* ---------- まんが（ついか ぶん） ---------- */
{ cat:"m_history", title:"キングダム", sub:"原泰久", author:"原泰久", authorYomi:"はらやすひさ", icon:"⚔️", text:[
"むかし、中国がまだひとつの国ではなく、いくつもの国に分かれて戦っていたころのお話です。秦という国に、信という少年がいました。信は戦争で親をなくし、友だちの漂といっしょに下僕として働きながら、「いつか天下の大将軍になるんだ」と夢を見ていました。",
"ところが漂は、王さまの身代わりとして宮殿へ呼ばれ、争いに巻きこまれて命を落としてしまいます。悲しむ信の前に現れたのは、漂とそっくりな若い王・嬴政でした。嬴政は「いつか中国をひとつにする」と大きな夢を語ります。信は漂の思いも背負い、嬴政といっしょに戦うことを決めました。",
"信は小さな兵士から始まり、仲間を集めて「飛信隊」をつくります。王騎、麃公、蒙武、王翦、桓騎など、すさまじい将軍たちと出会い、趙の李牧をはじめとする強敵とも戦っていきます。国じゅうの力を合わせて秦を攻めてきた「合従軍」との大戦争も乗りこえ、信は少しずつ大将軍へ近づいていきます。",
"一方の嬴政も、宮殿の中で呂不韋たちと争いながら、ほんとうの王へと成長していきます。そして秦は韓を滅ぼし、ついに中国統一へ向けて本格的に進み始めます。信と嬴政の夢は、もう遠い夢ではありません。ただし物語はまだ続いていて、2026年現在も趙との大きな戦いが描かれています。"
]},
{ cat:"m_history", title:"蒼天航路", yomi:"そうてんこうろ", sub:"作者：王欣太　原案：李學仁", author:"王欣太／李學仁", authorYomi:"きんぐごんた", icon:"🐎", text:[
"むかし、中国の漢という国が弱くなり、各地でたくさんの英雄が立ち上がった時代がありました。その中に、曹操という、とても頭がよく、とても大胆な男がいました。",
"曹操は「家柄が立派だから偉いのではない。才能がある者こそ使うべきだ」と考え、身分にこだわらず、強い者、賢い者、おもしろい者を自分のもとへ集めていきます。黄巾の乱や董卓との戦いをへて、劉備、孫策、孫権、袁紹など、同じ時代を生きる英雄たちとぶつかっていきました。",
"やがて曹操は袁紹の大軍を官渡で破り、中国北部をほぼ支配します。しかし、天下をすべて取ろうと南へ進むと、赤壁で劉備と孫権の連合軍に大敗します。それでも曹操はあきらめず、自分の考える新しい国をつくろうと進み続けました。",
"関羽、張飛、諸葛亮、周瑜たちも、それぞれの信じる道を歩いていきます。そして長い戦いの末、曹操も年老いてその生涯を終えます。「悪者」として描かれることの多かった曹操を、天の下を自由に駆けぬけた一人の大英雄として描いた三国志です。"
]},
{ cat:"m_history", title:"センゴク", sub:"宮下英樹", author:"宮下英樹", authorYomi:"みやしたひでき", icon:"🎌", text:[
"戦国時代、仙石権兵衛秀久という若い武士がいました。権兵衛は初めから立派な名将だったわけではありません。失敗もするし、怒られるし、ときには敵に負けて逃げることもある、ごく人間らしい武士でした。",
"権兵衛は織田信長の家臣となり、木下藤吉郎――のちの豊臣秀吉のもとで戦います。姉川の戦い、長篠の戦い、本能寺の変、山崎の戦いなど、日本の歴史を大きく変えた出来事の中を、一人の兵士として走り続けます。",
"信長が本能寺で死ぬと、秀吉が天下へ向かって進み始めました。権兵衛も大名となりますが、九州の戸次川の戦いで大失敗をしてしまいます。大勢の兵を失い、領地まで取り上げられ、「もう終わった」と思われました。",
"ところが権兵衛は、そこで人生をあきらめません。もう一度はい上がり、小田原攻めで功績をあげ、ふたたび大名へ戻ります。これは「失敗しない英雄」の話ではなく、何度も転びながら、それでも立ち上がった戦国武将の物語なのです。"
]},
{ cat:"m_history", title:"墨攻", yomi:"ぼっこう", sub:"原作：酒見賢一　漫画：森秀樹　脚本：久保田千太郎", author:"酒見賢一／森秀樹／久保田千太郎", authorYomi:"さけみけんいち", icon:"🏰", text:[
"むかし、中国でたくさんの国が争っていたころ、「墨家」という人たちがいました。墨家は「人をむやみに攻めてはいけない」と考え、攻められている弱い国や町を守るための技術を持っていました。",
"ある日、小さな梁城が大軍に囲まれます。助けを求めた町へやってきた墨者は、革離というたった一人の男でした。革離は大きな軍隊を連れてきたわけではありません。それでも城の壁を直し、兵士や町の人に役目を与え、敵の考えを読みながら、知恵を使って大軍と戦います。",
"革離の作戦によって城は守られていきます。しかし、戦争に勝てばすべてが幸せになるわけではありません。町の中にも欲や疑いが生まれ、革離自身も「人を守るために、人を殺さなければならない」という矛盾に苦しみます。",
"その後も革離はさまざまな戦争に巻きこまれます。強い武器よりも知恵を使いながら、「ほんとうに人を救うとはどういうことなのだろう」と問い続ける物語です。"
]},
{ cat:"m_fantasy", title:"皇国の守護者", yomi:"こうこくのしゅごしゃ", sub:"原作：佐藤大輔　漫画：伊藤悠", author:"佐藤大輔／伊藤悠", authorYomi:"さとうだいすけ", icon:"🎖️", text:[
"海に囲まれた小さな国「皇国」へ、ある日、大国「帝国」の大軍が攻めこんできました。兵士の数も武器の数も、帝国のほうがずっと上です。",
"皇国軍の青年将校・新城直衛に命じられたのは、敵を倒すことではありませんでした。「仲間が逃げる時間をつくれ」。つまり、自分たちが敵を引きつけているあいだに、大勢の味方を逃がすという、とても危険な役目です。",
"新城は地形や天気、敵の性格まで利用して、少ない兵士で大軍を何度も足止めします。勇ましい英雄というより、必要なら冷たい決断もする指揮官です。それでも彼の心の中には、部下をできるだけ生きて帰したいという思いがありました。",
"戦争が進むにつれ、新城自身も傷つき、捕らえられ、戦争の残酷さをいやというほど味わいます。なお漫画版は全5巻で、原作小説の物語すべてを描く前に終わっています。だから、新城たちの戦争には、漫画の中では完全な結末がついていません。"
]},
{ cat:"m_history", title:"雪花の虎", yomi:"せっかのとら", sub:"東村アキコ", author:"東村アキコ", authorYomi:"ひがしむらあきこ", icon:"🐯", text:[
"戦国時代の越後に、虎千代という子どもが生まれました。この作品では、のちの上杉謙信となる虎千代は、じつは女の子だった、という物語になっています。",
"父の長尾為景は、強くて元気な虎千代を武将として育てます。虎千代はやがて景虎と名のり、兄・晴景に代わって越後をまとめる立場になりました。男たちばかりの戦国の世で、女性であることを隠しながら、戦と政治の両方を学んでいきます。",
"そして景虎の前に立ちはだかるのが、甲斐の武田信玄でした。二人は川中島などで何度も戦います。敵ではありますが、おたがいの力を認め、「この人となら本気で戦える」と思うほどの特別な相手になっていきます。",
"景虎はやがて上杉謙信となり、人々から「軍神」と呼ばれるほどの武将になります。女としての心を持ちながら、武将として生きる道を選んだ、一人の上杉謙信の生涯が描かれます。"
]},
{ cat:"m_history", title:"信長のシェフ", yomi:"のぶながのシェフ", sub:"原作：西村ミツル　漫画：梶川卓郎", author:"西村ミツル／梶川卓郎", authorYomi:"にしむらみつる", icon:"🍳", text:[
"ある日、料理人のケンが目を覚ますと、そこは戦国時代でした。自分がだれなのか、どうしてここへ来たのか、ほとんど思い出せません。ただひとつ、料理のことだけはよく覚えていました。",
"ケンはやがて織田信長と出会います。信長はケンの料理を食べ、その腕を気に入りました。「お前の料理で、この戦を勝たせてみろ」。こうしてケンは、信長専属の料理人になります。",
"ケンがつくる料理は、ただおなかをいっぱいにするためだけのものではありません。敵と仲直りするため、外国人をもてなすため、兵士を元気づけるため、ときには相手へひそかな合図を送るためにも使われます。ケンは現代の料理の知識を使い、信長の天下取りを助けていきます。",
"しかしケンは、歴史を知っています。織田信長が最後には本能寺で死ぬことも知っています。信長を救えば歴史が変わるかもしれない。それでも目の前の人を見捨てることもできない。料理人ケンは、包丁を手に、歴史そのものと向き合っていくのです。"
]},
{ cat:"m_history", title:"信長協奏曲", yomi:"のぶながコンツェルト", sub:"石井あゆみ", author:"石井あゆみ", authorYomi:"いしいあゆみ", icon:"🏯", text:[
"高校生のサブローは、勉強があまり得意ではなく、日本史にもほとんど興味がありませんでした。ところがある日、ひょんなことから戦国時代へタイムスリップしてしまいます。",
"そこで会ったのは、自分とそっくりな顔をした本物の織田信長でした。病弱だった信長は、「わしの代わりに信長として生きてくれ」と頼みます。こうして歴史をほとんど知らない高校生が、織田信長になってしまいました。",
"サブローは桶狭間、上洛、浅井・朝倉との戦いなどを、持ち前のおおらかさと不思議な運の強さで乗りこえていきます。本物の信長はのちに明智光秀となり、サブローを陰から助けます。家臣たちも、少し変わった「信長」にだんだん心をひかれていきました。",
"そして歴史どおり、運命の日――本能寺の変が近づきます。光秀はサブローの代わりに「織田信長」として死のうとしますが、サブローも仲間を見捨てようとはしません。最後には本能寺で不思議な光に包まれ、サブローの長い戦国生活にも終わりがやってきます。2026年9月、17年間続いた連載は正式に完結しました。"
]},
{ cat:"m_history", title:"風光る", yomi:"かぜひかる", sub:"渡辺多恵子", author:"渡辺多恵子", authorYomi:"わたなべたえこ", icon:"🌸", text:[
"幕末の京都。富永セイという少女は、父と兄を殺した者を追うため、髪を切り、男のふりをして「神谷清三郎」と名のりました。そして壬生浪士組――のちの新選組へ入ります。",
"ところが天才剣士・沖田総司には、すぐに女だと見ぬかれてしまいます。それでも沖田はセイの覚悟を認め、秘密を守ってくれました。セイは沖田とともに働くうち、尊敬だけではなく、一人の男性として彼を愛するようになります。",
"新選組は池田屋事件などで名をあげますが、時代はどんどん変わっていきます。山南敬助、近藤勇たち仲間が次々と死に、沖田も結核で弱っていきました。セイは最後まで沖田のそばにいて、その死を見届けます。",
"その後セイは箱館まで土方歳三を追い、沖田の思いを伝えます。土方も戦死し、新選組の時代は終わりました。明治になったセイは一人の男の子を育てながら生きていきます。大切な人たちはいなくなっても、彼らの「誠」の心を次の時代へ伝えていくのです。"
]},
{ cat:"m_fight", title:"修羅の刻", yomi:"しゅらのとき", sub:"川原正敏", author:"川原正敏", authorYomi:"かわはらまさとし", icon:"👊", text:[
"日本には昔から、「陸奥圓明流」という不思議な武術を受けつぐ一族がいた――というところから、この物語は始まります。",
"陸奥の者たちは刀を持ちません。自分の体だけを武器にして、どんな相手とも戦います。そして、それぞれの時代で「いちばん強い者」と出会い、勝負をしていくのです。",
"ある時代では宮本武蔵と出会い、ある時代では柳生一族と戦い、またある時代では坂本龍馬や新選組など、歴史上の有名な人物たちのそばに現れます。主人公は時代ごとに変わりますが、みんな陸奥の血と技を受けついでいます。",
"「歴史の表には名前が残っていない。でも、もし有名な英雄たちのそばに、とてつもなく強い無名の男がいたら？」。そんな想像をつなぎながら、日本の歴史を旅していく物語です。"
]},
{ cat:"m_history", title:"バガボンド", sub:"作者：井上雄彦　原作：吉川英治『宮本武蔵』", author:"井上雄彦／吉川英治", authorYomi:"いのうえたけひこ", icon:"🗡️", text:[
"関ヶ原の戦いに参加した新免武蔵――まだ「武蔵」と名のる前の武蔵は、ただ強くなることだけを考える荒々しい若者でした。",
"故郷へ帰っても暴れまわり、人々から恐れられていた武蔵は、沢庵和尚との出会いによって少しずつ変わります。そして「宮本武蔵」と名を変え、天下無双を目指して旅に出ました。",
"宝蔵院の槍、柳生の剣、吉岡一門など、武蔵は強い者たちと次々に戦います。勝つたびに強くなりますが、その一方で、「強いとは、人を殺すことなのだろうか」と迷うようになります。佐々木小次郎という、天才的な剣士の人生も、もう一本の物語として進んでいきます。",
"やがて武蔵は農村で土を耕し、人を生かすために働く経験をします。剣で人を倒すことしか知らなかった青年が、「生きること」そのものを考えるようになるのです。なお漫画は長期休載中で、武蔵と小次郎の物語にはまだ最終的な結末が描かれていません。"
]},
{ cat:"m_art", title:"昴", yomi:"すばる", sub:"曽田正人", author:"曽田正人", authorYomi:"そだまさひと", icon:"🩰", text:[
"宮本すばるには、和馬という双子の弟がいました。和馬は重い病気で、だんだん言葉もわからなくなっていきます。すばるは弟へ自分の気持ちを伝えようとして、病室で踊り始めました。",
"やがて和馬は亡くなります。すばるは深く傷つきますが、踊ることだけはやめられませんでした。踊っているあいだだけ、自分の中にある悲しみも怒りも、すべて外へ出すことができたからです。",
"成長したすばるはバレエの世界へ入り、ローザンヌ国際バレエコンクールなどに挑みます。彼女の踊りはとても強く、見る人の心をつかみます。しかし才能が大きすぎるため、まわりの人と普通に生きることがむずかしい少女でもありました。",
"そして世界的な天才ダンサー・プリシラという大きなライバルと出会います。最後には同じ日に『ボレロ』を踊り、まったく違う二人の天才が、それぞれの踊りを観客へ見せます。すばるの物語は、さらに続編『MOON―昴 ソリチュード スタンディング―』へ続いていきます。"
]},
{ cat:"m_history", title:"あずみ", sub:"小山ゆう", author:"小山ゆう", authorYomi:"こやまゆう", icon:"🌙", text:[
"戦国時代が終わりかけたころ、山奥で十人の子どもたちが剣の修行をしていました。その中に、あずみという少女がいました。",
"子どもたちは爺と呼ばれる小幡月斎に育てられ、「世の中にまた大きな戦争を起こそうとする者を暗殺する」という使命を教えられます。そして旅立ちの日、あまりにもつらい試練を受けます。いちばん仲のよい相手と二人組になり、「どちらか一人だけ生き残れ」と命じられたのです。",
"あずみは仲間を失いながらも任務を続けます。豊臣家を支えようとする武将たちや、危険な剣客たちを相手にし、何度も命をねらわれます。あずみは人を倒す力だけなら、とても強い少女でした。",
"けれども旅を続けるうちに、「命令されたから人を殺すだけでいいのだろうか」と考えるようになります。普通に笑ったり、人を好きになったりしたい気持ちも芽生えます。暗殺者として育てられた少女が、自分の人生を自分で選ぼうとしていく物語です。"
]},
{ cat:"m_history", title:"お〜い！竜馬", yomi:"おーいりょうま", sub:"原作：武田鉄矢　漫画：小山ゆう", author:"武田鉄矢／小山ゆう", authorYomi:"たけだてつや", icon:"🌊", text:[
"土佐の町に、坂本竜馬という少年がいました。子どものころの竜馬は泣き虫で、剣もあまり強くなく、よくいじめられていました。",
"けれども家族や友だちに支えられ、剣術を学び、少しずつたくましい青年になります。そして日本へ黒船がやってくると、「この国は、このままでいいのだろうか」と考えるようになりました。",
"竜馬は土佐藩を飛び出し、勝海舟と出会って海軍を学びます。敵同士だった薩摩と長州を結びつけ、「日本人どうしで争うのではなく、みんなで新しい国をつくろう」と動きました。さらに海援隊をつくり、商売をしながら新しい時代を目指します。",
"しかし新しい日本を見る少し前、京都の近江屋で何者かに襲われ、竜馬は命を落とします。それでも彼が結びつけた人々は動き続け、江戸幕府は終わります。泣き虫だった少年が、日本の未来を動かす大きな人物へ育っていく物語です。"
]},
{ cat:"m_history", title:"風雲児たち", yomi:"ふううんじたち", sub:"みなもと太郎", author:"みなもと太郎", authorYomi:"みなもとたろう", icon:"🌪️", text:[
"この物語は、いきなり幕末から始まりません。まず関ヶ原の戦いから始まります。",
"徳川家康が天下を取り、江戸幕府がつくられました。しかし、そのとき負けた薩摩や長州には、徳川への複雑な気持ちが残ります。そして二百年以上のあいだに、日本の社会には少しずつ問題が積み重なっていきました。",
"蘭学を学ぶ人々、北の土地を調べる人々、外国と交渉する人々、政治を変えようとする人々。たくさんの「風雲児」が登場し、一人ひとりの小さな行動が、やがて幕末という大きな時代の変化につながっていきます。",
"そしてペリーの黒船がやってきて、坂本龍馬、西郷隆盛、勝海舟、井伊直弼など、幕末の有名な人物たちが登場します。「幕末は突然始まったのではなく、二百年前から少しずつ準備されていたんだよ」と、とても長い時間をかけて教えてくれる歴史漫画です。"
]},
{ cat:"m_history", title:"壬生義士伝", yomi:"みぶぎしでん", sub:"原作：浅田次郎　漫画：ながやす巧", author:"浅田次郎／ながやす巧", authorYomi:"あさだじろう", icon:"🌾", text:[
"明治の世になってから、人々は一人の新選組隊士について思い出を語り始めます。その男の名は、吉村貫一郎といいました。",
"吉村はとても強い剣士でした。しかし仲間からは「金のことばかり考えるけちな男だ」と笑われます。新選組の給料をできるだけ使わず、故郷へ送り続けていたからです。",
"でも吉村がお金を欲しがったのには理由がありました。故郷の南部藩に残してきた妻と子どもたちを、飢えさせたくなかったのです。家族を生かすために藩を捨て、新選組に入り、「自分は死にたくない。生きて家族のところへ帰る」と言いながら戦い続けました。",
"鳥羽・伏見の戦いで新選組が敗れると、吉村は傷ついた体で大阪の南部藩邸へたどり着きます。しかし脱藩した罪は消えません。吉村は最後まで故郷と家族を思いながら命を終えます。その生き方は息子たちへ受けつがれ、「武士らしさとは何か」を、残された人々に問いかけ続けるのです。"
]},
{ cat:"m_history", title:"SIDOOH 士道", spine:"SIDOOH|士道", yomi:"シドー しどう", sub:"高橋ツトム", author:"高橋ツトム", authorYomi:"たかはしつとむ", icon:"🗻", text:[
"幕末が始まろうとしていたころ、雪村翔太郎と源太郎という幼い兄弟がいました。母を病気で失った二人は、「これからは二人で生きていこう」と決めます。",
"兄弟は剣を学び、たくさんの危険な人々と出会います。そして「白連隊」という仲間たちとともに、会津、新選組、長州、薩摩などがぶつかる大きな時代の流れへ巻きこまれていきます。",
"坂本龍馬、高杉晋作、西郷隆盛、勝海舟など、歴史上の人物とも出会いながら、兄弟は自分たちなりの「武士の道」を探します。しかし時代は江戸幕府を終わらせ、戊辰戦争へ進んでいきました。",
"最後の大きな敵との戦いを終えたあと、重い傷を負った翔太郎は、弟とともに会津を目指します。そして懐かしい磐梯山を見ながら、静かに息を引き取ります。源太郎は兄の思いを受けつぎ、会津戦争、さらに五稜郭まで戦い抜き、自分の道を歩いていきます。"
]},
{ cat:"m_history", title:"アサギロ〜浅葱狼〜", spine:"アサギロ|〜浅葱狼〜", yomi:"アサギロ", sub:"ヒラマツ・ミノル", author:"ヒラマツ・ミノル", authorYomi:"ひらまつみのる", icon:"🐺", text:[
"江戸に、沖田惣次郎という十二歳の少年がいました。のちに新選組最強の剣士・沖田総司と呼ばれる少年です。",
"惣次郎は幼いころから、びっくりするほど剣が強い少年でした。しかし「強い」ということが、人を傷つけたり、命を奪ったりすることでもあると知り、少しずつ剣の重さを学んでいきます。",
"やがて近藤勇、土方歳三たちとともに京都へ向かい、壬生浪士組、そして新選組の一員になります。芹沢鴨との争い、池田屋事件、禁門の変など、幕末の大事件の中で、沖田は「新選組の狼」として生きていきます。",
"けれども歴史を知る人なら、沖田が若くして病に倒れることを知っています。明るく無邪気な少年が、剣と仲間と時代に向き合いながら、あの沖田総司になっていくまでを、ゆっくりと描いている物語です。なお2026年現在も連載は続いています。"
]},
{ cat:"m_history", title:"ちるらん 新撰組鎮魂歌", spine:"ちるらん|新撰組鎮魂歌", yomi:"ちるらん しんせんぐみレクイエム", sub:"原作：梅村真也　漫画：橋本エイジ", author:"梅村真也／橋本エイジ", authorYomi:"うめむらしんや", icon:"🔥", text:[
"幕末の江戸に、土方歳三というけんか好きの青年がいました。乱暴で負けず嫌いな土方は、近藤勇と出会い、「この男となら、おもしろいことができる」と感じます。",
"沖田総司、山南敬助、永倉新八、斎藤一たちも集まり、彼らはまるで家族のようになっていきました。やがて京都へ向かい、壬生浪士組をつくり、のちに「新撰組」と呼ばれるようになります。",
"芹沢鴨との争い、池田屋事件、長州との戦い。強い敵を倒すたびに新撰組は有名になりますが、そのぶん仲間も一人、また一人といなくなります。そして幕府が倒れると、新撰組も追われる側になりました。",
"近藤が死に、沖田も病で死に、それでも土方は戦うことをやめません。最後は箱館まで行き、新しい時代の軍隊と戦い、命を落とします。荒々しいけれど、仲間を家族のように愛した男たちの、短く激しい青春の物語です。"
]},
{ cat:"m_history", title:"陽だまりの樹", yomi:"ひだまりのき", sub:"手塚治虫", author:"手塚治虫", authorYomi:"てづかおさむ", icon:"🌳", text:[
"江戸時代の終わりごろ、伊武谷万二郎というまじめな武士と、手塚良庵という若い医者がいました。",
"万二郎は「武士はこうあるべきだ」と考える、とてもかたい性格の青年です。一方の良庵は女好きで少しだらしないところもありますが、オランダから伝わった新しい医学を学び、人の命を救おうとしていました。けがをした万二郎を良庵が治療したことから、二人は友だちになります。",
"日本には黒船がやってきて、古い江戸のしくみがどんどん揺れ始めます。万二郎は武士として幕府を守ろうとし、良庵は迷信や古い医学と戦いながら、新しい医療を広めようとします。",
"二人の進む道はまるで反対です。それでも時代が大きく変わる中、それぞれが自分の信じた道を一生懸命に歩いていきます。「陽だまりの樹」とは、立派に見えながら中では虫に食われている古い幕府の姿でもあるのです。"
]},
{ cat:"m_history", title:"チェーザレ 破壊の創造者", spine:"チェーザレ|破壊の創造者", yomi:"チェーザレ はかいのそうぞうしゃ", sub:"作者：惣領冬実　監修：原基晶", author:"惣領冬実／原基晶", authorYomi:"そうりょうふゆみ", icon:"⛪", text:[
"ルネサンス時代のイタリア。ピサの大学へ、アンジェロというまじめな青年がやってきました。",
"そこでアンジェロが出会ったのが、チェーザレ・ボルジアという不思議な青年です。チェーザレは頭がよく、剣も強く、人の心を読むことにも長けていました。しかし父は教皇を目指すロドリーゴ・ボルジアで、チェーザレ自身も教会と政治の大きな争いの中に生きていました。",
"アンジェロはチェーザレのそばで、メディチ家、ローヴェレ家など、ヨーロッパを動かす人々の争いを見ていきます。チェーザレは「古いしくみを壊さなければ、新しい国はつくれない」と考え、自分の力で世界を変えようとします。",
"やがて教皇が亡くなり、次の教皇を決める選挙が始まります。そしてチェーザレの父ロドリーゴが教皇アレクサンデル6世となります。若者だったチェーザレが、歴史を大きく動かす政治家へ進み始めるところまでを描いた物語です。"
]},
{ cat:"m_history", title:"アド・アストラ ―スキピオとハンニバル―", spine:"アド・アストラ|―スキピオと|ハンニバル―", yomi:"アドアストラ スキピオとハンニバル", sub:"カガノミハチ", author:"カガノミハチ", authorYomi:"かがのみはち", icon:"🐘", text:[
"むかし、地中海をめぐってローマとカルタゴという二つの大国が戦いました。カルタゴには、ハンニバルという天才的な将軍がいました。",
"ハンニバルは大軍と象を連れ、だれも通れないと思われていたアルプス山脈をこえ、ローマへ攻めこみます。トレビア、トラシメヌス湖、そしてカンナエ。ローマ軍は何度もハンニバルに負け、国そのものがなくなりそうになります。",
"そのローマに、スキピオという若者が現れます。はじめはまだ経験の少ない青年でしたが、ハンニバルの戦い方を学びながら成長し、スペインにあるカルタゴの基地を次々と奪っていきます。",
"やがてスキピオは、逆にカルタゴのあるアフリカへ攻めこみます。ついにザマの戦いで二人の天才が正面からぶつかり、スキピオが勝利しました。ローマ最大の敵ハンニバルと、そのハンニバルから学んで彼を倒したスキピオ。二人の人生が、ひとつの大きな戦争を通して交差していく物語です。"
]},
{ cat:"m_history", title:"ヒストリエ", sub:"岩明均", author:"岩明均", authorYomi:"いわあきひとし", icon:"📜", text:[
"古代ギリシアの町カルディアで、エウメネスという頭のよい少年が育っていました。本を読むのが大好きで、物事をよく見て、「どうすればうまくいくか」を考えるのが得意な少年でした。",
"ところがある事件から、自分が本当は名家の子ではなく、別の民族の血を引いていることを知ります。それまでの家も身分も失い、エウメネスは一人で世界を旅することになりました。",
"旅の中でさまざまな人々と出会い、戦争や奴隷制度を目にしながら、知恵を使って危機を切り抜けます。そして哲学者アリストテレスと出会い、やがてマケドニア王フィリッポス2世のもとで働くようになります。",
"そのマケドニアには、のちに「アレクサンドロス大王」と呼ばれる少年もいました。エウメネスは将来、その大王を支える書記官・将軍となる人物です。天才の少年が、歴史の中心へ近づいていく物語は、まだ完結していません。"
]},
{ cat:"m_history", title:"イノサン", sub:"坂本眞一", author:"坂本眞一", authorYomi:"さかもとしんいち", icon:"🕊️", text:[
"むかし、フランスには「死刑を行うこと」を仕事にしている一族がいました。サンソン家です。",
"シャルル＝アンリ・サンソンは、本当は人を傷つけることがきらいな、やさしい青年でした。しかし家に生まれたというだけで、死刑執行人の仕事を受けつがなくてはなりません。",
"はじめは逃げようとしますが、家族を守るため、シャルルは少しずつ仕事を受け入れていきます。その一方、妹のマリー＝ジョセフは、兄とは反対に、とても強い心で処刑人の世界へ入っていきました。",
"豪華な宮殿では王や貴族が暮らし、そのすぐそばでは貧しい人々が苦しんでいます。シャルルたちが処刑台に立つたび、フランス社会のゆがみも大きくなっていきます。そして時代は、やがてフランス革命へ向かいます。『イノサン』本編の先の物語は、『イノサン Rouge』へ続きます。"
]},
{ cat:"m_history", title:"薔薇王の葬列", yomi:"ばらおうのそうれつ", sub:"菅野文", author:"菅野文", authorYomi:"かんのあや", icon:"🥀", text:[
"むかし、イングランドでは、白い薔薇のヨーク家と赤い薔薇のランカスター家が王さまの座をめぐって争っていました。これを「薔薇戦争」といいます。",
"ヨーク家の少年リチャードは、男性とも女性とも簡単には言い切れない体に生まれ、そのことを深く悩んでいました。父をとても慕っていましたが、戦争でその父を失い、リチャードの心には大きな傷が残ります。",
"そんなリチャードが、正体を知らないまま心を通わせた相手が、敵であるランカスター家の王ヘンリー6世でした。しかし二人の思いは戦争によって引き裂かれます。兄エドワードが王となり、もう一人の兄ジョージも争いに巻きこまれ、リチャードはだんだん王位へ近づいていきます。",
"やがてリチャードはリチャード3世として王になります。しかし王になれば幸せになれるわけではありません。愛した人や家族を次々と失い、最後はボズワースの戦いで命を落とします。王冠を求めた人々が、愛するものを失っていく悲しい物語です。"
]},
{ cat:"m_art", title:"アルテ", sub:"大久保圭", author:"大久保圭", authorYomi:"おおくぼけい", icon:"🎨", text:[
"16世紀のフィレンツェに、アルテという貴族の娘がいました。アルテは絵を描くことが大好きで、「私は画家になりたい」と夢見ていました。",
"ところが当時、画家はほとんど男の仕事でした。母親からは「女の子は結婚することを考えなさい」と言われます。それでもアルテは家を出て、何軒もの工房を回り、「弟子にしてください」と頭を下げます。",
"ようやくレオという画家が、アルテを弟子にしてくれました。重い荷物を運び、絵の具をつくり、何度失敗しても、アルテはあきらめません。少しずつ仕事をもらえるようになり、やがてヴェネツィアへ行って大きな仕事にも挑戦します。",
"「女だからできない」と言われるたびに、「やってみなければわからない」と前へ進むアルテ。恋をしたり、友だちをつくったりしながら、一人の職人、一人の画家として自分の人生をつくっていく物語です。"
]},
{ cat:"m_history", title:"天上の虹", yomi:"てんじょうのにじ", sub:"里中満智子", author:"里中満智子", authorYomi:"さとなかまちこ", icon:"🌈", text:[
"飛鳥時代に、鸕野讚良――のちの持統天皇となる少女がいました。",
"讚良は大海人皇子の妻となります。しかし皇族の世界では、家族であっても王位をめぐって争わなければなりません。父の中大兄皇子は天智天皇となり、その死後、大海人皇子と大友皇子のあいだで壬申の乱が起こります。",
"大海人皇子は勝利して天武天皇となり、讚良は夫とともに新しい国づくりを進めました。しかし愛する息子・草壁皇子を若くして失います。讚良は悲しみながらも、「この子の血を次の天皇へつなげたい」と考えます。",
"やがて讚良自身が持統天皇となり、国を治めます。そして孫の軽皇子を文武天皇として即位させ、自分が長いあいだ守ってきたものを次の世代へ渡します。妻、母、そして天皇として生きた一人の女性の長い生涯を描いた物語です。"
]},
{ cat:"m_fantasy", title:"夢の碑", yomi:"ゆめのいしぶみ", sub:"木原敏江", author:"木原敏江", authorYomi:"きはらとしえ", icon:"👹", text:[
"『夢の碑』は、一人の主人公が最初から最後まで旅をする物語ではありません。いろいろな時代、いろいろな国を舞台にした、たくさんの不思議なお話を集めたシリーズです。",
"この世界には昔、「鬼」と呼ばれる不思議な力を持つ者たちがいました。鬼たちは人間と出会い、ときには恋をし、ときには争い、そして人間の歴史の中へ消えていきます。",
"たとえば『とりかえばや異聞』では、京の遊女・紫子が武将の身代わりとなり、鬼の血を引く風吹と出会います。『青頭巾』では平安末期、『雪紅皇子』では南北朝、『渕となりぬ』では室町時代と、舞台はどんどん変わります。",
"時代も人物も違いますが、どのお話にも、「愛しているのに一緒にはいられない」「人ではないものと人間はわかり合えるのか」という、少し悲しくて美しい気持ちが流れています。昔話や伝説を集めた、大きな幻想絵巻のような作品です。"
]},
{ cat:"m_history", title:"天智と天武―新説・日本書紀―", spine:"天智と天武|―新説・日本書紀―", yomi:"てんじとてんむ しんせつにほんしょき", sub:"原作：園村昌弘　漫画：中村真理子", author:"園村昌弘／中村真理子", authorYomi:"そのむらまさひろ", icon:"📜", text:[
"飛鳥時代、中大兄皇子は蘇我入鹿を殺し、政治を大きく変えます。普通の歴史では、これが「大化の改新」の始まりとして知られています。",
"ところがこの漫画では、まったく違う秘密が隠されていました。大海人皇子――のちの天武天皇は、じつは蘇我入鹿の息子だった、という設定なのです。つまり大海人にとって、中大兄皇子は兄であると同時に、父を殺した男でもありました。",
"中大兄は天智天皇となり、大海人との間には、愛情と憎しみの入りまじった長い争いが続きます。そして天智の死後、大海人は壬申の乱を起こして勝利し、天武天皇になります。",
"さらに物語では「蘇我入鹿こそ、のちに聖徳太子として伝えられた人物だったのではないか」という大胆な秘密まで描かれます。歴史書『日本書紀』に書かれた歴史そのものを、「勝った側が書きかえた物語かもしれない」と見直していく歴史ミステリーです。"
]},
{ cat:"m_history", title:"逃げ上手の若君", yomi:"にげじょうずのわかぎみ", sub:"松井優征", author:"松井優征", authorYomi:"まついゆうせい", icon:"🏃", text:[
"鎌倉時代の終わり、北条時行という少年がいました。時行は戦うことよりも、逃げたり、隠れたりすることがとても上手な子でした。",
"ところが足利尊氏の裏切りによって鎌倉幕府は滅び、時行は家族も家も失ってしまいます。そこへ諏訪頼重という不思議な神官が現れ、「あなたは逃げることで英雄になる」と言いました。時行は諏訪へ逃げ、雫、弧次郎、亜也子、玄蕃たち仲間と出会います。",
"時行は成長すると軍を起こし、「中先代の乱」で一度は鎌倉を取り戻します。しかし尊氏はあまりにも強く、時行はまた逃げることになります。その後も南朝側として何度も戦い、長い年月をかけて尊氏へ挑み続けました。",
"最後には時行は捕らえられ、自分の命と引きかえに家族や仲間を守る道を選びます。それでも処刑される直前まで得意の「逃げ」を見せ、最後は「あー楽しかった！」と自分の人生を受け入れて息を引き取ります。「逃げることは負けではない。生きるための力なんだ」と最後まで描ききった物語です。2026年2月に本編が完結し、最終27巻は2026年10月2日発売です。"
]},
{ cat:"m_history", title:"ゴールデンカムイ", sub:"野田サトル", author:"野田サトル", authorYomi:"のださとる", icon:"🐻", text:[
"日露戦争から帰ってきた杉元佐一は、「不死身の杉元」と呼ばれるほど強い兵士でした。杉元には、お金が必要でした。亡くなった親友との約束を守り、その妻を助けたかったからです。",
"そんな杉元は北海道で、「アイヌが隠した大量の金塊」の話を聞きます。金塊の場所は、網走監獄から逃げた囚人たちの体に彫られた入れ墨を全部集めるとわかるようになっていました。",
"杉元はアイヌの少女アシㇼパと出会い、いっしょに金塊を探します。しかし同じ金塊を、土方歳三たちや陸軍第七師団の鶴見中尉もねらっていました。北海道から樺太まで、三つの勢力が追いかけ合う大冒険になります。",
"やがてアシㇼパの父と金塊の秘密も明らかになります。最後は函館で激しい戦いとなり、多くの者が命を落とします。それでも杉元とアシㇼパは生き残ります。二人にとって本当に大切だったのは金そのものではなく、自分たちが大切にする人や土地を守ることだったのです。"
]},
{ cat:"m_history", title:"シュトヘル", sub:"伊藤悠", author:"伊藤悠", authorYomi:"いとうゆう", icon:"✍️", text:[
"13世紀、モンゴル帝国がものすごい勢いで国々を滅ぼしていたころのお話です。",
"現代の高校生・須藤は、なぜか遠い昔の世界へ飛ばされ、モンゴル兵から「悪霊」と恐れられている女戦士シュトヘルの体に入ってしまいます。シュトヘルは、仲間をモンゴル軍に殺され、復讐だけを考えて生きていました。",
"しかしシュトヘルは、西夏という国の少年ユルールと出会います。ユルールが守ろうとしていたのは金銀ではありません。「西夏文字」という、自分たちの国の文字でした。国が滅びても文字が残れば、その国で生きた人たちの心も未来へ残せるからです。",
"シュトヘルも、ただ敵を殺すためではなく、ユルールと文字を守るために戦うようになります。モンゴルの大軍に追われながら、二人は命をかけて西夏の言葉を未来へ届けようとします。「人は死んでも、言葉は残せる」という願いを描いた物語です。"
]},
{ cat:"m_history", title:"狼の口 ヴォルフスムント", spine:"狼の口|ヴォルフスムント", yomi:"おおかみのくち ヴォルフスムント", sub:"久慈光久", author:"久慈光久", authorYomi:"くじみつひさ", icon:"🏔️", text:[
"むかし、いまのスイスにあたる山の国々は、ハプスブルク家という大きな支配者に苦しめられていました。",
"山を越える大切な道には、「狼の口」と呼ばれる恐ろしい関所がありました。そこを守る代官ヴォルフラムは、とても頭がよく、隠れて通ろうとする人を次々と見つけ出して処刑します。",
"自由を求める人々は、何度も関所を越えようとします。しかし失敗する者も多く、大切な仲間が次々と命を落とします。それでも人々はあきらめませんでした。",
"やがてヴィルヘルム・テルの息子ヴァルターたちが立ち上がり、大勢の仲間と「狼の口」を攻めます。たくさんの犠牲を出しながら、ついに砦は落ち、ヴォルフラムも倒されます。そして人々はハプスブルク軍との戦いへ進み、自分たちの土地を自分たちで守る道をひらいていくのです。"
]},
{ cat:"m_history", title:"孔明のヨメ。", yomi:"こうめいのヨメ", sub:"杜康潤", author:"杜康潤", authorYomi:"とうこうじゅん", icon:"💍", text:[
"むかし中国に、黄月英という、とても頭のよい女性がいました。機械を考えたり、新しい道具を作ったりすることが大好きでした。",
"そんな月英のお父さんが連れてきた結婚相手が、諸葛孔明という青年です。のちに「三国志でいちばん有名な軍師」と呼ばれる孔明ですが、このころはまだ田舎で本を読みながら暮らす、少し変わった若者でした。",
"最初はとまどう月英でしたが、二人は話してみると、とても気が合います。結婚した二人は、畑仕事をしたり、発明をしたり、友人たちと話したりしながら暮らします。",
"やがて劉備が孔明を訪ね、孔明は軍師として歴史の表舞台へ出ることになります。月英もただ家で待っているだけではなく、自分の知識を使って夫や仲間たちを助けます。そして物語は赤壁の戦いへ。三国志を「天才軍師と、その天才に負けない奥さん」の目から描いた、やさしく楽しい歴史漫画です。"
]},
{ cat:"m_history", title:"天幕のジャードゥーガル", spine:"天幕の|ジャードゥーガル", yomi:"てんまくのジャードゥーガル", sub:"トマトスープ", author:"トマトスープ", authorYomi:"とまとすーぷ", icon:"🏕️", text:[
"13世紀、モンゴル帝国が世界中へ広がっていたころ、イランにシタラという賢い少女がいました。のちにファーティマと呼ばれる少女です。",
"シタラの国はモンゴル軍に攻められ、大切な人も暮らしていた場所も失われます。そして捕虜となった彼女は、モンゴル皇帝の後宮で働くことになりました。",
"けれどもシタラには武器の代わりに「知識」がありました。薬、医学、数学、読み書き。彼女はその知識を使い、皇帝オゴタイの妃ドレゲネへ近づきます。ドレゲネもまたモンゴル帝国に複雑な思いを持っていました。二人は手を組み、「この大帝国を中から変えてやろう」と考えます。",
"戦場で剣を振るうのではなく、人と人を争わせ、情報を集め、皇帝の後継者をめぐる政治を動かしていきます。小さな女官だった少女が、知恵だけを武器に世界最大の帝国へ挑んでいく物語です。2026年現在も物語は続いています。"
]},
{ cat:"m_history", title:"プリニウス", sub:"ヤマザキマリ・とり・みき", author:"ヤマザキマリ／とり・みき", authorYomi:"やまざきまり", icon:"🌋", text:[
"古代ローマに、プリニウスという、とても好奇心の強いおじさんがいました。",
"雷を見れば「どうして光るんだろう」、動物を見れば「どんな暮らしをするんだろう」、火山を見れば「中では何が起きているんだろう」と、なんでも調べずにはいられません。",
"書記のエウクレスたちといっしょにローマ帝国中を旅しながら、植物、動物、星、鉱物、人間の暮らしまで、あらゆることを書き集めます。その一方、ローマでは皇帝ネロがだんだん暴君となり、国中が混乱していきます。",
"ネロの時代が終わっても、プリニウスは調べることをやめません。そして西暦79年、ヴェスヴィオ火山が大噴火します。多くの人が逃げる中、プリニウスは「何が起きているのか知りたい。そして人も助けたい」と船で火山へ近づきます。そこで彼は生涯を終えますが、集めた知識は大著『博物誌』として、二千年近く後の私たちまで残るのです。"
]},
{ cat:"m_history", title:"オルフェウスの窓", yomi:"オルフェウスのまど", sub:"池田理代子", author:"池田理代子", authorYomi:"いけだりよこ", icon:"🎻", text:[
"ドイツの古い音楽学校に、「オルフェウスの窓」と呼ばれる窓がありました。その窓から一人の女性を見た男性は、その女性と恋に落ちるけれど、最後には悲しい運命になる――そんな伝説がありました。",
"学校へ通うユリウスは、じつは女性でした。しかし家の財産を受けつぐため、男性として育てられていました。そこでピアニストを目指すイザークや、不思議な青年クラウスと出会います。",
"クラウスの本当の名前はアレクセイ。ロシアから来た革命家でした。ユリウスはアレクセイを愛し、彼を追ってロシアへ向かいます。しかしそこでは革命が始まり、恋も音楽も、政治の大きな波にのみこまれていきます。",
"アレクセイは革命の中で命を落とし、ユリウスの人生も大きく壊れてしまいます。一方イザークも音楽家として成功と挫折を経験します。窓の伝説のように、愛し合った人々が時代によって引き離されていく、長く悲しい物語です。"
]},
{ cat:"m_history", title:"虹色のトロツキー", yomi:"にじいろのトロツキー", sub:"安彦良和", author:"安彦良和", authorYomi:"やすひこよしかず", icon:"🐎", text:[
"1930年代、日本が満州国をつくっていたころ、ウムボルトという青年がいました。日本人の父とモンゴル人の母を持つ青年です。",
"ウムボルトは子どものころの記憶を失っており、「自分は何者なのか」を知りたいと思っていました。そんな彼を、日本の関東軍はある計画へ利用しようとします。",
"その計画とは、ロシア革命の指導者だったトロツキーを満州へ呼び寄せようというものでした。ウムボルトは石原莞爾や辻政信など、日本軍の人々と出会う一方、中国人、モンゴル人、ロシア人など、満州で暮らすさまざまな人々とも出会います。",
"やがて自分の家族の過去や、日本軍が考えていることを知っていきます。国と国の争いの中で、「日本人なのか、モンゴル人なのか」ではなく、「自分は自分としてどう生きるのか」を探していきます。そして時代はノモンハン事件へ向かい、満州という国の夢も少しずつ崩れていくのです。"
]},
{ cat:"m_history", title:"ペリリュー―楽園のゲルニカ―", spine:"ペリリュー|―楽園のゲルニカ―", yomi:"ペリリュー らくえんのゲルニカ", sub:"作者：武田一義　原案協力：平塚柾緒", author:"武田一義／平塚柾緒", authorYomi:"たけだかずよし", icon:"🏝️", text:[
"太平洋戦争の終わりごろ、田丸という若い日本兵が、南の小さな島ペリリューにいました。田丸の夢は、ほんとうは漫画家になることでした。",
"しかし軍隊で田丸に与えられた仕事は、死んだ仲間が「どんなに立派に戦って死んだか」を家族へ手紙で知らせる「功績係」でした。",
"やがてアメリカ軍が島へ攻めてきます。日本軍はおよそ一万人、アメリカ軍はその何倍もの兵力でした。美しい海と森の島は、一日中、爆弾と銃声の響く場所へ変わってしまいます。",
"田丸は仲間が一人ずつ死んでいくのを見ながら、それでも手紙を書き続けます。戦いが終わっても、島の奥には「まだ戦争は続いている」と思って隠れ続ける兵士たちがいました。ようやく本当に戦争が終わったと知り、生き残った者たちは武器を置きます。かわいらしい絵で描かれていますが、「戦争の中で普通の若者が何を見たのか」を、とても静かに描いた作品です。"
]},
{ cat:"m_history", title:"総員玉砕せよ！", yomi:"そういんぎょくさいせよ", sub:"水木しげる", author:"水木しげる", authorYomi:"みずきしげる", icon:"🪖", text:[
"太平洋戦争のころ、南の島ニューブリテンに、日本の兵隊たちが送られました。",
"兵士たちは食べものも薬も十分にない中、病気や空襲に苦しみます。それでも上の人からは、「命を惜しまず戦え」と命じられます。",
"そしてある日、「全員で敵へ突撃し、玉砕せよ」という命令が出ます。玉砕とは、ほとんど生きて帰れない攻撃のことです。兵士たちは突撃しますが、わずかに生き残った者がいました。",
"ところが上官は、「この部隊は全滅したことになっている。生き残りがいては困る」と考えます。そして助かった兵士たちまで、もう一度死ぬための戦いへ向かわされます。作者の水木しげる自身の戦争体験をもとに、「戦争の中では、人の命がどれほど簡単に扱われてしまうのか」を描いた、とても重い物語です。"
]},
{ cat:"m_history", title:"この世界の片隅に", yomi:"このせかいのかたすみに", sub:"こうの史代", author:"こうの史代", authorYomi:"こうのふみよ", icon:"🖍️", text:[
"広島で育った浦野すずは、絵を描くことが好きな、少しおっとりした女の子でした。",
"大人になったすずは、呉に住む北條周作と結婚します。知らない家へお嫁に行き、最初は失敗ばかり。それでも少ない食べものを工夫して料理したり、服を直したりしながら、新しい家族と暮らしていきます。",
"しかし戦争が激しくなり、軍港のある呉には何度も爆弾が落とされます。ある空襲で、すずは大切な姪の晴美を失い、自分も右手を失ってしまいます。絵を描いてきた右手でした。",
"そして1945年8月6日、広島に原子爆弾が落ちます。すずの故郷も家族も大きな被害を受けます。それでも戦争が終わると、すずと周作は生きていくことを選びます。焼け野原の広島で出会った孤児の少女を家族に迎え、「この世界の片隅」で、また毎日の暮らしを始めるのです。"
]},
{ cat:"m_history", title:"夕凪の街 桜の国", spine:"夕凪の街|桜の国", yomi:"ゆうなぎのまち さくらのくに", sub:"こうの史代", author:"こうの史代", authorYomi:"こうのふみよ", icon:"🌸", text:[
"原子爆弾が落とされてから十年ほどたった広島に、平野皆実という若い女性が暮らしていました。",
"町は少しずつ元に戻っていましたが、皆実の心には「あの日、自分だけが生き残ってしまった」という思いが残っていました。それでも仕事をし、人を好きになり、ようやく新しい人生へ進もうとします。",
"ところが原爆の影響は、十年たっても終わっていませんでした。皆実は病気になり、若くして亡くなります。",
"物語はそこから何十年も後の「桜の国」へ移ります。次の世代の家族が、昔の広島で何があったのかを少しずつ知っていきます。原爆を体験していない子や孫の世代にも、その記憶は家族を通してつながっていました。「昔のこと」になったように見える出来事が、今を生きる人の中にも残っていることを描いた物語です。"
]},
{ cat:"m_history", title:"はだしのゲン", sub:"中沢啓治", author:"中沢啓治", authorYomi:"なかざわけいじ", icon:"🌾", text:[
"1945年、広島に中岡元――みんなからゲンと呼ばれる少年が住んでいました。",
"ゲンのお父さんは戦争に反対していたため、家族はまわりの人から冷たくされることもありました。それでも家族は、苦しい暮らしの中で助け合っていました。",
"8月6日の朝、広島に原子爆弾が落とされます。町は一瞬で焼け、ゲンは父、姉、弟を失います。妊娠していた母は生き残り、焼け野原の中で赤ちゃんを産みます。",
"ゲンは食べものを探し、孤児になった隆太たちと助け合いながら生きます。しかし原爆による病気は、その後も大勢の人を苦しめます。妹のようにかわいがった子ども、大切な友だち、そして母までも失います。",
"それでもゲンは「麦のように生きろ」という父の言葉を忘れません。踏まれても踏まれても芽を出す麦のように生きようとします。最後には絵を学ぶため、広島を離れて東京へ向かいます。"
]},
{ cat:"m_history", title:"満州アヘンスクワッド", spine:"満州|アヘンスクワッド", yomi:"まんしゅうアヘンスクワッド", sub:"原作：門馬司　漫画：鹿子", author:"門馬司／鹿子", authorYomi:"もんまつかさ", icon:"🌺", text:[
"昭和12年、日本が満州を支配していたころ、日方勇という青年がいました。",
"勇は兵士として戦場へ行きますが、右目の視力を失い、農場で働くことになります。そんな中、母が重い病気になります。薬を買うには、とても大きなお金が必要でした。",
"勇は畑で、アヘンの原料になるケシを見つけます。そして家族を助けるため、危険だと知りながらアヘンをつくってしまいます。そこで出会ったのが、中国の裏社会をよく知る麗華という女性でした。二人は力を合わせ、「真阿片」と呼ばれる質の高いアヘンを売り始めます。",
"しかし商売が大きくなるほど、中国の秘密結社、ロシア人組織、日本の関東軍など、恐ろしい相手が近づいてきます。勇は家族を守るために始めたはずなのに、いつしか満州全体をめぐる大きな争いの中心へ入っていきます。2026年現在も連載中で、勇たちは関東軍との正面対決へ進んでいます。"
]},
{ cat:"m_history", title:"劇画ヒットラー", yomi:"げきがヒットラー", sub:"水木しげる", author:"水木しげる", authorYomi:"みずきしげる", icon:"🦅", text:[
"オーストリアに、アドルフ・ヒトラーという青年がいました。若いころは画家になりたがっていましたが、うまくいかず、貧しい暮らしをしていました。",
"第一次世界大戦が始まると兵士になります。戦争が終わり、ドイツが負けると、国の中には怒りや不満を持つ人がたくさんいました。ヒトラーは人前で話す力を使い、少しずつ支持を集めていきます。",
"やがてナチ党の指導者となり、ついにはドイツの独裁者になります。そしてユダヤ人をはじめ多くの人々を迫害し、ヨーロッパ中を巻きこむ第二次世界大戦を始めます。",
"最初は勝ち続けたドイツ軍も、やがて負け始めます。ソ連軍がベルリンへ迫る中、地下壕にこもったヒトラーは自ら命を絶ちます。一人の人間がどのように大きな権力を手にし、国と世界を大きな戦争へ引っぱっていったのかを、淡々と追っていく伝記漫画です。"
]},
{ cat:"m_history", title:"戦争は女の顔をしていない", spine:"戦争は女の顔を|していない", yomi:"せんそうはおんなのかおをしていない", sub:"原作：スヴェトラーナ・アレクシエーヴィチ　漫画：小梅けいと", author:"スヴェトラーナ・アレクシエーヴィチ／小梅けいと", authorYomi:"あれくしえーゔぃち", icon:"🎖️", text:[
"第二次世界大戦では、ソ連のたくさんの女性たちも戦場へ行きました。",
"ある女性は看護師になり、ある女性は狙撃兵になり、またある女性は戦車や飛行機に乗りました。まだ十代だった少女もいました。「国を守りたい」と、自分から軍へ入った人もいます。",
"けれども戦場へ行ってみると、そこにあったのは英雄物語だけではありません。血、寒さ、空腹、大切な仲間の死。そして自分が敵を殺した記憶。戦争が終わって家へ帰っても、その記憶は消えませんでした。",
"この作品には一人の主人公はいません。実際に戦争を体験した女性たちが、「私はこんなことを見た」「私はこんな気持ちだった」と、自分の言葉で語ります。教科書の「何年にどこで戦った」という歴史では見えにくい、一人ひとりの小さな戦争の記憶を集めた物語です。"
]},
{ cat:"m_history", title:"ニュクスの角灯", yomi:"ニュクスのランタン", sub:"高浜寛", author:"高浜寛", authorYomi:"たかはまかん", icon:"🏮", text:[
"明治11年の長崎に、美世という少女がいました。西南戦争で親を亡くし、一人になった美世は、「蛮」という道具屋で働くことになります。",
"店には、パリから届いたドレス、ミシン、双眼鏡、ランプなど、美世が見たこともない西洋の品物がいっぱいありました。店主の小浦百年は、外国の血を引く、不思議な雰囲気の男性でした。",
"美世には、物に触れると、その物がこれまで見てきた過去や、これから向かう未来が見える不思議な力があります。その力を使いながら、お客さんや道具に隠された物語を知っていきます。",
"そして美世は、百年自身にも長い過去があることを知ります。長崎とパリ、西洋と日本、昔の時代と新しい明治。いろいろな世界が一つの店でつながっていきます。知らない世界をこわがっていた少女が、自分から新しい世界を見に行こうと思えるようになるまでの成長の物語です。"
]},
{ cat:"m_history", title:"コミック昭和史", yomi:"コミックしょうわし", sub:"水木しげる", author:"水木しげる", authorYomi:"みずきしげる", icon:"📰", text:[
"昭和という時代は、1926年に始まりました。この漫画は、その昭和の出来事と、水木しげる自身の人生をいっしょにたどっていきます。",
"子どものころの水木少年は、妖怪の話が大好きな、のんびりした少年でした。しかし日本はだんだん軍国主義へ進み、中国との戦争、そして太平洋戦争が始まります。",
"水木自身も兵隊となり、南の島へ送られます。そこで仲間をたくさん失い、自分も爆撃で左腕を失います。それでも生きて日本へ帰ってきました。",
"戦争が終わると、今度は貧しい暮らしの中で漫画を描き始めます。やがて『ゲゲゲの鬼太郎』などで有名になります。その間にも日本では高度経済成長、学生運動、バブル景気など、いろいろな出来事が起きました。",
"大きな歴史の横に「そのころ普通の人はどう暮らしていたのか」を並べ、昭和という長い時代を一人の人間の目から見せてくれる作品です。"
]},
{ cat:"m_history", title:"天の血脈", yomi:"てんのけつみゃく", sub:"安彦良和", author:"安彦良和", authorYomi:"やすひこよしかず", icon:"🪨", text:[
"1903年、日露戦争が始まる少し前のお話です。一高の学生・安積亮は、学者たちといっしょに満洲へやってきました。",
"一行が調べていたのは「好太王碑」という、とても古い石碑です。そこには昔の朝鮮半島と日本との関係を考える手がかりが刻まれていました。しかし調査の途中、一行は馬賊に襲われます。",
"安積は冒険に巻きこまれながら、日本人、中国人、朝鮮人、ロシア人など、さまざまな人々と出会います。そして「歴史を調べること」が、ときには国の都合のよい物語をつくるために利用されることも知っていきます。",
"やがて日露戦争が始まり、日本は朝鮮半島や満洲へますます深く関わっていきます。安積は、「日本という国はどこから来て、これからどこへ行こうとしているのか」と考え続けます。古代の石碑を調べる若者の旅が、そのまま近代日本という国を問い直す大きな物語になっていくのです。"
]},
{ cat:"m_history", title:"レッド", sub:"山本直樹", author:"山本直樹", authorYomi:"やまもとなおき", icon:"🚩", text:[
"1960年代の終わり、日本では「今の社会を変えたい」と考える若者たちがたくさんいました。",
"この物語に出てくる若者たちも、最初は普通の学生です。「もっと平等で正しい社会をつくろう」と考え、デモや政治運動へ参加します。けれども少しずつ考え方が激しくなり、武器を持ち、警察から追われるようになります。",
"山の中へ逃げた仲間たちは、「革命家として弱いところを直さなければならない」と、おたがいを厳しく責め始めます。それがだんだん暴力へ変わり、昨日まで仲間だった人を殴り、ついには死なせてしまいます。それでも集団の中では、「これは正しいことなのだ」と誰も止められなくなっていきます。",
"警察の捜査が迫ると、生き残った者たちはさらに逃げます。そして最後に残った五人が、1972年2月、軽井沢のあさま山荘へ立てこもり、人質を取ります。十日間の攻防の末、警察に逮捕され、長い事件は終わります。",
"「悪い人たちが悪い事件を起こした」と簡単に片づけるのではなく、普通の若者たちが、どうして少しずつ引き返せないところまで進んでしまったのかを、静かに追っていく物語です。"
]},
{ cat:"m_drama", title:"賭博黙示録カイジ", spine:"賭博黙示録|カイジ", yomi:"とばくもくしろくカイジ", sub:"福本伸行", author:"福本伸行", authorYomi:"ふくもとのぶゆき", icon:"🎲", text:[
"伊藤開司、通称カイジは、仕事もせず、毎日をなんとなく過ごしている若者でした。ところがある日、昔の知り合いの借金の保証人になっていたせいで、とんでもない大金を返さなければならなくなります。",
"「借金を一気に返せるゲームがある」。そう言われたカイジは、船エスポワールに乗ります。そこで始まったのは、ただのじゃんけんではありません。負ければさらに大きな借金を背負う「限定じゃんけん」でした。カイジはだまされたり、仲間に裏切られたりしながらも、必死に頭を使って生き残ります。",
"その後も、高い建物のあいだにかけられた細い鉄骨を渡ったり、大金持ちの兵藤和尊や、その部下の利根川と命がけのゲームをしたりします。カイジは何度も勝ちそうになりますが、欲を出したせいでまた負けてしまうこともあります。",
"カイジは天才というより、追いつめられたときにものすごい力を出す人です。「もうだめだ」と思ってから、相手のしかけを見破り、最後の最後まであきらめない。そんな男の、借金と勝負の物語です。"
]},
{ cat:"m_drama", title:"アカギ", sub:"福本伸行", author:"福本伸行", authorYomi:"ふくもとのぶゆき", icon:"🀄", text:[
"ある雨の夜、麻雀をしている男たちの部屋へ、一人の少年が入ってきました。少年の名前は赤木しげる、十三歳。麻雀のルールさえよく知らないはずなのに、不思議なほど落ち着いていました。",
"赤木はほんの少しルールを教えてもらっただけで、相手の考えを読み、次々と勝っていきます。それどころか、負ければ命まで危なくなるような勝負でも、まったくこわがりません。",
"やがて赤木は、裏社会のすご腕たちから「あの少年は普通ではない」と知られるようになります。そして最後には、鷲巣巌という大金持ちの老人と戦います。二人がするのは、負けるたびに自分の血まで抜かれていく「鷲巣麻雀」でした。",
"鷲巣は赤木を殺そうとしますが、赤木は最後まで恐怖に負けません。長い長い勝負の末、鷲巣は力尽き、赤木は生き残ります。そしてまた、どこかへふらりと姿を消します。赤木しげるという伝説の博打打ちが、若いころどんな男だったのかを描いた物語です。"
]},
{ cat:"m_drama", title:"天 天和通りの快男児", spine:"天|天和通りの快男児", yomi:"てん てんほうどおりのかいだんじ", sub:"福本伸行", author:"福本伸行", authorYomi:"ふくもとのぶゆき", icon:"🀄", text:[
"井川ひろゆきは、麻雀がとても得意な若者でした。そんな彼が出会ったのが、天貴史という少し変わった男です。",
"天はずるそうに見えることもありますが、仲間をとても大切にする男でした。そして二人は、裏社会の大きな麻雀勝負へ参加することになります。",
"そこには原田という強敵や、たくさんのすご腕が集まっていました。そして途中から現れるのが、かつて「伝説」と呼ばれた赤木しげるです。若かった『アカギ』の赤木も、このころには年を重ねた老人になっていました。",
"大きな勝負が終わったあと、物語は赤木の人生の最後へ向かいます。病気によって自分自身がわからなくなる前に、赤木は自分で人生を終える道を選びます。天やひろゆきたちは何とか止めようとしますが、最後には赤木の生き方を受け入れます。",
"最初は麻雀勝負のお話だった物語が、最後には「どう生きて、どう人生を終えるのか」という、とても大きな問いへ変わっていく作品です。"
]},
{ cat:"m_drama", title:"銀と金", yomi:"ぎんときん", sub:"福本伸行", author:"福本伸行", authorYomi:"ふくもとのぶゆき", icon:"💰", text:[
"森田鉄雄は、お金も仕事もない若者でした。競馬場で負けてばかりいたある日、平井銀二という不思議な男に声をかけられます。",
"銀二は、政治家や会社の社長、裏社会の人間たちを相手に、とてつもない金額を動かす男でした。森田は銀二の仲間になり、「世の中では、お金と権力がどう動いているのか」を学んでいきます。",
"株の売買、企業の乗っ取り、殺人鬼との危険な勝負、何百億円もの金をめぐるギャンブル。森田は何度も命を危険にさらしながら、少しずつ銀二に近い男へ成長します。",
"しかし森田は、勝てば勝つほど「このまま金だけを追いかけていていいのだろうか」と考えるようになります。そしてあるところで銀二のもとを離れる決心をします。",
"銀二がめざしていたさらに大きな戦いは、完全には描かれないまま物語は終わります。それでも、普通の青年だった森田が、巨大なお金の世界を見て、自分の生き方を選ぶまでが描かれています。"
]},
{ cat:"m_drama", title:"賭博覇王伝 零", spine:"賭博覇王伝|零", yomi:"とばくはおうでん ゼロ", sub:"福本伸行", author:"福本伸行", authorYomi:"ふくもとのぶゆき", icon:"👑", text:[
"宇海零という、とても頭のよい少年がいました。零は仲間と力を合わせ、だまされてお金を失った人たちを助けるようなことをしていました。",
"そんな零のもとへ、在全無量という大金持ちから招待状が届きます。「王を決めるゲームへ参加しないか」。会場には、大金を手に入れようとする人々が集められていました。",
"ところがゲームは、ただのクイズではありません。間違えれば命を落としかねない迷路や、考える力を試されるしかけが次々と登場します。",
"零は、自分だけ助かろうとはしません。「みんなで生きて帰る方法はないか」と考えます。そのため、ときには自分を危険にさらしてまで仲間を助けます。",
"その後、零は財宝を探す新しい勝負にも挑みます。数学、暗号、観察力などを使い、「力ではなく頭で道をひらく」のが零の戦い方です。物語は完全な最終決着までは描かれていませんが、どんな難問でも人を見捨てず答えを探す少年の物語です。"
]},
{ cat:"m_drama", title:"嘘喰い", yomi:"うそぐい", sub:"迫稔雄", author:"迫稔雄", authorYomi:"さことしお", icon:"🃏", text:[
"斑目貘という男は、人から「嘘喰い」と呼ばれていました。",
"貘がするのは、普通のギャンブルではありません。「負けたら人生が終わる」というほど危険な勝負ばかりです。そして、そんな勝負を見守る秘密の組織「賭郎」がありました。",
"貘は迷宮、廃ビル、テレビ番組、無人島など、さまざまな場所で勝負をします。相手はみんな、うそをついたり、しかけを用意したりしています。しかし貘は、そのうその中に隠された小さな矛盾を見つけます。",
"やがて貘の本当の目的が明らかになります。それは賭郎の頂点に立つ「お屋形様」と勝負することでした。そのために貘は、仲間の梶やマルコとともに、いくつもの命がけのゲームを乗りこえていきます。",
"最後にはお屋形様・切間創一との大勝負「屋形越え」に挑みます。貘は勝利しますが、それでも彼の勝負は終わりません。もっと大きな相手へ向かって、また新しい賭けへ進んでいくのです。"
]},
{ cat:"m_drama", title:"LIAR GAME", yomi:"ライアーゲーム", sub:"甲斐谷忍", author:"甲斐谷忍", authorYomi:"かいたにしのぶ", icon:"💴", text:[
"神崎直は、人を疑うことがとても苦手な、正直な女の子でした。",
"ある日、家に大きな箱が届きます。中には一億円と、「LIAR GAMEに参加してください」という手紙が入っていました。",
"ゲームでは、相手のお金をだまし取れば勝ちです。直はすぐにだまされ、一億円を取られてしまいます。困った直が助けを求めたのが、天才詐欺師・秋山深一でした。",
"秋山は、人間の欲や恐怖を読みながら、次々とゲームのしかけを見破ります。しかし直は秋山とは違い、「みんなで助かる方法を探そう」と言います。裏切った人さえ助けようとする直を見て、少しずつ仲間も変わっていきます。",
"強敵・横谷たちとの戦いをへて、ゲームは最後の勝負へ向かいます。LIAR GAMEは、人間がどこまで他人を信じられるかを試す、とても大きな実験のようなものでもありました。",
"「いちばん強いのは、だます人なのか。それとも、最後まで人を信じる人なのか」。直と秋山は、その答えを探し続けるのです。"
]},
{ cat:"m_drama", title:"賭ケグルイ", yomi:"かけぐるい", sub:"原作：河本ほむら　作画：尚村透", author:"河本ほむら／尚村透", authorYomi:"かわもとほむら", icon:"🎴", text:[
"私立百花王学園は、とても変わった学校でした。",
"この学校では、勉強やスポーツよりも「ギャンブルが強いかどうか」が大切にされていました。負けて借金を背負った生徒は、「家畜」と呼ばれてしまいます。",
"そこへ転校してきたのが、蛇喰夢子という女の子です。夢子は一見すると上品でやさしそうですが、ギャンブルが始まると目の色が変わります。",
"夢子が好きなのは、お金を手に入れることではありません。「勝つか負けるかわからない、こわい勝負」そのものが大好きなのです。",
"夢子は早乙女芽亜里や鈴井涼太たちと出会い、生徒会の強いギャンブラーたちへ次々と挑んでいきます。そしてついには、生徒会長・桃喰綺羅莉や、その一族まで巻きこんだ大きな勝負になっていきます。",
"夢子は今日もにっこり笑いながら、「さあ、賭け狂いましょう」と、危険な勝負へ飛びこんでいくのです。"
]},
{ cat:"m_drama", title:"闇金ウシジマくん", spine:"闇金|ウシジマくん", yomi:"やみきんウシジマくん", sub:"真鍋昌平", author:"真鍋昌平", authorYomi:"まなべしょうへい", icon:"🐮", text:[
"丑嶋馨は、「カウカウファイナンス」というお金貸しの社長です。",
"でも、普通の銀行とは違います。ほかではお金を借りられない人へ、とても高い利息でお金を貸す「闇金」でした。",
"丑嶋の店には、ギャンブルをやめられない人、買い物をしすぎる人、見栄のためにお金を使う人など、いろいろな人がやってきます。ほんの少しのお金を借りたはずなのに、借金はどんどん大きくなっていきます。",
"物語では、そんな人たちが「どうしてここまで困ってしまったのか」が一人ずつ描かれます。丑嶋は冷たく見えますが、自分なりの決まりを持っていて、仲間には強い情も見せます。",
"やがて丑嶋自身も、危険なヤクザ・滑皮との争いに巻きこまれます。長い戦いを生き抜いたあと、丑嶋はかつて関わった人間の身内から突然刃物で刺され、道路に倒れます。そこで物語は終わり、その後の生死ははっきりとは描かれません。",
"お金は人を助けることもあります。でも使い方を間違えると、人の人生そのものまで変えてしまう。そんな怖さを描いた作品です。"
]},
{ cat:"m_work", title:"ナニワ金融道", yomi:"ナニワきんゆうどう", sub:"青木雄二", author:"青木雄二", authorYomi:"あおきゆうじ", icon:"🧾", text:[
"灰原達之は、仕事を失って困っている青年でした。",
"何社も就職試験を受けますが、なかなか雇ってもらえません。そんな灰原を拾ってくれたのが、「帝国金融」というお金貸しの会社でした。",
"灰原はそこで、お金を貸す仕事を始めます。ところが、お金を貸すというのは簡単な仕事ではありません。",
"「返せなくなったらどうするのか」「保証人になった人はどうなるのか」「土地や家を担保にするとどうなるのか」。灰原は仕事を通して、お金にまつわる法律や、人間の欲、ずるさ、弱さを知っていきます。",
"最初は何も知らなかった灰原も、だんだん金融の世界を覚えます。それでも、困っている人からすべてを取り上げることに迷うこともあります。",
"大阪の町を舞台に、「お金を借りるとはどういうことなのか」を、とても現実的に教えてくれる物語です。"
]},
{ cat:"m_drama", title:"ミナミの帝王", yomi:"ミナミのていおう", sub:"原作：天王寺大　作画：郷力也", author:"天王寺大／郷力也", authorYomi:"てんのうじだい", icon:"💼", text:[
"大阪のミナミに、萬田銀次郎というお金貸しがいました。",
"銀次郎が貸すお金の利息は、とても高いものでした。そのため人々から恐れられ、「ミナミの鬼」と呼ばれています。",
"けれども銀次郎は、ただ弱い人からお金を取るだけの男ではありません。",
"困っている人をだまして財産を奪おうとする悪い会社や、法律のすき間を使って人を苦しめる者が現れると、銀次郎はお金と法律の知識を使って立ち向かいます。",
"「借りた金は返してもらう」。その決まりにはとても厳しい一方で、本当に苦しんでいる人には助け舟を出すこともあります。",
"毎回さまざまな人がお金の問題を抱えて銀次郎の前へ現れます。法律、商売、借金、保証人などを通して、「世の中にはこんなお金のしくみがあるんだ」と見せてくれる、長く続く金融漫画です。"
]},
{ cat:"m_drama", title:"クロサギ", sub:"原案：夏原武　漫画：黒丸", author:"夏原武／黒丸", authorYomi:"なつはらたけし", icon:"🕶️", text:[
"黒崎という青年には、詐欺師が大きらいな理由がありました。",
"昔、黒崎の父親は詐欺師にだまされ、大切なお金をすべて失いました。そのせいで黒崎の家族は、とても悲しい結末を迎えてしまったのです。",
"そこで黒崎は、「詐欺師だけをだます詐欺師」になります。",
"結婚詐欺、投資詐欺、会社をねらう詐欺。人をだましてお金を奪う者たちへ近づき、相手よりもっと上手なうそをついて、逆にお金を取り返します。",
"黒崎のそばには、法律家を目指す吉川氷柱という女性がいます。氷柱は「たとえ悪い詐欺師を相手にしても、詐欺は犯罪だよ」と黒崎を心配します。",
"黒崎も、本当はずっと復讐だけをして生きたいわけではありません。それでも家族を壊した詐欺の世界の奥へ奥へと進み、自分の過去と決着をつけようとするのです。"
]},
{ cat:"m_drama", title:"サンクチュアリ", sub:"原作：史村翔　作画：池上遼一", author:"史村翔／池上遼一", authorYomi:"ふみむらしょう", icon:"🏛️", text:[
"北条彰と浅見千秋という二人の青年がいました。",
"子どものころ、二人はカンボジアの戦乱を経験し、命からがら日本へ帰ってきます。",
"ところが日本へ戻ると、大人たちは平和な暮らしに慣れ、政治にも未来にもあまり関心を持っていないように見えました。",
"そこで二人は約束します。",
"「この国を、俺たちの手で変えよう」。",
"浅見は政治家になり、国会の中から日本を変えようとします。北条は反対に、ヤクザの世界へ入り、裏側から力をつけていきます。",
"一人は表、もう一人は裏。まったく違う道を歩きながら、二人は同じ場所を目指します。",
"しかし大きな力を手に入れるほど、敵も増えていきます。それでも二人は、若い世代が希望を持てる新しい日本をつくろうと進んでいきます。"
]},
{ cat:"m_drama", title:"HEAT―灼熱―", spine:"HEAT|―灼熱―", yomi:"ヒート しゃくねつ", sub:"原作：武論尊　作画：池上遼一", author:"武論尊／池上遼一", authorYomi:"ぶろんそん", icon:"🔥", text:[
"新宿に、唐沢辰巳という若い男がやってきます。",
"唐沢は、小さなホストクラブを始めます。しかし普通の店主ではありません。怖いヤクザが相手でも、まったくひるみませんでした。",
"唐沢は暴力だけではなく、頭のよさと人を見る力で、次々と相手を味方につけていきます。",
"「この男についていけば、おもしろい世界が見られるかもしれない」。そう思った人たちが、少しずつ唐沢のまわりへ集まります。",
"やがて話は一軒の店だけでは終わらなくなります。ヤクザ、警察、政治家、大きな企業まで巻きこみ、唐沢は巨大な権力へ立ち向かっていきます。",
"唐沢が欲しいのは、ただお金持ちになることではありません。人が自由に生きられる場所を、自分の力でつくろうとしているのです。"
]},
{ cat:"m_drama", title:"土竜の唄", yomi:"もぐらのうた", sub:"高橋のぼる", author:"高橋のぼる", authorYomi:"たかはしのぼる", icon:"🕵️", text:[
"菊川玲二は警察官でした。",
"けれども成績はあまりよくなく、問題ばかり起こしています。そんな玲二に、ある日とんでもない命令が出ました。",
"「ヤクザの組へ入りこみ、警察のスパイになれ」。",
"こうして玲二は「モグラ」と呼ばれる潜入捜査官になります。",
"玲二は数寄矢会という大きな組織へ入り、正体をかくしながら、危険な男たちの中で暮らします。",
"そこで出会うのが、「クレイジーパピヨン」と呼ばれる日浦匡也です。玲二は警察官なので本当なら捕まえる側ですが、日浦と命を助け合ううちに、強い友情も生まれてしまいます。",
"警察官として悪を捕まえなければならない。でも仲間を裏切ることもつらい。",
"玲二はそんな難しい立場のまま、巨大な犯罪組織のいちばん奥を目指していくのです。"
]},
{ cat:"m_battle", title:"ザ・ファブル", sub:"南勝久", author:"南勝久", authorYomi:"みなみかつひさ", icon:"🔫", text:[
"裏社会に、「ファブル」と呼ばれる伝説の殺し屋がいました。",
"どんな相手でもすぐに倒してしまう、とても強い男です。",
"ところがある日、ボスから変わった命令を受けます。",
"「一年間、人を殺さず、普通の人として暮らせ」。",
"こうしてファブルは「佐藤明」という名前を使い、大阪で暮らし始めます。いっしょに来た女性も、「妹の佐藤洋子」として生活することになります。",
"明はアルバイトを始め、ミサキという女性と知り合います。しかし裏社会の問題は、普通に暮らそうとする明のところへ何度もやってきます。",
"明は人を殺してはいけません。それでも大切な人を守らなければなりません。",
"そこで明は、圧倒的に強いのに、できるだけ相手を殺さずに事件を解決していきます。",
"一年の「普通の生活」を通して、ただの殺し屋だった明の中にも、人として大切にしたいものが少しずつ増えていくのです。"
]},
{ cat:"m_drama", title:"新宿スワン", yomi:"しんじゅくスワン", sub:"和久井健", author:"和久井健", authorYomi:"わくいけん", icon:"🦢", text:[
"白鳥龍彦は、仕事もお金もない若者でした。",
"新宿の町を歩いていたとき、真虎という男から声をかけられます。",
"真虎の仕事は「スカウト」。夜のお店で働く女性を探して、店へ紹介する仕事でした。",
"龍彦もスカウト会社「バースト」に入り、新宿で働き始めます。",
"最初は何もわからない龍彦でしたが、女性たちがそれぞれ悩みや事情を抱えて働いていることを知ります。そして「自分が紹介した女の子には、できるだけ幸せになってほしい」と考えるようになります。",
"しかし夜の町には、お金、暴力、薬物、ヤクザなど、危険な問題もたくさんありました。",
"龍彦は何度も殴られ、仲間を失いながら、それでも人を守ろうとします。",
"ただお金を稼ぐだけだった青年が、新宿という大きな町で、大切な仲間と自分なりの正義を見つけていく物語です。"
]},
{ cat:"m_drama", title:"代紋TAKE2", yomi:"だいもんテイクツー", sub:"原作：木内一雅　作画：渡辺潤", author:"木内一雅／渡辺潤", authorYomi:"きうちかずまさ", icon:"🔄", text:[
"阿久津丈二は、あまり出世できないヤクザでした。",
"ある日、組の争いに巻きこまれ、命を落としてしまいます。",
"ところが目を覚ますと、なぜか十年前の自分に戻っていました。",
"「未来のことを知っているなら、今度こそ人生をやり直せる！」",
"丈二は、一度目の人生で起きた事件や世の中の出来事を思い出しながら、今度は失敗しないように進みます。少しずつ仲間を増やし、ヤクザの世界で大きな立場へ上がっていきました。",
"ところが未来は、丈二の知っているとおりには進まなくなります。江原という男との争いも、どんどん大きくなっていきます。",
"そして物語の最後には、「丈二たちの世界そのものがゲームのような世界だったのではないか」という、とても不思議な真相まで現れます。",
"ただの人生やり直しの話だったはずが、最後には「自分の人生は誰が決めているのだろう」というSFのような物語へ変わっていくのです。"
]},
{ cat:"m_drama", title:"外道の歌", yomi:"げどうのうた", sub:"渡邊ダイスケ", author:"渡邊ダイスケ", authorYomi:"わたなべだいすけ", icon:"⚖️", text:[
"鴨ノ目武と島田虎信は、小さな古書店を営んでいました。",
"けれども二人には、別の顔があります。",
"家族を殺されたり、ひどい目にあわされたりしたのに、法律では十分に相手を罰することができない。そんな人たちから依頼を受け、代わりに犯人へ復讐するのです。",
"鴨自身も、昔、大切な家族を犯罪によって失っています。そのため、被害にあった人の苦しみをよく知っています。",
"虎もまた、強い怒りを抱えています。",
"二人はさまざまな犯罪者と向き合いますが、「悪い人をこらしめれば、すべて元どおりになる」という簡単な話ではありません。",
"復讐をしても、亡くなった人は帰ってこないからです。",
"それでも二人は、行き場のない怒りを抱えた人のために、自分たちなりの方法で悪と向き合い続けます。"
]},
{ cat:"m_drama", title:"善悪の屑", yomi:"ぜんあくのくず", sub:"渡邊ダイスケ", author:"渡邊ダイスケ", authorYomi:"わたなべだいすけ", icon:"🗡️", text:[
"小さな古書店に、鴨ノ目武という男がいました。",
"一見すると普通の店主ですが、じつは「復讐屋」という秘密の仕事をしています。",
"世の中には、とてもひどい犯罪をしたのに、十分な罰を受けない人もいます。",
"家族を奪われた人や、大切な人を傷つけられた人が、「どうしても許せない」と鴨のところへやってきます。",
"鴨と相棒の虎は、その話を聞き、犯罪者へ復讐します。",
"けれども鴨自身も、家族を殺された過去を持っていました。",
"「悪い人を罰すれば、それで心は楽になるのか」。",
"物語は、その答えがそんなに簡単ではないことも描きます。",
"『善悪の屑』で始まった鴨と虎の物語は、その後『外道の歌』へと続いていきます。"
]},
{ cat:"m_food", title:"美味しんぼ", yomi:"おいしんぼ", sub:"原作：雁屋哲　作画：花咲アキラ", author:"雁屋哲／花咲アキラ", authorYomi:"かりやてつ", icon:"🍱", text:[
"山岡士郎は、新聞社で働いている記者です。",
"普段は少しなまけ者に見えますが、料理や食べものについては、とても深い知識を持っていました。",
"ある日、新聞社は「究極のメニュー」という企画を始めます。山岡と同僚の栗田ゆう子が、日本じゅうのおいしい食べものを探すことになりました。",
"ところがライバルとして現れたのが、「至高のメニュー」をつくる海原雄山です。",
"じつは雄山は、山岡のお父さんでした。",
"二人は料理について何度も勝負しますが、親子の間には昔から深いわだかまりがあります。",
"魚、お肉、お米、野菜、お酒。さまざまな料理を食べながら、山岡たちは「本当においしいとは、どういうことだろう」と考えます。",
"料理の勝負をしながら、少しずつ父と息子の心の距離も変わっていく物語です。"
]},
{ cat:"m_food", title:"クッキングパパ", sub:"うえやまとち", author:"うえやまとち", authorYomi:"うえやまとち", icon:"👨‍🍳", text:[
"荒岩一味は、会社で働く大きな体のお父さんです。",
"会社では少しこわそうに見えますが、じつは料理がとても上手です。",
"家へ帰ると、妻の虹子や息子のまことたちのために、ごはんをつくります。",
"カレー、ラーメン、お弁当、魚料理、お菓子。特別な高級料理だけでなく、家でつくれるいろいろな料理が登場します。",
"最初、荒岩は自分が料理をしていることを会社の人にあまり知られたがりませんでした。でもだんだん、料理を通して会社の仲間や近所の人たちともつながっていきます。",
"子どもだったまことも成長し、家族の暮らしも少しずつ変わっていきます。",
"大事件を倒す物語ではありません。",
"「今日はみんなで何を食べようか」。",
"そんな毎日の食卓を通して、家族や仲間がいっしょに成長していく、とてもあたたかい物語です。"
]},
{ cat:"m_food", title:"味いちもんめ", yomi:"あじいちもんめ", sub:"原作：あべ善太　作画：倉田よしみ", author:"あべ善太／倉田よしみ", authorYomi:"あべぜんた", icon:"🔪", text:[
"伊橋悟は、料理人をめざす若者です。",
"調理師学校を出た伊橋は、「これなら自分も一人前だ」と思っていました。",
"ところが料亭「藤村」で働き始めると、学校で覚えただけでは何もできないことに気づきます。",
"魚の下ごしらえ、包丁の使い方、だしの取り方、お客さんへの心づかい。先輩から何度も怒られながら、一つずつ覚えていきます。",
"伊橋は失敗もします。自分の腕を自慢したくなったり、ほかの料理人とぶつかったりすることもあります。",
"でも、お客さんが料理を食べて喜ぶ姿を見るたび、「もっと上手になりたい」と思います。",
"料理人に必要なのは、包丁が上手なことだけではありません。",
"食べる人の気持ちを考えること。",
"伊橋はたくさんの出会いと失敗を通して、少しずつ本当の料理人へ成長していくのです。"
]},
{ cat:"m_food", title:"将太の寿司", yomi:"しょうたのすし", sub:"寺沢大介", author:"寺沢大介", authorYomi:"てらさわだいすけ", icon:"🍣", text:[
"関口将太は、北海道の小樽にある寿司屋の息子です。",
"家族のお店を守りたい将太は、「もっと腕のよい寿司職人になろう」と東京へ修業に出ます。",
"将太が働くことになったのは、名店「鳳寿司」でした。",
"最初はまだ見習いです。魚の選び方、お米の炊き方、包丁の使い方など、一つずつ覚えていきます。",
"やがて将太は、寿司職人の大会へ出ることになります。",
"相手は全国から集まった強い職人たちです。",
"将太は高い材料を使うだけではなく、「このお客さんには、どんな寿司を食べてもらえば喜んでもらえるだろう」と考えます。",
"何度も失敗しながら勝ち進み、将太は一流の寿司職人へ成長します。",
"そして最初に抱いていた「家族の店を守りたい」という思いを忘れず、自分の寿司の道を歩いていくのです。"
]},
{ cat:"m_food", title:"中華一番！", yomi:"ちゅうかいちばん", sub:"小川悦司", author:"小川悦司", authorYomi:"おがわえつし", icon:"🥟", text:[
"中国の四川省に、劉昴星――みんなから「マオ」と呼ばれる少年がいました。",
"マオのお母さんは、とても有名な料理人でした。母が亡くなったあと、マオも料理人として修業を始めます。",
"マオには、料理を食べる人を驚かせ、幸せにする不思議な才能がありました。",
"やがてマオは中国じゅうを旅し、いろいろな料理人と勝負します。",
"ところが、「裏料理界」という悪い料理人たちの組織が現れます。",
"彼らは料理を使って人々を支配しようとしていました。",
"マオは仲間たちといっしょに、伝説の料理道具を探しながら裏料理界と戦います。",
"でもマオが大切にするのは、「相手に勝つ料理」だけではありません。",
"食べた人が笑顔になる料理。",
"それこそが、本当にすばらしい料理なのだと信じて、マオは包丁を握り続けるのです。"
]},
{ cat:"m_battle", title:"BLACK LAGOON", spine:"BLACK|LAGOON", yomi:"ブラックラグーン", sub:"広江礼威", author:"広江礼威", authorYomi:"ひろえれい", icon:"🚤", text:[
"岡島緑郎は、日本の会社で働く普通の会社員でした。",
"ある日、仕事で東南アジアへ行ったところ、海賊のような運び屋「ラグーン商会」にさらわれてしまいます。",
"ところが会社は、緑郎を助けようとはしませんでした。",
"「会社にとって、自分はそれほど大切ではなかったんだ」。",
"そう知った緑郎は、日本へ戻ることをやめます。そして「ロック」と名のり、ラグーン商会の仲間になるのです。",
"仲間には、二丁の拳銃を使うレヴィ、リーダーのダッチ、機械に強いベニーがいます。",
"彼らが暮らすロアナプラは、犯罪者やマフィアが集まる危険な町です。",
"ロックは武器ではなく、言葉と頭を使って問題を解決しようとします。",
"しかし危険な世界で暮らすうちに、優しかったロック自身の心も少しずつ変わっていきます。",
"「善い人と悪い人は、本当にきれいに分けられるのか」。そんな問いを描く物語です。"
]},
{ cat:"m_battle", title:"ヨルムンガンド", sub:"高橋慶太郎", author:"高橋慶太郎", authorYomi:"たかはしけいたろう", icon:"🐍", text:[
"ヨナは、戦争で家族を失った少年兵でした。",
"ヨナは武器が大きらいです。",
"ところが、そんなヨナが守ることになったのは、世界中へ武器を売っている女性、ココ・ヘクマティアルでした。",
"ココは明るく笑いながら、飛行機や船で世界を飛び回り、いろいろな国へ武器を売っています。",
"ヨナには、どうしてココがそんな仕事をしているのかわかりません。",
"ココには、じつは大きな計画がありました。",
"その名は「ヨルムンガンド」。",
"世界中の空や情報を自分のシステムで管理し、戦争をしにくい世界へ変えようとしていたのです。",
"しかし、そのためには多くの人の自由を奪うことになります。",
"ヨナは一度ココのもとを離れます。",
"それでも長い時間を考えた末、もう一度ココのところへ戻ります。そしてココは、ついにヨルムンガンドを動かし始めるのです。"
]},
{ cat:"m_food", title:"忘却のサチコ", yomi:"ぼうきゃくのサチコ", sub:"阿部潤", author:"阿部潤", authorYomi:"あべじゅん", icon:"🍙", text:[
"佐々木幸子は、仕事のできるまじめな編集者でした。",
"何でも予定どおりに進める幸子でしたが、人生でいちばん大切な日の予定だけは、うまくいきませんでした。",
"結婚式の日、新郎の俊吾が突然いなくなってしまったのです。",
"幸子は大きなショックを受けます。",
"そんなある日、おいしい料理を食べているほんの短いあいだだけ、俊吾のことを忘れている自分に気づきました。",
"「そうだ。おいしいものを食べているときなら、悲しいことを忘れられる」。",
"それから幸子は、仕事で日本じゅうを飛び回りながら、いろいろな料理を食べるようになります。",
"お寿司、ラーメン、郷土料理、お弁当。",
"料理を食べるたび、幸子の心はほんの少しずつ元気になります。",
"失恋を忘れるために始まった食べ歩きが、いつしか幸子に新しい人や世界を見せてくれるようになるのです。"
]},
{ cat:"m_work", title:"波よ聞いてくれ", yomi:"なみよきいてくれ", sub:"沙村広明", author:"沙村広明", authorYomi:"さむらひろあき", icon:"📻", text:[
"鼓田ミナレは、札幌で働いている、よくしゃべる女性です。",
"ある夜、失恋したミナレは居酒屋で知らない男へ、恋人への不満をたくさん話しました。",
"次の日、ラジオから自分の声が流れてきます。",
"じつは、その男はラジオ局のディレクターだったのです。",
"怒ったミナレはラジオ局へ飛びこみます。しかしそこでマイクを渡されると、とつぜん見事にしゃべり始めます。",
"こうしてミナレは、深夜ラジオのパーソナリティになります。",
"普通のお便りを読むだけではありません。奇妙なドラマを演じたり、事件のような出来事へ巻きこまれたりしながら、自分の言葉で番組をつくっていきます。",
"失恋した一人の女性が、偶然見つけた「しゃべる」という才能によって、新しい人生へ飛びこんでいく物語です。"
]},
{ cat:"m_battle", title:"トリコ", sub:"島袋光年", author:"島袋光年", authorYomi:"しまぶくろみつとし", icon:"🍖", text:[
"この世界には、とてもおいしい食べものがたくさんありました。",
"巨大な肉を持つ動物、ジュースがわき出す実、不思議な魚。そんな珍しい食材を探す人を「美食屋」といいます。",
"トリコは、その中でもとても強い美食屋でした。",
"料理人の小松と出会ったトリコは、「自分だけの人生のフルコースを完成させる」という夢を持って世界を旅します。",
"ところが、おいしい食材を悪いことに利用しようとする美食會が現れます。",
"さらに世界には、人間界よりはるかに危険な「グルメ界」があることもわかります。",
"トリコと小松は仲間たちと力を合わせ、伝説の食材「GOD」や、料理人アカシアにまつわる秘密へ近づいていきます。",
"最後には地球そのものを食べようとする怪物NEOとの大きな戦いになります。",
"戦いが終わるとトリコは鈴と結婚し、小松とともに、今度は宇宙のおいしい食べものを探す旅へ出発するのです。"
]},
{ cat:"m_work", title:"課長島耕作", yomi:"かちょうしまこうさく", sub:"弘兼憲史", author:"弘兼憲史", authorYomi:"ひろかねけんし", icon:"👔", text:[
"島耕作は、大きな電機会社「初芝電器」で働く会社員です。",
"特別な超能力を持っているわけでも、ものすごいお金持ちでもありません。",
"毎日会社へ行き、上司や部下、お客さんたちと仕事をしています。",
"でも会社の中にも、いろいろな問題があります。",
"出世をめぐる競争、新しい商品の開発、海外との仕事、人間関係。",
"島は、ときには迷いながらも、自分なりの考えで仕事を進めます。",
"また仕事だけではなく、家庭や恋愛でもいろいろな出来事を経験します。",
"『課長島耕作』では、そんな島の「課長だった時代」が描かれます。",
"その後、島は部長、取締役、社長へと出世していき、別のシリーズへ物語が続いていきます。",
"一人の会社員の人生を通して、日本の会社や社会の変化を描いた長い物語です。"
]},
{ cat:"m_work", title:"サラリーマン金太郎", spine:"サラリーマン|金太郎", yomi:"サラリーマンきんたろう", sub:"本宮ひろ志", author:"本宮ひろ志", authorYomi:"もとみやひろし", icon:"💼", text:[
"矢島金太郎は、昔、大きな暴走族のリーダーでした。",
"しかし妻と出会ったことで、危険な世界から離れます。",
"その妻を亡くしたあと、金太郎は小さな息子を育てながら暮らしていました。",
"ある日、金太郎は海で一人の老人を助けます。",
"その老人は大きな建設会社「ヤマト建設」の会長でした。",
"「うちの会社で働いてみないか」。",
"こうして金太郎は、スーツを着たサラリーマンになります。",
"会社の決まりも、難しい仕事もよくわかりません。でも金太郎には、まっすぐな心と、人を動かす大きな力がありました。",
"会社の不正や政治家との争いにも、「おかしいものはおかしい」と正面から立ち向かいます。",
"暴走族だった男が、今度は会社という大きな世界を走り抜ける物語です。"
]},
{ cat:"m_art", title:"ブルーピリオド", sub:"山口つばさ", author:"山口つばさ", authorYomi:"やまぐちつばさ", icon:"🎨", text:[
"矢口八虎は、学校では成績がよく、友だちもいる高校生でした。",
"でも心の中では、「自分は本当にやりたいことがない」と感じていました。",
"そんなある朝、八虎は青く見える渋谷の町を絵に描きます。",
"すると、自分の気持ちを初めて誰かに伝えられたような気がしました。",
"「絵って、おもしろい」。",
"そこから八虎は、本気で美術を始めます。",
"目標は、日本でもとても入るのが難しい東京藝術大学です。",
"でも八虎は、美術を始めるのがほかの人より遅かったので、毎日たくさん練習します。",
"そして苦しい受験を乗りこえ、藝大へ合格します。",
"ところが大学へ入れば終わりではありません。",
"まわりには自分より上手な人がたくさんいます。",
"八虎は何度も「自分は何を描きたいんだろう」と悩みながら、本当に自分だけの絵を探していくのです。"
]},
{ cat:"m_work", title:"重版出来！", yomi:"じゅうはんしゅったい", sub:"松田奈緒子", author:"松田奈緒子", authorYomi:"まつだなおこ", icon:"📚", text:[
"黒沢心は、漫画が大好きな女性です。",
"柔道に打ちこんでいましたが、けがをきっかけに別の道を選び、出版社の漫画編集部へ入ります。",
"編集者の仕事は、自分で漫画を描くことではありません。",
"漫画家と話をして作品をいっしょに考えたり、本屋さんへ行って漫画を置いてもらったり、宣伝を考えたりします。",
"心は、新人漫画家、売れなくなった漫画家、長年描き続けるベテランなど、たくさんの人と出会います。",
"漫画が一冊できるまでには、作者だけではなく、編集者、印刷する人、本を売る人など、多くの人が力を合わせています。",
"そして本がたくさん売れると、もう一度印刷する「重版」が決まります。",
"「この漫画を、もっとたくさんの人に届けたい！」",
"心はその喜びを胸に、漫画をつくる人たちを支えていくのです。"
]},
{ cat:"m_art", title:"左ききのエレン", yomi:"ひだりききのエレン", sub:"原作：かっぴー　作画：nifuni", author:"かっぴー／nifuni", authorYomi:"かっぴー", icon:"✏️", text:[
"朝倉光一は、広告会社で働くデザイナーです。",
"光一は子どものころから、「自分には特別な才能がある」と信じたがっていました。",
"高校生のころ、光一は山岸エレンという少女と出会います。",
"エレンは、ものすごい絵の才能を持っていました。",
"光一が必死に努力して描いたものを、エレンはまるで息をするようにつくってしまいます。",
"光一はショックを受けながらも、「才能がない人間は、夢を見てはいけないのか」と考え続けます。",
"やがて光一は広告の世界へ入り、エレンは芸術家として世界へ進んでいきます。",
"二人は別々の場所で、才能、努力、仕事、夢と向き合います。",
"これは「天才が成功する話」だけではありません。",
"天才ではない人が、それでも何かをつくりたいと思ったとき、どう生きればいいのか。",
"光一とエレン、そしてたくさんのクリエイターたちの人生を描く物語です。"
]},
{ cat:"m_work", title:"ハコヅメ〜交番女子の逆襲〜", spine:"ハコヅメ|〜交番女子の逆襲〜", yomi:"ハコヅメ こうばんじょしのぎゃくしゅう", sub:"泰三子", author:"泰三子", authorYomi:"やすみこ", icon:"👮", text:[
"川合麻依は、新人の女性警察官です。",
"「公務員なら安定しているかな」と思って警察官になりましたが、仕事は想像よりずっと大変でした。",
"酔っぱらった人の相手をしたり、交通違反を取り締まったり、迷子を探したり。",
"「もう警察をやめたい」。",
"そう思っていた川合の前へ、藤聖子という先輩の女性警察官がやってきます。",
"藤はとても仕事ができますが、少しこわい人でした。",
"二人は交番でいっしょに働きながら、交通事故、詐欺、性犯罪、殺人事件など、さまざまな事件と向き合います。",
"笑ってしまうような日もあれば、どうしても忘れられない悲しい事件もあります。",
"最初は頼りなかった川合も、藤や仲間たちと働くうちに、少しずつ警察官らしくなっていきます。",
"制服の向こうにも、普通に笑ったり悩んだりする人がいることを描いた物語です。"
]},
{ cat:"m_work", title:"正直不動産", yomi:"しょうじきふどうさん", sub:"原案：夏原武　脚本：水野光博　作画：大谷アキラ", author:"夏原武／水野光博／大谷アキラ", authorYomi:"なつはらたけし", icon:"🏠", text:[
"永瀬財地は、不動産会社で働く営業マンです。",
"永瀬は、お客さんへうまいことを言い、家や土地をどんどん売っていました。",
"ところがある日、古いほこらを壊してしまいます。",
"そのときから、永瀬はなぜか「うそをつけない体」になってしまいました。",
"お客さんへ物件をすすめようとしても、",
"「じつはこの家、こんな欠点がありますよ」",
"と、本当のことを全部しゃべってしまいます。",
"営業マンとしては大ピンチです。",
"でも正直に話すことで、逆に永瀬を信頼するお客さんも現れます。",
"家を買うことは、多くの人にとって人生でいちばん大きな買い物です。",
"永瀬は土地、マンション、賃貸、住宅ローンなどの問題を通して、「本当にお客さんのためになる仕事とは何だろう」と考えるようになるのです。"
]},
{ cat:"m_work", title:"二月の勝者―絶対合格の教室―", spine:"二月の勝者|―絶対合格の教室―", yomi:"にがつのしょうしゃ ぜったいごうかくのきょうしつ", sub:"高瀬志帆", author:"高瀬志帆", authorYomi:"たかせしほ", icon:"📝", text:[
"二月の中学受験では、たくさんの小学六年生が志望校を目指して試験を受けます。",
"桜花ゼミナールという塾へ、黒木蔵人という先生がやってきました。",
"黒木は、「中学受験は課金ゲームです」など、とてもきびしいことを言います。",
"新人講師の佐倉麻衣は、「子どもたちにそんな言い方をしていいの？」と驚きます。",
"でも黒木は、ただ冷たい先生ではありませんでした。",
"一人ひとりの成績、性格、家庭の事情までよく見て、「この子がいちばん力を出せる学校はどこか」を考えています。",
"子どもたちは成績が上がって喜んだり、模試で失敗して泣いたり、親とけんかしたりします。",
"そして二月、本番の日がやってきます。",
"全員が第一志望へ受かるわけではありません。それでもそれぞれが自分の結果を受け止め、新しい学校生活へ進んでいきます。",
"中学受験を通して、子どもだけでなく親や先生も成長していく物語です。"
]},
{ cat:"m_work", title:"ドラゴン桜", yomi:"ドラゴンざくら", sub:"三田紀房", author:"三田紀房", authorYomi:"みたのりふさ", icon:"🐉", text:[
"龍山高校は、勉強があまり得意ではない生徒が集まる学校でした。",
"経営も苦しくなり、このままでは学校そのものがなくなってしまいそうです。",
"そこへ弁護士の桜木建二がやってきます。",
"桜木は、とんでもないことを言いました。",
"「この学校から、東京大学の合格者を出す」。",
"最初はみんな笑います。",
"でも桜木は、本気でした。",
"先生たちを集め、生徒へ「どうすれば効率よく覚えられるのか」「試験では何を考えればいいのか」を教えていきます。",
"水野直美や矢島勇介たちは、今までまともに勉強してこなかったところから、東大を目指します。",
"もちろん、がんばれば必ず同じ結果になるわけではありません。",
"それでも生徒たちは受験を通して、自分の人生を自分で選ぶ力を身につけます。",
"「勉強は、人生の選択肢を増やす道具なんだ」と教えてくれる物語です。"
]},
{ cat:"m_work", title:"インベスターZ", yomi:"インベスターゼット", sub:"三田紀房", author:"三田紀房", authorYomi:"みたのりふさ", icon:"📈", text:[
"財前孝史は、北海道にある名門・道塾学園へ入学しました。",
"すると、先輩から地下室へ連れていかれます。",
"そこでは、たった数人の生徒たちが大きなお金を使って投資をしていました。",
"この学校は、昔から生徒の投資によってお金を増やし、その利益で学校を運営していたのです。",
"財前も投資部へ入り、株を買います。",
"しかし投資は、ただ安いときに買って高く売ればいいという簡単なものではありません。",
"会社、為替、不動産、保険、起業など、お金の世界にはたくさんのしくみがあります。",
"財前は失敗もしながら、「価値とは何なのか」「お金はなぜ増えたり減ったりするのか」を学んでいきます。",
"最後には学校の歴史にも関わる大きな投資勝負へ挑みます。",
"中学生だった財前が、お金を通して社会のしくみを知っていく物語です。"
]},
{ cat:"m_drama", title:"Q.E.D. 証明終了", spine:"Q.E.D.|証明終了", yomi:"キューイーディー しょうめいしゅうりょう", sub:"加藤元浩", author:"加藤元浩", authorYomi:"かとうもとひろ", icon:"🔍", text:[
"燈馬想は、とても頭のよい少年です。",
"若くしてアメリカのMITを卒業しましたが、日本へ戻り、なぜか普通の高校へ通うことになります。",
"そこで出会ったのが、水原可奈という元気な女の子です。",
"可奈のお父さんは刑事でした。そのため二人は、いろいろな事件へ巻きこまれていきます。",
"密室で起きた殺人、不思議な暗号、消えた人。",
"誰も答えがわからないとき、燈馬は小さな手がかりを一つずつ集めます。",
"そして数学の証明をするように、",
"「これとこれがわかった。だから答えはこうなる」",
"と、事件の真相を組み立てます。",
"題名の「Q.E.D.」は、「これで証明できました」という意味です。",
"天才の燈馬と、行動力いっぱいの可奈。",
"正反対の二人が力を合わせ、難しい謎を解いていく物語です。"
]},
{ cat:"m_drama", title:"C.M.B. 森羅博物館の事件目録", spine:"C.M.B.|森羅博物館の|事件目録", yomi:"シーエムビー しんらはくぶつかんのじけんもくろく", sub:"加藤元浩", author:"加藤元浩", authorYomi:"かとうもとひろ", icon:"🦴", text:[
"榊森羅は、とても不思議な少年です。",
"森羅は、小さな博物館に暮らしています。",
"そこには世界中から集められた動物、植物、化石、宝石、古い道具などがいっぱいありました。",
"森羅は子どものころから世界中を旅し、自然や歴史について、びっくりするほどたくさんのことを知っています。",
"そこへ元気な少女・七瀬立樹がやってきます。",
"二人は博物館に持ちこまれる品物をきっかけに、さまざまな事件へ出会います。",
"「この石はどこから来たの？」",
"「どうしてこの生き物だけが消えたの？」",
"一見、事件とは関係なさそうな知識が、謎を解く大切な鍵になります。",
"世界は大きな博物館のようなものです。",
"森羅と立樹は、自然、歴史、科学の知識を使いながら、その中に隠された謎を一つずつ解いていくのです。"
]},
{ cat:"m_drama", title:"金田一少年の事件簿", spine:"金田一少年の|事件簿", yomi:"きんだいちしょうねんのじけんぼ", sub:"原作：天樹征丸・金成陽三郎　漫画：さとうふみや", author:"天樹征丸・金成陽三郎／さとうふみや", authorYomi:"あまぎせいまる", icon:"🔎", text:[
"金田一一は、一見すると少しだらしない高校生です。",
"でも彼のおじいさんは、有名な名探偵・金田一耕助。",
"一もまた、とてもするどい頭を持っていました。",
"幼なじみの七瀬美雪と旅行へ行ったり、学校の行事へ参加したりすると、なぜか不思議な事件が起こります。",
"雪山の屋敷、孤島、古い学校。",
"犯人はまるで幽霊や怪物がやったように見せかけます。",
"でも一は、小さな矛盾を見逃しません。",
"「じっちゃんの名にかけて！」",
"そう決意すると、しかけを一つずつ解き、犯人へたどり着きます。",
"けれども犯人にも、悲しい過去や復讐の理由があることが少なくありません。",
"事件を解決しても、一が心から喜べないこともあります。",
"「なぜ事件が起きてしまったのか」まで描く、少し悲しい名探偵の物語です。"
]},
{ cat:"m_drama", title:"名探偵コナン", yomi:"めいたんていコナン", sub:"青山剛昌", author:"青山剛昌", authorYomi:"あおやまごうしょう", icon:"🕵️", text:[
"工藤新一は、高校生の名探偵です。",
"ある日、幼なじみの毛利蘭と遊園地へ行った新一は、あやしい黒ずくめの男たちを見つけます。",
"こっそりあとを追った新一は、男たちにつかまり、謎の薬を飲まされます。",
"ところが死ぬどころか、体だけが小学生になってしまいました。",
"新一は「江戸川コナン」と名のり、蘭の家で暮らし始めます。",
"蘭のお父さん・毛利小五郎は探偵です。",
"コナンは時計型麻酔銃など、阿笠博士がつくった道具を使いながら、小五郎の代わりにたくさんの事件を解決します。",
"その一方で、自分を小さくした「黒ずくめの組織」を追い続けます。",
"灰原哀やFBIの仲間たちも加わり、組織の秘密へ少しずつ近づいていきます。",
"でも新一が元の体へ完全に戻り、蘭へすべてを話せる日は、まだやってきていません。"
]},
{ cat:"m_history", title:"チ。―地球の運動について―", spine:"チ。|―地球の運動|について―", yomi:"チ ちきゅうのうんどうについて", sub:"魚豊", author:"魚豊", authorYomi:"うおと", icon:"🌍", text:[
"むかし、宇宙についての考え方が今とは大きく違っていた時代のお話です。",
"多くの人は、「地球は動かず、太陽や星が地球のまわりを回っている」と考えていました。",
"少年ラファウも、最初はその考えを疑っていませんでした。",
"ところが一人の学者と出会い、「もしかすると地球のほうが動いているのではないか」という考えを知ります。",
"その考えは、ラファウの世界をまったく変えてしまいました。",
"しかし、それを研究することはとても危険でした。",
"ラファウが倒れても、その研究は終わりません。",
"オクジー、バデーニ、ドゥラカなど、別の人がその思いと資料を受けつぎます。",
"一人が倒れれば、また次の人へ。",
"そうして知識は、長い時間をかけて少しずつ未来へ渡されていきます。",
"「自分の命よりも、本当のことを知りたい」。",
"そんな人間の知りたい気持ちが、時代をこえてつながっていく物語です。"
]},
{ cat:"m_love", title:"九龍ジェネリックロマンス", spine:"九龍|ジェネリック|ロマンス", yomi:"クーロンジェネリックロマンス", sub:"眉月じゅん", author:"眉月じゅん", authorYomi:"まゆづきじゅん", icon:"🏙️", text:[
"九龍城砦という、古くてごちゃごちゃした町で、鯨井令子は不動産会社に勤めています。",
"同僚の工藤発とは、毎日いっしょに仕事をしています。",
"令子は少しずつ工藤へひかれていきます。",
"ところがある日、令子は不思議な写真を見つけます。",
"そこには、自分とまったく同じ顔をした女性が写っていました。",
"しかも、その女性は工藤の昔の恋人だったらしいのです。",
"「じゃあ、私は誰なの？」",
"令子は、自分の記憶や町そのものを疑い始めます。",
"さらに空には巨大な建造物が浮かび、九龍にもどこかおかしなところがあります。",
"懐かしい町で始まった静かな恋のお話が、だんだん「本物と偽物とは何だろう」「同じ人間が二人いたら、どちらが本物なのだろう」という大きな謎へ変わっていきます。"
]},
{ cat:"m_work", title:"大東京トイボックス", spine:"大東京|トイボックス", yomi:"だいとうきょうトイボックス", sub:"うめ", author:"うめ", authorYomi:"うめ", icon:"🎮", text:[
"天川太陽は、ゲームをつくることが大好きなゲームクリエイターです。",
"太陽たちの小さな会社「スタジオG3」には、百田モモという新人もやってきます。",
"ゲームをつくる仕事は、とても楽しそうに見えます。",
"でも実際には、決められた日までにつくらなければならなかったり、お金が足りなかったり、会社から「もっと売れるゲームにしなさい」と言われたりします。",
"「自分がおもしろいと思うゲームをつくりたい」。",
"「でも売れなければ会社がなくなってしまう」。",
"太陽たちは、その間で何度も悩みます。",
"さらに大きなゲーム会社との争いや、昔につくったゲームへの思いも絡んできます。",
"それでもクリエイターたちは、最後には「自分たちはなぜゲームをつくるのか」と向き合います。",
"ゲームを遊ぶ人だけではなく、その裏側でゲームをつくっている人たちの夢と苦労を描いた物語です。"
]},
{ cat:"m_drama", title:"薬屋のひとりごと", yomi:"くすりやのひとりごと", sub:"原作：日向夏　構成：七緒一綺　作画：ねこクラゲ", author:"日向夏／七緒一綺／ねこクラゲ", authorYomi:"ひゅうがなつ", icon:"💊", text:[
"猫猫は、薬と毒が大好きな少女です。",
"ある日、人さらいにあい、皇帝の住む後宮で下女として働くことになってしまいます。",
"猫猫は目立たずに仕事を終えようと思っていました。",
"ところが後宮で、皇帝の子どもたちが次々に病気になる事件が起こります。",
"猫猫は薬の知識を使い、その原因を見つけます。",
"その才能に気づいたのが、とても美しい宦官・壬氏でした。",
"それから猫猫のところには、毒、病気、食べもの、幽霊のうわさなど、いろいろな謎が持ちこまれるようになります。",
"猫猫は「面倒だなあ」と言いながらも、気になると放っておけません。",
"そして事件を解くうちに、後宮の中の政治や、壬氏自身に隠された大きな秘密へも近づいていきます。",
"薬が大好きな少女が、知識と観察力だけを武器に宮廷の謎を解いていく物語です。"
]},
{ cat:"m_horror", title:"夏目友人帳", yomi:"なつめゆうじんちょう", sub:"緑川ゆき", author:"緑川ゆき", authorYomi:"みどりかわゆき", icon:"🐱", text:[
"夏目貴志は、子どものころから妖怪を見ることができました。",
"でも、ほかの人には妖怪が見えません。",
"「変なことを言う子だ」と思われ、夏目はずっとさびしい思いをしてきました。",
"そんな夏目が祖母・レイコの残した「友人帳」を手に入れます。",
"そこには、レイコが昔負かした妖怪たちの名前が書かれていました。",
"名前を持っている者は、その妖怪を自由に命令することができます。",
"でも夏目は、妖怪を家来にはしません。",
"「名前を返そう」。",
"一匹ずつ妖怪を探し、その名前を返していきます。",
"用心棒になったニャンコ先生と旅をするうち、怖い妖怪だけではなく、やさしい妖怪や、さびしがり屋の妖怪にも出会います。",
"人間にも妖怪にも少し距離を置いていた夏目は、少しずつ「自分にも帰る場所がある」と思えるようになっていくのです。"
]},
{ cat:"m_daily", title:"ARIA", yomi:"アリア", sub:"天野こずえ", author:"天野こずえ", authorYomi:"あまのこずえ", icon:"🚣", text:[
"遠い未来、人間は火星を水の星へ変えました。",
"その星は「アクア」と呼ばれています。",
"水無灯里は、アクアにある美しい町ネオ・ヴェネツィアへやってきました。",
"灯里の夢は、「ウンディーネ」と呼ばれる観光案内の女性になることです。",
"小さなARIAカンパニーで、先輩のアリシアに教えてもらいながら、ゴンドラをこぐ練習を始めます。",
"そして藍華やアリスという友だちもできます。",
"三人はいっしょに練習しながら、春の花、夏の海、秋の夕焼け、冬の雪など、町のいろいろな美しさを見つけていきます。",
"やがて先輩たちはそれぞれの道へ進み、灯里たちにも別れのときがやってきます。",
"灯里はついに一人前のプリマ・ウンディーネになります。",
"そして今度は自分が後輩を迎える立場になります。",
"大きな悪者を倒す物語ではありません。",
"毎日の中にある小さな幸せを見つけながら、少女たちが少しずつ大人になっていく、とてもやさしい物語です。"
]},
{ cat:"m_art", title:"まんが道", yomi:"まんがみち", sub:"藤子不二雄Ⓐ", author:"藤子不二雄Ⓐ", authorYomi:"ふじこふじおエー", icon:"✒️", text:[
"富山県に、満賀道雄という漫画が大好きな少年がいました。ある日、学校で才野茂という少年と出会います。才野も漫画が大好きで、とても絵が上手でした。",
"「いつか二人で漫画家になろう」。そう約束した二人は、学校が終わるといっしょに漫画を描き、東京の出版社へ原稿を送るようになります。そして憧れの漫画家・手塚治虫にも会い、「自分たちも本当に漫画家になりたい」という思いをますます強くします。",
"やがて二人は仕事をやめ、東京へ出ます。そして若い漫画家たちが集まる「トキワ荘」で暮らし始めます。石森章太郎や赤塚不二夫たちと励まし合いながら、毎日毎日漫画を描きました。",
"しかし、仕事をたくさん引き受けすぎて締め切りに間に合わず、出版社から仕事をもらえなくなる大失敗もします。それでも二人はあきらめません。「もう一度、一からやり直そう」。失敗しても立ち上がり、漫画家という長い「まんが道」を歩き続ける二人の青春物語です。"
]},
{ cat:"m_art", title:"愛…しりそめし頃に…", spine:"愛…|しりそめし頃に…", yomi:"あいしりそめしころに", sub:"藤子不二雄Ⓐ", author:"藤子不二雄Ⓐ", authorYomi:"ふじこふじおエー", icon:"💌", text:[
"『まんが道』の続きのお話です。",
"満賀道雄と才野茂は東京のトキワ荘で暮らしながら、少しずつ漫画家として仕事を増やしていました。まわりには寺田ヒロオ、石森章太郎、赤塚不二夫など、のちに有名になる若い漫画家たちがいます。",
"みんなお金はあまりありません。それでも漫画について夜遅くまで話したり、おたがいの原稿を手伝ったりしながら、「いつかすごい漫画家になるぞ」と夢を追いかけます。",
"満賀には恋をしたり、女性との出会いに心をときめかせたりすることもありました。仕事だけではなく、一人の青年として大人になっていくのです。",
"仲間たちも一人、また一人と売れっ子漫画家になり、トキワ荘を出ていきます。満賀と才野も、子どものころ夢見ていた「プロの漫画家」へ少しずつ近づいていきます。貧しかったけれど、夢と友情だけはいっぱいあった若者たちの青春を描いた物語です。"
]},
{ cat:"m_drama", title:"少年時代", yomi:"しょうねんじだい", sub:"原作：柏原兵三　漫画：藤子不二雄Ⓐ", author:"柏原兵三／藤子不二雄Ⓐ", authorYomi:"かしわばらひょうぞう", icon:"🚂", text:[
"太平洋戦争の終わりごろ、東京に住んでいた風間進一という少年が、空襲を避けるため富山の田舎へ疎開しました。",
"知らない土地、知らない学校。心細い進一に声をかけてくれたのが、クラスのガキ大将・タケシでした。",
"二人きりのときのタケシは、進一にやさしくしてくれます。でも学校のみんなの前では、急にいばったり、進一を子分のように扱ったりします。進一は、「やさしいタケシと、こわいタケシ。どちらが本当なんだろう」と悩みます。",
"やがてタケシも、ほかの子どもたちとの争いで力を失い、ひとりぼっちになってしまいます。進一は今度こそ友だちになろうとしますが、タケシは素直になれません。",
"そして戦争が終わり、進一は東京へ帰ることになります。汽車が動き出しても、駅にタケシの姿はありません。",
"ところが遠くの田んぼ道を見ると、タケシが一生懸命走りながら手を振っていました。進一も窓から手を振ります。",
"うまく「友だちだ」と言えなかった二人。でも最後には、たしかに心がつながっていたのです。"
]},
{ cat:"m_sf", title:"T・Pぼん", yomi:"ティーピーぼん", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"⏳", text:[
"並平凡、みんなから「ぼん」と呼ばれる中学生は、ごく普通の少年でした。",
"ところがある日、「タイムパトロール」という未来の組織の秘密を知ってしまいます。タイムパトロールは、昔の時代へ行き、本当なら不幸に死んでしまう人を助ける仕事をしていました。",
"ぼんは先輩のリームといっしょに、タイムマシンでさまざまな時代へ行きます。",
"古代エジプト、ギリシア、戦争の時代、恐竜のいる時代。助けたい人がいても、歴史そのものを大きく変えてはいけません。",
"「この人を助けたら未来が変わってしまうかもしれない。でも、目の前で困っている人を見捨ててもいいのかな」。",
"ぼんは毎回悩みながら、それでもできるかぎり命を救おうとします。",
"最初は頼りなかった少年が、たくさんの時代と人々に出会い、少しずつ一人前のタイムパトロールへ成長していく物語です。"
]},
{ cat:"m_space", title:"モジャ公", yomi:"モジャこう", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"🛸", text:[
"天野空夫は、けんかには弱いけれど、冒険が大好きな少年でした。",
"ある日、空夫は宇宙人のモジャラと、ロボットのドンモに出会います。",
"「こんな退屈な地球なんて出ていこう！」",
"三人はポンコツの宇宙船に乗り、宇宙へ家出することにしました。",
"ところが、宇宙旅行は楽しいことばかりではありません。",
"時間の流れ方がおかしい星、死ぬことを忘れた人々の星、恐ろしい生き物のいる星など、行く先々でとんでもない事件に巻きこまれます。",
"空夫たちは毎回「もうだめだ！」というほどの危険にあいますが、モジャラの不思議な力やドンモの知恵を使い、なんとか切り抜けます。",
"宇宙へ出てみると、「当たり前」だと思っていた地球の暮らしが、じつはとても不思議なものだったと気づきます。",
"少年三人組が、笑ったり、こわがったりしながら宇宙を旅する、ちょっと変わった冒険物語です。"
]},
{ cat:"m_sf", title:"ミノタウロスの皿", yomi:"ミノタウロスのさら", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"🐂", text:[
"宇宙を旅していた青年が、知らない星へ不時着しました。",
"そこには、人間とそっくりの姿をした「ズン類」という生き物と、牛のような顔をした「ミノア」という生き物が暮らしていました。",
"青年は最初、「人間のようなズン類が、この星の主人なのだろう」と思います。",
"ところが反対でした。",
"この星ではミノアが人間のように暮らし、ズン類は家畜として育てられていたのです。",
"青年はミイナというズン類の少女と仲よくなります。しかしミイナは、大きなお祭りで食べられる「皿」に選ばれていました。",
"青年は「逃げよう！　食べられてしまうんだよ！」と必死に言います。",
"けれどもミイナは、「それはとても名誉なことよ」と笑います。",
"青年にとって恐ろしいことが、この星では当たり前なのです。",
"青年は最後までミイナを救えませんでした。",
"「当たり前だと思っていることも、立場が変わればまったく違って見える」。そんな少しこわいことを教えてくれるSFのお話です。"
]},
{ cat:"m_sf", title:"流血鬼", yomi:"りゅうけつき", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"🧛", text:[
"ある日、世界中に不思議なウイルスが広がりました。",
"ウイルスにかかった人は肌が白くなり、夜に活動し、人の血を吸うようになります。",
"人々は彼らを「吸血鬼だ」と恐れました。",
"主人公の少年も、友だちといっしょに山へ逃げます。",
"家族も友だちも、次々と吸血鬼になっていきます。それでも少年は、「自分だけは普通の人間のままでいるぞ」と抵抗します。",
"ところが、少年が怪物だと思っていた「吸血鬼」たちは、じつは病気になりにくく、傷も治りやすい新しい人類でした。",
"世界のほとんどの人が、新人類へ変わっていたのです。",
"最後には少年も、好きだった少女に血を吸われ、新人類になります。",
"目を覚ました少年は、夜の世界がとても明るく美しく見えることに気づきます。",
"「怪物になってしまった」と思っていたものは、本当に怪物だったのでしょうか。",
"見る側が変われば、「普通」と「異常」も入れかわってしまうという、不思議な物語です。"
]},
{ cat:"m_sf", title:"未来の想い出", yomi:"みらいのおもいで", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"⏰", text:[
"納戸理人は、四十歳近くになった漫画家でした。",
"昔は売れたこともありましたが、今は仕事もうまくいかず、「若いころに戻って人生をやり直せたらなあ」と思っています。",
"そんなある日、納戸は突然死んでしまいます。",
"ところが次に目を覚ますと、二十歳の自分に戻っていました。",
"「これから何が流行るのか、どの漫画が売れるのか、全部知っているぞ！」",
"納戸は未来の知識を使い、今度こそ幸せな人生を送ろうとします。",
"けれども、未来を知っているからといって、すべてが思いどおりになるわけではありません。",
"大切な人との出会いや別れまで、同じようにやってきます。",
"人生を何度やり直しても、「成功したい」という気持ちだけでは本当の幸せに届きません。",
"最後に納戸は、自分の運命そのものと向き合います。",
"「人生でいちばん大切なのは、成功することなのか。それとも、大切な人と生きることなのか」。そんなことを考えさせてくれる物語です。"
]},
{ cat:"m_sf", title:"ウルトラ・スーパー・デラックスマン", spine:"ウルトラ・|スーパー・|デラックスマン", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"🦸", text:[
"句楽兼人は、どこにでもいる普通の会社員でした。",
"句楽は正義感が強く、「世の中には悪いことが多すぎる」といつも怒っていました。",
"ある日、句楽の体に不思議な変化が起きます。",
"空を飛び、とてつもない力を出し、どんな攻撃を受けても平気な超人になったのです。",
"句楽は「ウルトラ・スーパー・デラックスマン」となり、悪人をやっつけ始めます。",
"最初、人々は喜びました。",
"しかし句楽は、だんだん「自分が正しいと思うことは、全部正しい」と考えるようになります。",
"少し気に入らない人まで悪人と決めつけ、自分に逆らう人を力でおさえつけるようになります。",
"ついには、人々から「正義の味方」ではなく「こわい怪物」と思われるようになりました。",
"ところが、どんな武器でも倒せなかった句楽も、病気には勝てません。",
"あまりにも大きな力を持った人間が、「自分だけが正しい」と思い始めたらどうなるのか。",
"そんな怖さを描いたお話です。"
]},
{ cat:"m_history", title:"佐武と市捕物控", spine:"佐武と市|捕物控", yomi:"さぶといちとりものひかえ", sub:"石ノ森章太郎", author:"石ノ森章太郎", authorYomi:"いしのもりしょうたろう", icon:"🏮", text:[
"江戸の町に、佐武という若い下っ引きがいました。",
"佐武は十手と縄を使って悪人を捕まえるのが得意です。",
"その佐武といつもいっしょにいるのが、市という盲目の按摩師でした。",
"市は目が見えません。でも耳や気配を感じる力はとても鋭く、仕込み杖を使えばものすごい剣の達人です。",
"二人は、江戸で起こる殺人や盗み、武士たちの陰謀など、さまざまな事件を追いかけます。",
"佐武は若くてまっすぐなので、ときには怒って失敗することもあります。",
"そんなとき、市は静かに話を聞き、事件の本当の姿を見せてくれます。",
"犯人にも悲しい事情があることがあります。",
"事件を解決しても、すべてがめでたしめでたしとは限りません。",
"江戸という大きな町で、人のやさしさや欲、悲しみを見つめながら、佐武と市が今日も悪を追う捕物物語です。"
]},
{ cat:"m_art", title:"ジュン", sub:"石ノ森章太郎", author:"石ノ森章太郎", authorYomi:"いしのもりしょうたろう", icon:"🎈", text:[
"ジュンという一人の少年がいます。",
"でもこの漫画には、普通の冒険漫画のように、「悪者が現れて、それを倒す」という決まったお話はあまりありません。",
"ジュンが町を歩いたり、女の子を見たり、空や花をながめたりすると、その気持ちが絵になって広がっていきます。",
"うれしい日には世界が明るく見えます。",
"さびしい日には、同じ町なのにとても冷たく見えます。",
"人を好きになる気持ち、ひとりぼっちの気持ち、大人になることへの不安。",
"そうした、言葉ではうまく説明できない少年の心を、絵そのものを使って見せていきます。",
"だから『ジュン』は、「ジュンが何をしたか」という物語より、「ジュンが世界をどう感じたか」を読む漫画です。",
"一人の少年の心の中を、そっとのぞいてみるような、不思議で詩のような作品です。"
]},
{ cat:"m_sf", title:"009ノ1", yomi:"ゼロゼロナインワン", sub:"石ノ森章太郎", author:"石ノ森章太郎", authorYomi:"いしのもりしょうたろう", icon:"🕶️", text:[
"未来の世界では、大きな国々が「ウエスト」と「イースト」という二つの陣営に分かれ、スパイどうしが秘密の戦いを続けていました。",
"ウエスト側には、ミレーヌ・ホフマンという女性スパイがいます。",
"コードネームは「009ノ1」。",
"ミレーヌの体には特別な機械が組みこまれていて、普通の人にはできないような力を出すことができます。",
"その力を使い、盗まれた秘密を取り返したり、敵の基地へ入りこんだり、科学者を助けたりします。",
"けれどもスパイの世界では、「こちらが正義で、向こうが悪」と簡単には決められません。",
"昨日の味方が今日の敵になることもあります。",
"任務を成功させても、大切な人を失うこともあります。",
"ミレーヌは冷静なスパイとして戦いますが、その心まで機械になったわけではありません。",
"冷たい国どうしの争いの中で、一人の女性が人間らしさを失わず生きようとする物語です。"
]},
{ cat:"m_sf", title:"幻魔大戦", yomi:"げんまたいせん", sub:"原作：平井和正　作画：石ノ森章太郎", author:"平井和正／石ノ森章太郎", authorYomi:"ひらいかずまさ", icon:"💫", text:[
"宇宙には、「幻魔」という恐ろしい存在がいました。",
"幻魔は星や文明を次々と滅ぼし、ついに地球へ近づいてきます。",
"それを知ったルーナ姫と、宇宙から来たサイボーグ戦士ベガは、地球を守るために超能力を持つ人々を探し始めます。",
"その一人が、東丈という高校生でした。",
"丈は自分に特別な力があることを知りませんでしたが、戦いの中で少しずつ強大な超能力に目覚めていきます。",
"しかし幻魔はあまりにも強く、町は壊れ、富士山は噴火し、東京も砂におおわれていきます。",
"丈たちは世界中の超能力者と力を合わせます。",
"「一人の力では勝てなくても、みんなの心を合わせれば何かできるかもしれない」。",
"人類と幻魔の戦いは、地球だけではなく宇宙全体の運命をかけた戦いへ広がっていきます。",
"最後まで安心できる「大勝利」ではなく、世界の終わりそのものを感じさせる大きな物語です。"
]},
{ cat:"m_sf", title:"リュウの道", yomi:"リュウのみち", sub:"石ノ森章太郎", author:"石ノ森章太郎", authorYomi:"いしのもりしょうたろう", icon:"🛤️", text:[
"柴田リュウという少年は、宇宙船の中で長い眠りについていました。",
"ある日目を覚ますと、宇宙船は知らない星へ着いています。",
"ところが、そこは知らない星ではありませんでした。",
"長い年月がたち、文明が滅び、大きく姿を変えてしまった未来の地球だったのです。",
"リュウは荒れ果てた世界を旅します。",
"そこには昔の人類の子孫や、不思議な生き物、新しい文明がありました。",
"「昔の人間は、どうしてこんな世界を残したのだろう」。",
"リュウは過去の文明が残したものを調べながら、人間が何度も同じ争いをくり返していることを知ります。",
"やがて話は地球だけではなく、宇宙からやってきた存在との戦いにも広がります。",
"リュウが探しているのは、ただ家へ帰る道ではありません。",
"「人間はこれから、どんな道を歩けばいいのか」。",
"その答えを探しながら、未来の地球を進んでいく壮大なSF物語です。"
]},
{ cat:"m_sf", title:"番長惑星", yomi:"ばんちょうわくせい", sub:"石ノ森章太郎", author:"石ノ森章太郎", authorYomi:"いしのもりしょうたろう", icon:"🪐", text:[
"等々力リュウは、けんかでは負け知らずの元気な少年でした。",
"ある日、追われて木の穴へ逃げこみ、そこから外へ出てみると、町のようすがどこか変です。",
"じつはリュウは、自分の世界とよく似た別の世界――「パラレルワールド」へ入りこんでしまったのです。",
"しかも二つの世界にいた「もう一人のリュウ」と一つになり、普通の人より強い力を持つようになります。",
"その世界では、夜になると「シャドウ」と呼ばれる謎の存在が人々を支配していました。",
"リュウは「こんなのはおかしい」と仲間を集め、シャドウの正体を調べ始めます。",
"イースター島やアンデスなど、世界中の古代遺跡をめぐるうち、人間の歴史そのものに隠された秘密へ近づいていきます。",
"ただのけんか好きだった少年が、いつしか二つの世界を守るために戦うことになる、大きな冒険のお話です。"
]},
{ cat:"m_sf", title:"ザ・ムーン", sub:"ジョージ秋山", author:"ジョージ秋山", authorYomi:"じょーじあきやま", icon:"🌝", text:[
"ある日、九人の子どもたちの前に、巨大なロボットが現れました。",
"名前は「ザ・ムーン」。",
"大金持ちの魔魔男爵が、「世の中の悪と戦うため」に作ったロボットでした。",
"でもザ・ムーンは、一人では動かせません。",
"九人の子どもたちの心がぴったり一つになったときだけ、動くのです。",
"子どもたちは、「正義のためなら、この力を使っていい」と考えます。",
"ところが敵として現れる人たちも、「自分たちこそ正義だ」と言います。",
"悪い人を倒したつもりなのに、かえってたくさんの人が苦しむこともあります。",
"「力が強ければ正しいの？」",
"「正義のためなら、何をしてもいいの？」",
"子どもたちは、巨大ロボットを動かすたびに悩むようになります。",
"ロボット漫画の形をしていますが、本当に描かれているのは、「正義とは何だろう」という、とても難しい問題です。"
]},
{ cat:"m_battle", title:"ワイルド7", yomi:"ワイルドセブン", sub:"望月三起也", author:"望月三起也", authorYomi:"もちづきみき", icon:"🏍️", text:[
"日本に、普通の警察では捕まえることが難しい悪人たちがいました。",
"そこで警察は、とんでもないチームをつくります。",
"集められたのは、元犯罪者や問題を起こした七人の男たち。",
"その名も「ワイルド7」です。",
"リーダーの飛葉大陸たちは、オートバイに乗り、銃を持ち、普通の警察官ではできないような危険な作戦へ向かいます。",
"相手は強盗団、殺し屋、巨大な犯罪組織。",
"ときには国そのものを揺らすような事件にも巻きこまれます。",
"ワイルド7のメンバーは、もともと立派な人ばかりではありません。",
"でも、自分よりもっと悪い者から人々を守るため、命をかけて戦います。",
"「悪人だった人でも、正しいことはできるのか」。",
"そんな少し変わった正義のチームが、大きなバイクで走り抜けるアクション物語です。"
]},
{ cat:"m_battle", title:"男一匹ガキ大将", spine:"男一匹|ガキ大将", yomi:"おとこいっぴきガキだいしょう", sub:"本宮ひろ志", author:"本宮ひろ志", authorYomi:"もとみやひろし", icon:"👊", text:[
"戸川万吉は、けんかが強くて、とても負けず嫌いな少年です。",
"小さな町のガキ大将だった万吉には、たくさんの仲間がついてきます。",
"万吉は「男なら、やると決めたことは最後までやるんだ」と、どんな強い相手にも向かっていきます。",
"最初は町の不良とのけんかだったのが、やがて学校、町、会社、そして大きな社会の争いへ広がっていきます。",
"万吉のまわりには、「こいつについていきたい」と思う人がどんどん集まります。",
"もちろん万吉は失敗もします。",
"自分の勢いだけではどうにもならない壁にもぶつかります。",
"それでも転んだら立ち上がり、仲間を守るために前へ進みます。",
"小さなガキ大将だった少年が、人の心をひきつける大きな男へ育っていく、熱い青春物語です。"
]},
{ cat:"m_gag", title:"ハレンチ学園", yomi:"ハレンチがくえん", sub:"永井豪", author:"永井豪", authorYomi:"ながいごう", icon:"🏫", text:[
"ハレンチ学園という、とても変わった学校がありました。",
"そこには、まじめに授業をするより、いたずらや騒ぎを起こすことが大好きな生徒と先生が集まっています。",
"山岸八十八、通称「山岸くん」や、十兵衛たちは、先生とけんかをしたり、学校中を走り回ったり、毎日のように大騒ぎをします。",
"先生たちも負けてはいません。",
"生徒を困らせようとして、逆に自分たちがひどい目にあうこともあります。",
"最初は学校を舞台にした、めちゃくちゃなギャグ漫画でした。",
"ところが物語が進むと、学校と大人たちの争いはどんどん大きくなります。",
"そして最後には、まるで戦争のような大騒動にまで発展します。",
"「学校では子どもはおとなしくしていなさい」という当時の考え方を、思いきりひっくり返した、とても自由で、ちょっと危ない学園漫画です。"
]},
{ cat:"m_gag", title:"ど根性ガエル", yomi:"どこんじょうガエル", sub:"吉沢やすみ", author:"吉沢やすみ", authorYomi:"よしざわやすみ", icon:"🐸", text:[
"中学生のひろしが公園を歩いていると、ピョン吉というカエルをうっかり踏んでしまいました。",
"ところがカエルは死にません。",
"なんと、ひろしのシャツの胸のところに、ぺったんこになって張りついてしまったのです。",
"しかもピョン吉はしゃべります。",
"「ひろし！　しっかりしろ！」",
"こうして、人間のひろしと、シャツの中のカエル・ピョン吉の奇妙な生活が始まりました。",
"ひろしは京子ちゃんが大好きですが、すぐ調子に乗って失敗します。",
"ピョン吉はそんなひろしを怒ったり、助けたりします。",
"ゴリライモ、五郎、梅さん、先生たちも加わり、町では毎日のように大騒ぎです。",
"でも、ひろしが本当に困ったとき、ピョン吉はいつも味方です。",
"人間とカエルなのに、いつのまにか本当の兄弟のようになっていく、にぎやかであたたかい物語です。"
]},
{ cat:"m_fight", title:"柔道一直線", yomi:"じゅうどういっちょくせん", sub:"原作：梶原一騎　作画：永島慎二", author:"梶原一騎／永島慎二", authorYomi:"かじわらいっき", icon:"🥋", text:[
"一条直也は、柔道に打ちこむ少年でした。",
"直也の父は、外国の強い柔道家との戦いに敗れ、その無念を残して亡くなります。",
"「もっと強くなりたい」。",
"直也は、その思いを胸に柔道の修業を始めます。",
"師匠となるのは、「鬼車」と呼ばれる厳しい柔術家でした。",
"修業はとてもきびしく、何度も投げられ、何度も倒されます。",
"それでも直也はあきらめません。",
"強いライバルが現れるたび、自分だけの新しい技を考え、また立ち上がります。",
"けれども、柔道はただ相手を投げればいいものではありません。",
"勝つことばかり考えると、自分の心まで負けてしまうことがあります。",
"直也は戦いを重ねながら、「本当に強い人とは、どんな人なのだろう」と学んでいきます。"
]},
{ cat:"m_fight", title:"空手バカ一代", yomi:"からてバカいちだい", sub:"原作：梶原一騎　作画：つのだじろう・影丸譲也", author:"梶原一騎／つのだじろう・影丸譲也", authorYomi:"かじわらいっき", icon:"👊", text:[
"戦争が終わった日本に、大山倍達という若い男がいました。",
"戦争から帰ってきた大山は、「これから自分は何のために生きればいいのだろう」と悩んでいました。",
"そして選んだ道が、空手でした。",
"山の中で一人きりになり、毎日毎日、拳を鍛えます。",
"木を打ち、石を割り、自分の弱い心とも戦います。",
"やがて大山は大会へ出て、さまざまな武道家と戦うようになります。牛と戦ったり、海外へ渡って強い格闘家へ挑んだりもします。",
"そして自分だけが強くなるのではなく、弟子たちを育て、空手を世界へ広げようとします。",
"弟子たちも日本や海外で強敵に挑みます。",
"一人の青年が「世界でいちばん強くなりたい」と願い、修業を重ねながら、自分の空手をつくり上げていく物語です。"
]},
{ cat:"m_love", title:"愛と誠", yomi:"あいとまこと", sub:"原作：梶原一騎　作画：ながやす巧", author:"梶原一騎／ながやす巧", authorYomi:"かじわらいっき", icon:"💔", text:[
"早乙女愛は、お金持ちの家で育ったやさしい少女でした。",
"子どものころ、愛が山で危険な目にあったとき、一人の少年が助けてくれました。",
"少年の名は太賀誠。",
"でも誠は、そのときのけがやその後の人生のせいで、荒れた不良少年になっていました。",
"何年もたって再会した愛は、「今度は私が誠を助けたい」と思います。",
"誠がどれだけ冷たくしても、悪い仲間とつきあっていても、愛は離れません。",
"「あなたは本当は、悪い人じゃない」。",
"愛はそう信じ続けます。",
"誠も最初は愛を追いはらおうとしますが、だんだん彼女のまっすぐな気持ちに心を動かされていきます。",
"けれども二人を待っていたのは、簡単な幸せではありません。",
"争いと悲しい運命の中で、最後まで相手を思い続ける二人。",
"題名のとおり、「愛」と「誠」を最後まで問い続ける、激しい恋の物語です。"
]},
{ cat:"m_battle", title:"男組", yomi:"おとこぐみ", sub:"原作：雁屋哲　作画：池上遼一", author:"雁屋哲／池上遼一", authorYomi:"かりやてつ", icon:"✊", text:[
"流全次郎という少年は、少年刑務所に入れられていました。",
"全次郎はけんかがとても強く、どんな相手にも頭を下げません。",
"そんな全次郎が知ったのは、神竜剛次という男が、学校だけでなく町の大人たちまで自分の力で支配しようとしていることでした。",
"全次郎は学校へ戻り、神竜へ戦いを挑みます。",
"仲間たちも集まり、「男組」として神竜たちに立ち向かいます。",
"最初は学校の中の争いに見えました。",
"けれども神竜の力は、政治家や大企業にまでつながっています。",
"全次郎たちの戦いも、だんだん社会全体を相手にするものへ変わります。",
"「力を持つ人間が好き勝手にしていいのか」。",
"全次郎は自分の拳と仲間を信じ、巨大な権力へ真正面からぶつかっていくのです。"
]},
{ cat:"m_daily", title:"750ライダー", yomi:"ななはんライダー", sub:"石井いさみ", author:"石井いさみ", authorYomi:"いしいいさみ", icon:"🏍️", text:[
"早川光は、高校生です。",
"光が大好きなのは、750ccの大きなオートバイ。",
"学校が終わるとバイクに乗り、町や海辺を走ります。",
"光には委員長と呼ばれる女の子や、学校の友だち、バイク仲間がいます。",
"ときにはけんかをしたり、恋に悩んだり、進路を考えたりします。",
"大きな悪者を倒す物語ではありません。",
"友だちと喫茶店で話したり、好きな人を後ろに乗せて走ったり、夕方の道路を一人で帰ったり。",
"そんな高校生の毎日が、ゆっくりと描かれます。",
"最初のころの光は少し不良っぽい少年でしたが、仲間や恋を通してだんだんやさしい青年になっていきます。",
"バイクのエンジンの音といっしょに、少年から大人へ少しずつ近づいていく青春のお話です。"
]},
{ cat:"m_horror", title:"魔太郎がくる!!", yomi:"またろうがくる", sub:"藤子不二雄Ⓐ", author:"藤子不二雄Ⓐ", authorYomi:"ふじこふじおエー", icon:"😈", text:[
"浦見魔太郎は、気が弱くておとなしい中学生でした。",
"そのため学校では、いじめっ子たちから何度もひどい目にあわされます。",
"魔太郎は最初、ずっとがまんしています。",
"でも、どうしても許せないほどひどいことをされると、心の中でこう言います。",
"「このうらみ、はらさでおくべきか」。",
"すると魔太郎は、不思議な力や魔術を使い、いじめた相手へ仕返しをします。",
"相手は自分がしたことよりもっと恐ろしい目にあい、魔太郎をこわがるようになります。",
"けれども魔太郎は、ただ人を苦しめるのが好きなわけではありません。",
"ふだんは友だちがほしい、ごく普通の少年です。",
"「弱い人をいじめると、その人の心には何が残るのだろう」。",
"少しこわい復讐のお話を通して、そんなことを考えさせる物語です。"
]},
{ cat:"m_horror", title:"恐怖新聞", yomi:"きょうふしんぶん", sub:"つのだじろう", author:"つのだじろう", authorYomi:"つのだじろう", icon:"📰", text:[
"鬼形礼という少年の家へ、ある夜、新聞が飛びこんできました。",
"でも、それは普通の新聞ではありません。",
"そこには、まだ起きていない未来の事件が書かれていました。",
"新聞の名前は「恐怖新聞」。",
"しかも一度読むたび、鬼形の寿命は百日ずつ短くなるというのです。",
"「もう読みたくない」。",
"鬼形は新聞を捨てたり、燃やしたりします。",
"でも夜になると、また新聞が届きます。",
"そしてそこに書かれた事故や死は、本当に起きてしまいます。",
"鬼形は「未来を知っているなら、助けられる人もいるかもしれない」と、事件を止めようとします。",
"けれども運命は簡単には変えられません。",
"だんだん鬼形自身の命も少なくなっていきます。",
"未来を知ることは幸せなのか、それとも知らないほうが幸せなのか。",
"そんな怖い問いを描いたホラー漫画です。"
]},
{ cat:"m_horror", title:"うしろの百太郎", yomi:"うしろのひゃくたろう", sub:"つのだじろう", author:"つのだじろう", authorYomi:"つのだじろう", icon:"👤", text:[
"一太郎という少年には、ほかの人には見えないものが見えることがありました。",
"幽霊や、説明できない不思議なものです。",
"そんな一太郎のそばには、「百太郎」という守護霊が現れます。",
"百太郎は、悪い霊や危険なものから一太郎を守ってくれます。",
"一太郎は心霊現象を調べる大人たちといっしょに、幽霊屋敷や不思議な事件へ関わるようになります。",
"「これは本当に幽霊なの？」",
"「人間の思いこみではないの？」",
"ひとつずつ調べていくと、本物の霊であることもあれば、人間が起こしたことだとわかる場合もあります。",
"こわいものをただ「こわい」で終わらせず、「なぜこんなことが起きるのだろう」と考えていきます。",
"少年と守護霊が、生きている人と死んだ人のあいだにある不思議な世界を歩く物語です。"
]},
{ cat:"m_horror", title:"エコエコアザラク", sub:"古賀新一", author:"古賀新一", authorYomi:"こがしんいち", icon:"🕯️", text:[
"黒井ミサは、黒い髪をした不思議な少女です。",
"一見すると普通の女子学生ですが、ミサは「黒魔術」を使うことができます。",
"学校や町では、いじめ、人をだますこと、欲ばかり考えることなど、さまざまな悪意が起こります。",
"そんなとき、ミサは魔術を使います。",
"でも、ミサがいつも「正義のヒロイン」として人を助けるわけではありません。",
"ときには善人のように見えた人に恐ろしい秘密があり、悪人だと思った人にも悲しい事情があります。",
"魔術を使えば、願いがかなうこともあります。",
"でも、その願いには必ず代わりに失うものがあります。",
"「人を呪えば、その呪いは自分にも返ってくる」。",
"そんな暗く不思議な世界を、黒井ミサが静かに歩いていくホラー物語です。"
]},
{ cat:"m_horror", title:"妖怪ハンター", yomi:"ようかいハンター", sub:"諸星大二郎", author:"諸星大二郎", authorYomi:"もろほしだいじろう", icon:"⛩️", text:[
"稗田礼二郎は、大学で古い歴史や伝説を研究している学者です。",
"でも稗田が調べるものは、普通の学者があまり信じないようなものばかりでした。",
"村に伝わる神さま、古いお祭り、不思議な石、妖怪の話。",
"「昔話だと思われているものに、本当に何かが隠れているのではないか」。",
"稗田はそう考え、各地を歩きます。",
"すると、ただの伝説だと思っていたものが、本当に姿を現すことがあります。",
"古代から眠っていた生き物や、人間とはまったく違う神のような存在。",
"稗田は怪物を力で倒すヒーローではありません。",
"古い本や遺跡を調べ、「これはいったい何なのか」を知ろうとします。",
"人間の歴史よりもっと古いところに、まだ私たちの知らない世界が残っているのかもしれない。",
"そんな不気味で壮大な物語です。"
]},
{ cat:"m_horror", title:"暗黒神話", yomi:"あんこくしんわ", sub:"諸星大二郎", author:"諸星大二郎", authorYomi:"もろほしだいじろう", icon:"🐍", text:[
"山門武という少年には、幼いころ亡くなった父にまつわる秘密がありました。",
"武は日本の各地を旅するうち、古い神話や遺跡、自分の体にある不思議な印が、すべてつながっていることに気づきます。",
"日本神話、仏教、古代の星の話。",
"まったく別々に見える伝説が、じつは一つの大きな秘密を語っていたのです。",
"武は自分が、普通の少年ではない運命を持っていることを知ります。",
"そして地球だけではなく、宇宙そのものに関わるほど大きな存在へ近づいていきます。",
"「昔の人が神さまと呼んでいたものは、本当は何だったのだろう」。",
"小さな少年の旅から始まり、最後には宇宙の始まりや終わりまで広がっていく、とても大きな神話の物語です。"
]},
{ cat:"m_horror", title:"孔子暗黒伝", yomi:"こうしあんこくでん", sub:"諸星大二郎", author:"諸星大二郎", authorYomi:"もろほしだいじろう", icon:"☯️", text:[
"むかし、中国に孔子という有名な思想家がいました。",
"孔子は弟子たちと旅をしながら、「人はどう生きればよいのか」「よい国とは何か」を考えていました。",
"一方、日本やアジアのさまざまな土地でも、不思議な出来事が起こります。",
"古い神々、奇妙な民族、星の動き。",
"最初は関係がなさそうに見える話が、少しずつ一つにつながっていきます。",
"孔子が考えていた人間の世界のすぐ向こうには、人間には理解できない大きな宇宙のしくみがありました。",
"歴史、神話、宗教、宇宙。",
"いろいろなものを混ぜながら、「人間は、この大きな世界の中でどんな存在なのだろう」と問いかけます。",
"孔子の伝記というより、中国の昔を入口にして宇宙の秘密へ入っていく、不思議なSF神話です。"
]},
{ cat:"m_horror", title:"富江", yomi:"とみえ", sub:"伊藤潤二", author:"伊藤潤二", authorYomi:"いとうじゅんじ", icon:"💋", text:[
"富江という、とても美しい少女がいました。",
"富江を見た人は、なぜか彼女に強くひかれます。",
"「富江を自分だけのものにしたい」。",
"そう思う気持ちはだんだん大きくなり、ついには富江を傷つけてしまう人まで現れます。",
"ところが富江は死にません。",
"体のほんの一部が残っていれば、そこからまた新しい富江が生まれてくるのです。",
"一人だったはずの富江が、二人、三人と増えていきます。",
"しかも富江どうしも、「自分こそ本物」と憎み合います。",
"富江のまわりにいる人々は、彼女への愛や欲にのみこまれ、だんだん普通ではなくなっていきます。",
"「美しいものを自分だけのものにしたい」という人間の気持ちが、どこまでも恐ろしく大きくなっていくホラー物語です。"
]},
{ cat:"m_horror", title:"うずまき", sub:"伊藤潤二", author:"伊藤潤二", authorYomi:"いとうじゅんじ", icon:"🌀", text:[
"海辺の小さな町・黒渦町に、五島桐絵という少女が住んでいました。",
"ある日、恋人の秀一が言います。",
"「この町は、うずまきに呪われている」。",
"最初、桐絵は何を言っているのかわかりません。",
"でも町では、だんだんおかしなことが起こり始めます。",
"人がうずまきに夢中になったり、体そのものがねじれてしまったり、髪の毛がうずを巻いて人を操ったりします。",
"やがて町全体が、逃げられない大きなうずまきの中へ巻きこまれていきます。",
"桐絵と秀一は町から逃げようとしますが、何度進んでも元へ戻されてしまいます。",
"最後には、町の地下にとてつもなく古い「うずまき」の秘密があることを知ります。",
"なぜうずまきが人を呼ぶのか、その本当の理由は最後まではっきりわかりません。",
"ただ、黒渦町では昔から何度も同じことがくり返されていたのです。"
]},
{ cat:"m_horror", title:"ギョ", sub:"伊藤潤二", author:"伊藤潤二", authorYomi:"いとうじゅんじ", icon:"🐟", text:[
"沖縄へ旅行に来た忠と華織は、海からとても変なものがやってくるのを見つけます。",
"魚なのに、地面を歩いているのです。",
"魚の体には、金属のような足がついていました。",
"しかも、とてもいやなにおいを出しています。",
"歩く魚はどんどん増え、やがて海から巨大なサメやクジラまで上がってきます。",
"原因を調べると、昔つくられた不思議な機械と、死んだ生き物から出るガスが関係していることがわかります。",
"そして今度は、魚だけではなく人間まで機械につながれ、歩き始めます。",
"忠は華織を助けようと必死になりますが、世界はどんどん奇妙なものへ変わっていきます。",
"「死んだものが、機械によって動き続けたらどうなるのだろう」。",
"そんな悪夢のような世界を描いたホラーです。"
]},
{ cat:"m_horror", title:"不安の種", yomi:"ふあんのたね", sub:"中山昌亮", author:"中山昌亮", authorYomi:"なかやままさあき", icon:"👁️", text:[
"夜、一人で家へ帰っているとき。",
"ふと後ろから、だれかに見られているような気がしたことはありませんか。",
"『不安の種』には、そんな小さな「なんだかこわい」がたくさん出てきます。",
"道の向こうに立っている人。",
"窓の外からのぞく顔。",
"いつも同じ場所にいる、何なのかわからないもの。",
"でも、この漫画では「この怪物は何者なのか」を説明してくれないことが多いのです。",
"主人公も毎回変わります。",
"普通の会社員だったり、学生だったり、子どもだったりします。",
"ほんの数ページで終わる話もあります。",
"「理由がわかれば安心できる。でも、理由がわからないからこそ、ずっと気になる」。",
"日常のすぐとなりにある小さな恐怖を集めた、短い怪談集のような漫画です。"
]},
{ cat:"m_sf", title:"ゲッターロボ", sub:"原作：永井豪　作画：石川賢", author:"永井豪／石川賢", authorYomi:"ながいごう", icon:"🤖", text:[
"早乙女博士は、人類を守るため「ゲッターロボ」という巨大ロボットをつくっていました。",
"ゲッターロボは、三つの飛行機が合体してできる不思議なロボットです。",
"乗るのは流竜馬、神隼人、巴武蔵の三人。",
"三人の心と動きが合わなければ、うまく戦うことができません。",
"そこへ地底から「恐竜帝国」が現れます。",
"昔、地球を支配していた恐竜たちの子孫が、人間から地上を取り戻そうと攻めてきたのです。",
"竜馬たちは何度も強い敵と戦います。",
"荒っぽい竜馬、冷静な隼人、やさしい武蔵。",
"性格はばらばらですが、戦ううちに本当の仲間になっていきます。",
"最後の大きな戦いでは、武蔵が仲間と地球を守るため命をかけます。",
"その思いは、新しいゲッターロボと次の仲間たちへ受けつがれていくのです。"
]},
{ cat:"m_sf", title:"キューティーハニー", sub:"永井豪", author:"永井豪", authorYomi:"ながいごう", icon:"💖", text:[
"如月ハニーは、明るく元気な女の子でした。",
"でもハニーには、自分でも知らなかった秘密があります。",
"じつはハニーは、人間そっくりにつくられたアンドロイドだったのです。",
"ハニーの父・如月博士は、空気からさまざまな物をつくり出せる「空中元素固定装置」をハニーの体に入れていました。",
"その力をねらって、「パンサークロー」という悪の組織が博士を襲います。",
"父を失ったハニーは、パンサークローと戦うことを決めます。",
"「ハニーフラッシュ！」",
"そう叫ぶと、ハニーはさまざまな服や姿へ変身できます。",
"最後には剣を持つ戦士「キューティーハニー」となって悪と戦います。",
"自分は人間ではないと知っても、泣いたり、笑ったり、誰かを大切に思ったりする心は変わりません。",
"「人間らしさは体ではなく心にある」。そんな少女ヒーローの物語です。"
]},
{ cat:"m_battle", title:"バイオレンスジャック", spine:"バイオレンス|ジャック", sub:"永井豪", author:"永井豪", authorYomi:"ながいごう", icon:"⚡", text:[
"ある日、日本の関東地方を、とてつもなく大きな地震が襲いました。",
"東京も町も道路も壊れ、関東は外の世界から切り離されてしまいます。",
"法律も警察もなくなった土地では、力の強い者たちが人々を支配し始めます。",
"そんな荒れ果てた世界に、巨大な男が現れます。",
"名前はバイオレンスジャック。",
"ものすごく強く、悪人には恐ろしいほどきびしい男ですが、弱い人を助けることもあります。",
"ジャックは、町から町へ旅をしながら、さまざまな人の戦いに関わります。",
"大きな敵となるのは、関東を支配しようとするスラムキング。",
"物語が進むにつれ、この世界そのものに、永井豪の別作品『デビルマン』につながる驚くべき秘密が隠されていることもわかってきます。",
"世界が壊れても、それでも人はどう生きるのかを描く、とても激しい物語です。"
]},
