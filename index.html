const FOOTER_NOTE = "むかしばなしや世界の民話は、むかしから人から人へと語りつがれてきたので、地方や国、本によって、お話が少しずつちがうことがあります。「名作どうわ」や「きょうかしょ」のおはなしは、作者の作品をもとに、子ども向けにまとめたあらすじです。ぜひ、本物の本でも読んでみてね。";
</script>

<!-- ============================================================
  ここから下は しくみ（ふだんは さわらなくて だいじょうぶ）
============================================================ -->
<!-- さいしょの がめん -->
<div id="home">
  <header class="hero">
    <p class="hero-small" id="heroSmall"></p>
    <h1 id="heroTitle" style="position:absolute;left:-9999px"></h1>
    <ul class="blocks" id="heroBlocks" aria-hidden="true"></ul>
    <p class="hero-lead" id="heroLead"></p>
  </header>
  <main class="groups" id="groups"></main>
</div>

<!-- ほんだなの がめん -->
<div id="view" hidden>
  <nav class="genre-nav" aria-label="たなへ ジャンプ">
    <div class="viewbar">
      <button class="back" id="backBtn" type="button">‹ もどる</button>
      <h2 class="view-title" id="viewTitle"></h2>
    </div>
    <ul id="genreNav"></ul>
  </nav>
  <main id="viewMain">
    <div class="modes" id="modes"></div>
    <div id="shelves"></div>
  </main>
</div>

<footer id="footer"></footer>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <div class="sheet-scroll" id="sheetScroll">
      <div class="sheet-head" id="sHead">
        <div class="big-ico" id="sIcon" aria-hidden="true"></div>
        <div class="head-text">
          <p class="head-yomi" id="sYomi"></p>
          <h2 class="head-title" id="sTitle"></h2>
          <p class="head-sub" id="sSub" hidden></p>
        </div>
        <button class="close" id="sClose" type="button">とじる</button>
      </div>
      <article class="story" id="sText"></article>
      <p class="fin"><span id="sFin"></span></p>
      <div class="pager">
        <button class="prev" id="sPrev" type="button"><span class="dir">‹ まえのおはなし</span><span class="nt" id="sPrevT"></span></button>
        <button class="next" id="sNext" type="button"><span class="dir">つぎのおはなし ›</span><span class="nt" id="sNextT"></span></button>
      </div>
      <div class="sheet-pad"></div>
    </div>
  </div>
</div>

<script>
(function(){
  // ちいさな おてつだい
  const $ = (id) => document.getElementById(id);
  const catById = {};
  CATEGORIES.forEach(c => catById[c.id] = c);

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // いま ひらいている ほんだなの じゅんばん（まえ・つぎの おはなしに つかう）
  let ordered = [];
  // ---- タイトル ----
  $("heroSmall").textContent = SITE.small;
  $("heroTitle").textContent = SITE.small + SITE.title;
  const blockColors = CATEGORIES.map(c => c.color);
  [...SITE.title].forEach((ch, i) => {
    const li = document.createElement("li");
    li.textContent = ch;
    li.style.background = blockColors[i % blockColors.length];
    $("heroBlocks").appendChild(li);
  });
  SITE.lead.split("\n").forEach((line, i) => {
    if (i) $("heroLead").appendChild(document.createElement("br"));
    $("heroLead").appendChild(document.createTextNode(line));
  });
  $("footer").textContent = FOOTER_NOTE;
  $("sFin").textContent = SITE.finWord;

  // ながい だいめいを 2つに わける（まんなかに ちかい「と・の」の あとで きる）
  function splitTitle(chars){
    const mid = Math.ceil(chars.length / 2);
    let best = mid, bestD = 99;
    chars.forEach((ch, i) => {
      if ((ch === "と" || ch === "の" || ch === "・") && i + 1 < chars.length) {
        const d = Math.abs(i + 1 - mid);
        if (d < bestD && d <= 2) { best = i + 1; bestD = d; }
      }
    });
    if (chars[best - 1] === "・") best -= 1;
    return [chars.slice(0, best).join(""), chars.slice(best).join("").replace(/^・/, "")];
  }

  // ---- よみかたで ならべる ための じゅんび ----
  // カタカナを ひらがなに して、「・」や くうはくを とる
  function kanaKey(s){
    return (s.yomi || s.title)
      .replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
      .replace(/[・\s　「」『』（）()]/g, "");
  }
  const ROWS = [
    ["あ","あいうえお"],["か","かきくけこ"],["さ","さしすせそ"],["た","たちつてと"],
    ["な","なにぬねの"],["は","はひふへほ"],["ま","まみむめも"],["や","やゆよ"],
    ["ら","らりるれろ"],["わ","わをん"]
  ];
  const SMALL = { "ぁ":"あ","ぃ":"い","ぅ":"う","ぇ":"え","ぉ":"お","っ":"つ","ゃ":"や","ゅ":"ゆ","ょ":"よ","ゎ":"わ","ゔ":"う" };
  function rowOf(key){
    let ch = [...key][0] || "";
    ch = SMALL[ch] || ch;
    ch = ch.normalize("NFD")[0];        // が → か、ぱ → は
    const r = ROWS.find(x => x[1].includes(ch));
    return r ? r[0] : "ほか";
  }
  const collator = new Intl.Collator("ja");

  // さくしゃめいを せびょうし用に 1〜3れつに わける（「／」や「・」の ところで きる）
  function splitAuthor(a){
    const ch = [...a];
    if (ch.length <= 11) return [a];
    const parts = a.split(/(?<=[／・＝])/);
    const out = [];
    let line = "";
    parts.forEach(p => {
      if (line && [...(line + p)].length > 11) { out.push(line); line = p; }
      else line += p;
    });
    if (line) out.push(line);
    // それでも ながい れつは むりやり きる
    return out.flatMap(l => {
      const c = [...l];
      const r = [];
      for (let i = 0; i < c.length; i += 11) r.push(c.slice(i, i + 11).join(""));
      return r;
    });
  }
  // さくしゃじゅんの ための よみ（authorYomi が なければ、さいしょの ひとの みょうじ）
  function authorKey(s){
    if (!s.author) return "";
    let y = s.authorYomi;
    if (!y) {
      const first = s.author.split("／")[0].replace(/編$/, "").replace(/（.*?）/g, "");
      const seg = first.split("・");
      y = seg[seg.length - 1];
    }
    return y.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
            .replace(/[・\s　「」『』（）()＝]/g, "");
  }

  // ---- せびょうしの 本を ひとつ つくる ----
  let n = 0;
  function makeBook(s, k, color){
    const slot = document.createElement("li");
    slot.className = "slot";
    const b = document.createElement("button");
    b.type = "button";
    // ながいときは もじを ちいさく、とても ながいときは 2れつに する
    //   spine に「|」を いれると、そこで れつを かえられる
    const spineText = (s.spine || s.title).replace(/\s+/g, "");
    const chars = [...spineText.replace(/\|/g, "")];
    const cols = spineText.includes("|") ? spineText.split("|")
               : (chars.length > 10 ? splitTitle(chars) : [chars.join("")]);
    const per = Math.max(...cols.map(c => [...c].length));
    const fs = Math.min(15, Math.floor(136 / (per * 1.08)));
    // さくしゃめい（ながいときは 2れつ・3れつに わける）
    const au = s.author || "";
    const AFS = 11;
    const acols = au ? splitAuthor(au) : [];
    const aper = acols.length ? Math.max(...acols.map(c => [...c].length)) : 0;
    const lblH = Math.round(Math.max(per * fs * 1.1, aper * AFS * 1.1) + 12);
    const h = Math.round(Math.max(150, Math.min(216, 58 + lblH)));
    const base = cols.length > 1 ? Math.max(64, Math.round(26 + cols.length * fs * 1.2)) : [50, 54, 48, 52][n % 4];
    const w = acols.length ? Math.round(Math.max(base, 24 + cols.length * fs * 1.2) + acols.length * AFS * 1.3) : base;
    b.className = "book" + (k % 2 ? " alt" : "");
    b.style.setProperty("--fs", fs + "px");
    b.style.setProperty("--afs", AFS + "px");
    b.style.setProperty("--lh", lblH + "px");
    b.style.setProperty("--h", h + "px");
    b.style.setProperty("--w", w + "px");
    b.style.setProperty("--c", color);
    b.setAttribute("aria-label", (s.yomi ? s.title + "（" + s.yomi + "）" : s.title) + (au ? "　" + au : ""));
    b.innerHTML = '<span class="ico" aria-hidden="true"></span><span class="lbl" aria-hidden="true"></span>';
    b.children[0].textContent = s.icon;
    cols.forEach((c, ci) => {
      if (ci) b.children[1].appendChild(document.createElement("br"));
      b.children[1].appendChild(document.createTextNode(c));
    });
    if (acols.length) {
      const sp = document.createElement("span");
      sp.className = "au";
      acols.forEach((c, ci) => {
        sp.appendChild(document.createElement("br"));
        sp.appendChild(document.createTextNode(c));
      });
      b.children[1].appendChild(sp);
    }
    const idx = ordered.length;
    ordered.push(s);
    b.addEventListener("click", () => openStory(idx, b));
    slot.appendChild(b);
    n++;
    return slot;
  }

  // ---- たなを ひとつ つくる ----
  function makeShelf(id, color, plateHTML, list, bookColor){
    const sec = document.createElement("section");
    sec.className = "shelf";
    sec.id = "shelf-" + id;
    sec.style.setProperty("--c", color);
    const h = document.createElement("h3");
    h.className = "plate";
    h.appendChild(plateHTML);
    const cnt = document.createElement("span");
    cnt.className = "count";
    cnt.textContent = list.length + "さつ";
    h.appendChild(cnt);
    sec.appendChild(h);
    const box = document.createElement("div");
    box.className = "case";
    const ul = document.createElement("ul");
    ul.className = "books";
    list.forEach((s, k) => ul.appendChild(makeBook(s, k, bookColor(s))));
    box.appendChild(ul);
    sec.appendChild(box);
    $("shelves").appendChild(sec);
  }

  // うえの ボタン（おすと その たなへ とぶ）
  function addChip(label, color, targetId, isKana){
    const li = document.createElement("li");
    const bt = document.createElement("button");
    bt.type = "button";
    if (isKana) bt.className = "kana";
    bt.textContent = label;
    bt.style.setProperty("--c", color);
    bt.addEventListener("click", () => {
      const el = document.getElementById(targetId);
      if (el) el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block:"start" });
    });
    li.appendChild(bt);
    $("genreNav").appendChild(li);
  }

  // ---- さいしょの がめんの カード ----
  REGIONS.forEach(r => {
    const rcats = CATEGORIES.filter(c => c.region === r.id);
    const list = STORIES.filter(s => rcats.some(c => c.id === s.cat));
    const card = document.createElement("button");
    card.type = "button";
    card.className = "group";
    card.style.setProperty("--c", r.color);
    card.innerHTML =
      '<div class="group-top"><span class="group-ico" aria-hidden="true"></span>' +
      '<div><p class="group-name"></p><p class="group-lead"></p><span class="group-count"></span></div></div>' +
      '<div class="mini" aria-hidden="true"></div>';
    card.querySelector(".group-ico").textContent = r.icon;
    card.querySelector(".group-name").textContent = r.name;
    card.querySelector(".group-lead").textContent = r.lead || "";
    card.querySelector(".group-count").textContent = list.length + "さつ";
    // かざりの ちいさな 本
    const mini = card.querySelector(".mini");
    const step = list.length / 22;
    Array.from({ length: 22 }, (_, i) => list[Math.floor(i * step)]).forEach((s, i) => {
      const sp = document.createElement("span");
      sp.style.background = catById[s.cat].color;
      sp.style.height = (30 + ((i * 7) % 5) * 5) + "px";
      mini.appendChild(sp);
    });
    card.addEventListener("click", () => {
      fromHome = true;
      pushSt({ view:r.id, mode:mode });
      route(nowSt());
    });
    $("groups").appendChild(card);
  });

  // ---- ならべかたの ボタン ----
  let mode = "genre";
  let region = null;
  MODES.forEach(m => {
    const bt = document.createElement("button");
    bt.type = "button";
    bt.textContent = m.name;
    bt.dataset.mode = m.id;
    bt.addEventListener("click", () => {
      if (mode === m.id) return;
      replaceSt({ view:region, mode:m.id });
      route(nowSt());
    });
    $("modes").appendChild(bt);
  });

  // ---- ほんだなの がめんを つくる ----
  function renderView(rid, m){
    const r = REGIONS.find(x => x.id === rid);
    region = rid; mode = m;
    ordered = []; n = 0;
    $("shelves").textContent = "";
    $("genreNav").textContent = "";
    $("viewTitle").textContent = r.icon + " " + r.name;
    $("modes").style.setProperty("--c", r.color);
    [...$("modes").children].forEach(bt => bt.setAttribute("aria-pressed", bt.dataset.mode === m ? "true" : "false"));

    const rcats = CATEGORIES.filter(c => c.region === rid);
    if (m === "genre") {
      // ジャンルべつ
      rcats.forEach(cat => {
        const list = STORIES.filter(s => s.cat === cat.id);
        if (!list.length) return;
        addChip(cat.short, cat.color, "shelf-" + cat.id, false);
        const frag = document.createDocumentFragment();
        const i1 = document.createElement("span"); i1.setAttribute("aria-hidden","true"); i1.textContent = cat.icon;
        const i2 = document.createElement("span"); i2.textContent = cat.name;
        frag.append(i1, i2);
        makeShelf(cat.id, cat.color, frag, list, () => cat.color);
      });
    } else {
      // あいうえおじゅん・さくしゃじゅん（本の いろは ジャンルの いろの まま）
      const byAuthor = (m === "author");
      const all = STORIES.filter(s => rcats.some(c => c.id === s.cat))
        .map(s => ({ s, t: kanaKey(s), a: authorKey(s) }))
        .map(x => ({ ...x, key: byAuthor ? x.a : x.t }))
        .sort((a, b) => collator.compare(a.key, b.key) || collator.compare(a.t, b.t));
      const rowsOrder = ROWS.map(x => x[0]).concat(["ほか"]);
      if (byAuthor) rowsOrder.push("ふめい");
      rowsOrder.forEach(row => {
        const list = all.filter(x => (byAuthor && !x.a) ? row === "ふめい" : (x.key && rowOf(x.key) === row)).map(x => x.s);
        if (!list.length) return;
        const id = "row-" + row;
        addChip(row === "ふめい" ? "？" : row, r.color, "shelf-" + id, true);
        const frag = document.createDocumentFragment();
        const i1 = document.createElement("span"); i1.className = "ico2"; i1.textContent = row === "ふめい" ? "？" : row;
        const i2 = document.createElement("span");
        i2.textContent = row === "ほか" ? "そのほか" : row === "ふめい" ? "さくしゃ ふめい" : row + "行";
        frag.append(i1, i2);
        makeShelf(id, r.color, frag, list, s => catById[s.cat].color);
        $("shelf-" + id).querySelector(".plate").classList.add("kana-plate");
      });
    }
  }

  // ---- がめんの きりかえ ----
  //   アドレスは かえずに、history の「state」で いまの がめんを おぼえる
  //   （プレビューの なかでも、GitHub Pages でも おなじように うごく）
  let fromHome = false;
  let histOK = true; // history が つかえない ばしょでは、じぶんで おぼえる
  let memo = null;
  function pushSt(st){ memo = st; if (histOK) try { history.pushState(st, ""); } catch(e){ histOK = false; } }
  function replaceSt(st){ memo = st; if (histOK) try { history.replaceState(st, ""); } catch(e){ histOK = false; } }
  function nowSt(){ return memo; }
  function route(st){
    st = st || {};
    if (st.view && REGIONS.some(r => r.id === st.view)) {
      const newMode = MODES.some(x => x.id === st.mode) ? st.mode : "genre";
      const same = (st.view === region && newMode === mode && !$("view").hidden);
      if (!same) renderView(st.view, newMode);
      $("home").hidden = true;
      $("view").hidden = false;
      if (!same) window.scrollTo(0, 0);
    } else {
      const wasView = !$("view").hidden;
      $("view").hidden = true;
      $("home").hidden = false;
      region = null;
      fromHome = false;
      if (wasView) window.scrollTo(0, 0);
    }
    // おはなしの ひらく・とじる
    if (st.ohanashi != null && ordered[st.ohanashi]) show(st.ohanashi);
    else hide();
    if (st.ohanashi == null) {
      document.title = region ? REGIONS.find(r => r.id === region).name + " ― " + SITE.pageTitle : SITE.pageTitle;
    }
  }
  $("backBtn").addEventListener("click", () => {
    if (fromHome && histOK) history.back();
    else { replaceSt(null); route(null); }
  });

  // ---- おはなしを ひらく・とじる ----
  const overlay = $("overlay");
  const sheet = $("sheet");
  let current = -1;
  let opener = null;
  let hideTimer = null;

  function fill(i){
    const s = ordered[i];
    const cat = catById[s.cat];
    current = i;
    sheet.style.setProperty("--c", cat.color);
    $("sIcon").textContent = s.icon;
    $("sYomi").textContent = s.yomi || "";
    $("sYomi").hidden = !s.yomi;
    $("sTitle").textContent = s.title;
    if (s.sub) { $("sSub").hidden = false; $("sSub").textContent = s.sub; }
    else { $("sSub").hidden = true; }

    const art = $("sText");
    art.textContent = "";
    s.text.forEach(t => {
      const p = document.createElement("p");
      if (t.startsWith("♪")) { p.className = "uta"; p.textContent = t.slice(1); }
      else p.textContent = t;
      art.appendChild(p);
    });

    const prev = ordered[i - 1], next = ordered[i + 1];
    $("sPrev").disabled = !prev;
    $("sNext").disabled = !next;
    $("sPrevT").textContent = prev ? prev.title : "";
    $("sNextT").textContent = next ? next.title : "";
    $("sheetScroll").scrollTop = 0;
    document.title = s.title + " ― " + SITE.pageTitle;
  }

  function show(i){
    clearTimeout(hideTimer);
    fill(i);
    if (overlay.hidden) {
      overlay.hidden = false;
      document.documentElement.style.overflow = "hidden";
      document.body.style.overflow = "hidden";
      requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add("open")));
      setTimeout(() => $("sClose").focus({ preventScroll:true }), 50);
    }
  }

  function hide(){
    if (overlay.hidden) return;
    overlay.classList.remove("open");
    document.title = SITE.pageTitle;
    hideTimer = setTimeout(() => {
      overlay.hidden = true;
      document.documentElement.style.overflow = "";
      document.body.style.overflow = "";
      if (opener) opener.focus({ preventScroll:true });
    }, reduce ? 0 : 300);
    current = -1;
  }

  function openStory(i, btn){
    opener = btn || null;
    pushSt({ view:region, mode:mode, ohanashi:i });
    show(i);
  }

  function go(d){
    const j = current + d;
    if (j < 0 || j >= ordered.length) return;
    replaceSt({ view:region, mode:mode, ohanashi:j });
    fill(j);
  }

  function closeStory(){
    const st = nowSt();
    if (histOK && st && st.ohanashi != null) history.back();
    else { replaceSt(region ? { view:region, mode:mode } : null); route(nowSt()); }
  }

  // もどるボタン（スワイプ）で とじられるように
  window.addEventListener("popstate", (e) => { memo = e.state; route(e.state); });
  // さいよみこみ したときは、ひらいていた おはなしだけ わすれる
  let first = null;
  try { first = history.state; } catch(e){ histOK = false; }
  if (first && first.ohanashi != null) first = { view:first.view, mode:first.mode };
  replaceSt(first);
  route(first);

  $("sClose").addEventListener("click", closeStory);
  $("sPrev").addEventListener("click", () => go(-1));
  $("sNext").addEventListener("click", () => go(1));
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeStory(); });
  document.addEventListener("keydown", (e) => {
    if (overlay.hidden) return;
    if (e.key === "Escape") closeStory();
    else if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
  });
})();
</script>
</body>
</html>
