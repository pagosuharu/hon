"次の日にはまた、いつもの「だめな只野」に戻ります。",
"正体を知られず会社を守ることこそ、只野の仕事だからです。",
"最初のシリーズが終わったあとも、『新・特命係長 只野仁』などへ物語は続き、只野は長いあいだ会社の裏側で事件を解決し続けていくのでした。"
]},
{ cat:"m_art", title:"描かないマンガ家", yomi:"かかないマンガか", sub:"えりちん", author:"えりちん", authorYomi:"えりちん", icon:"✏️", text:[
"器根田刃は、漫画家を目指している青年です。",
"本人は、自分のことを未来の大漫画家だと思っています。",
"「おれには、すごいアイデアがある」。",
"「本気を出せば、いつでも大ヒット漫画を描ける」。",
"そう言います。",
"ところが、ひとつ大きな問題があります。",
"刃は、漫画をほとんど描きません。",
"「あの雑誌はレベルが低い」。",
"「今描くと、本当の才能を出し切れない」。",
"いろいろな理由を作って、原稿を完成させないのです。",
"そのあいだにも、刃のまわりの漫画家志望の仲間たちは作品を描きます。",
"下手でも描く。",
"編集者にぼろぼろに言われても描く。",
"賞に落ちても、また次を描く。",
"そして少しずつ、本当の漫画家になっていきます。",
"刃はそんな仲間を見て、「自分のほうが才能がある」と思おうとします。",
"でも、どれだけすばらしいアイデアを持っていても、紙の上に描かなければ読者には届きません。",
"刃は何度も現実から逃げます。",
"それでも、仲間が成功したり失敗したりする姿を見ながら、「描かなければ何も始まらない」という当たり前のことと向き合っていきます。",
"タイトルどおり「描かないマンガ家」のお話ですが、本当のテーマは、「夢を語るだけなのか、それとも実際に手を動かすのか」。",
"全7巻で、刃が長い言い訳の人生から少しずつ前へ進もうとするところまで描かれます。"
]},
/* ---------- まんが（ついか ぶん３） ---------- */
{ cat:"m_art", title:"アオイホノオ", sub:"島本和彦", author:"島本和彦", authorYomi:"しまもとかずひこ", icon:"🔥", text:[
"1980年代のはじめ。大阪の大学に通う焔燃（ほのお・もゆる）は、「自分はまんが家にもなれるし、アニメも作れる。きっと天才なのだ」と、ひそかに思っていました。",
"ところが大学には、庵野秀明や山賀博之、赤井孝美など、とんでもない才能をもつ若者たちがいました。焔は彼らの作品を見るたびに、「こんなもの、自分にだって作れる」と強がります。でも心の中では、「もしかして、自分は負けているのではないか」とあせっていました。",
"それでも焔は、まんがを描いて出版社へ持ちこみます。編集者にほめられたり、きびしく直されたり、手塚治虫や高橋留美子などプロの作品に打ちのめされたりしながら、少しずつ本気でまんが家を目指すようになります。",
"これは、若い島本和彦自身をモデルにした物語です。「天才になりたい」と思いながら、失敗したり、言い訳したり、それでも描くことをやめない青年が、やがて本物のまんが家へ近づいていく青春のお話です。"
]},
{ cat:"m_art", title:"吼えろペン", yomi:"ほえろペン", sub:"島本和彦", author:"島本和彦", authorYomi:"しまもとかずひこ", icon:"🖊️", text:[
"まんが家・炎尾燃（ほのお・もゆる）は、毎週のようにしめ切りと戦っていました。「まんがとは魂だ！」「読者の心を燃やすのだ！」と叫びながら、今日も原稿を描きます。",
"けれども、まんが家の仕事は思ったほどかっこいいものではありません。アイデアが出なかったり、編集者から無茶な注文をされたり、人気が落ちたり、ほかの作家に負けそうになったりします。それでも炎尾は、何でも大事件のように受け止めます。",
"ときには、たった一ページを描くことが世界の運命を決めるように悩み、ときにはライバルまんが家と、まるでスポーツ選手のように張り合います。しかし、その大げさな姿の中には、「面白いまんがを読者に届けたい」という本気の気持ちがあります。",
"物語の最後まで、炎尾の戦いに本当の終わりはありません。一本描き終われば、また次のしめ切りがやってきます。まんがを描く苦しさと楽しさを、ものすごく熱く、そして笑える形で描いたお話です。"
]},
{ cat:"m_art", title:"燃えよペン", yomi:"もえよペン", sub:"島本和彦", author:"島本和彦", authorYomi:"しまもとかずひこ", icon:"✒️", text:[
"若いまんが家・炎尾燃は、今日も「読者を感動させる作品を描くぞ」と燃えていました。しかし、まんが家の世界では、情熱だけではどうにもならないことがたくさんあります。",
"編集者から作品を直すよう言われたり、人気が取れずに悩んだり、しめ切り直前なのに何も思いつかなかったりします。そんなとき炎尾は、ふつうなら静かに考えるところを、「ここで負けたら男ではない！」と、まるで命がけの勝負のように大さわぎします。",
"もちろん、どんなに叫んでも原稿は勝手に完成しません。最後には机に向かい、一本一本、自分の手で描かなければならないのです。炎尾は何度も苦しみながら、それでも作品を完成させます。",
"こうして炎尾は、「才能があるかどうか」だけではなく、「描き続けること」こそがまんが家の仕事なのだと、少しずつ知っていきます。『吼えろペン』へつながっていく、熱血まんが家物語の始まりです。"
]},
{ cat:"m_work", title:"Doctor K", yomi:"ドクターケー", sub:"真船一雄", author:"真船一雄", authorYomi:"まふねかずお", icon:"🩺", text:[
"天才外科医KAZUYAは、「K」と呼ばれる医者の一族に生まれました。大きな体とすぐれた技術をもち、普通の医者には治せない患者のもとへ現れては、難しい手術を成功させてきました。",
"ところがある日、「K」を名乗る別の人物が現れます。さらに、KAZUYAがやってもいない医療ミスまで起こり、彼は自分とK一族をめぐる謎を調べていくことになります。",
"その後もKAZUYAは、病気だけでなく、悪い医者や犯罪、戦争や大きな事故など、さまざまな場所で人の命を救っていきます。しかし、どれほど強いKAZUYAにも、自分自身の病気という敵がやってきます。",
"KAZUYAは病と戦いながらも、最後まで医者であることをやめません。自分の命が短くなっても患者を救い続け、その技術と心は、次の「K」たちへ受けつがれていくのでした。"
]},
{ cat:"m_work", title:"スーパードクターK", spine:"スーパー|ドクターK", yomi:"スーパードクターケー", sub:"真船一雄", author:"真船一雄", authorYomi:"まふねかずお", icon:"🏥", text:[
"世界のどこかで、医者たちが「もう助けられない」とあきらめかけた患者がいると、黒い服を着た大きな男が現れます。その男こそ、天才外科医KAZUYA、通称「ドクターK」でした。",
"KAZUYAは、むずかしい心臓手術や脳の手術、事故や感染症など、普通なら助けることが難しい患者たちを、すぐれた判断と手術の腕で救っていきます。",
"しかし、医療の世界には、お金や名誉のために患者を利用する医者もいます。KAZUYAは、そうした人々とも戦いながら、「医者は何のためにいるのか」を問い続けます。",
"どれほど大変な患者でも、KAZUYAは簡単にはあきらめません。「目の前に命があるなら救う」。その考えをつらぬきながら、多くの人の命を助けていく、長い医療物語です。"
]},
{ cat:"m_work", title:"K2", yomi:"ケーツー", sub:"真船一雄", author:"真船一雄", authorYomi:"まふねかずお", icon:"💉", text:[
"伝説の医者KAZUYAが亡くなったあとも、「K」の名前は消えていませんでした。人知れず医療の技を受けついできた者たちがいたのです。KAZUYAが残したメスや約束も、次の世代へとつながっていました。",
"物語の中心となるのは、すぐれた医術をもつ神代一人（かみしろ・かずと）です。山深い村で医者として働きながら、どんな患者にも向き合い、必要なら大きな病院でもできないような手術を行います。",
"やがて若い医師や医学生たちも一人のもとで学ぶようになり、「天才一人だけが人を救う」のではなく、次の世代へ知識と技術を渡していくことが大きなテーマになっていきます。",
"昔のKAZUYAが救った人々との約束も、長い年月をこえて次々と現れます。『スーパードクターK』から続く「命を救う意志」が、何世代にもわたって受けつがれていく物語です。"
]},
{ cat:"m_work", title:"ゴッドハンド輝", yomi:"ゴッドハンドてる", sub:"山本航暉", author:"山本航暉", authorYomi:"やまもとこうき", icon:"🙌", text:[
"真東輝（まひがし・てる）は、若い外科医です。子どものころ、大きな事故で命を失いかけましたが、天才外科医だった父・真東光介に助けられました。",
"大人になった輝は、名医たちが集まる病院「ヴァルハラ」で働き始めます。最初は失敗も多く、先輩にしかられてばかりでした。それでも、患者を絶対に見捨てない気持ちは、だれにも負けません。",
"輝は北見や四宮など、多くの医師と出会います。とくに四宮とは、考え方がぶつかりながらも、おたがいを認めあう大切なライバルになっていきます。父を知る医師たちとの出会いを通して、輝は自分なりの医者の道を見つけていきます。",
"最後には、父のまねをするだけではなく、一人の医師「真東輝」として歩いていくことを選びます。命を救うことに終わりはなく、輝の新しい戦いはこれからも続いていくのです。"
]},
{ cat:"m_work", title:"研修医なな子", yomi:"けんしゅういななこ", sub:"森本梢子", author:"森本梢子", authorYomi:"もりもとこずえ", icon:"🩺", text:[
"杉坂なな子は、大学病院の外科で働き始めたばかりの研修医です。医者になったとはいっても、まだ分からないことばかり。手術、当直、患者への説明など、毎日が勉強です。",
"眠る時間もないほど忙しく、先輩医師にしかられることもあります。こわい教授、変わった患者、個性的な看護師などに囲まれて、なな子は何度も大あわてします。それでも明るい性格で、一つずつ仕事を覚えていきます。",
"やがて大学病院を離れ、新しい病院でも経験を積みます。初めて自分が中心になって手術をする日もやってきます。失敗をこわがりながらも、患者を前にすると逃げるわけにはいきません。",
"たくさん笑い、たくさん失敗しながら、なな子は「研修医」から一人前の医師へ近づいていきます。最後には研修の時代を卒業し、医者として新しい毎日へ進んでいくのでした。"
]},
{ cat:"m_work", title:"Dr.コトー診療所", spine:"Dr.コトー|診療所", yomi:"ドクターコトーしんりょうじょ", sub:"山田貴敏", author:"山田貴敏", authorYomi:"やまだたかとし", icon:"🏝️", text:[
"五島健助という若い医者が、都会の病院を離れ、遠い南の島へやってきました。島には立派な病院がなく、病気になった人は船で何時間もかけて本土へ行かなければなりません。",
"島の人たちは、最初は五島先生を信用しません。「都会から来た若い医者なんかに任せられない」と言う人もいました。それでも五島先生は、嵐の日でも夜中でも、患者がいればかけつけます。",
"少しずつ島の人たちは、「コトー先生なら任せられる」と思うようになります。しかしコトー自身にも、都会の病院を離れることになった苦しい過去がありました。人を救えなかった後悔を抱えながら、島で再び医者として生きなおしていたのです。",
"重い病気、事故、出産、家族との別れ。島ではさまざまな出来事が起こります。コトーは万能ではありません。それでも一人ひとりの命に向き合い、いつしか診療所は島のみんなにとって、なくてはならない場所になっていきます。"
]},
{ cat:"m_work", title:"最上の命医", yomi:"さいじょうのめいい", sub:"入江謙三・橋口たかし", author:"入江謙三・橋口たかし", authorYomi:"いりえけんぞう", icon:"👶", text:[
"西條命（さいじょう・みこと）は、子どものころ大きな手術を受けて命を救われました。その経験から、「今度は自分が人を救う医者になりたい」と考え、小児外科医になります。作者表記は入江謙三・橋口たかしです。",
"命はとてもすぐれた手術の腕をもっています。しかし彼が大切にするのは、技術だけではありません。「この子を救えば、その子が大人になり、さらにたくさんの命につながっていく」と考えます。",
"病院の中には、小児外科をなくそうとする人や、お金や立場を優先する人もいます。命は仲間たちと力を合わせ、そんな壁を一つずつ乗りこえていきます。",
"そして多くの子どもを救ってきた命自身にも、重い病気が見つかります。それでも彼は医者としてできることを続けます。「命は未来へつながっていく」という考えを、最後までつらぬいていく物語です。"
]},
{ cat:"m_work", title:"最上の明医〜ザ・キング・オブ・ニート〜", spine:"最上の明医|〜ザ・キング・|オブ・ニート〜", yomi:"さいじょうのめいい ザキングオブニート", sub:"橋口たかし", author:"橋口たかし", authorYomi:"はしぐちたかし", icon:"📚", text:[
"帝王大学医学部に入った最上一尊（もがみ・かずたか）は、とても変わった青年です。頭はよいのですが、ふだんはやる気がなさそうで、「できれば楽をしたい」と考えています。",
"しかし、患者の命がかかわると、一尊はまったく別の顔を見せます。医学の知識や発想力を使い、ほかの学生や医師が気づかなかった問題を見つけていきます。",
"医学部では、勉強だけでなく、病院の上下関係や医師同士の競争もあります。一尊は仲間たちと、ときにふざけ、ときにぶつかりながら、医者になるための経験を重ねていきます。",
"前作『最上の命医』が「命を救う天才医師」の物語なら、こちらは「まだ医者になる途中の若者たち」の物語です。一尊は少しずつ、自分がどんな医者になりたいのかを見つけていきます。"
]},
{ cat:"m_work", title:"ラジエーションハウス", sub:"原作：横幕智裕　漫画：モリタイシ", author:"横幕智裕／モリタイシ", authorYomi:"よこまくともひろ", icon:"🩻", text:[
"五十嵐唯織（いがらし・いおり）は、病院でレントゲンやCT、MRIなどを撮る「診療放射線技師」です。医者ではありませんが、画像から病気の手がかりを見つける、とてもすぐれた力をもっています。",
"唯織が甘春総合病院へやってきたのには理由がありました。そこには、子どものころに「大きくなったら一緒に働こう」と約束した甘春杏が、放射線科医として働いていたのです。",
"杏は最初、唯織のことをほとんど覚えていません。それでも唯織は、患者の画像を注意深く見て、小さな異変を次々と見つけます。そこから、ほかの医師が気づかなかった病気が分かることもあります。",
"この物語では、手術をする医者だけでなく、「病気を見つける人」も命を救っていることが描かれます。ラジエーションハウスの仲間たちは、それぞれの力を合わせ、見えない病気を見つけ続けていきます。"
]},
{ cat:"m_work", title:"病室で念仏を唱えないでください", spine:"病室で念仏を|唱えないで|ください", yomi:"びょうしつでねんぶつをとなえないでください", sub:"こやす珠世", author:"こやす珠世", authorYomi:"こやすたまよ", icon:"📿", text:[
"松本照円（まつもと・しょうえん）は、救急医です。しかし彼には、もう一つの顔があります。なんと、お寺のお坊さんでもあるのです。",
"救急車が来れば、松本は医者として患者を助けます。しかし、どうしても助けられない命もあります。そんなときには僧侶として家族によりそい、亡くなった人のためにお経をとなえます。",
"松本自身も完ぺきではありません。怒ることもあれば、迷うこともあります。「医者なら何としても命を救うべきだ。でも、人はいつか必ず死ぬ」。その二つの考えの間で、何度も悩みます。",
"たくさんの患者との出会いと別れを通して、松本は「死をなくすこと」だけが医療ではないと知っていきます。生きている時間をどう支えるのかを、医者と僧侶の両方の立場から考えていく物語です。"
]},
{ cat:"m_drama", title:"無能の人", yomi:"むのうのひと", sub:"つげ義春", author:"つげ義春", authorYomi:"つげよしはる", icon:"🪨", text:[
"助川助三は、むかしは漫画を描いていました。しかし仕事が少なくなり、だんだん漫画を描く気力もなくしてしまいます。",
"「何か別の仕事をしよう」と思った助三は、古いカメラを売ったり、変わった商売を考えたりします。ついには、多摩川の河原で拾った石を並べ、「これは価値のある石です」と売ろうとします。もちろん、なかなか買う人はいません。",
"妻は「ちゃんと働いて」と怒ります。子どももいて、お金は必要です。それでも助三は、ふつうの仕事へ戻ることができません。自分でも「何をしているんだろう」と分かっているのに、動けないのです。",
"大きな成功も、気持ちのよい解決もありません。世の中から少しずれてしまった男が、川辺で石を売りながら、「人間にとって仕事とは何だろう」とぼんやり考え続ける、さびしくて少しおかしい物語です。"
]},
{ cat:"m_horror", title:"李さん一家", yomi:"りさんいっか", sub:"つげ義春", author:"つげ義春", authorYomi:"つげよしはる", icon:"🏚️", text:[
"ある家に、見知らぬ李さんという男と、その家族がやってきます。そして、まるで前から住んでいたかのように、家の一部で暮らし始めます。",
"家の人は「どうしてこの人たちがいるのだろう」と困ります。けれども、李さん一家は特に悪びれる様子もなく、ごはんを食べたり、眠ったりして、どんどん生活の中へ入りこんできます。",
"ふつうの物語なら、なぜ李さんたちが来たのか、最後には理由が分かりそうです。ところが、この作品では、何が本当で何が夢なのか、だんだん分からなくなっていきます。",
"「変だな」と思うことが、そのまま日常になっていく。つげ義春らしい、不思議で少しこわく、それでいてどこか笑える夢のようなお話です。"
]},
{ cat:"m_love", title:"赤色エレジー", yomi:"せきしょくエレジー", sub:"林静一", author:"林静一", authorYomi:"はやしせいいち", icon:"🌆", text:[
"一郎と幸子は、若い恋人どうしです。二人ともアニメの仕事をしながら、貧しい部屋で一緒に暮らしています。一郎には漫画家になる夢がありますが、なかなかうまくいきません。",
"二人はおたがいを好きなのに、お金がないことや将来への不安から、何度もけんかをします。「好きなら幸せになれる」と思っていたはずなのに、現実の生活は簡単ではありません。",
"一郎は夢を追い、幸子はそんな一郎を支えようとします。しかし二人の心には少しずつ距離ができていきます。愛しているからこそ、相手を傷つけてしまうこともあります。",
"やがて二人の同棲生活はこわれていきます。若い男女が夢と貧しさの間でもがき、きれいな思い出だけでは終われない恋を描いた、静かで悲しい青春のお話です。"
]},
{ cat:"m_horror", title:"ねこぢるうどん", sub:"ねこぢる", author:"ねこぢる", authorYomi:"ねこぢる", icon:"🐈", text:[
"小さな猫のきょうだいたちが、町を歩いたり、ごはんを食べたり、遊んだりします。絵だけを見ると、とてもかわいらしい世界です。",
"ところが、この世界では、とつぜん変なことが起こります。動物たちがひどい目にあったり、命があっけなくなくなったり、夢と現実がまざったような出来事が続きます。",
"猫たちはそれを見ても、あまり驚きません。大人なら「これは大変だ」と思うことも、子どもの遊びのように受け止めてしまいます。そのため、かわいい絵なのに、読んでいる人はだんだん不安な気持ちになります。",
"一つの長い物語ではなく、短いお話がたくさん集まった作品です。「かわいい」と「こわい」が同じ場所にある、とても変わった世界を描いています。"
]},
{ cat:"m_drama", title:"失踪日記", yomi:"しっそうにっき", sub:"吾妻ひでお", author:"吾妻ひでお", authorYomi:"あづまひでお", icon:"🎒", text:[
"漫画家の吾妻ひでおは、仕事に追われる生活がつらくなり、ある日、家族にも編集者にも何も言わずに姿を消してしまいます。",
"森の中で暮らしたり、道ばたで眠ったり、捨てられた食べ物を探したりして、ほんとうにホームレスの生活を始めます。その後は配管工として働く時期もありました。",
"家へ戻って漫画家を続けても、今度はお酒にたよりすぎるようになります。ついには自分ではやめられなくなり、アルコール依存症の治療を受けるため病院へ入ります。",
"とても苦しい体験なのですが、吾妻はそれを暗く描きません。「こんなこともあったなあ」と、かわいらしい絵と冗談をまじえて語ります。自分自身の失踪や依存症をそのまま漫画にした、本当にあったお話です。"
]},
{ cat:"m_drama", title:"ぼくんち", sub:"西原理恵子", author:"西原理恵子", authorYomi:"さいばらりえこ", icon:"🌊", text:[
"海の近くにある、とても貧しい町。そこには、お金がなかったり、お酒やけんかで問題を起こしたりしながら生きている人たちがいます。",
"物語の中心になるのは、そんな町で暮らす子どもたちです。大人たちは頼りないことも多く、子どもたちは小さいうちから、「世の中はきれいなことばかりではない」と知っています。",
"家族がいなくなったり、お金のためにつらい仕事をしたり、悲しい出来事も起こります。それでも子どもたちは、ごはんを食べ、笑い、けんかをし、明日を生きていきます。",
"「貧しいから不幸」「かわいそうだから終わり」ではありません。ひどいことの多い町にも笑いがあり、そこに住む人なりの愛があります。そんな、苦しくてやさしい家族のお話です。"
]},
{ cat:"m_daily", title:"毎日かあさん", yomi:"まいにちかあさん", sub:"西原理恵子", author:"西原理恵子", authorYomi:"さいばらりえこ", icon:"👩‍👦", text:[
"漫画家の「かあさん」は、男の子と女の子を育てながら、毎日を大いそがしで過ごしています。",
"子どもは言うことを聞かず、部屋は散らかり、学校からは連絡が来ます。かあさんは怒ったり笑ったりしながら、「子育てって、なんでこんなに大変なんだろう」と思います。",
"夫はお酒の問題を抱えており、家族は離れて暮らすことになります。それでも治療を受け、家族のもとへ戻ってきます。しかしやがて病気になり、家族に見守られながら亡くなります。",
"悲しい別れのあとも、子どもたちはどんどん大きくなります。小さかった二人が親から離れていくところまで、「子育てには終わりが来る」ということを、笑いと涙の両方で描いた家族の記録です。"
]},
{ cat:"m_daily", title:"ぼのぼの", sub:"いがらしみきお", author:"いがらしみきお", authorYomi:"いがらしみきお", icon:"🦦", text:[
"海のそばに、ラッコの子ども・ぼのぼのが暮らしています。友だちはシマリスくんやアライグマくん。三びきは森や海で遊びながら、毎日いろいろなことを考えます。",
"「どうしてこわいことは起きるんだろう」「友だちって何だろう」「死んだらどこへ行くんだろう」。ぼのぼのは、小さな出来事から、とても大きな疑問を思いつきます。",
"もちろん難しい話ばかりではありません。穴に落ちたり、変な動物に会ったり、アライグマくんが怒ったり、シマリスくんがふり回されたりして、にぎやかな毎日が続きます。",
"はっきりした一つの終わりがある物語ではありません。子どものようなぼのぼのたちが、遊びながら少しずつ世界の不思議を知っていく、ゆっくりと続いていくお話です。"
]},
{ cat:"m_gag", title:"コージ苑", yomi:"コージえん", sub:"相原コージ", author:"相原コージ", authorYomi:"あいはらこーじ", icon:"😆", text:[
"この作品には、「この人が主人公」という決まった人物はいません。短い四コマ漫画の中に、会社員、学生、おじいさん、動物など、いろいろな人が登場します。",
"最初はふつうの日常に見えます。「会社へ行く」「ごはんを食べる」「人と話す」。ところが最後の一コマで、思ってもいなかった方向へ話が転がります。",
"ときには少し意地悪で、ときにはとてもくだらなく、ときには「人間って変だな」と考えさせられる笑いもあります。",
"一つの長い物語を読む作品ではなく、たくさんの小さなお話を読んでいく作品です。「当たり前だと思っていたこと」を少しだけ横から見て笑う、そんな四コマ漫画です。"
]},
{ cat:"m_gag", title:"伝染るんです。", yomi:"うつるんです", sub:"吉田戦車", author:"吉田戦車", authorYomi:"よしだせんしゃ", icon:"🦦", text:[
"町には、かわうそ君、かっぱ君、しいたけ、山崎先生など、説明するのもむずかしい変な人たちが暮らしています。",
"だれかが何かを言っても、会話は思った方向へ進みません。「どうしてそうなるの？」と思っているうちに、もっと変なことが起きます。",
"かわうそ君は自信満々なのに何を考えているのか分かりません。ほかの登場人物たちも、不思議な決まりを当たり前のように守っています。",
"大きな事件を解決する物語ではありません。「意味が分からないのに、なぜか笑ってしまう」という不思議な世界が、短い漫画の中でずっと続きます。日本の不条理ギャグ漫画を代表する作品です。"
]},
{ cat:"m_gag", title:"かりあげクン", sub:"植田まさし", author:"植田まさし", authorYomi:"うえだまさし", icon:"💇", text:[
"かりあげ正太は、会社で働く若い社員です。いつも髪を短く刈り上げていて、まじめそうに見えます。",
"ところが、正太はとてもいたずら好きです。上司がいばっていると、こっそり困らせます。同僚が油断していると、変ないたずらを思いつきます。",
"大きな悪事をするわけではありません。ただ、毎日のちょっとした出来事を利用して、人をびっくりさせたり、読者を笑わせたりします。",
"物語が進んでも、正太はあまり変わりません。今日も会社へ行き、仕事をしているふりをしながら、新しいいたずらを考えます。そんな日常が長く続いていく四コマ漫画です。"
]},
{ cat:"m_gag", title:"OL進化論", yomi:"オーエルしんかろん", sub:"秋月りす", author:"秋月りす", authorYomi:"あきつきりす", icon:"👩‍💼", text:[
"会社で働く女性たち、いわゆる「OL」の毎日を描いた四コマ漫画です。",
"朝、会社へ行き、上司にしかられたり、同僚とおしゃべりしたり、恋をしたり、結婚について考えたりします。仕事ができる人もいれば、のんびりした人もいます。",
"時代が変わるにつれて、女性の働き方も少しずつ変わっていきます。「結婚したら会社をやめるのが普通」と言われた時代から、結婚しても働く人が当たり前になる時代へ、登場人物たちの生活も変わっていきます。",
"大きな一つの結末はありません。会社で働く人たちの小さな喜びや不満を、「あるある」と笑える形で長く描き続けている作品です。"
]},
{ cat:"m_gag", title:"お父さんは心配症", yomi:"おとうさんはしんぱいしょう", sub:"岡田あーみん", author:"岡田あーみん", authorYomi:"おかだあーみん", icon:"👨", text:[
"高校生の典子には、大きな悩みがありました。それは、お父さんが娘のことを心配しすぎることです。",
"典子に好きな男の子ができれば、お父さんは「娘をだます悪い男ではないか」と大さわぎ。デートをすれば、あとをつけ、変装し、何とか二人のじゃまをしようとします。",
"もちろん典子は怒ります。「もう放っておいて！」と言います。それでもお父さんは、「かわいい娘を守るのが父親の役目だ」と、まったく反省しません。",
"毎回とんでもない事件が起こりますが、その根っこにあるのは、お父さんの強すぎる娘への愛情です。迷惑だけれど、どこか憎めない父と娘の、めちゃくちゃでにぎやかな家族コメディです。"
]},
{ cat:"m_gag", title:"ペケ", sub:"新井理恵", author:"新井理恵", authorYomi:"あらいりえ", icon:"❌", text:[
"学校、家庭、恋愛など、若い人たちの日常を描いた四コマ漫画です。",
"登場人物たちは、みんな少し変わっています。かっこよく見える人にも情けないところがあり、かわいらしい人も、とつぜんものすごく冷たいことを言ったりします。",
"「青春はきらきらしている」というより、「人間ってけっこう面倒くさいよね」というところを、するどい言葉で笑いに変えていきます。",
"一つの大きな事件へ向かって進む作品ではありません。いろいろな人物の小さな失敗や恋やケンカを通して、人間のおかしさを楽しむ四コマ漫画です。"
]},
{ cat:"m_daily", title:"きょうの猫村さん", yomi:"きょうのねこむらさん", sub:"ほしよりこ", author:"ほしよりこ", authorYomi:"ほしよりこ", icon:"🐱", text:[
"猫村ねこは、猫なのに、人間の家で家政婦として働いています。",
"猫村さんには、むかし大切にしてくれた「ぼっちゃん」がいました。離ればなれになってしまったぼっちゃんに、いつかもう一度会いたい。そのためにお金をためようと、家政婦になります。",
"猫村さんが働く犬神家は、一見立派なお金持ちの家ですが、家族それぞれに悩みがあります。夫婦はすれちがい、子どもたちも心に問題を抱えています。",
"猫村さんは、おせっかいをしながら、ごはんを作り、掃除をし、家族の間へ入っていきます。完ぺきに問題を解決するわけではありません。それでも、猫村さんのやさしさで、家の中が少しずつ変わっていく物語です。"
]},
{ cat:"m_drama", title:"おやすみプンプン", sub:"浅野いにお", author:"浅野いにお", authorYomi:"あさのいにお", icon:"🐤", text:[
"プンプンは、どこにでもいる小学生の男の子です。ある日、転校してきた田中愛子という女の子を好きになります。",
"愛子は「いつか一緒に遠くへ行こう」と言います。プンプンはその約束をずっと心に残します。しかし家庭では父と母の関係がこわれ、学校でも思い通りにならないことが増えていきます。",
"大人になったプンプンは、夢をなくし、愛子とも離れて暮らしていました。やがて二人は再会し、昔の約束をかなえるように町を出ます。しかし愛子の母との争いで大きな事件が起き、二人の逃亡生活はどんどん苦しいものになります。",
"最後に愛子は亡くなり、プンプンだけが生き残ります。プンプンは「もう終わりにしたい」と思いますが、それでも周囲の人に助けられ、生き続けます。初恋から始まり、「それでも人生は続いてしまう」ことまでを描いた長い成長物語です。"
]},
{ cat:"m_art", title:"ソラニン", sub:"浅野いにお", author:"浅野いにお", authorYomi:"あさのいにお", icon:"🎸", text:[
"芽衣子は大学を卒業し、会社で働いていました。でも毎日同じ仕事をする生活に、「これが自分のやりたかったことなのかな」と悩んでいました。",
"恋人の種田は、仲間たちとバンドを続けています。しかし音楽だけで食べていくことはできず、種田もまた将来に迷っていました。",
"芽衣子は思いきって会社をやめます。そして種田にも、「本当にやりたいなら、もう一度音楽をやってみよう」と言います。種田は仲間と曲を作り、夢へ向かい始めます。",
"ところが、その途中で種田は事故で亡くなります。残された芽衣子は深い悲しみに沈みます。それでも最後には、種田が残した曲「ソラニン」を自分たちで演奏します。大切な人を失っても、人生をもう一度歩きだそうとする若者たちの物語です。"
]},
{ cat:"m_love", title:"うみべの女の子", yomi:"うみべのおんなのこ", sub:"浅野いにお", author:"浅野いにお", authorYomi:"あさのいにお", icon:"🏖️", text:[
"海辺の町に住む中学生の小梅は、好きな男の子に気持ちを受け入れてもらえず、傷ついていました。",
"そんなとき、小梅のことを以前から好きだった磯辺と近づきます。しかし二人は「恋人になろう」と約束するのではなく、さびしさをまぎらわせるように、大人のような関係を持つようになります。",
"小梅はだんだん磯辺に気持ちを向けるようになります。ところが今度は磯辺のほうが、自分の心に閉じこもっていきます。近くにいるのに、二人の気持ちは同じ場所にはありません。",
"やがて二人の関係は終わります。好きな人と一緒にいれば、必ず心までつながるわけではありません。思春期のさびしさや、恋と欲望のすれちがいを描いた、ほろ苦い青春のお話です。"
]},
{ cat:"m_drama", title:"ひかりのまち", sub:"浅野いにお", author:"浅野いにお", authorYomi:"あさのいにお", icon:"🏢", text:[
"大きな団地のある町で、いろいろな人たちが暮らしています。",
"学校になじめない子、危ない仕事をしている若者、家族とうまくいかない人など、それぞれが自分だけの悩みを抱えています。最初は別々の物語に見えますが、少しずつ登場人物たちの生活がつながっていきます。",
"この町では、ときに人が亡くなり、ときにだれかが深く傷つきます。それでも朝になれば電車が走り、学校や仕事は始まります。",
"「世界は自分のために止まってはくれない」。そんな少し冷たい現実の中で、人と人がほんの少しだけ助け合う瞬間を描いた、いくつもの短い物語がつながった作品です。"
]},
{ cat:"m_drama", title:"零落", yomi:"れいらく", sub:"浅野いにお", author:"浅野いにお", authorYomi:"あさのいにお", icon:"🍂", text:[
"深澤薫は、長いあいだ漫画を描いてきた漫画家です。人気連載が終わり、ようやく仕事から自由になったはずでした。",
"ところが、いざ描くものがなくなると、「自分には漫画しかなかったのではないか」と不安になります。妻との関係もうまくいかず、家にいても落ちつきません。",
"そんな薫は、夜の町で出会った女性・ちふゆにひかれていきます。しかし、それで人生が明るくなるわけではありません。むしろ、自分が人を見下したり、傷つけたりしてきたことが少しずつ見えてきます。",
"「作品を描いて成功したら幸せになれる」と思っていた男が、成功したあとに空っぽになってしまう。漫画家という仕事と、一人の人間としての自分の間で迷い続ける、苦い物語です。"
]},
{ cat:"m_horror", title:"虹ヶ原ホログラフ", yomi:"にじがはらホログラフ", sub:"浅野いにお", author:"浅野いにお", authorYomi:"あさのいにお", icon:"🌈", text:[
"ある小学校で、一人の少女が仲間外れにされていました。子どもたちは、少女を傷つけることの意味をよく分からないまま、ひどいことをしてしまいます。",
"その事件は、子どもたちだけでなく、先生や家族にも深い傷を残します。やがて子どもたちは大人になりますが、昔の出来事を完全に忘れることはできません。",
"物語は過去と現在を行ったり来たりします。「あのとき何が起きたのか」が少しずつ分かるにつれて、昔の小さな悪意が、何年もあとまで人の人生を変えていることが見えてきます。",
"最後まで読むと、最初には意味が分からなかった場面同士がつながっていきます。子どものころの罪や後悔が、大人になっても消えずに残ることを描いた、暗くて不思議なお話です。"
]},
{ cat:"m_art", title:"ルックバック", sub:"藤本タツキ", author:"藤本タツキ", authorYomi:"ふじもとたつき", icon:"✏️", text:[
"小学四年生の藤野は、学級新聞に四コマ漫画を描いていました。友だちから「絵が上手だね」とほめられ、自分は絵がうまいと思っていました。",
"ところが、不登校の同級生・京本の絵が新聞に載ります。その絵は藤野よりずっと上手でした。くやしくなった藤野は、毎日ものすごく絵を練習します。",
"やがて藤野と京本は友だちになり、二人で漫画を描き始めます。作品は出版社から評価され、藤野は漫画家の道へ進みます。しかし京本は「もっと絵を勉強したい」と美術大学へ行き、そこで起きた事件で命を失います。",
"藤野は「自分が京本を外へ連れ出さなければ」と後悔します。それでも、京本が自分の漫画をずっと大切にしていたことを知ります。藤野はもう一度机に向かい、漫画を描き始めるのでした。"
]},
{ cat:"m_drama", title:"さよなら絵梨", yomi:"さよならえり", sub:"藤本タツキ", author:"藤本タツキ", authorYomi:"ふじもとたつき", icon:"🎥", text:[
"優太は、病気の母親から「私が死ぬまでを映画にして」と頼まれます。優太は毎日カメラを回し、母の最後まで撮り続けます。",
"完成した映画を学校で上映しますが、友だちからは「ひどい映画だ」と笑われます。落ちこんだ優太の前に、絵梨という女の子が現れます。絵梨だけは、「あの映画、私は好きだった」と言いました。",
"二人はたくさんの映画を見て、新しい映画を作り始めます。ところが絵梨もまた病気で、やがて亡くなります。優太は彼女との時間も映画にします。",
"年月がたち、年を取った優太は、若いころと変わらない姿の絵梨に再会します。それが現実なのか、映画の中の出来事なのかは、はっきりしません。最後まで「現実と作り話の境目」をゆらす、不思議な物語です。"
]},
{ cat:"m_fantasy", title:"ファイアパンチ", sub:"藤本タツキ", author:"藤本タツキ", authorYomi:"ふじもとたつき", icon:"🔥", text:[
"世界は雪と氷におおわれ、人々は食べ物もなく苦しんでいました。アグニと妹ルナには、傷ついてもすぐに治る不思議な力がありました。",
"ある日、ドマという男の消えない炎によって村が焼かれ、ルナも命を失います。アグニだけは再生する体のため死ぬことができず、体を燃やしたまま生き続けることになります。",
"アグニはドマへの復讐だけを考えて旅をします。しかしトガタという映画好きの人物や、多くの人々と出会ううち、「復讐さえすれば幸せになれるのか」が分からなくなっていきます。",
"やがてアグニは自分が何者なのかさえ分からなくなります。それでも、とても長い時間の果てに、かつて大切だった人を思わせる存在と再会します。復讐から始まり、人が何のために生きるのかを問い続ける、とても奇妙で悲しい物語です。"
]},
{ cat:"m_drama", title:"惡の華", yomi:"あくのはな", sub:"押見修造", author:"押見修造", authorYomi:"おしみしゅうぞう", icon:"🌸", text:[
"中学生の春日高男は、本を読むことが好きな少年です。同じクラスの佐伯奈々子にあこがれていますが、話しかける勇気はありません。",
"ある日、春日は教室に残されていた佐伯の体操着を、思わず持ち帰ってしまいます。そのところを、同級生の仲村佐和に見られていました。",
"仲村は秘密をばらさないかわりに、「私の言うことを聞け」と春日を振り回します。春日は佐伯へのきれいな恋と、仲村との危うい関係の間で、どんどん追いつめられていきます。",
"町を出た春日は、何年かたって新しい友人や恋人と出会います。そして昔の自分や仲村ともう一度向き合います。最後には、あのころの「世界をこわしたい」という気持ちを過去として受け止め、自分の人生を歩こうとするのでした。"
]},
{ cat:"m_drama", title:"血の轍", yomi:"ちのわだち", sub:"押見修造", author:"押見修造", authorYomi:"おしみしゅうぞう", icon:"🩸", text:[
"長部静一は、おとなしい中学生です。母の静子は、静一のことをとても大切にしています。でも、その愛情は少し強すぎるところがありました。",
"家族で山へ出かけた日、静一は母が親せきの子を崖から突き落とすところを見てしまいます。静一は何が起きたのか理解できず、しかも大好きな母を守りたい気持ちから、本当のことをうまく言えません。",
"その日から、母と子の関係はどんどん苦しくなります。静子は静一を自分のそばへしばりつけようとし、静一は母を愛しながらも、こわがるようになります。",
"長い年月がたち、静一は大人になります。人生の多くを母の影に支配されてきた静一は、年老いた母と再び向き合います。そして最後には、母を完全に理解するのでも許すのでもなく、その存在から少しずつ離れ、自分の人生を生きようとします。"
]},
{ cat:"m_horror", title:"ハピネス", sub:"押見修造", author:"押見修造", authorYomi:"おしみしゅうぞう", icon:"🦇", text:[
"岡崎誠は、おとなしくて目立たない中学生です。ある夜、謎の少女ノラにおそわれ、血を吸われます。",
"命は助かりましたが、その日から誠の体は変わり始めます。暗いところがよく見え、人の血のにおいに強くひかれるようになります。誠は、人間とはちがう「吸血鬼」のような存在になってしまったのです。",
"誠は友人や好きな人を守ろうとします。しかし、吸血鬼を研究し利用しようとする人々も現れ、人間と吸血鬼の争いは大きくなっていきます。",
"「人間だから善い」「怪物だから悪い」と簡単には分けられません。誠は多くのものを失いながら、自分が何者なのかを考え続けます。怪物になってしまった少年を通して、人間らしさとは何かを描いた物語です。"
]},
{ cat:"m_drama", title:"志乃ちゃんは自分の名前が言えない", spine:"志乃ちゃんは|自分の名前が|言えない", yomi:"しのちゃんはじぶんのなまえがいえない", sub:"押見修造", author:"押見修造", authorYomi:"おしみしゅうぞう", icon:"🎤", text:[
"高校一年生の大島志乃は、人前で話そうとすると言葉がつまってしまいます。とくに自分の名前を言うことが苦手で、入学してすぐの自己紹介でもうまく話せず、笑われてしまいました。",
"そんな志乃は、ギターが好きな同級生・加代と友だちになります。加代は歌うことが苦手でしたが、志乃にはきれいな歌声がありました。二人は「それなら一緒に音楽をやろう」とバンドを始めます。",
"友だちができたことで、志乃の世界は少しずつ広がります。それでも人前に立つのはこわく、何度も逃げたくなります。",
"最後に志乃は、うまく言葉が出なくても、自分の気持ちを伝えようとします。「普通の人みたいに話せない自分」から逃げるのではなく、そのままの自分で人とつながろうとする、小さくて大きな一歩を描いた物語です。"
]},
{ cat:"m_horror", title:"ミスミソウ", sub:"押切蓮介", author:"押切蓮介", authorYomi:"おしきりれんすけ", icon:"❄️", text:[
"野咲春花は、東京から雪の多い田舎町へ引っ越してきました。しかし転校した学校で、同級生たちからひどいいじめを受けます。",
"春花はできるだけがまんしていました。ところが、いじめはだんだんひどくなり、ついには春花の家族まで巻きこむ取り返しのつかない事件が起こります。",
"大切な家族を失った春花の中で、それまで押さえていた怒りがこわれます。そして、自分を苦しめてきた同級生たちへ復讐を始めます。",
"けれども復讐をしても、失った家族は戻ってきません。いじめた側にも、それぞれゆがんだ家庭や心の傷がありました。最後には多くの人が傷つき、春花自身も救われません。「憎しみが次の憎しみを生む」ことを、雪の町を舞台に描いた悲しい物語です。"
]},
{ cat:"m_horror", title:"ライチ☆光クラブ", spine:"ライチ☆|光クラブ", yomi:"ライチひかりクラブ", sub:"古屋兎丸", author:"古屋兎丸", authorYomi:"ふるやうさまる", icon:"🏭", text:[
"工場の煙におおわれた町・螢光町。その片すみにある古い工場へ、九人の少年たちが集まっていました。彼らは自分たちを「光クラブ」と呼びます。",
"少年たちの中心にいるゼラは、「醜い大人にはなりたくない。美しいままでいたい」と考えています。そして仲間たちに命じて、人間のように動く機械「ライチ」を作らせます。",
"完成したライチに、ゼラは「美しい少女を連れてこい」と命令します。少女カノンが連れてこられたことで、光クラブの中に、それまでなかった友情や恋、嫉妬が生まれます。",
"ゼラがつくった完ぺきな世界は、仲間の裏切りとライチ自身の心によってこわれていきます。最後には光クラブそのものが崩壊します。「永遠に子どものままでいたい」という願いが、狂気へ変わってしまう物語です。"
]},
{ cat:"m_drama", title:"帝一の國", yomi:"ていいちのくに", sub:"古屋兎丸", author:"古屋兎丸", authorYomi:"ふるやうさまる", icon:"🏫", text:[
"赤場帝一は、名門・海帝高校に入学します。彼には大きな夢がありました。「いつか総理大臣になって、自分の国を作る」という夢です。",
"そのためには、まず海帝高校の生徒会長になる必要があります。この学校の生徒会長は、将来の政治家や有力者への近道だったからです。",
"帝一は友だちの光明といっしょに、先輩へ取り入ったり、敵の作戦を読んだり、仲間を集めたりして、生徒会の選挙を戦います。学校の選挙なのに、まるで本物の国の政治のようなかけひきが続きます。",
"しかし戦いの中で帝一は、自分より人をひきつける力を持つ大鷹弾と出会います。最後には、「自分が一番上に立つこと」だけではなく、自分の理想をかなえる別の道も知ります。野心いっぱいの少年が政治の世界を学んでいく青春物語です。"
]},
{ cat:"m_horror", title:"ホムンクルス", sub:"山本英夫", author:"山本英夫", authorYomi:"やまもとひでお", icon:"👁️", text:[
"名越進は、車の中で暮らしている男です。見た目は普通ですが、自分がどんな人間なのか、自分でもよく分からなくなっています。",
"ある日、伊藤という医学生から、「頭の骨に小さな穴をあける実験をさせてほしい」と持ちかけられます。名越はお金のために、その奇妙な手術を受けます。",
"すると名越には、人間が普通とはちがう姿に見えるようになります。ある人はロボットのように見え、ある人は砂のかたまりのように見えます。それは、その人が心の奥に隠している傷や悩みを表しているようでした。",
"名越は他人の心を見ているつもりでしたが、やがて一番分かっていなかったのは自分自身だと気づきます。他人の心の形を見る力を通して、「自分とは何者なのか」をどんどん深く掘り下げていく、不気味な物語です。"
]},
{ cat:"m_drama", title:"殺し屋1", yomi:"ころしやイチ", sub:"山本英夫", author:"山本英夫", authorYomi:"やまもとひでお", icon:"🔪", text:[
"新宿の裏社会に、「イチ」と呼ばれる青年がいました。ふだんはおとなしく、気の弱そうな青年ですが、心の中には大きな傷と怒りを抱えています。",
"ある男に心をあやつられたイチは、「悪い人間を倒している」と思わされながら、人を殺す道具のように使われていきます。",
"一方、ヤクザの垣原は、とても危険な男です。痛みさえ楽しむ垣原は、姿を消した親分を探すうちに、イチの存在へ近づいていきます。",
"やがてイチと垣原はぶつかります。しかし、そこに正義の勝者はいません。イチも垣原も、自分の心にあるゆがみから逃げられないまま、多くの人を傷つけます。暴力の中にある弱さや欲望を描いた、とても暗い物語です。"
]},
{ cat:"m_drama", title:"新・のぞき屋", yomi:"しんのぞきや", sub:"山本英夫", author:"山本英夫", authorYomi:"やまもとひでお", icon:"🔭", text:[
"人はだれでも、ほかの人には見せない生活を持っています。「のぞき屋」たちは、依頼を受け、その秘密をこっそり調べる仕事をしています。",
"部屋の中を見たり、人のあとを追ったりして、「この人は本当は何をしているのか」を突き止めます。最初は簡単な調査に見えても、その奥には恋愛、裏切り、犯罪など、さまざまな問題が隠れています。",
"依頼した人も、調べられる人も、必ずしも善人ではありません。「秘密を知れば幸せになれる」とはかぎらず、知ってしまったために苦しむ人もいます。",
"他人の生活をのぞくことで、人間の表の顔と裏の顔が少しずつ見えてきます。「本当のことを知るのは、よいことなのか」という問いを描いた物語です。"
]},
{ cat:"m_horror", title:"座敷女", yomi:"ざしきおんな", sub:"望月峯太郎", author:"望月峯太郎", authorYomi:"もちづきみねたろう", icon:"🚪", text:[
"大学生の森ひろしは、ある夜、アパートのとなりの部屋を訪ねてきた見知らぬ女を見かけます。",
"その女は、とても背が高く、大きな荷物を持っていました。最初は「となりの人の知り合いだろう」と思っていた森ですが、なぜか今度は自分の前に現れるようになります。",
"電話がかかってきたり、家の近くに立っていたり、いつのまにか生活の中へ入りこんできます。森は女から逃げようとしますが、「どこまで逃げても見つかるのではないか」という恐怖に追いつめられます。",
"怪物が出てくるわけではありません。ただ、「知らない人が自分の生活へ入ってくる」という、とても身近な恐怖があります。最後まで女の正体がはっきりしないまま、不安だけが残るホラー漫画です。"
]},
{ cat:"m_drama", title:"ヒミズ", sub:"古谷実", author:"古谷実", authorYomi:"ふるやみのる", icon:"🚣", text:[
"中学生の住田祐一は、「特別な人間になりたい」とは思っていません。「普通の大人になれればそれでいい」と考えていました。",
"ところが住田の家庭は、まったく普通ではありません。父親は家へ戻ってきては暴力をふるい、母親も家を出ていきます。住田は一人で貸しボート屋を守りながら暮らします。",
"ある日、父との争いの中で、住田は取り返しのつかないことをしてしまいます。その瞬間から、「自分はもう普通の人間にはなれない」と思いこみ、自分を罰するような生活を始めます。",
"それでも、住田を好きな茶沢や周囲の人たちは、彼を見捨てません。完全に明るい終わりではありませんが、「それでも生きてみよう」と思えるところまで住田は進みます。絶望の中に、ほんの小さな希望を残す物語です。"
]},
{ cat:"m_drama", title:"シガテラ", sub:"古谷実", author:"古谷実", authorYomi:"ふるやみのる", icon:"🐟", text:[
"荻野は、ごく普通の高校生です。学校では不良たちにいじめられ、「自分なんて何の取りえもない」と思っています。",
"そんな荻野にも、大きな出来事が起こります。美しい年上の女性・南雲ゆみに出会い、なんと恋人になるのです。荻野は夢のように喜びます。",
"けれども、人生は恋がうまくいったからといって、すべてが幸せになるわけではありません。いじめ、事故、犯罪、友人の悩みなど、思いもしない危険が日常のすぐそばにあります。荻野は「いつ何が起こるか分からない」という不安を抱えながら成長していきます。",
"やがて荻野と南雲の関係にも終わりが来ます。何年かたち、荻野は別の人生を歩いています。青春の恋は永遠ではなかったけれど、その時間も含めて自分の人生だったのだと静かに受け入れていく物語です。"
]},
{ cat:"m_drama", title:"わにとかげぎす", sub:"古谷実", author:"古谷実", authorYomi:"ふるやみのる", icon:"🐊", text:[
"富岡ゆうじは、32歳の独身男性です。夜の警備員として働き、人とほとんど話さずに生きてきました。ある日ふと、「自分には友だちが一人もいない」と気づきます。",
"富岡は夜空に向かって、「友だちをください」と願います。するとそのあと、こわい手紙が届いたり、あやしい人たちとかかわったりして、静かだった生活が急ににぎやかになっていきます。そんな富岡を気にかけてくれるのが、近くに住む女性・羽田です。",
"富岡は事件に巻きこまれるたび、「逃げたい」と思います。それでも、だれかを助けるために少しだけ勇気を出します。そして羽田とも、おたがいのさびしさを分かりあうようになります。",
"やがて富岡と羽田は結婚することになります。「自分の人生を見ていてくれる人がいる」。ずっと一人だった男が、ようやく自分の居場所を見つけるまでのお話です。"
]},
{ cat:"m_drama", title:"ヒメアノ〜ル", sub:"古谷実", author:"古谷実", authorYomi:"ふるやみのる", icon:"🦎", text:[
"岡田進は、ビルの清掃会社で働く若者です。「このまま何となく年をとっていいのかな」と思いながらも、何をすればいいのか分かりません。",
"ある日、同僚の安藤から、カフェで働くユカという女性との恋を手伝ってほしいと頼まれます。ところが岡田は、その店で高校時代の同級生・森田と再会します。",
"森田は、昔ひどいいじめを受けていました。そして大人になった今、心が大きくゆがみ、人を傷つけることを何とも思わない危険な男になっていました。ユカも森田につきまとわれています。",
"岡田たちの「恋人がほしい」「幸せになりたい」という普通の日常と、森田の恐ろしい世界が、少しずつ近づいていきます。最後には森田の暴力が岡田たちにもおよび、平凡な暮らしがどれほど大切なものだったのかが、強く見えてくる物語です。"
]},
{ cat:"m_drama", title:"ザ・ワールド・イズ・マイン", sub:"新井英樹", author:"新井英樹", authorYomi:"あらいひでき", icon:"🐻", text:[
"トシとモンという二人の若者が、日本を旅しながら、次々と大きな事件を起こしていきます。",
"トシは頭がよく、自分なりの考えをもっています。けれどもモンは、何をするか分からない、とても危険な男です。二人の行動によって多くの人が巻きこまれ、日本中が二人を追うようになります。",
"そのころ山では、「ヒグマドン」と呼ばれる、とてつもなく大きな生き物まで現れます。人間が起こす暴力と、人間にはどうすることもできない自然の力が、同じ日本の中で大きくなっていきます。",
"「悪い人を倒せば終わり」という単純なお話ではありません。人はなぜ暴力をふるうのか。社会はどうして人を追いつめるのか。トシとモンの破滅へ向かう旅を通して、人間そのもののこわさを描いた、とても大きなお話です。"
]},
{ cat:"m_drama", title:"宮本から君へ", yomi:"みやもとからきみへ", sub:"新井英樹", author:"新井英樹", authorYomi:"あらいひでき", icon:"✊", text:[
"宮本浩は、文房具会社で働き始めたばかりの営業マンです。仕事はうまくできません。人付き合いもへたです。でも、「逃げたくない」という気持ちだけは、とても強い青年でした。",
"宮本は営業先へ何度も通い、ライバル会社と張り合い、負ければ本気でくやしがります。かっこ悪くても、頭を下げても、最後まで仕事をあきらめません。",
"やがて宮本は靖子という女性を愛するようになります。しかし靖子が大きく傷つけられる事件が起こります。宮本は、愛する人を守れなかった自分を責め、相手の男へ真正面からぶつかっていきます。",
"靖子のおなかには子どもができます。その子がだれの子なのかという苦しい問題も残ります。それでも宮本は、「自分が父親になる」と決めます。何度負けても、みっともなくても、それでも大切なものから逃げない男の物語です。"
]},
{ cat:"m_history", title:"ディエンビエンフー", sub:"西島大介", author:"西島大介", authorYomi:"にしじまだいすけ", icon:"🌿", text:[
"舞台は、戦争中のベトナムです。アメリカ軍に同行するカメラマンのヒカルは、戦場で一人の不思議な少女と出会います。",
"少女は小さな体をしていますが、とても強く、兵士たちを次々と倒します。ヒカルは彼女を恐れながらも、しだいに心をひかれていきます。",
"しかし二人のまわりでは、毎日のように人が戦っています。アメリカ軍、ベトナムの人々、兵士、一般の家族。それぞれに「自分には戦う理由がある」と考えていて、そのためにさらに多くの人が傷ついていきます。",
"ヒカルと少女の気持ちだけでは、戦争を止めることはできません。二人の小さな恋を中心に置きながら、そのまわりで大きな歴史が人々をのみこんでいく、かわいらしい絵とは反対に、とても悲しい戦争のお話です。"
]},
{ cat:"m_battle", title:"闇のイージス", yomi:"やみのイージス", sub:"原作：七月鏡一　作画：藤原芳秀", author:"七月鏡一／藤原芳秀", authorYomi:"じゅうがつきょういち", icon:"🛡️", text:[
"楯雁人は、「イージス」と呼ばれるすご腕のボディーガードです。",
"悪い人でも、追われている人でも、契約を結んだ相手なら必ず守ります。ただし、「人を殺す仕事には手を貸さない」という決まりを持っています。雁人の右腕は鋼鉄の義手で、銃弾から人を守ることさえできます。",
"昔の雁人は警察官でした。しかし大切な妻と息子を失い、自分も右腕を失いました。その悲しみを抱えながら、妻子を奪った宿敵を追い続けています。",
"さまざまな依頼人を守るうち、雁人は「命を守るとはどういうことか」を何度も問われます。復讐したい気持ちを抱えながら、それでも自分は人を殺さない。そんな一人の男が、闇の世界で「盾」となって生きていく物語です。"
]},
{ cat:"m_drama", title:"ありがとう", sub:"山本直樹", author:"山本直樹", authorYomi:"やまもとなおき", icon:"🏠", text:[
"ある父親が久しぶりに家へ帰ってくると、家族の暮らしはすっかりこわれていました。",
"妻も、二人の娘も、とてもひどい出来事によって心に大きな傷を負っています。父親は「家族を元どおりにしなければ」と思います。",
"けれども、一度できた心の傷は、「大丈夫だよ」と言うだけでは消えません。父も母も娘たちも、おたがいを愛しているはずなのに、怒ったり、傷つけあったりしてしまいます。",
"題名は『ありがとう』ですが、明るい家族のお話ではありません。「家族だから分かりあえる」とはかぎらない。それでも人は、こわれた家族の中で相手を求めてしまう。そんな人間のむずかしさを描いた物語です。"
]},
{ cat:"m_love", title:"blue", yomi:"ブルー", sub:"魚喃キリコ", author:"魚喃キリコ", authorYomi:"なななんきりこ", icon:"💙", text:[
"海辺の町にある女子高校に、桐島という女の子が通っていました。",
"桐島は、同級生の遠藤と仲よくなります。二人で話したり、町を歩いたりするうちに、桐島の中には、ただの友情とは少しちがう気持ちが生まれていきます。",
"けれども高校生活は、いつまでも続きません。進学や卒業が近づき、二人は少しずつ別々の未来を考えるようになります。好きだからこそ、相手とずっと同じ場所にはいられないこともあります。",
"二人の関係には、大きな奇跡は起こりません。それでも、一緒に過ごした時間は消えません。大人になる少し前の女の子たちの、友情とも恋とも言い切れない、静かで切ないお話です。"
]},
{ cat:"m_love", title:"strawberry shortcakes", spine:"strawberry|shortcakes", yomi:"ストロベリーショートケイクス", sub:"魚喃キリコ", author:"魚喃キリコ", authorYomi:"なななんきりこ", icon:"🍰", text:[
"東京で暮らす何人かの若い女性たちが、それぞれの毎日を送っています。",
"恋人がほしい人。好きな人とうまくいかない人。仕事をがんばっているのに心が満たされない人。自分のことを好きになれない人。みんな、外から見ると普通に生活しています。",
"でも夜、一人になったとき、「自分はこのままでいいのかな」と考えます。恋をすれば幸せになれると思っても、恋によってもっとさびしくなることもあります。",
"だれか一人がすべてを解決してくれるわけではありません。それでも女の人たちは、泣いたり笑ったりしながら、自分の毎日を続けます。都会で生きる女性たちの小さな孤独を、静かにつないだ物語です。"
]},
{ cat:"m_love", title:"南瓜とマヨネーズ", yomi:"かぼちゃとマヨネーズ", sub:"魚喃キリコ", author:"魚喃キリコ", authorYomi:"なななんきりこ", icon:"🎃", text:[
"土田は、ミュージシャンを目指すせいいちと一緒に暮らしています。",
"せいいちは音楽を作りますが、なかなかお金になりません。そのため土田が働いて、二人の生活を支えます。土田は「せいいちには音楽を続けてほしい」と願っていました。",
"そんなある日、土田は昔の恋人・ハギオと再会します。ハギオへの気持ちが完全には消えていなかった土田は、せいいちを大切に思いながらも、ハギオにもひかれてしまいます。",
"しかし昔の恋は、昔と同じようには戻りません。せいいちとの生活も少しずつ変わります。土田は最後に、「好きな人と一緒にいれば、それだけで何もかもうまくいくわけではない」と知り、自分の足で歩き始めます。"
]},
{ cat:"m_drama", title:"リバーズ・エッジ", sub:"岡崎京子", author:"岡崎京子", authorYomi:"おかざききょうこ", icon:"🏞️", text:[
"高校生の若草ハルナは、学校でいじめられている山田一郎と仲よくなります。",
"山田には、人に知られたくない秘密があります。そして川のそばの草むらには、二人だけが知っている、さらに大きな秘密が隠されていました。",
"学校の友だちは、恋をしたり、だれかをうらやんだり、自分の体や心に悩んだりしています。一見すると普通の高校生活ですが、みんな心の中に言えないことを抱えています。",
"やがて小さな悪意や嫉妬が大きな事件につながります。それでも川は、何もなかったように流れ続けます。青春をきれいなものとしてではなく、その中にあるさびしさや残酷さまで描いた物語です。"
]},
{ cat:"m_drama", title:"ヘルタースケルター", sub:"岡崎京子", author:"岡崎京子", authorYomi:"おかざききょうこ", icon:"💄", text:[
"りりこは、だれもが知っている人気モデルです。",
"顔も体もとても美しく、雑誌やテレビにたくさん出ています。しかしその美しさには秘密がありました。りりこは、全身に何度も大きな美容手術を受けていたのです。",
"人気を失いたくないりりこは、若くて美しい新しいモデルが現れるたび、不安になります。さらに手術の影響で体にも異変が起こり、心もどんどん追いつめられていきます。",
"やがて、りりこを美しくした病院の秘密も明るみに出ます。りりこは人々の前から姿を消しますが、物語の最後には、遠い場所で生きていることを思わせる姿が現れます。「美しさとはだれのためのものなのか」を描いたお話です。"
]},
{ cat:"m_love", title:"pink", yomi:"ピンク", sub:"岡崎京子", author:"岡崎京子", authorYomi:"おかざききょうこ", icon:"🐊", text:[
"ユミは会社で働く若い女性です。",
"ところがユミには、もう一つの仕事があります。夜になると別の仕事をしてお金をかせぎ、そのお金でペットのワニを育てています。",
"ユミは恋をしたり、お金に困ったりしながら、都会を自由に生きようとします。でも、自由に見える生活にも、さびしさがあります。",
"好きな人も、大切なものも、いつまでも自分のそばにいてくれるとはかぎりません。ユミは失うことを経験しながら、それでも毎日を続けます。かわいらしい題名の中に、都会で生きる人の孤独がつまった物語です。"
]},
{ cat:"m_drama", title:"愛すべき娘たち", yomi:"あいすべきむすめたち", sub:"よしながふみ", author:"よしながふみ", authorYomi:"よしながふみ", icon:"👩‍👧", text:[
"この作品には、いくつかの女性たちのお話が入っています。",
"娘と母。友だちどうし。恋人どうし。女の人たちは、身近な人を大切に思いながらも、「どうして分かってくれないの」と悩みます。",
"母親だからいつも正しいわけではありません。娘だから母親の言うことを全部聞かなければならないわけでもありません。人を好きになる形も、一つだけではありません。",
"それでも、完全には分かりあえない人を「それでも大切だ」と思うことがあります。いろいろな女性たちの人生を通して、「人を愛するって何だろう」と静かに考える短い物語の集まりです。"
]},
{ cat:"m_horror", title:"百鬼夜行抄", yomi:"ひゃっきやこうしょう", sub:"今市子", author:"今市子", authorYomi:"いまいちこ", icon:"👺", text:[
"飯嶋律は、小さいころから、普通の人には見えないものを見ることができました。",
"妖怪や幽霊たちが、律のまわりには当たり前のように現れます。律の祖父も不思議な力を持つ人で、生前からさまざまな妖怪とかかわっていました。",
"妖怪は、みんな悪いものではありません。人を助けるものもいれば、人間をだますものもいます。そして人間のほうが妖怪よりこわいことさえあります。",
"律は家族や妖怪たちに助けられながら、一つ一つの怪しい事件に向き合います。一つの大きな敵を倒して終わる物語ではなく、人と妖怪が同じ世界のすぐ近くで暮らしていることを描き続ける、不思議なお話です。"
]},
{ cat:"m_horror", title:"雨柳堂夢咄", yomi:"うりゅうどうゆめばなし", sub:"波津彬子", author:"波津彬子", authorYomi:"はつあきこ", icon:"🏺", text:[
"古い町の中に、「雨柳堂」という骨董品のお店があります。",
"そこには、昔の茶わんや人形、絵、道具などが並んでいます。店にいる少年・蓮には、普通の人には見えないものを見る力があります。",
"古い品物には、長いあいだ大切にした人の思いや、悲しい思い出が残っていることがあります。ときには、その思いが幽霊のように姿を見せることもあります。",
"蓮は、品物の声を聞きながら、持ち主と物の間に残った心残りをほどいていきます。大きな戦いではなく、一つ一つの古い物に隠された、小さくて不思議な物語を集めた作品です。"
]},
{ cat:"m_horror", title:"Petshop of Horrors", spine:"Petshop of|Horrors", yomi:"ペットショップオブホラーズ", sub:"秋乃茉莉", author:"秋乃茉莉", authorYomi:"あきのまつり", icon:"🐉", text:[
"アメリカのチャイナタウンに、とても不思議なペットショップがあります。",
"店を開いているのは「D伯爵」と呼ばれる美しい青年です。そこでは犬や猫だけでなく、人間の姿にも見える、不思議な生き物が売られています。",
"ペットを買う人には、必ず守らなければならない約束があります。「これを食べさせてはいけません」「人に見せてはいけません」。約束を守れば幸せになれます。でも約束を破ると、大変なことが起こります。",
"刑事のレオンは、「この店はあやしい」とD伯爵を追い続けます。ところが事件を調べるうち、人間の欲ばかりが悲劇を生んでいることに気づきます。最後にはD伯爵は店を去り、レオンはそのあとを追っていくのでした。"
]},
{ cat:"m_fantasy", title:"観用少女", yomi:"プランツドール", sub:"川原由美子", author:"川原由美子", authorYomi:"かわはらゆみこ", icon:"🎎", text:[
"この世界には、「プランツ・ドール」と呼ばれる、とても美しい少女のような生き物がいます。",
"人形のように小さく、美しい姿をしていますが、ちゃんと生きています。育てるにはミルクやお菓子、そして何よりも、持ち主からの愛情が必要です。",
"お金持ちが買うこともあれば、さびしい人のところへやってくることもあります。大切に育てられた少女は、持ち主の心をやさしくしてくれることがあります。",
"でも、人形のように扱ったり、自分の欲のためだけに愛そうとすると、悲しい結果になることもあります。一人一人の持ち主と少女の出会いを描いた、美しくて少しさびしいおとぎ話のような作品です。"
]},
{ cat:"m_horror", title:"夢幻紳士", yomi:"むげんしんし", sub:"高橋葉介", author:"高橋葉介", authorYomi:"たかはしようすけ", icon:"🎩", text:[
"夢幻魔実也という、不思議な力を持った青年がいます。",
"彼のまわりでは、幽霊、妖怪、怪物、夢の中のような事件が次々と起こります。魔実也は探偵のように、その謎へ近づいていきます。",
"ところが、ふつうの探偵のお話とはちがいます。「犯人はこの人でした」と分かっても、それですべてが終わるとはかぎりません。夢と現実がまざり、死んだ人と生きている人の境目まで、分からなくなることがあります。",
"『夢幻紳士』には何種類ものシリーズがあり、魔実也の姿や雰囲気も少しずつ変わります。どの作品にも共通するのは、美しくてこわい、夢の中を歩いているような世界です。"
]},
{ cat:"m_horror", title:"栞と紙魚子", yomi:"しおりとしみこ", sub:"諸星大二郎", author:"諸星大二郎", authorYomi:"もろほしだいじろう", icon:"📚", text:[
"栞と紙魚子は、ごく普通の女の子です。",
"……と言いたいところですが、二人が住んでいる町では、普通ではないことばかり起こります。",
"図書館に変な生き物がいたり、家に怪物がやってきたり、死んだ人や妖怪と話すことになったりします。でも栞と紙魚子は、だんだんそんな出来事にも慣れてしまいます。",
"とてもこわいはずの怪物が、ごはんを食べたり、家族を作ったりすることもあります。「こわいのに、おかしい」。そんな不思議な出来事が次々と起こる、怪談とコメディーがまざった物語です。"
]},
{ cat:"m_horror", title:"諸怪志異", yomi:"しょかいしい", sub:"諸星大二郎", author:"諸星大二郎", authorYomi:"もろほしだいじろう", icon:"🏮", text:[
"昔の中国を思わせる世界には、人間だけでなく、妖怪や仙人、不思議な術を使う者たちが暮らしています。",
"旅をしている人が山へ入ると、奇妙なものに出会います。人間だと思って話していた相手が、ほんとうは妖怪だったということもあります。",
"悪い妖怪を退治すればすべて解決するわけではありません。妖怪にも事情があり、人間の欲深さが事件を起こしていることもあります。",
"中国に昔から伝わる怪しいお話の雰囲気を使いながら、諸星大二郎独自の世界を描いた作品です。「この世には、人間の知らない世界がまだあるかもしれない」と思わせてくれるお話です。"
]},
{ cat:"m_fantasy", title:"西遊妖猿伝", yomi:"さいゆうようえんでん", sub:"諸星大二郎", author:"諸星大二郎", authorYomi:"もろほしだいじろう", icon:"🐒", text:[
"昔の中国。孫悟空という少年が、花果山の近くで暮らしていました。",
"ある日、悟空は妖怪・無支奇から「斉天大聖」という力を受けます。その力によって、悟空は普通の人にはできないほど強くなります。しかし力を使うたび、戦いや争いへ巻きこまれていきます。",
"やがて悟空は、遠い天竺を目指す僧・玄奘と出会います。「この人について行けば、自分の運命も変わるかもしれない」。そう考えた悟空は玄奘を追い、長い旅へ出ます。",
"有名な『西遊記』をもとにしていますが、妖怪退治だけではありません。実際の中国の歴史や戦争もまざっています。悟空たちは何度も人間の争いに巻きこまれながら、西へ、西へと旅を続けていくのでした。"
]},
{ cat:"m_drama", title:"事件屋稼業", yomi:"じけんやかぎょう", sub:"原作：関川夏央　作画：谷口ジロー", author:"関川夏央／谷口ジロー", authorYomi:"せきかわなつお", icon:"🕵️", text:[
"深町丈太郎は、町の小さな探偵です。",
"お金には少しだらしなく、お酒も好きです。「お金にならない仕事はいやだ」と言うこともあります。それでも、困っている人を見ると放っておけません。",
"人探し、失踪、犯罪、男女のもめごとなど、いろいろな依頼が深町のもとへやってきます。悪い警官やヤクザとかかわることもあります。",
"深町は、映画の名探偵のようにいつもかっこいいわけではありません。失敗もします。それでも最後には、自分なりのやり方で人を助けます。大人の町を生きる、不器用な探偵のお話です。"
]},
{ cat:"m_daily", title:"迷走王 ボーダー", yomi:"めいそうおう ボーダー", sub:"原作：狩撫麻礼　作画：たなか亜希夫", author:"狩撫麻礼／たなか亜希夫", authorYomi:"かりぶまれい", icon:"🚽", text:[
"長い外国旅行から帰ってきた蜂須賀は、東京のぼろぼろのアパート「月光荘」で暮らし始めます。",
"部屋はなんと、昔トイレだった小さな場所です。それでも蜂須賀は気にしません。久保田や木村と一緒に、お金も仕事もあまりない生活を送ります。",
"世の中の人たちは、会社へ入り、お金をかせぎ、立派な生活をしようとします。蜂須賀たちは、そんな世界から少し外れた「境界線＝ボーダー」に立って、自分の好きなように生きようとします。",
"もちろん、そのせいでお金に困ったり、変な事件に巻きこまれたりします。それでも三人は、世間に合わせるより、自分で考えて生きる道を選びます。「立派な人生って何だろう」と笑いながら考えるお話です。"
]},
{ cat:"m_history", title:"坊っちゃんの時代", yomi:"ぼっちゃんのじだい", sub:"原作：関川夏央　作画：谷口ジロー", author:"関川夏央／谷口ジロー", authorYomi:"せきかわなつお", icon:"📖", text:[
"明治時代、日本は大きく変わろうとしていました。",
"夏目漱石、森鷗外、石川啄木など、今では教科書に出てくる作家たちも、この時代を生きた一人の人間でした。",
"漱石は外国へ留学して悩み、教師をしながら小説を書きます。鷗外も、外国で学んだことと日本社会の間で苦しみます。若い文学者たちは、「新しい日本で、どう生きればいいのだろう」と考え続けます。",
"『坊っちゃん』などの有名な作品が、作者のどんな経験から生まれたのかも見えてきます。歴史上の偉人を「立派な人」としてだけではなく、迷ったり悩んだりする若者として描いた、明治時代の青春物語です。"
]},
{ cat:"m_gag", title:"神聖モテモテ王国", yomi:"しんせいモテモテおうこく", sub:"ながいけん", author:"ながいけん", authorYomi:"ながいけん", icon:"👑", text:[
"ファーザーと呼ばれる、とても変わった男がいます。",
"彼の大きな夢は、「女性にモテて、モテモテ王国を作ること」です。そのため毎日のように、どうすれば女性にモテるのかを考えます。",
"ところが、考える作戦はどれも変なものばかりです。本人だけは大まじめなのですが、まわりの人から見ると、何をしているのかさっぱり分かりません。",
"結局、立派な王国ができるわけでも、急にモテモテになるわけでもありません。壮大な夢を語りながら、毎回くだらない失敗をくり返す。そのずれを楽しむ、不思議なギャグ漫画です。"
]},
{ cat:"m_gag", title:"究極超人あ〜る", yomi:"きゅうきょくちょうじんあーる", sub:"ゆうきまさみ", author:"ゆうきまさみ", authorYomi:"ゆうきまさみ", icon:"🤖", text:[
"春風高校へ、R・田中一郎という転校生がやってきます。",
"見た目は高校生ですが、ほんとうは成原博士が作ったアンドロイドでした。しかも、とてもぼんやりした性格で、ごはんが大好きです。",
"Rは学校の「光画部」に入ります。光画部は写真を撮る部活のはずなのですが、鳥坂先輩をはじめ、変な人ばかりが集まっています。写真を撮るより、遊んだり、旅行したり、大さわぎしたりする時間のほうが長いくらいです。",
"やがて仲間たちは卒業していきます。でもRは単位が足りず、なぜか学校に残ることになります。高校の文化部で過ごす、どうでもいいようで忘れられない毎日を描いた青春コメディーです。"
]},
{ cat:"m_gag", title:"県立地球防衛軍", yomi:"けんりつちきゅうぼうえいぐん", sub:"安永航一郎", author:"安永航一郎", authorYomi:"やすながこういちろう", icon:"🦸", text:[
"九州のある県に、「電柱組」という悪の組織が現れます。",
"「県を征服するぞ！」と言い出した電柱組に対抗するため、県は高校生たちを集めて「県立地球防衛軍」を作ります。",
"ところが正義の味方も、悪の組織も、どこか変です。ものすごいサイボーグが現れたり、博士が勝手な改造をしたりして、地球を守っているのか、ただ騒ぎを大きくしているのか分からなくなります。",
"世界を救う壮大なお話のようで、実際には九州の一つの県でみんなが大さわぎしているだけ。特撮ヒーローを思いきりふざけて描いた、にぎやかなギャグ漫画です。"
]},
{ cat:"m_gag", title:"炎の転校生", yomi:"ほのおのてんこうせい", sub:"島本和彦", author:"島本和彦", authorYomi:"しまもとかずひこ", icon:"🔥", text:[
"滝沢昇は、とても熱い心を持った高校生です。",
"ある日、滝沢は新しい学校へ転校します。ところが、この学校では生徒たちが、まるで格闘家のように戦っています。",
"滝沢も、「転校生なら自分の力で道を切り開け！」とばかりに、さまざまな相手と戦うことになります。普通なら一言で済むようなことでも、滝沢たちは全力で叫び、全力でぶつかります。",
"友情も恋も学校生活も、すべてが大げさな戦いになります。熱血漫画のお約束を思いきり大きくして笑いに変えた、「何ごとも全力でやれば、なぜかかっこいい」というお話です。"
]},
{ cat:"m_baseball", title:"逆境ナイン", yomi:"ぎゃっきょうナイン", sub:"島本和彦", author:"島本和彦", authorYomi:"しまもとかずひこ", icon:"⚾", text:[
"全力学園の野球部は、校長先生からとつぜん言われます。",
"「結果を出せない野球部は廃部だ」。",
"部員たちは大あわてです。その中心にいるのが、キャプテンの不屈闘志です。不屈は、その名前のとおり、どんなに苦しい状況でも「これは逆境だ！」と燃えあがります。",
"けがをしても、点差をつけられても、仲間がいなくなっても、「逆境であればあるほど燃える！」と言って立ち上がります。ときには、どう考えても無理な試合さえ、気合いで何とかしようとします。",
"野球漫画ですが、ほんとうの敵は「もう無理だ」と思う自分の心です。ものすごく大げさで笑えるのに、読んでいると少し元気になる、熱血スポーツ漫画です。"
]},
{ cat:"m_sf", title:"まんがサイエンス", sub:"あさりよしとお", author:"あさりよしとお", authorYomi:"あさりよしとお", icon:"🔬", text:[
"あさりちゃんたち子どもが、「どうしてだろう？」と思ったことを、科学の力で調べていきます。",
"宇宙はどうなっているのか。ロケットはなぜ飛ぶのか。人間の体はどう動いているのか。電気とは何なのか。",
"先生や科学者が出てきて、難しい仕組みを絵で説明してくれます。でも説明だけではなく、途中で失敗したり、変な実験をしたりするので、笑いながら読めます。",
"一つの長い物語ではありません。「科学って難しそう」と思っている子どもでも、「なるほど、そういうことか」と分かるように、身近な疑問から科学の世界へ案内してくれる漫画です。"
]},
{ cat:"m_gag", title:"よいこ", sub:"石川優吾", author:"石川優吾", authorYomi:"いしかわゆうご", icon:"🎀", text:[
"江角風花は、小学五年生の女の子です。",
"見た目は少し大人っぽいのですが、中身は元気いっぱいの小学生です。友だちのミキたちと一緒に、学校や町で毎日いろいろなことをします。",
"大人が決めた変なルールに「どうして？」と疑問を持ったり、友だちを助けようとして、かえって大さわぎになったりします。",
"風花の目から見ると、大人の世界には変なことがたくさんあります。でも子どもの世界にも、けんかや悩みがあります。元気な小学生の日常を通して、大人と子どもの両方のおかしさを描いたコメディーです。"
]},
{ cat:"m_daily", title:"団地ともお", yomi:"だんちともお", sub:"小田扉", author:"小田扉", authorYomi:"おだとびら", icon:"🏘️", text:[
"木下ともおは、団地に住む小学四年生です。",
"勉強がとくべつできるわけでもなく、スポーツの天才でもありません。でも遊ぶことになると、一生けんめいです。単身赴任中のお父さんとは離れて暮らし、お母さんとお姉ちゃんと三人で生活しています。",
"友だちと虫を捕まえたり、ゲームをしたり、変な勝負を始めたりします。大人から見ると「そんなこと、どうでもいいのに」と思うことでも、ともおたちには大事件です。",
"ときには家族のことや、年をとること、別れについて考えるお話もあります。それでも次の日になれば、ともおはまた外へ遊びに行きます。小学生の毎日を、とてもおかしく、時々やさしく描いた物語です。"
]},
{ cat:"m_sf", title:"ぼくらのよあけ", sub:"今井哲也", author:"今井哲也", authorYomi:"いまいてつや", icon:"🛸", text:[
"2049年の夏。小学四年生の沢渡悠真は、宇宙が大好きな男の子です。",
"ある日、家にいるロボット・ナナコの中へ、知らない存在が入りこみます。その正体は「二月の黎明号」という、宇宙からやってきた存在でした。",
"二月の黎明号は、ずっと昔に地球へ落ち、悠真たちが暮らしている団地の中へ隠れていました。そして「宇宙へ帰るのを手伝ってほしい」と子どもたちに頼みます。",
"悠真たちは、大人には秘密で作戦を始めます。友だちとけんかをしたり、こわくなったりしながらも、宇宙へ帰りたい相手のために力を合わせます。子どもたちのひと夏の冒険と別れを描いたSFのお話です。"
]},
{ cat:"m_drama", title:"世界の終わりと夜明け前", spine:"世界の終わりと|夜明け前", yomi:"せかいのおわりとよあけまえ", sub:"浅野いにお", author:"浅野いにお", authorYomi:"あさのいにお", icon:"🌅", text:[
"この本には、いくつもの短いお話が入っています。",
"学校へ行く若者、働く大人、恋人どうし、家族。それぞれは普通に暮らしているように見えます。でも心の中には、だれにも言えない不安があります。",
"「このまま毎日が続くのかな」「自分はどこへ向かっているのだろう」。そんなことを考えながら、それでも朝はやってきます。",
"世界が本当に終わるわけではありません。でも一人の人にとっては、恋が終わったり、夢を失ったりすることが「世界の終わり」のように感じられることがあります。それでも、そのあとにはまた朝が来る。そんな人々を描いた短編集です。"
]},
{ cat:"m_daily", title:"センネン画報", yomi:"センネンがほう", sub:"今日マチ子", author:"今日マチ子", authorYomi:"きょうまちこ", icon:"🖼️", text:[
"この作品には、大きな一つの物語はありません。",
"女の子が町を歩いています。電車に乗ります。雨が降ります。学校から帰ります。だれかを好きになったり、少しさびしくなったりします。",
"一つ一つは、ほんの短い場面です。でも、何でもない一日にも、あとから思い出すと大切だった時間があります。",
"言葉をたくさん使わず、絵と短い文章で、少女たちの毎日を切り取っていきます。写真のアルバムを一枚ずつめくるように、小さな青春の瞬間を集めた作品です。"
]},
{ cat:"m_drama", title:"マイ・ブロークン・マリコ", sub:"平庫ワカ", author:"平庫ワカ", authorYomi:"ひらこわか", icon:"⚱️", text:[
"シイノはある日、親友のマリコが亡くなったことを知ります。",
"あまりに突然だったので、シイノは悲しむことさえうまくできません。「どうして私に何も言わなかったの」と、怒りまでわいてきます。",
"マリコは子どものころから家族との関係に苦しんでいました。シイノは、そんなマリコの遺骨を父親のもとから持ち出します。そして「マリコが行きたがっていた海へ連れていこう」と旅に出ます。",
"旅をしながら、シイノはマリコとの思い出を一つずつ思い出します。最後には、もうマリコに返事をしてもらえないことを受け入れながら、それでも友だちを愛していた気持ちを抱えて生きていこうとします。"
]},
{ cat:"m_daily", title:"ひとりでしにたい", sub:"カレー沢薫", author:"カレー沢薫", authorYomi:"かれーざわかおる", icon:"🏠", text:[
"山口鳴海は、30代の独身女性です。",
"ある日、一人暮らしをしていた親せきが亡くなります。長いあいだ発見されなかったことを知り、鳴海は急にこわくなります。",
"「自分も将来、一人で死ぬかもしれない。それなら、ちゃんと準備しておこう」。鳴海はお金、家、介護、病気、お墓など、今まで考えなかったことを調べ始めます。",
"調べてみると、「結婚すれば安心」「子どもがいれば安心」というほど、人生は簡単ではないことも分かります。笑える会話をたくさん入れながら、「老いること」「一人で生きること」をまじめに考えていく物語です。"
]},
{ cat:"m_daily", title:"生理ちゃん", yomi:"せいりちゃん", sub:"小山健", author:"小山健", authorYomi:"こやまけん", icon:"🩸", text:[
"女の人のところへ、ときどき「生理ちゃん」がやってきます。",
"生理ちゃんは、まるで生き物のような姿をしています。そしておなかを痛くしたり、体を重くしたりして、「今月も来ましたよ」と知らせます。",
"仕事中でも、デート中でも、旅行中でも、生理ちゃんはやってきます。まわりの人には、そのつらさが見えないこともあります。",
"この作品では、生理だけでなく、恋愛、妊娠、仕事など、女の人の体とかかわるいろいろな悩みを描きます。「本人にしか分からないつらさがある」ということを、かわいらしく、少し笑える形で伝える短いお話の集まりです。"
]},
{ cat:"m_drama", title:"水は海に向かって流れる", spine:"水は海に|向かって流れる", yomi:"みずはうみにむかってながれる", sub:"田島列島", author:"田島列島", authorYomi:"たじまれっとう", icon:"💧", text:[
"高校生の直達は、学校へ通うため、叔父さんが暮らすシェアハウスに住むことになります。",
"その家には、26歳の榊千紗という女性も住んでいました。榊さんはあまり笑わず、「恋愛はしない」と決めています。",
"やがて直達は、自分の父親と榊さんの家族のあいだに、昔ある出来事があったことを知ります。大人たちがしたことによって、子どもだった榊さんの人生まで変わっていたのです。",
"直達は「親がしたことを、自分まで背負わなければならないのだろうか」と考えます。榊さんも、ずっと持っていた怒りと向き合います。そして二人は、過去を消すのではなく、自分たちの人生は自分たちで選ぼうと少しずつ前へ進んでいきます。"
]},
{ cat:"m_drama", title:"子供はわかってあげない", spine:"子供は|わかってあげない", yomi:"こどもはわかってあげない", sub:"田島列島", author:"田島列島", authorYomi:"たじまれっとう", icon:"🏊", text:[
"高校生の美波は、水泳部で元気に活動している女の子です。",
"ある日、同じ学校の門司という男の子と出会います。二人は好きな漫画の話で仲よくなります。",
"美波には、もう一つ気になっていることがありました。小さいころに別れた、本当のお父さんのことです。美波は門司の助けを借りながら、その父親を探すことになります。",
"ようやく会えた父には、父なりの生活がありました。美波が思い描いていた「お父さん」とは少しちがいます。それでも一緒に過ごした短い時間によって、美波は自分の家族について少しだけ知ります。ひと夏の恋と家族探しを描いた、やさしい青春のお話です。"
]},
{ cat:"m_fantasy", title:"違う冬のぼくら", yomi:"ちがうふゆのぼくら", sub:"制作：ところにょり", author:"ところにょり", authorYomi:"ところにょり", icon:"🦌", text:[
"二人の少年が家出をし、「どこか遠くへ行こう」と旅を始めます。",
"途中で二人は、死んだ鹿を見つけます。それをきっかけに、不思議なことが起こります。一人には世界が「動物の世界」に見え、もう一人には「機械の世界」に見えるようになるのです。",
"二人は同じ場所にいるのに、見えているものがまったく違います。だから「こっちに道があるよ」「僕には壁に見えるよ」と話しあわなければ進めません。",
"旅の途中では、二人で大切な選択もしなければなりません。相手と同じものを見られなくても、言葉を使えば分かりあえるのか。二人の友情そのものを遊びにしたような物語です。"
]},
{ cat:"m_daily", title:"ひらやすみ", sub:"真造圭伍", author:"真造圭伍", authorYomi:"しんぞうけいご", icon:"🏡", text:[
"生田ヒロトは、29歳のフリーターです。立派な仕事もなく、恋人もいません。でも本人は、あまり気にせずのんびり暮らしています。",
"そんなヒロトは、仲よくしていた近所のおばあさんから、一軒の平屋を譲ってもらいます。そこへ、美術大学へ通うため田舎から上京してきた、いとこのなつみも住むことになります。",
"なつみは将来に悩み、友人たちも仕事や恋に悩みます。ヒロトは答えを教えるわけではありません。ただ、ごはんを食べたり、話を聞いたりします。",
"大きな事件はあまり起こりません。「今日は晴れたね」「ごはんがおいしいね」という小さな時間が、人の心を少しずつ軽くしていく、平屋での日常を描いた物語です。"
]},
{ cat:"m_sports", title:"ひゃくえむ。", sub:"魚豊", author:"魚豊", authorYomi:"うおと", icon:"🏃", text:[
"トガシは、小さいころから足の速い少年でした。",
"100メートル走なら、だれにも負けません。「速く走れば、みんなが自分を認めてくれる」。トガシにとって走ることは、自分の居場所を作る方法でした。",
"ある日、小宮という少年と出会います。小宮は最初、それほど速くありません。でも「もっと速くなりたい」と、本気で走り続けます。やがて小宮は、トガシがこわくなるほど速くなっていきます。",
"二人は成長し、大人になっても100メートルを走ります。勝つ人もいれば負ける人もいます。トガシも一度は走る意味を失います。それでも最後には、たった十秒ほどの競走のために全力を出す喜びを思い出します。「なぜ人は走るのか」を描いた物語です。"
]},
{ cat:"m_horror", title:"ようきなやつら", sub:"岡田索雲", author:"岡田索雲", authorYomi:"おかださくも", icon:"🏮", text:[
"この作品には、日本の昔からいる妖怪たちが登場します。",
"化け猫、山姥、河童、提灯小僧。名前だけ聞けば、こわい妖怪ばかりです。でも彼らにも、生活があり、悩みがあります。",
"妖怪が人間をこわがらせるだけではありません。人間社会の中で居場所をなくした妖怪や、人間の悲しみに寄りそっている妖怪もいます。",
"表題作では、妖怪を見ることのできる武良木という男も登場します。「ほんとうに不思議なのは妖怪なのか、それとも人間なのか」。昔話の妖怪を使いながら、今の社会に生きる人たちを描いた短編集です。"
]},
{ cat:"m_art", title:"これ描いて死ね", yomi:"これかいてしね", sub:"とよ田みのる", author:"とよ田みのる", authorYomi:"とよだみのる", icon:"✏️", text:[
"安海相は、伊豆の島に住む高校一年生です。",
"相は漫画が大好きです。読むだけでも幸せでしたが、ある出来事をきっかけに、「自分でも漫画を描いてみたい」と思うようになります。",
"相があこがれていた漫画家の正体は、なんと学校の先生・手島でした。手島先生は昔、漫画家として苦しい経験をしていました。そのため最初は「漫画なんて描かなくてもいい」と言います。それでも相の情熱に負けて、漫画研究会の先生になります。",
"相たちは、漫画の描き方も知らないところから始めます。作品を人に見せて落ちこんだり、同人誌を作ったりしながら、「漫画を描くって楽しい」と知っていきます。",
"物語が進むと、手島先生にも島を離れる時が近づいてきます。それでも先生から教わったものは、生徒たちの中に残ります。漫画を読む人が、漫画を作る人になっていく成長物語です。"
]},
{ cat:"m_daily", title:"じゃりン子チエ", yomi:"じゃりンこチエ", sub:"はるき悦巳", author:"はるき悦巳", authorYomi:"はるきえつみ", icon:"🐈", text:[
"大阪の町に、竹本チエという元気な女の子が暮らしています。",
"チエはまだ小学生ですが、家のホルモン焼き屋を手伝い、お金の計算までしています。なぜなら父親のテツが、仕事をせず、けんかや遊びばかりしているからです。",
"チエは「ほんまにしょうがないお父ちゃんやな」と怒りながらも、テツを完全に嫌いにはなれません。まわりには、お母さんのヨシ江、おじいちゃん、おばあちゃん、近所のおじさん、猫たちまで、変わった仲間がたくさんいます。",
"大金持ちになるわけでも、大事件を解決するわけでもありません。けんかをして、笑って、ごはんを食べて、また次の日を生きます。貧しくてもたくましい町の人々を、チエの目から描いた長い人情コメディーです。"
]},
{ cat:"m_history", title:"浮浪雲", yomi:"はぐれぐも", sub:"ジョージ秋山", author:"ジョージ秋山", authorYomi:"じょーじあきやま", icon:"☁️", text:[
"江戸時代。品川の問屋場に、「雲」と呼ばれる男がいます。",
"雲は仕事をしているのか、していないのか、よく分かりません。酒を飲み、女性に声をかけ、ふらふら町を歩いています。",
"妻や子どもから見ると、「もっとしっかりしてよ」と言いたくなる父親です。でも、だれかが本当に困っているときには、雲は不思議な言葉をかけます。",
"侍も商人も町人も、それぞれ悩みを抱えています。雲は答えを押しつけません。「まあ、そんなに急がなくてもいいじゃないか」とでも言うように、人々を見守ります。",
"一つの大きな事件が最後に解決する物語ではありません。雲の家族や江戸の人々が年を重ねていく中で、「人はどう生きればいいのだろう」と、のんびり問い続ける長い物語です。"
]},
{ cat:"m_work", title:"釣りバカ日誌", yomi:"つりバカにっし", sub:"原作：やまさき十三　作画：北見けんいち", author:"やまさき十三／北見けんいち", authorYomi:"やまさきじゅうぞう", icon:"🎣", text:[
"浜崎伝助、通称ハマちゃんは、会社員です。",
"ところが仕事よりも、ずっと好きなものがあります。それが釣りです。会社の仕事が終われば釣り。休みの日も釣り。頭の中は魚でいっぱいです。",
"そんなハマちゃんが、ある日、釣り好きのおじさんと仲よくなります。ところがその人は、なんと自分が勤める会社の社長・鈴木一之助、通称スーさんでした。",
"会社では「社長と平社員」。でも釣り場では、ただの友だちです。ハマちゃんがスーさんをしかることさえあります。",
"会社では出世競争や大きな仕事が起こりますが、ハマちゃんはあまり気にしません。「仕事のために生きるのではなく、楽しく生きるために仕事をする」。そんなハマちゃんとスーさんの友情を、長い年月にわたって描くお話です。"
]},
{ cat:"m_love", title:"黄昏流星群", yomi:"たそがれりゅうせいぐん", sub:"弘兼憲史", author:"弘兼憲史", authorYomi:"ひろかねけんし", icon:"🌠", text:[
"この作品の主人公は、一人ではありません。",
"あるお話では、長いあいだ会社のために働いてきた男性が主人公です。別のお話では、家庭を守ってきた女性や、年をとった男女が主人公になります。",
"若いころは、仕事や子育てで夢中でした。でも人生の後半に入ったとき、「自分の人生はこれでよかったのかな」と考える人たちがいます。",
"そんなとき、昔好きだった人と再会したり、新しい人を好きになったりします。もちろん、すべての恋が幸せに終わるわけではありません。家族がいる人もいて、別れなければならない恋もあります。",
"夕方の空に流れ星が見えるように、人生の「黄昏」と呼ばれる年齢になっても、人の心には新しい恋や夢が生まれます。さまざまな中高年の男女の人生と恋を、一つずつ描いていく長いシリーズです。"
]},
{ cat:"m_drama", title:"人間交差点", yomi:"ヒューマンスクランブル", sub:"原作：矢島正雄　作画：弘兼憲史", author:"矢島正雄／弘兼憲史", authorYomi:"やじままさお", icon:"🚦", text:[
"町には、たくさんの人が暮らしています。会社で働く人、家族とうまくいかない人、昔のことを後悔している人、罪を犯してしまった人。みんな、それぞれに自分の人生を生きています。",
"ある人は、何十年も会っていなかった家族と再会します。ある人は、自分が昔傷つけた相手と、思いがけない場所で会います。悪いことをした人にも、そこへたどり着くまでの人生があります。",
"もちろん、すべてのお話が幸せに終わるわけではありません。仲直りできない人もいれば、大切な人を失ってから、その大切さに気づく人もいます。",
"一人だけの主人公がいる漫画ではありません。たくさんの人の人生が交差していく中で、「人間はどうしてこんなに、だれかを愛したり憎んだりするのだろう」と考えさせてくれる物語です。"
]},
{ cat:"m_drama", title:"ハロー張りネズミ", yomi:"ハローはりネズミ", sub:"弘兼憲史", author:"弘兼憲史", authorYomi:"ひろかねけんし", icon:"🦔", text:[
"七瀬五郎は、「あかつか探偵事務所」で働く探偵です。",
"五郎のところには、毎日のように変わった依頼がやってきます。「いなくなった人を探してほしい」「昔の事件を調べてほしい」「家族の秘密を知りたい」。五郎は仲間といっしょに、その謎を追いかけます。",
"調べていくうちに、ただの人探しだと思っていた事件が犯罪につながったり、昔の悲しい出来事が見つかったりします。ときには、幽霊や超常現象のような、とても不思議な事件まで起こります。",
"五郎は名探偵のようにかっこつける男ではありません。それでも、困っている人を見ると放っておけません。笑える事件から重い事件まで、いろいろな人の人生に飛びこんでいく探偵のお話です。"
]},
{ cat:"m_love", title:"東京ラブストーリー", yomi:"とうきょうラブストーリー", sub:"柴門ふみ", author:"柴門ふみ", authorYomi:"さいもんふみ", icon:"💐", text:[
"永尾完治は、愛媛から東京へやってきた若い会社員です。東京で働き始めた完治の前に、明るく自由な女性・赤名リカが現れます。",
"リカは完治のことをまっすぐに好きになります。「カンチ」と呼び、遠慮せずに気持ちを伝えます。でも完治の心には、学生時代から好きだった関口さとみがいました。",
"さとみは三上という男性との恋に悩み、完治もリカを愛しながら、昔の気持ちを捨てきれません。四人の思いは、何度もすれちがいます。",
"リカは完治を強く愛しますが、完治の心を自分だけに向けることはできませんでした。二人は別れ、完治はやがてさとみと人生を歩くことになります。好きなのに一緒になれないこともある。そんな大人の恋を描いた物語です。"
]},
{ cat:"m_love", title:"あすなろ白書", yomi:"あすなろはくしょ", sub:"柴門ふみ", author:"柴門ふみ", authorYomi:"さいもんふみ", icon:"🌲", text:[
"大学へ入った園田なるみは、そこで何人かの若者と出会います。",
"取手治、掛居保、星香など、性格のちがう若者たちは仲よくなり、「あすなろ会」と呼ばれる仲間になります。いっしょに遊び、勉強し、恋をします。",
"なるみは掛居を好きになります。しかし恋というものは、「好きです」「はい、私も好きです」と簡単には進みません。だれかを好きな人が、別の人から好かれていることもあります。",
"やがて大学生活が終わり、みんなは社会へ出ていきます。昔と同じように、ずっと仲間でいることもできません。それでも、一緒に過ごした青春の時間は消えません。",
"恋がかなう人も、かなわない人もいる。そんな若者たちが、大人になるまでを描いた青春のお話です。"
]},
{ cat:"m_love", title:"同・級・生", yomi:"どうきゅうせい", sub:"柴門ふみ", author:"柴門ふみ", authorYomi:"さいもんふみ", icon:"🎓", text:[
"若い男女が、学生生活を終え、社会へ出ていきます。",
"学生のころなら、「好きだから一緒にいたい」と考えるだけでもよかったかもしれません。でも大人になると、仕事、結婚、将来、家族など、いろいろなことを考えなくてはなりません。",
"昔から好きだった人がいても、新しい人を好きになることがあります。「この人と一緒なら幸せになれる」と思っても、心が別の人へ向いてしまうこともあります。",
"登場人物たちは、恋をして、傷つき、相手を傷つけながら、少しずつ大人になります。",
"「好き」という気持ちだけでは決められない大人の恋を、同じ世代の若者たちを通して描いた物語です。"
]},
{ cat:"m_work", title:"ショムニ", sub:"安田弘之", author:"安田弘之", authorYomi:"やすだひろゆき", icon:"💡", text:[
"大きな会社の片すみに、「庶務二課」という部署があります。略して「ショムニ」です。",
"会社の人たちからは、「役に立たない人が送られる場所」と思われています。そこには、会社のえらい人たちの言うことを素直に聞かない、変わった女性たちが集まっています。",
"彼女たちは電球を取り替えたり、備品を運んだりします。でも会社で大きな問題が起こると、なぜか最後にはショムニの人たちが活躍します。",
"「会社で出世することだけが、本当に立派なの？」。ショムニの女性たちは、えらそうな上司や会社の変な決まりを笑い飛ばします。",
"会社のはしっこに追いやられた女性たちが、だれよりも自由にたくましく生きる、お仕事コメディーです。"
]},
{ cat:"m_daily", title:"ツヨシしっかりしなさい", sub:"永松潔", author:"永松潔", authorYomi:"ながまつきよし", icon:"👦", text:[
"井川ツヨシは、ごく普通の男の子です。",
"ところがツヨシの家では、女性たちがとても強いのです。お母さんやお姉さんたちから、「ツヨシ、これやって」「しっかりしなさい」と、毎日のように言われます。",
"家事を手伝い、おつかいへ行き、学校へ行けば友だちとの出来事があります。ツヨシは文句を言いながらも、けっきょく家族のために働きます。",
"恋をしたり、失敗したり、大人になることについて考えたりしながら、ツヨシも少しずつ成長していきます。",
"大きな悪者と戦う物語ではありません。「しっかりしてよ」と言われ続ける男の子と、にぎやかな家族の毎日を描いたホームコメディーです。"
]},
{ cat:"m_sports", title:"奈緒子", yomi:"なおこ", sub:"原作：坂田信弘　作画：中原裕", author:"坂田信弘／中原裕", authorYomi:"さかたのぶひろ", icon:"🏃", text:[
"篠宮奈緒子は、小さいころ、長崎の島を訪れました。",
"そのとき海で事故が起こり、奈緒子を助けようとした男性が命を落としてしまいます。その男性には、雄介という息子がいました。",
"何年かたち、奈緒子は成長した雄介と再会します。雄介には、ものすごい速さで走る才能がありました。",
"雄介は駅伝や長距離走の世界へ進みます。でも心の中には、父を失った悲しみがあります。奈緒子もまた、「自分のせいだったのではないか」という思いを抱えています。",
"雄介は仲間たちと走りながら成長し、奈緒子も彼を見守ります。二人が過去の悲しみを抱えながら、それでも未来へ走っていこうとする、長い陸上物語です。"
]},
{ cat:"m_fight", title:"のたり松太郎", yomi:"のたりまつたろう", sub:"ちばてつや", author:"ちばてつや", authorYomi:"ちばてつや", icon:"🍙", text:[
"坂口松太郎は、とても大きくて力の強い青年です。",
"でも勉強は苦手で、働くこともあまり好きではありません。気に入らないことがあると、すぐに怒ってしまいます。",
"そんな松太郎の力を見た人が、「相撲をやってみないか」とすすめます。松太郎は相撲部屋へ入り、力士になります。",
"力だけなら、とても強い松太郎です。でも相撲の世界では、礼儀や稽古も大切です。わがままな松太郎は、親方や仲間と何度もぶつかります。",
"それでも試合になれば、とんでもない力を見せます。立派な人間になったとは言い切れないけれど、そんな松太郎が相撲の世界をのたりのたりと歩いていく、少し変わった力士のお話です。"
]},
{ cat:"m_sports", title:"バリバリ伝説", yomi:"バリバリでんせつ", sub:"しげの秀一", author:"しげの秀一", authorYomi:"しげのしゅういち", icon:"🏍️", text:[
"巨摩郡は、オートバイが大好きな高校生です。",
"最初は公道を走り、友だちやライバルと「だれが速いか」を競っていました。ところが郡には、本物のレースでも通用する大きな才能がありました。",
"郡はサーキットへ進み、プロのレーサーになります。そこには、今までとは比べものにならないほど速いライバルたちが待っています。",
"勝つこともあれば、負けることもあります。大切な仲間との別れも経験します。それでも郡は、オートバイに乗ることをやめません。",
"やがて郡は世界のレースへ挑み、世界一を争うライダーへ成長していきます。ただバイクが好きだった少年が、世界の頂点を目指して走り続ける物語です。"
]},
{ cat:"m_battle", title:"カメレオン", sub:"加瀬あつし", author:"加瀬あつし", authorYomi:"かせあつし", icon:"🦎", text:[
"矢沢栄作は、不良にあこがれている高校生です。",
"でも、本当の矢沢はけんかが強いわけではありません。むしろ、とても弱くて臆病です。",
"ところが矢沢には、ものすごい運のよさと口のうまさがありました。大ピンチになるたび、偶然が重なり、なぜか周りの人には「矢沢はとんでもなく強い男だ」と思われてしまいます。",
"矢沢はその勘違いを利用して、どんどん大きな不良グループの争いへ入っていきます。",
"本人はいつも「助けてくれ！」と思っているのに、周囲からは伝説の男のように見える。弱い少年が、ハッタリと運だけで不良の世界を生きのびる、とてもにぎやかなギャグ漫画です。"
]},
{ cat:"m_battle", title:"湘南純愛組!", yomi:"しょうなんじゅんあいぐみ", sub:"藤沢とおる", author:"藤沢とおる", authorYomi:"ふじさわとおる", icon:"🌊", text:[
"鬼塚英吉と弾間龍二は、「鬼爆コンビ」と呼ばれる、とても強い不良少年です。",
"二人はけんかばかりしていましたが、「このままでは女の子にモテない」と考え、普通の高校生活を送ろうとします。",
"ところが新しい学校でも、けんかや暴走族の争いが次々と起こります。二人は結局、仲間を守るために戦うことになります。",
"最初は自分のことばかり考えていた鬼塚と龍二ですが、仲間が増えるにつれて、「自分が傷ついてでも守りたい人」ができていきます。",
"高校生活の終わりが近づき、二人もそれぞれの道へ進んでいきます。そして鬼塚英吉の物語は、のちの『GTO』へとつながっていくのでした。"
]},
{ cat:"m_drama", title:"GTO", yomi:"ジーティーオー", sub:"藤沢とおる", author:"藤沢とおる", authorYomi:"ふじさわとおる", icon:"👨‍🏫", text:[
"鬼塚英吉は、むかしとても有名な不良でした。",
"そんな鬼塚が、ある日「教師になろう」と決めます。最初の理由は少し不まじめでしたが、本当に学校へ入ってみると、問題を抱えた生徒たちに出会います。",
"鬼塚が受け持つクラスでは、先生を信用していない生徒たちが、次々と鬼塚を追い出そうとします。",
"でも鬼塚は、教科書の勉強を教えるより先に、「困っているなら助ける」「大人が間違っているなら大人に立ち向かう」という方法で、生徒たちを守ります。",
"最初は鬼塚を嫌っていた生徒たちも、少しずつ彼を信じるようになります。",
"けんかもするし、先生らしくないことばかりする。それでも、だれより生徒を見捨てない男が、本当の先生になっていく物語です。"
]},
{ cat:"m_battle", title:"疾風伝説 特攻の拓", spine:"疾風伝説|特攻の拓", yomi:"かぜでんせつ ぶっこみのタク", sub:"原作：佐木飛朗斗　作画：所十三", author:"佐木飛朗斗／所十三", authorYomi:"さきひろと", icon:"🏍️", text:[
"浅川拓は、気が弱く、いじめられやすい高校生でした。",
"そんな拓が、横浜の不良たちと出会います。とくに鮎川真里という少年との出会いをきっかけに、拓は暴走族の世界へ入っていきます。",
"そこには、「爆音小僧」をはじめ、たくさんのチームがあります。どのチームにも強い男たちがいて、昔からの因縁や友情を抱えています。",
"拓自身は、ものすごくけんかが強いわけではありません。でも人を信じる気持ちや、危険なときにも逃げないところによって、強い不良たちから認められていきます。",
"最初はおびえてばかりだった少年が、多くの仲間との出会いを通して、自分なりの強さを見つけていく青春物語です。"
]},
{ cat:"m_battle", title:"湘南爆走族", yomi:"しょうなんばくそうぞく", sub:"吉田聡", author:"吉田聡", authorYomi:"よしださとし", icon:"🧵", text:[
"江口洋助は、湘南に住む高校生です。",
"学校では手芸部の部長をしています。針と糸を使うことが上手で、仲間と楽しく過ごしています。",
"でも外へ出ると、江口にはもう一つの顔があります。彼は「湘南爆走族」というチームの二代目リーダーなのです。",
"仲間たちはバイクが大好きで、ほかのチームとぶつかることもあります。けれども、ただ暴れるだけではありません。仲間が困れば助け、おたがいを大切にします。",
"恋をしたり、学校で笑ったり、バイクで走ったり。やがて高校生活にも終わりが近づきます。",
"青春はずっと続きません。でも、仲間と湘南を走った時間は忘れない。そんな若者たちの友情のお話です。"
]},
{ cat:"m_battle", title:"BE-BOP-HIGHSCHOOL", spine:"BE-BOP-|HIGHSCHOOL", yomi:"ビーバップハイスクール", sub:"きうちかずひろ", author:"きうちかずひろ", authorYomi:"きうちかずひろ", icon:"😎", text:[
"ヒロシとトオルは、高校に通う不良少年です。",
"二人は勉強よりけんかのほうが得意です。学校をさぼったり、ほかの学校の不良と戦ったり、女の子にモテようとして失敗したりします。",
"二人とも「自分はかっこいい不良だ」と思っています。でも実際には、情けない失敗もたくさんします。",
"こわい先輩や、もっと強い不良が現れることもあります。それでも仲間が困っていれば、二人は逃げません。",
"大きな一つの事件へ向かう物語ではなく、高校生のヒロシとトオルが、けんかをしたり笑ったりする日々が続きます。不良少年たちの、少し危なくておかしい青春のお話です。"
]},
{ cat:"m_battle", title:"クローズ", yomi:"クローズ", sub:"髙橋ヒロシ", author:"髙橋ヒロシ", authorYomi:"たかはしひろし", icon:"🐦‍⬛", text:[
"坊屋春道は、不良ばかりが集まる鈴蘭男子高校へ転校してきます。",
"鈴蘭には、学校全体をまとめた男がまだいませんでした。「自分こそ一番だ」と思う強い不良たちが、あちこちで争っています。",
"春道は学校の頂点を目指しているわけではありません。でも仲間を傷つけられると、相手がだれでも戦います。",
"やがて春道のまわりには仲間が集まり、ほかの学校や不良グループとも大きな戦いをします。鈴蘭最強といわれるリンダマンとも拳を交えます。",
"春道は最後まで「王様」にはなろうとしません。強さとは人を支配することではない。好きなように生き、仲間を大切にする春道の高校生活を描いた物語です。"
]},
{ cat:"m_battle", title:"WORST", yomi:"ワースト", sub:"髙橋ヒロシ", author:"髙橋ヒロシ", authorYomi:"たかはしひろし", icon:"👊", text:[
"月島花は、山奥から町へやってきた高校生です。",
"花が入ったのは、不良だらけの鈴蘭男子高校。『クローズ』から少しあとの時代です。",
"花には大きな夢がありました。「鈴蘭を一つにまとめて、番長になる」という夢です。",
"鈴蘭にはたくさんの派閥があり、町の外にも強い不良グループがあります。花は次々と強敵と戦います。",
"でも花は、ただ一番強い男になりたいわけではありません。明るく、仲間を信じる性格によって、敵だった人とも友情をつくっていきます。",
"勝ち負けだけではなく、「だれについていきたいと思えるか」。花と仲間たちが、自分たちの青春をかけて鈴蘭の頂点を目指していく物語です。"
]},
{ cat:"m_battle", title:"BADBOYS", yomi:"バッドボーイズ", sub:"田中宏", author:"田中宏", authorYomi:"たなかひろし", icon:"🏍️", text:[
"桐木司は、お金持ちの家に育った少年です。",
"何不自由なく暮らしていましたが、ある日家を飛び出し、不良たちの世界へ入ります。",
"広島には、いくつもの大きな暴走族があります。司は「極楽蝶」というチームとかかわり、やがてその中心人物になっていきます。",
"最初は不良の世界にあこがれていただけだった司ですが、仲間が傷つけられれば、本気で怒るようになります。",
"敵のチームにも、大切な仲間や守りたいものがあります。そのため争いはどんどん大きくなります。",
"司たちは何度もぶつかりながら、それぞれの「強さ」や「友情」を知っていきます。広島の若者たちの、熱くて激しい青春のお話です。"
]},
{ cat:"m_gag", title:"まじかる☆タルるートくん", spine:"まじかる☆|タルるートくん", yomi:"まじかるタルるートくん", sub:"江川達也", author:"江川達也", authorYomi:"えがわたつや", icon:"🪄", text:[
"江戸城本丸は、勉強も運動もあまり得意ではない小学生です。",
"ある日、本丸の前に、魔法使いのタルるートが現れます。",
"タルるートは不思議な魔法を使うことができます。本丸は「これで何でも思い通りだ」と喜びます。",
"好きな女の子にモテたい。いじめっ子に勝ちたい。テストでいい点を取りたい。本丸は魔法を使って楽をしようとします。",
"でも魔法だけでは、本当に大切なものは手に入りません。友情や恋、努力することの大切さを、本丸は少しずつ知っていきます。",
"笑える騒動をたくさん起こしながら、本丸が子どもから少しずつ成長していく魔法の物語です。"
]},
{ cat:"m_gag", title:"ジャングルの王者ターちゃん♡", spine:"ジャングルの王者|ターちゃん♡", yomi:"ジャングルのおうじゃターちゃん", sub:"徳弘正也", author:"徳弘正也", authorYomi:"とくひろまさや", icon:"🐘", text:[
"アフリカのジャングルに、ターちゃんという男が暮らしています。",
"ターちゃんは動物たちに育てられ、とても強くなりました。妻のヂェーンといっしょに暮らしながら、動物たちを悪い人間から守っています。",
"最初は、おかしなジャングル生活のお話が中心です。しかしだんだん、世界中から強い格闘家や悪い組織が現れるようになります。",
"ターちゃんは中国へ行ったり、格闘大会へ出たりしながら、仲間たちと戦います。",
"どれほど強くなっても、ターちゃんが一番大切にするのは自然と家族です。ふざけたことを言って笑わせながら、本当に困っている人がいれば命をかけて助ける、やさしいジャングルの王者のお話です。"
]},
{ cat:"m_gag", title:"珍遊記 -太郎とゆかいな仲間たち-", spine:"珍遊記|-太郎とゆかいな|仲間たち-", yomi:"ちんゆうき たろうとゆかいななかまたち", sub:"漫☆画太郎", author:"漫☆画太郎", authorYomi:"まんがたろう", icon:"🐒", text:[
"むかしむかし、中国を思わせる世界に、山田太郎という、とんでもなく乱暴な少年がいました。",
"太郎は力が強く、気に入らないことがあるとすぐ暴れます。",
"そこへお坊さんが現れ、太郎を旅へ連れていくことになります。",
"どこか『西遊記』に似ていますが、立派な冒険にはなりません。太郎は言うことを聞かず、お坊さんも困り、出会う人たちも変な人ばかりです。",
"強い敵が出ても、感動的に戦うというより、むちゃくちゃな出来事になってしまいます。",
"有名な冒険物語をわざとめちゃくちゃにして、「そんなことあるわけないよ！」と笑わせる、とても変わったギャグ漫画です。"
]},
{ cat:"m_fantasy", title:"王ドロボウJING", yomi:"おうドロボウジン", sub:"熊倉裕一", author:"熊倉裕一", authorYomi:"くまくらゆういち", icon:"💎", text:[
"世界中のお宝を盗む、「王ドロボウ」と呼ばれる少年がいます。その名はジン。",
"ジンは相棒の鳥・キールといっしょに、さまざまな国を旅しています。",
"ある町では宝石を盗み、ある国では伝説のお酒を追い、またある場所では時間そのもののような、不思議なものまで狙います。",
"でもジンが盗むのは、ただ高価な物だけではありません。その町に隠された秘密や、人の心にかかわるものまで盗んでいきます。",
"一つの場所に長くとどまらず、事件が終われば、ジンはまた次の旅へ出ます。",
"「盗めないものなどない」。不思議な世界を渡り歩く、少年大泥棒の冒険物語です。"
]},
{ cat:"m_gag", title:"南国少年パプワくん", yomi:"なんごくしょうねんパプワくん", sub:"柴田亜美", author:"柴田亜美", authorYomi:"しばたあみ", icon:"🏝️", text:[
"シンタローという青年が、大切な「秘石」を持って逃げている途中、不思議な島へ流れ着きます。",
"そこはパプワ島。小さな少年パプワくんと、しゃべる動物たちが暮らしています。",
"シンタローは島から逃げたいのですが、パプワくんたちはなかなか帰してくれません。",
"やがて、シンタローが所属していた組織の仲間たちも、秘石を取り戻すため島へやってきます。",
"最初はおかしな島のギャグ漫画のようですが、少しずつ、秘石やパプワくんの正体、シンタローたちの過去が明らかになります。",
"敵だった者も仲間になり、笑いながら大きな運命へ向き合っていく、不思議な島の冒険物語です。"
]},
{ cat:"m_gag", title:"PAPUWA", yomi:"パプワ", sub:"柴田亜美", author:"柴田亜美", authorYomi:"しばたあみ", icon:"🌴", text:[
"『南国少年パプワくん』の物語から何年かたちました。",
"コタローという少年が、記憶を失った状態でパプワ島へやってきます。",
"島には、昔と同じように変なしゃべる動物や、にぎやかな人たちが暮らしています。",
"コタローは、どうして自分がここへ来たのか、少しずつ思い出していきます。そして赤と青の秘石をめぐる、昔から続いていた大きな秘密へ近づいていきます。",
"前の物語に出てきたシンタローたちも現れ、家族や兄弟の関係も明らかになります。",
"笑える毎日の奥に、とても長い一族の物語が隠れていた。そんなパプワ島の物語の続きを描いた作品です。"
]},
{ cat:"m_fantasy", title:"魔法陣グルグル", yomi:"まほうじんグルグル", sub:"衛藤ヒロユキ", author:"衛藤ヒロユキ", authorYomi:"えとうひろゆき", icon:"🌀", text:[
"ニケは、勇者として旅に出ることになった少年です。",
"いっしょに旅をするのは、グルグルという不思議な魔法を使う少女・ククリです。",
"二人の目的は、魔王ギリを倒すこと。でも旅は思ったようには進みません。",
"変な村へ行ったり、へんてこな魔物と戦ったり、「キタキタおやじ」のような、とても変わった仲間まで現れます。",
"ニケとククリは旅を続けながら、少しずつ強くなり、おたがいを大切に思うようになります。",
"そして最後には、仲間たちと力を合わせて魔王ギリへ立ち向かいます。",
"勇者と魔法使いの王道冒険を、たくさんの笑いといっしょに描いた物語です。"
]},
{ cat:"m_gag", title:"ジャングルはいつもハレのちグゥ", spine:"ジャングルは|いつも|ハレのちグゥ", yomi:"ジャングルはいつもハレのちグゥ", sub:"金田一蓮十郎", author:"金田一蓮十郎", authorYomi:"きんだいちれんじゅうろう", icon:"🌴", text:[
"少年ハレは、ジャングルでお母さんと暮らしています。",
"ある日、家にグゥというかわいらしい女の子がやってきます。",
"「新しい友だちかな」と思ったハレですが、グゥは普通の女の子ではありません。",
"とつぜん大きな口で人を飲みこんだり、体の中に不思議な世界があったり、できることがめちゃくちゃです。",
"ハレは毎日「なんでこんなことになるんだ！」と苦労します。でも周りの大人たちはのんびりしていて、だれも助けてくれません。",
"都会へ行ったり、またジャングルへ戻ったりしながら、ハレはグゥに振り回され続けます。何でもありの世界で、ただ一人まじめな少年が苦労するギャグ漫画です。"
]},
{ cat:"m_drama", title:"聲の形", yomi:"こえのかたち", sub:"大今良時", author:"大今良時", authorYomi:"おおいまよしとき", icon:"🤟", text:[
"石田将也は、小学生のころ、耳が聞こえない転校生・西宮硝子をいじめてしまいました。",
"最初はみんなで笑っていました。でも問題になると、今度は将也だけが悪者にされ、将也自身がいじめられるようになります。",
"何年もたち、高校生になった将也は、「あのときのことを謝りたい」と硝子を探します。",
"二人はもう一度会い、少しずつ友だちになります。でも昔の傷は簡単には消えません。",
"硝子は自分が周りを不幸にしていると思いつめ、命を捨てようとします。将也は硝子を助け、その代わりに大けがをします。",
"二人はそれでも生きることを選びます。最後には将也も周りの人たちへ心を開き、「人とつながって生きていこう」と一歩を踏み出すのでした。"
]},
{ cat:"m_fantasy", title:"不滅のあなたへ", yomi:"ふめつのあなたへ", sub:"大今良時", author:"大今良時", authorYomi:"おおいまよしとき", icon:"🔮", text:[
"あるとき、この世界に一つの「球」が投げこまれました。",
"球は石になり、オオカミになり、そして一人の少年の姿になります。やがて自分のことを「フシ」と呼ぶようになります。",
"フシは死ぬことがありません。でも出会った人たちは、みんな年をとり、やがて死んでしまいます。",
"マーチ、グーグー、トナリなど、大切な人に出会うたび、フシは喜びや悲しみを知り、人間らしくなっていきます。",
"やがてフシは、人間をおそう「ノッカー」と長い戦いを始めます。時代が変わり、世界が近代化しても戦いは続きます。",
"最後の大きな戦いを越えても、フシの命そのものには終わりがありません。だからこそフシは、「永遠に生きる自分が、これからどう生きるのか」を自分で選び、新しい旅へ進んでいきます。全25巻で、2025年に完結しました。"
]},
{ cat:"m_battle", title:"東京喰種トーキョーグール", spine:"東京喰種|トーキョーグール", yomi:"とうきょうグール", sub:"石田スイ", author:"石田スイ", authorYomi:"いしだすい", icon:"🎭", text:[
"金木研は、本が好きな普通の大学生でした。",
"ある日、好きになった女性と出かけます。ところが彼女は、人間を食べて生きる「喰種」でした。",
"大けがをした金木は手術を受け、喰種の体の一部を移植されます。こうして、人間でも喰種でもある存在になってしまいます。",
"金木は喰種たちが集まる喫茶店「あんていく」で仲間と出会い、「喰種にも家族や心がある」ことを知ります。",
"しかし人間側には、喰種を退治する組織があります。戦いの中で金木は何度も傷つき、名前や記憶まで失います。",
"それでも最後には、人間と喰種が殺しあうだけではない世界を目指します。金木はトーカと家庭をつくり、長い戦いのあとに、ようやく穏やかな未来へ歩き始めるのでした。"
]},
{ cat:"m_sf", title:"ダーウィン事変", yomi:"ダーウィンじへん", sub:"うめざわしゅん", author:"うめざわしゅん", authorYomi:"うめざわしゅん", icon:"🐒", text:[
"チャーリーは、人間のお父さんとお母さんに育てられた少年です。",
"でもチャーリーには大きな秘密があります。彼は、人間とチンパンジーの間に生まれた「ヒューマンジー」なのです。",
"15歳になったチャーリーは、初めて学校へ通うことになります。そこでルーシーという女の子と仲よくなります。",
"ところが、動物を人間から解放しようとする過激な組織「ALA」が、チャーリーを仲間に利用しようとします。",
"「動物を食べるのは悪いこと？」「人間だけが特別なの？」「チャーリーは人間なの？ 動物なの？」。いろいろな人が、それぞれの答えをチャーリーへ押しつけます。",
"チャーリーはだれかの考えに従うのではなく、自分で考え続けます。ALAとの戦いもまだ続いており、人間とは何なのかを問い続ける物語です。"
]},
{ cat:"m_horror", title:"出禁のモグラ", yomi:"できんのモグラ", sub:"江口夏実", author:"江口夏実", authorYomi:"えぐちなつみ", icon:"🏮", text:[
"ある大学生たちが、夜道でとても変な男と出会います。",
"男の名前は「モグラ」。本当の名前も年齢も、よく分かりません。",
"モグラは「自分はあの世から出入り禁止にされている」と言います。だから死ぬこともできず、あの世へ帰るために、不思議な「灯」を集めています。",
"大学生たちはモグラとかかわったことで、今まで見えなかった幽霊や怪しいものを見るようになります。",
"町には、昔からの妖怪や、人間の強い思いから生まれた怪しいものがたくさんいます。",
"モグラはふざけた男に見えますが、長いあいだ生きてきたため、多くの秘密を知っています。人間とあの世の境目で起こる、こわくておかしい事件を描いた物語です。"
]},
{ cat:"m_battle", title:"地獄楽", yomi:"じごくらく", sub:"賀来ゆうじ", author:"賀来ゆうじ", authorYomi:"かくゆうじ", icon:"🌺", text:[
"画眉丸は、とても強い忍者です。",
"たくさんの人を殺してきた画眉丸は死刑を言いわたされます。でも画眉丸には、どうしても生きて帰りたい理由がありました。大切な妻に、もう一度会いたかったのです。",
"そんな画眉丸に、「ある島から不老不死の薬を持ち帰れば、罪を許す」と言われます。",
"島へ行くと、そこには美しい花や不思議な生き物、そして恐ろしい仙人たちがいました。",
"画眉丸は処刑人の佐切や、ほかの罪人たちと力を合わせます。最初は敵だった人たちとも、少しずつ仲間になります。",
"多くの人を失いながらも、画眉丸たちは島の秘密を破り、生き残ります。そして画眉丸はようやく妻のもとへ帰ります。地獄のような島から、「生きたい」と願って帰る物語です。"
]},
{ cat:"m_sf", title:"サマータイムレンダ", sub:"田中靖規", author:"田中靖規", authorYomi:"たなかやすき", icon:"🌞", text:[
"網代慎平は、幼なじみの潮が亡くなったと聞き、故郷の島へ帰ってきます。",
"海の事故だと思われていましたが、潮の首には不思議なあとがありました。",
"さらに島では、「自分とそっくりな影を見た人は死ぬ」という話があります。",
"やがて慎平自身も殺されます。ところが目を開けると、数日前へ戻っていました。",
"慎平は死ぬたびに時間をやり直し、少しずつ真相へ近づいていきます。",
"敵は、人間の姿をコピーする「影」でした。慎平は潮の影や仲間たちと力を合わせ、何度も未来を変えます。",
"最後には影を生み出した元を倒し、悲劇そのものが起きなかった世界へたどり着きます。慎平と潮はもう一度出会い、今度こそ普通の夏を過ごすのでした。"
]},
{ cat:"m_drama", title:"僕だけがいない街", yomi:"ぼくだけがいないまち", sub:"三部けい", author:"三部けい", authorYomi:"さんべけい", icon:"⏪", text:[
"藤沼悟には、不思議な力があります。",
"近くで悪い事件が起こると、その少し前へ時間が戻るのです。",
"ある日、悟の母親が殺されます。すると悟は、少し前どころか18年前、小学生だったころまで戻ってしまいます。",
"そのころ、悟の同級生・雛月加代が誘拐され、殺される事件が起きていました。",
"「加代を救えば、お母さんの事件も変えられるかもしれない」。悟は小学生の体で、友だちを救おうとします。",
"何度も失敗しながら、悟は加代たちを守り、犯人へ近づきます。",
"長い眠りにつくことにもなりますが、大人になった悟はついに犯人と対決します。そして友だちも母も救われた未来で、悟自身も新しい人生を歩き始めるのでした。"
]},
{ cat:"m_drama", title:"予告犯", yomi:"よこくはん", sub:"筒井哲也", author:"筒井哲也", authorYomi:"つついてつや", icon:"📰", text:[
"ある日、インターネットに新聞紙のマスクをかぶった男が現れます。",
"男は「明日、この人に罰を与える」と予告します。そして本当に、その通りの事件が起こります。",
"人々は男たちを「シンブンシ」と呼びます。",
"シンブンシが狙うのは、弱い人をいじめたり、人を苦しめても平気でいる者たちです。そのためネットでは、「悪い人をこらしめてくれる正義の味方だ」と応援する人まで現れます。",
"しかし犯罪は犯罪です。警察は彼らを追います。",
"調べていくと、シンブンシたちは、社会の中で使い捨てにされ、苦しい生活をしてきた若者たちだと分かります。",
"彼らの行動は正しかったのか。それとも間違っていたのか。簡単には答えを出せないまま、社会の不公平さを問いかける物語です。"
]},
{ cat:"m_sf", title:"イキガミ", sub:"間瀬元朗", author:"間瀬元朗", authorYomi:"ませもとろう", icon:"✉️", text:[
"この国には、とても恐ろしい法律があります。",
"子どもたちは小さいころに注射を受けます。その中には、ごく一部だけ、若者になったとき命を奪うものが入っています。",
"だれが死ぬかは分かりません。",
"死ぬ24時間前になると、「あなたは明日死にます」という通知、「逝紙（イキガミ）」が届きます。",
"藤本賢吾の仕事は、そのイキガミを届けることでした。",
"ある人は最後の日に家族へ会いに行きます。ある人は夢をかなえようとします。怒って人を傷つける人もいます。",
"藤本は何人もの最後の一日を見るうちに、「こんな法律は本当に正しいのだろうか」と疑うようになります。",
"国に言われたことをそのまま信じるのではなく、「命はだれのものなのか」を考えていく物語です。"
]},
{ cat:"m_horror", title:"不能犯", yomi:"ふのうはん", sub:"原作：宮月新　作画：神崎裕也", author:"宮月新／神崎裕也", authorYomi:"みやつきあらた", icon:"🖤", text:[
"宇相吹正という、不思議な男がいます。",
"宇相吹は、だれかから「この人を殺してほしい」と頼まれると、その相手へ近づきます。",
"でもナイフや銃を使うわけではありません。",
"相手の心をあやつり、「自分は死ぬ」「これは毒だ」などと思いこませ、本当に命を落とさせるのです。",
"証拠がないので、警察は宇相吹をなかなか捕まえられません。",
"依頼する人たちは、「あの人さえいなくなれば幸せになれる」と考えます。でも宇相吹の事件では、願いがかなったあとに、依頼した本人まで苦しむことがよくあります。",
"人間の憎しみや欲が、自分自身へ返ってくる。そんなこわいお話を重ねながら、宇相吹と彼を追う刑事たちの戦いが続いていきます。"
]},
{ cat:"m_drama", title:"親愛なる僕へ殺意をこめて", spine:"親愛なる僕へ|殺意をこめて", yomi:"しんあいなるぼくへさついをこめて", sub:"原作：井龍一　作画：伊藤翔太", author:"井龍一／伊藤翔太", authorYomi:"いりゅうはじめ", icon:"🪞", text:[
"浦島エイジは、普通の大学生として暮らしていました。",
"ところがある朝、目を覚ますと、数日間の記憶がありません。",
"自分の知らないあいだに、大金を持っていたり、知らない人とかかわっていたりします。",
"「もしかして、自分の中にもう一人の自分がいるのではないか」。エイジは調べ始めます。",
"実は彼の中には「B一」と呼ばれる人格がいました。そしてエイジこそが、つらい現実から心を守るため、あとから生まれた人格だったのです。",
"さらに、エイジの父は昔の連続殺人犯「LL」だと言われていました。しかし本当のLLは別にいました。",
"たくさんのうそをたどった末、B一は自分を育てた義父・浦島亀一が真相に深くかかわっていたことを知ります。",
"自分はいったいだれなのか。その答えを求めながら、過去の殺人事件の真実へたどり着く物語です。"
]},
{ cat:"m_drama", title:"マイホームヒーロー", sub:"原作：山川直輝　作画：朝基まさし", author:"山川直輝／朝基まさし", authorYomi:"やまかわなおき", icon:"🏠", text:[
"鳥栖哲雄は、妻と娘を大切にする普通のお父さんです。",
"ある日、娘の零花が恋人からひどい目にあっていることを知ります。",
"娘を守ろうとした哲雄は、その恋人を殺してしまいます。",
"相手は犯罪組織につながる男でした。哲雄は妻の歌仙と力を合わせ、死体を隠し、「自分たちは何も知らない」というふりをします。",
"ところが組織の人々は、消えた男を探し始めます。",
"哲雄は推理小説で覚えた知識を使い、家族を守るため、次々とうそを重ねていきます。",
"やがて事件は犯罪組織だけでなく、歌仙の実家や大きな事件にまで広がります。",
"「家族を守るためなら、どこまでしていいのか」。普通だった父親が、取り返しのつかない罪を重ねながら家族を守ろうとする物語です。"
]},
{ cat:"m_drama", title:"モンタージュ", sub:"渡辺潤", author:"渡辺潤", authorYomi:"わたなべじゅん", icon:"💴", text:[
"大和という少年は、子どものころ、死にかけた刑事から不思議な言葉を聞きます。",
"「おまえの父親は、三億円事件の犯人だ」。",
"三億円事件とは、1968年に本当に起こった、日本でも有名な未解決事件です。",
"何年かたち、大和の父は亡くなります。そして大和は幼なじみの未来といっしょに、事件の秘密を調べ始めます。",
"すると、昔の警察官、三億円を狙う人々、事件を知る老人など、たくさんの人が二人を追ってきます。",
"大和は「本当に父が犯人だったのか」を調べながら、事件には一人ではなく多くの人間の思惑がからんでいたことを知ります。",
"過去と現在を行き来しながら、「あの日、本当は何が起きたのか」を追いかけるサスペンスです。"
]},
{ cat:"m_drama", title:"累", yomi:"かさね", sub:"松浦だるま", author:"松浦だるま", authorYomi:"まつうらだるま", icon:"💋", text:[
"淵累は、とても演技の上手な少女です。",
"でも累には、自分の顔が醜いという大きな悩みがありました。",
"亡くなった母から残された口紅には、不思議な力があります。それをつけて相手と口づけをすると、相手の顔と自分の顔を入れ替えることができるのです。",
"累は美しい女優の顔を借り、舞台へ立ちます。",
"美しい顔と天才的な演技によって、累はどんどん成功します。でもその成功は、ほかの人の顔を奪うことで成り立っています。",
"やがて母も同じような秘密を抱えていたことや、累の出生の真実が分かります。",
"累は多くの人を傷つけ、最後には「美しい顔さえあれば幸せになれる」という考えそのものと向き合います。自分の顔、自分の人生を受け入れるまでの、悲しい物語です。"
]},
{ cat:"m_drama", title:"御手洗家、炎上する", spine:"御手洗家、|炎上する", yomi:"みたらいけ えんじょうする", sub:"藤沢もやし", author:"藤沢もやし", authorYomi:"ふじさわもやし", icon:"🔥", text:[
"村田杏子には、忘れられない出来事があります。",
"13年前、杏子の家だった御手洗家が火事で焼けました。",
"母親は「自分のせいだ」と責められ、家族はばらばらになりました。",
"でも杏子は、「本当にお母さんが火事を起こしたの？」と疑っています。",
"大人になった杏子は、御手洗家へ家政婦として入りこみます。そこには、昔母の友人だった真希子が、新しい妻として暮らしていました。",
"杏子は「真希子が母のものを盗み、火事まで起こしたのではないか」と調べます。",
"ところが調査が進むと、真希子にも隠しごとがあり、その息子たちにも秘密があることが分かります。",
"「あの日の火事」で本当に何が起こったのか。家族がついてきたうそを一つずつはがしていく復讐と再生の物語です。"
]},
{ cat:"m_drama", title:"夏目アラタの結婚", yomi:"なつめアラタのけっこん", sub:"乃木坂太郎", author:"乃木坂太郎", authorYomi:"のぎざかたろう", icon:"💍", text:[
"夏目アラタは、子どもを助ける仕事をしている男性です。",
"ある日、父親を殺された少年から、「犯人に会って、父の遺体がどこにあるか聞いてほしい」と頼まれます。",
"犯人として捕まっているのは、品川真珠という女性でした。",
"アラタは真珠から話を聞き出すため、思わず「俺と結婚しよう」と言ってしまいます。",
"死刑になるかもしれない女性と、面会室ごしに始まる、とても変わった結婚です。",
"真珠は本当のことを話しているのか、うそをついているのか分かりません。アラタも最初は情報を聞き出したいだけでした。",
"でも何度も話すうちに、二人の間には単なるだまし合いとはちがう気持ちが生まれます。",
"殺人事件の真相と真珠の過去を追いながら、「人を信じるとはどういうことか」まで問いかける物語です。"
]},
{ cat:"m_drama", title:"九条の大罪", yomi:"くじょうのたいざい", sub:"真鍋昌平", author:"真鍋昌平", authorYomi:"まなべしょうへい", icon:"⚖️", text:[
"九条間人は、弁護士です。",
"でも、テレビに出てくるような「正義の味方」の弁護士とは少しちがいます。",
"九条のもとには、暴力団、犯罪をした人、借金で困っている人など、社会から嫌われている人もやってきます。",
"「こんな悪い人を、どうして守るの？」と思うこともあります。",
"でも九条は、「弁護士は好き嫌いで人を守る仕事ではない」と考えます。",
"法律ではどうなるのか。それだけを冷静に考えます。",
"そのため、九条の行動によって悪い人が助かるように見えることもあります。でも、法律がある以上、だれにでも使う権利があります。",
"「正義って何だろう」「法律はだれのためにあるのだろう」。そんなむずかしい問題を、裏社会の事件を通して描いていく物語です。"
]},
{ cat:"m_drama", title:"住みにごり", yomi:"すみにごり", sub:"たかたけし", author:"たかたけし", authorYomi:"たかたけし", icon:"🏚️", text:[
"29歳の末吉は、仕事を長く休むことになり、久しぶりに実家へ帰ります。",
"そこには両親と、35歳になる兄・フミヤが暮らしていました。",
"フミヤは仕事をせず、ほとんど家から出ません。家族はみんな、フミヤを怒らせないように気をつかっています。",
"最初は、「少し変わった家族のお話かな」と思います。",
"でも暮らしているうちに、家族一人一人が隠していた気持ちや、昔から積み重なってきた問題が見えてきます。",
"父にも母にも弟にも秘密があります。そして、ただの「困った兄」に見えたフミヤにも、家族とのゆがんだ関係があります。",
"同じ家に住んでいるのに、家族のことを何も知らなかった。そんな家の中にたまった「にごり」が、少しずつ表へ出てくる物語です。"
]},
{ cat:"m_daily", title:"路傍のフジイ", yomi:"ろぼうのフジイ", sub:"鍋倉夫", author:"鍋倉夫", authorYomi:"なべくらお", icon:"🚶", text:[
"会社で働く藤井さんは、あまり目立たない男性です。",
"流行の服を着るわけでもありません。会社の人と飲みに行くことも少なく、一人でごはんを食べたり、絵を見に行ったりしています。",
"周りの人は最初、「藤井さんって、なんだかつまらなそう」と思います。",
"でも、よく見てみると藤井さんは、とても楽しそうに生きています。",
"一人で映画を見ても楽しい。知らない町を歩いても楽しい。人から「すごい」と言われなくても、自分が好きならそれでいいのです。",
"そんな藤井さんとかかわった人たちは、「自分は何のために、人からよく見られようとしていたんだろう」と考え始めます。",
"何でもないように見える一人の男性が、周囲の人の生き方を少しずつ変えていく物語です。"
]},
{ cat:"m_daily", title:"女の園の星", yomi:"おんなのそののほし", sub:"和山やま", author:"和山やま", authorYomi:"わやまやま", icon:"⭐", text:[
"星先生は、女子高校で国語を教えている男性です。",
"星先生はとてもまじめで、あまり大きな声を出しません。",
"でも星先生のクラスでは、毎日のように少し変な出来事が起こります。",
"生徒が描いた絵を使って伝言ゲームをしたり、犬を学校へ連れてきたり、先生の顔を勝手に想像して遊んだりします。",
"職員室では、小林先生たちとどうでもいい話をします。",
"世界を救う事件も、大きな恋も、ほとんど起こりません。",
"それなのに、何でもない会話が妙におかしくて、読んでいると笑ってしまいます。",
"先生と女子高校生たちの、ごく普通なのに少しだけ変な学校生活を描いた日常漫画です。2026年9月には第5巻が発売されています。"
]},
{ cat:"m_daily", title:"カラオケ行こ!", yomi:"カラオケいこ", sub:"和山やま", author:"和山やま", authorYomi:"わやまやま", icon:"🎤", text:[
"岡聡実は、中学校の合唱部で部長をしている男の子です。",
"ある日、聡実の前に成田狂児というヤクザが現れます。",
"狂児は突然言います。",
"「歌がうまなるコツ、教えてくれへん？」",
"狂児の組ではカラオケ大会があり、一番へただった人には、とてもいやな罰が待っています。",
"そのため狂児は、合唱部の聡実に歌を教えてもらおうとしたのです。",
"聡実は「なんで僕がヤクザに歌を教えないといけないんだ」と困ります。それでも二人は何度もカラオケへ行きます。",
"怖そうな大人と普通の中学生。まったくちがう二人なのに、いつのまにか妙な友情が生まれます。",
"やがて聡実自身にも変声期がやってきます。今までのように歌えなくなっていく中で、狂児との不思議な時間も終わりへ近づきます。",
"歌をきっかけに出会った二人の、少しおかしくて、少しさびしい友情のお話です。"
]},
{ cat:"m_daily", title:"ファミレス行こ。", yomi:"ファミレスいこ", sub:"和山やま", author:"和山やま", authorYomi:"わやまやま", icon:"🍽️", text:[
"『カラオケ行こ!』から4年。",
"中学生だった岡聡実は大学生になり、大阪を離れて東京で暮らしています。",
"「今度こそ普通の大人になろう」。そう思っていた聡実は、深夜のファミレスでアルバイトを始めます。",
"ところが、あのヤクザ・成田狂児との縁はまだ切れていませんでした。",
"もう中学生ではない聡実は、「いつまでもこの人とかかわっていていいのかな」と考えます。",
"そして一度は、狂児に「もう会うのをやめよう」という気持ちを伝えます。",
"ところが別れた直後、聡実は思わず狂児の背中に抱きついてしまいます。",
"「なんで僕は、あんなことをしたんだろう」。",
"聡実は自分でも分からない気持ちを、何度も考えます。",
"二人の関係は、友だちとも家族とも簡単には言えません。でも「普通の大人になりたい」と思っていた聡実は、最後には、自分の気持ちは世間が決めるものではないと向き合っていきます。",
"変な出会いから始まった二人の関係が、「これから自分はどうしたいのか」という問いへたどり着く物語です。『ファミレス行こ。』は2026年3月発売の下巻で完結しました。"
]},
{ cat:"m_daily", title:"夢中さ、きみに。", yomi:"むちゅうさきみに", sub:"和山やま", author:"和山やま", authorYomi:"わやまやま", icon:"🏫", text:[
"この漫画には、一人だけの主人公はいません。学校に通う男の子たちの、少し変わった日常を集めたお話です。",
"男子校に通う林美良は、いつも自由で、ほかの人がどう思うかをあまり気にしません。江間という少年は、そんな林のことが、だんだん気になるようになります。",
"別の学校には、二階堂という男の子がいます。長い前髪で顔をかくし、「近づくとよくないことが起こる」とみんなからこわがられています。でも、後ろの席になった目高は、二階堂が本当はそれほどこわい人ではないことに気づいていきます。",
"大事件が起こるわけではありません。なんとなく気になる人と話してみたら、思っていたのと少しちがった。そんな学生時代の小さな出会いを、静かでおかしく描いた物語です。"
]},
{ cat:"m_horror", title:"さんかく窓の外側は夜", spine:"さんかく窓の|外側は夜", yomi:"さんかくまどのそとがわはよる", sub:"ヤマシタトモコ", author:"ヤマシタトモコ", authorYomi:"やましたともこ", icon:"🔺", text:[
"三角康介には、子どものころから幽霊を見る力がありました。",
"幽霊を見るたびにこわい思いをするので、三角はできるだけその力を隠して暮らしていました。ところがある日、冷川理人という除霊師に出会います。",
"冷川は三角の力を見て、「あなたは私に必要です」と言い、二人で幽霊や呪いにかかわる事件を調べるようになります。そこへ、人を呪う力を持つ少女・英莉可も現れます。",
"調べていくうちに、一番大きな謎は冷川自身の過去にあることが分かります。冷川は子どものころに恐ろしい経験をし、人を信じることが苦手になっていました。",
"三角は冷川をただ助けるのではなく、「自分で外へ出てこなければだめだ」と向き合います。幽霊退治のお話でありながら、最後には、人と人が心の中に作った壁をこわしていく物語になります。"
]},
{ cat:"m_art", title:"あかね噺", yomi:"あかねばなし", sub:"原作：末永裕樹　作画：馬上鷹将", author:"末永裕樹／馬上鷹将", authorYomi:"すえながゆうき", icon:"🪭", text:[
"桜咲朱音は、落語が大好きな女の子です。",
"朱音のお父さんも落語家を目指していました。ところが、真打になるための大切な試験で、一生という大名人から突然、落語家をやめさせられてしまいます。",
"「どうしてお父さんはだめだったの？」。その答えを知るため、朱音は自分も落語家になることを決めます。",
"朱音は師匠のもとで修業し、いろいろな落語家と出会います。大きな声で笑わせる人もいれば、静かな話し方で客を物語の中へ連れていく人もいます。",
"朱音はただ父のかたきを取りたいのではなく、「落語とは何なのか」を少しずつ知っていきます。そして自分だけの落語を作りながら、一生のいる高い場所を目指して進んでいきます。2026年時点でも朱音の挑戦は続いています。"
]},
{ cat:"m_fantasy", title:"シャングリラ・フロンティア", spine:"シャングリラ・|フロンティア", sub:"原作：硬梨菜　漫画：不二涼介", author:"硬梨菜／不二涼介", authorYomi:"かたりな", icon:"🎮", text:[
"陽務楽郎は、ゲームが大好きな高校生です。",
"でも楽郎が好きなのは、だれもがほめる名作ゲームではありません。バグだらけだったり、ものすごく難しかったりする「クソゲー」が大好きなのです。",
"そんな楽郎が、たまには名作をやってみようと始めたのが、『シャングリラ・フロンティア』という、とても大きなゲームでした。ゲームの中では「サンラク」という名前で冒険します。",
"サンラクは、ウサギのエムルや、ほかの強いプレイヤーたちと仲間になります。そして普通なら逃げるような、とんでもなく強い怪物へ「面白そうだから」という理由で挑みます。",
"クソゲーで身につけた変わった考え方が、名作ゲームの中で思いがけない力になります。仲間たちと世界の秘密を見つけながら、まだだれも倒していない強敵へ挑戦していく、ゲームの中の大冒険です。"
]},
{ cat:"m_fantasy", title:"転生したらスライムだった件", spine:"転生したら|スライムだった件", yomi:"てんせいしたらスライムだったけん", sub:"原作：伏瀬　漫画：川上泰樹　キャラクター原案：みっつばー", author:"伏瀬／川上泰樹／みっつばー", authorYomi:"ふせ", icon:"💧", text:[
"三上悟は、日本で働く普通の会社員でした。",
"ところがある日、事件に巻きこまれて命を失います。次に目を覚ますと、そこは知らない世界。そして自分の体は、小さなスライムになっていました。",
"新しく「リムル」と名乗った彼は、ドラゴンのヴェルドラと友だちになります。そしてゴブリンやオーガなど、人間から怪物と呼ばれている者たちを仲間にして、一緒に暮らせる国を作り始めます。",
"けれども国が大きくなると、ほかの国との争いも起こります。大切な仲間たちが命を落としたとき、リムルはみんなを救うため、自分自身が魔王になる道を選びます。",
"リムルはとても強くなりますが、「強いから全部支配する」とは考えません。人間も魔物もいっしょに暮らせる国を目指し、仲間と相談しながら世界へ向き合っていきます。漫画版の冒険は現在も続いています。"
]},
{ cat:"m_gag", title:"異世界おじさん", yomi:"いせかいおじさん", sub:"殆ど死んでいる", author:"殆ど死んでいる", authorYomi:"ほとんどしんでいる", icon:"🧙", text:[
"たかふみのおじさんは、17年間ずっと病院で眠っていました。",
"ようやく目を覚ましたおじさんは、とつぜん「自分は眠っているあいだ、異世界へ行っていた」と言います。",
"たかふみは最初、「長く眠っていたせいで変なことを言っているのかな」と思います。ところがおじさんは、本当に魔法を使いました。",
"おじさんは魔法で昔の出来事を映し出します。異世界では美しいエルフやメイベルたちと出会っていました。でもおじさんは恋愛にとても鈍く、相手が好意を見せても、まったく気づいていません。",
"しかもおじさんが一番大好きなのは、昔のセガのゲームです。異世界での大冒険を語っているはずなのに、いつのまにかゲームの話になってしまいます。",
"強いのに人の気持ちには鈍いおじさんと、話を聞くたかふみたちが、過去の冒険を少しずつ見ていく物語です。"
]},
{ cat:"m_history", title:"乙女戦争 ディーヴチー・ヴァールカ", spine:"乙女戦争|ディーヴチー・|ヴァールカ", yomi:"おとめせんそう ディーヴチーヴァールカ", sub:"大西巷一", author:"大西巷一", authorYomi:"おおにしこういち", icon:"⚔️", text:[
"昔、ヨーロッパのボヘミアという国で、大きな宗教戦争が起こりました。",
"12歳の少女シャールカは、戦争によって家族を失います。たった一人生き残ったシャールカは、ヤン・ジシュカという軍人に助けられます。",
"シャールカは銃を持ち、兵士として戦うことになります。最初は「悪い敵を倒せば戦争は終わる」と思いたくなります。でも戦争が長くなると、同じ仲間だった人たちまで考え方のちがいで争い始めます。",
"大切な友だちが死に、尊敬していた人もいなくなります。シャールカはだんだん、「勝つことより、もう戦争を終わらせたい」と願うようになります。",
"最後にはフス派の中でも争いが起こり、シャールカは平和を作ろうと走り回ります。戦争に巻きこまれた少女が、「敵を倒すこと」と「平和を作ること」は同じではないと知っていく歴史のお話です。"
]},
{ cat:"m_fantasy", title:"将国のアルタイル", yomi:"しょうこくのアルタイル", sub:"カトウコトノ", author:"カトウコトノ", authorYomi:"かとうことの", icon:"🦅", text:[
"マフムートは、トルキエという国の若い将軍です。",
"子どものころ、戦争で故郷と家族を失いました。そのためマフムートは、「もう二度と大きな戦争を起こしたくない」と考えています。",
"ところが、となりの大国・バルトライン帝国が、どんどん周りの国へ手をのばします。",
"マフムートは剣だけで戦うのではありません。商人と話したり、外国と同盟を結んだり、敵の食料や道を考えたりして、知恵を使って国を守ります。",
"やがて戦いは大陸全体を巻きこむ大戦争になります。多くの仲間を失いながらも、マフムートたちは帝国の侵略を押し返していきます。",
"そして戦争が終わったあとには、「勝った国をこれからどう治めるのか」という新しい問題が残ります。マフムートは、一人の強い王が全部を決めるのではなく、みんなが話しあって国を作る道を考えます。長い戦争のあとに、平和をどう作るのかまで描いて物語は完結します。"
]},
{ cat:"m_fantasy", title:"アルスラーン戦記", yomi:"アルスラーンせんき", sub:"原作：田中芳樹　漫画：荒川弘", author:"田中芳樹／荒川弘", authorYomi:"たなかよしき", icon:"🐎", text:[
"パルス王国の王子アルスラーンは、やさしい少年です。",
"でも父王からは、「王になるには弱すぎる」と思われていました。",
"14歳になったアルスラーンは、初めて戦争へ行きます。「強いパルス軍なら絶対に勝てる」とみんなが思っていました。ところが味方の裏切りによって軍は大敗し、王都まで敵に奪われてしまいます。",
"アルスラーンは、強い騎士ダリューンや、知恵者ナルサス、エラム、ファランギース、ギーヴたちと仲間になります。",
"旅をするうち、アルスラーンは自分の国にも奴隷制度などの問題があったことを知ります。「国を取り戻すだけではだめだ。もっとよい国にしたい」と考えるようになります。",
"仲間を集めて王都を取り戻したあとにも、戦いは終わりません。漫画版では、昔から眠っていた蛇王ザッハークまで復活し、王になったアルスラーンに新しい危機がせまっています。"
]},
{ cat:"m_history", title:"バジリスク 〜甲賀忍法帖〜", spine:"バジリスク|〜甲賀忍法帖〜", yomi:"バジリスク こうがにんぽうちょう", sub:"原作：山田風太郎　漫画：せがわまさき", author:"山田風太郎／せがわまさき", authorYomi:"やまだふうたろう", icon:"🥷", text:[
"昔、甲賀と伊賀という二つの忍者の里がありました。",
"二つの里は長いあいだ仲が悪かったのですが、甲賀の弦之介と伊賀の朧は愛しあっていました。",
"「自分たちが結婚すれば、二つの里も仲よくなれるかもしれない」。二人はそう願っていました。",
"ところが将軍家のあとつぎを決めるため、甲賀と伊賀から十人ずつ忍者が選ばれ、「相手を全員倒せ」という命令が下されます。",
"昨日まで平和を願っていた弦之介と朧も、仲間や家族を守るため、敵として向き合わなければならなくなります。",
"一人、また一人と忍者たちは命を落としていき、最後に残るのは弦之介と朧です。",
"二人は相手を憎むことができません。そして最後には、二人とも命を絶ちます。愛しあう二人さえ、古い憎しみと権力の争いにのみこまれてしまう、悲しい忍者のお話です。"
]},
{ cat:"m_history", title:"シグルイ", sub:"原作：南條範夫　漫画：山口貴由", author:"南條範夫／山口貴由", authorYomi:"なんじょうのりお", icon:"⚔️", text:[
"江戸時代のある日、本物の刀を使う、とても危険な試合が行われます。",
"そこに、一方の腕を失った藤木源之助と、目が見えず足にも傷を負った伊良子清玄が現れます。",
"「どうして二人は、こんな姿になるまで憎みあったのだろう」。物語は昔へ戻ります。",
"二人は同じ剣術道場で学んでいました。道場主の岩本虎眼は、とても強い剣豪でしたが、恐ろしい性格の男でもありました。",
"伊良子は出世するため虎眼の娘・三重へ近づきます。それを知った虎眼は伊良子をひどく傷つけます。そこから復讐が始まり、道場の人々は次々と争いにのみこまれます。",
"最後の試合で藤木は伊良子を倒します。でも藤木が勝ったからといって、幸せになる人はいません。三重も命を絶ち、藤木には何も残りません。",
"「勝てばすべてが報われる」という武士の世界の残酷さを描いた物語です。"
]},
{ cat:"m_history", title:"衛府の七忍", yomi:"えふのしちにん", sub:"山口貴由", author:"山口貴由", authorYomi:"やまぐちたかよし", icon:"👹", text:[
"江戸時代を思わせる世界で、徳川の力が人々を苦しめています。",
"強い者が弱い者を好きなようにしてよいような、とても残酷な世の中です。",
"そんな中、理不尽に家族や仲間を奪われた者たちが、強い恨みを抱きます。その思いによって、人間をこえた「怨身忍者」という戦士へ変わる者が現れます。",
"一つ一つのお話では、ちがう主人公が登場します。鬼のようになった者、琉球から来た者、弱い人を守ろうとする者。みんな、それぞれ徳川の世に傷つけられてきました。",
"やがて、ばらばらだった戦士たちの物語が少しずつつながっていきます。",
"「正しい国」と言われている場所でも、弱い人が苦しんでいるなら、本当に正しいのだろうか。怒りを力に変えた人々が、巨大な権力へ立ち向かっていく物語です。"
]},
{ cat:"m_battle", title:"覚悟のススメ", yomi:"かくごのススメ", sub:"山口貴由", author:"山口貴由", authorYomi:"やまぐちたかよし", icon:"🦾", text:[
"大きな災害によって、東京はぼろぼろになっていました。",
"そんな世界の学校へ、葉隠覚悟という少年がやってきます。",
"覚悟の体には、「強化外骨格・零」という特別なよろいがあります。それを身につけると、とても大きな力を使うことができます。",
"世界には、人間を滅ぼそうとする怪物「戦術鬼」が現れます。そして、その中心にいるのは、覚悟の兄・散でした。",
"覚悟は兄を憎みきれません。でも友だちや普通に暮らす人々を守るため、兄と戦うことを決めます。",
"たくさんの激しい戦いのあと、覚悟と散は最後に兄弟として向き合います。",
"「強さは人を支配するためではなく、守るために使う」。覚悟はその思いを貫き、学校の仲間たちのもとへ帰っていくのでした。"
]},
{ cat:"m_sf", title:"エグゾスカル零", yomi:"エグゾスカルゼロ", sub:"山口貴由", author:"山口貴由", authorYomi:"やまぐちたかよし", icon:"💀", text:[
"葉隠覚悟が、長い眠りから目を覚まします。",
"しかし、そこは覚悟が知っていた世界ではありませんでした。",
"文明はほとんど滅び、人間は小さな集団に分かれて生きています。そして昔「正義の味方」だった戦士たちも、長い年月の中で変わってしまいました。",
"覚悟は強化外骨格を身につけ、「弱い人を守らなければ」と考えます。",
"でも、この世界では「正義のために戦うこと」が、別の人にとっては恐怖になることがあります。",
"覚悟は、自分と同じような戦士たちと戦いながら、「正義とは何だろう」と悩みます。",
"昔なら悪者を倒せば終わったかもしれません。でも滅びた世界では、だれが正しくてだれが悪いのか、簡単には決められません。",
"『覚悟のススメ』の英雄が、もう一度「正義」という言葉そのものを考えなおしていく物語です。"
]},
{ cat:"m_battle", title:"スプリガン", sub:"原作：たかしげ宙　作画：皆川亮二", author:"たかしげ宙／皆川亮二", authorYomi:"たかしげひろし", icon:"🗿", text:[
"世界のあちこちには、はるか昔に作られた不思議な遺跡が眠っています。",
"その遺跡には、現代の科学では作れないほど強い力を持つ道具が残されています。",
"もし悪い国や組織がそれを使えば、世界をこわしてしまうかもしれません。",
"御神苗優は、高校生でありながら、「スプリガン」と呼ばれる特別な工作員です。",
"優は世界中を飛び回り、ノアの方舟や聖杯など、古代の遺産を悪い者から守ります。",
"敵にも、とても強い兵士や超能力を持つ者がいます。",
"優は戦いながら、「昔の人が残した力を、本当に現代の人間が使ってよいのか」と考えるようになります。",
"古代文明の秘密を追いながら、世界そのものを守る少年の冒険物語です。"
]},
{ cat:"m_battle", title:"ARMS", yomi:"アームズ", sub:"漫画：皆川亮二　原案協力：七月鏡一", author:"皆川亮二／七月鏡一", authorYomi:"みながわりょうじ", icon:"🦾", text:[
"高槻涼は、ごく普通の高校生だと思っていました。",
"ところがある日、自分の右腕の中に、人間ではない不思議なものが眠っていることを知ります。",
"その力は「ARMS」と呼ばれ、危険になると怪物のような姿へ変わります。",
"涼だけではありません。隼人、武士、恵にも、それぞれちがうARMSが宿っていました。",
"四人は、自分たちを実験に使おうとする組織「エグリゴリ」と戦います。",
"やがてARMSには、アリスという存在や、人間が作り出した大きな計画が関係していることが分かります。",
"涼の中にいる「ジャバウォック」は、とても大きな破壊の力を持っています。",
"でも涼は、「力に自分を支配させない」と決めます。怪物の力を持っていても、人間としてだれかを守ることを選び続ける物語です。"
]},
{ cat:"m_battle", title:"D-LIVE!!", yomi:"ディーライブ", sub:"皆川亮二", author:"皆川亮二", authorYomi:"みながわりょうじ", icon:"🚗", text:[
"斑鳩悟は、一見すると普通の高校生です。",
"ところが悟には、とても変わった才能があります。",
"車、バイク、船、飛行機。乗り物なら、ほとんど何でも自由自在に動かすことができるのです。",
"悟は「ASE」という国際的な組織で働き、世界中の事故や事件へ向かいます。",
"暴走する列車を止めたり、危険な山道を車で走ったり、人質を助けるため飛行機を操縦したりします。",
"機械がどれほどすごくても、それを使う人間が判断を間違えれば、大きな事故になります。",
"悟は「乗り物を信じる」だけでなく、その乗り物が何をできるのかを考えながら、人の命を救います。",
"「どんなマシンにも魂がある」とでも言うように、世界中の乗り物を操って困難へ挑んでいくお話です。"
]},
{ cat:"m_horror", title:"双亡亭壊すべし", yomi:"そうぼうていこわすべし", sub:"藤田和日郎", author:"藤田和日郎", authorYomi:"ふじたかずひろ", icon:"🏚️", text:[
"東京に、「双亡亭」という古くて大きな屋敷があります。",
"その家へ入った人は、おかしくなったり、戻ってこなかったりします。",
"少年・立木緑朗の家も双亡亭によってこわされ、大切な家族まで失います。",
"そこへ売れない絵描きの凧葉務が現れます。凧葉は特別に強いわけではありません。でも緑朗を助けるため、双亡亭の中へ入っていきます。",
"屋敷の秘密を追うと、坂巻泥努という昔の絵描きと、人間ではない「侵略者」の存在が見えてきます。",
"侵略者は人の心へ入りこみ、地球へ広がろうとしていました。",
"最後に凧葉は、武器ではなく「絵」で泥努と向き合います。泥努も、自分の絵に本当に必要だったものを知ります。",
"双亡亭と侵略者をめぐる長い戦いは終わり、残された人々はようやく外の世界へ帰っていきます。"
]},
{ cat:"m_fantasy", title:"月光条例", yomi:"げっこうじょうれい", sub:"藤田和日郎", author:"藤田和日郎", authorYomi:"ふじたかずひろ", icon:"🌙", text:[
"ときどき青い月の光を浴びると、おとぎ話の世界がおかしくなってしまいます。",
"やさしいはずの登場人物が悪者になったり、物語の結末が変わったりします。",
"高校生の岩崎月光は、鉢かづき姫と出会い、そんなおとぎ話を元に戻す「月光条例」の執行者になります。",
"シンデレラ、赤ずきん、桃太郎など、知っているはずのお話の登場人物たちが、次々と人間の世界へやってきます。",
"ところが物語が進むと、月光自身にも大きな秘密があることが分かります。そして幼なじみの「エンゲキブ」の正体も、月の世界から来たカグヤ姫でした。",
"最後には、おとぎ話の仲間たちも力を合わせ、カグヤを連れ戻そうとする月の軍勢と戦います。",
"物語の登場人物たちが、自分たちの物語そのものを守るために戦う、大きなおとぎ話です。"
]},
{ cat:"m_horror", title:"邪眼は月輪に飛ぶ", yomi:"じゃがんはげつりんにとぶ", sub:"藤田和日郎", author:"藤田和日郎", authorYomi:"ふじたかずひろ", icon:"🦉", text:[
"むかし、一羽の恐ろしいフクロウがいました。",
"そのフクロウ「ミネルヴァ」は、ただ相手を見るだけで、人でも動物でも死なせてしまいます。",
"猟師の杣口鵜平は、仲間といっしょにミネルヴァを追い、一度は撃ち落としました。",
"それから13年たちます。",
"死んだと思われていたミネルヴァが東京へ現れます。街では、フクロウに見られた人たちが次々と倒れていきます。",
"最新の武器を持つ軍隊でさえ、ミネルヴァには近づけません。",
"そこで人々がたよったのは、昔ながらの銃を持つ老いた猟師・鵜平でした。",
"鵜平は娘の輪たちの力も借りながら、もう一度ミネルヴァへ立ち向かいます。",
"最新の科学でも倒せない怪物に、一人の年老いた猟師が、自分が長年身につけてきた技で挑むお話です。"
]},
{ cat:"m_history", title:"伊賀の影丸", yomi:"いがのかげまる", sub:"横山光輝", author:"横山光輝", authorYomi:"よこやまみつてる", icon:"🥷", text:[
"江戸時代、影丸という若い忍者がいました。",
"影丸は服部半蔵のもとで働く伊賀忍者です。",
"将軍を守ったり、外国やほかの藩の動きを調べたりするため、危険な場所へ何度も送られます。",
"敵にも強い忍者たちがいて、火を使う者、毒を使う者、姿を消す者など、いろいろな忍法で影丸をおそいます。",
"影丸も仲間たちと力を合わせますが、忍者同士の戦いでは、仲間が命を落とすこともあります。",
"ある戦いでは、「七つの影法師」と呼ばれる忍者たちと、七人対七人の戦いまで行います。",
"一つの敵を倒して終わる物語ではありません。影丸は幕府を守るため、次から次へと現れる忍者たちと戦い続けます。",
"忍法合戦の面白さをたっぷり描いた、昔の少年忍者漫画です。"
]},
{ cat:"m_history", title:"サスケ", sub:"白土三平", author:"白土三平", authorYomi:"しらとさんぺい", icon:"🥷", text:[
"戦国時代が終わり、徳川の世になろうとしていたころ。",
"少年忍者サスケは、父の大猿といっしょに生きていました。",
"サスケたちは、徳川に追われる側の忍者です。服部半蔵たちから命をねらわれ、安心して暮らすことができません。",
"父はサスケに、走り方、隠れ方、敵から逃げる方法など、いろいろな忍術を教えます。",
"でも忍者の世界では、だれかがだれかをだまし、復讐のために人を殺すことが当たり前のようになっています。",
"サスケも怒りにまかせて相手を殺しそうになることがあります。でもそのたび、「復讐しても悲しみは消えない」と学びます。",
"小さな忍者が、危険な時代を生きながら、人の命の大切さを知っていく成長のお話です。"
]},
{ cat:"m_history", title:"ワタリ", sub:"白土三平", author:"白土三平", authorYomi:"しらとさんぺい", icon:"🌫️", text:[
"戦国時代の伊賀では、忍者たちがいくつもの集団に分かれて争っていました。",
"少年忍者ワタリは、おじいさんといっしょに伊賀へやってきます。",
"伊賀では、子どもたちまで忍者として育てられ、命令されれば命をかけて戦わなければなりません。",
"ワタリはとてもすぐれた忍術を使います。でも、「どうして忍者たちは仲間どうしで殺しあうのだろう」と疑問を持ちます。",
"調べていくうちに、忍者たちを支配している大人たちの秘密や、「ワタリとは何者なのか」という大きな謎が見えてきます。",
"敵だと思っていた人が味方だったり、味方だと思っていた人が裏切ったりします。",
"忍術の戦いだけではなく、「人はどうして権力に従うのか」を描いた、謎の多い忍者物語です。"
]},
{ cat:"m_gag", title:"忍者ハットリくん", yomi:"にんじゃハットリくん", sub:"藤子不二雄Ⓐ", author:"藤子不二雄Ⓐ", authorYomi:"ふじこふじおエー", icon:"🥷", text:[
"三葉ケン一は、ごく普通の小学生です。",
"そんなケン一の家へ、ある日、小さな忍者がやってきます。",
"その名はハットリカンゾウ。",
"ハットリくんは伊賀から修業のため町へ来て、ケン一の家で暮らすことになります。",
"学校で困ったことが起きると、ハットリくんが忍法で助けてくれます。",
"でもライバルの甲賀忍者・ケムマキも現れます。ケムマキはケン一を困らせたり、ハットリくんへ勝負をしかけたりします。",
"ハットリくんは忍者ですが、悪い人を倒す大戦争をするわけではありません。",
"ケン一の恋や学校の悩みを、忍法を使って手伝います。昔の忍者が現代の普通の家で暮らしたらどうなるのかを、楽しく描いたお話です。"
]},
{ cat:"m_sf", title:"チンプイ", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"👽", text:[
"春日エリは、普通の小学生の女の子です。",
"ある日、エリの前に、チンプイという小さな宇宙人が現れます。",
"チンプイたちは、遠いマール星から来ました。",
"そしてエリに、とんでもないことを言います。",
"「マール星の王子さまと結婚してください」。",
"もちろんエリはびっくりします。「会ったこともない人と結婚なんてできないよ」と断ります。",
"でもチンプイたちはあきらめません。",
"不思議な道具や宇宙の技術を使いながら、エリの毎日に入りこんできます。",
"エリにも好きな男の子がいて、王子さまとの結婚を簡単に決めることはできません。",
"「自分の人生は、自分で決めたい」。そんな女の子と、不思議な宇宙人たちの楽しい日常のお話です。"
]},
{ cat:"m_sf", title:"ウメ星デンカ", yomi:"ウメぼしデンカ", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"👑", text:[
"ある日、宇宙から小さなロケットが落ちてきます。",
"中に乗っていたのは、ウメ星という星の王さま、王妃さま、そして王子のデンカでした。",
"ウメ星では大変なことが起こり、三人は地球へ逃げてきたのです。",
"地球の普通の家に住むことになった王さまたちは、「自分たちは王族だぞ」と言います。",
"でも地球では、王さまだからといって何でも思い通りにはなりません。",
"学校へ行ったり、町で買い物をしたりするだけでも、ウメ星とはちがうことばかりです。",
"デンカは地球の子どもたちと友だちになり、少しずつこの星の生活へなじんでいきます。",
"遠い星の王子さまが、普通の家庭で暮らすおかしさを描いたSFコメディーです。"
]},
{ cat:"m_gag", title:"ポコニャン", sub:"藤子・F・不二雄", author:"藤子・F・不二雄", authorYomi:"ふじこエフふじお", icon:"🐾", text:[
"ある日、一人の少年の前に、とても不思議な生き物が現れます。",
"名前はポコニャン。",
"猫のようにも見えますが、猫ではありません。",
"ポコニャンには、不思議な力があります。",
"物を動かしたり、姿を変えたり、普通ならできないことを、ひょいっとやってしまいます。",
"少年は「この力を使えば、毎日がもっと楽になる」と思います。",
"でも、楽をしようとしてポコニャンの力を使うと、かえって大変なことになることもあります。",
