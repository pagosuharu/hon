"そんな宵が出会ったのが、もう一人の「王子」と呼ばれている市村琥珀です。琥珀はお金持ちの家の男の子で、だれにでも軽そうに見えます。",
"けれど琥珀は、宵を「王子」ではなく、一人の女の子として見てくれました。宵は初めて経験する気持ちに戸惑いながら、琥珀と付き合い始めます。",
"二人は、おたがいに恋愛に慣れていません。やきもちをやいたり、言葉が足りなかったり、相手の気持ちを決めつけてしまったりします。それでも少しずつ、本当の自分を見せられるようになります。",
"ところが琥珀の家族の事情が、二人の間に大きく入りこんできます。琥珀は学校をやめ、海外へ行くことまで考えるようになり、宵との関係も大きく揺れます。",
"2026年10月現在、物語はまだ続いています。二人が「好き」という気持ちだけでは解決できない未来の問題と、どう向き合っていくのかが描かれている途中です。"
]},
{ cat:"m_love", title:"ゆびさきと恋々", yomi:"ゆびさきとれんれん", sub:"森下suu", author:"森下suu", authorYomi:"もりしたすう", icon:"🤟", text:[
"糸瀬雪は、生まれつき耳が聞こえない大学生です。雪は手話や文字、スマートフォンを使って、人と話しています。",
"ある日、電車の中で困っていた雪を助けてくれたのが、同じ大学の波岐逸臣でした。逸臣は外国を旅するのが好きで、いろいろな言葉を話せます。",
"雪は、「自分の知らない世界をたくさん知っている人だ」と逸臣にひかれていきます。逸臣もまた、雪のことを知りたいと思い、手話を覚え始めます。",
"二人はやがて恋人になります。雪の幼なじみの桜志は、ずっと雪を心配してきたため、逸臣をなかなか認められません。でも、雪自身は「守られているだけではなく、自分でいろいろな場所へ行きたい」と考えるようになります。",
"雪と逸臣は一緒に暮らし始め、二人の世界はますます広がっていきます。雪はアルバイトや友人関係にも挑戦し、逸臣の家族や過去も少しずつ見えてきます。",
"2026年10月現在、物語はまだ続いています。二人は海外へも旅をしながら、「聞こえる人」と「聞こえない人」という違いをこえて、一緒に生きる方法を少しずつ見つけています。"
]},
{ cat:"m_love", title:"花君と恋する私", spine:"花君と|恋する私", yomi:"はなくんとこいするわたし", sub:"熊岡冬夕", author:"熊岡冬夕", authorYomi:"くまおかふゆ", icon:"🌼", text:[
"坂下七世は、まじめで成績のよい高校生です。",
"ある日、学校でちょっと問題のある男の子・花大好と出会います。花君は遅刻をしたり、先生に怒られたりしますが、本当はやさしく、まっすぐなところもある男の子でした。",
"七世は、そんな花君を好きになります。ところが花君には、こまり先生という好きな人がいました。",
"「私じゃだめなんだ」。七世は傷つきます。それでも花君を嫌いにはなれません。そばで笑ったり、悩んだりしているうちに、花君も少しずつ七世の大切さに気づいていきます。",
"二人は一度すれちがいますが、やがて気持ちを確かめ合い、恋人になります。ところが、恋人になってからも、家族や進路、まわりの人たちとの関係など、新しい問題がやってきます。",
"単行本は10巻まで出ていますが、作品は長いあいだ休載しており、二人の物語にはまだ正式な結末が描かれていません。最後に描かれたところでは、七世と花君の関係が家族にも知られ始め、これから二人がどう進むのか、というところで止まっています。"
]},
{ cat:"m_love", title:"好きっていいなよ。", yomi:"すきっていいなよ", sub:"葉月かなえ", author:"葉月かなえ", authorYomi:"はづきかなえ", icon:"💕", text:[
"橘めいは、高校生になるまで、ずっと友だちを作らずに生きてきました。",
"小さいころ、友だちに裏切られた経験から、「人なんて信じても、どうせいつか傷つけられる」と思っていたのです。",
"そんなめいの前に、学校一の人気者・黒沢大和が現れます。めいが大和を蹴ってしまったことをきっかけに、なぜか大和はめいに興味を持ちます。",
"大和は、めいが困ったときに助け、どんどん彼女の心へ入ってきます。めいは最初は戸惑いますが、少しずつ大和を信じるようになり、二人は恋人になります。",
"でも恋人になれば、全部うまくいくわけではありません。友だちへのやきもち、人気者の大和への不安、モデルの仕事、進路。それぞれが大人に近づくほど、二人の世界も広がっていきます。",
"めいは、大和だけに頼るのではなく、自分の夢や仕事を見つけていきます。大和もまた、自分の道を選びます。",
"最後には、二人は「ずっと同じ場所にいなければ愛せない」という考えを乗りこえ、それぞれの道を進みながら関係を続けます。人を信じることがこわかっためいが、たくさんの大切な人を持てるようになる物語です。"
]},
{ cat:"m_love", title:"オオカミ少女と黒王子", spine:"オオカミ少女と|黒王子", yomi:"オオカミしょうじょとくろおうじ", sub:"八田鮎子", author:"八田鮎子", authorYomi:"はったあゆこ", icon:"🐺", text:[
"篠原エリカは、高校で友だちに「私にはすてきな彼氏がいる」とうそをついてしまいます。",
"本当は彼氏などいません。困ったエリカは、町で見かけたかっこいい男の子をこっそり写真に撮り、「この人が彼氏」と友だちに見せました。",
"ところがその男の子、佐田恭也は、なんと同じ学校の生徒でした。",
"エリカは事情を話し、「彼氏のふりをしてください」とお願いすることになります。恭也は笑顔で引き受けますが、本当はかなりいじわる。「俺の犬になるならいいよ」と言い、エリカをからかいます。",
"それでも一緒にいるうちに、エリカは恭也を本当に好きになります。恭也も、最初は遊びだったはずなのに、まっすぐなエリカを大切にするようになります。",
"二人は本当の恋人になり、けんかをしながら高校生活を送ります。卒業後は離れて暮らすことになりますが、遠距離恋愛も乗りこえます。",
"やがて二人は結婚し、大人になっても相変わらず言い合いをしながら一緒に暮らしていきます。うそから始まった恋が、本物の家族になるまでのお話です。"
]},
{ cat:"m_love", title:"ReReハロ", yomi:"リリハロ", sub:"南塔子", author:"南塔子", authorYomi:"みなみとうこ", icon:"🧹", text:[
"早川リリコは、家事が得意な高校生です。母親を亡くしてからは、父親や弟のためにご飯を作り、家のことをしっかりこなしてきました。",
"ある日、父親の便利屋の仕事を手伝うことになったリリコは、周防湊という男の子の家へ行きます。",
"湊はお金持ちの家の子で、少しわがまま。でも家族との関係にはさびしさを抱えていました。",
"リリコは仕事として湊の食事を作ったり、身の回りのことを手伝ったりします。湊も、いつも自分のために一生懸命なリリコにひかれていきます。",
"やがて二人は恋人になります。でも、家のちがいや進路など、二人にはそれぞれ考えなければならないことがあります。",
"湊は、何でも人にしてもらうだけの男の子から、自分の人生を自分で考える人へ変わっていきます。リリコも、家族のためだけではなく、自分の将来を考えるようになります。",
"最後には二人は、おたがいを支えながら、それぞれの未来へ進んでいきます。「お世話をする人」と「される人」から、となりに並んで歩く二人になるのでした。"
]},
{ cat:"m_daily", title:"虹色デイズ", yomi:"にじいろデイズ", sub:"水野美波", author:"水野美波", authorYomi:"みずのみなみ", icon:"🌈", text:[
"羽柴夏樹、松永智也、片倉恵一、直江剛は、いつも一緒にいる四人の男子高校生です。",
"性格はみんなちがいます。夏樹は恋に夢を見るやさしい男の子。智也は女の子が大好き。恵一はいつも笑っているけれど少し変わり者。剛はおとなしく、オタク趣味を持っています。",
"クリスマスの日、夏樹は小早川杏奈という女の子に出会い、恋をします。",
"でも夏樹はなかなか気持ちを伝えられません。友だちはからかったり、応援したりします。",
"やがて、四人それぞれに恋が生まれます。剛には恋人のゆきりんがいて、智也は杏奈の友だち・まりに本気になります。恵一にも自分を好きになってくれる女の子が現れます。",
"楽しかった高校生活にも、卒業の日がやってきます。",
"四人は別々の進路へ向かいますが、それぞれの恋も友情も続いていきます。夏樹と杏奈もようやくしっかり気持ちを結び、智也とまりも、恵一とのぞみも前へ進みます。",
"毎日ばかみたいな話をしていた四人が、恋を通して少しずつ大人になる、にぎやかな青春のお話です。"
]},
{ cat:"m_art", title:"覆面系ノイズ", yomi:"ふくめんけいノイズ", sub:"福山リョウコ", author:"福山リョウコ", authorYomi:"ふくやまりょうこ", icon:"🎤", text:[
"有栖川仁乃、ニノは、歌うことが大好きな女の子です。",
"小さいころ、ニノにはモモという大切な男の子がいました。二人はいつも歌っていましたが、ある日モモは突然いなくなってしまいます。",
"悲しむニノの前に現れたのが、ユズという少年でした。ユズは曲を作り、ニノはその曲を歌います。けれどユズもまた、ある日ニノの前から姿を消してしまいます。",
"高校生になったニノは、ユズと再会します。ユズはバンド「in NO hurry to shout;」で曲を作っていました。そして、ずっと探していたモモも、音楽の世界にいました。",
"ニノはモモが大好きです。ユズはニノが大好きです。モモもニノを忘れられません。三人の気持ちは、歌のように大きくぶつかります。",
"ニノはバンドのボーカルとして成長し、「だれかに会うためだけ」ではなく、自分の歌を届ける人になっていきます。",
"そして長いすれちがいのあと、ニノはいつも自分の歌を支えてくれたユズの気持ちと向き合います。モモもまた過去を手放し、それぞれが自分の音楽と未来へ進みます。"
]},
{ cat:"m_fantasy", title:"暁のヨナ", yomi:"あかつきのヨナ", sub:"草凪みずほ", author:"草凪みずほ", authorYomi:"くさなぎみずほ", icon:"🐉", text:[
"ヨナは、高華王国のお姫さまです。赤い髪を持ち、父王に大切に育てられ、城の外の苦しい暮らしをほとんど知りませんでした。",
"ヨナは幼なじみのスウォンが大好きです。ところが十六歳の誕生日の夜、スウォンはヨナの父を殺し、王位をうばいます。",
"ヨナは、護衛のハクと二人で城から逃げます。",
"何もできなかったヨナですが、旅の中で貧しい村や戦争に苦しむ人々を見ます。「私は、この国のことを何も知らなかった」。そう気づいたヨナは、弓や剣を学び始めます。",
"やがてヨナは、伝説にある四人の「龍の戦士」――キジャ、シンア、ジェハ、ゼノと出会います。みんなで旅をしながら、人を助け、国の問題と向き合います。",
"ヨナはスウォンを憎みきれません。スウォンにも、国を守るため王になった理由がありました。そしてハクとヨナは、長い時間をかけて、おたがいを愛していることを認めます。",
"最後の大きな戦いでは、龍たちの力の秘密にも決着がつきます。四龍は人間として生きられるようになり、長いあいだ不死だったゼノにも、ようやく終わりのない苦しみから解放される時がきます。",
"スウォンは王位をヨナへゆずり、ヨナは高華王国を背負う新しい王になります。そしてハクは、そのとなりにいます。",
"箱入りのお姫さまだった少女が、国中を歩き、人々を知り、自分の手で国を守る王になるまでの大きな物語です。連載は2025年12月に完結し、最終48巻は2026年10月20日発売予定です。"
]},
{ cat:"m_fantasy", title:"それでも世界は美しい", spine:"それでも|世界は美しい", yomi:"それでもせかいはうつくしい", sub:"椎名橙", author:"椎名橙", authorYomi:"しいなだい", icon:"☔", text:[
"ニケは、「雨の公国」という小さな国のお姫さまです。ニケには、歌をうたって雨を呼ぶ不思議な力がありました。",
"ある日ニケは、世界をほとんど支配した「太陽王リヴィウス一世」のもとへ、お嫁に行くことになります。",
"「どんな恐ろしい王なんだろう」と思っていたニケですが、会ってみるとリヴィウス、通称リビはまだ少年でした。",
"リビは小さいころに母親を失い、人を信じられなくなっていました。ニケはそんなリビに負けず、怒ったり、笑ったり、雨を見せたりします。",
"二人は少しずつ、本当の夫婦のように大切な存在になっていきます。",
"でも世界には、国同士の争いや、ニケの力を利用しようとする人々がいます。そして最後には、世界そのものを守るため、ニケがとても大きな役目を背負うことになります。",
"ニケはみんなを救うため、リビの前から姿を消します。",
"それでもリビはあきらめません。仲間たちと力を合わせ、ニケを取り戻す方法を探し続けます。",
"長い時間のあと、ニケは再びリビのもとへ帰ってきます。小さな王と元気なお姫さまから始まった二人は、世界の苦しさも美しさも知った大人として、もう一度手を取り合うのでした。"
]},
{ cat:"m_fantasy", title:"神様はじめました", spine:"神様|はじめました", yomi:"かみさまはじめました", sub:"鈴木ジュリエッタ", author:"鈴木ジュリエッタ", authorYomi:"すずきじゅりえった", icon:"🦊", text:[
"桃園奈々生は、父親が借金を残していなくなり、家まで失ってしまった女子高校生です。",
"行く場所のない奈々生は、公園で困っていた男性を助けます。すると男性は「家をゆずるよ」と言って、奈々生にある場所を教えてくれました。",
"そこは、なんと神社でした。",
"しかも奈々生は、知らないうちに「土地神さま」の役目までゆずられていました。",
"神社には、巴衛という美しいキツネの妖怪がいました。巴衛は、人間の奈々生が神さまになったことを認めません。でも奈々生は逃げず、少しずつ神さまとして人や妖怪を助けるようになります。",
"奈々生と巴衛はやがて恋をします。",
"ところが巴衛には、何百年も前に愛した女性との約束と、命にかかわる呪いがありました。奈々生は過去の時代へ行き、その秘密を知ります。",
"そこでわかったのは、巴衛が昔愛した女性と、奈々生の運命が深くつながっていたことでした。",
"奈々生は過去と現在を結び、巴衛の呪いを解きます。",
"巴衛は妖怪として永遠に生きるのではなく、人間になって奈々生と同じ時間を生きることを選びます。",
"奈々生が高校を卒業すると、二人は結婚して神社を離れます。そして何年か後、子どもを連れて神社へ帰ってきます。",
"家さえなかった女の子が、自分の家族と帰る場所を手に入れる物語です。"
]},
{ cat:"m_fantasy", title:"赤髪の白雪姫", yomi:"あかがみのしらゆきひめ", sub:"あきづき空太", author:"あきづき空太", authorYomi:"あきづきそらた", icon:"🍎", text:[
"白雪は、めずらしい赤い髪を持つ薬剤師の女の子です。",
"その髪を気に入った国の王子から「側室になれ」と言われた白雪は、「そんなのはいやです」と国を飛び出します。",
"森で白雪が出会ったのが、隣のクラリネス王国の第二王子・ゼンでした。",
"白雪はゼンに助けられますが、ただ守ってもらうだけではありません。「私は自分の力で、この国に居場所を作りたい」と宮廷薬剤師を目指します。",
"試験を受け、薬草を学び、人の病気を治しながら、白雪は少しずつ王宮で信頼されるようになります。",
"ゼンも白雪にひかれ、二人は恋人になります。",
"けれど王子と平民の薬剤師では、ただ「好きだから結婚しよう」とはいきません。白雪はゼンのとなりに立つためにも、自分自身の仕事と力を大切にします。",
"ゼンもまた、王族としての責任を背負いながら、白雪との未来を考えています。",
"2026年10月現在も物語は続いています。白雪とゼンは離れた場所で仕事をすることもありますが、それぞれ成長しながら、いつか堂々と同じ道を歩くために前へ進んでいます。"
]},
{ cat:"m_fantasy", title:"コレットは死ぬことにした", spine:"コレットは|死ぬことにした", yomi:"コレットはしぬことにした", sub:"幸村アルト", author:"幸村アルト", authorYomi:"こうむらあると", icon:"💊", text:[
"コレットは、小さな村で働く薬師の女の子です。",
"朝から晩まで「先生、助けてください」と呼ばれ続け、休む時間もありません。ある日、とうとう疲れきったコレットは、井戸の中へ飛びこんでしまいます。",
"ところが、井戸の底にあったのは死ではなく、「冥府」という死者の世界でした。",
"そこでコレットは、冥府の王ハデスに出会います。",
"ハデスは神さまなのに体調をくずしていました。薬師のコレットは放っておけず、治療を始めます。",
"それからコレットは、人間の世界と冥府を行ったり来たりしながら、ハデスや冥府の住人たちと仲良くなります。",
"ハデスも、いつも一生懸命なコレットを大切に思うようになり、二人は恋人になります。",
"けれどハデスは永遠に近い時を生きる神さま。コレットは、いつか年をとって死ぬ人間です。",
"二人はその違いから逃げず、自分たちがどう生きたいのかを考えます。",
"コレットは薬師として多くの人を助けたあと、ハデスと長い時を歩く道へ進みます。人を救うことばかり考えて自分をすりへらしていた少女が、自分自身の幸せも大切にできるようになる物語です。"
]},
{ cat:"m_fantasy", title:"贄姫と獣の王", yomi:"にえひめとけもののおう", sub:"友藤結", author:"友藤結", authorYomi:"ともふじゆう", icon:"🦁", text:[
"サリフィは、人間の国から魔族の王へ差し出された、九十九人目の「いけにえ」の少女です。",
"普通なら王を見ただけでふるえてしまいます。でもサリフィは、王をまったくこわがりません。",
"「どうせ食べられるなら、最後まで自分らしくいたい」と考えていたからです。",
"魔族の王レオンハートは、そんなサリフィに興味を持ちます。",
"そしてサリフィは、王にも秘密があることを知ります。レオンハートには人間の血も流れており、あるときには人間の姿になるのです。",
"サリフィは王の秘密も弱さも受け入れます。レオンハートも、サリフィをいけにえではなく、自分の妃にすると決めます。",
"しかし魔族たちは、「人間など王妃にできない」と反対します。",
"サリフィはさまざまな土地へ行き、人間をきらう魔族とも向き合い、少しずつ信頼を得ます。",
"やがて王の出生の秘密を利用して国をうばおうとする者が現れ、レオンハートは王位を失いかけます。",
"それでもサリフィや仲間たちは彼を信じ、国を取り戻します。",
"最後にはサリフィは正式な王妃となり、人間と魔族が少しずつ歩みよる新しい時代が始まります。二人にはやがて子どもも生まれます。",
"食べられるために来た少女が、国そのものを変える王妃になる物語です。"
]},
{ cat:"m_love", title:"天堂家物語", yomi:"てんどうけものがたり", sub:"斎藤けん", author:"斎藤けん", authorYomi:"さいとうけん", icon:"🏯", text:[
"ある少女は、家族を持たず、老人に育てられて暮らしていました。",
"育ててくれた人を亡くした少女は、「だれかを助けて死ねたら、それでいい」と思うようになります。",
"そんな少女が出会ったのが、大きなお屋敷・天堂家の青年、天堂雅人です。",
"天堂家はお金も力もある一族ですが、その中では、だれが家を継ぐのかをめぐって恐ろしい争いが続いていました。",
"少女は事情から「らん」と名乗り、雅人の婚約者として天堂家へ入ります。",
"雅人にも目的がありました。家族を苦しめた天堂家の秘密をあばき、復讐しようとしていたのです。",
"らんは「雅人さまを守って死ぬ」と何度も言います。でも雅人は、「勝手に死ぬな」と怒ります。",
"一緒に危険を乗りこえるうち、らんは初めて「この人と生きたい」と思うようになります。雅人もまた、らんをただ利用する相手ではなく、かけがえのない人として愛するようになります。",
"2026年10月現在も物語は続いています。天堂家の後継ぎ争いと、雅人の過去の真相はますます大きくなり、二人は「死ぬため」ではなく「一緒に生きるため」に戦っています。"
]},
{ cat:"m_fantasy", title:"天使禁猟区", yomi:"てんしきんりょうく", sub:"由貴香織里", author:"由貴香織里", authorYomi:"ゆきかおり", icon:"👼", text:[
"無道刹那は、少し乱暴だけれど、大切な人にはまっすぐな高校生です。",
"刹那には紗羅という妹がいました。そして刹那は、兄妹なのに紗羅を恋人のように好きになってしまい、その気持ちに苦しんでいました。",
"ところが刹那には、もっと大きな秘密があります。",
"じつは刹那の魂には、神に逆らった天使・アレクシエルが生まれ変わっていたのです。",
"天使たちの争いは、地上の刹那たちまで巻きこみます。そして紗羅は命を落としてしまいます。",
"刹那は「紗羅を取り戻したい」と、地獄や天界まで旅をします。",
"そこで刹那は、天使だから善い、悪魔だから悪い、という簡単な世界ではないことを知ります。神の命令に苦しむ天使もいれば、大切な人を守ろうとする悪魔もいます。",
"やがて戦いは、天使どうしではなく、この世界を作った神そのものへと向かいます。",
"刹那は仲間たちと力を合わせ、「だれかに決められた運命」ではなく、自分たちの意思で生きるために戦います。",
"多くの命を失いながらも、最後には神による支配が終わり、刹那と紗羅にも、自分たちの未来を選ぶ時がやってきます。"
]},
{ cat:"m_horror", title:"伯爵カイン", yomi:"はくしゃくカイン", sub:"由貴香織里", author:"由貴香織里", authorYomi:"ゆきかおり", icon:"🥀", text:[
"十九世紀のイギリス。",
"カイン・ハーグリーヴスは、若くして伯爵となった美しい少年です。",
"カインは珍しい毒を集めるのが好きで、執事のリフ、妹のメアリウェザーと暮らしています。",
"一見すると立派なお屋敷の主人ですが、カインの生い立ちはとてもつらいものでした。父アレクシスからひどく傷つけられ、母や家族についても暗い秘密を抱えています。",
"カインのまわりでは、不思議な殺人や、人形、毒、昔の伝説にまつわる事件が次々と起こります。",
"カインは頭のよさと毒の知識を使い、事件の真相を見つけます。でも事件を解くたびに、人の心の中には、悲しみや憎しみがあることを知っていきます。",
"そして、いくつもの事件の向こうには、カインの父アレクシスにつながる大きな組織の影が見えてきます。",
"『伯爵カイン』の物語は、やがて次の作品『ゴッドチャイルド』へつながり、カインと父の長い戦いが本格的に始まるのでした。"
]},
{ cat:"m_horror", title:"ゴッドチャイルド", sub:"由貴香織里", author:"由貴香織里", authorYomi:"ゆきかおり", icon:"🕯️", text:[
"『伯爵カイン』の続きです。",
"カインは、父アレクシスが深く関わる秘密組織「デライラ」と戦うようになります。",
"デライラは、人の命を使った恐ろしい研究まで行い、「死んだ人を取り戻す」という人間の願いを利用していました。",
"カインは事件を追いながら、自分の家族にまつわる真実を知っていきます。",
"そして、何より信じていた執事リフにも、大きな秘密がありました。",
"「自分はいったいだれを信じればいいのだろう」。カインは何度も絶望します。それでも、リフやメアリウェザーを大切に思う気持ちは消えません。",
"最後には、カインと父アレクシスとの戦いに決着の時がやってきます。",
"崩れ落ちる場所の中で、カインとリフは最後までおたがいを選びます。そして二人は、そのまま人々の前から姿を消します。",
"メアリウェザーは生き残り、大切な兄のことを思いながら成長していきます。",
"カインが幸せだった時間は決して長くありませんでした。それでも、自分を愛してくれた人がいたことだけは、最後まで消えないのでした。"
]},
{ cat:"m_sf", title:"秘密 -トップ・シークレット-", spine:"秘密|-トップ・シークレット-", yomi:"ひみつ トップシークレット", sub:"清水玲子", author:"清水玲子", authorYomi:"しみずれいこ", icon:"🧠", text:[
"少し未来の日本では、死んだ人の脳を特別な機械で調べ、その人が生前に見ていた映像を見る技術が作られています。",
"警察の「第九」という部署では、この技術を使って、普通の捜査では解けない事件を調べています。",
"第九を率いる薪剛は、小さな体で美しい顔をした、とても頭のよい人物です。でも彼には、親友だった鈴木を失った大きな傷がありました。",
"そこへ新人の青木一行がやってきます。青木は、亡くなった鈴木によく似ていました。",
"二人は、死んだ人の最後の記憶を見ながら、殺人や失踪の謎を解いていきます。",
"でも「秘密を見れば真実がわかる」とは限りません。",
"人には、死んでも知られたくないことがあります。「犯罪を解くためなら、人の心をどこまで見てもいいのか」。第九の人たちは、いつもその問題に苦しみます。",
"青木自身の家族も事件に巻きこまれ、薪もまた大切な人を守れなかった苦しみと向き合います。",
"たくさんの事件を通して、青木と薪は強い信頼で結ばれていきます。そして第九の物語は、過去とその後を描く『秘密 season 0』へ続いていきます。"
]},
{ cat:"m_sf", title:"秘密 season 0", spine:"秘密|season 0", yomi:"ひみつ シーズンゼロ", sub:"清水玲子", author:"清水玲子", authorYomi:"しみずれいこ", icon:"🧠", text:[
"『秘密 -トップ・シークレット-』につながる物語です。",
"物語では、薪剛がまだ若かったころや、親友の鈴木と過ごした時代、そして「死者の脳を見る捜査」がどのように始まったのかも描かれます。",
"薪と鈴木は、最初から今のような立派な捜査官だったわけではありません。",
"新しい技術を使えば事件を解けるかもしれない。でも、死んだ人の心を勝手に見ることにもなります。",
"二人は「正しい捜査とは何か」と考えながら、第九の土台を作っていきます。",
"その後、物語は青木たちがいる時代にも進みます。",
"昔の事件が今の事件につながったり、政治や国家にまで関係する大きな秘密が出てきたりします。",
"どれだけ機械が進歩しても、人の悲しみや愛情まで簡単に答えが出るわけではありません。",
"2026年10月現在も連載中で、第九の人々は新しい事件と向き合い続けています。"
]},
{ cat:"m_love", title:"Wジュリエット", yomi:"ダブルジュリエット", sub:"絵夢羅", author:"絵夢羅", authorYomi:"えむら", icon:"🎭", text:[
"三浦糸は、男の子のように元気で、学校の演劇部に入っている女子高校生です。",
"ある日、演劇部へ、とても美しい女の子・天野真琴が入ってきます。",
"ところが真琴には秘密がありました。",
"じつは真琴は男の子だったのです。",
"真琴の父親は俳優になる夢に反対しており、「高校三年間を女として過ごし、正体がばれなければ、俳優になることを認める」という約束をしていました。",
"そのため真琴は女の子のふりをして学校へ通っていたのです。",
"秘密を知った糸は、真琴を助けることにします。",
"男の子のような糸と、女の子のように見える真琴。二人はまるで「ロミオとジュリエット」が反対になったような関係です。",
"一緒に演劇を続けるうち、二人は恋人になります。",
"でも真琴の正体を学校や家族に知られてはいけません。何度もばれそうになりながら、二人は夢と恋を守ります。",
"最後には真琴は約束をやりとげ、堂々と男として俳優の道へ進めるようになります。",
"糸も真琴と一緒に未来へ進み、二人は結婚へ向かっていくのでした。"
]},
{ cat:"m_fantasy", title:"紅茶王子", yomi:"こうちゃおうじ", sub:"山田南平", author:"山田南平", authorYomi:"やまだなんぺい", icon:"🫖", text:[
"吉岡奈子たちは、学校で紅茶を楽しむ「お茶会同好会」を作っています。",
"ある満月の夜、紅茶のカップに月を映しておまじないをすると、小さな人が現れました。",
"その正体は、紅茶の国から来た「紅茶王子」です。",
"紅茶王子は、自分を呼び出した主人の願いを三つかなえると、紅茶の国へ帰っていきます。",
"奈子の前に現れたのはアッサム。",
"最初は不思議な友だちのような二人でしたが、長く一緒に過ごすうちに、奈子とアッサムはおたがいを好きになります。",
"でもアッサムは人間ではありません。",
"願いをかなえ終えれば、いつか別れなければなりません。",
"アッサムは奈子と生きるため、「人間になりたい」と願うようになります。しかし、人間になるには大きな代わりのものが必要でした。",
"別れや記憶の問題を乗りこえながら、奈子たちは「大切な人を忘れても、その人を好きだった心まで全部なくなるのだろうか」と向き合います。",
"たとえ記憶が薄れても、心に残った何かがもう一度二人を引き合わせる――そんな希望を残して、奈子とアッサムの恋は未来へつながっていきます。"
]},
{ cat:"m_daily", title:"フルーツバスケットanother", spine:"フルーツバスケット|another", yomi:"フルーツバスケットアナザー", sub:"高屋奈月", author:"高屋奈月", authorYomi:"たかやなつき", icon:"🍙", text:[
"三苫彩葉は、人と仲良くするのが苦手な高校生です。",
"家では母親から十分に大切にされず、「自分は人に迷惑をかける人間なんだ」と思いこんで育ってきました。",
"そんな彩葉が高校で出会ったのが、草摩睦生や草摩はじめたちです。",
"彼らは、前作『フルーツバスケット』に登場した草摩家の人々の子どもたちでした。",
"睦生たちは彩葉を特別あつかいするのではなく、普通に話しかけ、困っていれば助け、一緒に笑ってくれます。",
"最初は「どうして私なんかにやさしくするの？」と戸惑っていた彩葉も、少しずつ心を開いていきます。",
"そして彩葉は、母親から言われてきた言葉が、すべて本当だったわけではないと気づきます。",
"「自分は愛される価値のない人間だ」と思っていたけれど、そんなことはありませんでした。",
"最後には、過去の傷が全部消えるわけではなくても、自分を大切にしてくれる人たちの手を取れるようになります。",
"前作の子どもたちが、今度は傷ついた別の子へやさしさを渡していく物語です。全4巻で完結しています。"
]},
{ cat:"m_daily", title:"学園ベビーシッターズ", spine:"学園|ベビーシッターズ", yomi:"がくえんベビーシッターズ", sub:"時計野はり", author:"時計野はり", authorYomi:"とけいのはり", icon:"🍼", text:[
"鹿島竜一と、まだ小さな弟の虎太郎は、飛行機事故で両親を亡くしてしまいます。",
"二人を引き取ってくれたのは、森ノ宮学園の理事長でした。",
"ただし、ひとつ条件があります。",
"「学校にある保育ルームで、ベビーシッターをしなさい」。",
"こうして高校生の竜一は、学校へ通いながら、小さな子どもたちの世話をすることになります。",
"保育ルームには、元気すぎる子、泣き虫な子、双子など、いろいろな子がいます。",
"竜一はミルクを飲ませたり、一緒に遊んだり、ときにはけんかを止めたりします。",
"弟の虎太郎は無口ですが、お兄ちゃんの竜一が大好きです。",
"竜一自身も、両親を失った悲しみを抱えています。それでも友だちや先生、子どもたちと過ごすうちに、森ノ宮学園が新しい「家」のようになっていきます。",
"2026年10月現在も連載中です。大きな悪者を倒すお話ではなく、泣いたり笑ったりする毎日の中で、竜一と虎太郎がたくさんの人に家族のように愛されていく物語です。"
]},
{ cat:"m_gag", title:"俺様ティーチャー", yomi:"おれさまティーチャー", sub:"椿いづみ", author:"椿いづみ", authorYomi:"つばきいづみ", icon:"🐰", text:[
"黒崎真冬は、中学時代、とても強い不良少女でした。",
"けんかばかりしていたため学校を退学になり、別の高校へ転校します。",
"「今度こそ、かわいくて普通の高校生活を送るんだ！」。",
"そう決めた真冬でしたが、転校先には昔から知っている佐伯鷹臣が教師としていました。",
"しかも鷹臣は、真冬が昔からまったく頭の上がらない相手です。",
"学校では生徒が少なく、問題もたくさん起きています。",
"鷹臣は学校を立て直すため、真冬や早坂たちを「風紀部」に入れます。",
"真冬は正体を隠すため、男装した「夏男」や、ウサギの仮面をかぶった「ウサちゃんマン」になり、学校の不良たちと戦います。",
"そのうち、生徒会との大きな争いや、早坂の家族の秘密、鷹臣がこの学校にいる本当の理由まで見えてきます。",
"最初は「普通の女の子になりたい」と思っていた真冬ですが、最後には、自分の強さも、けんかっ早さも、全部自分の一部だと受け入れます。",
"恋愛だけで終わるお話ではありません。仲間と一緒に学校を守り、真冬が「自分らしくいること」を選ぶ学園コメディです。"
]},
{ cat:"m_fantasy", title:"花と悪魔", yomi:"はなとあくま", sub:"音久無", author:"音久無", authorYomi:"おとくなし", icon:"💐", text:[
"大悪魔ヴィヴィは、魔界を離れて人間界の屋敷で暮らしていました。",
"ある日ヴィヴィは、屋敷の近くに捨てられていた赤ちゃんを拾います。",
"赤ちゃんの名前は「はな」。",
"ヴィヴィは「すぐに飽きるだろう」と思いながら、はなを育て始めます。",
"それから十四年。",
"はなは明るく元気な女の子に育ちました。",
"悪魔は花にさわると花を枯らしてしまうため、ヴィヴィは本物の花を受け取れません。それでもはなは、毎日のようにヴィヴィへ花を渡そうとします。",
"はなはいつしかヴィヴィを恋するようになります。",
"ヴィヴィもはなを大切に思っていますが、悪魔と人間では生きる時間がまったくちがいます。",
"さらに魔界の問題が起こり、ヴィヴィははなから離れなければならなくなります。",
"長い別れのあと、二人は再会します。",
"ヴィヴィは「人間だからいつか死ぬ」と怖がるのではなく、それでもはなと生きることを選びます。",
"二人は結婚し、子どもたちにもめぐまれます。",
"やがて人間のはなは年をとり、ヴィヴィより先に人生を終えます。それでもヴィヴィにとって、はなと過ごした時間は何より大切な宝物でした。",
"永遠に近く生きる悪魔が、短い命を持つ人間を愛したことで、本当の幸せを知る物語です。"
]},
{ cat:"m_love", title:"図書館戦争 LOVE&WAR", spine:"図書館戦争|LOVE&WAR", yomi:"としょかんせんそう ラブアンドウォー", sub:"原作：有川浩　漫画：弓きいろ", author:"有川浩／弓きいろ", authorYomi:"ありかわひろ", icon:"📚", text:[
"少し未来の日本では、「よくない本」を国が取りしまるようになっています。",
"本を守るため、図書館には武器を持って戦う「図書隊」という組織がありました。",
"笠原郁は高校生のころ、どうしても読みたい本を取り上げられそうになったところを、一人の図書隊員に助けてもらいました。",
"郁はその人を「王子様」と呼び、自分も図書隊へ入ります。",
"ところが、そこで待っていた教官・堂上篤は、小さくて、きびしくて、いつも郁を怒ってばかり。",
"「こんな人、大きらい！」と思う郁でしたが、堂上が本気で自分を育てようとしていることに気づき、少しずつひかれていきます。",
"そして郁は知らないままですが、昔自分を助けてくれた「王子様」こそ堂上だったのです。",
"二人は本を守るため、何度も危険な任務へ向かいます。",
"やがて堂上が重傷を負い、郁は一人で大切な作家を守りながら逃げる大きな任務に挑みます。",
"郁は最後までやりとげ、堂上のもとへ帰ります。そして二人は、ようやくおたがいの気持ちをまっすぐ伝えられるようになります。",
"本編のその後を描く『別冊 図書館戦争 LOVE&WAR』では、二人は恋人として関係を深め、やがて結婚します。"
]},
{ cat:"m_sports", title:"ちはやふる plus きみがため", spine:"ちはやふる plus|きみがため", yomi:"ちはやふる プラス きみがため", sub:"末次由紀", author:"末次由紀", authorYomi:"すえつぐゆき", icon:"🎴", text:[
"千早、太一、新たちが高校を卒業したあとの世界。",
"瑞沢高校かるた部には、新しい生徒たちが入ってきます。",
"物語の中心になるのは、一年生の長良凛月です。",
"千早たちが作った強いかるた部には、全国大会で勝った歴史があります。",
"でも、先輩がすごかったからといって、新しい部員たちまで自動的に強いわけではありません。",
"凛月たちは、自分たちの力で「もう一度、全国へ行きたい」と練習を始めます。",
"かるたは、百人一首を覚えるだけではありません。",
"相手より早く札へ手を伸ばし、音を聞き、心を落ちつかせなければなりません。",
"新しい仲間、新しいライバル、そして前作から成長した千早たちも、ときどき物語に登場します。",
"凛月自身にも家族やかるたにまつわる思いがあり、試合を重ねながら、自分がなぜかるたをするのかを知っていきます。",
"2026年10月現在も連載中です。千早たちが残したものを受け取った次の世代が、「先輩のまね」ではなく、自分たちの瑞沢かるた部を作っていく途中です。"
]},
{ cat:"m_horror", title:"青野くんに触りたいから死にたい", spine:"青野くんに|触りたいから|死にたい", yomi:"あおのくんにさわりたいからしにたい", sub:"椎名うみ", author:"椎名うみ", authorYomi:"しいなうみ", icon:"👻", text:[
"刈谷優里は、あまり目立たない女子高校生です。",
"ある日、同じ学校の青野龍平に恋をして、思いきって告白します。",
"なんと青野も気持ちを受け入れてくれ、二人は恋人になります。",
"ところが、付き合い始めてたった二週間で、青野は事故で亡くなってしまいます。",
"泣きくずれる優里の前に、死んだはずの青野が幽霊になって現れます。",
"優里は大よろこびします。でも、幽霊の青野にはさわることができません。",
"しかも青野には、ときどき別人のように恐ろしい「黒い青野」が現れるようになります。",
"優里と友だちは、青野の死、町に残る昔からの風習、死者と生者をつなぐ不思議な力について調べます。",
"やがて優里と青野の恋は、二人だけの問題ではなく、町全体を巻きこむ大きな怪異につながっていきます。",
"最後の夜、優里は「助かりたければ青野を殺せ」と言われます。それでも優里にはできません。そして優里自身の命まで止まりかけます。",
"仲間たちは優里が残した言葉から、二人を救うための答えを探します。",
"最後まで、「死んでもずっと一緒にいれば幸せ」という簡単なお話にはなりません。二人は、生きている人と死んだ人には越えられない境目があることと向き合い、それでも出会って愛した時間を大切にします。",
"作品は2026年1月発売の第14巻で完結しました。"
]},
{ cat:"m_drama", title:"セクシー田中さん", yomi:"セクシーたなかさん", sub:"芦原妃名子", author:"芦原妃名子", authorYomi:"あしはらひなこ", icon:"💃", text:[
"倉橋朱里は二十三歳の会社員です。",
"若くてかわいく、男性からも声をかけられます。でも朱里は、「若くてかわいい自分には、いつか終わりが来る」とどこか不安に思っていました。",
"同じ会社には、田中京子という女性がいます。",
"田中さんは四十歳くらいで、まじめで、おとなしく、会社ではあまり目立ちません。",
"ところが朱里は、田中さんに大きな秘密があることを知ります。",
"夜になると田中さんは、ベリーダンサー「Sali」として、美しく堂々と踊っていたのです。",
"昼とはまるで別人のような田中さんを見て、朱里は「こんな生き方もあるんだ」と夢中になります。",
"田中さん自身は、自分にあまり自信がありません。でも踊っているときだけは、自分の体も人生も好きになれます。",
"朱里も田中さんと仲良くなり、男性にどう見られるかだけで自分の価値を決めるのを少しずつやめていきます。",
"田中さんにも、好きな人や、田中さんに近づこうとする男性が現れます。",
"けれどこの作品には、正式な最終回がありません。",
"作者の芦原妃名子さんが亡くなられたため、物語は第8巻までで未完となっています。田中さんや朱里たちが、これからどんな人生を選ぶはずだったのかは、描かれないまま残されています。"
]},
{ cat:"m_love", title:"後ハッピーマニア", yomi:"のちハッピーマニア", sub:"安野モヨコ", author:"安野モヨコ", authorYomi:"あんのもよこ", icon:"💍", text:[
"『ハッピー・マニア』から長い年月がたちました。",
"重田加代子、シゲカヨは四十五歳。",
"若いころ、あれほど「運命の男」を探し続けたシゲカヨは、高橋と結婚し、長い夫婦生活を送っていました。",
"ところがある日、高橋から「好きな人ができた。離婚したい」と言われます。",
"「えっ、今さら!?」。",
"若いころは自分が恋を追いかけて好き勝手していたシゲカヨですが、今度は自分が置いていかれる側になります。",
"家も、お金も、仕事も、これからの恋も考えなければなりません。",
"親友のフクちゃんにも自分の家庭があります。",
"シゲカヨは若い男性と出会ったり、昔の知り合いに心を動かされたりします。でも四十五歳の恋は、二十代のころと同じではありません。",
"「だれかに愛されれば幸せになれる」という考えだけでは、もう生きていけません。",
"シゲカヨは何度も失敗しながら、自分で働き、自分で生活し、自分で人生をおもしろくする方法を探します。",
"物語は2025年に完結しました。",
"きれいに「この人と結ばれて、めでたしめでたし」とはなりません。それでもシゲカヨは、まだ恋も仕事も人生もやめません。",
"「終わりだけど、まだ終わりじゃない」。そんなシゲカヨらしいところで物語は幕を閉じます。"
]},
{ cat:"m_love", title:"ハッピー・マニア", yomi:"ハッピーマニア", sub:"安野モヨコ", author:"安野モヨコ", authorYomi:"あんのもよこ", icon:"💘", text:[
"重田加代子、シゲカヨは、「本当の恋」を探している女性です。",
"「次こそ運命の人！」と思って男の人を好きになりますが、付き合ってみるとうまくいきません。",
"それでもシゲカヨは止まりません。",
"ふられれば次の人、いい男を見つければまた恋。失敗して泣いた次の日にも、新しい恋を探します。",
"そんなシゲカヨをずっと好きなのが、高橋という男性です。",
"高橋はシゲカヨにとても一途です。",
"普通なら「こんなに自分を好きな人がいるなら、その人でいいじゃない」と思います。",
"でもシゲカヨは、「追いかけられる恋」より「自分が夢中で追いかける恋」を求めてしまいます。",
"何人もの男性と出会い、何度も失敗し、ようやく高橋の大切さに気づいたかと思えば、また迷います。",
"そして最後には、高橋と結婚することになります。",
"ところがシゲカヨは結婚式の日になっても、心のどこかで「もっと恋がしたい！」と思っています。",
"結婚すれば急に別人になるわけではありません。",
"そんなシゲカヨのその後が、次の『後ハッピーマニア』へ続いていくのでした。"
]},
{ cat:"m_drama", title:"おんなのいえ", sub:"鳥飼茜", author:"鳥飼茜", authorYomi:"とりかいあかね", icon:"🏠", text:[
"有香は二十九歳。",
"長く一緒に暮らしていた恋人から、突然別れを告げられます。",
"「このまま結婚するんだろう」と思っていた生活が、一日でなくなってしまいました。",
"有香は大阪の実家へ戻りますが、ずっとそこにいるわけにもいきません。",
"やがて妹のすみ香と一緒に、東京で暮らすことになります。",
"姉妹だから何でもわかり合える、というわけではありません。",
"仕事、恋、母親との関係、結婚への考え方。二人はそれぞれちがいます。",
"有香は新しい男性と出会いますが、「今度こそ、この人に幸せにしてもらおう」と考えるだけではうまくいきません。",
"一方、妹の人生もどんどん変わっていきます。",
"やがてすみ香は子どもを授かり、自分の新しい暮らしへ進んでいきます。",
"有香もまた、「恋人がいる家」や「姉妹で暮らす家」に自分の人生を預けるのをやめます。",
"だれかがいなくなっても、自分の人生は続いていく。",
"有香が、自分ひとりでも立てる場所を見つけていく物語です。"
]},
{ cat:"m_art", title:"ジェリービーンズ", sub:"安野モヨコ", author:"安野モヨコ", authorYomi:"あんのもよこ", icon:"👗", text:[
"遠藤豆子、みんなから「マメ」と呼ばれる女の子は、洋服を作ることが大好きです。",
"田舎で暮らしていたマメは、雑誌やモデルの世界にあこがれています。",
"東京へ行ったマメは、きらきらしたファッションの世界に出会います。",
"かわいい服、かっこいいモデル、たくさんの人が夢を追いかけている場所。",
"「私も、自分の服を作りたい」。",
"マメは少しずつ、服を作る仕事へ近づいていきます。",
"もちろん、夢だけで生きていけるほど簡単ではありません。",
"恋をしたり、人と比べて落ちこんだり、自分の作ったものに自信がなくなったりします。",
"それでもマメは、「だれかにかわいいと言われるため」だけではなく、自分が本当に作りたい服を考えるようになります。",
"やがて自分のブランド「Jelly Beans」を育て、少女だったマメは、自分の感覚を仕事にする人へ変わっていきます。",
"恋より服を選ぶこともある。失敗しても、また作る。",
"自分の「好き」を信じて、大人になっていく女の子のお話です。"
]},
{ cat:"m_horror", title:"東京BABYLON", yomi:"とうきょうバビロン", sub:"CLAMP", author:"CLAMP", authorYomi:"くらんぷ", icon:"🌸", text:[
"皇昴流は、若い陰陽師です。",
"双子の姉・北都と一緒に東京で暮らし、霊や呪いに苦しむ人々を助けています。",
"昴流はとてもやさしく、自分よりも他人の苦しみを気にする少年です。",
"そんな姉弟と仲がよいのが、獣医の桜塚星史郎です。",
"星史郎はいつもにこにこしていて、「昴流くんが好きだよ」と冗談のように言います。",
"ところが星史郎には恐ろしい秘密がありました。",
"彼こそ、人を殺す陰陽師「桜塚護」だったのです。",
"子どものころの昴流は、星史郎とある賭けをしていました。",
"一年間一緒にいて、星史郎が昴流を大切だと思えなければ、昴流を殺す。",
"昴流はその記憶を封じられていたのです。",
"昴流は星史郎を本当に好きになります。しかし星史郎は、「自分には君も物も同じにしか見えない」と言います。",
"そして北都は、弟を守るため自分から星史郎の前へ行き、命を落とします。",
"大好きな姉を失った昴流は、それまでのやさしい少年のままではいられなくなります。",
"「いつか星史郎と決着をつける」。",
"そう決意した昴流の物語は、『X』へ続いていきます。"
]},
{ cat:"m_fantasy", title:"X", yomi:"エックス", sub:"CLAMP", author:"CLAMP", authorYomi:"くらんぷ", icon:"🐉", text:[
"司狼神威は、母を亡くし、六年ぶりに東京へ帰ってきます。",
"神威には、幼なじみの桃生封真と、その妹の小鳥がいました。",
"三人は昔、とても仲良しでした。",
"でも神威が東京へ戻ったころ、世界には大きな運命が近づいていました。",
"「天の龍」と「地の龍」という二つの勢力があり、世界の未来をかけて戦おうとしていたのです。",
"天の龍は、今いる人間たちの世界を守ろうとします。",
"地の龍は、人間によって傷つけられた地球を救うため、今の文明を壊そうとします。",
"そして神威は、そのどちらを選ぶか決めなければなりません。",
"神威は、小鳥や封真が暮らす世界を守るため、天の龍を選びます。",
"すると運命は、もう一人の「神威」を必要とし、親友だった封真が地の龍の神威へ変わってしまいます。",
"小鳥はその争いの中で命を落とし、神威は深く傷つきます。",
"その後、昴流と星史郎をはじめ、たくさんの人の運命も戦いへ巻きこまれます。",
"しかし、この漫画にはまだ正式な結末がありません。",
"長いあいだ連載が止まっており、神威と封真が最後にどんな答えを選ぶのかは、現在も描かれていません。"
]},
{ cat:"m_drama", title:"CLAMP学園探偵団", spine:"CLAMP学園|探偵団", yomi:"クランプがくえんたんていだん", sub:"CLAMP", author:"CLAMP", authorYomi:"くらんぷ", icon:"🔍", text:[
"CLAMP学園は、幼稚園から大学までそろった、とても大きな学校です。",
"そこにはお金持ちや天才など、さまざまな生徒が通っています。",
"小学生の妹之山残は、その学園の初等部生徒会長です。",
"残はとても頭がよく、女性が困っていると、どんな小さなことでも放っておけません。",
"残のそばには、冷静で剣術の得意な鷹村蘇芳と、料理も運動も得意な伊集院玲がいます。",
"三人は「女性の涙を見過ごさない」というような気持ちで、学園の中で起こる事件を調べます。",
"「大切なものがなくなった」「不思議な手紙が届いた」「だれかに困らされている」。",
"事件はありますが、こわい殺人事件ばかりではありません。",
"三人は頭のよさや行動力を使って、困っている人を助けます。",
"たまには自分たちが大さわぎを起こすこともあります。",
"大きな悲しい結末へ向かう作品ではなく、三人の少年たちが学園を走り回り、人助けを続ける、明るい探偵物語です。"
]},
{ cat:"m_fantasy", title:"魔法騎士レイアース", yomi:"まほうきしレイアース", sub:"CLAMP", author:"CLAMP", authorYomi:"くらんぷ", icon:"🗡️", text:[
"獅堂光、龍咲海、鳳凰寺風は、東京タワーで偶然出会った三人の少女です。",
"すると突然、三人は不思議な世界「セフィーロ」へ呼び出されます。",
"そこではエメロード姫が、神官ザガートに捕らえられていました。",
"「姫を助ければ、元の世界へ帰れる」。",
"そう聞いた三人は、魔法を覚え、「魔法騎士」となって旅をします。",
"仲間と出会い、魔神を手に入れ、ついにザガートを倒します。",
"「これで姫を助けられる！」。",
"ところが、そこで三人は本当のことを知ります。",
"セフィーロは、柱と呼ばれる一人の人間が、世界のためだけに祈り続けることで成り立つ国でした。",
"エメロード姫はザガートを愛してしまい、国のためだけに祈れなくなりました。",
"だからエメロード姫自身が、「自分を殺してほしい」と魔法騎士を呼んだのです。",
"三人は泣きながら姫を倒し、東京へ帰ります。",
"でも、「あんな仕組みはおかしい」と忘れられません。",
"再びセフィーロへ呼ばれた三人は、今度は国そのものの仕組みを変えるために戦います。",
"最後には、「一人だけが全部を背負う柱制度」をなくし、そこに暮らすみんなで未来を作る世界へ変えます。",
"三人の少女が、おとぎ話のような「姫を救う冒険」の裏にある悲しい真実を知り、その世界をもっとよい形へ変える物語です。"
]},
{ cat:"m_horror", title:"xxxHOLiC", yomi:"ホリック", sub:"CLAMP", author:"CLAMP", authorYomi:"くらんぷ", icon:"🦋", text:[
"四月一日君尋は、ふつうの高校生には見えないものが見えます。",
"幽霊やあやかしが見え、しかもなぜか近寄ってくるのです。",
"ある日、四月一日は不思議な店へ入りこみます。",
"店の主人は壱原侑子という女性でした。",
"侑子の店は、「どんな願いでも、同じだけの代価を払えばかなえる店」です。",
"四月一日は「あやかしが見えない体になりたい」と願います。その代価として、侑子の店で働くことになりました。",
"そこへ同級生の百目鬼や、四月一日が好きなひまわりも関わってきます。",
"四月一日はさまざまな客を見ます。",
"「願いをかなえてほしい」と言う人でも、本当は自分自身が変わらなければ救われないことがあります。",
"そして物語は『ツバサ』の世界とも深くつながっていきます。",
"やがて四月一日は、侑子自身が本来ならもうこの世にいないはずの存在だったことを知ります。",
"侑子は消え、四月一日は彼女の店を引き継ぎます。",
"四月一日は店から出ず、年もほとんど取らないまま、「いつか侑子さんにまた会える」と待ち続けます。",
"本編終了後も『xxxHOLiC・戻』で物語は続いています。"
]},
{ cat:"m_fantasy", title:"ツバサ-RESERVoir CHRoNiCLE-", spine:"ツバサ|-RESERVoir|CHRoNiCLE-", yomi:"ツバサ リザーバクロニクル", sub:"CLAMP", author:"CLAMP", authorYomi:"くらんぷ", icon:"🪶", text:[
"小狼は、砂の国で遺跡を調べている少年です。",
"幼なじみのサクラは、その国のお姫さま。",
"二人はおたがいを大切に思っていました。",
"ある日、サクラの記憶が「羽根」の形になって、いろいろな世界へ飛び散ってしまいます。",
"このままではサクラは死んでしまいます。",
"小狼はサクラを救うため、次元の魔女・侑子のもとへ行きます。",
"そこには黒鋼、ファイという別の世界から来た二人もいました。",
"四人とモコナは、たくさんの世界を旅して、サクラの記憶の羽根を集めます。",
"でも小狼には、つらい代価がありました。",
"サクラが記憶を取り戻しても、「小狼との思い出だけ」は戻らないのです。",
"さらに旅が進むと、小狼やサクラ自身にも大きな秘密があることがわかります。",
"「今まで旅をしていた小狼は何者なのか」「本当の小狼はどこにいたのか」。時間と世界をまたぐ、とても大きな仕組みが見えてきます。",
"すべてを動かしていたのは飛王・リードでした。",
"仲間たちは何度も別れ、失われ、それでも世界を守るため戦います。",
"最後には飛王を倒しますが、小狼は代価として、ひとつの世界にずっととどまることができなくなります。",
"小狼は黒鋼、ファイ、モコナと再び旅へ出ます。",
"サクラとは離れても、二人は自分たちの本当の名前「翼（ツバサ）」と気持ちを伝え合います。",
"「離れていても、必ずつながっている」。そんな約束を残して、旅は続いていきます。"
]},
{ cat:"m_sports", title:"ハチワンダイバー", sub:"柴田ヨクサル", author:"柴田ヨクサル", authorYomi:"しばたよくさる", icon:"♟️", text:[
"菅田健太郎は、プロ棋士を目指していました。",
"でも、プロになるための道から外れてしまい、夢を失います。",
"それでも将棋をやめられず、町の将棋道場でお金をかけて戦う「真剣師」になっていました。",
"そんな菅田が出会ったのが、中静そよです。",
"そよは普段、メイドの服を着て家のそうじなどをする仕事をしています。でも将棋盤の前に座ると、とんでもなく強い棋士でした。",
"菅田はそよに負け、「もっと強くなりたい」ともう一度思うようになります。",
"将棋盤は九×九、全部で八十一マス。",
"菅田は本気で将棋を読むとき、自分が盤の中へ潜っていくような感覚になります。",
"そのことから「ハチワンダイバー」と呼ばれるようになります。",
"菅田は、普通では考えられないほど強くて変わった真剣師たちと次々に戦います。",
"やがてそよや、その家族に関わる巨大な組織「鬼将会」との戦いへ進みます。",
"最後には、菅田は最強の男・谷生と、すべてをかけた将棋を指します。",
"建物が崩れていく中でも、二人は将棋をやめません。",
"菅田は死んだと思われますが、じつは生きており、のちにそよの前へ帰ってきます。",
"そして菅田はそよに「結婚してください」と伝えます。",
"二人は最後にまた将棋盤をはさんで向かい合います。",
"恋も人生も、結局は将棋と一緒。最後まで「将棋が大好きだ！」という勢いで終わる物語です。"
]},
{ cat:"m_sports", title:"月下の棋士", yomi:"げっかのきし", sub:"能條純一", author:"能條純一", authorYomi:"のうじょうじゅんいち", icon:"🌕", text:[
"氷室将介は、型破りな若い将棋指しです。",
"礼儀正しく静かに将棋を指す、という普通の棋士とはちがい、感情をむき出しにしながら盤へ向かいます。",
"でも、その将棋にはとてつもない才能がありました。",
"氷室は、将棋界のいちばん上にいる「名人」を目指します。",
"そこには、長いあいだ将棋を指してきたベテランや、天才と呼ばれる若者など、さまざまな棋士がいます。",
"将棋は頭だけの勝負に見えます。",
"でもこの物語では、一手に人生そのものをかけるような人たちがたくさん登場します。",
"勝てば次へ進み、負ければ夢が終わるかもしれない。",
"氷室はそんな世界で勝ち続け、やがて将棋界の頂点へ近づいていきます。",
"そして年月がたち、氷室自身が「名人」と呼ばれる存在になります。",
"最後には、また新しい若い棋士が氷室へ挑戦してきます。",
"昔は大人たちに挑む側だった氷室が、今度は若者から挑まれる側になる。",
"将棋の世界では、一人の天才が頂点へ立っても、次の天才がまた現れる。",
"そんな終わりのない勝負の世界を描いた物語です。"
]},
{ cat:"m_drama", title:"しおんの王", yomi:"しおんのおう", sub:"原作：かとりまさる　漫画：安藤慈朗", author:"かとりまさる／安藤慈朗", authorYomi:"かとりまさる", icon:"👑", text:[
"安岡紫音は、幼いころに両親を何者かに殺されました。",
"その事件のショックで、紫音は声を出せなくなってしまいます。",
"事件現場には、将棋の「王将」の駒が残されていました。",
"その後、紫音は将棋棋士の安岡夫妻に引き取られます。",
"新しい家族に愛されながら育った紫音は、自分も将棋の世界へ進んでいきます。",
"声は出せませんが、盤の前では自分の思いを駒にこめることができます。",
"紫音は、斉藤歩や二階堂沙織など、さまざまな棋士と出会い、強くなっていきます。",
"その一方で、昔の両親殺害事件も少しずつ動き始めます。",
"「犯人は将棋を知る人なのではないか」。",
"そしてついに、本当の犯人が名人・羽仁真であることがわかります。",
"羽仁は、幼い紫音に将棋の才能を感じ、「この子を将棋の鬼にしたい」という異常な考えから、紫音の人生を変えてしまったのです。",
"紫音は、すべてを思い出しながら、その羽仁と将棋盤の前で向き合います。",
"恐怖から逃げるのではなく、自分の将棋を指し続けます。",
"紫音にとって将棋は、両親を奪った事件につながるものでもありました。でも同時に、新しい家族や仲間と出会わせてくれたものでもあります。",
"最後には、過去に人生を決められるのではなく、自分自身の意思で棋士として未来へ進んでいくのでした。"
]},
{ cat:"m_drama", title:"哲也-雀聖と呼ばれた男", spine:"哲也|-雀聖と呼ばれた男", yomi:"てつや じゃんせいとよばれたおとこ", sub:"漫画：星野泰視　原案：さいふうめい", author:"星野泰視／さいふうめい", authorYomi:"ほしのやすし", icon:"🀄", text:[
"戦争が終わったばかりの日本。",
"町には食べものもお金も少なく、人々は必死に生きていました。",
"若い阿佐田哲也も、生きるために麻雀を打つようになります。",
"最初の哲也は、ただ少し麻雀がうまい若者でした。",
"でも、伝説的な勝負師・房州と出会います。",
"房州は哲也に、牌の読み方だけではなく、勝負の世界で生きる覚悟を教えます。",
"そこでは、みんなが正々堂々と戦うとは限りません。",
"牌をすり替えたり、仲間と合図したりする「玄人（ばいにん）」たちが、命や大金をかけて戦っています。",
"哲也は房州から技を学び、やがて「坊や哲」と呼ばれるようになります。",
"相棒のダンチとともに、新宿だけでなく日本各地を旅し、数えきれないほどの強敵と麻雀を打ちます。",
"勝つこともあれば、大切な人を失うこともあります。",
"哲也はしだいに、「ただ勝てばいい」のではなく、勝負師としてどう生きるのかを考えるようになります。",
"最後には、長い因縁を持つ強敵・ドサ健との大勝負へ向かいます。",
"戦後の何もない時代を麻雀ひとつで生きぬいた少年は、多くの勝負をこえて、「雀聖」と呼ばれるほどの男になっていくのでした。"
]},
{ cat:"m_drama", title:"むこうぶち", sub:"天獅子悦也", author:"天獅子悦也", authorYomi:"あまじしえつや", icon:"🀄", text:[
"バブル景気のころの東京。",
"夜になると、大金をかけた麻雀があちこちで行われていました。",
"そこへ、ときどき一人の男が現れます。",
"名前は「傀」。",
"どこから来たのか、何の仕事をしているのか、ほとんどだれも知りません。",
"傀は静かに席へ座り、麻雀を打ち始めます。",
"そして相手が負けを認めると、淡々と「御無礼」と言います。",
"傀の相手になるのは、お金持ちの社長、やくざ、プロの雀士、借金を抱えた人などさまざまです。",
"「絶対に勝って大金を手に入れたい」と欲ばる人もいます。",
"でも傀は、そうした人たちの心のすきや、勝負での小さな間違いを見逃しません。",
"この漫画には、普通の物語のような「主人公が修行してラスボスを倒す」という一本の道はありません。",
"毎回のように別の人が傀と出会い、その人の人生が麻雀によって大きく変わります。",
"傀自身は、勝っても大よろこびせず、負けた相手を笑うこともなく、また次の勝負へ消えていきます。",
"2026年10月現在も連載が続いており、単行本は66巻まで刊行されています。",
"傀とは本当は何者なのか。その答えは、まだすべて明かされていません。"
]},
{ cat:"m_sports", title:"咲-Saki-", yomi:"サキ", sub:"小林立", author:"小林立", authorYomi:"こばやしりつ", icon:"🀄", text:[
"宮永咲は、高校一年生の女の子です。咲の家では小さいころから家族で麻雀をしていましたが、勝ちすぎても怒られ、負ければお年玉を取られてしまいました。そのため咲は、いつのまにか「勝ちも負けもしない、ちょうどプラスマイナスゼロ」にする、とても変わった麻雀を覚えていました。",
"高校へ入った咲は、原村和という全国大会でも活躍した女の子と出会います。最初は「麻雀なんて好きじゃない」と言っていた咲でしたが、和と勝負するうちに、本当は麻雀が好きだったことに気づきます。",
"咲は清澄高校麻雀部へ入り、部長の竹井久、染谷まこ、片岡優希、和と五人で全国大会を目指します。",
"県大会には、強い選手がたくさんいました。それでも咲たちは力を合わせ、全国大会へ進みます。",
"咲には、全国でも最強と呼ばれる姉・宮永照がいます。昔、家族に何かが起こってから、姉妹の心は離れてしまいました。",
"咲は麻雀で日本一を目指すと同時に、いつか照ともう一度きちんと向き合いたいと思っています。",
"2026年10月現在も物語は続いており、咲たちは全国の強豪たちと大きな大会を戦い続けています。"
]},
{ cat:"m_sports", title:"ノーマーク爆牌党", yomi:"ノーマークばくはいとう", sub:"片山まさゆき", author:"片山まさゆき", authorYomi:"かたやままさゆき", icon:"🀄", text:[
"鉄壁保は、相手に点を取らせない「守り」がとても得意な麻雀打ちです。",
"ある日、鉄壁は雀荘「ドラ道楽」で、爆岡弾十郎という不思議な男と出会います。",
"爆岡には、「爆牌」と呼ばれる恐ろしい打ち方がありました。",
"相手の手の中まで見えているかのように牌を捨て、気づいたときには自分だけが大きく勝っています。",
"鉄壁のほかにも、大きな役を狙う当大介や、点数を上手に増やす九蓮宝燈美など、個性的な仲間たちがプロの世界へ進みます。",
"その中でも爆岡はあっという間に強くなり、いくつもの大きなタイトルを取ってしまいます。",
"鉄壁は何度戦っても爆岡に負けます。",
"それでもあきらめず、「どうしてあの人には人の牌がわかるのだろう」と考え続けました。",
"やがて鉄壁は、爆岡の麻雀が魔法ではなく、相手の考え方を何手も先まで読んだ、とても高度な勝負なのだと近づいていきます。",
"そして最後の大きな大会で、鉄壁、大介、茶柱、八崎、爆岡が集まります。",
"最終局では、鉄壁と爆岡が長いライバル関係のすべてをかけて向かい合います。",
"「天才に勝つには、自分も天才でなければならないのか」。",
"そうではありません。",
"鉄壁は、何度負けても考え続けた自分の麻雀で、最後まで爆岡へ食らいつき、二人の長い勝負に決着をつけるのでした。"
]},
{ cat:"m_drama", title:"哭きの竜", yomi:"なきのりゅう", sub:"能條純一", author:"能條純一", authorYomi:"のうじょうじゅんいち", icon:"🐉", text:[
"竜という男は、麻雀を打つとき、ほとんど表情を変えません。",
"どこの組にいるのか、どこから来たのかも、よくわかりません。",
"ただひとつ有名なのは、竜がとても強いことです。",
"竜は「哭き」と呼ばれる、ほかの人が捨てた牌を使う打ち方をよくします。",
"そして、相手の心が弱くなったところを見ぬくように、静かに勝っていきます。",
"竜のいる麻雀卓には、やくざの親分や、命をかけて勝負をする男たちが集まってきます。",
"「竜を味方にすれば、自分たちが勝てる」。",
"そう考える人もいます。",
"けれど竜は、だれかのものにはなりません。",
"大きな組同士の争いにも巻きこまれますが、竜が見ているのは、目の前の牌と勝負だけです。",
"竜と勝負した男たちは、自分の欲や弱さを見せつけられ、ある者は負け、ある者は人生まで変わってしまいます。",
"それでも竜は、勝ったことを自慢しません。",
"勝負が終われば、また静かに次の卓へ向かいます。",
"最後まで竜が何者なのかは、すべて説明されません。",
"だからこそ竜は、「どこかに本当にいそうな、伝説の麻雀打ち」として人々の記憶に残るのでした。"
]},
{ cat:"m_baseball", title:"ONE OUTS", yomi:"ワンナウツ", sub:"甲斐谷忍", author:"甲斐谷忍", authorYomi:"かいたにしのぶ", icon:"⚾", text:[
"児島弘道は、長年プロ野球で活躍してきたすごい打者です。",
"けれど、どうしても優勝だけはできません。",
"「どうしたら勝てるんだ」。",
"そんな児島が沖縄で出会ったのが、渡久地東亜という男でした。",
"渡久地は、野球の投手なのに、ものすごく速い球を投げるわけではありません。",
"それでも、人の心を読む力がずばぬけていました。",
"相手が「次は何が来る」と考えているのかを読み、心理戦だけで打者を打ち取ります。",
"児島は渡久地を弱小球団リカオンズへ連れていきます。",
"ところが球団のオーナーは、お金のことしか考えていません。",
"そこで渡久地は「アウトを一つ取れば五百万円。でも点を取られたら五千万円払う」という、とんでもない契約を結びます。",
"オーナーは「これなら渡久地からお金を取れる」と思います。",
"でも渡久地は、野球のルール、相手の作戦、人の欲まで利用して、どんどん勝っていきます。",
"やがて渡久地は、選手だけでなく、チームを食い物にするオーナーそのものと戦います。",
"そして万年弱かったリカオンズは、本当に優勝を争うチームへ変わっていきます。",
"最後にはリカオンズは日本一になります。",
"力だけではなく、「どうすれば相手がそう動くのか」を考え続ける男が、チーム全体を変えてしまう野球のお話です。"
]},
{ cat:"m_sports", title:"風の大地", yomi:"かぜのだいち", sub:"原作：坂田信弘　作画：かざま鋭二", author:"坂田信弘／かざま鋭二", authorYomi:"さかたのぶひろ", icon:"⛳", text:[
"沖田圭介は、二十四歳になってからプロゴルファーを目指した青年です。",
"ゴルフ選手としては、かなり遅いスタートでした。",
"沖田は鹿沼カントリークラブで働きながら、毎日毎日ボールを打ちます。",
"ほかの人より遅く始めたのだから、人よりたくさん考え、人よりたくさん練習しなければなりません。",
"やがて沖田はプロテストに合格します。",
"日本の大会へ出るようになると、自分より強い選手が次々と現れます。",
"勝てそうで勝てない試合もあります。",
"大切な人との別れもあります。",
"それでも沖田は、勝ったからえらい、負けたから終わり、とは考えません。",
"一打一打に、自分がこれまで生きてきた時間をこめるようにゴルフをします。",
"沖田の舞台はやがて日本から世界へ広がり、ゴルフの聖地セント・アンドリュースなど、大きな大会へ挑んでいきます。",
"しかし物語は、沖田のゴルフ人生を最後まで描いて完結したわけではありません。",
"作画を担当したかざま鋭二さんが2022年に亡くなり、残されていた最後の原稿が掲載されたところで物語は終わりました。沖田は最後まで、世界の頂点を目指してコースを歩き続けていました。"
]},
{ cat:"m_sports", title:"黄金のラフ〜草太のスタンス〜", spine:"黄金のラフ|〜草太のスタンス〜", yomi:"おうごんのラフ そうたのスタンス", sub:"なかいま強", author:"なかいま強", authorYomi:"なかいまつよし", icon:"⛳", text:[
"藤本草太は、ものすごい力を持ったプロゴルファーです。",
"遠くへ飛ばす力なら一流です。",
"ところが草太には大きな弱点がありました。",
"「いつでもすごい一打を打ちたい！」と思ってしまうため、無茶ばかりして、なかなか試合に勝てないのです。",
"そんな草太の前に、谷田部光一と太子治という二人が現れます。",
"谷田部はゴルフの理論をよく知っていますが、体がついていきません。",
"太子はコースを読むのが得意ですが、大事なところで緊張してしまいます。",
"三人とも、一人ではどこか足りません。",
"そこで三人は「チームきりたんぽ」を作ります。",
"谷田部が作戦を考え、太子がコースを読み、草太が思いきりボールを打つのです。",
"三人は日本の大会から、ついにはアメリカのPGAツアーまで挑戦します。",
"草太は相変わらず無茶をして、仲間を何度も困らせます。",
"でも、その無茶が奇跡のような一打を生むこともあります。",
"世界の強豪たちと戦う中で、三人は「足りないところがあるからこそ、仲間が必要なのだ」と知っていきます。",
"最後まで笑いながら、三人は世界の大舞台で自分たちらしいゴルフを貫きます。",
"一人なら弱点だらけでも、三人ならとんでもなく強い。そんな楽しいゴルフ漫画です。"
]},
{ cat:"m_sports", title:"DAN DOH!!", yomi:"ダンドー", sub:"原作：坂田信弘　作画：万乗大智", author:"坂田信弘／万乗大智", authorYomi:"さかたのぶひろ", icon:"🏌️", text:[
"青葉弾道、みんなからダンドーと呼ばれる少年は、もともと野球が大好きでした。",
"ある日、ダンドーはプロゴルファーだった新庄樹靖と出会います。",
"ゴルフボールを遠くへ飛ばす楽しさを知ったダンドーは、仲間の優香たちといっしょに、ゴルフを始めます。",
"最初はルールもよく知りません。",
"でもダンドーには、まっすぐで、人の言葉をすなおに聞き、失敗しても何度でも挑戦する強さがありました。",
"新庄から教わりながら、ダンドーはジュニア大会へ出るようになります。",
"そこでは、子どもとは思えないほど上手な選手たちが待っています。",
"ダンドーは負けるたびに何かを学びます。",
"やがて日本だけでなく、アジアの選手とも戦うようになり、少しずつ大きなゴルファーへ近づいていきます。",
"ところが師匠の新庄には、重い病気がありました。",
"新庄は自分の時間が長くないことを知りながら、ダンドーたちへゴルフを教え続けます。",
"そして最後には、残された時間をゴルフに使うため、海外へ旅立ちます。",
"ダンドーは、大切な先生の思いを受けつぎ、さらに広い世界へ挑戦していきます。",
"この物語の先は『DAN DOH!! Xi』『DAN DOH!! ネクストジェネレーション』へ続いていきます。"
]},
{ cat:"m_sports", title:"ライジングインパクト", sub:"鈴木央", author:"鈴木央", authorYomi:"すずきなかば", icon:"🏌️", text:[
"七海ガウェインは、山の中でおじいさんと暮らす元気な少年です。",
"ある日、女子プロゴルファーの西野霧亜が、ガウェインが野球のボールをものすごく遠くへ飛ばすところを見ます。",
"「この子なら、ゴルフでもすごい球を打てるかもしれない」。",
"こうしてガウェインは、ゴルフと出会います。",
"ガウェインには、ボールをまっすぐ遠くへ飛ばす特別な感覚がありました。",
"それは「ライジングインパクト」と呼ばれます。",
"もっとゴルフがうまくなりたいガウェインは、名門キャメロット学院へ入ります。",
"そこには、パットの道が光って見えるランスロットや、何でもできる天才トリスタンなど、とても強い選手がいました。",
"ガウェインは、日本代表として海外の学校との大会にも挑みます。",
"勝つことに夢中になるあまり、こわいほど力を求めてしまうこともあります。",
"大きなけがをして、ゴルフを続けられるかわからなくなることもあります。",
"それでも仲間たちに支えられ、ガウェインは「だれかより強くなるため」だけではなく、「自分がゴルフを好きだから打つ」ことを思い出します。",
"最後には年月が流れ、ガウェインたちは大人になります。",
"少年だった選手たちは世界で活躍するゴルファーとなり、その夢は次の世代へもつながっていくのでした。"
]},
{ cat:"m_battle", title:"銀牙 -流れ星 銀-", spine:"銀牙|-流れ星 銀-", yomi:"ぎんが ながれぼしぎん", sub:"高橋よしひろ", author:"高橋よしひろ", authorYomi:"たかはしよしひろ", icon:"🐕", text:[
"雪深い山の近くで、一匹の秋田犬が生まれました。",
"名前は銀。",
"銀の住む山には、「赤カブト」と呼ばれる、とても大きくて恐ろしいヒグマがいました。",
"赤カブトは人や犬を何度もおそっています。",
"銀の父・リキも赤カブトと戦い、行方がわからなくなっていました。",
"銀は猟師の竹田五兵衛から熊と戦う方法を教わります。",
"やがて山の中で、赤カブトを倒すために集まった野犬たちと出会います。",
"銀は人間の家を離れ、日本中を旅しながら強い犬たちを仲間にしていきます。",
"最初は小さな子犬だった銀も、仲間を守るうちに立派な戦士へ成長します。",
"そして銀は、死んだと思われていた父リキとも再会します。",
"日本中から集まった犬たちは、ついに赤カブトのいる山へ攻めこみます。",
"激しい戦いの中で、多くの仲間が傷つき、リキも命を落とします。",
"銀は父から受けついだ技を使い、ついに赤カブトを倒します。",
"その後も銀たちには、新たな敵との戦いが待っています。",
"それらを乗りこえた銀は、父のあとを継ぎ、仲間たちを導く大きなリーダーになっていくのでした。"
]},
{ cat:"m_work", title:"じゃじゃ馬グルーミン★UP!", spine:"じゃじゃ馬|グルーミン★UP!", yomi:"じゃじゃうまグルーミンアップ", sub:"ゆうきまさみ", author:"ゆうきまさみ", authorYomi:"ゆうきまさみ", icon:"🐴", text:[
"久世駿平は、東京で暮らす高校生です。",
"ある夏、家族とうまくいかなくなった駿平は、自転車で北海道へやってきます。",
"そこで道に迷い、渡会牧場という競走馬を育てる牧場にたどり着きました。",
"牧場には、渡会ひびきという元気な女の子がいました。",
"最初は馬のことなど何も知らなかった駿平ですが、子馬が生まれるところを見たり、病気の馬を心配したり、競走馬がレースで走る姿を見たりするうちに、少しずつ馬が大好きになります。",
"牧場では、どんなにかわいがった馬でも、必ず強い競走馬になれるわけではありません。",
"けがをする馬もいます。",
"売られて別の牧場へ行く馬もいます。",
"それでも人々は、また次の命を育てます。",
"駿平も、ただ遊びに来た少年ではなく、馬の命に責任を持つ大人へ近づいていきます。",
"そして駿平は、ひびきを好きになります。",
"二人はけんかをしながらも気持ちを育て、やがて結婚します。",
"ひびきには子どもが生まれ、駿平も父親になります。",
"物語の最後は十五年後。",
"子どもたちも成長し、昔育てた馬の血も次の世代へ受けつがれています。",
"人も馬も、命を次へつないでいく牧場の物語です。"
]},
{ cat:"m_sports", title:"風のシルフィード", yomi:"かぜのシルフィード", sub:"本島幸久", author:"本島幸久", authorYomi:"もとじまゆきひさ", icon:"🏇", text:[
"森川駿の家は、小さな牧場をしています。",
"ある日、名馬サザンウインドが一頭の子馬を産みます。",
"けれど母馬は出産で死に、生まれた子馬には足に大きな問題がありました。",
"「競走馬にはなれない」。",
"そう言われますが、駿は「この子を殺さないで！」と必死に守ります。",
"子馬はシルフィードと名づけられました。",
"駿の世話を受け、シルフィードは少しずつ強くなります。",
"やがて駿も騎手となり、二人でレースを走るようになります。",
"大きなライバルは、天才騎手・夕貴潤と名馬マキシマムです。",
"ダービー、菊花賞、天皇賞。",
"シルフィードは何度も限界をこえながら走り、ついにはフランスの凱旋門賞へ挑みます。",
"そのころシルフィードは、片方の目が見えなくなるほど大きな傷を負っていました。",
"それでも駿を信じて走り、世界の強豪をおさえて凱旋門賞に勝ちます。",
"駿は「もう十分がんばった」と考え、シルフィードを引退させます。",
"ところがその後、シルフィードは思いがけない事故で命を落としてしまいます。",
"駿は深く悲しみ、競馬から離れます。",
"しかしシルフィードの子どもたちが生まれたことで、命は終わったのではなく、次へつながったのだと知ります。",
"最後には、成長したシルフィードの子に乗る駿の姿が描かれ、父ができなかった夢へ、次の世代が走り始めるのでした。"
]},
{ cat:"m_sports", title:"優駿の門", yomi:"ゆうしゅんのもん", sub:"やまさき拓味", author:"やまさき拓味", authorYomi:"やまさきたくみ", icon:"🐎", text:[
"光優馬は、馬が大好きな少年です。",
"優馬には、人間の言葉ではなく、馬の気持ちを感じ取るような不思議な力がありました。",
"優馬は騎手となり、いろいろな競走馬に乗ります。",
"その中でも大きな存在になるのが、ボムクレイジーという馬です。",
"ボムクレイジーは力はあるのに、気性がとても激しく、普通の人にはなかなか扱えません。",
"でも優馬は、「この馬は悪い馬なんじゃない。ちゃんと理由があるんだ」と向き合います。",
"競馬の世界では、速い馬だけが幸せになれるわけではありません。",
"けがをすれば走れなくなります。",
"人間の都合で馬の未来が決められることもあります。",
"優馬はレースに勝つことだけではなく、「馬にとって何が一番いいのか」を考えながら騎手として成長していきます。",
"たくさんの馬や騎手と出会い、大きなレースへ挑むうち、優馬自身も「天才少年」から、一頭一頭の命を背負う騎手へ変わっていきます。",
"そしてボムクレイジーたちとの挑戦を通して、競馬は人間だけの夢ではなく、馬と人がいっしょに作るものなのだと知るのでした。",
"物語はその後も『優駿の門』シリーズとして、次の馬や次の世代へ続いていきます。"
]},
{ cat:"m_sports", title:"ありゃ馬こりゃ馬", yomi:"ありゃうまこりゃうま", sub:"原作：田原成貴　作画：土田世紀", author:"田原成貴／土田世紀", authorYomi:"たはらせいき", icon:"🏇", text:[
"氷室翔は、競馬の騎手です。",
"でも物語のはじめの氷室は、とても立派な騎手とは言えません。",
"お酒を飲んだり、遊んだり、勝負でもいいかげんなところがあり、「B級ジョッキー」と呼ばれていました。",
"ところが氷室には、本当は馬に乗る才能がありました。",
"そんな氷室が、シンケンという競走馬と出会います。",
"シンケンは強い馬でした。",
"氷室はこの馬と大きなレースを目指すうちに、「今までみたいな気持ちでは、この馬に失礼だ」と思うようになります。",
"競馬には、騎手同士のかけひきもあります。",
"相手の進路をふさいだり、ぎりぎりのところでしかけたり、ほんの一瞬の判断が勝ち負けを変えます。",
"氷室は失敗し、怒られ、負けながらも、少しずつ本物の騎手へ成長していきます。",
"そして最後の大舞台は、日本ダービーです。",
"氷室とシンケンは、ホクトオー、ファイアスター、セルピコなどの強い馬と、最後まで力いっぱい走ります。",
"かつては何をしても中途半端だった氷室は、とうとう自分のすべてを一頭の馬と一つのレースにかけられる騎手になります。",
"「だめな大人でも、本気になれば変われる」。そんな競馬のお話です。"
]},
{ cat:"m_fight", title:"六三四の剣", yomi:"むさしのけん", sub:"村上もとか", author:"村上もとか", authorYomi:"むらかみもとか", icon:"🗡️", text:[
"六月三日の午後四時。",
"剣道が大好きな夫婦のもとに、男の子が生まれました。",
"そこで両親は、「六三四」と書いて「むさし」と名づけます。",
"宮本武蔵のような立派な剣士になってほしいという願いからでした。",
"六三四は、小さいころから竹刀を持って育ちます。",
"泣いても転んでも、また立ち上がって剣道をします。",
"そんな六三四の大きなライバルになるのが、奈良の少年・東堂修羅です。",
"六三四が力いっぱい前へ出る剣なら、修羅は冷静で美しい剣。",
"二人は子どものころから何度も戦い、勝ったり負けたりしながら大きくなります。",
"途中で六三四は、大切な父を亡くします。",
"悲しみにくれますが、父が教えてくれた剣道をやめません。",
"高校生になった六三四は、全国をまわってさまざまな剣士と戦い、さらに強くなります。",
"そして最後の大きな大会で、六三四と修羅は再び向かい合います。",
"長い年月をかけて強くなった二人の、最後の一戦です。",
"六三四は勝利し、日本一になります。",
"でも、勝ったから修羅がいなくなるわけではありません。",
"二人は最高のライバルであり、同じ剣の道を歩く友だちとして、これからも成長していくのでした。"
]},
{ cat:"m_fight", title:"もういっぽん!", sub:"村岡ユウ", author:"村岡ユウ", authorYomi:"むらおかゆう", icon:"🥋", text:[
"園田未知は、中学生のころ柔道をしていました。",
"最後の大会では、相手にきれいに一本を取られて負けてしまいます。",
"「高校では、もう柔道はやめよう」。",
"未知はそう決めていました。",
"ところが高校へ行くと、中学最後の試合で自分を負かした氷浦永遠と再会します。",
"さらに幼なじみの早苗も柔道を続けると言います。",
"「じゃあ、もういっぽんだけやってみようかな」。",
"こうして未知は、青葉西高校の柔道部へ入ります。",
"未知はとびぬけた天才ではありません。",
"でも柔道をすると、とても楽しそうに笑います。",
"その明るさに引っぱられて、仲間も少しずつ増えていきます。",
"強豪校と戦えば、負けることもたくさんあります。",
"それでも「負けたから終わり」ではありません。",
"投げられたら、また立つ。",
"そして「次はもう一本」と前へ出ます。",
"学年が上がると後輩も入り、未知たちは先輩になっていきます。",
"大会や合宿を重ねながら、それぞれが自分の柔道を見つけます。",
"最後には高校生活にも終わりが近づきます。",
"柔道をやめるつもりだった未知は、気づけば「柔道をやっていてよかった」と思えるほど、たくさんの仲間と思い出を手に入れていました。",
"一本取ることより、何度でも立ち上がることの大切さを描いた物語です。"
]},
{ cat:"m_baseball", title:"バトルスタディーズ", sub:"なきぼくろ", author:"なきぼくろ", authorYomi:"なきぼくろ", icon:"⚾", text:[
"狩野笑太郎は、野球が大好きな少年です。",
"笑太郎は、中学野球で活躍し、高校野球の名門・DL学園へ入ります。",
"「甲子園へ行って、スターになるぞ！」。",
"胸をおどらせて入部した笑太郎ですが、名門校の生活は想像以上にきびしいものでした。",
"一年生には細かい決まりがあり、先輩の世話をし、そうじをし、野球以外のことまで全部覚えなければなりません。",
"もちろん練習もたいへんです。",
"野球がうまいだけでは、試合には出られません。",
"仲間との関係、先輩と後輩、監督との考え方のちがいなど、いろいろなことに悩みます。",
"笑太郎たちは、一度は甲子園で大きな経験をし、さらに上の学年になると、今度は自分たちが後輩を教える側になります。",
"「昔からこうだから」という決まりを、そのまま次へ渡していいのか。",
"強いチームになるとは、どういうことなのか。",
"笑太郎は野球だけでなく、組織の中で人を引っぱることも学んでいきます。",
"三年生となった笑太郎たちは再び甲子園への切符をつかみ、2026年現在は「最後の甲子園」へ挑んでいるところです。"
]},
{ cat:"m_baseball", title:"ストッパー毒島", yomi:"ストッパーぶすじま", sub:"ハロルド作石", author:"ハロルド作石", authorYomi:"はろるどさくいし", icon:"⚾", text:[
"毒島大広は、ものすごく速い球を投げられる男です。",
"でも中学時代にけんかを起こしたため、高校では野球部に入れませんでした。",
"普通なら、そのまま野球をあきらめてしまいそうです。",
"ところがプロ野球の弱小球団・京浜アスレチックスが、そんな毒島をドラフトで取ります。",
"最初の毒島は、まだ荒っぽく、プロの世界にも慣れていません。",
"けれど、すごい速球と不思議な変化球を武器に、少しずつ一軍で投げるようになります。",
"アスレチックスは長いあいだ弱いチームでした。",
"スター選手も少なく、「どうせ今年もだめだろう」と思われています。",
"でも毒島や仲間たちは、少しずつ勝ち始めます。",
"野球がうまくいかなかった選手、年をとった選手、もう一度やり直したい選手。",
"そんな人たちが集まり、本当に優勝をねらえるチームになっていきます。",
"最後の試合では、優勝をかけた大一番で毒島がマウンドへ上がります。",
"そこには、長い因縁を持つ兄との勝負も待っていました。",
"高校では一試合も投げられなかった男が、最後にはプロ野球の優勝を背負う投手になる。",
"野球選手は、どこからでもやり直せるのだと感じさせる物語です。"
]},
{ cat:"m_baseball", title:"やったろうじゃん!!", sub:"原秀則", author:"原秀則", authorYomi:"はらひでのり", icon:"⚾", text:[
"喜多条は、朝霧学園高校の野球部をまかされた監督です。",
"朝霧学園は、最初から全国一の強豪というわけではありません。",
"でも喜多条は、「甲子園へ行こう」と選手たちに本気で向き合います。",
"チームの中心になるのが、投手の江崎です。",
"江崎には大きな才能があります。",
"けれど高校生ですから、いつでも強い心でいられるわけではありません。",
"勝てないときには落ちこみます。",
"自分のせいで負けたと思えば、自分を責めます。",
"喜多条は、そんな江崎や仲間たちを怒鳴るだけではなく、「どうすれば自分の力を出せるのか」を考えさせます。",
"朝霧学園は少しずつ強くなり、ついには甲子園へ進みます。",
"一度大きな舞台へ行けば終わりではありません。",
"次の年にも新しい問題が起こります。",
"江崎自身も一度大きくつまずきますが、もう一度立ち直ります。",
"そして朝霧学園は二年続けて甲子園へ出場します。",
"最後には、選手たちは高校野球の時間を終え、それぞれの未来へ進みます。",
"勝った試合だけでなく、失敗した試合や泣いた日も、全部が青春だったのだとわかる野球漫画です。"
]},
{ cat:"m_baseball", title:"クロカン", sub:"三田紀房", author:"三田紀房", authorYomi:"みたのりふさ", icon:"🧢", text:[
"黒木竜次は、高校野球の監督です。",
"みんなから「クロカン」と呼ばれています。",
"クロカンは、ふつうの監督とは少しちがいます。",
"きれいな言葉で選手をほめてばかりではありません。",
"ときには変わった練習をさせ、ときには試合でだれも考えない作戦を使います。",
"「選手は、自分で考えなければ強くならない」。",
"それがクロカンの考えです。",
"最初は母校の桐野高校を指導していましたが、まわりの大人とぶつかり、学校を離れることになります。",
"その後、クロカンは山の中にある弱小の鷲ノ森高校を率いることになります。",
"選手は少なく、設備も立派ではありません。",
"それでもクロカンは、選手一人一人の長所を見つけます。",
"足の速い者には足を使わせ、考えるのが得意な者には試合を読ませます。",
"こうして弱かったチームが、だんだん強豪校と戦えるようになります。",
"この漫画の主人公は、ホームランを打つ高校生ではなく、ベンチから選手を動かす監督です。",
"「勝つためには、何を教えるべきか」。",
"「人を育てるとはどういうことか」。",
"クロカンは何度も失敗しながら、自分なりの答えを探し続けるのでした。"
]},
{ cat:"m_baseball", title:"MIX", yomi:"ミックス", sub:"あだち充", author:"あだち充", authorYomi:"あだちみつる", icon:"⚾", text:[
"立花投馬と立花走一郎は、同じ年の兄弟です。",
"でも二人には血のつながりがありません。",
"親どうしが再婚したため家族になり、妹の音美と三人で暮らしています。",
"二人が通うのは、明青学園。",
"昔、『タッチ』の上杉達也たちが甲子園へ行った学校です。",
"でもそれから長い年月がたち、野球部は昔ほど強くなくなっていました。",
"投馬は、とても速い球を投げる投手。",
"走一郎は、その球を受ける頭のいい捕手です。",
"二人はバッテリーを組み、「もう一度、明青を甲子園へ連れていこう」と戦います。",
"野球だけでなく、投馬と走一郎の本当の両親のこと、家族の過去、音美との関係なども少しずつ明らかになります。",
"春や夏の大会では、あと少しのところで負けることもあります。",
"大切な人との突然の別れも起こります。",
"それでも兄弟は、またボールを持ってグラウンドへ戻ります。",
"2026年現在も連載中で、投馬のけがなど新しい問題を抱えながら、明青学園はもう一度甲子園を目指しています。"
]},
{ cat:"m_fight", title:"KATSU!", yomi:"カツ", sub:"あだち充", author:"あだち充", authorYomi:"あだちみつる", icon:"🥊", text:[
"里山活樹は、高校生の男の子です。",
"活樹は、同じ学校の水谷香月という女の子が気になっていました。",
"香月の家はボクシングジムをやっています。",
"「香月に近づけるかも」。",
"そんな少し軽い気持ちから、活樹もボクシングを始めます。",
"ところが、活樹には自分でも知らなかった大きな才能がありました。",
"パンチは強く、試合をするたびにどんどん成長します。",
"一方、香月もとても強いボクサーです。",
"ただ、女の子が試合に出られる場所は、男の子ほど多くありません。",
"二人は「ボクシングが好き」という同じ気持ちを持ちながら、それぞれちがう壁にぶつかります。",
"さらに活樹は、自分の父親や、昔のボクサーたちにまつわる秘密を知っていきます。",
"「自分の強さは、どこから来たのだろう」。",
"そんなことも考えるようになります。",
"終盤では、仲間の事件や大切な試合が続きます。",
"最後には活樹が岬という強い相手とリングに上がり、これまで積み重ねてきたものを全部ぶつけます。",
"恋もボクシングも、「勝ったら全部終わり」ではありません。",
"活樹と香月は、それぞれ自分の道を歩きながら、これからもボクシングと向き合っていくのでした。"
]},
{ cat:"m_sports", title:"ラフ", sub:"あだち充", author:"あだち充", authorYomi:"あだちみつる", icon:"🏊", text:[
"大和圭介は、競泳をしている高校生です。",
"二ノ宮亜美は、飛び込み競技をしています。",
"二人の家は、どちらも昔から和菓子屋をやっていました。",
"ところが、家どうしには長いあいだ「どちらが本家の味なのか」という争いがあります。",
"そのため圭介と亜美も、最初は会うたびに言い合いをします。",
"ところが二人は同じ学校の水泳部に入り、毎日のように顔を合わせることになります。",
"圭介は競泳で日本一を目指します。",
"亜美も飛び込みで上を目指します。",
"練習や大会をいっしょに過ごすうちに、「嫌いな家の子」だった相手が、少しずつ大切な人へ変わっていきます。",
"しかし亜美には、昔から憧れている緒方という水泳選手がいます。",
"圭介もまた、恋よりもまず泳ぐことに向き合わなければなりません。",
"やがて圭介と緒方は、水泳で正面から勝負することになります。",
"亜美は、だれを大切に思っているのか、自分の気持ちを選びます。",
"最後に圭介のもとへ届くのは、亜美からの「好き」という答えです。",
"水の中では競い合い、陸の上ではすれちがってばかりだった二人が、ようやく同じ方向を向くのでした。全12巻で完結しています。"
]},
{ cat:"m_baseball", title:"クロスゲーム", sub:"あだち充", author:"あだち充", authorYomi:"あだちみつる", icon:"⚾", text:[
"樹多村光は、スポーツ用品店の家の男の子です。",
"となりには、月島家の四人姉妹が住んでいました。",
"その中の次女・若葉は、光と同じ日に生まれた幼なじみです。",
"若葉は光が大好きで、「いつか光が甲子園で投げている夢を見た」と話します。",
"ところが小学生の夏、若葉は事故で亡くなってしまいます。",
"光は深く悲しみます。",
"でも若葉の妹・青葉が一生懸命野球をする姿を見て、光も本気で野球を始めます。",
"青葉は女の子ですが、投手としてとても強い選手です。",
"光と青葉は会えばけんかばかり。",
"それでも二人は、おたがいがどれだけ野球を大切にしているかをよく知っています。",
"高校生になると、光は星秀学園のエースになります。",
"「若葉が夢に見た、満員の甲子園へ行く」。",
"それが光たちの目標です。",
"最後の夏、星秀学園は強豪・竜旺学院との決勝へ進みます。",
"試合は延長になるほどの大接戦。",
"光たちはついに勝ち、甲子園への切符をつかみます。",
"そして光と青葉も、ずっと言葉にできなかった気持ちを少しずつ認めます。",
"亡くなった若葉の夢を胸に持ちながら、二人は自分たちの未来へ進んでいくのでした。"
]},
{ cat:"m_fight", title:"拳児", yomi:"けんじ", sub:"原作：松田隆智　作画：藤原芳秀", author:"松田隆智／藤原芳秀", authorYomi:"まつだりゅうち", icon:"👊", text:[
"剛拳児は、小さいころからけんかっ早い少年です。",
"でも、おじいちゃんから中国拳法の八極拳を教わり、ただ人を殴るだけではない「武術」の世界を知ります。",
"八極拳は、近い距離から大きな力を出す拳法です。",
"拳児は練習を続けながら、空手、中国拳法、さまざまな武術の使い手と出会います。",
"強い人に負ければ、くやしくなります。",
"でも「次はどうすればいいのだろう」と考え、また練習します。",
"やがて拳児は、中国や台湾へも渡ります。",
"そこには、本でしか知らなかった本物の達人たちがいました。",
"拳児は技だけでなく、「武術は、人を傷つけるためだけのものではない」という心も学んでいきます。",
"強さを自慢する人。",
"自分より弱い人をいじめる人。",
"本当に強いのに、とても静かな達人。",
"いろいろな人と出会ううちに、拳児は「本当の強さとは何だろう」と考えるようになります。",
"最後には、子どものころのけんか少年から、武術そのものを一生学び続けようとする若者へ成長します。",
"勝負に勝つことより、「もっと知りたい、もっと学びたい」という気持ちが拳児を前へ進ませるのでした。"
]},
{ cat:"m_fight", title:"陣内流柔術武闘伝 真島クンすっとばす!!", spine:"陣内流柔術武闘伝|真島クン|すっとばす!!", yomi:"じんないりゅうじゅうじゅつぶとうでん まじまクンすっとばす", sub:"にわのまこと", author:"にわのまこと", authorYomi:"にわのまこと", icon:"🤼", text:[
"真島零は、「世界最強の格闘家になる！」という大きな夢を持っています。",
"真島が使うのは、昔から伝わる「陣内流柔術」です。",
"投げたり、関節を決めたり、打撃を使ったりする、とても実戦的な武術です。",
"真島は空手、ボクシング、プロレス、ムエタイなど、さまざまな格闘技の強者と戦います。",
"「どの格闘技が一番強いのか」。",
"そんな答えを求めるように、真島は自分より強そうな相手へどんどん挑みます。",
"やがて異種格闘技大会「GIGAバトル」へ出場します。",
"そこでは、普通なら逃げたくなるような強敵が次々に待っています。",
"それでも真島は、笑いながら前へ出ます。",
"ムエタイの天才ガルーダとの激戦などを乗りこえ、真島の強さはさらに上がっていきます。",
"しかし、この作品だけですべての戦いが終わるわけではありません。",
"最後に真島は、もっと強い相手を求めて新しい道へ旅立ちます。",
"「最強」というゴールには、まだたどり着いていません。",
"その後の真島の戦いは、続編『真島、爆ぜる!!』へ受けつがれていきます。"
]},
{ cat:"m_fight", title:"高校鉄拳伝タフ", yomi:"こうこうてっけんでんタフ", sub:"猿渡哲也", author:"猿渡哲也", authorYomi:"さるわたりてつや", icon:"👊", text:[
"宮沢熹一、通称キー坊は、高校生の少年です。",
"キー坊の家には、「灘神影流」という、とても古い格闘術が伝わっています。",
"父の静虎はとても強く、しかもただ勝てばいいとは考えていません。",
"「力を持つなら、その使い方も知らなければならない」。",
"キー坊は父から技と心を教わります。",
"ところが世の中には、強さをお金や名誉のために使う格闘家もいます。",
"キー坊は空手家、プロレスラー、地下格闘家など、さまざまな強者と戦います。",
"そして宮沢家には、静虎とはまるでちがう男・鬼龍もいました。",
"鬼龍は同じ灘神影流の使い手ですが、とても危険で、強さのためなら人を傷つけることも気にしません。",
"キー坊は、静虎と鬼龍という二人の怪物のあいだで、「自分はどんな強さを持つのか」を考えます。",
"戦いを重ねるほど、キー坊はただの高校生ではなく、一人の武術家になっていきます。",
"やがて父の世代をこえるほどの相手とも戦うようになります。",
"『高校鉄拳伝タフ』の物語はそこで一区切りを迎えますが、キー坊の人生は終わりません。",
"その後の物語は『TOUGH』へ続き、さらに大人になったキー坊が新しい戦いへ進んでいきます。"
]},
{ cat:"m_fight", title:"軍鶏", yomi:"しゃも", sub:"原作：橋本以蔵　漫画：たなか亜希夫", author:"橋本以蔵／たなか亜希夫", authorYomi:"はしもといぞう", icon:"🐓", text:[
"※途中から、たなか亜希夫が単独で物語を手がけています。",
"成嶋亮は、十六歳のときに大きな罪を犯し、少年院へ入ります。",
"それまで頭もよく、普通の家庭で育っていた少年でした。",
"けれど少年院の中は、とてもきびしい世界です。",
"弱ければ、すぐに傷つけられてしまいます。",
"亮はそこで空手と出会います。",
"最初は、自分を守るためでした。",
"でも亮はだんだん、「もっと強くなりたい」と考えるようになります。",
"少年院を出たあとも、亮は普通の生活へ戻りません。",
"空手の大会、裏の格闘試合、命がけの勝負へ進んでいきます。",
"強くなるほど、亮のまわりから人が離れていきます。",
"「強くなれば幸せになれる」と思っていたはずなのに、心はどんどん一人ぼっちになります。",
"中国で武術を学び、大きなライバルたちとも戦います。",
"しかしこの物語では、主人公が強くなって英雄になるわけではありません。",
"最後まで亮は、自分が犯したことや、自分の中にある暗いものから完全には逃げられません。",
"多くの戦いを終えたあと、亮の人生はとても静かで悲しい形で終わります。",
"「強さだけでは、人は救われない」。",
"それを重く描いた格闘漫画です。"
]},
{ cat:"m_fight", title:"鉄風", yomi:"てっぷう", sub:"太田モアレ", author:"太田モアレ", authorYomi:"おおたもあれ", icon:"🥊", text:[
"石堂夏央は、運動なら何をやってもすぐに上手くできる女子高校生です。",
"バレーも、ほかのスポーツも、少し練習すれば人より上手くできます。",
"そのせいで夏央は、何をやっても「簡単すぎてつまらない」と感じていました。",
"そんな夏央が出会ったのが、馬渡ゆず子です。",
"ゆず子は小柄で、いつも明るく、総合格闘技が大好き。",
"しかも夏央より、ずっと強いのです。",
"生まれて初めて「こいつには負けるかもしれない」と感じた夏央は、ゆず子を倒すために総合格闘技を始めます。",
"パンチ、キック、投げ技、寝技。",
"今まで何でもすぐできた夏央ですが、格闘技では簡単には勝てません。",
"痛いし、苦しいし、こわい。",
"それでも夏央は、初めて夢中になれるものを見つけます。",
"新人大会へ出場し、何人もの強い相手を倒していきます。",
"そして決勝戦。",
"ついに夏央とゆず子が向かい合います。",
"夏央がずっと求めていたのは、「楽に勝てる相手」ではなく、自分の全部を出しても簡単には届かない相手でした。",
"二人は全力でぶつかり、夏央は初めて「本気で何かをする楽しさ」を知るのでした。"
]},
{ cat:"m_fight", title:"喧嘩商売", yomi:"けんかしょうばい", sub:"木多康昭", author:"木多康昭", authorYomi:"きたやすあき", icon:"👊", text:[
"佐藤十兵衛は、高校生ですが、とても変わった男の子です。",
"格闘技の達人というわけではありません。",
"でも頭がよく、「どうすれば自分より強い相手に勝てるか」を考えるのが大好きです。",
"相手が油断するように話しかけたり、先にしかけを作ったり、戦う場所まで利用したりします。",
"十兵衛にとって、けんかは力だけの勝負ではありません。",
"柔道、空手、ボクシング、中国拳法など、本物の強者たちが次々に登場します。",
"その中でも十兵衛は、工藤優作というとてつもなく強い男に敗れます。",
"「いつか工藤に勝つ」。",
"それが十兵衛の大きな目標になります。",
"十兵衛は師匠から技を学び、自分の頭と体を使って少しずつ強くなります。",
"そして物語は、さまざまな武術の最強クラスが集まる大きな大会「陰陽トーナメント」へ向かっていきます。",
"ただし『喧嘩商売』だけでは、その大会は最後まで描かれません。",
"参加者がそろい、「本当に最強なのはだれなのか」というところで、物語は続編『喧嘩稼業』へ進みます。",
"十兵衛の本当の勝負は、そこからさらに始まるのでした。"
]},
{ cat:"m_fight", title:"餓狼伝", yomi:"がろうでん", sub:"原作：夢枕獏　漫画：板垣恵介", author:"夢枕獏／板垣恵介", authorYomi:"ゆめまくらばく", icon:"🐺", text:[
"丹波文七は、強い相手と戦うことが大好きな格闘家です。",
"「自分より強い人間がいるなら、戦ってみたい」。",
"ただそれだけのために、道場へ行き、プロレスラーへ挑み、さまざまな格闘家と拳を交えます。",
"文七は一度、プロレスラーの梶原年雄に負けます。",
"その敗北がくやしくて、何年も修行を続けます。",
"やがて文七は梶原と再び戦い、成長した自分の力をぶつけます。",
"けれど世界には、まだまだ強い人間がいました。",
"空手の松尾象山。",
"プロレスの巽真。",
"天才格闘家・堤城平。",
"それぞれが、「自分の武術こそ強い」と信じています。",
"大きな格闘大会も開かれ、流派のちがう者たちが戦います。",
"でもこの物語で大事なのは、「空手が一番」「柔道が一番」と答えを出すことではありません。",
"戦う人それぞれに、自分の強さへの考えがあります。",
"板垣恵介による漫画版は、原作小説の物語すべてを最後まで描いたわけではなく、途中で連載を終えています。",
"そのため文七の「最強を探す旅」は、完全な終わりを迎えないまま残されました。"
]},
{ cat:"m_fight", title:"グラップラー刃牙", yomi:"グラップラーバキ", sub:"板垣恵介", author:"板垣恵介", authorYomi:"いたがきけいすけ", icon:"💪", text:[
"範馬刃牙は、まだ十代の少年です。",
"でも目標は、世界一強い父・範馬勇次郎を倒すこと。",
"勇次郎は「地上最強の生物」と呼ばれるほど、とんでもなく強い男です。",
"刃牙の母は、息子が勇次郎より強くなることを望み、幼いころから刃牙に厳しい修行をさせます。",
"刃牙は山で巨大な猿と戦い、格闘家たちと戦い、少しずつ強くなります。",
"しかし父・勇次郎との最初の大きな戦いでは、まったく歯が立ちません。",
"しかも母を失い、刃牙は大きな悲しみを背負います。",
"それでも格闘技をやめません。",
"東京の地下闘技場へ行き、空手、プロレス、柔術、相撲など、さまざまな強者と戦います。",
"そして最大トーナメントが開かれます。",
"世界中から強者が集まり、一対一で戦います。",
"最後に刃牙の前へ立つのは、ジャック・ハンマー。",
"じつはジャックも勇次郎の息子で、刃牙の兄でした。",
"兄弟は「父を倒したい」という同じ思いを持ちながら、全力でぶつかります。",
"刃牙はジャックを倒し、最大トーナメントの優勝者になります。",
"でも本当の目標、勇次郎との決着はまだ先です。",
"刃牙の戦いは、次の『バキ』へ続いていきます。"
]},
{ cat:"m_fight", title:"ケンガンアシュラ", sub:"原作：サンドロビッチ・ヤバ子　作画：だろめおん", author:"サンドロビッチ・ヤバ子／だろめおん", authorYomi:"さんどろびっちやばこ", icon:"🥋", text:[
"日本には、ふつうの人にはあまり知られていない格闘試合がありました。",
"会社同士が大きな仕事を取り合うとき、代表の格闘家を一人ずつ出して戦わせるのです。",
"その試合は「拳願仕合」と呼ばれています。",
"会社員の山下一夫は、ある日、とてつもなく強い青年・十鬼蛇王馬と出会います。",
"王馬は、自分の強さを試すことしか考えていないような男でした。",
"山下は王馬とともに、大企業の代表者たちが集まる「拳願絶命トーナメント」へ参加します。",
"そこには、空手家、力士、暗殺者、プロレスラーなど、いろいろな強者が集まります。",
"王馬は勝ち進みますが、体には大きな負担がかかっています。",
"王馬が使う「二虎流」には、昔の師匠との思い出や、忘れていた過去がありました。",
"戦いながら、王馬は少しずつ自分がなぜ強さを求めているのかを思い出します。",
"決勝まで進んだ王馬の前に立つのは、黒木玄斎という本物の達人です。",
"王馬はすべてを出しますが、黒木に敗れます。",
"そして傷ついた体で静かに眠り、山下は王馬が死んだと思います。",
"しかし物語はそこで完全には終わりません。",
"王馬の運命と拳願会のその後は、続編『ケンガンオメガ』へ続いていきます。"
]},
{ cat:"m_sports", title:"はねバド!", yomi:"はねバド", sub:"濱田浩輔", author:"濱田浩輔", authorYomi:"はまだこうすけ", icon:"🏸", text:[
"荒垣なぎさは、北小町高校バドミントン部のエースです。",
"しかし大会で、小さな女の子に一方的に負けてしまいました。",
"その相手が、羽咲綾乃です。",
"綾乃は見た目はおとなしいのに、バドミントンではものすごい才能を持っています。",
"ところが綾乃は、バドミントンが大好きとは言えませんでした。",
"母・有千夏も世界で活躍する選手でしたが、幼い綾乃を残して海外へ行ってしまったからです。",
"綾乃は「もっと強くなれば、お母さんが帰ってくる」と思いながら競技を続け、心を傷つけていました。",
"なぎさもまた、綾乃に負けたことが心に残っています。",
"二人は同じ学校で練習するうちに、ライバルであり仲間になっていきます。",
"綾乃は全国大会へ進み、世界級の力を持つコニー・クリステンセンと出会います。",
"コニーもまた有千夏と深くつながる少女でした。",
"最後のインターハイ決勝では、綾乃とコニーが「どちらが本当に強いのか」を決めるため、すべてを出して戦います。",
"綾乃はやがて、母親に認めてもらうためではなく、自分自身がバドミントンをする意味を見つけていきます。"
]},
{ cat:"m_sports", title:"しゃにむにGO", yomi:"しゃにむにゴー", sub:"羅川真里茂", author:"羅川真里茂", authorYomi:"らがわまりも", icon:"🎾", text:[
"伊出延久は、とても運動神経のよい高校生です。",
"ある日、女の子にひと目ぼれしたことをきっかけに、テニス部へ入ります。",
"最初はテニスのルールもよく知らない初心者です。",
"でも延久には、どんな球にもくらいつく元気と、すごい体力がありました。",
"一方、滝田留宇衣は、小さいころからテニスをしてきた天才選手です。",
"ところが留宇衣は、家族とのことや大きな期待に苦しみ、「テニスをするのが楽しい」と思えなくなっていました。",
"初心者なのに楽しそうに走り回る延久を見て、留宇衣の心も少しずつ動き始めます。",
"二人は同じ学校で練習しながら、何度もぶつかります。",
"延久は経験が足りません。",
"留宇衣は心がうまく前へ進みません。",
"それでも、おたがいがいるから強くなっていきます。",
"そして高校最後のインターハイ。",
"長いあいだ競い合ってきた延久と留宇衣が、ついに決勝で戦います。",
"どちらが勝っても、それで二人の人生が終わるわけではありません。",
"初心者だった少年と、テニスに苦しんでいた天才が、最後には「自分で選んでテニスをする選手」になるまでのお話です。"
]},
{ cat:"m_sports", title:"DEAR BOYS", yomi:"ディアボーイズ", sub:"八神ひろき", author:"八神ひろき", authorYomi:"やがみひろき", icon:"🏀", text:[
"哀川和彦は、バスケットボールの名門・天童寺高校で活躍していた天才選手です。",
"ところがある日、哀川はその強豪校を離れ、瑞穂高校へ転校してきます。",
"瑞穂高校の男子バスケ部は、過去の問題でほとんど活動できなくなっていました。",
"部員は藤原、三浦、石井、土橋の四人だけ。",
"みんなバスケへの気持ちまでなくしかけています。",
"そこへ哀川がやってきます。",
"「またバスケをやろうよ」。",
"明るくバスケを楽しむ哀川に引っぱられ、四人はもう一度コートへ戻ります。",
"瑞穂は最初から強いわけではありません。",
"けんかをしたり、けがをしたり、大きな大会で負けたりします。",
"それでも一試合ごとにチームらしくなっていきます。",
"そして県大会、全国大会へ進み、名門校とも互角に戦えるようになります。",
"物語は長く続き、『ACT II』『ACT III』へ進みます。",
"最後の目標は、もちろん全国制覇です。",
"瑞穂は強豪・成田中央などを倒し、ついに全国の頂点を目指す決勝の舞台へ立ちます。",
"五人しかいなかった壊れかけのチームが、仲間を信じることで全国一を争うチームへ育っていく、長い青春のお話です。"
]},
{ cat:"m_sports", title:"Harlem Beat", yomi:"ハーレムビート", sub:"西山優里子", author:"西山優里子", authorYomi:"にしやまゆりこ", icon:"🏀", text:[
"成瀬徹は、スポーツをしてもいつも補欠になってしまう少年です。",
"高校でバスケットボール部に入っても、自分には特別な才能がないと思っていました。",
"そんな成瀬が、町のストリートバスケットと出会います。",
"三人対三人で戦う3on3です。",
"そこで初めてシュートを決めたとき、成瀬は「自分だってバスケをやっていいんだ」と感じます。",
"成瀬は仲間とストリートチーム「SCRATCH」を作ります。",
"自由なバスケの中で、成瀬は高く跳ぶ力を生かし、自分だけのプレーを覚えていきます。",
"そして学校のバスケ部でも、少しずつ大切な選手になっていきます。",
"強豪校と戦えば、ストリートだけでは通用しないこともあります。",
"逆に、型どおりのバスケだけでは勝てない場面もあります。",
"成瀬はその両方を学びます。",
"全国大会へ進み、多くの強敵と戦ううちに、昔は「どうせ自分は補欠」と思っていた少年が、チームのために堂々とボールを持てる選手になります。",
"最後には先輩たちも卒業し、次の世代へチームが受けつがれます。",
"成瀬もまた、だれかに選んでもらうのを待つのではなく、自分から「バスケをやりたい」と言える青年になるのでした。"
]},
{ cat:"m_sports", title:"I’ll", yomi:"アイル", sub:"浅田弘幸", author:"浅田弘幸", authorYomi:"あさだひろゆき", icon:"🏀", text:[
"立花茜と柊仁成は、中学最後のバスケットボールの試合で出会いました。",
"二人とも、とても才能があります。",
"でも二人とも、高校ではバスケをやめようと思っていました。",
"茜は、自分が何のためにバスケをするのかわからなくなっていました。",
"柊は、バスケの名門一家に生まれ、父や兄の期待から離れたいと思っていました。",
"ところが二人は、偶然同じ国府津高校へ入ります。",
"「たかがバスケットを、本気でやろう」。",
"二人はもう一度コートへ戻ります。",
"国府津高校には、ほかにもいろいろな事情を抱えた仲間がいます。",
"全国一を目指すというより、まず「自分たちは何のためにここにいるのか」を確かめるようにバスケをします。",
"茜と柊は仲間であり、ライバルでもあります。",
"ぶつかり、離れそうになり、それでも同じコートへ戻ってきます。",
"最後には、キャプテンの山崎から思いを受けつぎ、大事な試合を戦います。",
"勝敗だけで人生が決まるわけではありません。",
"一緒に本気で走った時間そのものが、少年たちを大人へ近づけます。",
"最後に二人は別々の未来へ進みながらも、「相棒」として過ごした日々を胸に持ち続けるのでした。"
]},
{ cat:"m_art", title:"BECK", yomi:"ベック", sub:"ハロルド作石", author:"ハロルド作石", authorYomi:"はろるどさくいし", icon:"🎸", text:[
"田中幸雄、みんなから「コユキ」と呼ばれる少年は、ごく普通の中学生です。",
"毎日も何となくすぎていて、「これがやりたい」というものもありません。",
"ある日、変わった犬のBECKを助けたことで、南竜介というギタリストと出会います。",
"竜介はアメリカで音楽をしてきた青年でした。",
"コユキは竜介からギターを教えてもらい、初めて「音楽をやりたい」と思います。",
"やがて仲間が集まり、バンド「BECK」を結成します。",
"最初は小さなライブハウスで演奏しても、客はほとんどいません。",
"メンバー同士でけんかもします。",
"バンドがなくなりそうになることもあります。",
"それでもコユキには、人を引きつける歌声がありました。",
"日本の大きな音楽フェスに出場し、BECKは少しずつ知られるようになります。",
"やがてアメリカツアーにも挑戦します。",
"音楽業界の大人たちとの争い、メンバーの過去、竜介が持つギターにまつわる事件など、さまざまな問題も起こります。",
"それでも五人は、最後にはまた同じステージへ集まります。",
"平凡だったコユキは、自分の声で世界中の人を動かすミュージシャンへ成長します。",
"「音楽を好きになった少年が、自分の人生そのものを見つける」物語です。"
]},
{ cat:"m_art", title:"ピアノの森", yomi:"ピアノのもり", sub:"一色まこと", author:"一色まこと", authorYomi:"いっしきまこと", icon:"🎹", text:[
"一ノ瀬海、通称カイは、森の近くで育った少年です。",
"その森には、なぜか捨てられた大きなピアノがありました。",
"普通の人が弾こうとしても、うまく音が出ません。",
"でもカイが弾くと、美しい音が森いっぱいに響きます。",
"カイには、だれにも教わっていないのにピアノを弾ける特別な才能がありました。",
"転校してきた雨宮修平は、音楽家の家で育ち、小さいころからきちんとピアノを習っています。",
"自由に弾くカイと、正しく弾く修平。",
"二人は友だちであり、ライバルになります。",
"元ピアニストの阿字野壮介は、カイの才能を見つけ、先生になります。",
"阿字野自身は事故で手を傷め、演奏家の道をあきらめていました。",
"カイは成長し、世界最高峰のショパン・コンクールへ挑みます。",
"世界中の天才たちが集まる中でも、カイは森で育てた自分だけの音を弾きます。",
"そしてついに、世界から認められるピアニストになります。",
"一方、カイは自分を育ててくれた阿字野にも恩返しをします。",
"阿字野の手の治療を助け、もう一度ピアノを弾ける道を作ります。",
"先生が生徒を育て、その生徒が今度は先生の夢を取り戻す。",
"そんなやさしいつながりで物語は終わります。"
]},
{ cat:"m_art", title:"四月は君の嘘", yomi:"しがつはきみのうそ", sub:"新川直司", author:"新川直司", authorYomi:"あらかわなおし", icon:"🎻", text:[
"有馬公生は、小さいころから「天才ピアニスト」と呼ばれていました。",
"きびしい母親に毎日ピアノを教えられ、コンクールではいつも正確に弾きます。",
"ところが母親が亡くなったあと、公生には自分の弾くピアノの音が聞こえなくなってしまいます。",
"それから公生は、ピアノを弾かなくなりました。",
"中学生になった春、公生は宮園かをりという女の子と出会います。",
"かをりはバイオリンを弾きます。",
"楽譜どおりにきれいに弾くより、「自分がこう弾きたい！」という気持ちを音にする女の子でした。",
"かをりに引っぱられ、公生はもう一度ピアノへ向かいます。",
"最初はこわくて、演奏の途中で音がわからなくなります。",
"それでも「だれかへ届けるために弾けばいい」と知り、少しずつ前へ進みます。",
"しかし、かをりの体には重い病気がありました。",
"元気そうに笑っていますが、入院する時間が増えていきます。",
"かをりは手術を受けますが、助かりません。",
"あとで公生のもとへ、かをりが残した手紙が届きます。",
"そこで公生は、かをりが言っていた「渡が好き」という言葉が、本当ではなかったと知ります。",
"本当はずっと公生が好きで、近くに行くためについた「四月の嘘」だったのです。",
"公生は泣きながらも、かをりにもらった音楽と勇気を胸に、もう一度自分の人生を歩いていきます。"
]},
{ cat:"m_art", title:"ましろのおと", sub:"羅川真里茂", author:"羅川真里茂", authorYomi:"らがわまりも", icon:"🪕", text:[
"澤村雪は、青森で津軽三味線を弾く少年です。",
"雪に三味線を教えてくれたのは、大好きな祖父・松吾郎でした。",
"松吾郎が亡くなると、雪は自分が何を弾けばいいのかわからなくなります。",
"「じいちゃんの音がなくなったら、おれの音って何なんだ」。",
"答えを探すため、雪は青森を離れ、東京へやってきます。",
"東京の高校では、三味線を知らない仲間たちと出会い、みんなで演奏するようになります。",
"雪はとても上手ですが、一人で好きに弾くことと、仲間と音を合わせることはちがいます。",
"大会に出たり、プロの演奏家と出会ったりしながら、雪は少しずつ「自分の音」を探します。",
"兄の若菜、母の梅子、三味線奏者たちとの関係にも向き合います。",
"雪はだんだん、「自分だけが満足する演奏」ではなく、「もっとたくさんの人に聞いてほしい」と思うようになります。",
"最後には兄・若菜との共演のためアメリカへ渡り、大きな舞台で演奏します。",
"祖父の音をまねするだけだった少年は、長い旅の末に、自分自身の音を世界へ届ける三味線奏者になるのでした。"
]},
{ cat:"m_art", title:"この音とまれ!", yomi:"このおととまれ", sub:"アミュー", author:"アミュー", authorYomi:"あみゅー", icon:"🎼", text:[
"倉田武蔵は、時瀬高校の箏曲部に残った、たった一人の部員です。",
"「このままでは部がなくなってしまう」。",
"新しい部員を探していると、久遠愛という、いかにも不良のような男の子がやってきます。",
"愛は見た目こそこわいですが、亡くなった祖父が箏職人だったため、本当は箏をとても大切にしています。",
"そこへ、箏の名家で育った天才少女・鳳月さとわも入部します。",
"愛の友だち三人や来栖妃呂も加わり、バラバラだった七人が一つの部になります。",
"最初は音も合いません。",
"けんかもします。",
"でも「全国大会へ行きたい」という目標ができると、みんな本気で練習を始めます。",
"愛は過去の悪いうわさと向き合い、さとわは母親との関係を少しずつ取り戻します。",
"武蔵も頼りない部長から、仲間を支えられる人へ成長します。",
"そして時瀬高校は全国大会へ進み、ついに大きな舞台で演奏します。",
"長い努力の末、彼らは全国大会で優勝を果たします。2026年の第34巻では、その喜びのあと、三年生の引退やそれぞれの恋、家族との関係が描かれています。",
"物語は完結目前で、箏がばらばらだった人たちの心を、一つの音につないでいくお話です。"
]},
{ cat:"m_art", title:"青のオーケストラ", yomi:"あおのオーケストラ", sub:"阿久井真", author:"阿久井真", authorYomi:"あくいまこと", icon:"🎻", text:[
"青野一は、小さいころからバイオリンを弾いてきた少年です。",
"世界で活躍するバイオリニストの父から才能を受けつぎ、コンクールでもたくさん賞を取りました。",
"でも父親のことで家族が傷つき、青野はバイオリンまできらいになってしまいます。",
"「もう弾かない」。",
"そう決めた青野ですが、中学校で秋音律子という女の子と出会います。",
"律子はバイオリン初心者です。",
"上手ではありませんが、一生懸命音を出します。",
"その姿を見た青野は、少しずつバイオリンを弾きたかったころの気持ちを思い出します。",
"高校へ進んだ二人は、強豪のオーケストラ部へ入ります。",
"そこには青野と同じくらい上手な佐伯直、たくさんの先輩や仲間がいました。",
"一人で演奏するのと、何十人もの人と音を合わせるのはまったくちがいます。",
"青野は「自分だけがうまければいい」という考えから変わっていきます。",
"やがて父親や佐伯との複雑な関係にも向き合います。",
"先輩たちが卒業すると、青野たちは二年生になり、今度は後輩を支える側になります。",
"2026年現在も連載中で、青野たちは音楽だけでなく、友情や恋にも悩みながら、自分たちのオーケストラを作っています。"
]},
{ cat:"m_art", title:"SHIORI EXPERIENCE ジミなわたしとヘンなおじさん", spine:"SHIORI|EXPERIENCE", yomi:"シオリエクスペリエンス ジミなわたしとヘンなおじさん", sub:"原作：町田一八　作画：長田悠幸", author:"町田一八／長田悠幸", authorYomi:"まちだかずや", icon:"🎸", text:[
"本田紫織は、高校で英語を教えている二十七歳の先生です。",
"昔はギターが大好きでした。",
"でも家族のことや生活のため、夢をあきらめ、地味な毎日を送っています。",
"ところが二十七歳の誕生日、紫織の体に、アフロヘアの外国人ギタリストの幽霊が取りつきます。",
"その正体は、伝説のギタリスト、ジミ・ヘンドリックスを思わせる存在でした。",
"しかも、とんでもない条件があります。",
"「二十七歳が終わるまでに、音楽で伝説を残せなければ死ぬ」。",
"紫織は、もう一度ギターを持つしかなくなります。",
"学校では、音楽が好きな生徒たちとバンドを作ります。",
"最初はうまくいきません。",
"でも紫織が本気でギターを弾くと、生徒たちも「自分も本気でやりたい」と変わっていきます。",
"やがて、ほかの伝説的な音楽家の幽霊を宿した人々も現れます。",
"音楽の勝負はどんどん大きくなり、紫織は自分が昔あきらめた夢そのものと向き合うことになります。",
"2026年8月発売の26巻では、伝説を残す期限まであと五時間というところまで進んでいます。",
"紫織が「ただ死なないため」に弾くのではなく、「自分の人生を生ききるため」にどんな音を出すのか。",
"物語はいよいよ大きなクライマックスへ向かっています。"
]},
{ cat:"m_art", title:"ふつうの軽音部", yomi:"ふつうのけいおんぶ", sub:"原作：クワハリ　漫画：出内テツオ", author:"クワハリ／出内テツオ", authorYomi:"くわはり", icon:"🎸", text:[
"鳩野ちひろは、高校一年生の女の子です。",
"派手な人気者ではありません。",
"歌がものすごく上手だと思っているわけでもありません。",
"でも邦楽ロックが大好きで、「高校に入ったらギターをやりたい」と思っていました。",
"新品のギターを買った鳩野は、軽音楽部へ入ります。",
"ところが軽音部には、上手な人もいれば、あまり練習しない人もいます。",
"恋愛でもめる人もいます。",
"「バンドを組もう」と言ったのに、すぐに別のバンドへ行ってしまう人もいます。",
"鳩野自身も失敗し、バンドがなくなってしまいます。",
"そんな鳩野の歌を聞いて、「この子の歌は何かちがう」と感じたのが、幸山厘です。",
"厘は、鳩野を中心に新しいバンド「はーとぶれいく」を作ろうと動きます。",
"鳩野は仲間とライブへ出て、何度も恥ずかしい思いをしながら、それでもステージで歌います。",
"「自分は特別な天才ではない」。",
"それでも、好きな音楽を本気でやっていい。",
"鳩野は少しずつそう思えるようになります。",
"2026年10月現在も連載中で、単行本12巻が発売され、物語では高校生活とバンド活動がさらに進んでいます。"
]},
{ cat:"m_art", title:"To-y", yomi:"トーイ", sub:"上條淳士", author:"上條淳士", authorYomi:"かみじょうあつし", icon:"🎤", text:[
"藤井冬威、通称To-yは、若いロックバンド「GASP」のボーカルです。",
"To-yはとてもかっこよく、ステージに立つと人の目を引きつけます。",
"そんなTo-yを見つけた芸能界の大人たちは、「ロックバンドなんかやめて、アイドルになればもっと売れる」と考えます。",
"大きな会社は、To-yにきれいな服を着せ、テレビへ出し、みんなに好かれるスターにしようとします。",
"でもTo-yは、自分の音楽をだれかに決められることが大きらいです。",
"売れるための笑顔より、自分が本当にやりたい音楽を選びます。",
"To-yのまわりには、不思議な少女ニヤや、人気アイドルの哀川陽司など、芸能界で生きる若者たちが集まります。",
"「有名になれば幸せなのか」。",
"「売れる音楽と、自分が好きな音楽は同じなのか」。",
"To-yは何度もその問題にぶつかります。",
"最後までTo-yは、大人が用意した「安全なスター」にはなりません。",
"たとえ不器用でも、自分の足でステージに立ち、自分の音を鳴らすことを選びます。",
"誰かに作られた偶像ではなく、自分自身でいたいと願う少年のロックのお話です。"
]},
{ cat:"m_art", title:"神童", yomi:"しんどう", sub:"さそうあきら", author:"さそうあきら", authorYomi:"さそうあきら", icon:"🎹", text:[
"成瀬うたは、小学生の女の子です。",
"野球が好きで、元気で、ぱっと見ただけなら普通の子どもに見えます。",
"ところが、うたにはとんでもない才能がありました。",
"ピアノの前へ座れば、一度聞いた曲をすぐに弾き、人には聞こえないような音まで感じ取ることができます。",
"まわりの大人たちは、うたを「神童」と呼びます。",
"そんなうたが出会ったのが、音楽大学を目指して浪人している菊名和音です。",
"和音は一生懸命練習しているのに、自分には才能がないのではないかと悩んでいました。",
"天才のうたと、努力する和音。",
"二人はまったくちがいます。",
"でもいっしょに音楽をするうちに、おたがいから大切なものを学びます。",
"うたにも悩みがあります。",
"「天才だから弾ける」と言われても、本人はただ楽しく音を出したいだけです。",
"大人の期待が大きくなるほど、音楽が重くなることもあります。",
"それでもうたは、自分の耳と心を信じてピアノを続けます。",
"そして世界のピアノ界へ進み、「神童」という言葉だけでは説明できない、一人の音楽家へ成長していきます。全4巻で完結しています。"
]},
{ cat:"m_art", title:"いつもポケットにショパン", spine:"いつもポケットに|ショパン", sub:"くらもちふさこ", author:"くらもちふさこ", authorYomi:"くらもちふさこ", icon:"🎹", text:[
"須江麻子と緒方季晋は、小さいころからの幼なじみです。",
"二人ともピアノを習い、いつもいっしょに遊び、いっしょに音楽を聞いていました。",
"ところが季晋は、音楽を学ぶためドイツへ行きます。",
"その後、列車事故にあい、麻子とは長いあいだ連絡が取れなくなってしまいます。",
"何年かたち、高校生になった麻子は音楽学校でピアノを学んでいました。",
"そして、ずっと会いたかった季晋と再会します。",
"「きしんちゃん！」",
"喜ぶ麻子。",
"でも季晋は、昔とはまるで別人のようでした。",
"季晋は麻子に冷たく、憎んでいるような態度をとります。",
"そこには、二人の母親たちの過去や、音楽家としての争いが深く関係していました。",
"麻子は悲しみながらも、ピアノをやめません。",
"季晋もまた、手を傷めながら大きなコンクールへ挑みます。",
"二人は言葉ではうまく話せない気持ちを、ピアノでぶつけ合うようになります。",
"昔のように何も知らない子どもには戻れません。",
"でも、傷ついたからこそ知ることのできた相手の気持ちがあります。",
"ショパンの音楽を通して、麻子と季晋は家族の過去を乗りこえ、もう一度おたがいの心へ近づいていくのでした。"
]},
{ cat:"m_art", title:"ダンス・ダンス・ダンスール", spine:"ダンス・ダンス・|ダンスール", sub:"ジョージ朝倉", author:"ジョージ朝倉", authorYomi:"じょーじあさくら", icon:"🩰", text:[
"村尾潤平は、小さいころに男のバレエダンサーを見て、「なんてかっこいいんだ！」と心をうばわれました。",
"本当は自分もバレエをやりたい。",
"でも父親を亡くしたあと、「男らしくならなければ」と思い、バレエをやめて格闘技を始めます。",
"中学生になった潤平の前に、五代都という女の子が現れます。",
"都は、潤平が本当はバレエを好きだと見ぬきます。",
"「一緒に踊ろう」。",
"そう言われた潤平は、隠していた気持ちを止められなくなります。",
"そこで出会うのが、森流鶯という天才少年です。",
"流鶯は小さいころから厳しいバレエ教育を受け、ものすごい技術を持っています。",
"自由に踊る潤平と、完璧な技術を持つ流鶯。",
"二人はおたがいを意識しながら、世界を目指します。",
"潤平は日本を離れ、海外のバレエ団や先生のもとで学ぶようになります。",
"けがをしたり、自信を失ったり、昔好きだった都と再会したりしながら、「自分はどんなダンサーになりたいのか」を考え続けます。",
"流鶯にも、パリ・オペラ座への道など大きな選択が現れています。",
"2026年現在も連載中で、二人は少年時代よりはるかに大きな世界で、それぞれのバレエを探している途中です。"
]},
{ cat:"m_art", title:"絢爛たるグランドセーヌ", spine:"絢爛たる|グランドセーヌ", yomi:"けんらんたるグランドセーヌ", sub:"Cuvie", author:"Cuvie", authorYomi:"きゅーびー", icon:"🩰", text:[
"藤谷奏は、小学生の女の子です。",
"ある日、近所のお姉さんがバレエの舞台で踊る姿を見て、目をかがやかせます。",
"「私も、あんなふうに踊りたい！」",
"こうして奏はバレエを始めます。",
"最初の奏は、もちろんプロのようには踊れません。",
"足の向き、手の形、体の使い方。",
"一つ一つ先生に直されます。",
"でも奏は、人の動きをよく見るのが得意でした。",
"上手な人の踊りを観察し、「どうしてあんな動きができるんだろう」と考え、自分でも試します。",
"コンクールへ出るようになると、同じ年のライバルたちと出会います。",
"生まれつき体がやわらかい子。",
"表現するのが上手な子。",
"外国で学んでいる子。",
"奏は「自分よりすごい人がこんなにいる」と知ります。",
"でも落ちこむだけではありません。",
"負ければ、何が足りなかったのかを考え、また練習します。",
"成長した奏は海外にも目を向け、世界のバレエ学校や大きな舞台を目指すようになります。",
"バレエは、ただきれいに踊るだけではありません。",
"体を守ること、役の気持ちを考えること、仲間と舞台を作ることも必要です。",
"2026年現在も連載中で、単行本は30巻まで刊行されています。奏は少女のころ夢見た「世界の大舞台」へ近づきながら、今も自分の踊りを磨き続けています。"
]},
{ cat:"m_art", title:"ワンダンス", sub:"珈琲", author:"珈琲", authorYomi:"こーひー", icon:"🕺", text:[
"小谷花木、通称カボは、人前で話すことがあまり得意ではない高校生です。言葉がうまく出てこないことがあり、「自分のことをどう伝えればいいのだろう」と、いつも少し息苦しさを感じていました。",
"ある日カボは、同級生の湾田光莉が、だれもいないところで楽しそうにダンスをしている姿を見ます。湾田は人の目を気にせず、音楽に合わせて自由に体を動かしていました。",
"「言葉を使わなくても、こんなふうに自分を表せるんだ」。",
"カボはダンス部へ入り、初めてストリートダンスを習います。最初は体もうまく動きません。でも先輩や仲間から教わり、ダンスバトルにも出るようになります。",
"湾田にも、自分だけの踊りを見つけたいという思いがあります。二人は仲間であり、ときにはおたがいを意識する相手にもなっていきます。",
"大会へ出れば、自分よりずっと上手なダンサーがたくさんいます。それでもカボは、「うまいか下手か」だけではなく、「自分は何を踊りたいのか」を考えるようになります。",
"物語はまだ続いています。現在はカボと湾田が二人で作品を作り、世界へつながるダンスの選考にも挑んでいます。話すことが苦手だった少年が、体いっぱいを使って「自分はここにいる」と伝えられるようになっていく物語です。"
]},
{ cat:"m_art", title:"かげきしょうじょ!!", sub:"斉木久美子", author:"斉木久美子", authorYomi:"さいきくみこ", icon:"🌹", text:[
"渡辺さらさは、背が高く、とても明るい女の子です。",
"さらさには大きな夢がありました。",
"女性だけで舞台を作る「紅華歌劇団」に入り、いつか『ベルサイユのばら』のオスカルのような大役を演じることです。",
"夢をかなえるため、さらさは紅華歌劇音楽学校へ入学します。",
"そこで同じ部屋になったのが、奈良田愛という少女でした。",
"愛は以前アイドルをしていましたが、人との関係で傷つき、とくに男の人が苦手になっていました。大きな声でぐいぐい近づいてくるさらさのことも、最初は苦手です。",
"でも二人は、歌、ダンス、芝居、礼儀など、毎日きびしい稽古を受けるうちに、少しずつ友だちになっていきます。",
"学校には、歌の上手な子、美しい子、努力を続ける子など、たくさんの生徒がいます。",
"みんなの夢は同じ舞台です。",
"だから友だちでありながら、いつか役を取り合うライバルにもなります。",
"さらさも「元気だけではトップスターになれない」と知り、愛も、人と向き合うことから逃げずに少しずつ変わっていきます。",
"2026年10月現在、100期生たちは卒業を目前にしています。さらさが本当にオスカルを演じるスターになれるのか、愛がどんな舞台人になるのか。少女たちの物語は、まだ続いています。"
]},
{ cat:"m_art", title:"かぶく者", yomi:"かぶくもの", sub:"原作：デビッド・宮原　漫画：たなか亜希夫", author:"デビッド・宮原／たなか亜希夫", authorYomi:"でびっどみやはら", icon:"🎭", text:[
"市坂新九郎は、歌舞伎の世界で生きる若い役者です。",
"歌舞伎には、何百年も受けつがれてきた型や決まりがあります。そして有名な家に生まれた役者たちは、小さいころからその世界で育っています。",
"新九郎は、そんな世界の中で、「ただ正しく演じるだけではつまらない」と考えていました。",
"新九郎が求めるものは、「かぶく」ことです。",
"舞台を見ている人の心をぐっとつかみ、「次に何をするのだろう」と目を離せなくする。",
"そんな役者になりたいのです。",
"ところが、伝統を重んじる歌舞伎の世界では、新九郎のやり方は危なっかしく見えます。",
"先輩や名門の役者とぶつかり、舞台に立てなくなるほど追いつめられることもあります。",
"それでも新九郎は、苦しみの中から新しい芝居を生み出します。",
"『連獅子』や『四谷怪談』などの舞台で、ただ役を演じるのではなく、自分自身まで役の中へ投げこむように芝居をします。",
"最後の『四谷怪談』では、舞台と現実の境目さえわからなくなるほどの芸へ近づいていきます。",
"「役者とは何なのか」「人をひきつける芸とは何なのか」。",
"新九郎は答えを言葉ではなく、舞台の上で見せます。",
"物語は全8巻で完結し、新九郎が最後まで「かぶく」快感を追い求める姿で幕を閉じます。"
]},
{ cat:"m_art", title:"バレエ星", yomi:"バレエぼし", sub:"谷ゆき子", author:"谷ゆき子", authorYomi:"たにゆきこ", icon:"⭐", text:[
"かすみは、バレエを愛する少女です。",
"かすみの母もバレリーナでしたが、病気になっていました。",
"ある日、かすみの前に白鳥の衣装を着た母が現れ、「バレエ星」という作品を完成させてほしいと願いを託します。",
"こうして、かすみの長いバレエの物語が始まります。",
"ところが、かすみの前には次から次へとたいへんな出来事が起こります。",
"ライバルにいじわるをされたり、けがをしたり、住む場所に困ったり、大切な人を失ったりします。",
"「もう踊れないかもしれない」。",
"そんなことが何度起こっても、かすみは立ち上がります。",
"母を亡くしたときには、悲しみのあまり何もかもいやになります。それでも、母から受けついだバレエへの気持ちは消えません。",
"先生や仲間に助けられながら、かすみは何度も舞台へ戻ります。",
"子どもだったかすみは、たくさんの苦労を乗りこえ、最後には立派なバレリーナへ成長します。",
"この作品は、今から半世紀以上も前に子ども向けの雑誌へ連載されていた物語です。",
"毎回「かすみちゃんはどうなるの!?」と思うような大事件が起こりますが、それでも夢をあきらめず踊り続ける少女のお話なのです。"
]},
{ cat:"m_art", title:"アラベスク", sub:"山岸凉子", author:"山岸凉子", authorYomi:"やまぎしりょうこ", icon:"🩰", text:[
"ノンナ・ペトロワは、ソビエト連邦でバレエを学んでいる少女です。",
"ノンナは背が高く、体も少し大きめで、自分にあまり自信がありません。",
"「私なんて、きれいなバレリーナにはなれない」。",
"そう思っていました。",
"ところが有名なダンサーであり教師でもあるユーリ・ミロノフが、ノンナの才能を見つけます。",
"ミロノフはノンナに、とてもきびしい練習をさせます。",
"泣きたくなるほどつらい日もあります。",
"それでもノンナは、少しずつ自分の体を自由に使えるようになります。",
"大きな役を取り合うライバルも現れます。",
"「アラベスク」という作品の主役をめぐる争いでは、友だちだった人との関係まで苦しくなります。",
"ノンナは舞台の上で成功し、世界で注目されるバレリーナへ育っていきます。",
"そしてノンナにとって、先生だったミロノフは、いつしか大切な男性にもなっていきます。",
"物語の最後、ミロノフは病院のベッドで眠り、ノンナはその手を握っています。",
"ミロノフは目を覚ましたらノンナに気持ちを伝えようとしていますが、まだ何も知らないノンナも、その横で眠ってしまいます。",
"二人が美しく踊る姿が重なるように描かれ、「これから二人の人生も続いていくのだろう」と感じさせながら物語は静かに終わります。"
]},
{ cat:"m_art", title:"SWAN", yomi:"スワン", sub:"有吉京子", author:"有吉京子", authorYomi:"ありよしきょうこ", icon:"🦢", text:[
"聖真澄は、バレエが大好きな少女です。",
"ある日、世界的なバレエダンサーの舞台を見た真澄は、心の底から思います。",
"「私も、あんな舞台で踊りたい」。",
"真澄には才能があります。",
"でも、世界のバレエ界には、真澄より長く練習してきた人も、生まれつき美しい体を持つ人もいます。",
"真澄は東京へ出て、本格的なバレエの世界へ飛びこみます。",
"そこで出会うのが、レオンをはじめとする若いダンサーたちです。",
"仲間であると同時に、役を取り合うライバルでもあります。",
"舞台の主役になれるのは一人だけです。",
"失敗すれば、次の人が役を取ります。",
"けがをすれば、何か月も踊れなくなることがあります。",
"真澄は何度も自信をなくします。",
"それでも舞台に立つと、「もっと踊りたい」という気持ちが戻ってきます。",
"日本から世界へ進み、国際的なコンクールや大きな舞台に挑戦しながら、真澄は一人のプロのバレリーナへ成長していきます。",
"またレオンとの関係も、子どものような憧れから、同じ道を生きる二人の強い結びつきへ変わっていきます。",
"『SWAN』本編のあとにも続編が描かれ、真澄たちのバレエ人生はさらに先まで続いていきます。"
]},
{ cat:"m_sports", title:"ガンバ!Fly high", yomi:"ガンバフライハイ", sub:"原作：森末慎二　作画：菊田洋之", author:"森末慎二／菊田洋之", authorYomi:"もりすえしんじ", icon:"🤸", text:[
"藤巻駿は、中学一年生の男の子です。",
"駿には、とても大きな夢がありました。",
"「オリンピックへ行って、体操で金メダルを取りたい！」",
"ところが、学校の男子体操部へ入ってみると、駿は逆上がりさえうまくできない初心者でした。",
"しかも体操部は、あまり強くありません。",
"それでも駿は、先輩たちと一緒に練習を始めます。",
"鉄棒、床、跳馬、つり輪。",
"体操にはたくさんの種目があります。",
"駿は失敗して落ちたり、こわくなったりしながらも、新しい技を一つずつ覚えていきます。",
"やがて駿には、空中で自分の体がどこにあるのかを感じ取る、とてもすぐれた才能があることがわかります。",
"でも才能だけでは世界一にはなれません。",
"仲間の助け、先生の教え、何千回という練習が必要です。",
"駿は中学、高校、そしてその先へと進み、日本の代表選手になります。",
"世界には、ロシアや中国など、とてつもなく強い選手が待っています。",
"最後の舞台はオリンピック。",
"昔は逆上がりもできなかった少年が、日本の仲間たちと一緒に世界の強豪へ挑みます。",
"そして駿は、自分がずっと大切にしてきた「楽しい体操」を世界の舞台で見せます。",
"小さな夢から始まった少年は、本当にオリンピックの頂点へ届くほどの体操選手へ成長するのでした。全34巻で完結しています。"
]},
{ cat:"m_sports", title:"Odds GP!", yomi:"オッズジーピー", sub:"石渡治", author:"石渡治", authorYomi:"いしわたおさむ", icon:"🚴", text:[
"辻堂麟太郎、通称リンタは、もともと自転車のロードレースで活躍したいと思っていた青年です。",
"ところが家族に大きな事故が起こり、お金が必要になりました。",
"そこでリンタは、賞金をかせぐことのできる「競輪」の世界へ進みます。",
"競輪学校で厳しい練習を受けたリンタは、ついにプロの競輪選手になります。",
"「さあ、ここから一気に勝つぞ！」",
"そう思って迎えたデビュー戦。",
"ところがリンタは、いきなり思うようにはいきません。",
"プロの世界には、速いだけでは勝てないルールがあります。",
"だれの後ろを走るか。",
"いつ前へ出るか。",
"ほかの選手とどんな作戦を組むか。",
"ほんの少し判断をまちがえるだけで、ゴールの順番は大きく変わります。",
"リンタは失敗しながら、少しずつ競輪の本当のむずかしさを覚えていきます。",
"競輪学校で出会ったライバルたちも、今度はプロとしてリンタの前へ現れます。",
"リンタはA級で勝ち続け、ついにさらに強い選手のいるS級へ上がります。",
"『Odds GP!』は全14巻で一区切りになりますが、リンタの挑戦はまだ終わりません。",
"その続きは『Odds VS!』へ受けつがれ、さらに上の選手たちとの戦いが始まります。"
]},
{ cat:"m_food", title:"夏子の酒", yomi:"なつこのさけ", sub:"尾瀬あきら", author:"尾瀬あきら", authorYomi:"おぜあきら", icon:"🍶", text:[
"佐伯夏子は、東京の会社で働いている女性です。",
"夏子の実家は、新潟で日本酒を造る小さな酒蔵でした。",
"そこでは兄が、「いつか最高の日本酒を造りたい」と夢を持っていました。",
"兄が目をつけていたのは、「龍錦」という、ほとんど作られなくなったお米です。",
"この米を育て、その米だけで最高のお酒を造りたい。",
"それが兄の夢でした。",
"ところが兄は病気で亡くなってしまいます。",
"夏子は会社をやめ、故郷へ帰ります。",
"「お兄ちゃんができなかったなら、私がやる」。",
"こうして夏子は、日本酒造りの世界へ飛びこみます。",
"でも米は、種をまけば勝手に育つわけではありません。",
"農薬を減らした田んぼには虫が出ます。",
"天気が悪ければ米が育ちません。",
"いい米ができても、酒造りに失敗することもあります。",
"昔ながらの考えを持つ人から、「女に酒造りの何がわかる」と言われることもあります。",
"それでも夏子は、農家や蔵の人たちと一緒に少しずつ前へ進みます。",
"そして長い苦労の末、兄が夢見た米と、自分たちの手で造った酒を完成させます。",
"夏子が受けついだのは、お酒そのものだけではありません。",
"「本当にいいものを作りたい」という兄の思いを、自分自身の夢へ変えていく物語です。"
]},
{ cat:"m_food", title:"神の雫", yomi:"かみのしずく", sub:"原作：亜樹直　作画：オキモト・シュウ", author:"亜樹直／オキモト・シュウ", authorYomi:"あぎただし", icon:"🍷", text:[
"神咲雫は、ビール会社で働く青年です。",
"父親の神咲豊多香は、世界中に知られたワイン評論家でした。",
"ところが雫は、父親への反発もあり、ワインをほとんど飲もうとしません。",
"そんなある日、父が亡くなります。",
"父は、とても大きなワインのコレクションを残していました。",
"でも雫がその財産を受けつぐには、父が遺言に書いた十二本の「使徒」と、その上にある究極の一本「神の雫」が何なのかを当てなければなりません。",
"そして雫のライバルになるのが、ワイン評論家・遠峰一青です。",
"一青は豊多香の養子となり、雫と同じように遺産を受け取る権利を持っています。",
"雫はワイン初心者ですが、香りや味を感じる力は父から受けついでいました。",
"一口飲むと、そこから森や花、昔の記憶まで思い浮かべます。",
"雫と一青は世界中のワインを飲み、「父が言っていた景色に合う一本はどれだろう」と競争します。",
"十二本の使徒を探すうちに、雫は父親のことも少しずつ理解していきます。",
"最後の第十二の使徒までを終えたところで、雫と一青の勝負は並びます。",
"しかし「神の雫」そのものは、まだ見つかりません。",
"二人の本当の最終対決は、続編『マリアージュ〜神の雫 最終章〜』へ続いていくのでした。"
]},
{ cat:"m_food", title:"ソムリエ", sub:"原作：城アラキ　作画：甲斐谷忍", author:"城アラキ／甲斐谷忍", authorYomi:"じょうあらき", icon:"🍷", text:[
"佐竹城は、フランスで働いている若いソムリエです。",
"ソムリエとは、レストランでお客さんに合ったワインを選ぶ仕事です。",
"でも佐竹は、ただ「高いワインならおいしい」とは考えません。",
"ある人には、何十万円もするワインより、昔家族と飲んだ安いワインのほうが大切かもしれません。",
"ある人は、ワインの味より、だれと一緒に飲んだかを覚えています。",
"佐竹はお客さんの話を聞き、その人が本当に必要としている一本を探します。",
"そして佐竹自身にも、ワインにまつわる過去があります。",
"家族のことや、自分がなぜソムリエになったのか。",
"いろいろな人にワインを出すうちに、佐竹もまた、自分自身の心と向き合っていきます。",
"ライバルとなるソムリエや、ワインをお金や名声だけで見る人も現れます。",
"でも佐竹は、知識を自慢するためではなく、「目の前の人を少し幸せにするため」にワインを選びます。",
"最後まで佐竹は、一本のワインを通して人と人を結ぶソムリエとして歩いていくのでした。"
]},
{ cat:"m_food", title:"バーテンダー", sub:"原作：城アラキ　漫画：長友健篩", author:"城アラキ／長友健篩", authorYomi:"じょうあらき", icon:"🍸", text:[
"佐々倉溜は、若いバーテンダーです。",
"以前は海外でも働き、カクテルの大会で高く評価されたこともある、すごい腕の持ち主です。",
"でも溜が大切にしているのは、「自分の技を見せること」ではありません。",
"バーには、いろいろな人がやってきます。",
"仕事で失敗した人。",
"恋人と別れた人。",
"昔のことを後悔している人。",
"うれしいことがあって、だれかと乾杯したい人。",
"溜はその人の話を聞きながら、カクテルを一杯作ります。",
"「今のあなたには、これがいいと思います」。",
"同じお酒でも、作り方や出すタイミングによって、その人の心に届く一杯になります。",
"人々はお酒を飲みながら、自分の気持ちに気づいたり、もう一度前へ進む勇気を持ったりします。",
"溜自身も、先輩のバーテンダーや弟子たちと出会いながら、「本当によいバーテンダーとは何だろう」と学び続けます。",
"最後まで、派手な大会で世界一になることが目的ではありません。",
"目の前の一人に「この店へ来てよかった」と思ってもらう。",
"そんな「神のグラス」を作ることが、溜の仕事なのです。全21巻で完結しています。"
]},
{ cat:"m_food", title:"大使閣下の料理人", yomi:"たいしかっかのりょうりにん", sub:"原作：西村ミツル　作画：かわすみひろし", author:"西村ミツル／かわすみひろし", authorYomi:"にしむらみつる", icon:"🍽️", text:[
"大沢公は、腕のよい料理人です。",
"ある日、公は日本大使館で働く「公邸料理人」になります。",
"大使館には、外国の大臣や大統領、大切なお客さんがやってきます。",
"公の仕事は、その人たちへ料理を出すことです。",
"でも、ただおいしければよいわけではありません。",
"たとえば、ある国の人が食べてはいけないものを出したら大問題になります。",
"相手の国の歴史や宗教、好きなものや嫌いなものまで考えなければなりません。",
"そして、ときには一皿の料理が、国と国との話し合いをうまく進めることさえあります。",
"公はベトナムをはじめ、さまざまな場所で料理を作ります。",
"「相手は何を食べたいのか」だけではなく、「この料理で何を伝えるべきなのか」を考えます。",
"また公には日本に家族がいて、仕事と家庭のあいだで悩むこともあります。",
"料理人として成長するほど、もっと大きな仕事をまかされるようになります。",
"最後には、料理は政治の道具ではなく、人と人が心を開くためのものだと、公自身も深く知っていきます。",
"たった一皿の料理で、外国どうしの距離を少し近づける料理人のお話です。"
]},
{ cat:"m_food", title:"ラーメン発見伝", yomi:"ラーメンはっけんでん", sub:"原作：久部緑郎　作画：河合単", author:"久部緑郎／河合単", authorYomi:"くべろくろう", icon:"🍜", text:[
"藤本浩平は、会社員です。",
"でも藤本には、会社のみんなにかくしている夢がありました。",
"「いつか、自分のラーメン屋を開きたい」。",
"藤本は仕事が終わるとラーメンを食べ歩き、自分でもスープや麺を研究しています。",
"そんな藤本が出会うのが、ラーメン業界でとても有名な芹沢達也です。",
"芹沢は、味についてとてもきびしい男です。",
"藤本が「おいしいラーメンを作ればお客さんは来る」と考えていると、芹沢は言います。",
"「店は、味だけでは続かない」。",
"値段、場所、材料費、働く人の数、どんなお客さんに来てほしいのか。",
"ラーメン屋も商売です。",
"藤本は、いろいろな店の問題を手伝いながら、そのことを学びます。",
"味がよくても、お客さんのことを考えていない店。",
"昔の味にこだわりすぎて時代についていけない店。",
"はやっている店をまねするだけの店。",
"たくさんのラーメンと出会い、藤本自身の考えも変わっていきます。",
"そして最後には、会社員として隠れて研究するだけではなく、自分自身の道を選ぶところまで成長します。",
"「おいしいとは何か」「店を続けるとは何か」を、とことん考えるラーメン漫画です。"
]},
{ cat:"m_food", title:"らーめん才遊記", yomi:"らーめんさいゆうき", sub:"原作：久部緑郎　作画：河合単", author:"久部緑郎／河合単", authorYomi:"くべろくろう", icon:"🍜", text:[
"汐見ゆとりは、大学を出たばかりの女の子です。",
"ゆとりはラーメンが大好きで、「私は味がわかる！」とかなり自信を持っています。",
"そんなゆとりが就職したのが、芹沢達也の会社です。",
"芹沢は『ラーメン発見伝』にも登場した、ラーメン業界のこわいほど頭の切れる男です。",
"会社の仕事は、自分たちでラーメン屋を開くだけではありません。",
"うまくいっていないラーメン店へ行き、「どうすればお客さんが来るのか」を考える仕事もします。",
"ゆとりは最初、「おいしいラーメンを作ればいいじゃないですか」と考えます。",
"でも芹沢は何度も言います。",
"お客さんが求めている味。",
"値段。",
"店の場所。",
"メニューのわかりやすさ。",
"全部を考えなければ商売にはなりません。",
"ゆとりは持ち前の味覚で何度も芹沢を驚かせます。",
"その一方で、芹沢から「才能だけでは仕事にならない」と教えられます。",
"いくつもの店を立て直すうち、ゆとりは「ラーメンを食べる人」から「ラーメンを仕事にする人」へ変わっていきます。",
"そして芹沢自身も、若いゆとりを見ながら、かつて自分がラーメンを好きになった気持ちを思い出していくのでした。"
]},
{ cat:"m_food", title:"鉄鍋のジャン!", yomi:"てつなべのジャン", sub:"西条真二", author:"西条真二", authorYomi:"さいじょうしんじ", icon:"🥘", text:[
"秋山醤、通称ジャンは、とても腕のよい料理人です。",
"ジャンには、大きな信念があります。",
"「料理は勝負だ！」",
"お客さんを幸せにするより、とにかく相手の料理人に勝ちたい。",
"それがジャンです。",
"ジャンは中華料理店「五番町飯店」で働き始めます。",
"そこには、料理は人を思いやるものだと考える五番町霧子がいました。",
"「料理は心よ！」",
"「ちがう、料理は勝負だ！」",
"二人は何度も言い合います。",
"ジャンは料理大会へ出ると、普通の料理人では考えつかない材料や方法を使います。",
"見た目はとんでもなくても、食べてみるとものすごくおいしい。",
"そんな料理で強敵を倒します。",
"でも勝つためなら何でもするジャンのやり方は、ときには仲間まで怒らせます。",
"さまざまな料理人と戦ううち、ジャンは少しずつ、「料理を食べる相手」のことも考えるようになります。",
"それでも最後まで、急にやさしい料理人になるわけではありません。",
"「もっと強い料理人と戦いたい」。",
"ジャンは最後まで、自分らしく料理の勝負へ飛びこんでいきます。",
"勝負とおいしさがごちゃまぜになった、とてもにぎやかな中華料理漫画です。"
]},
{ cat:"m_food", title:"食戟のソーマ", yomi:"しょくげきのソーマ", sub:"原作：附田祐斗　作画：佐伯俊", author:"附田祐斗／佐伯俊", authorYomi:"つくだゆうと", icon:"🔥", text:[
"幸平創真は、父親と一緒に小さな定食屋で料理を作っている少年です。",
"創真の夢は、いつか父より上手な料理人になり、店を継ぐことでした。",
"ところが父は突然、海外へ行くと言い出します。",
"そして創真を、料理人を育てる超名門学校「遠月茶寮料理學園」へ入れてしまいます。",
"遠月では、ほとんどの生徒が卒業できません。",
"生徒たちは「食戟」という料理勝負で、技や立場までかけて戦います。",
"創真は名門料理店の子でもありません。",
"それでも、定食屋で何度も失敗と工夫を続けてきた経験を使い、エリートの生徒たちへ挑みます。",
"そこで出会うのが、神の舌と呼ばれるほど味覚のすぐれた薙切えりなです。",
"最初のえりなは、創真の料理を認めようとしません。",
"でも何度も一緒に戦ううち、創真を大切な仲間と見るようになります。",
"学校を自分の思いどおりに変えようとするえりなの父との戦いでは、生徒たちが力を合わせます。",
"創真たちは勝ち、学校を取り戻します。",
"その後も新しい料理大会へ挑み、創真は父をこえようと料理を続けます。",
"最後までえりなから「おいしい」の一言を引き出そうと、創真は新しい皿を作り続けるのでした。"
]},
{ cat:"m_food", title:"喰いタン", yomi:"くいタン", sub:"寺沢大介", author:"寺沢大介", authorYomi:"てらさわだいすけ", icon:"🕵️", text:[
"高野聖也は、探偵です。",
"でも高野には、とても変わったところがあります。",
"とにかく食べることが大好きなのです。",
"事件現場へ行っても、まず食べものを見つけます。",
"「このケーキ、おいしそうですね」。",
"「今は事件を調べてください！」",
"まわりの人はあきれます。",
"でも、高野が食べることは、ちゃんと捜査につながっています。",
"料理の味。",
"食べ残し。",
"材料。",
"におい。",
"「この料理には、本来入っていないはずのものが入っている」。",
"そんな小さなことから、高野は犯人のうそを見ぬきます。",
"殺人事件のような大きな事件もあれば、食べものにまつわるちょっとした謎もあります。",
"高野はどんなときでもよく食べます。",
"そして食べながら考えます。",
"「人は、なぜこんな料理を作ったのだろう」。",
"料理には、作った人の気持ちや生活が出ます。",
"だから高野にとって食べることは、事件を知ることでもあります。",
"最後まで「食べる探偵」という変わったスタイルをくずさず、おいしいものといっしょに事件を解いていくのでした。"
]},
{ cat:"m_food", title:"江戸前の旬", yomi:"えどまえのしゅん", sub:"原作：九十九森　作画：さとう輝", author:"九十九森／さとう輝", authorYomi:"つくもしん", icon:"🍣", text:[
"柳葉旬は、東京・銀座にある小さな寿司屋「柳寿司」の息子です。",
"旬は父から江戸前寿司の作り方を学びます。",
"魚を切って、ご飯の上にのせれば寿司になる。",
"……というほど簡単ではありません。",
"魚によって、塩をするのか、酢でしめるのか、煮るのか、寝かせるのかがちがいます。",
"旬は市場へ行き、魚のことを覚え、お客さんの好みを知り、少しずつ寿司職人になります。",
"お客さんの中には、悲しい気持ちで店へ来る人もいます。",
"家族と仲直りしたい人もいます。",
"昔食べた寿司をもう一度食べたい人もいます。",
"旬は一人一人のために、ていねいに寿司を握ります。",
"やがて旬は結婚し、子どもも生まれ、柳寿司の三代目になります。",
"そして娘のみどりも大きくなり、寿司職人の道へ興味を持つようになります。",
"つまりこの物語では、旬だけが成長するのではありません。",
"寿司屋そのものが、親から子へ、さらに次の世代へ受けつがれていくのです。",
"2026年現在も物語は続いており、近年は娘のみどりたち次の世代も大きく描かれています。"
]},
{ cat:"m_food", title:"とんかつDJアゲ太郎", spine:"とんかつDJ|アゲ太郎", yomi:"とんかつディージェイアゲたろう", sub:"原案：イーピャオ　漫画：小山ゆうじろう", author:"イーピャオ／小山ゆうじろう", authorYomi:"いーぴゃお", icon:"🎧", text:[
"勝又揚太郎は、東京・渋谷にある実家のとんかつ屋で働く青年です。",
"でも揚太郎は、毎日キャベツを切ったり、出前へ行ったりする生活に、あまり夢中になれません。",
"ある日、出前でクラブへ行った揚太郎は、DJの音楽を聞きます。",
"大きな音。",
"踊る人たち。",
"曲と曲をつなげて、会場全部を盛り上げるDJ。",
"揚太郎はびっくりします。",
"そして思います。",
"「これって、とんかつと同じじゃないか？」",
"とんかつもDJも「アゲる」。",
"油で肉を揚げることと、音楽でお客さんの気分を上げること。",
"揚太郎の頭の中で、二つがつながります。",
"それから揚太郎は昼はとんかつ屋、夜はDJとして修行を始めます。",
"最初は失敗ばかり。",
"でも有名なDJたちと出会い、大きなイベントにも出るようになります。",
"同時に、実家のとんかつの仕事にも本気で向き合うようになります。",
"昔は「家の仕事だから仕方なくやる」だけだったのに、料理も音楽も、人をよろこばせる仕事なのだと気づくのです。",
"最後にはDJとしても、とんかつ屋の息子としても、自分の道を堂々と歩いていくのでした。"
]},
{ cat:"m_food", title:"舞妓さんちのまかないさん", spine:"舞妓さんちの|まかないさん", yomi:"まいこさんちのまかないさん", sub:"小山愛子", author:"小山愛子", authorYomi:"こやまあいこ", icon:"🍚", text:[
"キヨとすみれは、青森で育った幼なじみです。",
"二人は中学校を卒業すると、京都の花街へ行きます。",
"夢は、舞妓さんになることでした。",
"すみれは踊りや礼儀の稽古をがんばり、どんどん舞妓への道を進んでいきます。",
"ところがキヨは、舞妓になるための稽古がなかなかうまくできません。",
"「私はここにいられないのかな」。",
"そう思ったキヨでしたが、ある日、屋形で料理を作ります。",
"すると、みんながとてもよろこんで食べてくれました。",
"キヨには、舞妓とは別の才能があったのです。",
"こうしてキヨは、舞妓たちの毎日の食事を作る「まかないさん」になります。",
"朝早く帰ってきた舞妓には、あたたかいご飯。",
"暑い日には食べやすいもの。",
"元気がない人には、その人が好きな料理。",
"キヨは特別なごちそうではなく、「今日もがんばろう」と思える普通のご飯を作ります。",
"すみれは舞妓として成長し、幼なじみの健太も料理人の道へ進みます。",
"三人は同じ青森から出てきましたが、それぞれちがう夢を見つけます。",
"最後には、変わっていくものも、変わらない友情も大切にしながら、それぞれが自分の道を歩いていきます。",
"作品は全31巻で完結しました。"
]},
{ cat:"m_food", title:"いつかティファニーで朝食を", spine:"いつかティファニーで|朝食を", yomi:"いつかティファニーでちょうしょくを", sub:"マキヒロチ", author:"マキヒロチ", authorYomi:"まきひろち", icon:"🥐", text:[
"佐藤麻里子は、東京で働いている女性です。",
"恋人と一緒に暮らしていましたが、生活の時間も気持ちも、だんだん合わなくなっていました。",
"ある日、麻里子は恋人と別れます。",
"「これからは、自分の時間を大事にしよう」。",
"そんな麻里子が楽しみにするのが、朝ごはんです。",
"早起きをして、おいしいパンを食べる。",
"友だちとカフェへ行く。",
"旅行先で、その土地の朝ごはんを食べる。",
"たった一食ですが、おいしい朝ごはんを食べると、「今日もやってみよう」と思えます。",
"麻里子の友だちたちにも、それぞれ悩みがあります。",
"結婚した人。",
"子どもを育てている人。",
"仕事をがんばっている人。",
"恋がうまくいかない人。",
"昔は同じように遊んでいた友だちでも、大人になると人生は少しずつちがっていきます。",
"麻里子自身も恋をしたり、仕事について考えたりしながら、自分の人生を進みます。",
"「いつか最高に幸せになる」のではありません。",
"朝ごはんを食べて、仕事へ行って、友だちと話す。",
"そういう小さな毎日の中に幸せを見つけていく物語です。"
]},
{ cat:"m_food", title:"山と食欲と私", yomi:"やまとしょくよくとわたし", sub:"信濃川日出雄", author:"信濃川日出雄", authorYomi:"しなのがわひでお", icon:"⛰️", text:[
"日々野鮎美は、会社で働く女性です。",
"休みの日になると、一人で山へ登ります。",
"鮎美は「山ガール」と呼ばれるのがあまり好きではありません。",
"自分では「単独登山女子」だと言っています。",
"朝早く家を出て、重い荷物を背負い、山道を何時間も歩きます。",
"雨が降る日もあります。",
"道に迷いそうになることもあります。",
