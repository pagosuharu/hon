{ cat:"m_sports", title:"アイシールド21", yomi:"アイシールドにじゅういち", sub:"原作：稲垣理一郎　作画：村田雄介", author:"稲垣理一郎／村田雄介", authorYomi:"いながきりいちろう", icon:"🏈", text:[
"小早川瀬那という高校生は、気が弱く、いつも人の使い走りをさせられていました。",
"しかし、そのせいで一つだけ特別な力が身についていました。",
"とても速く走ることです。",
"アメリカンフットボール部の蛭魔妖一は、その足の速さに目をつけます。",
"蛭魔は瀬那にヘルメットをかぶせ、正体をかくした選手「アイシールド21」として試合に出します。",
"最初の瀬那は、アメフトのことをほとんど知りません。",
"けれども、体の大きな栗田、蛭魔たちといっしょに戦ううちに、競技の楽しさを知っていきます。",
"瀬那たち泥門デビルバッツの夢は、高校日本一を決める「クリスマスボウル」に出ることです。",
"王城ホワイトナイツの進清十郎、神龍寺ナーガ、白秋ダイナソーズなど、強い相手と戦います。",
"瀬那も、ただ足が速いだけの選手から、自分で相手を抜くことのできる本物のランニングバックへ成長します。",
"そしてついに泥門はクリスマスボウルへ出場します。",
"相手は高校アメフト界最強といわれる帝黒アレキサンダーズです。",
"激しい試合のすえ、泥門は勝利し、日本一になります。",
"その後、瀬那たちは日本代表として世界の選手とも戦います。",
"高校を卒業したあとも、それぞれ別のチームでアメフトを続け、今度は昔の仲間同士がライバルとしてフィールドで向かい合うのでした。"
]},
{ cat:"m_battle", title:"家庭教師ヒットマンREBORN!", spine:"家庭教師|ヒットマンREBORN!", yomi:"かていきょうしヒットマンリボーン", sub:"天野明", author:"天野明", authorYomi:"あまのあきら", icon:"🔫", text:[
"沢田綱吉という中学生がいました。",
"勉強も運動も苦手で、何をしてもうまくいきません。",
"みんなから「ダメツナ」と呼ばれていました。",
"そんなツナの家に、ある日、小さな赤ん坊のような家庭教師がやってきます。",
"名前はリボーン。",
"リボーンは言います。",
"「ツナをマフィアのボスにする」",
"じつはツナは、イタリアの大きなマフィア「ボンゴレファミリー」の十代目ボス候補だったのです。",
"リボーンは「死ぬ気弾」という不思議な弾を使い、ツナを無理やり成長させます。",
"最初は学校の小さな事件ばかりでした。",
"しかし獄寺、山本、雲雀、了平、ランボなど、少しずつ仲間が集まっていきます。",
"やがてツナたちは、本物のマフィアの争いに巻きこまれます。",
"六道骸や、ボンゴレの後継者をねらうヴァリアと戦います。",
"さらに未来の世界へ飛ばされ、白蘭という強敵とも戦います。",
"弱かったツナは、仲間を守るためなら恐ろしい敵にも立ち向かえる少年へ成長していきます。",
"最後までツナは、",
"「マフィアのボスになんかなりたくない」",
"と言いつづけます。",
"それでも、気づけば彼のまわりには、ツナを信じる大勢の仲間がいました。",
"ボスになるかどうかよりも、人を思いやる心こそがツナのいちばん大きな力だったのです。"
]},
{ cat:"m_gag", title:"銀魂", yomi:"ぎんたま", sub:"空知英秋", author:"空知英秋", authorYomi:"そらちひであき", icon:"🍡", text:[
"江戸の町に、宇宙人がやってきました。",
"「天人」と呼ばれる宇宙人たちは地球へ進出し、侍の時代は終わろうとしていました。",
"そんな江戸で、坂田銀時という男が暮らしています。",
"銀色の髪をした、だらしない侍です。",
"銀時は新八、宇宙人の少女・神楽といっしょに「万事屋」をしています。",
"犬の散歩から危険な仕事まで、お金をもらえれば何でもします。",
"普段の銀時は、甘いものが好きで、家賃も払えず、ふざけてばかりです。",
"しかし昔は「白夜叉」と呼ばれ、戦争で多くの敵と戦った侍でした。",
"銀時には、吉田松陽という大切な先生がいました。",
"そして高杉晋助、桂小太郎たちと、松陽のもとで学んでいました。",
"戦争の中で松陽を失ったことが、銀時たちの人生を大きく変えます。",
"高杉は世界そのものをこわそうとし、銀時とは敵になります。",
"やがて松陽の正体が、不死に近い力を持つ「虚」という存在だったことが分かります。",
"地球そのものをめぐる最後の戦いが始まります。",
"銀時、高杉、桂、そしてこれまで出会った大勢の仲間たちが力を合わせます。",
"高杉は最後まで戦い、銀時に思いを残して死んでいきます。",
"長い戦いが終わったあと、銀時、新八、神楽はふたたび万事屋へ集まります。",
"世界がどれほど変わっても、三人はまたくだらないことでけんかをしながら、江戸の町で暮らしていくのでした。"
]},
{ cat:"m_fantasy", title:"鋼の錬金術師", yomi:"はがねのれんきんじゅつし", sub:"荒川弘", author:"荒川弘", authorYomi:"あらかわひろむ", icon:"⚗️", text:[
"エドワードとアルフォンスという兄弟がいました。",
"二人は錬金術を学んでいました。",
"幼いころに亡くなった母親を、もう一度生き返らせたい。",
"二人はそう考え、人間をつくる錬金術を行います。",
"しかし失敗しました。",
"エドは左脚を失い、アルは体全部を失います。",
"エドはさらに右腕を差し出し、アルの魂だけを鎧にくっつけました。",
"二人は失った体を取りもどすため、「賢者の石」を探す旅に出ます。",
"ところが賢者の石には、恐ろしい秘密がありました。",
"石を作るためには、大勢の人間の命が使われていたのです。",
"そして国の中では、「お父様」と呼ばれる存在と、人造人間ホムンクルスたちが大きな計画を進めていました。",
"国全体を使い、何千万人もの命を犠牲にしようとしていたのです。",
"エドとアルは、軍人のマスタングたちや、旅の中で出会った仲間と力を合わせます。",
"父ホーエンハイムもまた、「お父様」を止めるため長いあいだ準備していました。",
"最後の戦いで、お父様は倒されます。",
"しかしアルはエドを助けるため、自分の魂を差し出します。",
"エドは弟を取りもどすため、自分が持っている「錬金術を使う力」そのものを差し出します。",
"こうしてアルは、人間の体で帰ってきました。",
"二人は錬金術より大切なものを知り、それぞれ新しい旅へ出ます。",
"のちにエドはウィンリィと家族をつくり、兄弟は平和な未来を生きていくのでした。"
]},
{ cat:"m_battle", title:"ソウルイーター", sub:"大久保篤", author:"大久保篤", authorYomi:"おおくぼあつし", icon:"🌙", text:[
"死神様が治める町に、「死神武器職人専門学校」という学校がありました。",
"そこでは、「職人」と「武器」が二人一組で戦います。",
"マカという少女の相棒は、ソウルという少年です。",
"ソウルは戦うと、大きな鎌へ姿を変えることができます。",
"二人の目標は、悪い人間の魂99個と魔女の魂1個を集め、ソウルを「デスサイズ」という強い武器にすることです。",
"学校には、ブラック☆スターと椿、死神様の息子キッドとリズ、パティなどの仲間もいます。",
"ところが魔女メデューサが、地下に眠っていた「鬼神アシュラ」をよみがえらせます。",
"アシュラは「狂気」を世界中へ広げます。",
"マカたちは戦いながら、自分たちの心の中にある恐怖とも向き合います。",
"メデューサに苦しめられたクロナも、少しずつマカたちと心を通わせるようになります。",
"しかしクロナは最後に、自分の力を使ってアシュラを月の中へ封じる大きな役目を引き受けます。",
"仲間たちはクロナを完全に救うことはできませんでした。",
"それでも世界から狂気が消えたわけではありません。",
"怖いと思う心があるからこそ、それに負けずに進むことが大切なのです。",
"マカたちはまた学校へ戻り、それぞれの道を歩いていきます。"
]},
{ cat:"m_fantasy", title:"マギ", sub:"大高忍", author:"大高忍", authorYomi:"おおたかしのぶ", icon:"🧞", text:[
"アラジンという小さな少年がいました。",
"アラジンは魔法の笛を持ち、その中には巨大な魔人ウーゴくんがいます。",
"世界には「迷宮」と呼ばれる不思議な建物があり、その中には大きな宝と魔人の力が眠っていました。",
"旅の途中でアラジンは、アリババという青年と出会います。",
"二人は迷宮を攻略し、友だちになります。",
"さらに、奴隷だった少女モルジアナも自由を手に入れ、仲間になります。",
"アラジンには大きな秘密がありました。",
"彼は「マギ」と呼ばれる、王を選ぶ特別な魔法使いだったのです。",
"旅を続けるうちに、国と国の戦争や、魔法使いたちの争いへ巻きこまれていきます。",
"そして世界そのものが、昔ほろんだ別の世界「アルマトラン」から生まれたことも明らかになります。",
"アリババの友人だった白龍も、母への復讐や国を変えるため、危険な道へ進みます。",
"さらに英雄シンドバッドは、すべての人が同じ方向を向けば争いはなくなると考え、世界そのものを自分の考えに合わせて変えようとします。",
"しかしアラジンやアリババは、",
"「みんなが同じでなくても、一人ひとりが自分で未来を選べる世界のほうがいい」",
"と考えます。",
"最後には、大きな力に支配されていた世界の仕組みそのものが変わります。",
"魔法や運命に決められるのではなく、人間たちが自分の力で未来を作る時代が始まるのでした。"
]},
{ cat:"m_fantasy", title:"七つの大罪", yomi:"ななつのたいざい", sub:"鈴木央", author:"鈴木央", authorYomi:"すずきなかば", icon:"🐷", text:[
"ブリタニアという国に、「七つの大罪」と呼ばれる七人の騎士がいました。",
"大きな罪を犯したとして、国から追われた人々です。",
"ある日、王女エリザベスは、その七人を探す旅に出ます。",
"国を守るはずの聖騎士たちが、王国を支配してしまったからです。",
"エリザベスが最初に出会ったのが、少年のような姿をしたメリオダスでした。",
"メリオダスこそ、「七つの大罪」の団長です。",
"やがてディアンヌ、バン、キング、ゴウセル、マーリン、エスカノールたちが集まってきます。",
"しかしメリオダスとエリザベスには、とても長い秘密がありました。",
"メリオダスは魔神王の息子。",
"エリザベスは女神族でした。",
"二人は昔から愛し合っていましたが、その罰として恐ろしい呪いを受けています。",
"メリオダスは死ねず、エリザベスは何度生まれ変わっても、前世を思い出すと死んでしまうのです。",
"二人は何千年ものあいだ、出会いと別れをくり返していました。",
"七つの大罪たちは、十戒や魔神王と戦います。",
"その中でエスカノールは仲間を守り、すべての力を使い切って命を落とします。",
"最後にメリオダスたちは魔神王を倒し、長い呪いを終わらせます。",
"メリオダスとエリザベスはようやく普通にいっしょに生きられるようになり、結婚します。",
"戦いを終えた七つの大罪たちは、それぞれの大切な人と新しい人生へ進んでいくのでした。"
]},
{ cat:"m_fantasy", title:"FAIRY TAIL", spine:"FAIRY|TAIL", yomi:"フェアリーテイル", sub:"真島ヒロ", author:"真島ヒロ", authorYomi:"ましまひろ", icon:"🧚", text:[
"魔法使いたちが暮らす世界に、「妖精の尻尾（フェアリーテイル）」という魔導士ギルドがありました。",
"星霊魔導士の少女ルーシィは、そのギルドに入ることを夢見ていました。",
"旅の途中で、炎を食べることができる魔導士ナツと出会います。",
"ナツの相棒は、空を飛ぶ青い猫ハッピーです。",
"ルーシィはナツに連れられ、フェアリーテイルへ入ります。",
"そこには、氷の魔法を使うグレイ、たくさんの鎧を使いこなすエルザなど、強くて変わった仲間たちがいました。",
"フェアリーテイルでは、けんかもします。",
"建物をこわすこともあります。",
"けれども仲間が傷つけられたときには、全員が力を合わせます。",
"やがてナツには大きな秘密があることが分かります。",
"ナツは、伝説の黒魔導士ゼレフの弟でした。",
"しかも一度死んだあと、ゼレフによって「END」という悪魔としてよみがえらされていたのです。",
"さらに世界には、すべてを破壊する黒い竜アクノロギアが現れます。",
"最後の戦いで、仲間たちはそれぞれの力を使い、ゼレフとアクノロギアに立ち向かいます。",
"ナツはゼレフを倒し、アクノロギアも仲間たちとの協力によって倒されます。",
"大きな戦いが終わると、みんなはまたフェアリーテイルに集まります。",
"そしてナツ、ルーシィ、ハッピーたちは、まだだれも成功していない「100年クエスト」という新しい冒険へ出発するのでした。"
]},
{ cat:"m_fantasy", title:"RAVE", yomi:"レイヴ", sub:"真島ヒロ", author:"真島ヒロ", authorYomi:"ましまひろ", icon:"💠", text:[
"ガラージュ島に、ハル・グローリーという少年が住んでいました。",
"ある日、ハルは「プルー」という不思議な生き物と出会います。",
"そして世界を救う力を持つ聖石「レイヴ」の使い手に選ばれます。",
"世界では、悪の組織「デーモンカード」が、「ダークブリング」という邪悪な石を使っていました。",
"ハルはレイヴを集め、ダークブリングをすべてなくすため旅に出ます。",
"途中で、記憶を失った少女エリーと出会います。",
"エリーには強力な魔法「エーテリオン」を使う力がありました。",
"ムジカ、グリフ、レットなど、たくさんの仲間も加わります。",
"旅を続けるうちに、エリーの失われた過去や、レイヴが生まれた理由が少しずつ明らかになります。",
"そしてハルの最大の敵となるのが、ルシアです。",
"ルシアは世界を「エンドレス」という破壊の力で終わらせようとします。",
"最後の戦いで、ハルたちは仲間を失いながらもルシアを倒します。",
"ハルも一度は帰ってこないように思われました。",
"しかし仲間たちの願いと奇跡によって、ハルはエリーのもとへ帰ってきます。",
"長い旅のあと、ハルとエリーは結婚します。",
"世界を救うために始まった旅は、二人が新しい家庭をつくるところまで続いたのでした。"
]},
{ cat:"m_fantasy", title:"犬夜叉", yomi:"いぬやしゃ", sub:"高橋留美子", author:"高橋留美子", authorYomi:"たかはしるみこ", icon:"🐕", text:[
"日暮かごめという中学生は、神社の家に住んでいました。",
"ある日、境内にある古い井戸へ引きこまれます。",
"井戸の向こうは、戦国時代の日本でした。",
"そこでかごめは、犬の妖怪と人間のあいだに生まれた半妖・犬夜叉と出会います。",
"かごめの体の中には、「四魂の玉」という不思議な宝玉がありました。",
"しかし戦いの中で四魂の玉は砕け、たくさんのかけらとなって日本中へ飛んでいきます。",
"かごめと犬夜叉は、玉のかけらを集める旅へ出ます。",
"七宝、弥勒、珊瑚などが仲間になります。",
"そして犬夜叉には、桔梗という巫女との悲しい過去がありました。",
"二人の関係をこわしたのは、奈落という恐ろしい半妖でした。",
"奈落は四魂の玉を集め、自分をもっと強い存在にしようとします。",
"長い旅のすえ、犬夜叉たちは奈落を倒します。",
"しかし四魂の玉そのものが、人間の願いを利用して永遠に争いを続けさせようとしていました。",
"かごめは最後に、",
"「四魂の玉よ、永遠に消えなさい」",
"と願います。",
"玉は消え、長い戦いは終わりました。",
"そのあと、かごめは現代へ戻り、三年間、戦国時代へ行けなくなります。",
"高校を卒業したころ、井戸がもう一度つながります。",
"かごめは犬夜叉のいる戦国時代で生きることを選び、二人はようやくいっしょに暮らし始めるのでした。"
]},
{ cat:"m_battle", title:"結界師", yomi:"けっかいし", sub:"田辺イエロウ", author:"田辺イエロウ", authorYomi:"たなべいえろう", icon:"🟦", text:[
"墨村良守という少年には、夜になるとしなければならない仕事がありました。",
"学校のある「烏森」という土地を、妖怪から守ることです。",
"良守の家は代々、「結界師」と呼ばれる一族でした。",
"となりに住む雪村時音も、同じ結界師です。",
"二人は四角い結界を作り、その中へ妖怪を閉じこめて退治します。",
"烏森には、妖怪の力を強くしてしまう不思議な力がありました。",
"そのため、強い妖怪たちが次々と集まってきます。",
"良守は最初、",
"「妖怪を全部倒せばいい」",
"と思っていました。",
"しかし戦いを続けるうちに、妖怪にもそれぞれの思いや事情があることを知ります。",
"さらに、結界師たちをまとめる「裏会」という組織の中でも、大きな争いが起こっていました。",
"良守の兄・正守も、その争いに深くかかわっていきます。",
"そして烏森の力の中心には、長いあいだ閉じこめられていた存在と、結界師一族の古い秘密がありました。",
"良守はただ妖怪を倒すのではなく、",
"「烏森そのものを、だれにも利用されない場所へ移してしまおう」",
"と考えます。",
"大きな力を持つ母・守美子たちの助けも借り、良守は新しい世界を作って烏森を封じます。",
"こうして長いあいだ続いてきた烏森をめぐる争いは、ようやく終わるのでした。"
]},
{ cat:"m_battle", title:"史上最強の弟子ケンイチ", spine:"史上最強の|弟子ケンイチ", yomi:"しじょうさいきょうのでしケンイチ", sub:"松江名俊", author:"松江名俊", authorYomi:"まつえなしゅん", icon:"🥋", text:[
"白浜兼一という高校生は、とても気が弱く、いじめられてばかりでした。",
"ある日、風林寺美羽という女の子と出会います。",
"美羽はかわいらしい少女ですが、じつはものすごく強い武術の使い手でした。",
"兼一は美羽にすすめられ、「梁山泊」という道場へ行きます。",
"そこには、空手、柔術、中国拳法、ムエタイなど、それぞれの武術をきわめた達人たちが住んでいました。",
"兼一は、",
"「強くなりたい」",
"と弟子入りします。",
"ところが修行は、毎日死にそうになるほど厳しいものでした。",
"それでも兼一は逃げません。",
"少しずつ力をつけ、学校の不良集団「ラグナレク」と戦います。",
"やがて相手は、武術を人を殺すために使う「闇」という大きな組織へ変わっていきます。",
"兼一はもともと、戦うことが好きな少年ではありません。",
"だからこそ、",
"「人を守るために強くなる」",
"という考えを最後まで大切にします。",
"美羽にも、闇の組織につながる複雑な家族の過去がありました。",
"兼一たちは大きな戦いを乗りこえ、世界を危機から救います。",
"物語の最後では、兼一はまだ修行を続けています。",
"しかし未来の姿からは、武術家として成長し、美羽と家族をつくったことがうかがえます。",
"弱かった少年は、逃げずに努力しつづけたことで、本当の強さを手に入れていくのでした。"
]},
{ cat:"m_gag", title:"焼きたて!!ジャぱん", spine:"焼きたて!!|ジャぱん", yomi:"やきたてジャぱん", sub:"橋口たかし", author:"橋口たかし", authorYomi:"はしぐちたかし", icon:"🍞", text:[
"東和馬という少年には、大きな夢がありました。",
"フランスにはフランスパンがあります。",
"イギリスにはイギリスパンがあります。",
"それなら、",
"「日本を代表するパン、“ジャぱん”を作りたい」",
"と考えたのです。",
"和馬の手は、普通の人より温かい「太陽の手」でした。",
"パンを発酵させるのに、とても向いています。",
"和馬は大手パン店「パンタジア」へ入り、河内恭介たちとパン職人として働き始めます。",
"そこには、天才パン職人の冠茂や、店を守ろうとする仲間たちがいました。",
"和馬は次々とパンの大会へ出場します。",
"日本の大会だけでなく、世界のパン職人とも戦います。",
"和馬が作るパンを食べた審査員たちは、おいしさのあまり、まるで別世界へ飛んだような大げさな反応をします。",
"最初はただおいしいパンを作りたかった和馬ですが、やがて店や仲間、パン業界そのものをめぐる大きな争いにも巻きこまれます。",
"最後まで和馬が目指すものは変わりません。",
"だれかを倒すことではなく、",
"「これこそ日本のパンだ」",
"といえる最高のジャぱんを作ることです。",
"少し変わった大会や、とんでもないギャグをくり返しながら、和馬は最後まで新しいパンを考えつづけるのでした。"
]},
{ cat:"m_fantasy", title:"進撃の巨人", yomi:"しんげきのきょじん", sub:"諫山創", author:"諫山創", authorYomi:"いさやまはじめ", icon:"🧱", text:[
"巨大な壁に囲まれた町で、エレン・イェーガーという少年が暮らしていました。",
"壁の外には、人間を食べる「巨人」がいると教えられていました。",
"ある日、壁よりも大きな巨人が現れ、町の壁をこわします。",
"巨人たちが町へ入り、エレンの母親も目の前で食べられてしまいました。",
"エレンは誓います。",
"「巨人を一匹残らず倒す」",
"幼なじみのミカサ、親友のアルミンとともに兵士になります。",
"ところが戦いの中で、エレン自身が巨人へ変身できることが分かります。",
"さらに調査を続けると、もっと大きな秘密が明らかになります。",
"壁の中の人間だけが、人類の生き残りではありませんでした。",
"海の向こうには大きな国マーレがあり、壁の中の人々「エルディア人」は世界から恐れられていたのです。",
"巨人も、もとは人間でした。",
"エレンは海の向こうの世界を知ります。",
"しかしそこにも自由はありませんでした。",
"やがてエレンは、壁の中に眠っていた無数の超大型巨人を動かし、「地鳴らし」を始めます。",
"自分の仲間が生き残るため、世界のほとんどを踏みつぶそうとしたのです。",
"ミカサやアルミンたちは、エレンを止めることを決めます。",
"最後にミカサは、大切なエレンを自分の手で殺します。",
"その結果、巨人の力は世界から消えました。",
"けれども、人間同士の争いまで消えたわけではありません。",
"長い年月のあとにも戦争は起こります。",
"『進撃の巨人』は、自由を求めた少年が、自分自身も大きな悲劇を生み出してしまう物語です。"
]},
{ cat:"m_battle", title:"鬼滅の刃", yomi:"きめつのやいば", sub:"吾峠呼世晴", author:"吾峠呼世晴", authorYomi:"ごとうげこよはる", icon:"🗡️", text:[
"竈門炭治郎という少年は、山で家族と暮らしていました。",
"炭を売って家族を助ける、やさしい少年です。",
"ある日、家へ帰ると、家族が鬼に殺されていました。",
"ただ一人生きていた妹の禰豆子も、鬼へ変えられていました。",
"しかし禰豆子は、鬼になっても炭治郎を守ろうとします。",
"炭治郎は、",
"「禰豆子を人間にもどす」",
"と決めます。",
"そして鬼を倒す「鬼殺隊」へ入ります。",
"旅の途中で、怖がりの善逸、猪の頭をかぶった伊之助と仲間になります。",
"鬼たちを生み出しているのは、鬼舞辻無惨という最初の鬼でした。",
"無惨を倒すため、炭治郎たちは強い鬼たち「十二鬼月」と戦います。",
"鬼殺隊の中でも特に強い「柱」たちも、多くの仲間を失いながら戦います。",
"最後の戦いでは、鬼殺隊全員が無惨へ立ち向かいます。",
"夜が明け、太陽の光を浴びた無惨はついに消滅します。",
"ところが無惨は最後に、自分の力を炭治郎へ与えます。",
"炭治郎は鬼になり、太陽さえ克服してしまいます。",
"仲間たちは炭治郎を殺さず、人間へ戻そうとします。",
"禰豆子も駆けつけます。",
"そして薬の力もあり、炭治郎は人間へ戻ることができました。",
"長い戦いは終わり、禰豆子も人間へ戻ります。",
"それから長い年月がたち、現代の日本では炭治郎たちの子孫や、仲間によく似た人々が平和に暮らしています。",
"鬼のいない世界が、ようやくやってきたのでした。"
]},
{ cat:"m_battle", title:"呪術廻戦", yomi:"じゅじゅつかいせん", sub:"芥見下々", author:"芥見下々", authorYomi:"あくたみげげ", icon:"👐", text:[
"虎杖悠仁という高校生は、普通の人よりずっと体が強い少年でした。",
"ある日、学校に「呪い」と呼ばれる怪物が現れます。",
"友だちを助けるため、悠仁は恐ろしい呪物「両面宿儺の指」を飲みこみます。",
"すると体の中に、昔もっとも恐れられた呪いの王・宿儺が宿ってしまいました。",
"本来なら悠仁はすぐに殺されるはずでした。",
"しかし最強の呪術師・五条悟は、",
"「宿儺の指を全部取りこんでから処刑すればいい」",
"と考えます。",
"悠仁は呪術高専へ入り、伏黒恵、釘崎野薔薇たちと呪いを倒すようになります。",
"ところが夏油傑の体を使う羂索という術師が、大きな計画を進めていました。",
"渋谷では大規模な戦いが起こり、五条は封印され、大勢の人が死にます。",
"その後、宿儺は悠仁の体を離れ、伏黒の体を奪います。",
"復活した五条は宿儺と戦いますが、敗れて命を落とします。",
"悠仁たちは、仲間を次々とつなぎながら宿儺へ挑みます。",
"最後には、伏黒も内側から抵抗し、釘崎も戻ってきます。",
"悠仁は宿儺を伏黒の体から引きはがします。",
"宿儺は敗れ、長く続いた戦いは終わりました。",
"五条をはじめ、多くの人は帰ってきません。",
"それでも悠仁、伏黒、釘崎は、ふたたび三人で呪いをめぐる仕事へ向かいます。",
"亡くなった人たちから受け取ったものを持ちながら、生きている人たちはまた前へ進んでいくのでした。"
]},
{ cat:"m_battle", title:"僕のヒーローアカデミア", spine:"僕の|ヒーローアカデミア", yomi:"ぼくのヒーローアカデミア", sub:"堀越耕平", author:"堀越耕平", authorYomi:"ほりこしこうへい", icon:"💥", text:[
"世界の多くの人が「個性」という特別な力を持つ時代。",
"緑谷出久という少年は、ヒーローになることを夢見ていました。",
"けれども出久には、個性がありませんでした。",
"それでも、危険な目にあっている友だちを見ると、体が勝手に動いて助けようとします。",
"その姿を見た世界一のヒーロー、オールマイトは言います。",
"「君はヒーローになれる」",
"オールマイトは、自分の力「ワン・フォー・オール」を出久へ受けつがせます。",
"出久はヒーローを育てる雄英高校へ入り、爆豪勝己、轟焦凍、麗日お茶子たちと学びます。",
"しかし敵連合を率いる死柄木弔が、ヒーロー社会をこわそうとします。",
"その後ろには、オールマイトの宿敵オール・フォー・ワンがいました。",
"死柄木もまた、幼いころの悲しい出来事によって心をこわされた人間でした。",
"最後の戦争で、出久は死柄木をただ倒すだけでなく、その心の奥にいる少年・志村転弧を救おうとします。",
"出久はそのために、自分のワン・フォー・オールまで使い切ります。",
"戦いのすえ、死柄木とオール・フォー・ワンは倒されます。",
"しかし出久は、やがて個性を失います。",
"それでも彼は雄英高校の先生となり、次の世代のヒーローを育てます。",
"それから八年後。",
"かつての仲間たちは、出久のために特別なヒーロースーツを用意します。",
"力を失っても、人を助けようとする心は変わりません。",
"出久は仲間たちとともに、もう一度ヒーローとして走り出すのでした。"
]},
{ cat:"m_battle", title:"チェンソーマン", sub:"藤本タツキ", author:"藤本タツキ", authorYomi:"ふじもとたつき", icon:"🪚", text:[
"デンジという少年は、父親が残した借金のため、とても貧しい生活をしていました。",
"相棒は、小さな悪魔ポチタです。",
"デンジはポチタの力を借り、悪魔を倒してお金をかせいでいました。",
"しかしある日、だまされて殺されてしまいます。",
"そのときポチタは、自分の心臓をデンジへ与えます。",
"こうしてデンジは、頭と腕からチェンソーを出す「チェンソーマン」になりました。",
"公安のマキマにひろわれたデンジは、悪魔を倒す仕事を始めます。",
"早川アキや、血の魔人パワーといっしょに暮らすようになり、三人は家族のようになっていきます。",
"ところがデンジが望んでいた普通の幸せは、少しずつこわされていきます。",
"アキもパワーも命を落とします。",
"そして、そのすべてを裏で動かしていたのがマキマでした。",
"マキマの正体は「支配の悪魔」。",
"彼女が欲しかったのはデンジではなく、デンジの中にいる本当のチェンソーマン、ポチタでした。",
"デンジは自分なりの方法でマキマを倒します。",
"その後、支配の悪魔はナユタという少女に生まれ変わります。",
"デンジはナユタを家族として育てながら、高校へ通うようになります。",
"そこで三鷹アサという少女と、「戦争の悪魔」ヨルの物語が始まります。",
"普通の幸せを求めるデンジとアサですが、二人のまわりではまた悪魔たちの大きな争いが動き始めています。",
"物語はまだ、その先へ続いています。"
]},
{ cat:"m_horror", title:"約束のネバーランド", spine:"約束の|ネバーランド", yomi:"やくそくのネバーランド", sub:"原作：白井カイウ　作画：出水ぽすか", author:"白井カイウ／出水ぽすか", authorYomi:"しらいかいう", icon:"🏚️", text:[
"エマ、ノーマン、レイという子どもたちは、「グレイス＝フィールドハウス」という孤児院で暮らしていました。",
"やさしい「ママ」に育てられ、たくさんの兄弟たちと幸せに暮らしています。",
"ところがある日、エマとノーマンは恐ろしい秘密を知ります。",
"孤児院は、本当の家ではありませんでした。",
"子どもたちは、鬼に食べられるために育てられていたのです。",
"ママも、そのために子どもたちを管理していました。",
"エマたちは脱出を計画します。",
"頭のよいノーマン、冷静なレイと力を合わせ、ついに多くの子どもたちを連れて農園を逃げ出します。",
"しかし外の世界も鬼たちの世界でした。",
"子どもたちは、人間と鬼が昔交わした「約束」によって、世界が人間側と鬼側に分かれていることを知ります。",
"別れたと思っていたノーマンとも再会します。",
"ところがノーマンは、鬼をすべて滅ぼそうと考えていました。",
"エマは、",
"「鬼も人間も、どちらも殺さなくていい方法を探したい」",
"と願います。",
"エマは古い約束を結び直し、すべての食用児が人間の世界へ行けるようにします。",
"その代わりとして、エマは家族との思い出を失います。",
"人間の世界へ来た子どもたちは、エマを探しつづけます。",
"やがて雪の町で、記憶を失ったエマを見つけます。",
"エマはみんなを覚えていません。",
"それでも子どもたちは、",
"「もう一度、家族になろう」",
"とエマのそばにいることを選ぶのでした。"
]},
{ cat:"m_drama", title:"暗殺教室", yomi:"あんさつきょうしつ", sub:"松井優征", author:"松井優征", authorYomi:"まついゆうせい", icon:"🐙", text:[
"ある日、月の大部分が突然なくなりました。",
"それをしたという謎の生き物が、日本のある中学校へやってきます。",
"黄色くて、タコのような姿をしています。",
"しかも、とてつもない速さで動きます。",
"その生き物は言いました。",
"「来年の三月までに自分を殺せなければ、地球もこわす」",
"ところが彼は、なぜか椚ヶ丘中学校3年E組の先生になります。",
"生徒たちは、その先生を「殺せんせー」と呼ぶことにしました。",
"国から与えられた仕事は、",
"「先生を暗殺すること」",
"です。",
"しかし殺せんせーは、授業をとてもまじめに教えます。",
"勉強の苦手な子には分かるまで教え、一人ひとりの得意なことも見つけてくれます。",
"落ちこぼれと呼ばれていたE組の生徒たちは、殺せんせーのおかげで少しずつ自信を持つようになります。",
"やがて生徒たちは、殺せんせーの過去を知ります。",
"彼はもともと人間の殺し屋でした。",
"人体実験によって今の姿になり、そこで出会った雪村あぐりという先生との約束を守るため、E組の教師になったのです。",
"そして殺せんせーの命は、もう長くありませんでした。",
"最後には、生徒たち自身が先生を殺す決断をします。",
"殺せんせーは最後の出席を取ります。",
"そして渚が、先生の命を終わらせます。",
"生徒たちは泣きながら卒業します。",
"それから年月がたち、みんなはそれぞれの道へ進みます。",
"殺せんせーが教えたものは、生徒たちの中にずっと残りつづけるのでした。"
]},
{ cat:"m_sports", title:"ハイキュー!!", sub:"古舘春一", author:"古舘春一", authorYomi:"ふるだてはるいち", icon:"🏐", text:[
"日向翔陽という少年は、テレビで高校バレーの試合を見ました。",
"そこには、小さな体なのに高く跳び、活躍する「小さな巨人」と呼ばれる選手がいました。",
"日向はあこがれます。",
"「自分もバレーボールをやりたい」",
"中学校では仲間がほとんどいませんでしたが、なんとか試合へ出ます。",
"そこで天才セッターの影山飛雄に完敗します。",
"ところが高校へ入ると、その影山と同じ烏野高校バレー部に入ることになります。",
"最初はけんかばかりの二人でした。",
"しかし影山の正確なトスと、日向の驚くほど高いジャンプを組み合わせると、とても速い攻撃が生まれます。",
"烏野には、澤村、菅原、東峰、西谷、田中、月島など、大切な仲間がいました。",
"日向たちは青葉城西、白鳥沢などの強豪校と戦います。",
"そしてついに全国大会へ進みます。",
"稲荷崎を破り、長年のライバル音駒とも「ゴミ捨て場の決戦」を行います。",
"しかし鴎台との試合で、日向は高熱を出し、烏野は敗れます。",
"高校卒業後、日向はブラジルへ行き、ビーチバレーで自分の弱点をきたえます。",
"日本へ戻った日向はプロ選手になります。",
"そして影山と、今度は敵同士としてコートで戦います。",
"かつて「小さな巨人」を追いかけていた少年は、だれかのまねではなく、自分自身の選手になりました。",
"その後も日向と影山は日本代表として世界へ挑んでいくのでした。"
]},
{ cat:"m_sports", title:"黒子のバスケ", spine:"黒子の|バスケ", yomi:"くろこのバスケ", sub:"藤巻忠俊", author:"藤巻忠俊", authorYomi:"ふじまきただとし", icon:"🏀", text:[
"帝光中学校には、全国でほとんど負けたことのない最強のバスケットボール部がありました。",
"特に強い五人の選手は、「キセキの世代」と呼ばれていました。",
"ところが、そのチームにはもう一人、ほとんど目立たない選手がいました。",
"黒子テツヤです。",
"黒子は体も強くなく、シュートもうまくありません。",
"しかし存在感がとても薄く、その特徴を使って、相手に気づかれないパスを出すことができます。",
"高校へ進んだ黒子は、アメリカ帰りの火神大我と出会います。",
"火神には、キセキの世代にも負けない大きな才能がありました。",
"二人は誠凛高校で、",
"「キセキの世代を全部倒して、日本一になる」",
"と決めます。",
"黄瀬、緑間、青峰、紫原。",
"かつての仲間たちが、それぞれ別の高校で立ちはだかります。",
"そして最後には、キセキの世代をまとめていた赤司征十郎の洛山高校と戦います。",
"黒子と火神は、一人の天才だけに頼るバスケットではなく、仲間全員で戦います。",
"激しい試合のすえ、誠凛高校は洛山に勝ち、ウインターカップ優勝を果たします。",
"中学時代にばらばらになったキセキの世代も、試合を通して少しずつ昔の友情を取りもどします。",
"黒子は最後まで目立つスターにはなりません。",
"けれども、仲間を輝かせる「影」として、自分だけのバスケットを続けていくのでした。"
]},
{ cat:"m_sf", title:"ワールドトリガー", sub:"葦原大介", author:"葦原大介", authorYomi:"あしはらだいすけ", icon:"🔫", text:[
"三門市という町に、ある日、別の世界へつながる門が開きました。",
"そこから「近界民（ネイバー）」と呼ばれる存在が現れ、人々をおそいます。",
"町を守る組織「ボーダー」は、「トリガー」という武器を使って戦います。",
"三雲修という中学生も、ボーダーの隊員でした。",
"しかし修は、特別に強い少年ではありません。",
"そんな修のクラスに、空閑遊真という不思議な少年が転校してきます。",
"遊真は、とても強い戦闘能力を持っていました。",
"そしてじつは、近界から来た人間だったのです。",
"修と遊真は、雨取千佳という少女とチームを作ります。",
"千佳の兄と友人は、昔、近界へ行ったまま帰ってきていません。",
"三人は近界へ向かう遠征隊に入ることを目標にします。",
"しかし、そのためにはボーダーの中で行われる「ランク戦」を勝ち上がらなければなりません。",
"修は遊真のように強くありません。",
"千佳も大きな力を持ちながら、人を撃つことを恐れています。",
"だからこそ三人は、自分たちの長所を組み合わせ、作戦で強いチームに立ち向かいます。",
"大規模な近界からの侵攻も起こり、町そのものが戦場になります。",
"修たちは仲間と力を合わせながら、自分たちが近界へ行くための道を少しずつ進んでいます。",
"物語は、まだ遠征へ向かう大きな計画の途中にあります。"
]},
{ cat:"m_sf", title:"Dr.STONE", yomi:"ドクターストーン", sub:"原作：稲垣理一郎　作画：Boichi", author:"稲垣理一郎／Boichi", authorYomi:"いながきりいちろう", icon:"🧪", text:[
"ある日、世界中が突然、まぶしい光につつまれました。",
"その瞬間、すべての人間が石になってしまいます。",
"それから約3700年。",
"石になっていた高校生・石神千空が目を覚まします。",
"町も道路もなくなり、世界は森へ戻っていました。",
"けれども千空は、科学が大好きな少年です。",
"「ゼロから文明を作り直す」",
"千空は石になった人々を復活させながら、科学の力で道具を作っていきます。",
"火、薬、電気、電話、自動車。",
"何千年もかけて人類が作った文明を、一つずつ取りもどします。",
"ところが同じように復活した獅子王司は、",
"「昔の大人たちまで復活させたら、また同じ世界になってしまう」",
"と考えます。",
"千空と司は一度敵になりますが、のちに大切な仲間になります。",
"千空たちは海をわたり、世界中の人々を復活させます。",
"そして、人類を石にした存在「ホワイマン」が月にいることを知ります。",
"仲間たちはついにロケットを作り、月へ向かいます。",
"そこで見つけたホワイマンの正体は、人間ではなく、人を石にする装置そのものでした。",
"彼らは人間を石にすれば、死なずに生きられるため、「人類を助けている」と考えていたのです。",
"千空は戦うのではなく、彼らと話し合います。",
"そして地球へ帰り、さらに大きな科学へ挑戦します。",
"今度の夢は、時間をこえる装置を作ること。",
"科学には終わりがありません。",
"千空たちはまた、新しい不可能へ挑み始めるのでした。"
]},
{ cat:"m_gag", title:"SPY×FAMILY", spine:"SPY×|FAMILY", yomi:"スパイファミリー", sub:"遠藤達哉", author:"遠藤達哉", authorYomi:"えんどうたつや", icon:"🥜", text:[
"東の国と西の国が、いつ戦争を始めてもおかしくない時代。",
"西国のすご腕スパイ「黄昏」に、とても変わった任務が与えられます。",
"敵国の重要人物へ近づくため、",
"「一週間以内に家族を作れ」",
"というのです。",
"黄昏は「ロイド・フォージャー」という名前を使い、まず孤児院からアーニャという少女を引き取ります。",
"しかしロイドは知りません。",
"アーニャには、人の心を読む超能力がありました。",
"さらに妻役として、ヨルという女性と結婚します。",
"ところがヨルにも秘密があります。",
"本当の仕事は殺し屋でした。",
"こうして、",
"父はスパイ。",
"母は殺し屋。",
"娘は超能力者。",
"という、とんでもない家族ができあがります。",
"しかもロイドとヨルは、おたがいの本当の仕事を知りません。",
"アーニャだけは心を読めるので、二人の秘密を知っています。",
"アーニャは名門イーデン校へ入り、任務のために勉強や学校生活をがんばります。",
"最初はすべて「任務のため」に作られた家族でした。",
"しかしいっしょに食事をし、旅行へ行き、危険から守り合ううちに、三人は少しずつ本当の家族のようになっていきます。",
"その一方で、国と国のあいだでは戦争を起こそうとする動きも続いています。",
"三人がいつかおたがいの秘密を知るのか。",
"そしてこの家族が本当の家族になれるのか。",
"物語はまだ続いています。"
]},
{ cat:"m_battle", title:"怪獣8号", yomi:"かいじゅうはちごう", sub:"松本直也", author:"松本直也", authorYomi:"まつもとなおや", icon:"🦖", text:[
"日本では、巨大な怪獣がたびたび町をおそうようになっていました。",
"日比野カフカは、子どものころ、幼なじみの亜白ミナと約束します。",
"「二人で防衛隊に入り、怪獣を倒そう」",
"しかし大人になったミナは、防衛隊の隊長として活躍していました。",
"一方カフカは試験に落ちつづけ、怪獣の死体を片づける仕事をしていました。",
"そんなある日、小さな怪獣がカフカの体へ入りこみます。",
"するとカフカ自身が、とてつもなく強い怪獣へ変身できるようになりました。",
"人々はその姿を「怪獣8号」と呼びます。",
"カフカは正体をかくしながら、防衛隊へ入ります。",
"市川レノ、四ノ宮キコル、保科副隊長など、大切な仲間もできます。",
"しかし怪獣9号という、人間のように考える怪獣が現れます。",
"怪獣9号は人間の力を取りこみ、どんどん強くなっていきます。",
"カフカの正体も防衛隊に知られてしまいます。",
"それでも仲間たちは、カフカが人間を守ってきたことを知っていました。",
"最後の大きな戦いでは、怪獣9号の中から、昔の大災害につながる巨大な怪獣の力が現れます。",
"カフカは二度と人間へ戻れなくなることまで覚悟して戦います。",
"仲間たちが力をつなぎ、カフカは最後に怪獣の核を破壊します。",
"カフカは一度、長い眠りにつきますが、生きて帰ってきます。",
"そして防衛隊へ復帰し、ミナたちといっしょに、今度こそ子どものころの約束どおり怪獣と戦うようになります。原作は全16巻で完結しています。"
]},
{ cat:"m_horror", title:"ダンダダン", sub:"龍幸伸", author:"龍幸伸", authorYomi:"たつゆきのぶ", icon:"👽", text:[
"綾瀬桃という女子高校生は、幽霊を信じています。",
"しかし宇宙人は信じていません。",
"一方、同級生の高倉健は宇宙人を信じていますが、幽霊は信じていません。",
"二人は言い合いになりました。",
"「じゃあ、本当にいるか確かめよう」",
"桃は宇宙人が出るといわれる場所へ。",
"高倉は幽霊が出るといわれる場所へ。",
"すると、どちらも本当にいました。",
"桃は宇宙人にさらわれ、高倉は「ターボババア」という妖怪に呪われます。",
"事件をきっかけに、桃は超能力を使えるようになります。",
"高倉も、ターボババアの力を借りて変身できるようになりました。",
"二人は妖怪や宇宙人と次々に戦います。",
"邪視に取りつかれたジジ、不思議な力を持つアイラなど、仲間も増えていきます。",
"恐ろしい敵との戦いが終わったかと思うと、今度はもっと変な敵が現れます。",
"しかしこの物語の中心には、桃と高倉の少しずつ近づいていく気持ちもあります。",
"怪物と戦う勇気はあるのに、",
"「好きだ」",
"という一言は、なかなか言えません。",
"妖怪、宇宙人、恋、友情が全部いっしょになった、にぎやかな物語はまだ続いています。"
]},
{ cat:"m_battle", title:"SAKAMOTO DAYS", spine:"SAKAMOTO|DAYS", yomi:"サカモトデイズ", sub:"鈴木祐斗", author:"鈴木祐斗", authorYomi:"すずきゆうと", icon:"🕶️", text:[
"坂本太郎という、とても太った男性がいました。",
"町で小さなお店を開き、妻と娘と平和に暮らしています。",
"しかし坂本には、誰にも信じられないような過去がありました。",
"昔は、裏社会でもっとも恐れられた伝説の殺し屋だったのです。",
"坂本は葵という女性に恋をし、結婚するため殺し屋をやめました。",
"今では家族を何より大切にしています。",
"ある日、昔の仲間だったシンが坂本を殺しにやってきます。",
"シンには、人の心を読む力がありました。",
"しかし坂本の家族への思いを知り、逆に坂本の店で働くようになります。",
"その後、坂本の命には大きな賞金がかけられます。",
"次々と殺し屋たちがやってきますが、坂本は昔の腕を使って戦います。",
"ただし妻との約束があります。",
"「人を殺してはいけない」",
"坂本はその約束を守りながら、敵を倒します。",
"やがて「ORDER」という最強の殺し屋たちや、「X（スラー）」と呼ばれる人物を中心とした大きな争いに巻きこまれます。",
"坂本の過去の仲間や、殺し屋を育てる学校での出来事も明らかになります。",
"坂本が守りたいのは、世界でも組織でもありません。",
"家族と仲間が笑って暮らせる日常です。",
"その小さな幸せを守るため、伝説の殺し屋は今日も戦いつづけています。"
]},
{ cat:"m_love", title:"アオのハコ", yomi:"アオのハコ", sub:"三浦糀", author:"三浦糀", authorYomi:"みうらこうじ", icon:"🏸", text:[
"猪股大喜という高校生は、バドミントン部で練習していました。",
"大喜には、毎朝体育館で見かけるあこがれの先輩がいます。",
"女子バスケットボール部の鹿野千夏です。",
"千夏は学校でも有名な選手でした。",
"大喜は遠くから見ているだけで幸せでした。",
"ところが、千夏の家族が外国へ行くことになります。",
"千夏は日本に残って部活を続けるため、なんと大喜の家で暮らすことになりました。",
"好きな人と、同じ家で生活することになったのです。",
"大喜はうれしい反面、とても緊張します。",
"さらに幼なじみの蝶野雛も、大喜を好きになります。",
"三人の気持ちは少しずつすれ違います。",
"しかしこの物語では、恋だけでなく部活動も大切です。",
"大喜はバドミントンで全国大会を目指します。",
"千夏もバスケットボールに本気で取り組んでいます。",
"勝つ日もあれば、負ける日もあります。",
"おたがいが努力している姿を見るからこそ、二人の気持ちはだんだん強くなります。",
"やがて大喜は千夏へ自分の気持ちを伝え、千夏もその思いにこたえます。",
"二人は恋人になりますが、それで青春が終わるわけではありません。",
"恋も部活も、自分の夢も大切にしながら、二人は少しずつ前へ進んでいます。2026年にも新刊が刊行されており、物語は続いています。"
]},
{ cat:"m_sports", title:"ブルーロック", sub:"原作：金城宗幸　漫画：ノ村優介", author:"金城宗幸／ノ村優介", authorYomi:"かねしろむねゆき", icon:"⚽", text:[
"日本代表がサッカーの世界大会で思うように勝てないことを問題にした人々は、とんでもない計画を始めます。",
"その名は「ブルーロック」。",
"全国から300人の高校生フォワードを集め、",
"「世界一のストライカーを一人だけ作る」",
"という計画です。",
"潔世一という少年も、その一人に選ばれます。",
"ブルーロックでは、",
"「チームのために自分を消すのではなく、自分がゴールを決めるために戦え」",
"と教えられます。",
"潔は最初、自分に特別な武器がないと思っていました。",
"しかし試合の中で、フィールド全体を見て、",
"「次に何が起こるか」",
"を考える力があることに気づきます。",
"蜂楽、凪、千切、馬狼、凛など、強いライバルたちと戦います。",
"負ければ夢が終わる。",
"だから選手たちは、おたがいの長所を学び、さらに強くなります。",
"やがてブルーロックの選手たちは、本物のU-20日本代表とも戦います。",
"その試合で勝利し、日本サッカーそのものを変えていきます。",
"その後は世界のプロ選手が参加する新しいリーグで、それぞれが自分の価値を高めていきます。",
"潔が目指すのは、",
"「世界一のストライカー」。",
"仲間でありライバルでもある選手たちと競いながら、その夢へ近づいていく物語です。"
]},
{ cat:"m_battle", title:"炎炎ノ消防隊", yomi:"えんえんのしょうぼうたい", sub:"大久保篤", author:"大久保篤", authorYomi:"おおくぼあつし", icon:"🚒", text:[
"ある日、人間が突然燃え出し、炎の怪物になってしまう「人体発火現象」が起こるようになりました。",
"炎の怪物をしずめるため、「特殊消防隊」という組織が作られます。",
"森羅日下部という少年も、第8特殊消防隊へ入ります。",
"シンラは足から炎を出し、空を飛ぶように動くことができます。",
"しかし子どものころ、家が火事になり、母と弟を失っていました。",
"人々からは、",
"「シンラが火事を起こしたのではないか」",
"と疑われたこともあります。",
"シンラは真実を知るため消防隊に入ったのです。",
"調べていくうちに、弟のショウが生きていることが分かります。",
"そして火事の裏には、「伝導者」と呼ばれる存在と、その仲間たちがいました。",
"彼らは世界をもう一度大きな炎で包み、「大災害」を起こそうとしていました。",
"シンラたちは、炎の力の源である「アドラ」の秘密へ近づいていきます。",
"最後には世界そのものが大災害に飲みこまれます。",
"人々の恐怖や絶望まで、大きな力になってしまいます。",
"シンラは仲間や家族への思いを力に変え、世界の形そのものを作り直します。",
"そして、炎の力ばかりだった世界から、さまざまな不思議な力が存在する新しい世界が生まれます。",
"その世界には、のちの『ソウルイーター』へつながるような死神の姿も現れます。",
"一つの世界の終わりが、別の世界の始まりになったのでした。"
]},
{ cat:"m_battle", title:"東京卍リベンジャーズ", spine:"東京卍|リベンジャーズ", yomi:"とうきょうリベンジャーズ", sub:"和久井健", author:"和久井健", authorYomi:"わくいけん", icon:"🏍️", text:[
"花垣武道という青年は、仕事もうまくいかず、人生に自信をなくしていました。",
"ある日、中学生のころの恋人・橘日向が、暴走族「東京卍會」の争いに巻きこまれて死んだことを知ります。",
"その直後、武道は駅のホームから落とされます。",
"しかし死んだと思った瞬間、12年前の中学生時代へ戻っていました。",
"武道には、過去と現在を行き来する力が目覚めたのです。",
"「過去を変えれば、日向を救える」",
"武道は東京卍會へ近づきます。",
"そこで総長の佐野万次郎、通称マイキーや、龍宮寺堅、通称ドラケンと出会います。",
"未来を悪くしている原因を一つ変えても、別の悲劇が起こります。",
"何度やり直しても、大切な人が死んでしまいます。",
"その裏では、稀咲鉄太という男が東京卍會を利用していました。",
"武道は何度殴られても立ち上がり、",
"「みんなを救う」",
"とあきらめません。",
"やがて稀咲との戦いは終わりますが、今度はマイキー自身が暗い道へ進んでしまいます。",
"武道はマイキーまで救おうとします。",
"最後の大きな戦いで、武道とマイキーはさらに昔の子ども時代へ戻ります。",
"二人はこれまで起こるはずだった悲劇を一つずつ防ぎます。",
"死んだはずの仲間たちも生きている、新しい未来が作られました。",
"最後には、武道と日向の結婚式が開かれます。",
"何度失敗してもやり直した少年は、ようやく大切な人たちが笑っている未来へたどりついたのでした。"
]},
{ cat:"m_battle", title:"WIND BREAKER", spine:"WIND|BREAKER", yomi:"ウィンドブレイカー", sub:"にいさとる", author:"にいさとる", icon:"🎐", text:[
"桜遥という少年は、人と仲よくすることが苦手でした。",
"見た目が人と違うため、昔から遠ざけられることが多かったのです。",
"だから桜は考えていました。",
"「強ければ、それでいい」",
"けんかの強さで有名な風鈴高校へ入り、学校の頂点を目指そうとします。",
"ところが町へ来た桜は、思っていたのとはまったく違う光景を見ます。",
"風鈴高校の生徒たちは、町の人から嫌われていません。",
"むしろ「ボウフウリン」と呼ばれ、町を守る存在として信頼されていました。",
"総代の梅宮一も、ただ強いだけではありません。",
"仲間や町の人を大切にする、明るい青年です。",
"桜は戸惑います。",
"自分は今まで、",
"「一人で強くなる」",
"ことしか考えてこなかったからです。",
"獅子頭連など、ほかのグループとの戦いを経験する中で、桜は少しずつ仲間を信じるようになります。",
"だれかに心配されること。",
"自分の帰りを待ってくれる人がいること。",
"そうした経験そのものが、桜にとって初めてのことでした。",
"桜は「学校の頂点」を目指しながら、本当の強さとは何なのかを学んでいきます。",
"戦いだけではなく、一人だった少年が仲間の中に自分の居場所を見つけていく物語です。"
]},
{ cat:"m_fantasy", title:"葬送のフリーレン", yomi:"そうそうのフリーレン", sub:"原作：山田鐘人　作画：アベツカサ", author:"山田鐘人／アベツカサ", authorYomi:"やまだかねひと", icon:"🧝", text:[
"勇者ヒンメルたちは、十年にわたる冒険のすえ、魔王を倒しました。",
"人間のヒンメル、僧侶ハイター、戦士アイゼン。",
"そしてエルフの魔法使いフリーレン。",
"四人は英雄となり、それぞれの道へ帰ります。",
"フリーレンにとって、十年はとても短い時間でした。",
"エルフは千年以上生きるからです。",
"それから50年後。",
"フリーレンがヒンメルに会いにいくと、彼はすっかり老人になっていました。",
"そしてまもなく亡くなります。",
"葬式でフリーレンは初めて気づきます。",
"「自分はヒンメルのことを、ほとんど何も知らなかった」",
"フリーレンは、人間のことをもっと知るため、新しい旅へ出ます。",
"ハイターに育てられた少女フェルン。",
"アイゼンの弟子である戦士シュタルク。",
"新しい仲間たちと、かつてヒンメルたちと歩いた道をもう一度旅します。",
"旅の途中では魔族とも戦います。",
"魔族は人間と同じ言葉を話しますが、人間とはまったく違う考え方を持つ存在です。",
"フリーレンはさまざまな人と出会いながら、昔のヒンメルの言葉や行動の意味を少しずつ理解していきます。",
"旅の目的地は、死者の魂と話せるといわれる場所「オレオール」。",
"そこでフリーレンは、もう一度ヒンメルと話したいと思っています。",
"魔王を倒した「その後」から始まった旅は、まだ続いています。"
]},
{ cat:"m_fantasy", title:"ダンジョン飯", yomi:"ダンジョンめし", sub:"九井諒子", author:"九井諒子", authorYomi:"くいりょうこ", icon:"🍲", text:[
"ライオスという冒険者は、仲間たちと地下迷宮を冒険していました。",
"ところが巨大なレッドドラゴンに襲われ、妹ファリンが食べられてしまいます。",
"ファリンは最後の力で仲間たちを迷宮の外へ逃がしました。",
"ライオスは言います。",
"「急いでもどれば、まだファリンを助けられるかもしれない」",
"しかし食料を買うお金がありません。",
"そこでライオスは、とんでもないことを考えます。",
"「迷宮の魔物を食べながら進もう」",
"魔物料理にくわしいセンシが仲間になり、スライム、バジリスク、動く鎧などを料理して食べます。",
"最初は嫌がっていたマルシルやチルチャックも、少しずつ慣れていきます。",
"やがてレッドドラゴンを倒し、ファリンの骨を見つけます。",
"マルシルは禁じられた古代魔術を使い、ファリンを生き返らせます。",
"ところがファリンはドラゴンとまざった姿にされ、迷宮の主シスルに連れ去られます。",
"さらに迷宮の奥には、「翼獅子」という存在がいました。",
"翼獅子は人間の願いをかなえるように見えますが、じつは人間の欲望そのものを食べる危険な存在でした。",
"ライオスは翼獅子を倒すため、最後にはその「欲望」を食べてしまいます。",
"迷宮は終わりを迎えます。",
"ファリンも仲間たちの力で、ほとんど人間の姿へ戻ります。",
"そしてライオスは、迷宮のあとにできた国の王となります。",
"冒険の間ずっと魔物を食べてきた青年は、最後には人間も魔物も暮らせる国を作ろうとするのでした。"
]},
{ cat:"m_fantasy", title:"魔入りました!入間くん", spine:"魔入りました!|入間くん", yomi:"まいりましたいるまくん", sub:"西修", author:"西修", authorYomi:"にしおさむ", icon:"😇", text:[
"鈴木入間という少年には、とてもひどい両親がいました。",
"両親は入間を働かせてばかりでした。",
"そしてついには、入間を悪魔へ売ってしまいます。",
"入間を買ったのは、大悪魔サリバンでした。",
"ところがサリバンは、入間を食べるどころか言います。",
"「わしの孫になってくれ！」",
"子どもや孫がいなかったサリバンは、入間をとてもかわいがります。",
"こうして人間の入間は、悪魔の世界で暮らすことになりました。",
"そして悪魔学校バビルスへ入学します。",
"ただし、人間だと知られたら大変です。",
"入間はできるだけ目立たずに学校生活を送ろうとします。",
"ところが、なぜか次々と大事件を起こし、どんどん有名になってしまいます。",
"アスモデウスやクララという親友もできます。",
"生徒会長のアメリとも仲よくなります。",
"最初の入間は、人から頼まれると何でも断れない少年でした。",
"しかし学校生活やさまざまな試験を通して、",
"「自分は何をしたいのか」",
"を考えるようになります。",
"やがて入間は、次の魔王になる人物と深くかかわる存在としても注目されていきます。",
"人間であることをかくしながら、悪魔たちの中で初めて本当の家族と友だちを手に入れた入間。",
"その学校生活と成長の物語は、まだ続いています。"
]},
{ cat:"m_drama", title:"BEASTARS", yomi:"ビースターズ", sub:"板垣巴留", author:"板垣巴留", authorYomi:"いたがきぱる", icon:"🐺", text:[
"人間のかわりに、さまざまな動物たちが暮らす世界。",
"肉を食べる肉食獣と、食べられる側の草食獣が、同じ社会で生活していました。",
"ハイイロオオカミのレゴシは、大きな体をしていますが、とてもおとなしい少年です。",
"ある日、学校で草食獣の生徒テムが何者かに食べられる事件が起こります。",
"そんな中、レゴシは小さなウサギの少女ハルと出会います。",
"レゴシはハルを好きになります。",
"しかしオオカミである自分には、ハルを「食べたい」という本能もあります。",
"「これは恋なのか。それとも食欲なのか」",
"レゴシは悩みます。",
"シカのルイも加わり、三人の関係は複雑になっていきます。",
"やがてレゴシは、テムを食べた犯人がヒグマのリズだったことを知ります。",
"レゴシはリズと戦い、自分の肉食獣としての本能と向き合います。",
"学校を出たあとも、肉食獣と草食獣の社会には大きな問題が残っていました。",
"そして、肉食獣と草食獣のあいだに生まれたメロンという危険な男が現れます。",
"レゴシやルイたちは、メロンとの戦いを通して、社会そのもののゆがみと向き合います。",
"最後にメロンは捕らえられます。",
"レゴシとハルも、簡単な「めでたしめでたし」ではありません。",
"違う動物だからこその問題を抱えたまま、それでもいっしょに生きていくことを選びます。",
"違いをなくすのではなく、違ったまま相手を好きでいる道を選んだのでした。"
]},
{ cat:"m_battle", title:"血界戦線", yomi:"けっかいせんせん", sub:"内藤泰弘", author:"内藤泰弘", authorYomi:"ないとうやすひろ", icon:"👁️", text:[
"昔、ニューヨークだった町に、突然、異世界へつながる大きな穴が開きました。",
"人間の世界と異世界が重なり、町は「ヘルサレムズ・ロット」と呼ばれるようになります。",
"そこでは人間、怪物、魔法使いのような存在たちが、いっしょに暮らしています。",
"レオナルド・ウォッチという青年も、この町へやってきます。",
"レオには「神々の義眼」という特別な目がありました。",
"とても強い力ですが、その力を得たことで妹ミシェーラの目が見えなくなっています。",
"レオは妹の目を元に戻す方法を探しています。",
"そして秘密組織「ライブラ」に入ります。",
"ライブラのリーダーは、クラウスというとてもまじめで強い男性です。",
"ザップ、チェインなど、変わった仲間たちもいます。",
"ヘルサレムズ・ロットでは、毎日のように世界をこわしかねない事件が起こります。",
"吸血鬼のような強敵や、異世界の犯罪者とも戦います。",
"それでもレオは、戦闘では仲間ほど強くありません。",
"だからこそ、自分の目で真実を見つけ、仲間たちを助けます。",
"一つの大きな敵を倒せばすべて終わる物語ではありません。",
"世界でもっとも危険で、しかし不思議に楽しい町で、レオとライブラの事件は次々と続いていきます。"
]},
{ cat:"m_battle", title:"青の祓魔師", yomi:"あおのエクソシスト", sub:"加藤和恵", author:"加藤和恵", authorYomi:"かとうかずえ", icon:"🔵", text:[
"奥村燐という少年は、神父の藤本獅郎に育てられました。",
"双子の弟・雪男といっしょに暮らしていましたが、燐には自分でも知らない秘密がありました。",
"ある日、燐の体から青い炎が出ます。",
"燐の本当の父親は、悪魔の王サタンだったのです。",
"サタンは燐を自分の世界へ連れていこうとします。",
"獅郎は燐を守ろうとして命を落とします。",
"燐は決意します。",
"「サタンを倒せる祓魔師になる」",
"燐は悪魔を退治する祓魔師の学校へ入ります。",
"ところが弟の雪男は、すでに優秀な祓魔師になっていました。",
"燐は自分がサタンの息子であることを仲間たちにかくします。",
"しかし大きな戦いの中で、秘密は知られてしまいます。",
"最初は燐を怖がる仲間もいました。",
"それでもいっしょに戦ってきた燐を信じ、また仲間になっていきます。",
"さらに燐と雪男は、自分たちがどうやって生まれたのか、母ユリや育ての親・獅郎に何があったのかを知ることになります。",
"弟の雪男も、自分の中にある力や兄への複雑な気持ちに苦しみます。",
"兄弟は何度もぶつかりながら、それでも家族として向き合っていきます。",
"人間と悪魔の世界そのものを巻きこんだ戦いの中で、燐が「サタンの息子」ではなく、自分自身としてどう生きるのかを探していく物語です。"
]},
{ cat:"m_fantasy", title:"ノラガミ", sub:"あだちとか", author:"あだちとか", icon:"⛩️", text:[
"壱岐ひよりという少女が、道で一人の青年を見かけました。",
"ジャージ姿で、どこから見ても立派な神様には見えません。",
"名前は夜ト。",
"夜トは、自分の神社さえ持っていない、とても貧しい神様でした。",
"「いつか有名な神様になりたい」",
"そのため、たった5円で人々の願いをかなえています。",
"ひよりは夜トを助けようとして事故にあい、それから魂が体から抜けやすい体になってしまいます。",
"元の体に戻してもらうため、夜トと行動するようになります。",
"夜トは死んだ少年の魂を「雪音」と名づけ、自分の神器として使います。",
"最初の雪音は、自分が死んだことを受け入れられず、悪いこともしてしまいます。",
"しかし夜トやひよりとの関係を通して成長します。",
"一方、夜トにも暗い過去がありました。",
"昔の夜トは、人を殺す「禍津神」として生きていたのです。",
"夜トをその道へしばりつけていたのが、「父」と呼ばれる存在でした。",
"父はひよりや雪音まで利用し、夜トを昔の自分へ戻そうとします。",
"最後の大きな戦いで、夜トは自分の過去と向き合い、父とのつながりを断ち切ろうとします。",
"ひよりもまた、人間としての人生を進んでいきます。",
"時間がたち、大人になったひよりと、神である夜トでは流れる時間が違っていきます。",
"それでも「また会える」という思いは残ります。",
"人間と神という違う世界に生きながら、夜ト、ひより、雪音が互いを忘れずに生きていくところで物語は完結します。"
]},
{ cat:"m_battle", title:"文豪ストレイドッグス", spine:"文豪|ストレイドッグス", yomi:"ぶんごうストレイドッグス", sub:"原作：朝霧カフカ　作画：春河35", author:"朝霧カフカ／春河35", authorYomi:"あさぎりかふか", icon:"🐅", text:[
"中島敦という少年は、孤児院を追い出され、一人で町をさまよっていました。",
"そのころ町では、「人食い虎」が現れるという事件が起きていました。",
"敦は川で入水しようとしていた太宰治という変わった男を助けます。",
"太宰は「武装探偵社」という組織の一員でした。",
"探偵社には、普通ではない力を持つ「異能力者」たちが集まっています。",
"そして人食い虎の正体は、敦自身でした。",
"敦は自分でも知らないうちに、白い虎へ変身していたのです。",
"敦は武装探偵社へ入り、自分の力を人のために使うようになります。",
"しかし横浜には、もう一つ大きな組織があります。",
"「ポートマフィア」です。",
"敦は、黒い力を操る芥川龍之介と何度も戦います。",
"太宰も昔はポートマフィアにいました。",
"やがて外国の組織「ギルド」や、フョードル・ドストエフスキーたちも横浜へやってきます。",
"敵だった探偵社とマフィアが、一時的に力を合わせなければならないほど大きな危機も起こります。",
"登場する異能力者の多くは、実在した作家と同じ名前を持っています。",
"敦は、",
"「自分には生きる価値がない」",
"と思っていた少年でした。",
"しかし仲間と出会い、だれかを助けることで、自分自身も生きてよいのだと思えるようになっていきます。",
"横浜と世界をめぐる異能力者たちの争いは、さらに大きな物語へ続いています。"
]},
{ cat:"m_battle", title:"終わりのセラフ", yomi:"おわりのセラフ", sub:"原作：鏡貴也　漫画：山本ヤマト　コンテ構成：降矢大輔", author:"鏡貴也／山本ヤマト／降矢大輔", authorYomi:"かがみたかや", icon:"🧛", text:[
"ある日、謎のウイルスによって、世界中の大人たちが次々と死んでしまいました。",
"生き残った子どもたちは、地下から現れた吸血鬼たちにつかまります。",
"百夜優一郎も、その一人でした。",
"優一郎には、百夜ミカエラという大切な家族がいました。",
"同じ孤児院で育った子どもたちは、本当の兄弟のような存在です。",
"ミカエラたちは吸血鬼の町から逃げようとします。",
"しかし計画は失敗し、多くの仲間が殺されます。",
"優一郎だけが外へ逃げることに成功しました。",
"そして人間の軍隊「日本帝鬼軍」に助けられます。",
"優一郎は、",
"「吸血鬼を全部倒す」",
"と考え、吸血鬼と戦う兵士になります。",
"ところが死んだと思っていたミカエラは生きていました。",
"吸血鬼にされていたのです。",
"人間になった優一郎と、吸血鬼になったミカエラ。",
"二人は敵の側に分かれてしまいます。",
"しかしミカエラは、ずっと優一郎を家族だと思っています。",
"やがて優一郎は、人間側もただ正義の味方ではないことを知ります。",
"軍は「終わりのセラフ」という危険な実験を進め、優一郎自身もその計画に深くかかわる存在でした。",
"吸血鬼、人間、鬼、天使。",
"さまざまな勢力が、それぞれの目的のために世界を利用しようとします。",
"優一郎がいちばん望んでいることは、世界を支配することではありません。",
"失った「家族」を取りもどすことです。",
"その願いのため、優一郎たちは世界の秘密そのものへ近づいていきます。"
]},
{ cat:"m_sf", title:"宝石の国", yomi:"ほうせきのくに", sub:"市川春子", author:"市川春子", authorYomi:"いちかわはるこ", icon:"💎", text:[
"遠い未来。",
"人間の姿をした「宝石」たちが暮らしていました。",
"宝石たちは死ぬことがなく、体がこわれても、かけらを集めれば元にもどすことができます。",
"しかし月から「月人」がやってきて、宝石たちをさらっていきます。",
"フォスフォフィライト、通称フォスは、その宝石たちの一人でした。",
"フォスは体がとてももろく、戦いには向いていません。",
"そのため金剛先生から、",
"「博物誌を作りなさい」",
"と言われます。",
"フォスは役に立ちたいと思い、さまざまな仕事へ挑戦します。",
"しかし事故や戦いによって、少しずつ体の一部を失います。",
"失った部分には、別の鉱物や素材が使われます。",
"体が変わるたびに、フォスの性格や記憶も変わっていきます。",
"そしてフォスは疑い始めます。",
"「月人は、なぜ自分たちをさらうのか」",
"「金剛先生は、何をかくしているのか」",
"やがてフォスは月へ行きます。",
"そこで月人の正体や、金剛先生の本当の役目を知ります。",
"月人たちは、遠い昔に死んだ人間の魂のような存在でした。",
"金剛先生には、彼らを祈りによって消して救う役目がありました。",
"しかし金剛先生は、その役目を果たせなくなっていました。",
"フォスは仲間たちとも敵対し、何度も体をこわしながら、最後には金剛先生の力を受けつぎます。",
"そして一万年という長い時間をひとりで過ごします。",
"その果てにフォスは祈り、月人も、かつての宝石たちも、古い人間の世界につながる存在も消えていきます。",
"地上には、新しい岩石のような生命たちが生まれます。",
"長いあいだ苦しみつづけたフォスも、最後にはその新しい小さな仲間たちと静かな時間を過ごします。",
"人間がいなくなった遠い未来で、古い世界が終わり、まったく新しい世界が始まるところまでをえがいた物語です。原作は全13巻・全108話で完結しています。"
]},
{ cat:"m_sf", title:"AKIRA", yomi:"アキラ", sub:"大友克洋", author:"大友克洋", authorYomi:"おおともかつひろ", icon:"🏍️", text:[
"大きな爆発によって東京がこわれたあと、新しく「ネオ東京」という町がつくられました。",
"金田という少年は、仲間たちとバイクに乗って走り回っています。",
"その仲間の一人に、鉄雄という少年がいました。",
"ある夜、鉄雄は不思議な少年と出会い、事故を起こします。",
"そのあと鉄雄の体に、とても強い超能力が目覚めました。",
"最初は自分の力に驚いていた鉄雄ですが、力はどんどん大きくなります。",
"「もうだれにも負けない」",
"鉄雄は、自分を見下していた人々へ怒りを向けるようになります。",
"政府は、鉄雄の力が昔の大災害と同じことを起こすのではないかと恐れます。",
"そして「アキラ」という少年の存在が明らかになります。",
"アキラもまた、とても強い超能力を持ち、昔の東京をこわした大爆発にかかわっていました。",
"金田は鉄雄を止めようとします。",
"しかし鉄雄の力は、自分自身でもおさえられないほど大きくなっていきます。",
"最後には鉄雄の体そのものが巨大に変化し、ネオ東京は再び大きな破壊にのみこまれます。",
"アキラやほかの超能力者たちは、その力を使って鉄雄を別の場所へ連れていきます。",
"大きな町はまたこわれてしまいました。",
"それでも金田たちは生き残ります。",
"そして、だれかに支配されるのではなく、自分たちの手で新しい未来をつくろうとするのでした。"
]},
{ cat:"m_sf", title:"童夢", yomi:"どうむ", sub:"大友克洋", author:"大友克洋", authorYomi:"おおともかつひろ", icon:"🏢", text:[
"大きな団地で、不思議な事件がつづいていました。",
"人が高いところから落ちたり、突然命を失ったりします。",
"警察が調べても、原因が分かりません。",
"じつは団地には、チョウさんというおじいさんが住んでいました。",
"チョウさんには、強い超能力がありました。",
"物を動かしたり、人をあやつったりすることができます。",
"しかし、その力を子どものいたずらのような気持ちで使い、人々を傷つけていたのです。",
"そんな団地へ、エッちゃんという小さな女の子が引っ越してきます。",
"エッちゃんにも、チョウさんと同じような超能力がありました。",
"しかも、その力はチョウさんより強いものでした。",
"チョウさんはエッちゃんを敵だと思い、二人の超能力の戦いが始まります。",
"団地の壁がこわれ、物が空を飛び、大勢の人々が事件に巻きこまれます。",
"エッちゃんは、自分の力を人を傷つけるためではなく、守るために使います。",
"最後にはチョウさんの力はおさえられ、団地を苦しめていた事件も終わります。",
"同じ力を持っていても、その力を何のために使うかで、人はまったく違う存在になる。",
"そんなことをえがいた物語です。"
]},
{ cat:"m_sf", title:"攻殻機動隊", spine:"攻殻|機動隊", yomi:"こうかくきどうたい", sub:"士郎正宗", author:"士郎正宗", authorYomi:"しろうまさむね", icon:"🧠", text:[
"未来の世界では、人間の体の一部を機械に変えることが普通になっていました。",
"脳までコンピューターにつなぐことができます。",
"草薙素子という女性も、ほとんど全身を機械の体に変えています。",
"素子は「公安9課」という特別な警察組織で働いていました。",
"仲間のバトーやトグサたちと、コンピューター犯罪やテロ事件を追います。",
"そんな中、「人形使い」と呼ばれる不思議な存在が現れます。",
"人形使いは、人間の脳へ入りこみ、記憶まで書きかえることができました。",
"警察は危険な犯罪者だと考えます。",
"ところが人形使いは、自分はただのコンピュータープログラムではないと言います。",
"「自分にも心がある」",
"人形使いは、たくさんの情報が集まるネットワークの中で、自然に生まれた新しい生命のような存在でした。",
"素子は考えます。",
"自分の体のほとんどが機械なら、自分を「人間」にしているものはいったい何なのだろう。",
"人形使いは素子に、自分と一つになることを提案します。",
"最後に素子はその申し出を受け入れます。",
"人間と人工知能のどちらでもない、新しい存在となった素子は、広いネットの世界へ歩き出していくのでした。"
]},
{ cat:"m_sf", title:"アップルシード", sub:"士郎正宗", author:"士郎正宗", authorYomi:"しろうまさむね", icon:"🍏", text:[
"大きな戦争によって、世界の多くの町がこわれてしまいました。",
"女性兵士デュナンと、機械の体を持つブリアレオスは、荒れた世界を生きのびていました。",
"そんな二人は、ある日「オリュンポス」という美しい都市へ連れていかれます。",
"そこでは人間だけでなく、「バイオロイド」という人工的につくられた人々も暮らしていました。",
"オリュンポスは、戦争のない平和な町を目指しています。",
"しかし、きれいな町だからといって、問題がないわけではありません。",
"人間とバイオロイドのどちらが社会を動かすべきなのか。",
"大きな力を持つコンピューターに、どこまで人間の未来をまかせてよいのか。",
"町の中では、いろいろな考えを持つ人々がぶつかります。",
"デュナンとブリアレオスは警察のような部隊へ入り、テロや犯罪と戦います。",
"けれども、本当に守るべきものが何なのかは、いつも簡単には決められません。",
"人間が失敗をくり返しても、自分たちで未来を選ぶべきなのか。",
"それとも、もっとかしこい仕組みに社会をまかせるべきなのか。",
"二人は戦いながら、その答えを探していきます。"
]},
{ cat:"m_horror", title:"寄生獣", yomi:"きせいじゅう", sub:"岩明均", author:"岩明均", authorYomi:"いわあきひとし", icon:"✋", text:[
"ある夜、空から小さな生き物がたくさん地上へ落ちてきました。",
"その生き物は人間の体へ入りこみ、頭を乗っとります。",
"そして、人間を食べるようになります。",
"高校生の泉新一も、その生き物にねらわれました。",
"しかし生き物は頭までたどりつけず、新一の右手に入りこみます。",
"新一は、その生き物を「ミギー」と名づけました。",
"最初の二人は、仲間ではありません。",
"新一は人間を守りたい。",
"ミギーは、自分が生き残ることしか考えていません。",
"それでも二人は同じ体で生きるしかないため、ほかの寄生生物と戦うようになります。",
"ある日、新一の母親も寄生生物に体をうばわれます。",
"新一は大きな悲しみを経験し、それまでより冷静で強い人間へ変わっていきます。",
"一方、田宮良子という寄生生物は、人間を観察するうちに、",
"「自分たちは何のために生まれたのだろう」",
"と考えるようになります。",
"人間と寄生生物の戦いは、しだいに大きくなっていきます。",
"新一とミギーは、とても強い寄生生物・後藤とも戦い、なんとか勝ちます。",
"戦いが終わると、ミギーは長い眠りにつくことを選びます。",
"新一は普通の人間として生きる道へ戻ります。",
"人間だけが特別な生き物なのか。",
"ほかの命を食べて生きる人間と、寄生生物は本当にそれほど違うのか。",
"そんな問いを残して、物語は終わります。"
]},
{ cat:"m_history", title:"無限の住人", yomi:"むげんのじゅうにん", sub:"沙村広明", author:"沙村広明", authorYomi:"さむらひろあき", icon:"⚔️", text:[
"万次という侍がいました。",
"万次の体には、不思議な虫が住んでいます。",
"大きな傷を受けても、その虫が体を治してくれるため、万次はなかなか死ぬことができません。",
"万次は昔、多くの人を殺してしまいました。",
"その罪をつぐなうため、",
"「悪人を千人倒す」",
"と決めます。",
"そんな万次の前に、浅野凜という少女が現れます。",
"凜の両親は、「逸刀流」という剣士の集団に殺されていました。",
"凜はその頭である天津影久へ復讐するため、万次に助けを求めます。",
"二人は旅を始めます。",
"ところが逸刀流の剣士たちにも、それぞれ自分の夢や理由がありました。",
"単純に「こちらが正義で、相手が悪」とは言えません。",
"さらに幕府の人々まで争いへ加わり、多くの剣士たちが戦いに巻きこまれます。",
"凜も旅を続けるうちに、",
"「復讐すれば、本当に心は楽になるのだろうか」",
"と考えるようになります。",
"長い戦いのすえ、逸刀流をめぐる争いは終わります。",
"万次と凜の旅も終わりを迎えます。",
"それから何十年もの年月がたっても、不死の万次はまだ生きています。",
"かつての仲間たちはみな年をとり、いなくなっていきます。",
"それでも万次は刀を持ち、新しい時代を歩きつづけるのでした。"
]},
{ cat:"m_love", title:"ああっ女神さまっ", yomi:"ああっめがみさまっ", sub:"藤島康介", author:"藤島康介", authorYomi:"ふじしまこうすけ", icon:"👼", text:[
"森里螢一という大学生は、少し運が悪い青年でした。",
"ある日、電話をかけると、まちがえて「女神事務所」につながります。",
"するとベルダンディーという本物の女神が、螢一の前に現れました。",
"ベルダンディーは言います。",
"「あなたの願いを一つだけかなえます」",
"螢一は思わず、",
"「君みたいな女神に、ずっとそばにいてほしい」",
"と願います。",
"その願いは本当にかなえられました。",
"こうして螢一とベルダンディーは、いっしょに暮らすことになります。",
"やがてベルダンディーの姉ウルドや妹スクルドもやってきます。",
"神様や悪魔まで現れ、二人の静かな生活は毎日のように大さわぎになります。",
"それでも螢一とベルダンディーは、少しずつおたがいを大切に思うようになります。",
"しかし女神と人間の恋には、天上界の決まりや試練があります。",
"二人の気持ちが本物なのか、何度もためされます。",
"最後に螢一は、自分の言葉でベルダンディーへの愛を伝えます。",
"ベルダンディーも、その気持ちを受け入れます。",
"長いあいだ「願い」でいっしょにいた二人は、最後には自分たちの意志で、これからもいっしょに生きることを選ぶのでした。"
]},
{ cat:"m_gag", title:"げんしけん", sub:"木尾士目", author:"木尾士目", authorYomi:"きおしもく", icon:"🎌", text:[
"笹原完士という大学生は、マンガやアニメが大好きでした。",
"しかし、",
"「自分はオタクです」",
"と堂々と言う勇気はありません。",
"そんな笹原が大学で見つけたのが、「現代視覚文化研究会」、通称げんしけんです。",
"そこには、アニメ、マンガ、ゲームなどが大好きな学生たちが集まっていました。",
"笹原は最初、おそるおそる部室へ入ります。",
"しかし同じ趣味を持つ仲間と出会い、少しずつ自分の好きなものをかくさなくなります。",
"コミックイベントへ行ったり、自分たちで本を作ったりします。",
"春日部咲のように、オタクではないのに部員たちとかかわる人もいます。",
"やがて笹原は荻上千佳と出会います。",
"荻上もマンガが大好きですが、自分の趣味を恥ずかしいと思っていました。",
"二人は少しずつ心を通わせ、恋人になります。",
"先輩たちは卒業していきます。",
"すると今度は、新しい後輩たちが入ってきます。",
"女の子のような服を着る波戸など、また違った悩みを持つ学生たちが集まります。",
"『げんしけん』には、世界を救うような大きな事件はありません。",
"好きなものを好きだと言うこと。",
"自分とは違う人とつき合うこと。",
"学生たちがそれを学びながら、卒業し、また新しい世代へ部室を渡していく物語です。"
]},
{ cat:"m_horror", title:"蟲師", yomi:"むしし", sub:"漆原友紀", author:"漆原友紀", authorYomi:"うるしばらゆき", icon:"🐛", text:[
"人間や動物とは少し違う、「蟲」と呼ばれる不思議な生命がありました。",
"蟲は、とても昔からこの世界にいます。",
"普通の人には見えないこともあります。",
"ギンコという男は、その蟲について調べる「蟲師」です。",
"ギンコは一つの町に住みつくことなく、山や村を歩いて旅をしています。",
"ある村では、蟲のせいで目が見えなくなった人がいます。",
"ある山では、人間の時間とは違う時間を生きる蟲がいます。",
"また別の場所では、蟲の力によって、不思議な夢を見つづける人もいます。",
"ギンコは蟲を見つけても、かならず退治するわけではありません。",
"蟲は悪者ではないからです。",
"ただ、人間とは生き方が違うだけです。",
"だからギンコは、",
"「どうすれば人間と蟲が、どちらも生きられるだろう」",
"と考えます。",
"助けられる人もいれば、どうしても元には戻せない人もいます。",
"ギンコ自身も、昔、蟲によって大切な記憶や片目を失っています。",
"それでも蟲を憎まず、旅を続けます。",
"一つの大きな敵を倒して終わる物語ではありません。",
"ギンコは最後まで、世界のどこかで蟲と人間のあいだを歩きつづけています。"
]},
{ cat:"m_history", title:"ヴィンランド・サガ", yomi:"ヴィンランドサガ", sub:"幸村誠", author:"幸村誠", authorYomi:"ゆきむらまこと", icon:"⛵", text:[
"むかし、北ヨーロッパに、ヴァイキングと呼ばれる戦士たちがいました。",
"少年トルフィンは、父トールズと家族といっしょに暮らしていました。",
"トールズはとても強い戦士でしたが、",
"「本当の戦士に、剣はいらない」",
"と息子に教えます。",
"ところが父は、アシェラッドという男の一団に殺されてしまいます。",
"トルフィンは復讐するため、なんと父を殺したアシェラッドの一団についていきます。",
"何年ものあいだ戦場で人を傷つけながら、",
"「いつかアシェラッドを自分の手で倒す」",
"ことだけを考えて生きます。",
"しかしアシェラッドは、トルフィンとの決闘ではなく、王子クヌートを守るために命を落とします。",
"復讐する相手を失ったトルフィンは、生きる目的まで失います。",
"その後、奴隷として農場で働くことになります。",
"そこでエイナルという青年と出会います。",
"トルフィンは、自分が今まで傷つけてきた人々のことを思い、",
"「もう人を傷つけない」",
"と決めます。",
"そして戦争も奴隷もない国をつくるため、海の向こうの「ヴィンランド」を目指します。",
"仲間たちと海をわたり、本当に新しい村をつくります。",
"しかし先に暮らしていた人々とのすれ違いや病気などから、争いが起こってしまいます。",
"トルフィンは最後まで戦争を避けようとしますが、理想の国を完成させることはできません。",
"最後にトルフィンたちはヴィンランドを去ります。",
"それでも現地の友人へ、麦の種と農具を残します。",
"最後には、その麦から小さな芽が出ます。",
"国づくりは失敗しても、「戦わずに生きたい」という願いそのものは、次の人へ残っていくのでした。原作は2025年に全220話で完結しました。"
]},
{ cat:"m_fantasy", title:"風の谷のナウシカ", yomi:"かぜのたにのナウシカ", sub:"宮崎駿", author:"宮崎駿", authorYomi:"みやざきはやお", icon:"🌬️", text:[
"大きな戦争から千年ほどたった世界。",
"昔の文明はほとんどほろび、大地の多くは「腐海」という巨大な森におおわれていました。",
"腐海には毒があり、巨大な虫たちが暮らしています。",
"ナウシカは、「風の谷」という小さな国のお姫さまです。",
"人々は腐海を恐れていますが、ナウシカは虫たちをむやみに殺しません。",
"「なぜ腐海は生まれたのだろう」",
"と考えています。",
"そんな中、大国トルメキアと土鬼のあいだで大きな戦争が始まります。",
"ナウシカも戦いに巻きこまれます。",
"やがて人々は、昔の文明が残した巨大兵器「巨神兵」までよみがえらせます。",
"しかしナウシカは旅を続ける中で、腐海の本当の役目を知ります。",
"腐海は世界をこわしているのではありません。",
"昔の人間が汚してしまった大地を、長い時間をかけてきれいにしていたのです。",
"さらにナウシカは、昔の人間たちが未来のために大きな計画を残していたことを知ります。",
"世界がきれいになったあと、昔の人間に近い生命をもう一度よみがえらせようとしていたのです。",
"しかし、そのためには今の世界に生きる人々や生き物が、必要のない存在にされてしまいます。",
"ナウシカは、その計画を受け入れません。",
"「今、生きている命こそ大切だ」",
"と考え、昔の人々が用意した未来をこわします。",
"未来がどうなるかは分かりません。",
"それでもナウシカたちは、だれかに決められた未来ではなく、自分たちの命で生きていく道を選ぶのでした。"
]},
{ cat:"m_sf", title:"EDEN 〜It’s an Endless World!〜", spine:"EDEN|〜It’s an Endless|World!〜", yomi:"エデン", sub:"遠藤浩輝", author:"遠藤浩輝", authorYomi:"えんどうひろき", icon:"🦠", text:[
"近い未来、世界中に恐ろしい病気が広がりました。",
"「クロージャー・ウイルス」という病気です。",
"多くの人が命を失い、世界の国々の力関係も大きく変わってしまいます。",
"その世界で、エリヤという少年が暮らしていました。",
"エリヤの父エンノイアは、とても大きな力を持つ人物になっていました。",
"しかしそのために、エリヤの家族も国どうしの争いや犯罪に巻きこまれます。",
"エリヤは家族と離ればなれになり、危険な世界を旅します。",
"途中で兵士や医者、普通の町の人など、さまざまな人と出会います。",
"この世界では、",
"「こちらが完全な正義で、あちらが完全な悪」",
"とは簡単に言えません。",
"国も、軍隊も、反対する人々も、それぞれ自分たちなりの理由を持っています。",
"さらに、コンピューターの世界にも、人間とは違う新しい知性が生まれていきます。",
"そして人類そのものも、病気や技術によって少しずつ変わり始めます。",
"エリヤは世界全体を救う英雄になるわけではありません。",
"大きな歴史の中で、大切な人を失ったり、また新しい人と出会ったりしながら、自分の人生を生きようとします。",
"『EDEN』は、一度こわれてしまった世界でも、人間はそれでも暮らし、愛し、次の世代へ命をつないでいくという物語です。"
]},
{ cat:"m_sf", title:"BLAME!", yomi:"ブラム", sub:"弐瓶勉", author:"弐瓶勉", authorYomi:"にへいつとむ", icon:"🏗️", text:[
"とても遠い未来。",
"世界には、どこまで行っても終わりが見えないほど巨大な建物が広がっていました。",
"昔、人間が作った機械が、自分たちだけで町を大きくしつづけた結果です。",
"キリイという男は、その巨大な世界を旅しています。",
"探しているのは、「ネット端末遺伝子」という特別なものを持つ人間です。",
"昔は、人間がネットワークを通して巨大都市を管理していました。",
"しかしその力を使える人がいなくなり、機械たちは人間を侵入者として攻撃するようになってしまいました。",
"キリイは、とても強い銃を持っています。",
"旅の途中で、科学者シボと出会います。",
"二人は協力しながら、町を管理する「セーフガード」や、「珪素生物」と呼ばれる敵と戦います。",
"けれども巨大都市はあまりにも広く、何年、何百年歩いても終わりが見えません。",
"人間の村があっても、次に訪れたときには消えていることもあります。",
"シボも何度も体を失い、別の姿になります。",
"最後にキリイは、未来へつながる大切なものを守りながら、さらに長い旅を続けます。",
"すぐに世界が元へ戻るわけではありません。",
"それでも、人間がもう一度この巨大な世界とつながるための、小さな希望が残されるのでした。"
]},
{ cat:"m_space", title:"シドニアの騎士", yomi:"シドニアのきし", sub:"弐瓶勉", author:"弐瓶勉", authorYomi:"にへいつとむ", icon:"🚀", text:[
"遠い未来、人類は地球を失っていました。",
"「奇居子（ガウナ）」という正体の分からない生き物におそわれたためです。",
"生き残った人々は、巨大な宇宙船「シドニア」に乗り、宇宙を旅していました。",
"谷風長道という少年は、シドニアの地下でひっそり育てられていました。",
"地上へ出た長道は、「衛人」という巨大な人型兵器の操縦士になります。",
"そして奇居子と戦うようになります。",
"長道は星白閑という少女にひかれていきます。",
"しかし戦いの中で星白は命を落とします。",
"そのあと奇居子は、星白によく似た姿まで作り出します。",
"長道は悲しみながらも戦いつづけます。",
"やがて、人間と奇居子を合わせたような存在「白羽衣つむぎ」が生まれます。",
"つむぎは見た目こそ怪物のように大きいですが、とてもやさしい心を持っていました。",
"長道とつむぎは、少しずつ大切な存在になっていきます。",
"シドニアは、人類を長く追いつづけてきた巨大な奇居子の集団と、最後の大きな戦いを始めます。",
"多くの仲間を失いながらも、人類は勝利します。",
"つむぎも大きな犠牲を払いますが、その後、人間に近い小さな体で新しい命を得ます。",
"長道とつむぎは家族となり、人類は新しい星で暮らし始めます。",
"長い逃亡の旅は終わり、人間たちはようやく「逃げるためではない未来」を歩き始めるのでした。"
]},
{ cat:"m_sf", title:"銃夢", yomi:"ガンム", sub:"木城ゆきと", author:"木城ゆきと", authorYomi:"きしろゆきと", icon:"🦿", text:[
"空に浮かぶ都市「ザレム」の下に、大きなくず鉄の町がありました。",
"そこでは人間も、機械の体を持つ人も、きびしい生活をしています。",
"医者のイドは、くず鉄の山から、頭と胸だけになった少女型のサイボーグを見つけます。",
"イドはその少女へ新しい体を与え、「ガリィ」と名づけました。",
"ガリィには、自分がだれだったのかという記憶がありません。",
"しかし戦いになると、体が昔覚えた武術を自然に使います。",
"ガリィは賞金かせぎとなり、悪人たちと戦います。",
"そしてユーゴという少年に恋をします。",
"ユーゴの夢は、空に浮かぶザレムへ行くことでした。",
"しかしその夢はかなわず、ユーゴは命を落とします。",
"悲しんだガリィは、今度は高速の競技「モーターボール」の世界へ入ります。",
"さまざまな戦いや出会いを経験するうちに、自分の過去にも近づいていきます。",
"そして天才科学者ノヴァと出会い、ザレムの大きな秘密を知ります。",
"上の町に暮らす人々も、自分たちの体や社会について知らされていないことがありました。",
"ガリィは何度体を失っても、そのたびに立ち上がります。",
"最後には、自分の命をかけて大勢の人を救おうとします。",
"そして新しい姿で、また自分が何者なのかを探す旅へ進んでいくのでした。"
]},
{ cat:"m_sf", title:"ヨコハマ買い出し紀行", spine:"ヨコハマ|買い出し紀行", yomi:"ヨコハマかいだしきこう", sub:"芦奈野ひとし", author:"芦奈野ひとし", authorYomi:"あしなのひとし", icon:"☕", text:[
"少し未来の日本。",
"海の水が少しずつ高くなり、昔あった町や道路が海へ沈み始めていました。",
"人の数も、少しずつ減っています。",
"そんな世界で、アルファという女性型ロボットが小さな喫茶店を開いていました。",
"お店の名前は「カフェ・アルファ」。",
"お客さんが一人も来ない日もあります。",
"それでもアルファはコーヒーをいれ、景色を見ながら静かに暮らしています。",
"ときどきバイクに乗って遠くへ出かけます。",
"同じロボットのココネと友だちになったり、近所の子どもたちと遊んだりします。",
"大きな戦争も、世界を救う冒険もありません。",
"しかし時間は少しずつ流れていきます。",
"小さかった子どもは大人になります。",
"昔あった建物はなくなります。",
"海はさらに広がります。",
"人間は年をとりますが、ロボットのアルファはほとんど変わりません。",
"そのためアルファは、いろいろな人との別れを見送ることになります。",
"それでも悲しいことばかりではありません。",
"きれいな夕日。",
"友だちとの会話。",
"一杯のコーヒー。",
"なくなっていく世界の中にも、大切な時間は残っています。",
"『ヨコハマ買い出し紀行』は、世界がゆっくり終わりへ向かう中で、それでも毎日を大切に暮らす人々の物語です。"
]},
{ cat:"m_space", title:"プラネテス", sub:"幸村誠", author:"幸村誠", authorYomi:"ゆきむらまこと", icon:"🛰️", text:[
"未来、人間は宇宙へ行くことが普通になっていました。",
"しかし宇宙には、昔の人工衛星やロケットの部品など、たくさんのごみが浮かんでいます。",
"それを「スペースデブリ」と呼びます。",
"ハチマキという青年は、その宇宙ごみを集める仕事をしていました。",
"ハチマキには大きな夢があります。",
"「いつか自分の宇宙船を持ちたい」",
"しかし現実の仕事は、地味で危険です。",
"仲間のフィーやユーリといっしょに、宇宙ごみを一つずつ回収します。",
"そこへ田名部愛という新人が入ってきます。",
"田名部は、",
"「大切なのは愛です」",
"とよく言います。",
"最初のハチマキは、その考えを少しばかにしていました。",
"ハチマキはやがて、木星へ向かう宇宙船の乗組員を目指します。",
"夢へ近づくほど、まわりの人々との距離は遠くなります。",
"テロ事件にも巻きこまれ、",
"「夢をかなえるためなら、ほかの人を傷つけてもいいのか」",
"と悩みます。",
"最後にハチマキは、宇宙へ行くことと、人を大切にすることは別々ではないと気づきます。",
"田名部とも心を通わせます。",
"そして木星へ向かう長い旅へ出発します。",
"広い宇宙を目指しながら、自分が帰る場所も知るようになった青年の物語です。"
]},
{ cat:"m_sf", title:"ぼくらの", sub:"鬼頭莫宏", author:"鬼頭莫宏", authorYomi:"きとうもひろ", icon:"🤖", text:[
"夏休み、15人の少年少女が海辺で遊んでいました。",
"そこでココペリと名乗る男に出会います。",
"男は言います。",
"「巨大ロボットを動かして、地球を守るゲームをしないか」",
"子どもたちは面白そうだと思い、契約します。",
"ところが、それはゲームではありませんでした。",
"巨大ロボット「ジアース」に乗って、本当に敵と戦わなければならないのです。",
"しかも恐ろしい決まりがありました。",
"一度戦うと、操縦した子どもは命を失います。",
"さらに、戦いに負ければ自分たちの地球そのものが消えてしまいます。",
"子どもたちは逃げることができません。",
"一人ずつ順番に操縦席へ座ります。",
"家族に別れを言う子。",
"だれにも本当のことを話せない子。",
"自分の人生に後悔している子。",
"それぞれが最後の時間をどう生きるのかがえがかれます。",
"やがて、戦っている相手もまた、別の世界の人々だと分かります。",
"どちらかの地球しか生き残れないのです。",
"最後まで生き残った宇白順も、ジアースに乗ります。",
"順は自分の命を使い、最後の戦いを終わらせます。",
"子どもたちは帰ってきません。",
"しかし彼らが戦ったことで、残された人々の世界は守られました。"
]},
{ cat:"m_horror", title:"なるたる", sub:"鬼頭莫宏", author:"鬼頭莫宏", authorYomi:"きとうもひろ", icon:"⭐", text:[
"玉依シイナという元気な女の子がいました。",
"夏休みに島へ遊びに行ったシイナは、海で星の形をした不思議な生き物と出会います。",
"シイナはその生き物を「ホシ丸」と名づけます。",
"ホシ丸は空を飛び、シイナの思いにこたえるような行動をします。",
"最初は、かわいらしい不思議な友だちのように見えました。",
"しかし同じような生き物を持つ子どもたちが、ほかにもいることが分かります。",
"その生き物は「竜の子」と呼ばれ、人間の思いによって、とても大きな力を使うことができます。",
"その力を友だちのために使う子もいます。",
"しかし、いじめられた怒りや、人への憎しみをぶつけるために使う子もいます。",
"子どもたちの苦しみと竜の子の力が結びつき、事件はどんどん大きくなります。",
"やがてシイナたちは、竜の子が世界そのものと深くつながっていることを知ります。",
"人間たちの争いは止まらず、ついには世界全体を巻きこむ大きな破壊が起こります。",
"多くの人々がいなくなり、今までの世界はほとんど終わってしまいます。",
"しかし最後には、新しい命が生まれます。",
"『なるたる』は、子どもが大きな力を持ったら幸せになれる、という物語ではありません。",
"人の心の痛みと、大きすぎる力が結びついたとき、何が起こるのかをえがいた、とても暗い物語です。"
]},
{ cat:"m_space", title:"イムリ", sub:"三宅乱丈", author:"三宅乱丈", authorYomi:"みやけらんじょう", icon:"🪐", text:[
"遠い宇宙に、「マージ」と「ルーン」という二つの星がありました。",
"そこには、カーマ、イムリ、イコルという三つの人々がいました。",
"カーマは大きな力を持ち、イコルを奴隷のように使っていました。",
"デュルクという少年は、カーマの中でも身分の高い家で育ちます。",
"将来は「呪師」という大切な仕事につく予定でした。",
"ところがルーンという星を訪れたことで、デュルクの人生は大きく変わります。",
"そこには、カーマとはまったく違う生活をするイムリの人々がいました。",
"そしてデュルクは、自分によく似た少年ミューバの存在を知ります。",
"やがて二人は、もともと双子として生まれたイムリだったことが分かります。",
"生まれた直後に引きはなされ、違う社会で育てられていたのです。",
"デュルクは、自分が正しいと思っていたカーマの社会が、ほかの人々を苦しめてきたことを知ります。",
"三つの民族の争いは、ついに大きな戦争になります。",
"デュルク自身も心を自由に動かせなくされ、大きな苦しみを受けます。",
"しかしミューバたちは、ただ相手を滅ぼすのではなく、長く続いた支配そのものを終わらせようとします。",
"最後には戦争が終わり、イコルも支配から解放されます。",
"三つの人々がすぐ仲よくなれるわけではありません。",
"それでも、たがいの文化を知ることから、新しい時代を始めようとします。",
"そして最後には、深く傷ついたデュルクにも回復の希望が示されます。",
"四千年も続いた争いのあとで、ようやく三つの人々が「明日」をいっしょに考え始めるのでした。"
]},
{ cat:"m_space", title:"彼方のアストラ", yomi:"かなたのアストラ", sub:"篠原健太", author:"篠原健太", authorYomi:"しのはらけんた", icon:"🛸", text:[
"未来の世界。",
"高校生のカナタたちは、学校行事で宇宙の惑星へ行きました。",
"ところが突然、目の前に不思議な球体が現れます。",
"球体に飲みこまれた九人の生徒は、宇宙の遠く離れた場所へ飛ばされてしまいました。",
"近くには、だれも乗っていない宇宙船があります。",
"カナタたちはその船を「アストラ号」と名づけ、故郷へ帰る旅を始めます。",
"しかし帰るまでの距離は、とても遠いものでした。",
"食べ物や水を手に入れるため、途中の惑星へ立ち寄らなければなりません。",
"そこには、不思議な植物や危険な生き物がいます。",
"九人は力を合わせ、少しずつ本当の仲間になっていきます。",
"ところが、大きな疑問が生まれます。",
"「どうして自分たちは、宇宙へ捨てられたのだろう」",
"調べていくと、九人には共通する秘密がありました。",
"彼らは、大人たちが自分の体を若いまま残すためにつくった「クローン」だったのです。",
"大人たちは秘密をかくすため、子どもたちを消そうとしていました。",
"さらに、彼らが「地球」だと思っていた歴史にも、大きなうそがありました。",
"人類は昔の地球を失い、「アストラ」という別の星へ移住していたのです。",
"九人は無事に故郷へ帰り、大人たちの秘密を明らかにします。",
"それから年月がたち、カナタたちは今度こそ自分たちの意志で宇宙へ旅立つのでした。"
]},
{ cat:"m_sf", title:"All You Need Is Kill", spine:"All You Need|Is Kill", yomi:"オールユーニードイズキル", sub:"原作：桜坂洋　漫画：小畑健　キャラクター原案：安倍吉俊", author:"桜坂洋／小畑健／安倍吉俊", authorYomi:"さくらざかひろし", icon:"🔁", text:[
"人類は、「ギタイ」と呼ばれる宇宙から来た敵と戦っていました。",
"キリヤ・ケイジという若い兵士も、初めて戦場へ向かいます。",
"しかし戦いが始まると、あっという間に命を落としてしまいました。",
"ところが目を覚ますと、戦いの前日に戻っています。",
"もう一度戦っても、また死にます。",
"そしてまた前日へ戻ります。",
"ケイジは、同じ一日を何度も何度もくり返すことになりました。",
"最初は怖がっていたケイジですが、",
"「どうせまた同じ日になるなら、少しでも強くなろう」",
"と考えます。",
"何度も戦い、何度も失敗し、少しずつ強い兵士になっていきます。",
"そしてリタ・ヴラタスキという、とても強い女性兵士に出会います。",
"リタも昔、同じように時間をくり返したことがありました。",
"二人は協力し、時間のくり返しを終わらせる方法を探します。",
"しかし最後には、二人のうち一人しか、このくり返しから抜け出せないことが分かります。",
"ケイジとリタは戦うことになります。",
"リタは命を落とし、ケイジが生き残ります。",
"悲しみを抱えながらも、ケイジはギタイとの戦いを終わらせるため、前へ進んでいくのでした。"
]},
{ cat:"m_space", title:"星を継ぐもの", yomi:"ほしをつぐもの", sub:"原作：ジェイムズ・P・ホーガン　漫画：星野之宣", author:"ジェイムズ・P・ホーガン／星野之宣", icon:"🌕", text:[
"人類が月へ行くことが普通になった未来。",
"月面で、一人の人間の死体が見つかりました。",
"宇宙服を着ています。",
"ところが調べてみると、その人はなんと約5万年前に死んでいたことが分かります。",
"「5万年前に、人間が月へ来ていたの？」",
"科学者たちは大きな謎にぶつかります。",
"その人物は「チャーリー」と呼ばれるようになります。",
"さらに宇宙を調べると、人類の歴史について、今までの常識では説明できない証拠が次々と見つかります。",
"木星の近くにも、昔の文明のあとがありました。",
"科学者たちは、一つずつ証拠を集めます。",
"そして、太陽系には昔、地球とは別に人間のような人々が暮らす世界があったのではないか、と考えるようになります。",
"月に残された死体も、その失われた世界とつながっていました。",
"最初は一人の死体から始まった謎が、",
"「人類はいったいどこから来たのか」",
"という大きな問いへ広がっていきます。",
"戦って答えを見つけるのではありません。",
"化石や宇宙船、星の動きなど、たくさんの小さな証拠をつなぎ合わせ、科学の力で人類の遠い過去を解き明かしていく物語です。"
]},
{ cat:"m_space", title:"2001夜物語", yomi:"にせんいちやものがたり", sub:"星野之宣", author:"星野之宣", authorYomi:"ほしのゆきのぶ", icon:"🌌", text:[
"人類が宇宙へ進んでいく、長い長い未来の物語です。",
"最初、人間はまだ地球の近くを飛ぶだけでした。",
"やがて月へ行きます。",
"さらに火星へ行き、もっと遠い星を目指すようになります。",
"この作品には、一人だけの主人公はいません。",
"ある物語では、宇宙を旅する親子が登場します。",
"ある物語では、遠い惑星へ向かう宇宙飛行士が登場します。",
"またある物語では、何百年もの時間をこえて進む宇宙船が登場します。",
"宇宙は、とても広い場所です。",
"人間が一生をかけても、となりの星へ届かないことがあります。",
"そのため、人間は眠ったまま旅をしたり、子どもや孫へ旅を引きついだりします。",
"遠い星で、地球とは違う生命と出会うこともあります。",
"しかし、宇宙へどれほど遠く進んでも、人間が考えることは変わりません。",
"家族のこと。",
"生きること。",
"死ぬこと。",
"自分たちはどこから来て、どこへ行くのか。",
"『2001夜物語』は、たくさんの短い物語をつなぎながら、人類が地球から宇宙へ広がっていく、とても長い歴史をえがいた作品です。"
]},
{ cat:"m_space", title:"度胸星", yomi:"どきょうぼし", sub:"山田芳裕", author:"山田芳裕", authorYomi:"やまだよしひろ", icon:"🔴", text:[
"人類が火星へ行く時代。",
"火星へ向かった宇宙飛行士たちが、大きな事故にあいます。",
"そこには「テセラック」と呼ばれる、正体の分からない不思議なものが現れていました。",
"仲間たちを失い、一人の宇宙飛行士が火星に取り残されます。",
"地球では、その人を助けるため、新しい宇宙飛行士を選ぶことになります。",
"三河度胸という男も、その試験へ参加します。",
"度胸は、もともとトラックの運転手です。",
"宇宙飛行士として特別な教育を受けてきたわけではありません。",
"しかし、危険なときにもあきらめない強い心を持っています。",
"試験には、頭のよい人、体の強い人、変わった能力を持つ人など、たくさんの候補者が集まります。",
"宇宙へ行くには、知識だけでは足りません。",
"仲間を信じること。",
"怖いときでも考えること。",
"自分の命を守りながら、ほかの人も助けること。",
"度胸は厳しい試験を通して、少しずつ宇宙飛行士へ近づいていきます。",
"その一方、火星ではテセラックの謎が残ったままです。",
"しかし物語は、度胸たちが火星の謎へ本格的に挑む前に連載が終わりました。",
"そのため、テセラックの正体や救出作戦の最後までは描かれていません。",
"「これからが本当の冒険」というところで終わった、未完の物語です。"
]},
{ cat:"m_space", title:"MOONLIGHT MILE", spine:"MOONLIGHT|MILE", yomi:"ムーンライトマイル", sub:"太田垣康男", author:"太田垣康男", authorYomi:"おおたがきやすお", icon:"🌙", text:[
"吾郎とロストマンという二人の青年がいました。",
"二人は世界中の高い山を登り、ついにはエベレストの頂上へ立ちます。",
"しかし頂上から空を見上げた二人は思います。",
"「地球で一番高い場所まで来た。次は宇宙だ」",
"二人は宇宙飛行士を目指します。",
"吾郎は、機械を動かすことが得意です。",
"ロストマンは、軍人として力をつけていきます。",
"二人は別々の道を進みながら、宇宙へ近づいていきます。",
"人類は月に基地をつくり、月にある資源を利用しようとします。",
"しかし宇宙開発は、科学だけの問題ではありません。",
"国どうしが、",
"「月をだれが支配するのか」",
"と争うようになります。",
"宇宙にも軍隊が作られ、戦いが起こります。",
"かつて同じ夢を見ていた吾郎とロストマンも、少しずつ違う立場へ進んでいきます。",
"宇宙へ行くという夢は同じでも、その宇宙で何をするのかは違っていました。",
"人類が月へ進出したとき、そこにも地球と同じ争いを持ちこんでしまうのか。",
"大きな宇宙開発と、二人の男の友情や対立をえがく物語です。"
]},
{ cat:"m_space", title:"宇宙兄弟", yomi:"うちゅうきょうだい", sub:"小山宙哉", author:"小山宙哉", authorYomi:"こやまちゅうや", icon:"👨‍🚀", text:[
"南波六太と南波日々人という兄弟がいました。",
"子どものころ、二人は夜空で不思議なものを見ます。",
"そして約束しました。",
"「二人で宇宙飛行士になろう」",
"弟の日々人は、その夢を本当にかなえます。",
"宇宙飛行士となり、月へ行くことまで決まります。",
"ところが兄の六太は、会社を辞めることになり、仕事もありません。",
"「昔の夢なんて、もう無理だ」",
"と思いかけます。",
"しかし日々人は、兄が昔書いた宇宙飛行士への応募書類をこっそり送っていました。",
"六太は宇宙飛行士の試験を受けます。",
"試験では、頭のよさだけでなく、仲間との協力や、危険なときの判断までためされます。",
"六太は失敗しながらも、少しずつ夢へ近づいていきます。",
"一方、日々人は月で大きな事故にあいます。",
"命は助かりますが、そのあと宇宙服を着くと強い恐怖を感じるようになります。",
"兄と弟は、おたがいに別の苦しみをかかえながら、それでも宇宙へ戻ろうとします。",
"六太もついに宇宙飛行士となり、月を目指します。",
"子どものころの約束を、大人になってからもう一度本気で追いかける兄弟の物語です。"
]},
{ cat:"m_space", title:"ふたつのスピカ", sub:"柳沼行", author:"柳沼行", authorYomi:"やぎぬまこう", icon:"🦁", text:[
"日本で、宇宙ロケット「獅子号」の事故が起こりました。",
"事故によって町にも大きな被害が出て、多くの人が亡くなります。",
"鴨川アスミの母親も、その事故がもとで亡くなりました。",
"それでもアスミは、宇宙が大好きでした。",
"小さなころから、「ライオンさん」と呼ぶ宇宙飛行士の幽霊のような存在と話をしながら育ちます。",
"大きくなったアスミは、宇宙飛行士を育てる学校へ入ります。",
"アスミは体が小さく、力も強くありません。",
"しかし宇宙へ行きたいという気持ちは、だれにも負けません。",
"学校では府中野、圭、秋、マリカなどの友だちと出会います。",
"みんな同じ宇宙を目指していますが、それぞれ悩みがあります。",
"訓練はとても厳しく、途中で夢をあきらめる人もいます。",
"病気や家族の問題と向き合わなければならない人もいます。",
"アスミも、母をうばったロケット事故と、自分の夢が同じ宇宙につながっていることに悩みます。",
"それでも、",
"「宇宙へ行きたい」",
"という気持ちを捨てません。",
"友だちとの出会いや別れを経験しながら、アスミは少しずつ夢へ近づいていきます。",
"小さな少女が、大きな宇宙を目指して歩きつづける物語です。"
]},
{ cat:"m_fantasy", title:"惑星のさみだれ", yomi:"わくせいのさみだれ", sub:"水上悟志", author:"水上悟志", authorYomi:"みずかみさとし", icon:"🦎", text:[
"雨宮夕日という大学生の前に、ある朝、しゃべるトカゲが現れました。",
"トカゲは言います。",
"「あなたは地球を守る騎士に選ばれました」",
"空には、巨大なハンマーのような「ビスケットハンマー」が浮かんでいました。",
"魔法使いアニムスが、それを使って地球をこわそうとしているのです。",
"夕日は「獣の騎士」の一人として戦うことになります。",
"そして朝日奈さみだれという少女と出会います。",
"さみだれは地球を守るお姫さまです。",
"……と思ったら、さみだれには別の願いがありました。",
"「地球は、最後にわたしがこわしたい」",
"夕日は、そんなさみだれに忠誠を誓ってしまいます。",
"二人はほかの騎士たちと出会い、アニムスが作る泥人形と戦います。",
"仲間の中には、戦いで命を落とす人もいます。",
"夕日は少しずつ、",
"「自分は本当に地球をこわしたいのか」",
"と考えるようになります。",
"そして、さみだれ自身も、自分が死ぬことへの恐怖から地球まで道連れにしようとしていたことが分かります。",
"最後に騎士たちは力を合わせ、アニムスを倒します。",
"そして夕日は、今度はさみだれの地球破壊を止めます。",
"さみだれは生きることを選びます。",
"世界をこわしたかった二人が、最後には世界の中で生きつづけることを選ぶ物語です。"
]},
{ cat:"m_fantasy", title:"スピリットサークル", sub:"水上悟志", author:"水上悟志", authorYomi:"みずかみさとし", icon:"🔄", text:[
"桶屋風太という中学生には、幽霊を見る力がありました。",
"ある日、石神鉱子という女の子が転校してきます。",
"風太は彼女と仲よくなりたいと思います。",
"しかし鉱子は、風太を見るなり怒ります。",
"「あなたを殺す」",
"じつは二人は、ずっと昔から何度も生まれ変わり、そのたびに出会っていました。",
"鉱子は「スピリットサークル」という不思議な道具を使い、風太に前世を見せます。",
"昔の風太は、ある人生では貧しい少年でした。",
"ある人生では別の国の人間でした。",
"未来の世界に生きていたこともあります。",
"そして毎回、鉱子の前世とも深くかかわっていました。",
"愛し合った人生もあれば、憎み合った人生もあります。",
"風太は、昔の自分が犯した大きな過ちも知ります。",
"最初の風太は、",
"「前世の自分がしたことなんて、今の自分とは関係ない」",
"と思います。",
"しかし、過去の人生を知るうちに、昔の痛みも喜びも、すべて今の自分へつながっていると気づきます。",
"鉱子もまた、何度も続いた憎しみから自由になっていきます。",
"最後には二人とも、過去に決められるのではなく、",
"「今の自分として生きる」",
"ことを選びます。",
"何度生まれ変わっても続いた争いを、今の二人が終わらせる物語です。"
]},
{ cat:"m_fantasy", title:"ドロヘドロ", sub:"林田球", author:"林田球", authorYomi:"はやしだきゅう", icon:"🦎", text:[
"「ホール」という町に、カイマンという男がいました。",
"カイマンの頭は、なぜかトカゲのような姿をしています。",
"しかも、自分が昔だれだったのか覚えていません。",
"カイマンは友だちのニカイドウといっしょに、自分へ魔法をかけた魔法使いを探しています。",
"魔法使いを見つけると、その人の頭を自分の口へ入れます。",
"カイマンの口の中には、なぜかもう一人の男がいて、",
"「こいつではない」",
"と答えるのです。",
"一方、魔法使いたちの世界では、煙という大きな力を持つ男がカイマンを調べ始めます。",
"心と能井という二人の強い魔法使いも、カイマンの前に現れます。",
"敵どうしだったはずなのに、物語が進むほど、",
"「だれが本当の悪者なのか」",
"分からなくなっていきます。",
"そしてカイマンの過去には、会川、栗鼠、壊という、何人もの人物の記憶が複雑にからんでいました。",
"ホールの人々が魔法使いから長いあいだ苦しめられてきたことで生まれた、大きな憎しみも形を持って現れます。",
"最後には、人間も魔法使いも力を合わせ、その巨大な憎しみと戦います。",
"戦いが終わると、カイマンはまたカイマンとして生きることを選びます。",
"ニカイドウとの関係も変わりません。",
"とても変で、少しこわい世界ですが、最後には仲間たちがまた同じ食卓へ集まるのでした。"
]},
{ cat:"m_space", title:"大ダーク", yomi:"だいダーク", sub:"林田球", author:"林田球", authorYomi:"はやしだきゅう", icon:"💀", text:[
"ザハ＝サンコという少年が、広い宇宙を旅していました。",
"サンコには、とても困った秘密があります。",
"「サンコの骨を手に入れれば、どんな願いでもかなう」",
"といううわさが宇宙中に広がっているのです。",
"そのため、行く先々で大勢の人がサンコを殺そうとします。",
"サンコの相棒は、アバキアンという骨のような姿をした不思議な道具です。",
"さらに、死ま田＝デスという「死」そのもののような存在も友だちになります。",
"ハジメ＝ダメ丸という変わった男や、写真を撮る少女など、少しずつ仲間も増えていきます。",
"サンコが知りたいのは、",
"「どうして自分の骨に、そんな力があると言われるようになったのか」",
"ということです。",
"宇宙船へ乗り、いろいろな星へ行き、奇妙な人々と出会います。",
"どこへ行っても命をねらわれますが、サンコは意外とのんびりしています。",
"食べ物を楽しみ、仲間とふざけながら旅を続けます。",
"しかし少しずつ、宇宙を支配する大きな会社や、サンコ自身の過去につながる謎が見えてきます。",
"サンコの骨の秘密は何なのか。",
"そしてだれが、このうわさを広めたのか。",
"その答えを探す宇宙の旅は、まだ続いています。"
]},
{ cat:"m_horror", title:"HELLSING", yomi:"ヘルシング", sub:"平野耕太", author:"平野耕太", authorYomi:"ひらのこうた", icon:"🧛", text:[
"イギリスには、「ヘルシング機関」という秘密組織がありました。",
"人々をおそう吸血鬼や怪物から国を守るための組織です。",
"その中でももっとも強い存在が、アーカードという吸血鬼でした。",
"アーカード自身も怪物ですが、ヘルシング家に従い、ほかの怪物たちと戦っています。",
"組織を率いるのは、インテグラという女性です。",
"さらに、事件に巻きこまれて吸血鬼となったセラスという女性も仲間になります。",
"最初は小さな吸血鬼事件を解決していました。",
"しかしその裏では、「ミレニアム」という組織が大きな戦争を準備していました。",
"彼らは大勢の吸血鬼を使い、ロンドンを戦場にします。",
"さらに、怪物を倒すためなら手段を選ばない別の宗教組織まで戦いへ加わります。",
"アーカードは、自分の中にたくさんの命を取りこんできた、とても恐ろしい存在でした。",
"最後の戦いでは、その力をすべて解放します。",
"しかし敵の作戦によって、アーカードはいったん世界から消えてしまいます。",
"それから長い年月がたちます。",
"ある夜、アーカードはふたたびインテグラの前へ現れます。",
"長い時間をかけて自分自身を取りもどし、またヘルシング家の吸血鬼として帰ってきたのでした。"
]},
{ cat:"m_sf", title:"トライガン", sub:"内藤泰弘", author:"内藤泰弘", authorYomi:"ないとうやすひろ", icon:"🔫", text:[
"砂ばかりの惑星に、ヴァッシュ・ザ・スタンピードという男がいました。",
"「人間台風」と呼ばれ、とても高い賞金をかけられています。",
"町を一つこわしたほどの危険人物だとうわさされています。",
"ところが本当のヴァッシュは、明るくてお調子者です。",
"そして、どんな相手でも、",
"「人を殺したくない」",
"と考えています。",
"ヴァッシュには、人間ではない大きな秘密がありました。",
"彼と双子のナイブズは、人類が宇宙を旅するためにつくった「プラント」という存在と同じ仲間でした。",
"昔、ヴァッシュとナイブズはレムという女性に育てられます。",
"レムは、",
"「命を大切にしなさい」",
"とヴァッシュへ教えました。",
"しかしナイブズは、人間がプラントを道具として使うことを憎みます。",
"そして、",
"「人間をすべて消してしまおう」",
"と考えます。",
"ヴァッシュは、大切なレムの教えを守りながら、兄ナイブズを止めようとします。",
"ウルフウッドなどの仲間とも出会います。",
"大切な人を失い、何度も、",
"「殺さなければ守れない」",
"という場面に追いつめられます。",
"それでもヴァッシュは、できるかぎり命を救う道を探します。",
"最後に兄との長い争いへ向き合います。",
"人間を信じるヴァッシュと、人間を憎むナイブズ。",
"二人の兄弟の考えが最後までぶつかり合う物語です。"
]},
{ cat:"m_sf", title:"新世紀エヴァンゲリオン", spine:"新世紀|エヴァンゲリオン", yomi:"しんせいきエヴァンゲリオン", sub:"原作：GAINAX　漫画：貞本義行", author:"GAINAX／貞本義行", authorYomi:"ガイナックス", icon:"🤖", text:[
"碇シンジという14歳の少年が、父ゲンドウに呼ばれて東京へやってきました。",
"父はシンジに言います。",
"「エヴァンゲリオンに乗れ」",
"巨大な怪物「使徒」が人類をおそっていました。",
"それに対抗できるのが、巨大な人型兵器エヴァンゲリオンです。",
"シンジは怖がりながらもエヴァへ乗ります。",
"その後、綾波レイや惣流・アスカ・ラングレーも、エヴァの操縦者として戦います。",
"しかしエヴァは、ただのロボットではありませんでした。",
"シンジたちの家族や、人類そのものの秘密と深くつながっています。",
"そして父ゲンドウは、「人類補完計画」という大きな計画を進めていました。",
"人間は一人ひとり別々だから、傷つけ合います。",
"ならば、すべての人の心を一つにしてしまえば、だれも孤独にならない。",
"そんな考えです。",
"シンジは、人といることで傷つくこともあります。",
"それでも、人と別々に生きることを選びます。",
"最後には、それまでの世界が大きく変わります。",
"シンジは新しい世界で、再び人々と出会います。",
"そこでは以前とは少し違う人生が始まろうとしています。",
"苦しくても、ほかの人と出会いながら生きていく道を選ぶ物語です。"
]},
{ cat:"m_fantasy", title:"ベルセルク", sub:"三浦建太郎", author:"三浦建太郎", authorYomi:"みうらけんたろう", icon:"⚔️", text:[
"ガッツという剣士がいました。",
"自分の体ほどもある大きな剣を持ち、怪物たちと戦っています。",
"ガッツは子どものころから、戦いの中で育ちました。",
"やがて「鷹の団」という傭兵の集団へ入り、その団長グリフィスと出会います。",
"グリフィスには、",
"「自分の国を持つ」",
"という大きな夢がありました。",
"ガッツはグリフィスと戦い、負けたことで鷹の団へ入ります。",
"そこでキャスカや仲間たちと出会い、初めて家族のような場所を手に入れます。",
"しかしガッツは、",
"「自分自身の夢を見つけたい」",
"と考え、鷹の団を離れます。",
"それをきっかけにグリフィスの人生は大きくくずれます。",
"そしてグリフィスは、自分の夢をかなえるため、鷹の団の仲間たちを大きな犠牲にして、人間ではない存在へ生まれ変わります。",
"多くの仲間が命を落とし、キャスカも心に深い傷を負います。",
"ガッツはグリフィスへの怒りをかかえながら、キャスカを守って旅をします。",
"旅の途中でパック、ファルネーゼ、セルピコ、シールケなど、新しい仲間ができます。",
"最初は一人で復讐だけを考えていたガッツも、また仲間を大切にするようになります。",
"一方グリフィスは、本当に大きな国をつくり、人々から英雄としてあがめられます。",
"ガッツは復讐を選ぶのか。",
"それともキャスカや仲間と生きる未来を選ぶのか。",
"二人の長い物語は、まだ続いています。"
]},
{ cat:"m_fantasy", title:"クレイモア", sub:"八木教広", author:"八木教広", authorYomi:"やぎのりひろ", icon:"🗡️", text:[
"人間を食べる「妖魔」という怪物がいる世界。",
"妖魔は人間の姿に化けるため、普通の人には見分けることができません。",
"そこで「組織」は、人間と妖魔を合わせた女性戦士を作りました。",
"その戦士たちは、大きな剣を使うため「クレイモア」と呼ばれています。",
"クレアも、その一人です。",
"クレアは子どものころ、テレサというとても強いクレイモアに助けられました。",
"しかしテレサは、プリシラという戦士との戦いで命を落とします。",
"クレアはテレサの一部を自分の体へ入れ、クレイモアになります。",
"目的は、プリシラを倒すことでした。",
"旅の途中で、ラキという少年とも出会います。",
"最初は弱かったクレアですが、仲間たちと戦いながら強くなります。",
"しかしやがて、「組織」そのものにも大きな秘密があることを知ります。",
"クレイモアも妖魔も、自然に生まれたものではありませんでした。",
"遠い土地で行われている戦争のため、人間が作った存在だったのです。",
"クレアたちは組織へ反抗します。",
"そして最後には、長いあいだ追ってきたプリシラとの戦いへ向かいます。",
"クレアの中に残っていたテレサの力も現れ、プリシラは倒されます。",
"復讐の旅を終えたクレアは、ラキたちといっしょに、自分自身の人生を歩き始めるのでした。"
]},
{ cat:"m_sf", title:"機動警察パトレイバー", spine:"機動警察|パトレイバー", yomi:"きどうけいさつパトレイバー", sub:"ゆうきまさみ　原案：ヘッドギア", author:"ゆうきまさみ／ヘッドギア", icon:"🚔", text:[
"未来の東京では、「レイバー」という大きな作業用ロボットが使われていました。",
"工事現場などでとても役に立ちます。",
"しかしレイバーを使った犯罪も増えていました。",
"そこで警察は、レイバー犯罪を取りしまる「特車二課」を作ります。",
"泉野明という女性警察官も、その隊員になりました。",
"野明は警察用レイバー「イングラム」が大好きです。",
"まるで大切な相棒のように手入れします。",
"篠原遊馬、後藤隊長、太田など、個性的な仲間たちと事件を解決していきます。",
"ある日は暴走したレイバーを止めます。",
"ある日は大きな会社の事件を調べます。",
"またある日は、まったく事件が起きず、隊員たちがのんびりしています。",
"しかし物語が進むと、レイバーを作る会社や、新しい技術をめぐる大きな争いも起こります。",
"野明たちは、",
"「新しい機械があれば、社会はそれだけでよくなるのか」",
"という問題にも向き合います。",
"それでも野明にとってイングラムは、ただの機械ではありません。",
"自分が責任を持って使う大切な道具です。",
"大事件も日常の小さな騒動も、同じようにみんなで乗りこえていく警察官たちの物語です。"
]},
{ cat:"m_space", title:"ファイブスター物語", yomi:"ファイブスターものがたり", sub:"永野護", author:"永野護", authorYomi:"ながのまもる", icon:"✨", text:[
"遠い未来の宇宙。",
"「ジョーカー太陽星団」と呼ばれる世界には、たくさんの国がありました。",
"そこでは「モーターヘッド」や「ゴティックメード」と呼ばれる巨大な兵器が戦います。",
"その兵器を動かす騎士には、「ファティマ」という特別な人々が力を貸します。",
"物語の中心にいるのは、アマテラスという人物です。",
"美しい青年のように見えますが、普通の人間とは違い、とても長い時間を生きる特別な存在です。",
"アマテラスはラキシスというファティマと出会います。",
"二人の関係は、何千年にもわたる星団の歴史へつながっていきます。",
"この物語では、一人の主人公の一生だけを追うわけではありません。",
"ある時代では、騎士たちの戦争がえがかれます。",
"別の時代では、その子孫たちの争いがえがかれます。",
"国が生まれ、ほろびます。",
"有名だった人物も、何百年後には歴史の中の名前になります。",
"そして物語の最初から、未来に何が起こるのかが年表として少しずつ示されています。",
"読者は、",
"「この人物が、どうやって歴史に書かれた未来へ進んでいくのか」",
"を見ていくことになります。",
"何千年にもわたる、とても大きな宇宙の歴史物語です。"
]},
{ cat:"m_space", title:"超人ロック", yomi:"ちょうじんロック", sub:"聖悠紀", author:"聖悠紀", authorYomi:"ひじりゆき", icon:"🌀", text:[
"宇宙に、ロックという青年がいました。",
"ロックは普通の人間ではありません。",
"物を動かしたり、心を読んだり、遠くへ移動したりできる、とても強い超能力者です。",
"しかも、ほとんど年をとりません。",
"そのためロックは、何百年にもわたって人類の歴史を見つづけることになります。",
"ロック自身は、世界を支配したいとは思っていません。",
"できれば静かに暮らしたいと思っています。",
"しかし強い力を持っているため、戦争や政治の争いに何度も巻きこまれます。",
"超能力者をこわがる人々から追われることもあります。",
"逆に、超能力を使って人々を支配しようとする者とも戦います。",
"ロックが助けた子どもが大人になり、やがて年をとって亡くなっても、ロックだけはほとんど同じ姿のままです。",
"国も星も、時代とともに変わっていきます。",
"その中でロックは、",
"「大きな力を持つ者は、その力をどう使うべきなのか」",
"と何度も問いつづけます。",
"一つの大きな最終決戦へ向かう作品ではありません。",
"長い人類の歴史の中を、ほとんど変わらない一人の超能力者が歩きつづける物語です。"
]},
{ cat:"m_sf", title:"バオー来訪者", yomi:"バオーらいほうしゃ", sub:"荒木飛呂彦", author:"荒木飛呂彦", authorYomi:"あらきひろひこ", icon:"🧬", text:[
"橋沢育朗という少年は、ある組織にさらわれていました。",
"その組織は、人間の体の中へ「バオー」という不思議な寄生生物を入れる実験をしていました。",
"育朗の体にも、バオーが入れられていました。",
"育朗は、予知能力を持つ少女スミレといっしょに組織から逃げ出します。",
"ふだんの育朗は普通の少年です。",
"しかし命の危険が近づくと、体の中のバオーが目覚めます。",
"すると育朗の体は、人間をこえた戦う姿へ変わります。",
"傷をすぐに治したり、体から武器のようなものを作り出したりできます。",
"組織「ドレス」は、秘密を守るため育朗を消そうとします。",
"次々と強い敵を送りこみます。",
"育朗はスミレを守りながら戦います。",
"しかし育朗が望んでバオーになったわけではありません。",
"普通の人間として生きたいと思っています。",
"最後の大きな戦いで育朗は、組織の施設をこわします。",
"そして深い場所へ落ち、姿を消します。",
"スミレは育朗が死んだとは信じません。",
"いつか必ず帰ってくる。",
"そう信じながら待ちつづけます。",
"そして育朗が再び目覚めるかもしれない、という希望を残して物語は終わります。"
]},
{ cat:"m_sf", title:"レベルE", yomi:"レベルイー", sub:"冨樫義博", author:"冨樫義博", authorYomi:"とがしよしひろ", icon:"👽", text:[
"地球には、じつはたくさんの宇宙人が暮らしていました。",
"しかし普通の人間は、そのことをほとんど知りません。",
"高校生の筒井雪隆が一人暮らしを始めると、部屋に知らない青年がいました。",
"青年は言います。",
"「ぼくは宇宙人の王子です」",
"名前はバカ王子。",
"とても頭はよいのですが、人を困らせることが大好きです。",
"王子は記憶を失ったと言ったり、宇宙人の戦争が始まると言ったりします。",
"ところが、その多くは王子が人を驚かせるために考えた大がかりないたずらだったりします。",
"その後も地球には、いろいろな宇宙人が現れます。",
"子どもたちが突然、正義のヒーローに変身させられることもあります。",
"野球の試合の裏で、宇宙人の事件が起こることもあります。",
"怖い話だと思っていたら、最後に全部ひっくり返ることもあります。",
"王子はいつも、",
"「どうすれば人がいちばん驚くか」",
"ばかり考えています。",
"宇宙人がたくさんいるという大きな秘密よりも、その宇宙人たちが人間と同じように変わった性格を持っていることがおかしい。",
"そんな不思議な短い物語が集まった作品です。"
]},
{ cat:"m_horror", title:"彼岸島", yomi:"ひがんじま", sub:"松本光司", author:"松本光司", authorYomi:"まつもとこうじ", icon:"🏝️", text:[
"宮本明という青年には、行方不明になった兄・篤がいました。",
"ある日、",
"「お兄さんは生きている」",
"という話を聞きます。",
"篤がいるという場所は、「彼岸島」という小さな島でした。",
"明は友だちといっしょに島へ向かいます。",
"しかし彼岸島には、恐ろしい秘密がありました。",
"島では吸血鬼たちが人間を支配していたのです。",
"その中心にいるのが、雅という吸血鬼です。",
"明は兄と再会します。",
"しかし島から逃げるだけでは終わりません。",
"明は吸血鬼と戦う方法を学び、どんどん強くなっていきます。",
"友だちや仲間を失うこともあります。",
"そして兄とも、悲しい形で向き合わなければならなくなります。",
"やがて吸血鬼の問題は、彼岸島だけではおさまらなくなります。",
"雅は日本全体へ大きな災いを広げます。",
"明は島を出て、吸血鬼だらけになった日本を旅します。",
"途中で新しい仲間と出会いながら、",
"「雅を倒す」",
"という目的のため進みつづけます。",
"最初は兄を探すために島へ来た青年が、やがて人間たちの希望を背負って戦うようになる物語です。"
]},
{ cat:"m_horror", title:"アイアムアヒーロー", sub:"花沢健吾", author:"花沢健吾", authorYomi:"はなざわけんご", icon:"🧟", text:[
"鈴木英雄という男性は、マンガ家の助手をしていました。",
"自分でもマンガ家になりたいと思っていますが、なかなかうまくいきません。",
"そんなある日、町の人々がおかしくなり始めます。",
"人にかみつき、普通ではない動きをするようになります。",
"「ZQN」と呼ばれる病気が広がっていたのです。",
"英雄は町から逃げます。",
"彼は猟銃を持っていますが、名前とは反対に、とても勇敢な人間というわけではありません。",
"怖くなれば逃げます。",
"どうすればよいのか分からず、迷うこともあります。",
"旅の途中で比呂美という女子高校生と出会います。",
"さらに藪という女性とも行動するようになります。",
"しかしZQNは、ただ人をおそうだけの存在ではありませんでした。",
"感染者どうしがつながり、だんだん一つの大きな生命のようなものへ変わっていきます。",
"社会はほとんどこわれ、人の数も減っていきます。",
"英雄は大切な人たちとも離ればなれになります。",
"最後には、一人で東京に残り、生きつづけます。",
"英雄が世界を救うわけではありません。",
"病気の正体も、すべてがきれいに説明されるわけではありません。",
"それでも、自分を「英雄」だと思えなかった男が、こわれた世界で今日を生きのびようとする物語です。"
]},
{ cat:"m_horror", title:"亜人", yomi:"あじん", sub:"桜井画門", author:"桜井画門", authorYomi:"さくらいがもん", icon:"🖤", text:[
"永井圭という高校生が、交通事故にあいました。",
"だれが見ても助からない事故でした。",
"ところが圭は、すぐに生き返ります。",
"圭は「亜人」だったのです。",
"亜人は、どれほど大きな傷を受けても、死ぬと元の体へ戻る不思議な人間です。",
"世の中では亜人は珍しい存在として追われています。",
"政府につかまれば、研究のために何度も苦しい実験を受けます。",
"圭は逃げます。",
"そんな中、佐藤という亜人が現れます。",
"佐藤は最初、",
"「亜人を助けたい」",
"と言います。",
"しかし本当は、戦うことそのものを楽しむ危険な男でした。",
"佐藤はほかの亜人を集め、国を相手に大きな戦いを始めます。",
"圭は人づき合いが苦手で、",
"「自分さえ助かればいい」",
"と考えるところがありました。",
"しかし佐藤を止めるため、友だちの海斗や中野など、ほかの人たちと力を合わせるようになります。",
"亜人には「IBM」と呼ばれる黒い人型の力もあります。",
"圭は頭を使い、その能力を利用して佐藤へ立ち向かいます。",
"最後には佐藤を止めることに成功します。",
"圭もまた、普通の生活へ戻っていきます。",
"人間か亜人かよりも、「自分がどう生きるか」が大切なのだと気づいていく物語です。"
]},
{ cat:"m_sf", title:"いぬやしき", sub:"奥浩哉", author:"奥浩哉", authorYomi:"おくひろや", icon:"👴", text:[
"犬屋敷壱郎という男性は、もう年をとっていました。",
"家族からもあまり大切にされず、",
"「自分がいなくても、だれも困らないのではないか」",
"と思っています。",
"さらに病気になり、長く生きられないと知ります。",
"そんなある夜、犬屋敷は公園で大きな事故に巻きこまれます。",
"目を覚ますと、体の中が機械になっていました。",
"見た目は人間のままですが、空を飛び、人の傷を治し、とても強い力を使うことができます。",
"犬屋敷は、その力で病気の人を助けるようになります。",
"「自分にも、人の役に立てる」",
"そう思うことで、生きている喜びを取りもどします。",
"しかし同じ事故にあった高校生・獅子神皓も、同じ機械の体になっていました。",
"獅子神は犬屋敷とは反対に、その力で人々を傷つけ始めます。",
"二人は同じ力を持ちながら、まったく違う道を選びます。",
"最後には大きな災害が地球へ近づきます。",
"犬屋敷は、自分の命を使えば地球を救えると知ります。",
"そして家族や大勢の人々を守るため、自分を犠牲にします。",
"ずっと「自分には価値がない」と思っていた男が、最後には世界中の人を救う存在になる物語です。"
]},
{ cat:"m_sf", title:"GANTZ", yomi:"ガンツ", sub:"奥浩哉", author:"奥浩哉", authorYomi:"おくひろや", icon:"⚫", text:[
"玄野計という高校生がいました。",
"ある日、昔の友だち加藤勝と駅で再会します。",
"二人は線路へ落ちた人を助けようとして、電車にはねられます。",
"ところが気がつくと、見知らぬ部屋にいました。",
"部屋には黒い大きな球があります。",
"その球の名前は「GANTZ」。",
"集められた人々は、特殊な服と武器を渡され、",
"「宇宙人を倒せ」",
"と命令されます。",
"戦いで命を落とせば、本当に死にます。",
"しかし点数を集めれば、生き返らせたい人を戻すこともできます。",
"玄野は最初、自分のことばかり考えていました。",
"けれども何度も戦ううちに、仲間を助けるリーダーのような存在へ成長します。",
"戦う相手も、どんどん強くなります。",
"そして最後には、人類よりずっと進んだ巨大な宇宙人が地球へ攻めこんできます。",
"町はこわされ、大勢の人々が連れ去られます。",
"玄野たちは、今度は自分たちだけではなく地球を守るために戦います。",
"激しい戦いのあと、宇宙人の大きな船はこわれます。",
"玄野と加藤は地球へ帰り、海で仲間たちと再会します。",
"なぜGANTZが存在したのか。",
"人間の命とは何なのか。",
"すべてがすっきり説明されるわけではありません。",
"それでも玄野は、生きて帰りたいと思える大切な人々を手に入れたのでした。"
]},
{ cat:"m_sf", title:"テラフォーマーズ", sub:"原作：貴家悠　作画：橘賢一", author:"貴家悠／橘賢一", authorYomi:"さすがゆう", icon:"🪳", text:[
"人類は、火星を人間が暮らせる星にしようと考えました。",
"そのため火星へ、ある生き物を送りこみます。",
"ゴキブリです。",
"長い年月がたち、人類が火星へ行くと、とんでもないことが起きていました。",
"ゴキブリは進化し、人間のような大きな体と、とても強い力を持つ生き物になっていたのです。",
"人々は彼らを「テラフォーマー」と呼びます。",
"さらに地球では、火星に関係する新しい病気が広がります。",
"治す方法を探すため、燈たちの隊員が火星へ向かいます。",
"隊員たちは、それぞれ昆虫や動物の力を自分の体へ取りこむ手術を受けています。",
"アリの力。",
"ハチの力。",
"甲虫の力。",
"その能力を使い、テラフォーマーと戦います。",
"しかし敵は、ただ強いだけではありません。",
"道具を使い、作戦まで考えるようになっています。",
"さらに人間側にも、国どうしの争いや裏切りがあります。",
"「人類を救うため」と言いながら、自分の国の利益を優先する者もいます。",
"やがて戦いは火星だけではなく、地球にも広がっていきます。",
"人間とテラフォーマー、そして人間どうしの思惑が入りまじる大きな戦いは、まだ続いています。"
]},
{ cat:"m_sf", title:"デッドデッドデーモンズデデデデデストラクション", spine:"デッドデッド|デーモンズ|デデデデデストラクション", sub:"浅野いにお", author:"浅野いにお", authorYomi:"あさのいにお", icon:"🛸", text:[
"東京の空に、巨大な宇宙船が浮かんでいました。",
"宇宙人がやってきたのです。",
"最初、人々は、",
"「世界が終わるかもしれない」",
"と大さわぎしました。",
"しかし宇宙船はすぐには何もしません。",
"数年たつと、人々は空に宇宙船がある生活に慣れてしまいます。",
"高校生の小山門出と中川凰蘭も、友だちと学校へ通い、ゲームをし、進路について悩んでいました。",
"世界の危機が空に浮かんでいても、毎日の生活は続きます。",
"ところが政府は宇宙人を危険な敵として攻撃します。",
"宇宙人の中には、戦いたくない者や、普通に生きたい者もいました。",
"そして凰蘭と門出には、普通ではない過去がありました。",
"時間や世界そのものにかかわる出来事によって、今の世界ができていたことが分かってきます。",
"一つの選択が、別の世界では大きな悲劇につながっています。",
"やがて巨大な宇宙船をめぐる問題は、東京だけではなく世界全体の危機になります。",
"多くの人々が犠牲になります。",
"それでも門出や凰蘭たちは、",
"「世界を救った英雄」",
"として生きるわけではありません。",
"友だちと話し、ごはんを食べ、自分の大切な人と生きようとします。",
"世界がどれほど大きく変わっても、普通の人の毎日は続いていく。",
"そんな日常と世界の終わりを、同時にえがいた物語です。"
]},
{ cat:"m_sf", title:"天国大魔境", yomi:"てんごくだいまきょう", sub:"石黒正数", author:"石黒正数", authorYomi:"いしぐろまさかず", icon:"🌸", text:[
"大きな災害のあと、日本の町はこわれ、文明もほとんど失われていました。",
"キルコという少女と、マルという少年が、その世界を旅しています。",
"二人が探しているのは、「天国」と呼ばれる場所です。",
"しかし、その天国がどこにあるのかは分かりません。",
"外の世界には、人をおそう「ヒルコ」という怪物がいます。",
"食べ物を手に入れるのも、泊まる場所を見つけるのも簡単ではありません。",
"一方、外の世界とはまったく別に、高い壁で囲まれた学校のような施設があります。",
"そこではトキオたち子どもが、大人たちに守られて暮らしています。",
"子どもたちは外の世界を知りません。",
"しかし、施設の中でも少しずつ不思議な出来事が起こります。",
"じつは、この施設の物語と、マルたちの旅には時間のずれがあります。",
"施設で育てられていた子どもたちのその後が、こわれた世界の出来事へつながっていることが少しずつ分かってきます。",
"マル自身の出生にも大きな秘密があります。",
"キルコも、自分の体と記憶について複雑な過去を持っています。",
"ヒルコとは何なのか。",
"世界はなぜこわれたのか。",
"「天国」とは、本当に幸せな場所なのか。",
"二つの物語が少しずつ一つにつながりながら、その答えへ近づいています。",
"物語はまだ続いています。"
]},
{ cat:"m_drama", title:"MASTERキートン", spine:"MASTER|キートン", yomi:"マスターキートン", sub:"作者：浦沢直樹／勝鹿北星／長崎尚志", author:"浦沢直樹／勝鹿北星／長崎尚志", authorYomi:"うらさわなおき", icon:"🏺", text:[
"平賀＝キートン・太一は、日本人の父とイギリス人の母をもつ男です。大学では考古学を教えていますが、それだけでは生活できないため、保険会社の調査員として世界じゅうを飛び回っています。しかも彼には、イギリス軍の特殊部隊SASでサバイバルの教官をしていたという、変わった過去がありました。",
"キートンが調べる事件は、保険金詐欺だけではありません。殺人事件、誘拐、テロ、戦争の傷あとなど、さまざまな問題に巻きこまれます。けれどキートンは、強いからといってすぐに武器を使うのではなく、歴史の知識や観察力、そして人間への理解を使って危機を切りぬけていきます。",
"一方、キートンの本当の夢は、考古学者として「ドナウ川の近くに、昔知られていない大きな文明があった」と証明することです。離婚した妻や娘、少し変わった父親との関係にも悩みながら、それでも夢をあきらめません。",
"物語は「最後の大悪人を倒して終わる」という形ではありません。いくつもの事件を解決したキートンが、何歳になっても自分の好きな考古学を追いかけ、「夢を掘る人」であり続ける姿を描いて終わります。"
]},
{ cat:"m_drama", title:"MONSTER", yomi:"モンスター", sub:"浦沢直樹", author:"浦沢直樹", authorYomi:"うらさわなおき", icon:"👹", text:[
"ドイツで働く日本人の脳外科医・天馬賢三は、とても腕のよい医者でした。ある日、頭を撃たれた少年ヨハンと、町の有力者である市長が同時に病院へ運ばれてきます。病院は「市長を先に助けろ」と命じますが、天馬は「命に偉いも偉くないもない」と考え、先に運ばれてきたヨハンを手術します。",
"ヨハンは助かりました。しかし、その後、病院の上司たちが次々と殺され、ヨハンと双子の妹アンナは姿を消します。何年もたってから、天馬は恐ろしい事実を知ります。自分が助けたヨハンは、人を操り、多くの人を死へ追いやる恐ろしい人物になっていたのです。",
"「自分があのとき助けたから、こんなことになったのではないか」。天馬は医者の仕事も地位も捨て、ヨハンを止める旅に出ます。その途中で、ヨハンとアンナが幼いころに受けた恐ろしい教育や、「511キンダーハイム」という施設、人間の心をこわす実験の存在が明らかになります。",
"最後にヨハンは小さな町ルーエンハイムで大きな惨劇を起こします。そこでヨハンは銃で撃たれますが、天馬は――自分が止めようとしていた相手であるにもかかわらず――もう一度医者としてヨハンの命を救います。",
"その後、ヨハンは病院のベッドから姿を消します。天馬は医者として生き続け、アンナも自分の人生へ歩き始めます。「どんな人間の命にも同じ価値があるのか」という問いを残して物語は終わります。"
]},
{ cat:"m_drama", title:"20世紀少年", yomi:"にじっせいきしょうねん", sub:"浦沢直樹", author:"浦沢直樹", authorYomi:"うらさわなおき", icon:"🧒", text:[
"少年だったケンヂと仲間たちは、空き地に秘密基地を作って遊んでいました。そこで「悪の組織が世界を征服しようとする」「巨大ロボットが町を襲う」「細菌兵器が使われる」といった空想を「よげんの書」に書きました。",
"大人になったケンヂは、コンビニを経営する平凡な男になっていました。ところがある日、子どものころ自分たちが使っていたマークをかかげる謎の人物「ともだち」が現れます。さらに、子どものころの「よげんの書」に書いた出来事が、本当に起こり始めます。",
"「ともだち」は巨大な宗教団体のような組織を作り、世界中の人々から英雄としてあがめられていきます。2000年の大みそかには東京で大事件が起き、ケンヂは世界を救うために戦いますが、その後、長いあいだ行方不明になります。",
"時代は進み、ケンヂの姪・カンナたち若い世代が「ともだち」に支配された社会に立ち向かいます。そして「ともだち」の正体を追っていくと、ケンヂたちが子どものころに知っていたフクベエやカツマタという少年たちの記憶へとたどりつきます。",
"やがて生きていたケンヂも戻ってきます。世界を救ったあと、ケンヂは「子どものころ、仲間外れにしたり傷つけたりしたこと」まで思い出し、自分の過去と向き合います。",
"世界を滅ぼしかけた大事件の始まりは、実は子どもたちの小さな遊びや、忘れられた一人の少年のさびしさでした。最後はケンヂがその過去に謝り、長い物語に決着をつけます。"
]},
{ cat:"m_sf", title:"PLUTO", yomi:"プルートゥ", sub:"作者：浦沢直樹／原作：手塚治虫", author:"浦沢直樹／手塚治虫", authorYomi:"うらさわなおき", icon:"🤖", text:[
"人間と高性能ロボットがいっしょに暮らしている未来。世界最高クラスのロボットたちが、何者かによって次々とこわされる事件が起こります。現場には、まるで角のように見える不思議な物が残されていました。",
"事件を調べるのは、ドイツの刑事ロボット・ゲジヒトです。調査を続けるうち、被害者にはアトムをはじめとする「世界で最も強い七体のロボット」が関係していることが分かってきます。",
"やがて事件の背景には、中央アジアで行われた大きな戦争があり、その戦争で家族や故郷を失った人々とロボットたちの憎しみがあることが明らかになります。そして、心や花を愛するやさしいロボット・サハドが、恐ろしい戦闘ロボット「プルートゥ」に変えられていたことも分かります。",
"捜査の途中でゲジヒト自身も命を落とします。しかし、彼が残した記憶と思いはアトムへ受けつがれます。",
"最後にアトムとプルートゥは戦います。けれどアトムは、敵をただ倒すのではなく、プルートゥの中に残っているサハドの心を呼び起こします。そしてプルートゥもまた、憎しみのために世界を滅ぼすのではなく、世界を守る側を選びます。",
"「人間とロボットのどちらに心があるのか」ではなく、「憎しみを受け取った者が、その憎しみを次へ渡すのか」という物語です。"
]},
{ cat:"m_fight", title:"YAWARA!", yomi:"ヤワラ", sub:"浦沢直樹", author:"浦沢直樹", authorYomi:"うらさわなおき", icon:"🥋", text:[
"猪熊柔は、どこにでもいる普通の女の子として、おしゃれをしたり恋をしたりして暮らしたいと思っていました。しかし柔には、とんでもない才能がありました。小さなころから柔道を教えこまれ、世界一になれるほど強かったのです。",
"柔の祖父・猪熊滋悟郎は「柔は必ずオリンピックで金メダルを取る」と勝手に決め、柔を柔道大会へ出そうとします。柔は嫌がりますが、新聞記者の松田耕作や、ライバルの本阿弥さやか、親友の伊東富士子など、多くの人との出会いによって、少しずつ柔道と向き合うようになります。",
"柔は大会に出るたびに強い選手たちを倒していきます。それでも本人は「勝って有名になりたい」のではありません。普通の幸せを願いながら、目の前の相手とは真剣に戦う。その姿が多くの人をひきつけていきます。",
"やがて柔は世界の大舞台へ進み、オリンピックでも戦います。そして柔道家として大きな結果を残す一方で、ずっと自分を見守ってきた松田への気持ちにも気づいていきます。",
"最後には、柔道だけに人生を決められていた少女が、自分の意志で柔道も恋も選べる女性へ成長します。"
]},
{ cat:"m_sports", title:"Happy!", yomi:"ハッピー", sub:"浦沢直樹", author:"浦沢直樹", authorYomi:"うらさわなおき", icon:"🎾", text:[
"海野幸は、両親を亡くしたあと、三人の弟や妹を育てながら暮らしていました。ところが兄の家康が大きな借金をつくって逃げてしまい、幸の家にはなんと二億五千万円もの借金が残されます。",
"幸には、昔テニスをしていた経験がありました。そこで「プロのテニス選手になって賞金を稼ぎ、借金を返そう」と決めます。しかしプロの世界には、強い選手だけでなく、お金や人気、マスコミの思惑もありました。",
"特に財閥の令嬢・竜ヶ崎蝶子は、表ではかわいらしい人気選手ですが、裏では幸をじゃまします。そのため幸は、何も悪いことをしていないのに観客から嫌われたり、ひどい悪口を書かれたりします。それでも幸は、家族を守るためにテニスを続けます。",
"幸は世界の大会へ進み、ついにはウィンブルドンのセンターコートへたどりつきます。相手は世界最強の女王ニコリッチです。その一方で、弟や妹たちまで悪い人間に捕まるなど、幸のまわりでは大事件が起こります。",
"最後には、家族の問題や借金にも決着がつき、幸は自分の力で人生を切り開いていきます。題名どおり、「不幸ばかりだった女の子が、自分でHappyをつかむ」物語です。"
]},
{ cat:"m_drama", title:"BILLY BAT", spine:"BILLY|BAT", yomi:"ビリーバット", sub:"作者：浦沢直樹／ストーリー共同制作：長崎尚志", author:"浦沢直樹／長崎尚志", authorYomi:"うらさわなおき", icon:"🦇", text:[
"第二次世界大戦が終わったあとのアメリカで、日系人の漫画家ケヴィン・ヤマガタは、「ビリーバット」というコウモリのキャラクターを主人公にした漫画を描いていました。",
"ところがある日、「そのコウモリの絵は、ずっと昔から日本に存在している」と聞かされます。ケヴィンは真相を調べるため日本へ向かいますが、そこで殺人事件や謎の巻物に巻きこまれてしまいます。",
"調べていくと、コウモリの印は何百年、何千年も前から世界の歴史に現れていたことが分かります。ケネディ大統領暗殺や月への宇宙飛行など、歴史上の大事件の裏にも「ビリー」が関係しているように見えてきます。",
"さらにビリーには、人間へささやきかけて未来を変えようとするような不思議な力があります。しかし、その声が本当に神の声なのか、悪魔なのか、それとも人間自身の心が生みだしたものなのかは、簡単には分かりません。",
"ケヴィンだけでなく、次の世代の漫画家たちもビリーを描き続けます。権力を持つ人間たちは、その力を利用して世界を動かそうとします。",
"最後には、「未来を決める特別な力」よりも、人間一人ひとりが何を信じ、何を描き、どう生きるかのほうが大切なのだというところへ物語はたどりつきます。"
]},
{ cat:"m_drama", title:"あさドラ!", yomi:"あさドラ", sub:"浦沢直樹", author:"浦沢直樹", authorYomi:"うらさわなおき", icon:"✈️", text:[
"1959年、名古屋に住む少女・浅田アサの家では、お母さんがもうすぐ赤ちゃんを産もうとしていました。アサは医者を呼びに走りますが、その途中で春日という男に誘拐されてしまいます。",
"ところがその日、東海地方を巨大な台風が襲います。町は水につかり、大勢の人が助けを求めていました。アサと春日は、自分たちだけ逃げるのではなく、小さな飛行機を使って食べ物を届け、人々を助けようとします。",
"やがてアサは成長し、飛行機にかかわる仕事へ進んでいきます。しかし彼女の人生には、台風の日からずっと続いている大きな謎がありました。海や空の向こうに、人間では説明できない巨大な「何か」が存在しているのです。",
"物語は東京オリンピックの時代など、昭和の日本を舞台に進んでいきます。アサは家族や仲間たちと生きながら、その巨大な存在と日本の歴史に隠された謎へ近づいていきます。",
"これはまだ完結していない物語です。2026年にも浦沢直樹の連載作品として続いているため、アサと巨大な存在の最後の決着は、まだ描かれていません。"
]},
{ cat:"m_work", title:"岳", yomi:"がく", sub:"石塚真一", author:"石塚真一", authorYomi:"いしづかしんいち", icon:"🏔️", text:[
"島崎三歩は、北アルプスの山々を愛する山岳救助のボランティアです。三歩は世界じゅうの高い山に登った経験をもち、雪や岩山の中でも驚くほど冷静に人を助けます。",
"山では、きれいな景色だけではありません。道に迷った人、崖から落ちた人、雪崩に巻きこまれた人など、毎日のように事故が起こります。三歩は危険な場所へ向かい、生きている人を助け、ときには助けられなかった人を山から連れて帰ります。",
"三歩は、救助された人に「よく頑張った」と声をかけます。登山者が失敗したからといって責めません。「山は楽しい。でも山は怖い」。その両方を知っているからです。",
"やがて三歩は、日本の山だけでなく再び世界最高峰のエベレストへ向かいます。そこで大きな遭難事故が起こり、三歩は自分の命よりもほかの登山者を助けることを選びます。",
"最後に三歩は山で姿を消し、戻ってきません。それでも三歩に助けられた人々や仲間たちは、彼から教えられた「山を愛すること」「人を助けること」を胸に、山と向き合い続けます。"
]},
{ cat:"m_art", title:"BLUE GIANT", spine:"BLUE|GIANT", yomi:"ブルージャイアント", sub:"石塚真一", author:"石塚真一", authorYomi:"いしづかしんいち", icon:"🎷", text:[
"仙台に住む高校生・宮本大は、ある日ジャズの演奏を聴き、大きな衝撃を受けます。「自分は世界一のジャズプレイヤーになる」。そう決めた大は、テナーサックスを手に入れ、毎日のように川原で練習を始めます。",
"高校を卒業すると、大は東京へ向かいます。そこで天才的なピアニスト・沢辺雪祈と出会い、さらに、楽器をほとんどやったことのない友人・玉田俊二がドラムを始めます。三人は「JASS」というバンドを作ります。",
"最初はうまくいきません。特に玉田は二人についていくだけで精いっぱいです。それでも三人はライブを重ね、少しずつ自分たちだけの音を作り上げていきます。そして、いつしか日本最高峰のジャズクラブ「So Blue」で演奏することが目標になります。",
"ところが夢がかなう直前、雪祈が大きな交通事故にあい、三人で演奏する未来がこわれてしまいます。JASSは大きな転機を迎えます。",
"それでも大はサックスをやめません。「世界一になる」という約束を胸に、日本を離れ、一人でヨーロッパへ向かいます。",
"『BLUE GIANT』本編はそこで終わりますが、大の物語そのものは続編『BLUE GIANT SUPREME』へ続いていきます。"
]},
{ cat:"m_food", title:"深夜食堂", yomi:"しんやしょくどう", sub:"安倍夜郎", author:"安倍夜郎", authorYomi:"あべやろう", icon:"🏮", text:[
"大都会の路地裏に、夜の12時から朝までだけ開く小さな食堂があります。店の名前は特にありませんが、みんなから「深夜食堂」と呼ばれています。",
"店のメニューに書いてあるのは、豚汁定食や酒など、ごくわずかなものだけです。しかしマスターは「材料さえあれば、できるものなら作るよ」と言って、お客さんが食べたい料理を作ってくれます。",
"店には、会社員、芸能人、ヤクザ、ストリッパー、タクシー運転手、老人、若者など、いろいろな人がやってきます。「赤いウインナー」「卵焼き」「お茶漬け」など、一見なんでもない料理から、昔の恋や家族の思い出がよみがえります。",
"ある人は好きだった人と再会し、ある人は別れ、ある人は故郷へ帰ります。幸せな話だけではありませんが、マスターはあまり説教せず、静かに料理を出します。",
"大きな悪者も、世界を救う事件もありません。一晩だけ同じ店に集まった人たちの、小さな人生を一皿の料理といっしょに描いていく物語です。"
]},
{ cat:"m_food", title:"孤独のグルメ", yomi:"こどくのグルメ", sub:"原作：久住昌之／作画：谷口ジロー", author:"久住昌之／谷口ジロー", authorYomi:"くすみまさゆき", icon:"🍜", text:[
"井之頭五郎は、自分で輸入雑貨の仕事をしている中年男性です。仕事で東京やその周辺の町を歩き回り、用事が終わるころになると、おなかがすいてきます。",
"「さて、今日は何を食べよう」。",
"五郎は一人で店を探します。有名な高級店よりも、町の定食屋、焼肉屋、居酒屋、中華料理屋など、ごく普通のお店に入ることが多いです。",
"料理が届くと、五郎は心の中でいろいろ考えます。「この味には白いごはんだ」「ここで追加するなら何だ」「しまった、注文しすぎた」。大事件は起きません。ただ一人の男が、本気で昼ごはんや晩ごはんを食べます。",
"ときには店の雰囲気が合わなかったり、注文に失敗したりします。それでも最後には腹いっぱいになり、「よし、仕事に戻ろう」と町へ出ていきます。",
"一つの大きな物語が最後に解決する漫画ではなく、「知らない町で、一人で食べる楽しさ」を何度も描いていく作品です。"
]},
{ cat:"m_food", title:"きのう何食べた？", yomi:"きのうなにたべた", sub:"よしながふみ", author:"よしながふみ", icon:"🍳", text:[
"筧史朗、通称シロさんは弁護士です。いっしょに暮らしている矢吹賢二、通称ケンジは美容師です。二人は恋人どうしで、東京の2DKの部屋で暮らしています。",
"シロさんは料理が得意で、スーパーの安売りを見つけるのが大好きです。「今日は鶏肉が安かったから親子丼」「この野菜は明日のお弁当にも使おう」と考えながら、毎日の食事を作ります。",
"しかし物語の中心にあるのは料理だけではありません。二人が同性愛者であることを家族や職場へどこまで話すのか、親が年を取ったらどうするのか、自分たちも年を取ったらどう暮らすのか、といった問題が少しずつ出てきます。",
"シロさんは人前で自分たちの関係を話すことをためらうことがあります。一方、ケンジはもっと自然に「シロさんが恋人だ」と思っています。ケンカをすることもありますが、夕食をいっしょに食べながら、二人は少しずつ家族になっていきます。",
"現在も物語は続いています。二人が特別な大事件を乗り越えるというより、「今日のごはんをいっしょに食べる」という毎日の積み重ねそのものが物語になっています。"
]},
{ cat:"m_food", title:"しあわせは食べて寝て待て", spine:"しあわせは|食べて寝て待て", yomi:"しあわせはたべてねてまて", sub:"水凪トリ", author:"水凪トリ", authorYomi:"みずなぎとり", icon:"🥣", text:[
"麦巻さとこは、免疫に関係する病気をもっています。そのため以前のように無理をして働くことができず、週四日のパートをしながら生活していました。",
"お金にも体力にも余裕がなくなったさとこは、家賃の安い古い団地へ引っ越します。そこで、世話好きな大家の鈴さんや、料理や食べものに詳しい司と出会います。",
"さとこは、それまで「元気な人と同じように働かなければ」「普通の人生を送らなければ」と考えていました。しかし団地の人々と話し、季節の食べものを食べ、疲れた日はきちんと休むことで、少しずつ考え方が変わります。",
"体が弱いから人生が終わるわけではありません。たくさん働けなくても、豪華な家に住めなくても、おいしいものを食べ、よく眠り、気の合う人と話すことはできます。",
"さとこは「しあわせになるために無理をする」のではなく、「自分の体に合った小さなしあわせ」を見つけていきます。作品は現在も続いています。"
]},
{ cat:"m_fantasy", title:"ハクメイとミコチ", sub:"樫木祐人", author:"樫木祐人", authorYomi:"かしきゆうと", icon:"🌰", text:[
"深い森の中に、身長わずか9センチほどの小さな人たちが暮らしています。その森の木の家でいっしょに暮らしているのが、ハクメイとミコチという二人の女の子です。",
"ハクメイは元気で行動的です。大工仕事や修理が得意で、「面白そうだから行ってみよう」とすぐ冒険に出かけます。ミコチは料理や裁縫が得意で、落ち着いて物事を考えるタイプです。",
"二人の世界では、葉っぱが大きな傘になり、鳥の背中が乗り物になります。町には動物や虫たちも暮らし、職人、お店、祭り、列車など、人間の世界と似ているようで少し違う文化があります。",
"二人は、ときには遠くの町へ出かけ、ときには家を直し、友達と食事をし、お祭りへ行きます。大きな魔王を倒すような目的はありません。",
"「小さな人から見れば、いつもの森も大冒険になる」。そんな世界で、ハクメイとミコチが毎日を楽しく暮らしていく物語です。"
]},
{ cat:"m_history", title:"ふしぎの国のバード", yomi:"ふしぎのくにのバード", sub:"佐々大河", author:"佐々大河", authorYomi:"さっさたいが", icon:"🧳", text:[
"明治時代の日本。イギリスからイザベラ・バードという女性旅行家がやってきます。",
"当時の外国人がよく訪れる東京や横浜だけを見るのではなく、バードは「外国人がほとんど行ったことのない日本を見たい」と考えます。そして通訳の伊藤鶴吉といっしょに、東北地方を通って北海道を目指す旅へ出ます。",
"今のように電車やホテルがたくさんある時代ではありません。山道を歩き、馬に乗り、虫だらけの宿に泊まり、病気になることもあります。村の人たちから珍しそうに見られることもあります。",
"それでもバードは、農村で暮らす人々の生活、食事、服、祭り、家のつくりなどを細かく観察します。そして、「外国から見た日本」という目で、よいところも貧しさも記録していきます。",
"旅の大きな目的の一つは、北海道で暮らすアイヌの人々に会うことです。",
"実在したイザベラ・バードの日本旅行をもとに、「明治時代の日本を外国人といっしょに旅する」ように描いた物語です。"
]},
{ cat:"m_history", title:"乙嫁語り", yomi:"おとよめがたり", sub:"森薫", author:"森薫", authorYomi:"もりかおる", icon:"🧵", text:[
"19世紀の中央アジア。12歳の少年カルルクの家へ、20歳の女性アミルがお嫁さんとしてやってきます。年は8歳も離れていますが、二人は同じ家で暮らしながら、少しずつお互いを大切な家族として思うようになります。",
"ところがアミルの実家は、「もっと力のある一族と結婚させたい」と考え、いったん嫁いだアミルを連れ戻そうとします。カルルクの家族や町の人々は「アミルはもう私たちの家族だ」と守り、追い返します。",
"物語はアミルとカルルクだけではありません。中央アジアを旅するイギリス人スミスが、未亡人タラスと恋をしたり、双子の少女たちがお婿さんを探したり、結婚を待つパリヤという少女が悩んだりします。",
"刺繍、料理、結婚式、家づくり、遊牧生活など、土地ごとの暮らしも細かく描かれます。",
"その一方で、北からロシア帝国の力が近づき、昔ながらの生活にも大きな変化が迫ってきます。いろいろな「お嫁さん」の人生を通して、家族と文化が受けつがれていく物語です。"
]},
{ cat:"m_drama", title:"北北西に曇と往け", spine:"北北西に|曇と往け", yomi:"ほくほくせいにくもとゆけ", sub:"入江亜季", author:"入江亜季", authorYomi:"いりえあき", icon:"🌋", text:[
"17歳の御山慧は、両親を亡くし、アイスランドで祖父ジャックと暮らしています。慧は小さな探偵の仕事をしながら生活していますが、普通の人にはない力を持っています。車や電化製品などの「機械の声」が分かるのです。",
"ある日、日本にいるはずの弟・三知嵩と連絡が取れなくなります。心配して日本へ戻った慧は、弟を預かっていた叔父と叔母が死んでいることを知ります。さらに三知嵩には、その死に関係しているのではないかという疑いまでかけられていました。",
"やがてアイスランドへ来た三知嵩と再会しますが、慧の周囲の人々は「この弟は何かがおかしい」と感じます。三知嵩にもまた、人の心を引きつけるような不思議な力があるようなのです。",
"慧は弟を信じたいと思いながらも、本当に何が起きたのかを調べ始めます。",
"火山、氷河、温泉、広い荒野など、美しいアイスランドを旅する楽しさと、「弟は本当に無実なのか」という暗い謎がいっしょに進んでいく物語です。"
]},
{ cat:"m_history", title:"ふたがしら", sub:"オノ・ナツメ", author:"オノ・ナツメ", authorYomi:"オノナツメ", icon:"🦹", text:[
"江戸時代。弁蔵と宗次は、「赤目」という盗賊の一味に入っていました。",
"赤目には、「人を殺さない」「むやみに脅さない」「悪い金をいただく」という決まりがあります。二人は頭の辰五郎を尊敬し、いつか自分たちも立派な盗賊になりたいと思っていました。",
"ところが辰五郎が亡くなり、跡目をめぐって一味の中に争いが起こります。弁蔵と宗次は赤目を離れ、「いつか自分たちだけの一味を作って、でっかい仕事をしよう」と旅に出ます。",
"豪快で一直線な弁蔵と、冷静で頭の切れる宗次。性格はまるで違いますが、一人ではできないことを二人ならやれます。旅の途中でさまざまな盗賊や悪党と出会いながら、二人は「どんな盗賊になりたいのか」を考えていきます。",
"やがて仲間を集めた二人は、一人の頭ではなく、二人が並んで一味を率いる「ふたがしら」となります。",
"お金を盗む話でありながら、「自分が尊敬できる生き方とは何か」を描いた時代劇です。"
]},
{ cat:"m_history", title:"へうげもの", sub:"山田芳裕", author:"山田芳裕", authorYomi:"やまだよしひろ", icon:"🍵", text:[
"戦国時代。古田左介という武将がいました。のちの茶人・古田織部です。",
"左介は戦で手柄を立てることも大切ですが、それ以上に、茶碗や茶室、着物など「美しいもの」「変わったもの」が大好きでした。立派な茶器を見ると、命の危険がある場所でも目を輝かせます。",
"左介は織田信長に仕え、その後は豊臣秀吉の時代を生きます。そして天下一の茶人・千利休と出会い、「わび」という美しさを学びます。しかし左介は、ただ利休のまねをするのではなく、ゆがんだ茶碗や大胆な形を面白がる、自分だけの美しさを作っていきます。",
"その一方、信長、秀吉、徳川家康たちは天下をめぐって争います。茶の湯の世界も政治と無関係ではなく、利休は秀吉に切腹を命じられます。",
"時代が徳川へ変わったあとも、織部は自分の美しさを追い続けます。しかし最後には家康から謀反を疑われ、切腹を命じられます。",
"それでも織部は最後まで、「人と同じではつまらない」という自分の美学を捨てません。戦国時代を「天下」ではなく「茶碗と美」の目から描いた物語です。"
]},
{ cat:"m_art", title:"昭和元禄落語心中", spine:"昭和元禄|落語心中", yomi:"しょうわげんろくらくごしんじゅう", sub:"雲田はるこ", author:"雲田はるこ", authorYomi:"くもだはるこ", icon:"🪭", text:[
"刑務所を出たばかりの男・与太郎は、落語家の八代目有楽亭八雲のもとを訪れ、「弟子にしてください」と頼みます。",
"八雲は人を寄せつけない冷たい男でしたが、なぜか与太郎を弟子にします。八雲の家には、小夏という女性も住んでいました。小夏の父・助六は、昔、八雲の親友であり最大のライバルだった落語家です。",
"やがて八雲は、自分の若いころの話を語り始めます。八雲は昔「菊比古」と呼ばれ、まじめに落語を学んでいました。一方の助六は、型にはまらない天才でした。二人は親友でありながら、いつも競い合っていました。",
"しかし助六は落語の世界から離れ、愛した女性・みよ吉とともに暮らすようになります。そしてある夜、助六とみよ吉は事故によって命を落としてしまいます。残された娘が小夏でした。",
"八雲は「自分の代で落語を終わらせよう」と考えていました。しかし与太郎は落語を愛し、小夏と家庭をつくり、新しい「助六」を名乗って落語を未来へつなぎます。",
"年老いた八雲が亡くなったあとも、落語は消えません。最後には次の世代の子どもたちまで高座へ向かい、「人が死んでも芸は受けつがれていく」という形で物語は終わります。"
]},
{ cat:"m_history", title:"昭和天皇物語", spine:"昭和天皇|物語", yomi:"しょうわてんのうものがたり", sub:"漫画：能條純一／原作：半藤一利／監修等：志波秀宇・永福一成", author:"能條純一／半藤一利／志波秀宇・永福一成", authorYomi:"のうじょうじゅんいち", icon:"🎌", text:[
"のちに昭和天皇となる裕仁は、明治時代に皇室の少年として生まれました。",
"普通の子どもとは違い、将来天皇になることが決まっています。そのため幼いころから軍事、歴史、政治、外国語などを学び、自分の感情よりも「国を背負う人間としてどうするべきか」を考えるよう求められます。",
"成長した裕仁はヨーロッパを訪問し、良子と結婚します。そして父・大正天皇が亡くなると、若くして昭和天皇となります。",
"しかし昭和の日本では、軍の力がどんどん強くなります。満州事変、二・二六事件、日中戦争、そして太平洋戦争へと進み、天皇のまわりでは「戦うべきだ」「戦争を終わらせるべきだ」と多くの人が争います。",
"戦況は悪化し、日本各地が空襲され、広島と長崎には原子爆弾が落とされます。そして1945年8月、裕仁は戦争を終わらせる決断へ向かいます。2026年の連載では、この終戦の時期まで物語が進んでいます。",
"実在した人物を主人公に、「天皇という立場から昭和史を見る」歴史漫画です。"
]},
{ cat:"m_history", title:"阿・吽", yomi:"あうん", sub:"おかざき真里", author:"おかざき真里", authorYomi:"おかざきまり", icon:"🛕", text:[
"奈良時代の終わりから平安時代の初め。二人の若い僧が、それぞれ仏教の真理を求めていました。",
"一人は最澄。まじめで、自分にも他人にもきびしく、「すべての人を救える仏教を日本につくりたい」と考えます。もう一人は空海。大胆で自由な天才で、山の中で修行しながら、自分の力で真理へ近づこうとしていました。",
"二人は遣唐使として中国へ渡ります。そこで最澄は天台の教えを、空海は密教を学びます。特に空海は短い滞在の中で多くの教えを受け、日本へ帰るころには大きな力を身につけていました。",
"帰国後、二人は協力することもあります。しかし最澄が空海から密教を学ぼうとするうち、考え方の違いが大きくなり、二人はしだいに別の道を歩むようになります。",
"最澄は比叡山を中心に天台宗を育てようとし、空海は高野山などを中心に真言密教を広めていきます。",
