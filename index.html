"二人は最後まで同じ道を歩くことはありませんでした。それでも互いの存在があったからこそ、自分の道をさらに深く進むことができました。",
"最澄の死と、その後も生き続ける空海までを描き、日本仏教を大きく変えた二人の生涯を描いて物語は終わります。"
]},
{ cat:"m_horror", title:"宗像教授伝奇考", spine:"宗像教授|伝奇考", yomi:"むなかたきょうじゅでんきこう", sub:"星野之宣", author:"星野之宣", authorYomi:"ほしのゆきのぶ", icon:"🐉", text:[
"宗像伝奇は、大学で民俗学を研究している教授です。",
"宗像教授は、日本各地に残る昔話、神話、お祭り、地名などを調べています。普通の人なら「昔の人が考えたただのお話だ」と思うような伝説でも、宗像教授は「この話には、昔本当に起きた何かが隠れているのではないか」と考えます。",
"たとえば、大蛇を退治した伝説が、昔起きた洪水を表しているのかもしれません。鬼の話が、遠くからやってきた人々の記憶なのかもしれません。",
"宗像教授は古い文献を調べ、遺跡へ出かけ、土地のお年寄りの話を聞きます。すると伝説と歴史が少しずつつながっていきます。",
"ときには、その秘密を隠したい人々に襲われたり、大きな事件へ巻きこまれることもあります。",
"一つの大きな事件を最初から最後まで追う漫画ではなく、宗像教授が日本や世界の伝説を一つずつ読み解き、「神話の中には本当の歴史が眠っているかもしれない」と見せていく物語です。"
]},
{ cat:"m_art", title:"ギャラリーフェイク", yomi:"ギャラリーフェイク", sub:"細野不二彦", author:"細野不二彦", authorYomi:"ほそのふじひこ", icon:"🖼️", text:[
"藤田玲司は、東京で「ギャラリーフェイク」という画廊を経営しています。",
"名前のとおり、表向きは贋作――つまり本物そっくりの偽物――を売る店です。しかし藤田は、昔ニューヨークの大きな美術館で働いていた一流の学芸員で、美術品を見る目も修復する腕も超一流でした。",
"藤田のもとには、「本物か偽物か調べてほしい」「盗まれた絵を取り戻してほしい」「壊れた作品を直してほしい」という依頼がやってきます。ときには法律ぎりぎりの取り引きをし、盗品を扱うことさえあります。",
"藤田のそばには、中東の王族の娘サラがいます。サラは藤田にひかれながら、世界じゅうの美術事件にいっしょに巻きこまれていきます。",
"藤田はお金にがめつい悪人のように見えます。しかし、「本物の芸術を守るため」なら、損をしてでも動くことがあります。",
"絵画、彫刻、陶器、宝石など、毎回さまざまな美術品の秘密を解き明かす物語です。いったん完結したあと新作が再開され、2026年にも新しい単行本が刊行されています。"
]},
{ cat:"m_work", title:"王様の仕立て屋", yomi:"おうさまのしたてや", sub:"大河原遁", author:"大河原遁", authorYomi:"おおかわらじゅん", icon:"👔", text:[
"イタリア・ナポリ。日本人の織部悠は、小さな仕立て屋で働く若い職人です。",
"しかし、その腕はただものではありません。伝説の名仕立て職人から技を受けついだ弟子で、一人ひとりの体にぴったり合ったスーツを作ることができます。",
"悠のところへ来るのは、お金持ちだけではありません。大事な面接をひかえた人、結婚式へ行く人、仕事で自信をなくした人など、いろいろな悩みを持った人がやってきます。",
"悠はただ高級な服を作るのではありません。「この人はどんな仕事をするのか」「どんな場所へ行くのか」「どう見られたいのか」を考え、生地や形を選びます。",
"すると一着の服によって、弱気だった人が自信を取り戻したり、こわれかけていた人間関係が変わったりします。",
"やがて悠はナポリだけでなく、ヨーロッパや日本へも活動の場を広げます。",
"「よい服とは、高い服ではなく、その人がその人らしく立てる服なのだ」ということを、さまざまな客の人生を通して描く物語です。"
]},
{ cat:"m_work", title:"働きマン", yomi:"はたらきマン", sub:"安野モヨコ", author:"安野モヨコ", authorYomi:"あんのもよこ", icon:"💼", text:[
"松方弘子は、週刊誌「JIDAI」で働く29歳の編集者です。",
"普段は普通の女性ですが、大きな仕事が始まると、ごはんも睡眠も忘れて働き始めます。その猛烈な姿から、同僚たちは彼女を「働きマン」と呼びます。",
"弘子は政治家のスクープを追いかけたり、作家に原稿を頼んだり、締め切りに追われたりします。「いい記事を作りたい」と思うほど、仕事はどんどん生活の中へ入ってきます。",
"そのため恋人との関係がうまくいかなかったり、「私は仕事のために生きているのだろうか」と悩むこともあります。",
"物語では弘子だけでなく、編集長、記者、営業、作家など、周囲の人たちの「なぜ働くのか」も描かれます。お金のため、夢のため、家族のため、自分の誇りのため――答えは人によって違います。",
"最後に一つの正解が出る作品ではありません。「仕事は人生の全部ではない。でも仕事に本気になる瞬間も確かにある」という迷いを、そのまま描いていく物語です。"
]},
{ cat:"m_love", title:"東京タラレバ娘", yomi:"とうきょうタラレバむすめ", sub:"東村アキコ", author:"東村アキコ", authorYomi:"ひがしむらあきこ", icon:"🍻", text:[
"鎌田倫子は、東京で脚本家をしている30代の女性です。高校時代からの親友・香、小雪とよく居酒屋に集まり、恋愛の話をしています。",
"「あのときあの人と結婚してたら」「もっと若かったら」。",
"三人はいつも「たら」「れば」の話ばかりしています。",
"そんな三人の前に、金髪の若い男性KEYが現れ、「タラレバばかり言っていたら、いつまでたっても幸せになれない」と言います。",
"倫子たちは腹を立てますが、自分たちが「いつかもっといい人が現れる」と待っているうちに時間が過ぎてしまったことにも気づきます。",
"香は昔の恋人との関係、小雪は妻のいる男性との恋、倫子は仕事とKEYへの気持ちに悩みます。三人とも失敗し、泣き、また居酒屋へ集まります。",
"やがて倫子は、幸せとは「条件のいい相手に選んでもらうこと」ではなく、自分で自分の人生を選ぶことだと気づいていきます。",
"恋人ができればすべて解決するのではありません。三人が「タラレバ」をやめて、自分たちの今を生きようとするところへ物語は進んでいきます。"
]},
{ cat:"m_drama", title:"海街diary", yomi:"うみまちダイアリー", sub:"吉田秋生", author:"吉田秋生", authorYomi:"よしだあきみ", icon:"🌊", text:[
"鎌倉の古い家で、香田幸、佳乃、千佳という三姉妹が暮らしていました。",
"三人の父親は昔、別の女性と恋をして家を出ていきました。その父が亡くなったという知らせが届き、三姉妹は葬式へ向かいます。",
"そこで、父と別の女性のあいだに生まれた中学生の少女・すずと出会います。",
"すずにはもう安心して暮らせる場所がありません。そこで幸たちは、「鎌倉に来て、私たちといっしょに暮らさない？」と誘います。",
"こうして四姉妹の生活が始まります。",
"すずは「自分が生まれたせいで、お姉さんたちの家族をこわしたのではないか」と苦しみます。しかし姉たちは、悪いのは子どもではなく大人の問題だと教えます。",
"四人はいっしょにごはんを食べ、梅酒を作り、恋をし、仕事に悩み、家族の死を見送ります。",
"亡くなった父や家を出た母への怒りも、すぐには消えません。それでも四姉妹は、血のつながりだけではなく「いっしょに暮らした時間」で本当の家族になっていきます。"
]},
{ cat:"m_drama", title:"Sunny", yomi:"サニー", sub:"松本大洋", author:"松本大洋", authorYomi:"まつもとたいよう", icon:"🚗", text:[
"「星の子学園」という児童養護施設に、親といっしょに暮らすことのできない子どもたちが住んでいます。",
"施設の庭には、もう動かない古い黄色い車「サニー」が置いてあります。",
"子どもたちは、そのサニーへ乗りこむと想像の世界へ出かけます。レーサーになったり、遠い国へ行ったり、会いたいお母さんのところへ帰ったりします。",
"春男は乱暴で反抗的な少年です。しかし本当は母親に迎えに来てほしくてたまりません。静は親から手紙が来ないことを気にし、純助たちほかの子どもにも、それぞれ家庭の事情があります。",
"「親がいないなんて平気だ」と強がっていても、本当はみんな寂しさを抱えています。",
"それでも施設の子どもや大人たちは、笑ったり、ケンカしたり、遊んだりしながら毎日を過ごします。",
"やがて子どもたちは少しずつ成長し、施設を出る者も現れます。サニーは動きませんが、そこは子どもたちが自由になれる心の中の車でした。",
"「子どもは大人が思っているよりずっと多くのことを考えている」と静かに描く物語です。"
]},
{ cat:"m_sports", title:"ピンポン", sub:"松本大洋", author:"松本大洋", authorYomi:"まつもとたいよう", icon:"🏓", text:[
"星野裕、通称ペコと、月本誠、通称スマイルは、子どものころからいっしょに卓球をしてきた友達です。",
"ペコは明るく、「自分は卓球の天才だ」と信じています。スマイルは無口ですが、本当はペコ以上の才能を持っていました。",
"高校の卓球部に入った二人は、中国から来た孔文革や、強豪校の風間竜一、幼なじみのアクマたちと戦います。",
"ところがペコは試合で負け、自信をなくして卓球をやめかけます。一方スマイルは、指導者の小泉から才能を見ぬかれ、どんどん強くなっていきます。",
"スマイルは勝てるようになっても、卓球を楽しめません。心の中ではずっと、「自分を卓球へ連れてきてくれたヒーロー」であるペコを待っていました。",
"ペコはもう一度練習を始めます。そして大きな大会で風間を破り、ついにスマイルと対戦します。",
"スマイルはその試合で、久しぶりに心から笑います。",
"その後、ペコはプロの卓球選手となります。二人にとって大切だったのは、誰が一番強いかだけではなく、「卓球が楽しい」と思える心を取り戻すことでした。"
]},
{ cat:"m_battle", title:"鉄コン筋クリート", yomi:"てっコンきんクリート", sub:"松本大洋", author:"松本大洋", authorYomi:"まつもとたいよう", icon:"🏙️", text:[
"宝町という古くてごちゃごちゃした町に、クロとシロという二人の少年が暮らしています。",
"二人に親はいません。町の屋根を飛び回り、悪い大人からお金を取ったりしながら、自分たちだけで生きています。",
"クロはケンカが強く、シロを守ろうとします。シロは少し不思議な子で、いつも空想の話をしています。",
"そんな宝町へ、町を大きな遊園地のように作り変えようとするヤクザや会社がやってきます。そしてクロとシロを追い出すため、とても強い殺し屋まで送りこみます。",
"戦いの中でシロが傷つき、クロと離ればなれになります。",
"シロを失ったクロの心はどんどん暗くなり、「自分は人を傷つけることしかできない」と思うようになります。心の中には「イタチ」という黒い存在まで現れます。",
"しかしシロは、クロに足りないものを持っていました。そしてクロも、シロに足りないものを持っています。",
"最後に二人はもう一度心をつなぎ、宝町を生きていきます。「二人で一人」のような少年たちが、自分の町と自分の心を守る物語です。"
]},
{ cat:"m_sf", title:"ナンバーファイブ 吾", spine:"ナンバー|ファイブ 吾", yomi:"ナンバーファイブ ご", sub:"松本大洋", author:"松本大洋", authorYomi:"まつもとたいよう", icon:"5️⃣", text:[
"遠い未来。地球の多くが砂漠となり、人類は「国際平和隊」に守られていました。",
"その中でも特に強い九人の超人が「虹組」と呼ばれています。ところが、その一人であるNo.吾が組織を裏切り、マトリョーシカという女性を連れて逃げ出します。",
"虹組は次々と仲間を送り、吾を捕まえようとします。しかし吾は天才的な狙撃の腕をもち、簡単には捕まりません。",
"物語が進むにつれ、虹組のメンバーたちがどんな過去をもち、なぜ平和隊に入ったのかが明らかになります。",
"そして、「世界を守るためにつくられた強い人間たち」が、本当に自由なのかという疑問も出てきます。",
"吾が逃げたのは、ただ悪人になったからではありません。組織に決められた生き方ではなく、自分自身の意志で生きようとしたからです。",
"虹組の仲間たちは戦いながら、自分が何のために生きているのかを考えることになります。",
"未来の戦争を描きながら、「人間は誰かに決められた番号ではなく、一人の人間として生きられるのか」を描く物語です。"
]},
{ cat:"m_horror", title:"GoGoモンスター", yomi:"ゴーゴーモンスター", sub:"松本大洋", author:"松本大洋", authorYomi:"まつもとたいよう", icon:"📦", text:[
"小学校三年生の立花ユキには、ほかの子どもには見えないものが見えます。",
"ユキは学校の中に、普通の世界とは別の「あっちの世界」があると言います。そして「あっち」から何かがこちらへ入ってきていると考えています。",
"しかしクラスの子たちには何も見えません。そのためユキは「変なことを言う子」と思われ、だんだん一人になっていきます。",
"そんなユキの話を聞いてくれるのが転校生の鈴木マコトです。また、学校の用務員ガンツや、箱をかぶった不思議な上級生IQも、ユキの感じている世界を完全には否定しません。",
"季節が春から夏、秋、冬へ進むにつれ、「あっちの世界」はユキの心へどんどん近づいてきます。",
"本当に怪物がいるのか、それともユキの心が生みだしたものなのかは、はっきり説明されません。",
"最後にはマコトとの友情が、ユキをこちらの世界へつなぎとめます。",
"子どものころには見えていたものが、大人になると見えなくなってしまう――そんな不思議で少し怖い物語です。"
]},
{ cat:"m_history", title:"竹光侍", yomi:"たけみつざむらい", sub:"原作：永福一成／作画：松本大洋", author:"永福一成／松本大洋", authorYomi:"えいふくいっせい", icon:"🎋", text:[
"江戸の長屋へ、瀬能宗一郎という若い浪人が引っ越してきます。",
"宗一郎はとても穏やかで、団子を食べたり、町を歩いたり、近所の子ども・勘吉と遊んだりしています。しかし実は、剣を持たせればものすごく強い侍でした。",
"それなのに宗一郎が腰へ差しているのは、本物の刀ではなく竹でできた「竹光」です。",
"宗一郎は人を斬る暮らしから離れたいと思っていました。しかし昔使っていた名刀や、彼の強さを知る剣士たちは、まるで宗一郎を戦いの世界へ引き戻そうとするように現れます。",
"宗一郎の中にも、「人を斬ることを楽しんでしまう自分」が眠っています。",
"やがて宗一郎を倒そうとする強い剣客との戦いが避けられなくなります。それでも宗一郎は、ただ殺し合うだけの侍へ戻ることを拒みます。",
"最後には自分の過去と剣に決着をつけ、「剣に生かされるのではなく、自分の心で生きる」道へ進みます。",
"穏やかな日常と、人を斬る恐ろしい剣の世界が同じ男の中にある物語です。"
]},
{ cat:"m_drama", title:"花男", yomi:"はなお", sub:"松本大洋", author:"松本大洋", authorYomi:"まつもとたいよう", icon:"⚾", text:[
"花田茂雄は、勉強のできるまじめな少年です。",
"夏休み、茂雄は父・花田花男と暮らすことになります。しかし父親の花男は、息子とはまったく違います。海辺の町で草野球をしながら暮らし、いつかプロ野球の読売ジャイアンツへ入るという、とても大きな夢を本気で信じています。",
"茂雄は最初、「こんなだらしない父親は嫌だ」と思います。勉強して立派な大人になるほうが大切だと考えていました。",
"しかし花男と毎日を過ごすうち、茂雄は、点数や偏差値だけでは分からない楽しさを知ります。野球をし、町の変わった人たちと遊び、失敗する父親を見ながら、少しずつ心が自由になっていきます。",
"花男もまた、息子と暮らすことで父親として成長します。",
"そして花男は、本当に「ジャイアンツに入る」という無茶な夢へ向かって動き始めます。",
"父は父の夢を追い、息子は息子の人生へ戻っていきます。二人が完璧に同じ考えになるのではなく、「変な父親だけれど、これが自分の父親だ」と茂雄が受け入れていく、父と息子の物語です。"
]},
{ cat:"m_fight", title:"ZERO", yomi:"ゼロ", sub:"松本大洋", author:"松本大洋", authorYomi:"まつもとたいよう", icon:"🥊", text:[
"五島雅は、「ZERO」と呼ばれるプロボクサーです。",
"彼は長いあいだ無敗を守り続ける世界ミドル級チャンピオンでした。強すぎるため、戦う相手がいなくなるほどです。",
"しかし五島自身は、自分の体が少しずつ年を取っていることを知っています。「いつか自分を本当に倒せる相手が現れるのではないか」。そんな相手を、怖がりながらも待っています。",
"そこへメキシコからトラビスという若いボクサーが現れます。五島は彼の中に、自分と似た強さと孤独を見つけます。",
"周囲は「五島はトラビスへ王者の座をゆずって引退するつもりなのだろう」と考えます。",
"しかしリングに立った五島は、そんな簡単な気持ちでは戦えません。相手が強くなればなるほど、「まだ負けたくない」「もっと戦いたい」というボクサーとしての本能が燃え上がります。",
"最後の戦いで五島は、王者であり続けることよりも、「自分のすべてをぶつけられる相手と戦う」という望みへたどりつきます。",
"最強であることの喜びと、最強だからこその孤独を描いた物語です。"
]},
{ cat:"m_work", title:"編集王", yomi:"へんしゅうおう", sub:"土田世紀", author:"土田世紀", authorYomi:"つちだせいき", icon:"📚", text:[
"桃井環八、通称カンパチはプロボクサーでした。",
"ところが目の病気が見つかり、ボクシングを続けられなくなります。夢を失ったカンパチは、幼なじみの紹介で漫画雑誌「週刊ヤングシャウト」の編集部で働き始めます。",
"しかしカンパチは漫画についてほとんど知りません。",
"編集部には、売れる漫画だけを求める編集長、漫画を心から愛する人、仕事として割り切る人など、さまざまな編集者がいます。",
"漫画家たちも同じです。人気がなくなって苦しむベテラン、デビューを夢見る新人、締め切りに追われる作家などがいます。",
"カンパチは、ボクシングで覚えた「本気で相手と向き合う」やり方で漫画家たちにぶつかります。そのため失敗もしますが、「売れるかどうか」だけではなく「この人が本当に描きたい漫画は何なのか」を考える編集者になっていきます。",
"最後には、利益だけを求める巨大出版社との競争まで起こります。",
"ボクサーになる夢を失った男が、今度は「漫画家が命をかけて描いた作品を読者へ届ける」という新しいリングを見つける物語です。"
]},
{ cat:"m_work", title:"ブラックジャックによろしく", spine:"ブラックジャック|によろしく", yomi:"ブラックジャックによろしく", sub:"佐藤秀峰", author:"佐藤秀峰", authorYomi:"さとうしゅうほう", icon:"🏥", text:[
"斉藤英二郎は、大学病院で研修を始めた若い医者です。",
"「医者になれば、人の命を救える」。そう思っていました。しかし実際の病院へ行くと、理想だけではどうにもならない問題がたくさんありました。",
"若い研修医は長い時間働いても給料が少なく、別の病院でアルバイトをしなければ生活できません。病院では、お金、人手不足、医師どうしの立場など、患者の命以外の事情も動いています。",
"英二郎は、赤ちゃんの集中治療室、がん治療、精神科など、いろいろな現場を経験します。",
"「助かる可能性の低い患者に、苦しい治療を続けるのか」「本人にがんだと伝えるのか」「心の病気をどう考えるのか」。",
"どの問題にも、簡単な正解はありません。",
"英二郎は上の医師とぶつかり、患者といっしょに泣き、自分の無力さに悩みます。それでも「病院の決まりだから」で終わらせず、目の前の一人を人間として見ようとします。",
"医療の世界のきびしさを知りながら、「医者とは何をする人なのか」を問い続ける物語です。"
]},
{ cat:"m_work", title:"医龍", yomi:"いりゅう", sub:"原案：永井明／漫画：乃木坂太郎", author:"永井明／乃木坂太郎", authorYomi:"ながいあきら", icon:"🫀", text:[
"朝田龍太郎は、戦争や災害の起きている地域で医療活動をしてきた天才外科医です。",
"ある日、大学病院の医師・加藤晶が朝田を訪ねます。加藤は非常に難しい心臓手術「バチスタ手術」を成功させ、自分の研究を完成させたいと考えていました。そのために朝田を中心とした最高のチームを作ろうとします。",
"朝田は手術の腕は天才的ですが、大学病院の偉い人に頭を下げるような男ではありません。「患者を助けること」を最優先にするため、病院の決まりや教授たちと何度もぶつかります。",
"チームには、若い研修医・伊集院、麻酔医・荒瀬など、最初は自信を失っていた医師たちも加わります。",
"朝田と働くことで、彼らは「偉い医者になるため」ではなく「患者を助けるため」に医療をすることを学んでいきます。",
"物語が進むと、教授選挙や病院経営など、医学以外の権力争いも大きくなります。",
"最後には、朝田一人だけがすごいのではなく、若かった伊集院たちも自分で患者を救える医師へ成長します。そして朝田は、また自分が必要とされる場所へ向かっていきます。"
]},
{ cat:"m_work", title:"JIN―仁―", yomi:"ジン", sub:"村上もとか", author:"村上もとか", authorYomi:"むらかみもとか", icon:"⚕️", text:[
"南方仁は、現代の東京で働く脳外科医です。",
"ある日、不思議な患者を手術したことをきっかけに、仁は突然、江戸時代の町へ落ちてしまいます。",
"そこは幕末。もちろん抗生物質も、CTも、消毒された手術室もありません。",
"仁は武士の橘恭太郎と妹の咲に助けられます。そして目の前でけが人や病人を見ると、医者として放っておくことができません。",
"仁は自分の現代医学の知識を使い、あり合わせの道具で手術をし、薬を作ります。コレラなどの流行病とも戦い、「仁友堂」という治療の場をつくります。",
"やがて坂本龍馬、勝海舟など、歴史上の人物とも知り合います。",
"しかし仁には大きな悩みがあります。「自分が歴史を変えすぎれば、未来そのものが消えるのではないか」。",
"それでも仁は、「目の前の命を見捨てることはできない」と治療を続けます。",
"最後には再び現代へ戻ることになりますが、そこは仁が以前いた世界とは少し違っていました。江戸で仁たちが始めた医療の足あとが歴史に残り、咲が仁へ残した思いも時代を越えて届きます。",
"二人はいっしょにはなれなくても、医療によって未来がつながったことを知って物語は終わります。"
]},
{ cat:"m_work", title:"コウノドリ", yomi:"コウノドリ", sub:"鈴ノ木ユウ", author:"鈴ノ木ユウ", authorYomi:"すずのきゆう", icon:"👶", text:[
"鴻鳥サクラは産婦人科医です。",
"普段は静かで穏やかな医師ですが、もう一つ、「BABY」という名前の天才ジャズピアニストとして演奏する顔も持っています。",
"サクラの病院には、毎日のように赤ちゃんを産む女性たちがやってきます。",
"元気な赤ちゃんが無事に生まれることもあります。しかし、妊娠や出産は必ず安全とは限りません。早産、病気、流産、死産など、つらい結果になることもあります。",
"また、お金のない妊婦、まだ若い妊婦、夫から暴力を受けている女性など、それぞれ違う事情を抱えた人もいます。",
"サクラたち医療チームは、「赤ちゃんを助ける」だけでなく、「お母さんがどう生きたいか」も考えながら治療をします。",
"どれだけ医者が努力しても助けられない命もあります。そのときサクラは、悲しんでいる家族に簡単な励ましを言うのではなく、その悲しみに寄りそいます。",
"さまざまな出産を通して、「生まれることは当たり前ではない」ということを描いた医療漫画です。"
]},
{ cat:"m_work", title:"フラジャイル", sub:"原作：草水敏／漫画：恵三朗", author:"草水敏／恵三朗", authorYomi:"くさみずびん", icon:"🔬", text:[
"岸京一郎は、病院で働く病理医です。",
"病理医は、患者を直接診察することはあまりありません。患者から取った細胞や組織を顕微鏡で見て、「この病気は何なのか」を診断する医者です。",
"岸はとても頭がよく、診断の間違いを見つける力があります。しかし性格はかなりきびしく、相手が偉い医者でも間違っていれば遠慮なく指摘します。",
"若い医師・宮崎智尋は、そんな岸の仕事を見て病理医の道へ進みます。",
"医師が「この患者はがんだろう」と思っていても、病理検査をすると違う病気だった――ということもあります。診断が一つ違うだけで、使う薬も手術の方法も変わります。",
"岸たちは表舞台には立ちませんが、「正しい診断」という医療の土台を守っています。",
"製薬会社、新薬、治験、病院経営などの問題にも巻きこまれながら、「患者本人を見ず、数字だけで医療をしてはいけない」と戦い続ける物語です。"
]},
{ cat:"m_work", title:"アンメット ―ある脳外科医の日記―", spine:"アンメット|―ある脳外科医の日記―", yomi:"アンメット あるのうげかいのにっき", sub:"原作：子鹿ゆずる／漫画：大槻閑人", author:"子鹿ゆずる／大槻閑人", authorYomi:"こじかゆずる", icon:"📔", text:[
"川内ミヤビは脳外科医です。しかし事故によって脳を傷つけ、過去の記憶の一部を失いました。さらに、新しく覚えたことも翌日にはほとんど忘れてしまいます。",
"そのためミヤビは毎日日記を書き、朝起きると「昨日の自分」が書いたノートを読んで生活しています。",
"ミヤビは「自分にはもう手術はできない」と考えていました。そこへアメリカから帰ってきた脳外科医・三瓶友治が現れます。",
"三瓶は「できることまでやめる必要はない」とミヤビを手術へ戻そうとします。そして三瓶は、事故の前のミヤビと自分が婚約していたことも知っていました。",
"二人は患者を治療しながら、ミヤビの記憶障害そのものの原因も調べます。",
"やがてミヤビの脳の状態がさらに悪くなり、命まで危険になります。ミヤビは手術を拒みますが、三瓶は彼女の日記から本当の思いを知り、仲間たちと難しい手術に挑みます。",
"手術は成功します。",
"最後には、ミヤビと三瓶が昔出会った南アフリカでの記憶もつながり、二人は再び同じ場所に立ちます。",
"「記憶を失っても、その人が生きてきたものまで消えるわけではない」と描いて物語は終わります。"
]},
{ cat:"m_work", title:"Shrink〜精神科医ヨワイ〜", spine:"Shrink|〜精神科医ヨワイ〜", yomi:"シュリンク せいしんかいヨワイ", sub:"原作：七海仁／漫画：月子", author:"七海仁／月子", authorYomi:"ななみじん", icon:"🫂", text:[
"弱井幸之助は、東京で小さな精神科クリニックを開いている医師です。",
"弱井のところには、うつ病、パニック症、摂食障害、依存症、PTSD、統合失調症など、さまざまな心の苦しみを抱えた人たちがやってきます。",
"患者の中には、「自分は病気ではない」「こんなことで病院へ行ってはいけない」と思っている人もいます。",
"弱井は、「すぐ元気になりましょう」とは言いません。どんな生活をして、何が苦しくなり、いつから眠れなくなったのか。一人ひとりの話をゆっくり聞きます。",
"そして薬だけでなく、家族、仕事、福祉、カウンセリングなど、患者の生活全体を見ながら回復を手伝います。",
"弱井自身にも過去があり、なぜ精神科医になったのか、昔どんな人を愛していたのかも少しずつ明らかになります。",
"病気が完全に消えることだけを「治る」と考えず、「病気があっても、その人が自分らしく暮らせるようになること」を大切にする物語です。",
"2026年にも新刊が刊行されており、物語はまだ続いています。"
]},
{ cat:"m_work", title:"透明なゆりかご", yomi:"とうめいなゆりかご", sub:"沖田×華", author:"沖田×華", authorYomi:"おきたばっか", icon:"🍼", text:[
"看護師を目指している少女・沖田は、産婦人科の病院でアルバイトを始めます。",
"最初は、「産婦人科は赤ちゃんが生まれる幸せな場所」だと思っていました。",
"たしかに、新しい命が生まれて家族が喜ぶ日もあります。しかし働き始めた沖田は、それだけではないことを知ります。",
"お腹の中で亡くなってしまう赤ちゃん、生まれてすぐ命を終える赤ちゃん、事情があって中絶を選ぶ女性、若すぎる母親、子どもを育てられない親もいます。",
"沖田は最初、どう声をかければよいのか分かりません。",
"けれど看護師や医師、患者たちと出会ううち、「命が生まれたから必ず幸せ」「生まれなかったから全部不幸」というほど、人間の人生は簡単ではないと知ります。",
"タイトルの「透明なゆりかご」とは、みんなには見えなくても、確かにそこにあった小さな命のことでもあります。",
"作者自身の体験をもとに、産婦人科で生まれる命と、そこで消えていく命の両方を描いた物語です。"
]},
{ cat:"m_work", title:"健康で文化的な最低限度の生活", spine:"健康で文化的な|最低限度の生活", yomi:"けんこうでぶんかてきなさいていげんどのせいかつ", sub:"柏木ハルコ", author:"柏木ハルコ", authorYomi:"かしわぎはるこ", icon:"🏢", text:[
"義経えみるは、市役所へ就職した新人職員です。",
"配属されたのは、生活に困っている人を助ける生活保護の担当でした。",
"えみるは最初、「お金を渡す仕事なのかな」くらいに考えていました。しかし実際に担当する人たちは、一人ひとりまったく事情が違います。",
"仕事を失った人、病気で働けない人、家族から暴力を受けている人、心の病気を抱えている人、依存症に苦しむ人などがいます。",
"中には、役所へ本当のことを話さない人もいます。えみるは失敗し、「どうしてちゃんとしてくれないの」と思ってしまうこともあります。",
"しかし先輩たちから、「困っている人ほど、自分から助けてと言えないことがある」と学びます。",
"生活保護は、ただお金を渡す制度ではありません。「もう一度、自分の人生を立て直すための支え」でもあります。",
"えみるはさまざまな人と出会いながら、「健康で文化的な最低限度の生活」という言葉が、本当はどんな生活を意味するのかを少しずつ理解していきます。"
]},
{ cat:"m_work", title:"リエゾン ―こどものこころ診療所―", spine:"リエゾン|―こどものこころ診療所―", yomi:"リエゾン こどものこころしんりょうじょ", sub:"原作・漫画：ヨンチャン／原作：竹村優作", author:"ヨンチャン／竹村優作", icon:"🧸", text:[
"研修医の遠野志保は、仕事で失敗することが多く、「自分は医者に向いていないのではないか」と悩んでいました。",
"そんな志保が出会ったのが、児童精神科医・佐山卓です。",
"佐山の診療所には、学校へ行けない子、落ち着いて座っていられない子、言葉がうまく出ない子、自分を傷つけてしまう子など、さまざまな子どもがやってきます。",
"志保自身にも発達障害の特性があります。",
"そのため「普通にできない自分」をずっと責めてきました。しかし佐山と働きながら、「できないことがある＝だめな人」ではないと気づいていきます。",
"診療では子どもだけを見ても解決しないことがあります。親が疲れきっていたり、学校との関係に問題があったり、家族そのものが助けを必要としている場合もあるからです。",
"佐山たちは医療、学校、福祉をつなぎながら、子どもと家族を支えます。",
"「子どもを普通にする」のではなく、「その子がその子のまま生きやすくなる方法を探す」ことを描いた医療漫画です。"
]},
{ cat:"m_love", title:"町田くんの世界", yomi:"まちだくんのせかい", sub:"安藤ゆき", author:"安藤ゆき", authorYomi:"あんどうゆき", icon:"🌍", text:[
"町田一は、ごく普通の高校生です。",
"運動が得意なわけでもありません。勉強もあまり得意ではなく、見た目が特別かっこいいわけでもありません。",
"しかし町田くんには、とても大きな長所があります。",
"人が大好きなのです。",
"困っている人がいれば自然に助け、子どもにも老人にも同級生にも同じように親切にします。本人は特別なことをしているつもりはありません。",
"そんな町田くんが、猪原奈々という女の子と出会います。",
"猪原さんは、過去に人間関係で傷つき、「人なんて嫌い」と思っていました。しかし町田くんのやさしさにふれ、少しずつ彼を好きになります。",
"ところが町田くんは、みんなを大切にするため、「一人だけを特別に好きになる」という恋愛の感情がよく分かりません。",
"猪原さんと離れそうになったとき、町田くんは初めて、「この人にはほかの人とは違う気持ちを持っている」と気づきます。",
"人間が大好きな少年が、「みんなへの愛」と「一人の人への恋」の違いを知っていく物語です。"
]},
{ cat:"m_drama", title:"凪のお暇", yomi:"なぎのおいとま", sub:"コナリミサト", author:"コナリミサト", icon:"🌀", text:[
"大島凪は28歳の会社員です。",
"凪はいつも「場の空気」を読み、周りの人に嫌われないように生きていました。本当は天然のくるくるした髪なのに、毎朝早く起きてまっすぐにし、会社でもみんなの話に合わせて笑います。",
"恋人の我聞慎二にも、自分の本当の気持ちをあまり言えません。",
"そんな生活を続けたある日、凪は会社で倒れてしまいます。",
"そこで凪は、仕事を辞め、恋人とも距離を置き、家財道具までほとんど捨てて、古いアパートへ引っ越します。「人生のお暇」を始めたのです。",
"新しいアパートでは、自由に生きる隣人ゴンや、節約好きのおばあさん、仕事に悩む坂本さんなど、今までとは違う人たちに出会います。",
"慎二は凪を忘れられず追いかけてきますが、素直に「好き」と言えません。ゴンも凪を好きになります。",
"けれど物語の本当の中心は、「凪がどちらの男を選ぶか」ではありません。",
"凪は母親との苦しい関係や、自分がいつも他人の期待に応えようとしていたことと向き合います。慎二やゴンも、それぞれ自分の弱さと向き合います。",
"最後には凪は、「誰かに選ばれる人生」ではなく、自分の胸が動く方向へ自分で進むことを選びます。",
"約9年間の連載を経て2025年に完結し、凪の長い「お暇」は、自分自身の人生を始めるための時間だったことが分かって物語は終わります。"
]},
{ cat:"m_history", title:"ベルサイユのばら", yomi:"ベルサイユのばら", sub:"池田理代子", author:"池田理代子", authorYomi:"いけだりよこ", icon:"🌹", text:[
"むかし、フランスにオスカルという少女がいました。オスカルの父親は男の子がほしかったため、娘であるオスカルを男の子のように育てました。大きくなったオスカルは剣の達人となり、王妃マリー・アントワネットを守る近衛隊の隊長になります。",
"マリー・アントワネットは、オーストリアからフランスへお嫁に来た若い王妃でした。華やかな宮殿で暮らし、スウェーデンの貴族フェルゼンとひそかに愛し合います。しかしそのころ、フランスの普通の人々は貧しさに苦しんでいました。",
"オスカルは王妃を守りながらも、「苦しんでいる人々を見捨ててよいのだろうか」と悩むようになります。そして、ずっとそばにいてくれた幼なじみのアンドレが、自分を深く愛していたことにも気づきます。二人はようやく思いを通わせますが、革命の戦いの中でアンドレは命を落とします。",
"1789年7月14日、オスカルは民衆の側に立ってバスティーユ牢獄を攻めます。そしてオスカルも銃弾を受け、亡くなります。",
"その後、フランス革命はさらに大きくなり、王政は倒れます。マリー・アントワネットも最後には処刑されます。オスカルたちの恋と人生を通して、フランス革命という大きな歴史の変化を描いた物語です。"
]},
{ cat:"m_fantasy", title:"ポーの一族", yomi:"ポーのいちぞく", sub:"萩尾望都", author:"萩尾望都", authorYomi:"はぎおもと", icon:"🦇", text:[
"ヨーロッパの古い町に、エドガーという少年がいました。",
"エドガーは妹のメリーベルをとても大切にしていました。しかし二人はあることから、人間の血を飲み、永遠に年を取らない「バンパネラ」の一族と出会います。",
"エドガーはまだ少年の姿のまま、バンパネラとなります。やがてメリーベルも同じ運命をたどりますが、人間たちとの争いの中で、エドガーは大切な妹を失ってしまいます。",
"一人になったエドガーは、アランという少年を仲間にします。二人は何十年、何百年たっても少年の姿のまま、さまざまな町を旅します。",
"しかし周りの人間たちは年を取り、老人となり、いつか死んでいきます。昔出会った人の子どもや孫と、何十年後かに再び出会うこともあります。",
"永遠の命は、楽しいことばかりではありません。好きになった人とも、いつか必ず別れなければならないからです。",
"長い年月の中でエドガーは、出会いと別れを何度もくり返します。「死なないことは、本当に幸せなのだろうか」。そんな問いを抱えながら、少年の姿のまま時代を旅し続ける物語です。"
]},
{ cat:"m_drama", title:"風と木の詩", spine:"風と木の詩", yomi:"かぜときのうた", sub:"竹宮惠子", author:"竹宮惠子", authorYomi:"たけみやけいこ", icon:"🍃", text:[
"19世紀のフランス。セルジュという少年が、ラコンブラード学院という男子学校へ入学します。",
"セルジュはまじめで心のやさしい少年でした。ところが同じ部屋になったジルベールは、とても美しいけれど、授業をさぼったり、ほかの生徒を困らせたりする少年でした。",
"セルジュは最初、ジルベールの行動が理解できません。しかしジルベールは、幼いころから大人たちによって深く傷つけられ、「自分なんて大切にされる人間ではない」と思いこんでいたのです。",
"セルジュはそんなジルベールを見捨てず、「きみは大切な人間だ」と伝え続けます。やがて二人は強く愛し合うようになります。",
"しかし学校の人々は二人の関係を認めません。二人は学院を離れ、パリで暮らし始めます。",
"けれどジルベールの心の傷はあまりにも深く、薬や危険な生活から抜け出すことができません。そして最後には事故にあい、若くして命を落としてしまいます。",
"セルジュは大きな悲しみを抱えながらも、生きていきます。愛されることを信じられなかった少年と、その少年を最後まで愛そうとした少年の、とても悲しい物語です。"
]},
{ cat:"m_sports", title:"エースをねらえ!", yomi:"エースをねらえ", sub:"山本鈴美香", author:"山本鈴美香", authorYomi:"やまもとすみか", icon:"🎾", text:[
"岡ひろみは、高校に入ったばかりの普通の女の子でした。",
"ひろみはテニス部に入り、華やかで強い先輩・竜崎麗香にあこがれます。みんなから「お蝶夫人」と呼ばれる麗香のようになれたらいいな、と思っていました。",
"ところが新しくやってきた宗方仁コーチは、まだ下手だったひろみを突然レギュラーに選びます。",
"部員たちは「どうしてあの子が」と怒ります。ひろみ自身も「私なんか無理です」と泣きそうになります。",
"それでも宗方コーチはきびしい練習を続けます。ひろみには、自分でも気づいていない大きな才能があると知っていたからです。",
"ひろみは負けたり、逃げたくなったりしながら、少しずつ強くなっていきます。お蝶夫人もやがて、ひろみを大切なライバルとして認めます。",
"ところが宗方コーチは重い病気を抱えていました。そして、ひろみが一人前の選手へ近づいたころ、亡くなってしまいます。",
"ひろみは大きな悲しみに沈みます。それでも、宗方コーチが自分に残してくれたものを胸に、もう一度ラケットを握ります。",
"あこがれてばかりだった少女が、自分自身の力で世界を目指す選手へ成長していく物語です。"
]},
{ cat:"m_art", title:"ガラスの仮面", yomi:"ガラスのかめん", sub:"美内すずえ", author:"美内すずえ", authorYomi:"みうちすずえ", icon:"🎭", text:[
"北島マヤは、勉強も運動もあまり得意ではない、普通の少女でした。",
"けれどマヤには、一度見たお芝居をそっくり覚え、その人物になりきってしまうという、ものすごい才能がありました。",
"その才能に気づいたのが、元大女優の月影千草です。",
"月影はマヤを弟子にし、きびしく演技を教えます。そして、いつか伝説の舞台「紅天女」を演じる女優を育てたいと考えていました。",
"しかし「紅天女」を目指しているのはマヤだけではありません。",
"有名な女優の娘・姫川亜弓もまた、とても努力家で才能のある少女でした。",
"二人はさまざまな舞台で競い合います。マヤが天才的なひらめきで役になりきれば、亜弓は人一倍の努力で役を自分のものにします。",
"そんなマヤを、ずっと陰から応援している人物もいました。大都芸能の速水真澄です。真澄は名前を明かさず、紫のバラを贈り続けます。",
"やがてマヤは、その「紫のバラの人」が真澄だったことを知っていきます。",
"そしてマヤと亜弓は、ついに「紅天女」をめぐる最後の競争へ進みます。",
"ただし物語はまだ完結しておらず、単行本では49巻まで刊行され、「紅天女」とマヤたちの恋の最終的な結末はまだ描かれていません。"
]},
{ cat:"m_love", title:"はいからさんが通る", yomi:"はいからさんがとおる", sub:"大和和紀", author:"大和和紀", authorYomi:"やまとわき", icon:"🎀", text:[
"大正時代。花村紅緒は、元気いっぱいの女学生です。",
"料理やお裁縫より剣道が得意で、「女だからこうしなさい」と言われるのが大きらいでした。",
"ところがある日、紅緒には伊集院忍という青年との結婚が決められていることが分かります。",
"忍は立派な軍人で、やさしい青年でした。紅緒は最初、「勝手に結婚なんて決めないで！」と反発します。",
"けれどいっしょに過ごしているうち、二人は少しずつひかれ合っていきます。",
"ところが忍は戦争へ行き、行方不明になってしまいます。",
"紅緒は「忍はきっと生きている」と信じながら、自分で働いて生きるため、新聞社で記者になります。",
"やがて、忍によく似たロシア人の男性が現れます。実はその男性こそ、記憶を失った忍でした。",
"しかし忍のそばには、彼を助けてくれた女性がいました。紅緒もまた、自分を支えてくれた編集長への気持ちに揺れます。",
"いくつものすれ違いをこえ、大きな関東大震災も乗り越えて、紅緒と忍はようやく再会します。",
"最後には二人は結ばれます。自分らしく生きたい少女が、恋も仕事もあきらめずに進んでいく物語です。"
]},
{ cat:"m_drama", title:"キャンディ・キャンディ", sub:"原作：水木杏子／作画：いがらしゆみこ", author:"水木杏子／いがらしゆみこ", authorYomi:"みずききょうこ", icon:"🍬", text:[
"アメリカの孤児院「ポニーの家」に、キャンディという元気な女の子がいました。",
"キャンディは赤ちゃんのころに捨てられましたが、アンという親友といっしょに、明るく育ちます。",
"ある日、悲しくて泣いていたキャンディは、丘の上で美しい少年に出会います。少年はキャンディを励ましてくれました。キャンディはその少年を「丘の上の王子さま」と呼び、ずっと忘れませんでした。",
"大きくなったキャンディは、アードレー家とかかわるようになり、やさしい少年アンソニーと恋をします。",
"ところがアンソニーは事故で亡くなってしまいます。",
"悲しみを乗り越えたキャンディは、イギリスの学校へ行き、俳優を目指すテリィと出会います。二人は愛し合いますが、テリィを助けて大けがをしたスザナのため、キャンディは身を引きます。",
"キャンディは看護師となり、いろいろな人を助けながら成長します。",
"そして最後に、ずっとキャンディを助けてきたアルバートが、アードレー家の当主ウィリアムであり、幼いころに出会った「丘の上の王子さま」でもあったことが分かります。",
"大切な人との別れを何度経験しても、キャンディは前を向きます。「笑っていれば、いつかまた幸せに出会える」。そんな少女の成長物語です。"
]},
{ cat:"m_drama", title:"生徒諸君!", yomi:"せいとしょくん", sub:"庄司陽子", author:"庄司陽子", authorYomi:"しょうじようこ", icon:"🏫", text:[
"北城尚子、通称ナッキーは、とても元気な女の子です。",
"中学校へ転校してきたナッキーは、岩崎祝たちと仲良くなり、「悪たれ団」という仲間のグループを作ります。",
"ナッキーは勉強も運動も得意で、困っている人を見ると放っておけません。",
"しかし明るく見えるナッキーにも、心の中には大きなさびしさがありました。",
"ナッキーには生まれつき体の弱い双子の姉がいました。そのため幼いころ、ナッキーは両親と離れて祖父母に育てられていたのです。",
"中学、高校、大学へ進む中で、悪たれ団の仲間たちは恋をしたり、進路に悩んだり、大切な人との別れを経験したりします。",
"ナッキー自身も、友人の死や恋の悲しみなど、何度もつらい出来事に出会います。",
"それでも仲間たちは、お互いを支えながら大人になっていきます。",
"そしてナッキーは、「子どもたちが学校で過ごす時間を大切にしたい」と考え、教師になることを目指します。",
"学生だった少女が、いつか今度は子どもたちを支える側になろうと決めるまでを描いた青春物語です。"
]},
{ cat:"m_gag", title:"パタリロ!", sub:"魔夜峰央", author:"魔夜峰央", authorYomi:"まやみねお", icon:"💎", text:[
"南の島に、マリネラ王国という小さな国があります。",
"その国の国王が、パタリロ8世です。",
"パタリロはまだ少年ですが、とても頭がよく、お金が大好きで、いたずらも大好きです。",
"少し太った体で、いつも変なことを言い、周りの人たちを困らせています。",
"マリネラはダイヤモンドがたくさんとれる国なので、その宝をねらう悪人やスパイが何度もやってきます。",
"イギリスの情報機関MI6のバンコラン少佐も、パタリロとかかわるようになります。",
"バンコランはとても美しい男性で、少年のマライヒと恋人になります。",
"パタリロは事件が起きるたびに、ふざけているように見えながら、ものすごい頭のよさで謎を解いたり、敵をだましたりします。",
"ときには宇宙人が出てきたり、幽霊が出たり、過去へ行ったり未来へ行ったりします。",
"一つの大きな冒険を最後まで追う作品というより、「今日はどんな事件が起こるのだろう」と楽しむ長い物語です。",
"笑ってばかりいるパタリロですが、ときどき王様として国や大切な人を守る、意外にかっこいい一面も見せます。"
]},
{ cat:"m_fantasy", title:"王家の紋章", yomi:"おうけのもんしょう", sub:"細川智栄子あんど芙〜みん", author:"細川智栄子あんど芙〜みん", authorYomi:"ほそかわちえこ", icon:"🏺", text:[
"アメリカ人の少女キャロルは、エジプトの古い歴史を勉強していました。",
"ある日、キャロルは古代エジプトの王の墓を調べていたことから、不思議な力によって3000年以上前のエジプトへ連れていかれてしまいます。",
"そこで出会ったのが、若い王メンフィスでした。",
"最初のメンフィスは乱暴で気の強い王でしたが、現代から来たキャロルに少しずつひかれていきます。",
"キャロルには未来の知識があります。",
"「この川はもうすぐあふれます」「この病気にはこうすればいいです」と人々を助けるため、古代の人たちはキャロルを「ナイルの娘」と呼び、特別な存在として見るようになります。",
"やがてキャロルもメンフィスを愛し、二人は結婚します。",
"しかしヒッタイトの王子イズミルをはじめ、多くの国の王子たちがキャロルを手に入れようとします。",
"そのたびにキャロルはさらわれ、メンフィスは助けに向かい、エジプトと周りの国々の争いへ発展します。",
"キャロルは現代へ戻ることもありますが、愛するメンフィスのいる古代へ何度も帰っていきます。",
"物語は現在も続いており、2026年には71巻が刊行されています。キャロルとメンフィスの長い物語には、まだ最後の結末は描かれていません。"
]},
{ cat:"m_space", title:"地球へ…", spine:"地球へ…", yomi:"テラへ", sub:"竹宮惠子", author:"竹宮惠子", authorYomi:"たけみやけいこ", icon:"🌏", text:[
"遠い未来。人間たちは、汚れてしまった地球を離れ、別の星で暮らしていました。",
"子どもたちはコンピューターに育てられ、大人になるための試験を受けます。",
"ジョミーという少年も、普通の人間として大人になるはずでした。",
"ところが試験の日、ジョミーには人の心を感じ取る特別な力があることが分かります。",
"その力を持つ人々は「ミュウ」と呼ばれ、人間たちから危険な存在として追われていました。",
"ジョミーはミュウのリーダー、ソルジャー・ブルーと出会います。",
"ブルーは、「いつかミュウも地球へ帰りたい」という長い夢をジョミーへ託します。",
"ジョミーは仲間たちを率いて、人間たちと戦いながら地球を目指します。",
"一方、人間側にはキース・アニアンという青年がいました。キースはコンピューターによって理想的な人間として育てられ、ミュウを倒す役目を与えられます。",
"ジョミーとキースは敵として出会います。",
"しかし最後には二人とも、「人間とミュウのどちらかだけが生き残る世界ではいけない」と気づきます。",
"二人は命を落としますが、残された人々は古い仕組みを終わらせ、人間とミュウがいっしょに生きる未来へ歩き始めます。"
]},
{ cat:"m_space", title:"11人いる!", yomi:"じゅういちにんいる", sub:"萩尾望都", author:"萩尾望都", authorYomi:"はぎおもと", icon:"🚀", text:[
"遠い未来。宇宙大学へ入りたい若者たちが、最後の入学試験に挑みます。",
"試験の内容は、10人ずつ宇宙船へ乗りこみ、53日間を力を合わせて生きぬくことでした。",
"主人公のタダも宇宙船へ入ります。",
"ところが、みんなで人数を数えてみると、",
"「……11人いる！」",
"10人のはずなのに、なぜか一人多いのです。",
"誰が11人目なのか分かりません。",
"そのうえ宇宙船では、次々と事故が起こります。",
"機械がこわれ、病気が広がり、仲間どうしで「おまえが11人目ではないか」と疑い始めます。",
"それでもタダたちは、「疑っているだけではみんな死んでしまう」と考え、協力します。",
"そして最後には、11人目の正体も明らかになります。",
"その人物は、若者たちを殺そうとしていた悪人ではなく、試験を見守るために大学から送られていた人間でした。",
"本当の試験は、「予定どおりにいかない宇宙で、知らない相手とも信じ合えるか」を見るものでもあったのです。",
"「一人多い」という小さな謎から始まる、宇宙の友情物語です。"
]},
{ cat:"m_drama", title:"トーマの心臓", yomi:"トーマのしんぞう", sub:"萩尾望都", author:"萩尾望都", authorYomi:"はぎおもと", icon:"💌", text:[
"ドイツの男子校で、トーマという少年が亡くなります。",
"トーマは学校で人気のある、美しくやさしい少年でした。",
"しかしトーマは死ぬ前に、ユーリという上級生へ手紙を残していました。",
"そこには、ユーリへの深い愛が書かれていました。",
"ところがユーリは、トーマの気持ちを素直に受け取ることができません。",
"ユーリ自身も過去にひどく傷つけられ、「自分には人から愛される資格がない」と思いこんでいたからです。",
"そんな学校へ、エーリクという転校生がやってきます。",
"エーリクは死んだトーマによく似ていました。",
"そのためユーリはエーリクを見るたび、トーマのことを思い出し、冷たくしてしまいます。",
"けれどエーリクにも、母親の死という大きな悲しみがあります。",
"二人はぶつかり合いながら、少しずつお互いの心の傷を知っていきます。",
"そしてユーリはついに、自分がどうして人の愛を受け入れられなくなったのかを話します。",
"トーマが命をかけて残した愛によって、ユーリはもう一度「自分も愛されてよいのかもしれない」と思えるようになります。",
"最後にユーリは学校を離れ、新しい人生へ旅立ちます。"
]},
{ cat:"m_history", title:"日出処の天子", yomi:"ひいづるところのてんし", sub:"山岸凉子", author:"山岸凉子", authorYomi:"やまぎしりょうこ", icon:"☀️", text:[
"むかし、日本がまだ飛鳥時代と呼ばれていたころ。",
"厩戸王子という、とても頭のよい少年がいました。",
"のちに聖徳太子と呼ばれる人物です。",
"厩戸王子は政治の才能があり、人には見えないものを感じる不思議な力まで持っていました。",
"しかし心の中では、とてもさびしい少年でもありました。",
"そんな厩戸王子が強くひかれたのが、蘇我毛人という青年です。",
"王子は毛人を誰より大切に思います。",
"ところが毛人は王子と同じ気持ちを返すことができず、別の女性を愛します。",
"厩戸王子はそれを受け入れられません。",
"国の政治では冷静で賢い王子なのに、毛人のことになると、嫉妬したり、人を傷つけたりしてしまいます。",
"そのころ日本では、仏教を受け入れるかどうかをめぐって、蘇我氏と物部氏が争っていました。",
"厩戸王子は蘇我馬子たちと力を合わせ、政治の中心へ進んでいきます。",
"やがて王子は国を動かす大きな力を持つようになります。",
"しかし、どれだけ偉くなっても、毛人からほしかった愛だけは手に入りません。",
"歴史上の聖人としてではなく、強さも弱さも持った一人の若者として厩戸王子を描いた物語です。"
]},
{ cat:"m_fantasy", title:"綿の国星", yomi:"わたのくにぼし", sub:"大島弓子", author:"大島弓子", authorYomi:"おおしまゆみこ", icon:"🐈", text:[
"ある雨の日、一匹の小さな子猫が捨てられていました。",
"その子猫を拾ったのが、須和野時夫という青年です。",
"子猫は「チビ猫」と名づけられ、須和野家で暮らすことになります。",
"チビ猫はまだ子どもなので、「いつか自分も大きくなったら人間の女の子になれる」と信じています。",
"漫画の中では、チビ猫は猫の耳をつけた小さな女の子の姿で描かれます。",
"もちろん人間たちには、普通の猫にしか見えていません。",
"チビ猫は時夫のことが大好きです。",
"「大きくなったら時夫のお嫁さんになろう」と夢見ています。",
"外へ出ると、いろいろな猫たちとも出会います。",
"町で自由に生きる猫、恋をする猫、死んでしまう猫。",
"そうした出会いの中で、チビ猫は少しずつ、「猫として生きること」を知っていきます。",
"人間になれなくても、自分には自分の世界があります。",
"小さな猫の目から、人間の暮らしや恋や命を見る、不思議でやさしい物語です。"
]},
{ cat:"m_daily", title:"動物のお医者さん", yomi:"どうぶつのおいしゃさん", sub:"佐々木倫子", author:"佐々木倫子", authorYomi:"ささきのりこ", icon:"🐕", text:[
"高校生の西根公輝、通称ハムテルは、ある日大学教授の漆原に声をかけられます。",
"漆原先生はハムテルに、一匹のシベリアン・ハスキーの子犬を渡します。",
"その犬がチョビです。",
"そして先生は言います。",
"「きみは将来、獣医になる！」",
"勝手に将来を決められたようなものですが、ハムテルは本当に獣医学部へ進むことになります。",
"大学では、動物が大好きな二階堂や菱沼さんなど、少し変わった仲間たちと出会います。",
"牛、馬、犬、猫、ネズミなど、いろいろな動物を診察したり、実習をしたりします。",
"しかし一番変わっているのは、漆原教授かもしれません。",
"先生が何かを始めるたび、学生たちは大騒ぎになります。",
"チョビは大きな犬ですが、とてもおとなしく、ハムテルのそばで暮らし続けます。",
"やがてハムテルたちは卒業し、本当に獣医として進む道を考えるようになります。",
"特別な大事件が起こる物語ではありません。",
"動物と人間たちの、少し変わっていて、とてもにぎやかな学生生活を描いたお話です。"
]},
{ cat:"m_fantasy", title:"ぼくの地球を守って", yomi:"ぼくのちきゅうをまもって", sub:"日渡早紀", author:"日渡早紀", authorYomi:"ひわたりさき", icon:"🌙", text:[
"高校生の坂口亜梨子には、不思議な夢がありました。",
"夢の中では、自分は木蓮という女性になっていました。",
"そこは月の上にある基地です。",
"木蓮と六人の仲間たちは、地球を観察するため、遠い星からやってきた科学者でした。",
"やがて亜梨子は、同じように月の夢を見ている人たちが自分の近くにいることを知ります。",
"みんな、月で暮らしていた人々の生まれ変わりだったのです。",
"そして近所に住む小学生・小林輪も、その一人でした。",
"輪の前世は紫苑という青年でした。",
"紫苑は月の基地で孤独になり、木蓮を愛しながらも、彼女を深く傷つけてしまった過去を持っています。",
"仲間たちが病気で次々に亡くなったあと、紫苑だけは長い年月、一人で月に残されました。",
"その苦しみを思い出した輪は、「前世の続きを今の地球でやり直そう」と考え、危険な行動を始めます。",
"しかし亜梨子は、輪に伝えます。",
"「私たちは木蓮と紫苑ではない。今を生きる亜梨子と輪なんだよ」。",
"輪はようやく過去にしばられることをやめます。",
"前世の悲しみを知った人々が、今の人生を生き直していく物語です。"
]},
{ cat:"m_battle", title:"BANANA FISH", yomi:"バナナフィッシュ", sub:"吉田秋生", author:"吉田秋生", authorYomi:"よしだあきみ", icon:"🍌", text:[
"アメリカのニューヨークに、アッシュ・リンクスという少年がいました。",
"アッシュはとても頭がよく、銃を使う腕も一流です。",
"しかし幼いころから悪い大人たちに利用され、ストリートギャングのリーダーとして生きていました。",
"そんなアッシュの兄は、戦争から帰って以来、心を失ったようになり、「バナナフィッシュ」という言葉だけを口にしていました。",
"アッシュは、その言葉の意味を調べ始めます。",
"そこで出会ったのが、日本から来た奥村英二です。",
"英二は争いの世界をほとんど知らない、やさしい青年でした。",
"アッシュは最初、そんな英二を弱いと思います。",
"しかし何の見返りも求めず自分を信じてくれる英二は、アッシュにとって初めて安心できる存在になっていきます。",
"やがて「バナナフィッシュ」とは、人間の心をあやつる危険な薬だと分かります。",
"アッシュは仲間たちと力を合わせ、その薬を利用しようとする大人たちと戦います。",
"事件が終わり、英二は日本へ帰ることになります。",
"英二はアッシュへ、「君は一人じゃない」と書いた手紙を残します。",
"ところがそのあと、アッシュは敵だった青年に刺されます。",
"アッシュは図書館で英二の手紙を読みながら、静かに命を終えます。",
"最後まで自由を求めた少年と、彼の心を救った一人の友だちの物語です。"
]},
{ cat:"m_fantasy", title:"BASARA", yomi:"バサラ", sub:"田村由美", author:"田村由美", authorYomi:"たむらゆみ", icon:"🔥", text:[
"遠い未来の日本。",
"文明は一度ほろび、人々は王たちに支配されながら暮らしていました。",
"ある村に、「この子は国を変える運命の子だ」と予言された少年タタラが生まれます。",
"タタラには双子の妹・更紗がいました。",
"ところが村を支配する赤の王によって、タタラは殺されてしまいます。",
"更紗は兄の死を隠し、自分が「タタラ」になって人々を率つことを決めます。",
"「兄のかわりに、みんなを自由にするんだ」。",
"更紗は男の姿をして仲間を集め、各地の王たちと戦います。",
"そんな旅の途中、更紗は朱理という青年と出会います。",
"二人はお互いの本当の名前を知らないまま、恋に落ちます。",
"ところが朱理の正体こそ、更紗が最も憎んでいる「赤の王」でした。",
"朱理もまた、愛した少女が敵のタタラだとは知りません。",
"やがて二人は互いの正体を知り、大きな苦しみを味わいます。",
"それでも更紗は、「憎い相手を殺せば平和になるわけではない」と気づいていきます。",
"長い戦いの末、古い王たちの支配は終わります。",
"更紗は英雄タタラとしてではなく、一人の更紗として生きる道を選びます。",
"そして朱理も王の座を離れ、二人はようやく自分たちの人生へ歩き出します。"
]},
{ cat:"m_sf", title:"7SEEDS", yomi:"セブンシーズ", sub:"田村由美", author:"田村由美", authorYomi:"たむらゆみ", icon:"🌱", text:[
"ある日、夏という少女が目を覚ますと、知らない人たちと海の上にいました。",
"町も家族もありません。",
"実はずっと昔、科学者たちは「巨大な天体が地球へぶつかり、人類がほろびるかもしれない」と予想していました。",
"そこで選ばれた若者たちを冷凍して眠らせ、地球が再び人間の住める場所になった未来で目覚めさせる計画を作りました。",
"それが「7SEEDS計画」です。",
"夏たちは、人類がほとんどいなくなった遠い未来の日本で目覚めたのです。",
"日本には「春」「夏A」「夏B」「秋」「冬」といういくつものチームが送りこまれていました。",
"しかし未来の日本には、巨大な植物や動物、危険な虫などがいっぱいです。",
"食べるものを探し、雨風をしのぎ、仲間を失いながら生きなければなりません。",
"中でも夏Aチームの人々は、未来へ行くためのきびしい訓練によって、深い心の傷を負っていました。",
"最初は別々に生きていたチームも、少しずつ出会っていきます。",
"そして「昔の人類をそのまま復活させる」のではなく、自分たちの手で新しい社会を作ろうと考え始めます。",
"最後には仲間たちが未来への希望を持ち、荒れた地球で新しい生活を始めます。",
"「世界が終わったあとにも、人はもう一度始められる」という物語です。"
]},
{ cat:"m_fantasy", title:"天は赤い河のほとり", yomi:"そらはあかいかわのほとり", sub:"篠原千絵", author:"篠原千絵", authorYomi:"しのはらちえ", icon:"🏜️", text:[
"現代の日本に、夕梨という普通の女子中学生がいました。",
"ある日、夕梨は突然、水の中へ引きこまれます。",
"目を開けると、そこは3000年以上前の古代ヒッタイト帝国でした。",
"夕梨を過去へ呼んだのは、王妃ナキアです。",
"王妃は自分の息子を王にするため、夕梨をいけにえにしようとしていました。",
"危ないところを助けてくれたのが、皇子カイルです。",
"夕梨は最初、「早く日本へ帰りたい」と願います。",
"しかし未来の知識を使ってけが人を助けたり、人々を守ったりするうち、ヒッタイトの人々から「イシュタル」と呼ばれ、愛されるようになります。",
"そして夕梨とカイルも、だんだん強く愛し合うようになります。",
"けれど二人の前には、王妃ナキアのたくらみや、周辺の国との戦争が何度も立ちはだかります。",
"夕梨には現代へ帰る機会も訪れます。",
"それでも夕梨は、自分の大切な人々がいる古代の世界に残ることを選びます。",
"長い戦いの末、カイルは国を治める王となり、夕梨はその妻となります。",
"現代から来た少女が、自分で生きる時代と愛する人を選び、一国の王妃になる物語です。"
]},
{ cat:"m_love", title:"花より男子", yomi:"はなよりだんご", sub:"神尾葉子", author:"神尾葉子", authorYomi:"かみおようこ", icon:"🌸", text:[
"牧野つくしは、あまりお金持ちではない普通の女の子です。",
"ところが両親の希望で、大金持ちの子どもばかりが通う英徳学園へ入ることになります。",
"学校には「F4」と呼ばれる四人の男子がいました。",
"その中心にいる道明寺司は大財閥の息子で、気に入らない生徒に「赤札」を出し、学校じゅうからいじめさせていました。",
"つくしは、そんな道明寺にとうとう怒ります。",
"「いいかげんにしなさい！」",
"そして道明寺を思いきり殴ってしまいます。",
"道明寺は最初、つくしをいじめます。",
"ところが、どんなに苦しい目にあっても負けないつくしを見て、いつの間にか本気で好きになってしまいます。",
"つくしは最初、やさしい花沢類が好きでした。",
"しかし道明寺のまっすぐな気持ちを知るうち、少しずつ道明寺にひかれていきます。",
"ところが道明寺の母親は、「身分が違う」と二人を引き離そうとします。",
"別れたり、すれ違ったり、道明寺が記憶を失ったりしながらも、二人は何度も相手を選びます。",
"最後には、道明寺は海外へ行って自分の責任を果たすことになり、つくしも自分の道を進みます。",
"すぐに結婚するわけではありませんが、二人は「いつか必ずいっしょになる」と確かめ合います。"
]},
{ cat:"m_love", title:"ときめきトゥナイト", sub:"池野恋", author:"池野恋", authorYomi:"いけのこい", icon:"🌙", text:[
"江藤蘭世は、普通の中学生に見えます。",
"でも、本当は少し変わった家族の娘です。",
"お父さんは吸血鬼。お母さんは狼女。",
"そして蘭世自身にも、人や物をかむと、その姿に変身できる力がありました。",
"そんな蘭世が恋をしたのが、同級生の真壁俊です。",
"ところが魔界には、「人間と恋をしてはいけない」という決まりがあります。",
"おまけに俊を好きな神谷曜子という女の子もいて、蘭世の恋はなかなかうまくいきません。",
"ところが物語が進むと、俊にも大きな秘密があることが分かります。",
"俊はただの人間ではなく、魔界の王家につながる大切な人物だったのです。",
"蘭世と俊は魔界の争いや運命に巻きこまれながら、それでもお互いを選び続けます。",
"やがて二人は大人になり、結ばれます。",
"その後、物語の主人公は蘭世たちの周りにいる次の世代へ移っていきます。",
"なるみや鈴世、そして蘭世と俊の娘・愛良たちにも、それぞれ不思議な恋と冒険が待っています。",
"一つの家族を中心に、親から子へと恋と魔法の物語が受けつがれていく、とても長い物語です。"
]},
{ cat:"m_gag", title:"有閑倶楽部", yomi:"ゆうかんくらぶ", sub:"一条ゆかり", author:"一条ゆかり", authorYomi:"いちじょうゆかり", icon:"💃", text:[
"聖プレジデント学園という、とてもお金持ちの子どもたちが通う学校があります。",
"そこには「有閑倶楽部」と呼ばれる六人組がいました。",
"大金持ちの娘・剣菱悠理、美しい白鹿野梨子、頭のよい黄桜可憐、警視総監の息子・松竹梅魅録など、六人はみんな個性の強い高校生です。",
"六人にはお金も才能もあり、普通に学校へ通っていれば何も困りません。",
"ところがなぜか毎回、とんでもない事件へ巻きこまれます。",
"誘拐されたり、宝物を探したり、幽霊に出会ったり、海外の王族を助けたりします。",
"悠理が力ずくで敵を倒し、魅録が作戦を考え、野梨子たちが知恵を出し合います。",
"六人はいつもケンカをしていますが、本当に危ないときには必ず仲間を助けます。",
"一つの大きな物語が最後に解決する漫画ではありません。",
"「お金持ちの高校生六人が、暇になるたび大事件に首をつっこむ」という、にぎやかな冒険と友情の物語です。"
]},
{ cat:"m_daily", title:"ちびまる子ちゃん", yomi:"ちびまるこちゃん", sub:"さくらももこ", author:"さくらももこ", icon:"🍡", text:[
"昭和のころ、静岡県清水市に、さくらももこという小学生の女の子が暮らしていました。",
"みんなからは「まる子」と呼ばれています。",
"まる子は勉強が大好きなわけでも、スポーツが得意なわけでもありません。",
"できれば宿題をさぼりたいし、おこづかいはほしいし、楽をして暮らしたいと思っています。",
"家には、お父さん、お母さん、お姉ちゃん、おじいちゃん、おばあちゃんがいます。",
"特におじいちゃんの友蔵は、まる子をとてもかわいがっています。",
"学校へ行けば、たまちゃん、丸尾くん、花輪くん、永沢くん、藤木くんなど、変わった友達がたくさんいます。",
"まる子は、「明日からちゃんとする！」と決心しても、次の日には忘れてしまいます。",
"お母さんに怒られたり、友達とケンカしたり、遠足を楽しみにしたり、お正月にお年玉を数えたりします。",
"世界を救うような大事件は起こりません。",
"けれど子どもにとっては、宿題や席替えやおこづかいも大事件です。",
"そんな「どこにでもありそうな小学生の毎日」を、おもしろく描いた物語です。"
]},
{ cat:"m_drama", title:"赤ちゃんと僕", yomi:"あかちゃんとぼく", sub:"羅川真里茂", author:"羅川真里茂", authorYomi:"らがわまりも", icon:"👶", text:[
"榎木拓也は、小学生の男の子です。",
"拓也には、まだ小さな弟の実がいます。",
"ところが二人のお母さんは事故で亡くなってしまいました。",
"お父さんは仕事へ行かなければならないので、拓也は学校へ通いながら、実の世話をすることになります。",
"実はまだ小さいので、すぐ泣きます。",
"ごはんを食べさせたり、お風呂へ入れたり、保育園へ迎えに行ったりしなければなりません。",
"拓也は弟を大切に思っています。",
"でも、まだ自分だって子どもです。",
"「どうして僕ばかり我慢しなくちゃいけないんだろう」と思うこともあります。",
"実に怒ってしまい、あとから後悔することもあります。",
"それでも父親や近所の人、友達に助けてもらいながら、三人家族は少しずつ前へ進みます。",
"実もだんだん大きくなり、拓也だけに頼らなくなっていきます。",
"拓也もまた、「弟のお母さんの代わり」ではなく、普通のお兄ちゃんとして実を愛せるようになります。",
"お母さんを失った家族が、泣いたり笑ったりしながら、新しい家族の形を作っていく物語です。"
]},
{ cat:"m_love", title:"彼氏彼女の事情", spine:"彼氏彼女の|事情", yomi:"かれしかのじょのじじょう", sub:"津田雅美", author:"津田雅美", authorYomi:"つだまさみ", icon:"🎓", text:[
"宮沢雪野は、学校では成績優秀、運動もできて、やさしくて美しい「完璧な女の子」でした。",
"でも、それは雪野が一生懸命作った姿です。",
"本当の雪野は、家ではジャージを着てごろごろし、人からほめられることが大好きな女の子でした。",
"ところが同級生の有馬総一郎に、その秘密を知られてしまいます。",
"有馬もまた、学校では完璧な優等生でした。",
"そして有馬にも、人には見せない暗い心がありました。",
"二人はお互いの本当の姿を知り、やがて恋人になります。",
"雪野は、「完璧に見せなくても友達はできる」と知ります。",
"一方の有馬は、幼いころに親から傷つけられた記憶のため、「本当の自分を見せたら嫌われる」と恐れていました。",
"有馬はだんだん苦しくなり、雪野からも心を閉ざそうとします。",
"それでも雪野や友人たちは、有馬を見捨てません。",
"有馬は過去と向き合い、「愛されてもいい」と少しずつ思えるようになります。",
"やがて高校を卒業した二人は結婚し、家族を作ります。",
"「人に見せる自分」と「本当の自分」の両方を受け入れていく青春物語です。"
]},
{ cat:"m_fantasy", title:"フルーツバスケット", sub:"高屋奈月", author:"高屋奈月", authorYomi:"たかやなつき", icon:"🍙", text:[
"本田透は、お母さんを亡くした高校生です。",
"事情があってテントで一人暮らしをしていた透は、同級生の草摩由希の家で暮らすことになります。",
"そこで透は、草摩家の大きな秘密を知ります。",
"草摩家の一部の人たちは、異性に抱きつかれると、十二支の動物に変身してしまうのです。",
"由希はネズミ、夾は猫、紫呉は犬に変身します。",
"これは昔から草摩家に続く「呪い」でした。",
"明るくやさしい透は、草摩家の人たちと少しずつ仲良くなります。",
"しかし十二支の人々は、それぞれ家族との苦しい思い出を抱えていました。",
"そして十二支をしばっている中心人物が、草摩慊人です。",
"慊人自身もまた、「十二支のみんなに捨てられるのが怖い」と苦しんでいました。",
"透は、誰かを悪者として倒すのではなく、一人ひとりの心に寄りそいます。",
"やがて長く続いた十二支の呪いは、一人ずつ自然に解けていきます。",
"透はずっと心に傷を抱えていた夾と愛し合い、二人は草摩家を離れて新しい人生へ進みます。",
"最後には年を取った透と夾が、手をつないで歩く姿まで描かれます。",
"傷ついた人たちが、「自分も幸せになっていい」と知っていく物語です。"
]},
{ cat:"m_love", title:"NANA", yomi:"ナナ", sub:"矢沢あい", author:"矢沢あい", authorYomi:"やざわあい", icon:"🎸", text:[
"東京へ向かう電車の中で、二人の若い女性が出会います。",
"二人とも名前は「奈々」。",
"一人は小松奈々。恋をするとまっすぐで、少しさびしがり屋の女の子です。",
"もう一人は大崎ナナ。ロックバンド「BLACK STONES」の歌手で、いつか音楽で成功することを夢見ています。",
"性格は正反対の二人ですが、偶然同じ部屋を気に入り、707号室でいっしょに暮らすことになります。",
"小松奈々はナナから「ハチ」と呼ばれるようになります。",
"ナナにはレンという恋人がいました。レンは人気バンド「TRAPNEST」のギタリストになっています。",
"ハチもまた、ナナのバンド仲間のノブと恋をします。",
"ところがハチのお腹に赤ちゃんができ、その父親はTRAPNESTのタクミである可能性が高いと分かります。",
"ハチはノブではなくタクミとの結婚を選びます。",
"それでもナナとハチは、お互いを大切な親友だと思い続けます。",
"そんな中、ナナが深く愛していたレンが交通事故で亡くなります。",
"ナナの心は大きく傷つきます。",
"物語ではさらに未来の場面も描かれ、ナナがみんなの前から姿を消していることが分かります。",
"しかし物語はそこで止まっています。",
"『NANA』は2009年から長期休載が続いており、単行本も21巻までで、ナナがなぜ姿を消したのか、ハチたちが最後にどうなるのかは、まだ描かれていません。"
]},
{ cat:"m_love", title:"ご近所物語", yomi:"ごきんじょものがたり", sub:"矢沢あい", author:"矢沢あい", authorYomi:"やざわあい", icon:"✂️", text:[
"幸田実果子は、服を作ることが大好きな高校生です。",
"将来は自分のブランドを作り、デザイナーになりたいと思っています。",
"実果子の幼なじみが山口ツトムです。",
"二人は小さいころからいつもいっしょでした。",
"あまりに近すぎるため、実果子は自分がツトムを好きなのかどうか、よく分かりません。",
"ところがツトムがほかの女の子に人気になると、実果子はとても気になります。",
"二人はケンカしたり、すれ違ったりしながら、やがて恋人になります。",
"学校では仲間たちと「アキンド」というグループを作り、自分たちが作った服や小物を売り始めます。",
"実果子は「Happy Berry」という自分のブランドも作ります。",
"恋人とずっといっしょにいたい気持ちと、デザイナーになる夢。",
"実果子はその二つの間で悩みます。",
"そして最後には、夢をかなえるためロンドンへ留学することを選びます。",
"ツトムも自分の夢を見つけ、二人は離れていても相手を信じて進みます。",
"恋をしたから夢をあきらめるのではなく、「恋も夢も大切にしたい」と成長していく物語です。"
]},
{ cat:"m_love", title:"天使なんかじゃない", yomi:"てんしなんかじゃない", sub:"矢沢あい", author:"矢沢あい", authorYomi:"やざわあい", icon:"👼", text:[
"冴島翠は、明るく元気な高校生です。",
"学校で新しく生徒会を作ることになり、翠は副会長になります。",
"会長になったのは、少し不良っぽいけれどやさしい須藤晃です。",
"翠はすぐに晃を好きになります。",
"生徒会の仲間たちは毎日いっしょに活動し、まるで家族のように仲良くなっていきます。",
"ところが晃の心には、ずっと大切にしている女性がいました。",
"それが美術の先生・マキちゃんです。",
"マキちゃんには、晃が兄のように慕っていた将志という恋人がいました。",
"翠は「晃は本当はマキちゃんが好きなのではないか」と不安になります。",
"晃も自分の気持ちをうまく話せず、二人は何度もすれ違います。",
"やがて晃は海外へ行き、翠と離れることになります。",
"しかし離れてみて、二人はお互いがどれほど大切だったかを知ります。",
"晃は日本へ戻り、翠ともう一度向き合います。",
"そして将志とマキちゃんも、長いすれ違いをこえて結婚します。",
"翠たちは高校を卒業し、それぞれの夢へ歩き出します。",
"学校で出会った仲間たちとの時間が、一生消えない宝物になっていく青春物語です。"
]},
{ cat:"m_love", title:"Paradise Kiss", spine:"Paradise|Kiss", yomi:"パラダイスキス", sub:"矢沢あい", author:"矢沢あい", authorYomi:"やざわあい", icon:"👗", text:[
"早坂紫は、大学へ入るため、毎日勉強ばかりしている高校生です。",
"「いい学校へ行きなさい」というお母さんの言うとおりに生きてきました。",
"そんなある日、紫は変わった服を着た若者たちに声をかけられます。",
"彼らは服飾学校の学生で、「Paradise Kiss」というブランドの服を作っていました。",
"そして文化祭のファッションショーで、紫にモデルをしてほしいと言います。",
"そこで紫は、ジョージという青年に出会います。",
"ジョージは才能のある服のデザイナーで、自由で、自信に満ちています。",
"紫はジョージに恋をし、モデルの世界へ入っていきます。",
"今まで親の言うとおりに生きてきた紫は、初めて「私は本当は何がしたいのだろう」と考えます。",
"ジョージと紫は強く愛し合います。",
"しかし二人は、お互いを好きなだけでは幸せになれないことにも気づきます。",
"ジョージはデザイナーになるため海外へ行き、紫は日本でモデルの道を進みます。",
"二人は別れます。",
"何年かたち、紫は幼なじみの徳森浩行と結婚することになります。",
"ジョージとの恋は終わりましたが、その出会いがあったからこそ、紫は「自分の人生を自分で選ぶ」ことができるようになったのです。"
]},
{ cat:"m_love", title:"君に届け", yomi:"きみにとどけ", sub:"椎名軽穂", author:"椎名軽穂", authorYomi:"しいなかるほ", icon:"💌", text:[
"黒沼爽子は、とてもやさしい高校生です。",
"けれど長い黒髪と静かな雰囲気のため、クラスのみんなから「貞子」と呼ばれ、怖い女の子だと誤解されていました。",
"爽子は本当は、みんなと仲良くなりたいと思っています。",
"そんな爽子へ、いつも普通に話しかけてくれる男子がいました。",
"風早翔太です。",
"風早は明るく、クラスのみんなから好かれています。",
"爽子は風早にあこがれます。",
"風早もまた、最初から爽子のことが気になっていました。",
"爽子は矢野あやねや吉田千鶴と友達になり、少しずつ自分の気持ちを言葉にできるようになります。",
"風早との恋も、何度も「きっと私の勘違いだ」とすれ違います。",
"それでも二人はようやく気持ちを伝え合い、恋人になります。",
"高校三年生になると、今度は卒業後の進路を考えなければなりません。",
"爽子は先生になる夢を持ち、風早とは別の大学へ進むことを決めます。",
"離れるのはさびしいけれど、相手の夢を止めることはしません。",
"最後には、離れていても大切な気持ちは変わらないと信じ、二人はそれぞれの未来へ歩き始めます。"
]},
{ cat:"m_love", title:"俺物語!!", yomi:"おれものがたり", sub:"原作：河原和音／作画：アルコ", author:"河原和音／アルコ", authorYomi:"かわはらかずね", icon:"💪", text:[
"剛田猛男は、とても大きくて力持ちの高校生です。",
"曲がったことが大きらいで、困っている人がいればすぐ助けます。",
"でも、なぜか猛男が好きになる女の子は、いつも親友の砂川誠を好きになってしまいます。",
"砂川は背が高く、とてもかっこいい男の子だからです。",
"ある日、猛男は電車で困っていた女の子・大和凛子を助けます。",
"猛男はすぐ大和を好きになります。",
"しかし大和もきっと砂川が好きなのだろう、と猛男は思います。",
"ところが大和が好きだったのは、最初から猛男でした。",
"「えっ、俺!?」",
"こうして二人は恋人になります。",
"猛男は初めての恋なので、手をつなぐだけでも大騒ぎです。",
"大和も猛男が大好きで、二人は少しずつ恋人らしくなっていきます。",
"恋のライバルが現れたり、大和が遠くへ引っ越す話が出たりしますが、二人はそのたびにきちんと気持ちを伝えます。",
"高校卒業後も猛男と大和の関係は続き、猛男と砂川は同じ大学へ進みます。大学時代を描いた番外編も刊行されています。",
"見た目ではなく、「その人がどんな人なのか」を好きになる、とてもまっすぐな恋のお話です。"
]},
{ cat:"m_sports", title:"ちはやふる", sub:"末次由紀", author:"末次由紀", authorYomi:"すえつぐゆき", icon:"🃏", text:[
"小学生の綾瀬千早は、転校生の綿谷新と出会います。",
"新が大好きなのは、「競技かるた」です。",
"百人一首の札を、読まれた瞬間にものすごい速さで取る競技です。",
"千早は新と勝負し、初めて「自分にも夢中になれるものがある」と知ります。",
"千早、新、真島太一の三人はかるたで仲良くなりますが、やがて離ればなれになります。",
"高校生になった千早は、太一といっしょにかるた部を作ります。",
"目標は、日本一の女性選手「クイーン」になることです。",
"仲間を集め、団体戦へ出て、勝ったり負けたりしながら、みんな少しずつ強くなっていきます。",
"新もまた、いつか「名人」になることを目指しています。",
"そして太一は、ずっと千早のことを好きでした。",
"けれど千早の頭の中はかるたでいっぱいです。",
"やがて三人は高校を卒業し、千早と新はついに名人・クイーン戦へ挑みます。",
"千早は若宮詩暢との大勝負を制し、念願のクイーンになります。新もまた自分の夢へ進みます。",
"そして千早は、長いあいだ自分を支えてきた太一への気持ちにも気づきます。",
"15年続いた物語は50巻で完結し、三人はそれぞれ大人への一歩を踏み出します。"
]},
{ cat:"m_art", title:"のだめカンタービレ", spine:"のだめ|カンタービレ", sub:"二ノ宮知子", author:"二ノ宮知子", authorYomi:"にのみやともこ", icon:"🎹", text:[
"千秋真一は、音楽大学に通うピアノ科の学生です。",
"本当は世界で活躍する指揮者になりたいのですが、飛行機が怖くて海外へ行けず、いらいらしていました。",
"そんな千秋のとなりの部屋に住んでいたのが、野田恵、通称のだめです。",
"のだめの部屋は散らかり放題。生活もめちゃくちゃです。",
"ところがピアノを弾かせると、楽譜どおりではないけれど、とても自由で美しい音を出します。",
"きっちりした千秋と、自由すぎるのだめ。",
"二人はまるで正反対です。",
"千秋はのだめに振り回されながら、仲間たちとオーケストラを作り、指揮者として成長していきます。",
"のだめも千秋に出会ったことで、「もっとピアノを学びたい」と思うようになります。",
"やがて千秋は飛行機への恐怖を乗り越え、二人はヨーロッパへ渡ります。",
"千秋は指揮者として成功していきます。",
"一方ののだめは、音楽を仕事にする苦しさにぶつかり、「楽しく弾きたい」という気持ちを見失いそうになります。",
"最後に二人は、音楽も恋も、どちらか一つを選ぶのではなく、それぞれの道を歩きながらいっしょにいる方法を見つけます。",
"正反対の二人が、音楽によってお互いを成長させる物語です。"
]},
{ cat:"m_drama", title:"こどものおもちゃ", sub:"小花美穂", author:"小花美穂", authorYomi:"おばなみほ", icon:"🎤", text:[
"倉田紗南は、小学生なのにテレビへ出演している人気子役です。",
"学校でも明るく元気な紗南ですが、クラスには大きな問題がありました。",
"羽山秋人という男の子を中心に、男子たちが授業をめちゃくちゃにしていたのです。",
"紗南は「こんなの許せない！」と羽山に立ち向かいます。",
"最初の二人は大げんかばかりです。",
"ところが羽山にも、心が荒れてしまった理由がありました。",
"羽山は母親を亡くし、家族ともなかなかうまくいっていませんでした。",
"紗南はそんな羽山を知り、少しずつ大切に思うようになります。",
"羽山もまた、自分を本気で心配してくれる紗南を好きになります。",
"二人は中学生になり、恋をします。",
"けれど紗南の芸能活動、友人関係、羽山の家庭の問題などで、何度もすれ違います。",
"紗南自身も、明るく笑うことができなくなるほど心を苦しくする時期があります。",
"それでも羽山や家族、友達に支えられ、少しずつ元気を取り戻します。",
"二人は完璧な大人になるわけではありません。",
"怒ったり、泣いたりしながら、「大切な人にはちゃんと大切だと言おう」と学んでいく物語です。"
]},
{ cat:"m_history", title:"大奥", yomi:"おおおく", sub:"よしながふみ", author:"よしながふみ", icon:"🏯", text:[
"江戸時代の日本。",
"ところが、この世界の歴史は私たちの知っている歴史と少し違います。",
"男の人だけがかかる恐ろしい病気「赤面疱瘡」が広がり、男の数がとても少なくなってしまったのです。",
"そのため畑仕事も商売も政治も、女の人たちが中心になって行うようになります。",
"そして徳川将軍も女性になりました。",
"将軍のそばには、貴重な男性たちを集めた「大奥」が作られます。",
"物語は、一人の将軍だけを描くのではありません。",
"三代将軍家光から、何代もの徳川将軍の人生を追っていきます。",
"女であることを隠して将軍となった家光。",
"国を豊かにしようとする吉宗。",
"外国との関係に悩む幕末の将軍たち。",
"その中で、人々は「赤面疱瘡を治す方法」を何世代にもわたって探します。",
"やがて医学が進み、ついに病気を防ぐ方法が見つかります。",
"男の人口は少しずつ元に戻っていきます。",
"そして幕末が来て徳川幕府は終わります。",
"新しい時代になると、「昔、女性たちが将軍だった」という歴史は表から消され、私たちの知る歴史に近い形へ書きかえられていきます。",
"「もし男女の数が逆になったら、日本の歴史はどうなっただろう」と考えた、もう一つの江戸時代のお話です。"
]},
{ cat:"m_fantasy", title:"カードキャプターさくら", spine:"カードキャプター|さくら", sub:"CLAMP", author:"CLAMP", authorYomi:"クランプ", icon:"🪄", text:[
"木之本桜は、小学生の女の子です。",
"ある日、家の地下室で一冊の不思議な本を見つけます。",
"本を開けると、中に入っていた「クロウカード」が全部、町へ飛び出してしまいました。",
"すると本から、小さな動物のようなケルベロス、通称ケロちゃんが現れます。",
"「カードを全部集めなあかん！」",
"こうして桜は「カードキャプター」となります。",
"クロウカードには、風を起こすもの、火を出すもの、時間を止めるものなど、それぞれ違う魔法があります。",
"桜は親友の知世や、香港から来た李小狼と力を合わせ、一枚ずつカードを集めます。",
"最初は桜のライバルだった小狼も、やがて桜を好きになります。",
"すべてのクロウカードを集めたあと、今度はカードを自分の魔力で使える「さくらカード」へ変えなければならなくなります。",
"桜は何度も失敗しながら、少しずつ立派な魔法使いになります。",
"そして小狼はついに桜へ「好きだ」と伝えます。",
"最初は自分の気持ちが分からなかった桜も、やがて小狼が大切な人だと気づきます。",
"小狼が香港へ帰る日、桜は自分の思いをこめた小さなぬいぐるみを渡します。",
"カードを集める冒険と、初めての恋がいっしょに育っていく物語です。"
]},
{ cat:"m_food", title:"西洋骨董洋菓子店", spine:"西洋骨董|洋菓子店", yomi:"せいようこっとうようがしてん", sub:"よしながふみ", author:"よしながふみ", icon:"🍰", text:[
"橘圭一郎は、ある日突然会社を辞め、洋菓子店を開くことにします。",
"店の名前は「アンティーク」。",
"おしゃれな古い家具に囲まれた、小さなケーキ屋さんです。",
"そこへやってきたパティシエが、小野裕介です。",
"小野はものすごくおいしいケーキを作れる天才です。",
"さらに元ボクサーの神田エイジや、橘の幼なじみの千影も加わります。",
"こうして少し変わった四人のケーキ屋が始まります。",
"しかし橘が店を開いたのには、心の奥に理由がありました。",
"橘は子どものころ、知らない男に誘拐されたことがあるのです。",
"そのとき犯人の家で、何度もケーキを食べさせられました。",
"橘は犯人の顔を思い出せません。",
"そのため大人になっても、子どもの誘拐事件のニュースを見るたび苦しくなります。",
"やがて、昔の自分の事件とよく似た事件が起こります。",
"橘は自分の過去と向き合います。",
"すべての傷がきれいに消えるわけではありません。",
"それでも橘たちはまた店を開き、お客さんへケーキを出します。",
"甘いお菓子の店で、それぞれ少し傷を持った大人たちがいっしょに働く物語です。"
]},
{ cat:"m_love", title:"逃げるは恥だが役に立つ", spine:"逃げるは恥だが|役に立つ", yomi:"にげるははじだがやくにたつ", sub:"海野つなみ", author:"海野つなみ", authorYomi:"うみのつなみ", icon:"💍", text:[
"森山みくりは、大学院まで出たのに、なかなか安定した仕事を見つけられませんでした。",
"そこで父親の紹介で、津崎平匡という会社員の家へ、家事の仕事をしに行くことになります。",
"みくりは掃除も料理もきちんと働きます。",
"平匡も、その仕事にお金を払います。",
"ところが両親が引っ越すことになり、みくりは仕事を失いそうになります。",
"そこでみくりは、とんでもないことを言います。",
"「私と結婚しませんか？」",
"本当の恋愛結婚ではありません。",
"みくりが妻として家事をし、平匡が給料を払う「契約結婚」です。",
"二人は周りの人には普通の夫婦のふりをします。",
"しかしいっしょに暮らしているうち、少しずつ本当に相手を好きになっていきます。",
"恋人になったあとも、「家事はだれの仕事なのか」「お金をどう分けるのか」「結婚したら女性が家事をして当たり前なのか」と、二人は何度も話し合います。",
"やがて二人は契約ではなく、本当の家族になっていきます。",
"その後みくりは妊娠し、出産や仕事、子育てについても二人で考えます。最終11巻でも、夫婦が話し合いながら出産へ向かう姿が描かれます。",
"「好きだから全部分かり合える」のではなく、好きだからこそ話し合う夫婦の物語です。"
]},
{ cat:"m_love", title:"東京アリス", yomi:"とうきょうアリス", sub:"稚野鳥子", author:"稚野鳥子", authorYomi:"わかのとりこ", icon:"👜", text:[
"有栖川ふうは、東京で働く若い女性です。",
"ふうが何より大好きなのは、お買い物です。",
"かわいい服やバッグを見ると、つい買ってしまいます。",
"ふうには、学生時代から仲のよい友達がいます。",
"しっかり者の円城寺さゆり、漫画家の桜川理央、そしてクールな羽田みずほです。",
"四人は同じ東京で働きながら、それぞれ恋や仕事に悩んでいます。",
"ふうは会社の上司・奥薗慎二にひかれていきます。",
"でも、好きな人ができたからといって、急に大人になれるわけではありません。",
"仕事を続けるのか、結婚するのか。",
"自分の夢を優先するのか、恋人についていくのか。",
"友達たちもそれぞれ、大切な選択をしていきます。",
"ときには恋が終わる人もいれば、新しい恋を見つける人もいます。",
"ふうも奥薗とのすれ違いをくり返しますが、最後には自分が本当に大切にしたいものを選びます。",
"きらきらした東京の町で、「欲しいもの」を追いかけていた女性たちが、「自分にとって本当に幸せなもの」を見つけていく物語です。"
]},
{ cat:"m_love", title:"ホタルノヒカリ", sub:"ひうらさとる", author:"ひうらさとる", icon:"🍺", text:[
"雨宮蛍は、会社ではきちんと働く若い女性です。",
"ところが家へ帰ると、ジャージ姿でごろごろ。",
"ビールを飲みながら寝転がり、恋愛なんて面倒だと思っています。",
"そんな女性を、作品の中では「干物女」と呼びます。",
"ある日、蛍が借りて暮らしていた家へ、会社の上司・高野部長がやってきます。",
"実はその家は高野の実家だったのです。",
"こうして会社では上司と部下、家では同居人という不思議な生活が始まります。",
"そんな中、蛍は年下の男性・マコトを好きになります。",
"久しぶりの恋なので、何をすればいいのか分かりません。",
"高野に相談しながら、一生懸命恋をします。",
"しかしマコトとの恋は、最後には終わってしまいます。",
"そして蛍は、いちばん自然な自分を見せられる相手が、いつもそばにいた高野だと気づいていきます。",
"高野もまた、だらしない蛍を怒りながら、いつの間にか大切に思うようになります。",
"二人は遠回りをしながら恋人になり、結婚へ進みます。",
"「立派な女性にならなければ恋をしてはいけない」のではなく、だらしない自分も含めて受け入れてくれる人と出会う物語です。"
]},
{ cat:"m_love", title:"海月姫", yomi:"くらげひめ", sub:"東村アキコ", author:"東村アキコ", authorYomi:"ひがしむらあきこ", icon:"🪼", text:[
"倉下月海は、クラゲが大好きな女の子です。",
"おしゃれや恋愛はとても苦手で、男性と話すだけでも緊張します。",
"月海は「天水館」という古いアパートで、自分と同じように好きなものへ夢中になる女性たちと暮らしていました。",
"みんなは自分たちを「尼〜ず」と呼んでいます。",
"ある夜、月海はとても美しい女性と出会います。",
"ところがその人は、実は女性ではありませんでした。",
"名前は鯉淵蔵之介。",
"政治家の家に生まれた男性ですが、女の服を着るのが大好きなのです。",
"蔵之介は月海のクラゲへの愛と、服を作る才能に気づきます。",
"ちょうどそのころ、天水館を取りこわして町を再開発する計画が持ち上がります。",
"「この家を守りたい！」",
"月海たちは、クラゲをイメージしたドレスを作り、「Jellyfish」というブランドを始めます。",
"月海は蔵之介や、その兄・修との恋にも巻きこまれます。",
"でも一番大きく変わるのは、月海自身です。",
"「私はきれいじゃないから」「私は何もできないから」と思っていた月海が、自分にも人を驚かせるものを作れると知ります。",
"最後には天水館も仲間たちも、それぞれ新しい道へ進みます。",
"「お姫さまは、だれかにしてもらうものではない」と気づく物語です。"
]},
{ cat:"m_love", title:"私がモテてどうすんだ", spine:"私がモテて|どうすんだ", yomi:"わたしがモテてどうすんだ", sub:"ぢゅん子", author:"ぢゅん子", authorYomi:"じゅんこ", icon:"📱", text:[
"芹沼花依は、アニメや漫画の男の子どうしの恋を想像するのが大好きな高校生です。",
"自分が男の子と恋をすることには、あまり興味がありません。",
"ところが大好きなアニメのキャラクターが死んでしまい、花依は悲しみのあまり何日も部屋へこもります。",
"すると、なぜか急にやせてしまいました。",
"学校へ行くと、それまで花依を恋愛相手として見ていなかった男の子たちが、次々に花依を好きになります。",
"「いや、私じゃなくて、みんな同士で仲良くしてほしいんだけど！」",
"花依は困ってしまいます。",
"五十嵐、七島、四ノ宮、そして先輩の六見など、何人もの人が花依をめぐって競争します。",
"けれど六見先輩だけは、花依が太っていたころから変わらず親切でした。",
"花依はさまざまな出来事を通して、「外見が変わったから好き」と言われることと、「自分そのものを好き」と言われることの違いを知ります。",
"やがて花依も、六見先輩への気持ちが特別だと気づきます。",
"最後には二人は結ばれます。",
"たくさんの人からモテることより、自分をそのまま見てくれる一人を大切にする物語です。"
]},
{ cat:"m_love", title:"パーフェクトワールド", sub:"有賀リエ", author:"有賀リエ", authorYomi:"あるがりえ", icon:"♿", text:[
"川奈つぐみは、インテリア会社で働く女性です。",
"ある日、仕事の集まりで、高校時代に好きだった鮎川樹と再会します。",
"「久しぶり！」",
"つぐみはうれしくなります。",
"ところが樹は車いすに乗っていました。",
"大学生のころ事故にあい、脊髄を傷つけて歩けなくなっていたのです。",
"つぐみは最初、「車いすの人との恋愛なんて、自分には無理かもしれない」と思います。",
"樹自身も、「自分とつき合ったら相手を苦労させてしまう」と恋をあきらめていました。",
"それでも二人は、もう一度ひかれ合います。",
"いっしょに出かけるだけでも、階段や段差など、今までつぐみが考えたこともなかった問題があります。",
"樹の体には、見た目では分からない痛みや病気の危険もあります。",
"二人は一度、「好きでも、いっしょにはいられない」と別れます。",
"しかし離れてみて、苦労があるから愛してはいけないわけではないと気づきます。",
"家族の反対や体の問題を話し合い、二人はもう一度いっしょに生きることを選びます。",
"そして結婚し、自分たちに合った家と暮らしを作っていきます。",
"「完璧な人生」でなくても、二人で幸せを作ることはできると描く物語です。"
]},
{ cat:"m_drama", title:"ミステリと言う勿れ", yomi:"ミステリというなかれ", sub:"田村由美", author:"田村由美", authorYomi:"たむらゆみ", icon:"🍛", text:[
"久能整は、カレーを作ることが好きな大学生です。",
"髪はふわふわで、少し変わった話し方をします。",
"整自身は事件を解決する探偵になりたいわけではありません。",
"ところが、なぜか行く先々で事件に巻きこまれてしまいます。",
"ある日、整は突然、殺人事件の犯人ではないかと疑われます。",
"警察で取り調べを受けますが、整は刑事たちの話を聞きながら、",
"「それって、本当にそうでしょうか？」",
"と一つずつ考えていきます。",
"すると刑事たち自身が気づいていなかった矛盾が見えてきて、事件の真相へたどりつきます。",
"その後も、バスジャック、遺産をめぐる争い、連続殺人など、さまざまな事件に出会います。",
"整は、ただ犯人を当てるだけではありません。",
"「どうしてこの人はこんなことをしたのだろう」と、人の心の奥まで考えます。",
"そして整自身も、幼いころの家族について心に傷を抱えていることが少しずつ分かってきます。",
"ライカや犬堂我路など、不思議な人々とのつながりも続いていきます。",
"物語はまだ完結しておらず、2026年には16巻まで刊行され、新しい事件が続いています。"
]},
{ cat:"m_drama", title:"違国日記", yomi:"いこくにっき", sub:"ヤマシタトモコ", author:"ヤマシタトモコ", icon:"📓", text:[
"高代槙生は、35歳の小説家です。",
"人づきあいがあまり得意ではなく、一人で静かに暮らしていました。",
"ところがある日、槙生の姉とその夫が交通事故で亡くなります。",
"二人には、15歳の娘・朝がいました。",
"葬式で大人たちは、「この子をどうするの」と朝のことを相談します。",
"その言い方に腹を立てた槙生は、思わず言います。",
"「じゃあ、私が引き取る」。",
"こうして、ほとんど一人暮らしのように生きてきた槙生と、明るく人なつっこい朝の共同生活が始まります。",
"槙生は料理も生活もあまり上手ではありません。",
"朝も、両親を亡くした悲しみをどう受け止めればいいのか分かりません。",
"しかも槙生は、亡くなった姉と仲がよくありませんでした。",
"朝にとっては大切なお母さん。",
"槙生にとっては苦手だった姉。",
"二人の記憶は同じではありません。",
"それでも槙生は、朝に「悲しいなら悲しんでいい。あなたの気持ちはあなたのものだ」と伝えます。",
"朝は高校生活を送り、友達を作り、恋をし、少しずつ自分の人生へ進んでいきます。",
"槙生もまた、姉との過去から逃げずに向き合います。",
"二人は本当の親子にはなりません。",
"それでも「一緒に暮らした大切な家族」となり、朝は大人への一歩を踏み出します。",
"作品は全11巻で完結しています。"
]},
{ cat:"m_art", title:"メタモルフォーゼの縁側", spine:"メタモルフォーゼ|の縁側", yomi:"メタモルフォーゼのえんがわ", sub:"鶴谷香央理", author:"鶴谷香央理", authorYomi:"つるたにかおり", icon:"📖", text:[
"市野井雪は、75歳のおばあさんです。",
"夫を亡くし、一人で静かに暮らしていました。",
"ある日、久しぶりに本屋へ入り、きれいな絵の漫画を一冊買います。",
"家へ帰って読んでみると、それは男の子どうしの恋を描いた「BL漫画」でした。",
"雪はびっくりします。",
"でも、",
"「まあ、おもしろい」",
"と続きを読みたくなります。",
"本屋でアルバイトをしていた高校生・佐山うららも、BL漫画が大好きでした。",
"けれど周りにその話をできる友達がいません。",
"75歳の雪と17歳のうらら。",
"年齢は58歳も違いますが、「この漫画が好き」という気持ちから二人は友達になります。",
"二人はいっしょに漫画を読んだり、本屋へ行ったり、同人誌のイベントへ出かけたりします。",
"うららはやがて、「読むだけではなく、自分でも漫画を描いてみたい」と思うようになります。",
"でも自信がありません。",
"雪はそんなうららを急かさず、静かに応援します。",
"うららは自分の漫画を作り、イベントで本を売ります。",
"雪もまた、若い友達と出会ったことで、新しいことへ出かける楽しさを知ります。",
"最後には二人がそれぞれ自分の日常へ戻りながらも、いっしょに過ごした時間が心に残ります。",
"全5巻で完結した、年の離れた二人のやさしい友情の物語です。"
]},
{ cat:"m_food", title:"作りたい女と食べたい女", spine:"作りたい女と|食べたい女", yomi:"つくりたいおんなとたべたいおんな", sub:"ゆざきさかおみ", author:"ゆざきさかおみ", icon:"🍲", text:[
"野本ユキは、料理を作ることが大好きな女性です。",
"大きな鍋いっぱいの料理や、大きなケーキを作ってみたいと思うのですが、一人では食べきれません。",
"そんなある日、同じマンションに住む春日十々子が、たくさんの食べ物をおいしそうに食べているところを見ます。",
"野本は思いきって言います。",
"「よかったら、私の作った料理を食べてくれませんか？」",
"春日はうれしそうに食べてくれます。",
"こうして「作りたい女」と「食べたい女」は、いっしょにごはんを食べるようになります。",
"最初はただの隣人でした。",
"でも野本はだんだん、春日に会える日を楽しみにするようになります。",
"「私は春日さんのことが、友達として好きなのかな。それとも……」",
"野本は、自分が女性を恋愛の相手として好きになる人なのだと気づいていきます。",
"春日もまた、野本を大切に思っていました。",
"二人は気持ちを伝え合い、恋人になります。",
"その周りには、食べることに苦しさを抱える南雲や、野本の相談相手になる矢子など、いろいろな女性たちが集まってきます。",
"二人は料理を楽しむだけでなく、「女だから料理をするべき」「女は少ししか食べないほうがいい」「男と結婚するのが普通」といった周りの決めつけとも向き合います。",
"そして少しずつ、「自分たちが安心して暮らせる家族の形」を作っていきます。",
"物語は2026年10月現在も連載中で、最新公開話も続いているため、二人の最後の結末はまだ描かれていません。"
]},
{ cat:"m_baseball", title:"アストロ球団", yomi:"アストロきゅうだん", sub:"原作：遠崎史朗／作画：中島徳博", author:"遠崎史朗／中島徳博", authorYomi:"とおざきしろう", icon:"🌟", text:[
"ある年、日本の野球界に、とんでもない少年たちが現れます。",
"彼らはみんな、野球のために生まれてきたかのような、ものすごい力を持っていました。速すぎる球を投げる者、信じられないほど遠くまで打つ者、人間とは思えない動きをする者。それぞれが「超人」と呼ばれるほどの選手です。",
"そんな少年たちが集まり、「アストロ球団」というチームを作ります。",
"彼らの目標は、ただ普通の試合に勝つことではありません。",
"「世界一の野球チームを作る」。",
"そのために、プロ野球選手や外国の強豪、同じような超人たちと、次々に戦っていきます。",
"しかし試合は、だんだん普通の野球とは思えないほど激しくなります。選手たちは血を流し、骨を折り、それでも立ち上がります。ときには命を失う者まで出てきます。",
"それでもアストロ球団の仲間たちは、野球をやめません。",
"「自分たちはどこまで強くなれるのか」。",
"その答えを探すように、最後まで人間の限界をこえた野球へ挑み続けます。",
"野球というより、まるで侍どうしの決闘のような、とても熱く激しい物語です。"
]},
{ cat:"m_baseball", title:"侍ジャイアンツ", yomi:"さむらいジャイアンツ", sub:"原作：梶原一騎／作画：井上コオ", author:"梶原一騎／井上コオ", authorYomi:"かじわらいっき", icon:"⚾", text:[
"番場蛮は、高知県で育った、とても元気で乱暴な少年です。",
"蛮は野球が大好きですが、なぜかプロ野球の大人気チーム・読売ジャイアンツが大きらいでした。",
"ところが、そのものすごい肩の力を見こまれ、なんと自分が嫌っていたジャイアンツへ入ることになります。",
"「入ったからには、おれのやり方でやってやる！」",
"蛮は普通の投手では満足しません。",
"高く飛び上がって投げる「ハイジャンプ魔球」や、ぐるぐる回って投げる「大回転魔球」など、人間にはとてもまねできないような魔球を次々に生み出します。",
"もちろん相手の打者たちも負けてはいません。",
"どうすれば蛮の魔球を打てるのか、必死に練習し、新しい打ち方を考えます。",
"蛮も魔球を破られるたび、「だったらもっとすごい球を作る！」と立ち上がります。",
"そうして蛮は、ただの暴れん坊から、ジャイアンツを背負う大切な投手へ成長していきます。",
"しかし原作漫画の最後は、とても悲しいものです。",
"蛮は最後まで自分の体をこわすほど魔球を投げ続け、ついにはマウンドの上で命を落とします。",
"ライバルたちは、いつも大声で笑っていた蛮を思いながら涙を流します。",
"「命をかけてでも、自分の野球をやりぬく」。",
"そんな、昔のスポーツ漫画らしい、とても激しい物語です。"
]},
{ cat:"m_baseball", title:"プレイボール", spine:"プレイ|ボール", sub:"ちばあきお", author:"ちばあきお", icon:"⚾", text:[
"谷口タカオは、中学生のころ、野球部のキャプテンとして全国大会を戦った少年です。",
"けれど大切な試合で指をひどくけがしてしまい、以前のようにボールを投げられなくなってしまいました。",
"高校へ入った谷口は、",
"「もう野球はできないんだ」",
"と思い、いったんサッカー部へ入ります。",
"けれど、グラウンドから聞こえてくるボールの音を聞くと、どうしても野球を忘れることができません。",
"谷口は、弱かった墨谷高校野球部へ入ります。",
"最初の墨谷高校は、強いチームではありませんでした。",
"設備も特別ではありません。すごい選手がそろっているわけでもありません。",
"そこで谷口は、自分にできることを一つずつ始めます。",
"朝早くから練習し、仲間たちと守備を何度もくり返し、走り、打ち、少しずつチームを強くしていきます。",
"やがて谷口はキャプテンとなり、強い学校とも戦えるチームを作っていきます。",
"それでも甲子園への道は簡単ではありません。",
"勝てそうで勝てない試合もあります。",
"けれど谷口は、負けてもまた次の日から練習します。",
"「才能がなくても、一つずつ積み重ねれば強くなれる」。",
"そんな谷口の高校野球を描いた物語です。"
]},
{ cat:"m_baseball", title:"キャプテン", spine:"キャプテン", sub:"ちばあきお", author:"ちばあきお", icon:"🧢", text:[
"谷口タカオは、野球の名門・青葉学院から墨谷二中へ転校してきました。",
"みんなは、",
"「名門校から来たんだから、ものすごく上手なんだろう」",
"と思います。",
"でも本当は、谷口は青葉学院では補欠でした。",
"それでも谷口は、みんなの期待を裏切りたくなくて、一人でこっそり練習を続けます。",
"その努力を見た仲間たちは、少しずつ谷口を信じるようになります。",
"そして谷口はキャプテンとなり、墨谷二中を強いチームへ育てていきます。",
"やがて谷口が卒業すると、丸井が次のキャプテンになります。",
"丸井も卒業すると、今度はイガラシがキャプテンになります。",
"さらにその次には近藤へと、チームは受けつがれていきます。",
"キャプテンが変わるたび、性格もやり方も違います。",
"怒りっぽいキャプテンもいれば、頭を使うキャプテンもいます。",
"それでも、",
"「先輩から教わったものを、次の後輩へ渡す」",
"という気持ちは変わりません。",
"一人の天才だけが活躍するのではなく、何代もの少年たちがバトンをつなぎながら、一つの野球部を強くしていく物語です。"
]},
{ cat:"m_baseball", title:"名門!第三野球部", spine:"名門!|第三野球部", yomi:"めいもんだいさんやきゅうぶ", sub:"むつ利之", author:"むつ利之", authorYomi:"むつとしゆき", icon:"3️⃣", text:[
"檜あすなろは、野球が大好きな高校生です。",
"でも体は小さく、特別に足が速いわけでもありません。",
"あすなろがいるのは、桜高校野球部の「第三野球部」。",
"そこには、一軍や二軍に入れなかった、いわゆる落ちこぼれたちが集められていました。",
"ある日、監督から言われます。",
"「第三野球部は解散する」。",
"あすなろたちはくやしくてたまりません。",
"そこで、一軍と試合をして、勝てたら第三野球部を残してもらうことになります。",
"みんなは必死に練習します。",
"そして、だれも勝てると思っていなかった一軍を相手に、本気で戦います。",
"その試合をきっかけに、あすなろたちは少しずつ認められていきます。",
"やがて学校を代表する野球部となり、甲子園を目指すようになります。",
"あすなろは体が大きくなくても、頭を使い、工夫し、あきらめずに投げます。",
"その後、物語は高校野球だけでは終わりません。",
"あすなろたちはもっと大きな野球の世界へ進み、大人になっても野球とかかわっていきます。",
"「最初から上手な人だけが主人公ではない」。",
"だれにも期待されなかった少年たちが、自分たちの力で道を作る物語です。"
]},
{ cat:"m_baseball", title:"MAJOR", yomi:"メジャー", sub:"満田拓也", author:"満田拓也", authorYomi:"みつだたくや", icon:"⚾", text:[
"本田吾郎は、小さなころから野球が大好きな男の子です。",
"お父さんの茂治はプロ野球選手でした。",
"吾郎は、",
"「ぼくもお父さんみたいなプロ野球選手になる！」",
"と夢を見ます。",
"ところが、お父さんは試合中の事故がもとで亡くなってしまいます。",
"まだ幼い吾郎は大きな悲しみを抱えますが、それでも野球をやめません。",
"リトルリーグ、中学校、高校。",
"吾郎はどこへ行っても、強い相手を見つけるとわくわくします。",
"肩をこわして右腕で投げられなくなると、今度は左腕で投げる練習を始めます。",
"「投げられないなら、反対の手で投げればいい！」",
"そんな、とてもむちゃな少年です。",
"やがて吾郎は日本を飛び出し、アメリカのプロ野球へ挑戦します。",
"そこで、父の死にも関係していた名投手ジョー・ギブソンや、その息子ギブソンJr.たちと向き合います。",
"吾郎は何度もけがをしながら、ついに世界最高の舞台までたどりつきます。",
"そして大人になり、幼なじみの清水薫と家庭を作り、子どもも生まれます。",
"投手として投げ続けることが難しくなっても、吾郎は野球をあきらめません。",
"今度は打者として野球を続けます。",
"子どものころからずっと、",
"「できないと言われたら、できるまでやる」。",
"そんな吾郎の野球人生を、幼少期から大人になるまで描いた長い物語です。全78巻で完結しています。"
]},
{ cat:"m_baseball", title:"Dreams", yomi:"ドリームス", sub:"原作：七三太朗／作画：川三番地", author:"七三太朗／川三番地", authorYomi:"ななみたろう", icon:"💭", text:[
"久里武志は、野球の才能だけなら、とんでもない少年です。",
"ものすごい球を投げ、打つ力もあります。",
"ところが性格に大きな問題がありました。",
"人の言うことを聞かず、すぐにケンカをしてしまいます。",
"そのため強い高校からは相手にされず、最後に入ったのが、あまり有名ではない夢の島高校でした。",
"監督の工藤は、久里の中にある本当の野球への情熱を見ぬきます。",
"久里は最初、仲間たちともぶつかります。",
"「おれ一人で勝てる」",
"と思っているからです。",
"でも野球は九人でやるものです。",
"一人では取れない球も、一人では返せない点もあります。",
"試合を重ねるうち、久里は少しずつ仲間を認めるようになります。",
"夢の島高校も、だれにも期待されていなかったチームから、甲子園を目指せるチームへ成長します。",
"そして本当に甲子園へ進み、とんでもない強敵たちと戦います。",
"最後まで久里は、普通の高校球児とは思えないような野球を見せます。",
"でも物語の中心にあるのは、",
"「うまいだけでは、本当のチームにはなれない」",
"ということです。",
"自分勝手だった天才が、仲間といっしょに夢を見るようになる物語です。全71巻で完結しています。"
]},
{ cat:"m_baseball", title:"ダイヤのA", yomi:"ダイヤのエース", sub:"寺嶋裕二", author:"寺嶋裕二", authorYomi:"てらじまゆうじ", icon:"💎", text:[
"沢村栄純は、長野県の中学校で野球をしている少年です。",
"チームはあまり強くありませんでした。",
"それでも沢村は、仲間といっしょに野球をすることが大好きでした。",
"ある日、東京の強豪・青道高校から声をかけられます。",
"沢村は最初、",
"「おれは今の仲間と野球をするんだ！」",
"と言います。",
"でも青道高校で御幸一也というすごいキャッチャーと出会い、",
"「この人に自分の球を受けてもらいたい」",
"と思い、東京へ進むことを決めます。",
"ところが青道には、沢村より速い球を投げる降谷暁がいました。",
"沢村は、",
"「自分がエースになる！」",
"と宣言しますが、最初は失敗ばかりです。",
"それでも自分だけの変わった球をみがき、少しずつ投手として成長します。",
"三年生との別れ、甲子園をかけた試合、強豪・稲城実業との戦い。",
"何度も負け、悔しい思いをしながら、沢村はついに青道のエース番号「1」を背負います。",
"そして『actII』では、エースとなった沢村たちが再び甲子園を目指します。",
"ついには因縁の稲城実業を破り、青道は甲子園への切符をつかみます。",
"「エースとは、一番速い球を投げる人ではない。みんなから任される人なんだ」。",
"沢村が少しずつそれを知っていく物語です。"
]},
{ cat:"m_baseball", title:"おおきく振りかぶって", yomi:"おおきくふりかぶって", sub:"ひぐちアサ", author:"ひぐちアサ", icon:"🧤", text:[
"三橋廉は、とても気の弱い高校生です。",
"中学校では野球部のエースでした。",
"でも三橋は、",
"「自分が監督のお孫さんだからエースにしてもらったんだ」",
"と思いこんでいました。",
"仲間からもよく思われず、野球をすることがこわくなってしまいます。",
"高校では野球をやめようと思っていた三橋ですが、西浦高校野球部へ行きます。",
"そこで捕手の阿部隆也と出会います。",
"阿部は三橋の球を受けて、すぐに言います。",
"「お前はちゃんと投手だ」。",
"三橋の球は速くありません。",
"でも、とても細かくねらった場所へ投げることができます。",
"阿部はその長所を使い、三橋を支えます。",
"西浦高校野球部はできたばかりで、部員はほとんど一年生。",
"みんなで考え、声をかけ合いながら、一試合ずつ戦います。",
"三橋は少しずつ、",
"「ぼくが投げてもいいんだ」",
"と思えるようになります。",
"そして仲間たちも、勝つことだけではなく、相手を知り、自分を知り、チームで考える野球を覚えていきます。",
"2026年現在も連載は続いており、三橋たちは二年生へ進み、新しい後輩も入ってきています。"
]},
{ cat:"m_baseball", title:"ラストイニング", sub:"原作：神尾龍／作画：中原裕／監修：加藤潔", author:"神尾龍／中原裕／加藤潔", authorYomi:"かみおりゅう", icon:"🧠", text:[
"鳩ヶ谷圭輔は、少し変わった大人です。",
"高校時代には野球をしていましたが、今は野球から離れていました。",
"そんな鳩ヶ谷のもとへ、",
"「母校の野球部を助けてほしい」",
"という話がやってきます。",
"母校・彩珠学院の野球部は、このままではなくなってしまうかもしれません。",
"学校側から、",
"「甲子園へ行けなければ野球部は終わり」",
"という、とても厳しい条件を出されていたのです。",
"鳩ヶ谷は監督となります。",
"でも鳩ヶ谷のやり方は、普通の熱血監督とは少し違います。",
"大声で「根性だ！」と言うより、",
"「相手は何を考えている？」",
"「ここでどんな球を待っている？」",
"と、選手たちに考えさせます。",
"相手チームの性格まで調べ、心理を読み、試合の流れを変えていきます。",
"最初は弱かった選手たちも、",
"「頭を使えば、強い相手とも戦える」",
"と知っていきます。",
"そしてチームは、本当に甲子園をねらえるところまで成長します。",
"勝つためには、ただ一生懸命なだけでは足りません。",
"相手を見て、自分を知り、最後の一球まで考える。",
"そんな高校野球を描いた物語です。"
]},
{ cat:"m_baseball", title:"ROOKIES", yomi:"ルーキーズ", sub:"森田まさのり", author:"森田まさのり", authorYomi:"もりたまさのり", icon:"🔰", text:[
"二子玉川学園高校の野球部には、困った生徒たちが集まっていました。",
"昔、ケンカをして大きな問題を起こしてから、野球部はほとんど活動できなくなっていました。",
"そこへ、新しい先生・川藤幸一がやってきます。",
"川藤先生は少し暑苦しいくらい、まっすぐな先生です。",
"「夢にときめけ！ 明日にきらめけ！」",
"と本気で言います。",
"不良たちは最初、",
"「こんな先生、うっとうしい」",
"と思います。",
"でも川藤は、何度失敗しても生徒たちを見捨てません。",
"安仁屋、御子柴、新庄たちは、少しずつ野球へ戻ってきます。",
"「甲子園へ行きたい」。",
"昔は笑われるのがこわくて言えなかった夢を、また口にするようになります。",
"もちろん、すぐに強くなるわけではありません。",
"ケンカをしてしまったり、過去の問題が追いかけてきたりします。",
"それでも仲間たちは、野球をするために自分たちを変えていきます。",
"そして最後には、甲子園を目指して本当の高校球児として戦えるチームになります。",
"物語の終わりでは、川藤のもとで変わった生徒たちが、それぞれの人生へ歩き出します。",
"「人は何度失敗しても、やり直せる」。",
"そんな物語です。"
]},
{ cat:"m_baseball", title:"砂の栄冠", yomi:"すなのえいかん", sub:"三田紀房", author:"三田紀房", authorYomi:"みたのりふさ", icon:"💴", text:[
"七嶋裕之は、県立樫野高校の野球部にいる高校生です。",
"ある日、学校を応援していた老人から、とても大きなお金を渡されます。",
"「このお金を使って、甲子園へ行ってほしい」。",
"その額は、なんと一千万円。",
"七嶋はびっくりします。",
"しかも、そのお金のことは、ほかの人には秘密にしなければなりません。",
"樫野高校の監督は、あまり頼りになりません。",
"そこで七嶋は、自分たちでどうすれば勝てるのか考え始めます。",
"よい道具をそろえる。",
"練習を工夫する。",
"相手を調べる。",
"観客や審判にどう見えるかまで考える。",
"七嶋は、",
"「高校野球は、きれいごとだけでは勝てない」",
"と知っていきます。",
"やがて樫野高校は本当に強くなり、甲子園を目指せるチームになります。",
"しかし大きなお金を秘密で使うということは、七嶋の心にも重くのしかかります。",
"勝つこと。",
"仲間を守ること。",
"正しいこと。",
"その三つが、いつも同じとは限りません。",
"「甲子園へ行くためなら、どこまでしてよいのか」。",
"そんな少し大人っぽい問題まで描いた高校野球の物語です。"
]},
{ cat:"m_baseball", title:"グラゼニ", sub:"原作：森高夕次／作画：アダチケイジ", author:"森高夕次／アダチケイジ", authorYomi:"もりたかゆうじ", icon:"💰", text:[
"凡田夏之介は、プロ野球選手です。",
"でも、だれもが知っている大スターではありません。",
"主に試合の途中から投げる、中継ぎ投手です。",
"夏之介がいつも気にしているものがあります。",
"それがお金です。",
"プロ野球の世界では、活躍すれば年俸が上がります。",
"失敗すれば、来年はチームにいられないかもしれません。",
"夏之介は相手の年俸を見て、",
"「あの選手は一億円か……」",
"などと考えます。",
"でも、お金が好きだからといって、楽をして稼げるわけではありません。",
"一球打たれただけで試合をこわしてしまうこともあります。",
"けがをすれば仕事そのものを失います。",
"夏之介は結婚し、家族もでき、移籍も経験します。",
"そして日本のプロ野球だけでなく、アメリカの大リーグにも挑戦します。",
"有名選手の華やかなところではなく、",
"「野球で食べていく普通のプロ選手は、毎日何を考えているのか」",
"を描いた物語です。",
"シリーズは形を変えながら続いており、2026年には『グラゼニ〜大リーグ編〜』も刊行されています。"
]},
{ cat:"m_baseball", title:"忘却バッテリー", spine:"忘却|バッテリー", yomi:"ぼうきゃくバッテリー", sub:"みかわ絵子", author:"みかわ絵子", authorYomi:"みかわえこ", icon:"🔋", text:[
"清峰葉流火は、とても速い球を投げる天才投手です。",
"その球を受ける要圭も、相手のことを何でも読んでしまう天才捕手でした。",
"二人は中学生の野球界で、",
"「この二人には勝てない」",
"と恐れられていました。",
"ところが高校へ入るころ、圭は記憶を失ってしまいます。",
"野球のことも忘れ、昔の頭のよい「智将」とはまるで別人。",
"ふざけてばかりの、おかしな少年になっていました。",
"二人が入ったのは、野球の名門ではなく都立小手指高校。",
"そこには、中学時代に清峰と圭に負けて、",
"「もう野球なんかやりたくない」",
"と思っていた山田、藤堂、千早たちも集まっていました。",
"最初はみんな、野球から逃げています。",
"でも、いっしょにボールを追ううち、もう一度野球を好きになっていきます。",
"そして圭の中にも、昔の「智将」の記憶が少しずつ戻ってきます。",
"しかし昔の圭は、天才である清峰を支えるために、自分を追いつめすぎていました。",
"今の明るい圭と、昔の苦しかった圭。",
"その両方を受け入れることが、大きな課題になります。",
"2026年現在も連載中で、小手指高校は西東京の頂点を目指すところまで成長しています。"
]},
{ cat:"m_baseball", title:"BUNGO -ブンゴ-", spine:"BUNGO|-ブンゴ-", yomi:"ブンゴ", sub:"二宮裕次", author:"二宮裕次", authorYomi:"にのみやゆうじ", icon:"🧱", text:[
"石浜文吾は、少年野球チームさえない町で育ちました。",
"文吾が毎日していたことは、とても単純です。",
"壁へ向かって、ひたすらボールを投げる。",
"来る日も来る日も、何千回、何万回と投げます。",
"そんな文吾の前に、少年野球日本代表の野田幸雄が現れます。",
"野田は文吾の球を見て、",
"「こいつは、とんでもない投手になる」",
"と気づきます。",
"二人は中学生になると、強豪の静央シニアへ入ります。",
"そこには全国からすごい選手が集まっています。",
"今まで壁に投げていただけの文吾は、初めて「本当の野球」を学びます。",
"打たれれば悔しい。",
"試合に出られなければ悔しい。",
"それでも文吾は、だれよりもボールを投げます。",
"そしていつしか、全国でも注目される投手へ成長します。",
"静央シニアは全国大会の頂点を目指し、強豪・流山シニアと大勝負をします。",
"中学生編は2025年に全41巻で完結しました。",
"けれど文吾の野球人生は終わりません。",
"高校生になった文吾たちを描く続編『BUNGO-unreal-』が始まり、2026年現在も物語は続いています。"
]},
{ cat:"m_sports", title:"シュート!", yomi:"シュート", sub:"大島司", author:"大島司", authorYomi:"おおしまつかさ", icon:"⚽", text:[
"田仲俊彦、平松和広、白石健二は、小さいころからサッカーが大好きな三人組です。",
"高校へ入った俊彦は、掛川高校サッカー部へ入ります。",
"そこには、久保嘉晴というすごい選手がいました。",
"久保は、",
"「サッカーが好きなら、思いきりやればいい」",
"とみんなを引っぱります。",
"俊彦たちは久保にあこがれ、いっしょに全国を目指します。",
"ところが久保は、重い病気を抱えていました。",
"ある大切な試合で、久保は自分の力を全部使うようなすばらしいプレーを見せます。",
"しかしその後、若くして亡くなってしまいます。",
"チームのみんなは大きな悲しみに包まれます。",
"「もう久保さんはいない」。",
"それでも久保が残したサッカーへの思いは消えません。",
"俊彦たちは、",
"「久保さんが作ろうとしたサッカーを、自分たちが続けよう」",
"と再び立ち上がります。",
"俊彦はエースへ成長し、平松や白石たちと強豪校へ挑みます。",
"そして掛川高校は、日本一を目指せるチームになります。",
"大好きだった先輩との別れを乗り越え、その人の夢を次の世代が受けついでいく物語です。"
]},
{ cat:"m_sports", title:"ホイッスル!", yomi:"ホイッスル", sub:"樋口大輔", author:"樋口大輔", authorYomi:"ひぐちだいすけ", icon:"📯", text:[
"風祭将は、サッカーが大好きな中学生です。",
"でも、体が小さいため、名門・武蔵森学園ではなかなか試合に出してもらえませんでした。",
"「ぼくはもっとサッカーがしたい！」",
"そう思った将は、桜上水中学校へ転校します。",
"ところが転校先では、",
"「名門校から来たすごい選手らしい」",
"と勘違いされてしまいます。",
"本当は補欠だった将は、恥ずかしくなります。",
"でも逃げません。",
"朝も夜も練習し、少しずつ本当に上手な選手になっていきます。",
"水野、シゲ、不破たち仲間とも出会い、チームで戦う楽しさを知ります。",
"やがて将は東京都の選抜選手にも選ばれ、もっと広い世界のサッカーへ進みます。",
"しかし大きなけがをして、思うようにボールを蹴れなくなる時期もやってきます。",
"それでも将は、",
"「小さいから無理」",
"「けがをしたから終わり」",
"とは考えません。",
"一から体を作り直し、またサッカーへ戻ります。",
"最後には、もっと大きな舞台へ進もうとする将の姿が描かれます。",
"天才ではなかった少年が、「好きだから続ける」ことで自分の道を作る物語です。"
]},
{ cat:"m_sports", title:"GIANT KILLING", spine:"GIANT|KILLING", yomi:"ジャイアントキリング", sub:"作画：ツジトモ／原案・取材協力：綱本将也", author:"ツジトモ／綱本将也", icon:"⚽", text:[
"達海猛は、35歳のサッカー監督です。",
"むかし、達海は「ETU」という東京のプロサッカーチームのスター選手でした。",
"ところがチームを離れ、海外へ行ってしまいます。",
"そのあとETUはどんどん弱くなり、負けることが当たり前のようなチームになっていました。",
"そんなETUへ、達海が監督として帰ってきます。",
"選手たちは、",
"「昔チームを捨てた人が、どうして監督なんだ」",
"と反発します。",
"でも達海は気にしません。",
"達海が大好きなのは、",
"「弱いチームが強いチームを倒すこと」。",
"それを「ジャイアント・キリング」と呼びます。",
"達海は、名前の有名な選手だけを使うのではありません。",
"今まで目立たなかった選手の長所を見つけます。",
"ベテランと若手を競わせます。",
"サポーターや町の人たちとも向き合います。",
"するとETUは、少しずつ「どうせ負けるチーム」ではなくなっていきます。",
"強豪クラブを倒し、優勝争いにからめるほどのチームへ近づいていきます。",
"2026年現在も連載中で、ETUはクラブ初の大きなタイトルを目指して戦い続けています。"
]},
{ cat:"m_sports", title:"アオアシ", sub:"小林有吾", author:"小林有吾", authorYomi:"こばやしゆうご", icon:"👟", text:[
"愛媛県に、青井葦人というサッカー少年がいました。",
"アシトは自分で点を取ることが大好きなフォワードです。",
"「おれが一番うまい！」",
"と思っています。",
"ところが中学最後の大切な試合で失敗し、チームも負けてしまいます。",
"そんなアシトを見ていたのが、東京の強豪クラブ「東京シティ・エスペリオン」の福田監督でした。",
"福田はアシトに、",
"「東京へ来い」",
"と言います。",
"アシトは家族と離れ、東京へ行き、ユースチームへ入ります。",
"でもそこで、福田から思いがけないことを言われます。",
"「お前はフォワードではなく、サイドバックをやれ」。",
"アシトは大ショックです。",
"「点を取りたいのに、どうして守る選手なんだ！」",
"と怒ります。",
"でもアシトには、グラウンド全体を見る特別な力がありました。",
"サイドバックなら、その力をもっと使えるのです。",
"アシトは仲間との動き方を覚え、ただ一人で走る選手から、チーム全体を動かす選手へ成長します。",
"そして世界最高クラスの育成チーム、バルセロナユースとの試合へたどりつきます。",
"一度は1対3まで離されますが、エスペリオンはアシトを中心に追いつきます。",
"最後にはアシトが決勝点を決め、エスペリオンは勝利します。",
"その後アシトは、いよいよトップチームへ近づいていきます。",
"「田舎の得点王」が、世界を見られるサッカー選手へ変わっていく物語です。全40巻で完結しています。"
]},
{ cat:"m_sports", title:"DAYS", yomi:"デイズ", sub:"安田剛士", author:"安田剛士", authorYomi:"やすだごうし", icon:"🏃", text:[
"柄本つくしは、運動がとても苦手な高校生です。",
"足も速くありません。",
"体も強くありません。",
"そんなつくしが、同級生の風間陣に誘われ、フットサルへ行きます。",
"つくしは全然うまくできません。",
"転んで、失敗して、それでも必死に走ります。",
"風間はそんなつくしを見て、",
"「こいつ、おもしろいな」",
"と思います。",
"二人は同じ聖蹟高校へ入り、サッカー部へ入ります。",
"聖蹟は全国でも強い学校。",
"周りには、つくしより何倍も上手な選手ばかりです。",
"それでもつくしには、一つだけ誰にも負けないものがありました。",
"最後まで走ることです。",
"どんなに疲れても、",
"「もう一歩だけ」",
"と走ります。",
"その姿を見て、天才たちまで変わっていきます。",
"つくしは少しずつ試合にも出るようになり、仲間から必要とされる選手になります。",
"聖蹟は全国大会へ進み、強豪たちと戦います。",
"最後には、最初はボールもまともに蹴れなかったつくしが、「自分もこのチームの一員だ」と胸を張れる選手になります。",
"才能がなくても、だれかの心を動かすことはできる。",
"そんな物語です。"
]},
{ cat:"m_sports", title:"BE BLUES!〜青になれ〜", spine:"BE BLUES!|〜青になれ〜", yomi:"ビーブルース あおになれ", sub:"田中モトユキ", author:"田中モトユキ", authorYomi:"たなかもとゆき", icon:"💙", text:[
"一条龍は、小さなころからサッカーの天才でした。",
"龍の夢は、",
"「日本代表になって、青いユニフォームを着くこと」。",
"だから題名も「青になれ」です。",
"龍は小学生のころから、周りよりずっと上手でした。",
"このまま順調にいけば、本当にプロになれる。",
"みんながそう思っていました。",
"ところがある日、友達を助けようとして大きな事故にあいます。",
"龍は重いけがをして、今までのようにサッカーができなくなってしまいます。",
"長い入院とリハビリ。",
"やっと走れるようになっても、昔できたことができません。",
"それでも龍は、",
"「もう一度サッカー選手になる」",
"と決めます。",
"中学、高校と、一つずつ体を作り直します。",
"昔の天才だった自分と比べれば、くやしいことばかりです。",
"でも龍は、けがをしたからこそ、仲間を使うことや、試合全体を見ることも学びます。",
"そして高校サッカーの強豪たちと戦いながら、再び大きな夢へ近づいていきます。",
"「一度夢がこわれても、夢そのものまで捨てなくていい」。",
"事故で何もかも失った少年が、もう一度日本代表を目指す物語です。"
]},
{ cat:"m_sports", title:"エリアの騎士", yomi:"エリアのきし", sub:"原作：伊賀大晃／作画：月山可也", author:"伊賀大晃／月山可也", authorYomi:"いがひろあき", icon:"⚽", text:[
"逢沢駆には、サッカーの天才だった兄・傑がいました。",
"傑は日本代表になることを期待されるほど、すごい選手です。",
"一方の駆は、",
"「自分には兄ちゃんみたいな才能はない」",
"と思い、選手をやめようとしていました。",
"ところがある日、兄弟は交通事故にあいます。",
"傑は亡くなり、駆も命の危険にさらされます。",
"駆を助けるために使われたのは、兄・傑の心臓でした。",
"駆の胸の中で、兄の心臓が動き始めます。",
"駆は、",
"「兄ちゃんの夢まで、自分が背負わなければいけないのか」",
"と悩みます。",
"でも幼なじみの美島奈々や仲間たちとサッカーをするうち、少しずつ考えが変わります。",
"「兄の代わりになるんじゃない。ぼくはぼくとしてサッカーをするんだ」。",
"駆は江ノ島高校で全国を目指し、たくさんのライバルと戦います。",
"そして兄が夢見た日本代表の舞台へ、自分自身の力で近づいていきます。",
"最後には、駆は兄の影を追う少年ではなく、一人の選手として未来へ歩き出します。",
"亡くなった兄の心臓と夢を受けつぎながら、自分自身の人生を見つける物語です。"
]},
{ cat:"m_sports", title:"さよなら私のクラマー", spine:"さよなら私の|クラマー", yomi:"さよならわたしのクラマー", sub:"新川直司", author:"新川直司", authorYomi:"あらかわなおし", icon:"⚽", text:[
"恩田希は、サッカーが大好きな女の子です。",
"子どものころは男の子にまじってプレーし、",
"「だれにも負けたくない」",
"と思っていました。",
"でも大きくなると、男子と女子では体の強さに差が出てきます。",
"希は女子サッカーへ進み、蕨青南高校に入ります。",
"ところがチームは、あまり強くありません。",
"そこへ、曽志崎緑、周防すみれなど、個性的で上手な選手たちが集まってきます。",
"そして新しい監督やコーチのもとで、",
"「本当に強い女子サッカーチームを作ろう」",
"と動き始めます。",
"最初はバラバラだった選手たちも、試合をするうちに少しずつ仲間になります。",
"全国には、もっと上手な選手がたくさんいます。",
"負けることもあります。",
"でも希たちは、",
"「女子サッカーだから注目されない」",
"「人気がないから仕方ない」",
"とは考えません。",
"自分たちがすごい試合をすれば、見てくれる人は増える。",
"そう信じて走ります。",
"全国の頂点にすぐ届く物語ではありません。",
"けれど、これから女子サッカーをもっと大きくしていく若い選手たちの、始まりを描いた物語です。"
]},
{ cat:"m_fight", title:"火ノ丸相撲", yomi:"ひのまるずもう", sub:"川田", author:"川田", authorYomi:"かわだ", icon:"🔥", text:[
"潮火ノ丸は、小さな体の高校生です。",
"小学生のころは相撲でとても強く、「鬼丸国綱」という名前で知られていました。",
"でも相撲では、体の大きさがとても大切です。",
"中学生になると周りの選手がどんどん大きくなり、火ノ丸は勝てなくなっていきました。",
"それでも火ノ丸には、大きな夢があります。",
"「横綱になる」。",
"高校へ入った火ノ丸は、弱小だった大太刀高校相撲部へ入ります。",
"そこには不良の五條佑真や、体は大きいけれど気の弱い小関など、いろいろな仲間が集まります。",
"火ノ丸は、",
"「小さいから勝てない」",
"と言われるたび、もっと練習します。",
"力だけではなく、速さや技、気持ちの強さを使って大きな相手へぶつかります。",
"高校相撲で仲間たちと戦ったあと、火ノ丸は本当に大相撲の世界へ入ります。",
"プロの力士たちは、高校生とは比べものにならないほど強い相手ばかりです。",
"けれど火ノ丸は、何度負けても横綱になる夢を捨てません。",
"そして恋人のレイナや仲間たちに支えられながら、最高の力士たちと戦います。",
"体の大きさではなく、「自分の全部を土俵に置いてくる」少年の物語です。"
]},
{ cat:"m_sports", title:"イナズマイレブン", sub:"作者：やぶのてんや／原作・監修：レベルファイブ", author:"やぶのてんや／レベルファイブ", icon:"⚡", text:[
"円堂守は、雷門中学校のサッカー部のキャプテンです。",
"でも部員は少なく、サッカー部はなくなりそうになっていました。",
"円堂はサッカーが大好きなので、",
"「絶対にサッカー部をなくさない！」",
"と仲間を集めます。",
"そこへ、天才ストライカー・豪炎寺修也がやってきます。",
"最初はサッカーから離れていた豪炎寺も、円堂のまっすぐな気持ちに動かされ、またボールを蹴り始めます。",
"雷門中は全国大会「フットボールフロンティア」へ出場します。",
"相手チームには、普通では考えられないような必殺技を使う選手たちがいます。",
"円堂たちも、",
"「ゴッドハンド！」",
"「ファイアトルネード！」",
"といった必殺技を使って戦います。",
"強い学校と戦うたび、新しい仲間が増えます。",
"裏切りや、家族の問題、サッカーを悪い目的に使う大人たちとも向き合います。",
"それでも円堂は、",
"「サッカーはみんなで楽しむものだ！」",
"と言い続けます。",
"最後には、弱くて部員も足りなかった雷門中が、全国の強豪と肩を並べるチームになります。",
"友情と必殺技がいっぱいの、にぎやかなサッカー物語です。"
]},
{ cat:"m_fight", title:"柔道部物語", spine:"柔道部物語", yomi:"じゅうどうぶものがたり", sub:"小林まこと", author:"小林まこと", authorYomi:"こばやしまこと", icon:"🥋", text:[
"三五十五は、高校へ入ったばかりの普通の少年です。",
"ある日、友達といっしょに柔道部を見に行きます。",
"「ちょっと体験するだけ」。",
"そのつもりでした。",
"ところが先輩たちにうまくのせられ、そのまま柔道部へ入ることになります。",
"最初の三五は弱く、投げられてばかり。",
"練習もきつく、",
"「なんでこんな部に入ったんだ」",
"と思います。",
"でも負けると、やっぱりくやしい。",
"三五は少しずつ柔道に夢中になります。",
"強い先輩やライバルと戦い、技を覚え、体も心も強くなっていきます。",
"中でも大きな目標になるのが、怪物のように強い西野です。",
"三五は何度も、",
"「こんなやつに勝てるわけがない」",
"と思わされます。",
"それでも練習を重ねます。",
"そして最後には、最初は柔道を何も知らなかった少年が、日本一をねらえるほどの選手へ成長します。",
"おもしろく笑える場面もたくさんありますが、試合になると本気。",
"「好きになる予定なんてなかったものが、人生で一番大切なものになる」。",
"そんな青春物語です。"
]},
{ cat:"m_fight", title:"バチバチ", sub:"佐藤タカヒロ", author:"佐藤タカヒロ", authorYomi:"さとうたかひろ", icon:"💥", text:[
"鮫島鯉太郎は、相撲取りの息子です。",
"父親の火竜は、昔は大関まで上がった強い力士でした。",
"しかしある事件を起こして相撲界を追われ、その後亡くなってしまいます。",
"鯉太郎は父を尊敬しながらも、",
"「父さんのようにはならない」",
"という複雑な気持ちを抱えていました。",
"やがて鯉太郎自身も相撲の世界へ入ります。",
"空流部屋という相撲部屋で、厳しい稽古を始めます。",
"鯉太郎は力はありますが、気が短く、すぐ相手へ向かっていってしまいます。",
"そんな鯉太郎の前に、エリート力士の王虎をはじめ、強い若者たちが現れます。",
"土俵の上では、体がぶつかれば大きな音がします。",
"一瞬でも気をぬけば負けます。",
"鯉太郎は少しずつ、",
"「ただ暴れること」と「本当に強いこと」は違う",
"と知っていきます。",
"『バチバチ』で始まった鯉太郎の物語は、『バチバチBURST』『鮫島、最後の十五日』へ続いていきます。",
"最後のシリーズでは、体が限界に近づいても、鯉太郎は一日一番の相撲にすべてをかけます。",
"作者の佐藤タカヒロさんが連載中に亡くなったため、物語は完全な結末までは描かれませんでした。",
"それでも、鯉太郎が命のように大切にした相撲への思いは、強く残る物語です。"
]},
{ cat:"m_fight", title:"あさひなぐ", sub:"こざき亜衣", author:"こざき亜衣", authorYomi:"こざきあい", icon:"🗡️", text:[
"東島旭は、高校へ入ったばかりの女の子です。",
"中学までは運動が得意ではありませんでした。",
"高校では、",
"「何か新しいことを始めたい」",
"と思っています。",
"そこで出会ったのが「なぎなた」です。",
"長い棒のような武器を持って戦う、日本の武道です。",
"旭は二ツ坂高校なぎなた部へ入ります。",
"でも最初は弱く、すぐ疲れ、試合でもなかなか勝てません。",
"先輩たちは強く、同級生には才能のある八十村将子や紺野さくらもいます。",
"旭は自分だけが遅れているように感じます。",
"それでも練習を続けます。",
"だんだん、",
"「自分は力では勝てなくても、最後まで相手を見て戦える」",
"と分かってきます。",
"やがて旭たちは全国大会を目指すようになります。",
"強豪校の選手たちと何度も戦い、勝つ喜びも、負ける悔しさも知ります。",
"先輩が卒業すると、今度は旭たちが後輩を引っぱる立場になります。",
"そして最後には、入部したころは何もできなかった旭が、チームを背負える選手になります。",
"「強い人とは、最初から強い人ではなく、逃げずに続けた人なのかもしれない」。",
"そんな少女たちの青春物語です。"
]},
{ cat:"m_fight", title:"修羅の門", yomi:"しゅらのもん", sub:"川原正敏", author:"川原正敏", authorYomi:"かわはらまさとし", icon:"👊", text:[
"陸奥九十九は、小柄で静かな青年です。",
"でも彼は、「陸奥圓明流」という古い武術を使います。",
"この武術には、一つ変わった言い伝えがあります。",
"「千年もの間、一度も負けたことがない」。",
"九十九は、",
"「本当に陸奥圓明流は最強なのか」",
"を確かめるため、強い相手を探します。",
"空手、ボクシング、キックボクシング、レスリング。",
"世界には、いろいろな強さがあります。",
"九十九はその一人ひとりと、素手で戦います。",
"相手を憎んでいるわけではありません。",
"むしろ、",
"「あなたは強い。だから戦ってみたい」",
"という気持ちです。",
"やがて九十九は日本だけでなく、世界の格闘家たちとも戦います。",
"試合では命の危険さえあります。",
"それでも九十九は、自分の流派の強さだけではなく、",
"「人はなぜ強くなりたいと思うのか」",
"を知っていきます。",
"続編『修羅の門 第弐門』まで含め、九十九は多くの強敵と戦い、自分の中にある「修羅」と向き合います。",
"静かな青年が、最強というものを探して歩く格闘物語です。"
]},
{ cat:"m_fight", title:"空手小公子 小日向海流", spine:"空手小公子|小日向海流", yomi:"からてしょうこうし こひなたみのる", sub:"馬場康誌", author:"馬場康誌", authorYomi:"ばばやすし", icon:"🥋", text:[
"小日向海流は、大学で体操をしている青年です。",
"ある出来事をきっかけに、空手の世界へ入ります。",
"最初の海流は、本格的な格闘技の選手ではありません。",
"でも体操で身につけた、体を自由に動かす力があります。",
"空手を始めると、その才能が少しずつ目を覚まします。",
"道場には、海流よりずっと強い先輩や、こわい格闘家がたくさんいます。",
"殴られると痛い。",
"蹴られるともっと痛い。",
"試合では、",
"「怖いから逃げたい」",
"と思うこともあります。",
"それでも海流は、一試合ごとに強くなります。",
"空手だけでなく、キックボクシングや総合格闘技など、いろいろな格闘家たちとも出会います。",
"そして、",
"「本当に強いとは、相手を倒すことだけなのか」",
"を考えるようになります。",
"大学生だった普通の青年が、少しずつ本物の格闘家になっていく物語です。"
]},
{ cat:"m_fight", title:"はじめの一歩", yomi:"はじめのいっぽ", sub:"森川ジョージ", author:"森川ジョージ", authorYomi:"もりかわジョージ", icon:"🥊", text:[
"幕之内一歩は、気のやさしい高校生です。",
"お母さんの釣り船屋を手伝っているため、学校が終わるとすぐ家へ帰ります。",
"友達もあまりいません。",
"そして学校では、いじめられていました。",
"ある日、一歩がいじめられているところを、プロボクサーの鷹村守が助けます。",
"一歩は鷹村のジムで、初めてボクシングのパンチを打ちます。",
"すると、とんでもない力がありました。",
"釣り船の仕事で体が自然にきたえられていたのです。",
"一歩は考えます。",
"「強いって、どういうことなんだろう」。",
"その答えを知りたくて、ボクシングを始めます。",
"宮田一郎というライバルに出会い、千堂武士や伊達英二など、たくさんの強敵と戦います。",
"一歩は日本チャンピオンになります。",
"でも世界への道は簡単ではありません。",
"何度も体をこわし、ついには現役選手をいったん引退します。",
"それでも一歩はボクシングから離れません。",
"後輩を教え、セコンドをしながら、リングを外から見つめます。",
"その間にも、千堂や宮田、鷹村たちは戦い続けています。",
"2026年現在も物語は続いており、一歩の「強いとは何か」という問いにも、まだ最後の答えは出ていません。"
]},
{ cat:"m_sports", title:"ANGEL VOICE", spine:"ANGEL|VOICE", yomi:"エンジェルボイス", sub:"古谷野孝雄", author:"古谷野孝雄", authorYomi:"こやのたかお", icon:"🎤", text:[
"市立蘭山高校のサッカー部には、ケンカの強い不良たちが集まっていました。",
"あまりに問題ばかり起こすので、",
"「サッカー部ではなく、ケンカ部だ」",
"と言われるほどです。",
"そこへ黒木という監督がやってきます。",
"黒木は、",
"「こいつらなら、本気でサッカーをしたら強くなる」",
"と考えます。",
"成田、乾、百瀬たちは、最初は監督の言うことを聞きません。",
"でも試合をして、負けて、くやしい思いをすると、少しずつ変わります。",
"そしてチームを支えてくれるのが、マネージャーの高畑麻衣です。",
"麻衣には、人の心を落ち着かせるような美しい歌声がありました。",
"選手たちはその声に何度も励まされます。",
"ところが麻衣は重い病気になります。",
"選手たちは、",
"「麻衣に勝ったと報告したい」",
"と全国大会を目指します。",
"県大会の決勝では、王者・船和学院と戦います。",
"その試合の途中、麻衣は亡くなります。",
"選手たちは大きな悲しみに包まれます。",
"それでも、",
"「麻衣が最後に信じてくれた勝利を、本当にしよう」",
"とピッチへ戻ります。",
"そして市立蘭山は勝ち、その後全国大会でも優勝します。",
"ケンカしか知らなかった少年たちが、仲間のために本気でサッカーをする人間へ変わっていく物語です。"
]},
{ cat:"m_fight", title:"がんばれ元気", yomi:"がんばれげんき", sub:"小山ゆう", author:"小山ゆう", authorYomi:"こやまゆう", icon:"🥊", text:[
"堀口元気は、ボクサーの父親と二人で暮らす少年です。",
"お父さんは、",
"「いつか世界チャンピオンになる」",
"という夢を持っています。",
"元気はそんな父が大好きです。",
"二人は町から町へ移りながら、ボクシングの試合を続けます。",
"ところが父は、大切な試合のあと亡くなってしまいます。",
"元気は大きな悲しみを抱えます。",
"それでも、",
"「父ちゃんがかなえられなかった夢を、自分がかなえたい」",
"と思い、ボクシングを始めます。",
"元気は一人で練習を続け、やがてプロボクサーになります。",
"もちろん、父の夢を追うだけではありません。",
"戦う相手にも、それぞれの人生があります。",
"家族を背負っている人。",
"もう一度立ち上がろうとしている人。",
"元気は相手と拳を交えるたび、人の強さや弱さを知っていきます。",
"そして最後には、父の影だけを追っていた少年が、自分自身のボクシングを見つけます。",
"世界一になることだけではなく、",
"「父からもらったものを胸に、自分の人生を生きる」。",
"そんな少年の成長物語です。"
]},
{ cat:"m_fight", title:"ホーリーランド", sub:"森恒二", author:"森恒二", authorYomi:"もりこうじ", icon:"🌃", text:[
"神代ユウは、学校にも家にも居場所がないと感じている少年です。",
"人と話すことが苦手で、ひとりで町を歩いています。",
"ユウは自分を守るために、家でパンチの練習だけを何度も続けていました。",
"ある夜、町で不良にからまれます。",
"ユウはこわくてたまりません。",
"それでも練習していたパンチを出すと、相手を倒してしまいます。",
"そこから、",
"「夜の町に、とても強い少年がいる」",
"といううわさが広がります。",
"ユウは「ヤンキー狩り」と呼ばれるようになります。",
"でも本人は、だれかを傷つけたいわけではありません。",
"ただ、",
"「ここにいてもいい場所がほしい」",
"だけでした。",
"ユウは伊沢マサキという強い青年や、友達のシンと出会います。",
"ボクシング、空手、柔道など、いろいろな格闘技を使う相手とも戦います。",
"戦うほど、ユウは少しずつ自信をつけます。",
"しかし同時に、暴力には終わりがないことも知ります。",
"最後には、夜の町だけが自分の居場所ではないと分かり、ユウはその世界から外へ歩き出します。",
"「強くなること」と「自分を好きになること」は同じなのか。",
"そんなことを考えさせる物語です。"
]},
{ cat:"m_fight", title:"オールラウンダー廻", yomi:"オールラウンダーメグル", sub:"遠藤浩輝", author:"遠藤浩輝", authorYomi:"えんどうひろき", icon:"🤼", text:[
"高柳廻は、総合格闘技を習っている高校生です。",
"総合格闘技とは、パンチもキックも、投げ技も寝技も使うスポーツです。",
"廻は最初から最強の選手ではありません。",
"ものすごい天才でもありません。",
"でも練習をすることが好きです。",
"道場には、いろいろな人がいます。",
"プロを目指す人。",
"健康のためにやる人。",
"昔強かった人。",
"女の選手。",
"廻はその人たちと練習しながら、少しずつ技を覚えます。",
"大会へ出れば、相手も必死です。",
"殴られるのはこわいし、負ければくやしい。",
"それでも廻は、",
"「どうして負けたんだろう」",
"と考え、次の練習へ戻ります。",
"物語では派手な必殺技よりも、",
"「昨日できなかったことが、今日少しできるようになる」",
"という成長が大切に描かれます。",
"廻は仲間やライバルといっしょに、格闘技を通して自分の弱さと向き合っていきます。",
"普通の少年が、普通に努力を重ねながら、本物の格闘家へ近づく物語です。"
]},
{ cat:"m_sports", title:"リアル", sub:"井上雄彦", author:"井上雄彦", authorYomi:"いのうえたけひこ", icon:"♿", text:[
"野宮朋美は、高校をやめた青年です。",
"バスケットボールが好きでしたが、自分の起こした交通事故で、一人の女性に大きなけがをさせてしまいました。",
"その罪悪感をずっと抱えています。",
"戸川清春は、車いすバスケットボールの選手です。",
"足を失ってからも、",
"「もう一度、本気でバスケットをしたい」",
"と思っています。",
"高橋久信は、高校のバスケット部で人気者でした。",
"ところが交通事故にあい、車いすで生活することになります。",
"最初の高橋は、",
"「どうして自分がこんな目に」",
"と怒り、周りの人にも心を閉ざします。",
"三人の人生は、すぐにきれいにつながるわけではありません。",
"それぞれが別の場所で、失ったものと向き合います。",
"戸川は車いすバスケで上を目指します。",
"野宮はもう一度バスケットにかかわろうとします。",
"高橋は、自分の体が元どおりにならないかもしれない現実を少しずつ受け入れます。",
"勝てば全部幸せになる話ではありません。",
"「今の自分で、どうやってもう一度立ち上がるか」。",
"その姿を静かに描いている物語です。",
"2026年時点でも完結しておらず、三人の人生はまだ途中にあります。"
]},
{ cat:"m_sports", title:"あひるの空", yomi:"あひるのそら", sub:"日向武史", author:"日向武史", authorYomi:"ひなたたけし", icon:"🦆", text:[
"車谷空は、バスケットボールが大好きな高校生です。",
"でもバスケット選手としては、とても大きな弱点があります。",
"背が低いのです。",
"それでも空は、",
"「小さいからできないなんて言いたくない」",
"と思っています。",
"九頭龍高校へ入った空は、バスケット部へ行きます。",
"ところが部員たちは不良ばかり。",
"練習もほとんどしていません。",
"花園百春、千秋たちも、最初は空をからかいます。",
"でも空が本気でボールを追う姿を見て、少しずつ変わります。",
"「もう一度、本気でやってみるか」。",
"こうしてバラバラだった九頭龍高校バスケット部が動き始めます。",
"試合では、何度も負けます。",
"練習したからといって、すぐ強豪校に勝てるわけではありません。",
"チームの問題や、けが、家族のこともあります。",
"空のお母さんも病気を抱えています。",
"それでも空は、母と約束した舞台を目指して走ります。",
"この物語は、",
"「努力すれば必ず勝てる」",
"という簡単な話ではありません。",
"負けても、また体育館へ戻ってくる。",
"そんな少年たちの、とても長いバスケット物語です。"
]},
{ cat:"m_sports", title:"ベイビーステップ", sub:"勝木光", author:"勝木光", authorYomi:"かつきひかる", icon:"🎾", text:[
"丸尾栄一郎は、勉強がとても得意な高校生です。",
"ノートはいつもきれい。",
"予定もきっちり。",
"みんなから「エーちゃん」と呼ばれています。",
"ある日、運動不足を気にしてテニスクラブへ行きます。",
"そこで鷹崎奈津という女の子と出会います。",
"奈津は本気でプロテニス選手を目指していました。",
"エーちゃんは初めてテニスをして、",
"「こんなにおもしろいものがあるんだ」",
"と夢中になります。",
"最初は運動選手として特別な才能があるわけではありません。",
"そこでエーちゃんは、自分が得意な「記録」を使います。",
"相手がどこへ打ったか。",
"自分はどんなときミスをしたか。",
"全部ノートへ書きます。",
"一つずつ調べ、一つずつ直します。",
"すると、どんどん強くなっていきます。",
"やがて、",
"「本当にプロになりたい」",
"と思うようになります。",
"奈津とも恋人になります。",
"高校卒業後、エーちゃんはプロの世界へ進み、外国の選手とも戦います。",
"ところが作品は、エーちゃんの世界への挑戦がまだ続いている試合の途中で完結します。",
"勝ったか負けたかを全部描くのではなく、",
"「これからもエーちゃんは、一歩ずつ進み続ける」",
"というところで終わります。全47巻です。"
]},
{ cat:"m_sports", title:"ボールルームへようこそ", spine:"ボールルームへ|ようこそ", yomi:"ボールルームへようこそ", sub:"竹内友", author:"竹内友", authorYomi:"たけうちとも", icon:"💃", text:[
"富士田多々良は、将来やりたいことが見つからない中学生です。",
"夢もありません。",
"ある日、少しこわい男たちにからまれていたところを、仙石要という男性に助けられます。",
"仙石がやっていたのが、社交ダンスでした。",
"多々良はダンス教室へ連れていかれます。",
"最初は、",
"「男が踊るなんて恥ずかしい」",
"と思います。",
"でも、美しいドレスを着た人たちが音楽に合わせて動く姿を見て、心をうばわれます。",
"多々良は練習を始めます。",
"社交ダンスは、一人ではできません。",
"男の人と女の人がペアになり、相手の動きを感じながら踊ります。",
"多々良は、花岡雫や赤城賀寿たちと出会います。",
"やがて緋山千夏という女の子とペアを組みます。",
"でも多々良と千夏は、性格がまったく違います。",
"二人とも自分のやり方を曲げないので、何度もケンカします。",
"それでも練習を重ねるうち、",
"「相手を動かすのではなく、二人で一つの踊りを作る」",
"ことを学びます。",
"多々良は、何も夢がなかった少年から、ダンスで上へ行きたいと思う若者へ変わります。",
"物語はまだ続いており、二人のダンスも完成していません。"
]},
{ cat:"m_sports", title:"神様のバレー", yomi:"かみさまのバレー", sub:"原作：渡辺ツルヤ／作画：西崎泰正", author:"渡辺ツルヤ／西崎泰正", authorYomi:"わたなべつるや", icon:"🏐", text:[
"阿月総一は、バレーボールの指導者です。",
"でも普通の熱血コーチとは、少し違います。",
"阿月が得意なのは、",
"「相手が次に何をするかを読むこと」。",
"選手のくせ。",
"監督の考え方。",
"試合の流れ。",
"それらを細かく見て、相手の作戦を先に読んでしまいます。",
"そんな阿月が、中学生のバレーボールチームを指導することになります。",
"選手たちは、最初から全国一の天才ばかりではありません。",
"だから阿月は、",
"「力で勝てないなら、頭で勝て」",
"と教えます。",
"相手が強いサーブを打つなら、どこへ来るか考える。",
"高い選手がいるなら、その選手が動けない場所をねらう。",
"試合の中で、小さな工夫を積み重ねます。",
"選手たちはだんだん、",
"「言われたとおりに動くだけ」",
"ではなく、自分たちで考えられるチームになっていきます。",
"そして全国の強豪校へ挑みます。",
"題名の「神様」とは、本当に魔法を使う人ではありません。",
"相手の考えまで読みきって、勝つ道を作る阿月のことです。",
"バレーは身長や力だけではなく、「考える力」でも戦えると見せる物語です。"
]},
{ cat:"m_sports", title:"弱虫ペダル", yomi:"よわむしペダル", sub:"渡辺航", author:"渡辺航", authorYomi:"わたなべわたる", icon:"🚲", text:[
"小野田坂道は、アニメやゲームが大好きな高校生です。",
"高校へ入ったら、アニメ研究部に入りたいと思っていました。",
"坂道は秋葉原へ行くため、ずっと自転車で長い道を走っていました。",
"本人は気づいていませんでしたが、そのせいでものすごい脚力がついていました。",
"そんな坂道を見つけたのが、今泉俊輔と鳴子章吉です。",
"二人は自転車競技部の選手です。",
"坂道は初めてロードレーサーへ乗り、",
"「自転車でこんなに速く走れるんだ！」",
"と感動します。",
"そして総北高校自転車競技部へ入ります。",
"自転車のレースは、一人で速く走るだけでは勝てません。",
"風をよけてもらったり、仲間を引っぱったりします。",
"坂道は先輩たちから、",
"「チームで走る」",
"ということを学びます。",
"そして高校生日本一を決めるインターハイへ出場します。",
"箱根学園の真波山岳や、京都伏見の御堂筋翔など、強いライバルとも出会います。",
"坂道たちは世代が変わっても走り続けます。",
"2026年現在、坂道は高校最後となる三度目のインターハイを戦っています。",
"アニメ好きで友達も少なかった少年が、自転車を通してたくさんの仲間を得ていく物語です。"
]},
{ cat:"m_sports", title:"シャカリキ!", sub:"曽田正人", author:"曽田正人", authorYomi:"そだまさひと", icon:"⛰️", text:[
"野々村輝は、小さなころから自転車が大好きな少年です。",
"自転車に乗ると、坂道を見るだけでわくわくします。",
"普通の人なら、",
"「こんな坂、登りたくない」",
"と思うような道でも、輝は笑いながら登ります。",
"高校へ入ると、自転車競技の世界へ進みます。",
"そこには、輝より経験のある選手や、体の強い選手がたくさんいます。",
"でも坂道だけは、だれにも負けたくありません。",
"輝は体がぼろぼろになるまでペダルをこぎます。",
"仲間から、",
"「そこまでしなくてもいいだろ」",
"と言われても止まりません。",
"自転車に乗っているときだけ、自分が生きていると感じるからです。",
"やがて輝は全国レベルのレースへ進みます。",
"勝つことも大事です。",
"でも輝にとってもっと大切なのは、",
"「自分の全部を使って坂を登ったかどうか」。",
"自転車に取りつかれたような少年が、限界をこえて走る青春物語です。"
]},
{ cat:"m_sports", title:"Over Drive", spine:"Over|Drive", yomi:"オーバードライブ", sub:"安田剛士", author:"安田剛士", authorYomi:"やすだごうし", icon:"🚴", text:[
"篠崎ミコトは、運動があまり得意ではない高校生です。",
"好きな女の子・深澤ゆきに、",
"「自転車部へ入らない？」",
"と声をかけられます。",
"ミコトは、ゆきに近づきたいという気持ちもあり、自転車を始めます。",
"ところが練習は思ったよりずっと大変です。",
"坂道を登るだけで息が苦しくなります。",
"先輩たちは速く、ついていくだけでも精いっぱいです。",
"それでもミコトには、まだ本人も知らない力がありました。",
"自転車へ乗るとき、ものすごい集中力を見せることがあります。",
"ミコトは少しずつレースへ出るようになります。",
"そして、",
"「好きな女の子のため」",
"だけではなく、",
"「もっと速くなりたい」",
"と思うようになります。",
"仲間やライバルたちと走るうち、自分の弱さとも向き合います。",
"最後には、最初は自転車のことを何も知らなかったミコトが、本気で自転車選手として未来を考えるようになります。",
"少年が、一つのスポーツに出会って人生そのものを変えていく物語です。"
]},
{ cat:"m_sports", title:"capeta", yomi:"カペタ", sub:"曽田正人", author:"曽田正人", authorYomi:"そだまさひと", icon:"🏎️", text:[
"平勝平太、通称カペタは、小学生の男の子です。",
"お父さんと二人で、あまりお金のない生活をしています。",
"ある日、お父さんは仕事先で見たレーシングカートを参考にして、古い部品を集め、カペタのために一台のカートを作ります。",
"カペタは初めてカートへ乗ります。",
"すると、その瞬間から夢中になります。",
"速く走る。",
"曲がる。",
"前の車を抜く。",
"カペタには、だれにも教わっていないのに、車の動きを感じる力がありました。",
"でもレースにはお金がかかります。",
"いい車、いいタイヤ、遠くの大会。",
"裕福なライバルたちとは条件が違います。",
"それでもカペタは、",
"「今あるもので、どうすれば速く走れるか」",
"を考えます。",
"カートから本格的なレーシングカーへ。",
"国内レースから海外へ。",
"少しずつ大きな舞台へ進みます。",
"そして、世界最高の自動車レース「F1」を目指せるところまで成長します。",
"貧しい少年が、お父さんの手作りカートから世界へ走り出す物語です。"
]},
{ cat:"m_sports", title:"F", yomi:"エフ", sub:"六田登", author:"六田登", authorYomi:"むつだのぼる", icon:"🏁", text:[
"赤木軍馬は、田舎の大きな家に生まれた青年です。",
"でも父親とうまくいかず、家を飛び出します。",
"軍馬が好きなのは、車をものすごい速さで走らせることです。",
"「おれは一番速くなる！」",
"その気持ちだけで、レーサーの世界へ入ります。",
"最初は乱暴で、自分のことしか考えていません。",
"でもレースでは、一つのミスで命を失うこともあります。",
"仲間やライバルが傷つくこともあります。",
"軍馬は何度も失敗しながら、速さだけではレーサーになれないと知ります。",
"やがて日本を飛び出し、海外のレースへ挑戦します。",
"そして目指すのは、世界最高峰のF1です。",
"そこには世界中から集まった天才たちがいます。",
"車の性能。",
"チームの力。",
"お金。",
"運。",
"そしてドライバーの勇気。",
"すべてが必要です。",
"軍馬は多くのものを失いながらも、走ることをやめません。",
"「なぜ人は命をかけてまで速く走りたいのか」。",
"そんな問いを抱えながら、世界の頂点を目指す物語です。"
]},
{ cat:"m_sports", title:"頭文字D", yomi:"イニシャルディー", sub:"しげの秀一", author:"しげの秀一", authorYomi:"しげのしゅういち", icon:"🚗", text:[
"藤原拓海は、高校生です。",
"家は豆腐屋をしています。",
"拓海は毎朝早く、お父さんに言われて車で豆腐をホテルへ届けていました。",
"通るのは、山のくねくねした道。",
"豆腐をこわさず、早く届けるため、拓海は知らないうちにものすごい運転技術を身につけていました。",
"でも本人は、車にあまり興味がありません。",
"ある日、走り屋の高橋啓介が山道で拓海の古い車「AE86」にあっさり抜かれます。",
"「いったい、あの車はだれなんだ!?」",
"そこから拓海は、山道で速さを競う世界へ入ります。",
"高橋兄弟をはじめ、いろいろな走り屋と戦います。",
"拓海はレースをするたび、",
"「自分はなぜ車を走らせるのが好きなのか」",
"を知っていきます。",
"やがて高橋涼介の作った「プロジェクトD」へ入り、各地の強豪と戦います。",
"最後の大勝負では、拓海の86は大きく壊れます。",
"拓海は長く乗ってきた愛車と別れ、新しい未来へ進むことになります。",
"ただの豆腐配達だった少年が、本物のレーサーを目指すまでの物語です。"
]},
{ cat:"m_sports", title:"湾岸ミッドナイト", yomi:"わんがんミッドナイト", sub:"楠みちはる", author:"楠みちはる", authorYomi:"くすのきみちはる", icon:"🌉", text:[
"朝倉アキオは、高校生の車好きです。",
"ある日、中古車置き場で一台の古いスポーツカーを見つけます。",
"青い日産フェアレディZ。",
"その車は昔から、乗った人が事故にあうため、",
"「悪魔のZ」",
"と呼ばれていました。",
"普通なら、",
"「そんな車には乗らないほうがいい」",
"と思います。",
"でもアキオは、その車に強くひかれます。",
"悪魔のZを直し、夜の首都高速道路を走り始めます。",
"そこで出会うのが、黒いポルシェ「ブラックバード」を走らせる島達也です。",
"二人は夜の高速道路で、何度も速さを競います。",
"でもこの物語は、",
"「どちらが一番速いか」",
"だけの話ではありません。",
"車を作る整備士。",
"エンジンを調整する人。",
"昔の事故を忘れられない人。",
"速さに取りつかれた人。",
"さまざまな大人たちが出てきます。",
"みんな、",
"「どうしてこんな危ないことを続けるのだろう」",
"と思いながら、それでも車から離れられません。",
"アキオもまた、悪魔のZといっしょに走りながら、自分が本当に求めている速さを探していきます。"
]},
{ cat:"m_sports", title:"モンキーターン", sub:"河合克敏", author:"河合克敏", authorYomi:"かわいかつとし", icon:"🚤", text:[
"波多野憲二は、高校生のころ野球をしていました。",
"でもプロ野球選手になれるほどではありません。",
"そんなとき、",
"「競艇選手にならないか」",
"とすすめられます。",

{ cat:"m_sports", title:"メダリスト", sub:"つるまいかだ", author:"つるまいかだ", icon:"⛸️", text:[

"でも始めるのが遅く、選手として大きな大会へ行く夢はかないませんでした。",
"だからこそ、いのりの気持ちがよく分かります。",

"「やりたいなら、やってみよう」。",
"こうして司はコーチになり、いのりは選手になります。",
"最初はいちばん下の級からです。",

"また立つ。",

"光は小さなころから注目されてきた選手です。",
"いのりは、",
"「いつか光ちゃんと同じ場所で戦いたい」",

"いのりはどんどん大きな舞台へ進みます。",
"2026年現在も物語は続いており、いのりは世界の強豪が集まるジュニアグランプリファイナルで、オリンピックへつながる大切な戦いに挑んでいます。",
"「始めるのが遅かったから、夢を見てはいけない」なんてことはない。",

{ cat:"m_daily", title:"クレヨンしんちゃん", sub:"臼井儀人", author:"臼井儀人", authorYomi:"うすいよしと", icon:"🖍️", text:[

]},

{ cat:"m_daily", title:"よつばと!", sub:"あずまきよひこ", author:"あずまきよひこ", icon:"🍀", text:[
