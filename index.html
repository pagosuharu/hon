{ cat:"m_horror", title:"ドロロンえん魔くん", spine:"ドロロン|えん魔くん", yomi:"ドロロンえんまくん", sub:"永井豪", author:"永井豪", authorYomi:"ながいごう", icon:"🔥", text:[
"地獄から、えん魔くんという男の子が人間の世界へやってきました。",
"えん魔くんは、えん魔大王の親せきです。",
"人間界へ逃げだした悪い妖怪たちを捕まえるため、「妖怪パトロール」として働くことになりました。",
"仲間には、雪女の雪子姫、カッパのカパエルなどがいます。",
"えん魔くんは炎をあやつり、妖怪たちと戦います。",
"でも、出てくる妖怪がみんな本当に悪いとは限りません。",
"人間に追いかけられて困っている妖怪もいます。",
"反対に、人間のほうが妖怪よりずっと欲ばりでこわいこともあります。",
"えん魔くんたちは、けんかをしたり笑ったりしながら、人間と妖怪のあいだで起きる事件を解決していきます。",
"ちょっとこわくて、ちょっとおかしい妖怪退治のお話です。"
]},
{ cat:"m_space", title:"銀河鉄道999", yomi:"ぎんがてつどうスリーナイン", sub:"松本零士", author:"松本零士", authorYomi:"まつもとれいじ", icon:"🚂", text:[
"遠い未来、人間は体を機械に変えれば、ほとんど死なずに生きられるようになっていました。",
"星野鉄郎という少年は、貧しくて機械の体を買えませんでした。",
"そして大切な母親を機械人間の伯爵に殺されてしまいます。",
"鉄郎は、「ただで機械の体をくれる星」へ行くため、宇宙を走る列車・銀河鉄道999に乗ります。",
"いっしょに旅をするのは、母によく似た謎の女性メーテルです。",
"列車はたくさんの星へ止まります。",
"永遠に生きる人、働くことを忘れた人、貧しくても幸せな人。",
"鉄郎は旅をするうちに、「機械の体になれば本当に幸せなのかな」と考えるようになります。",
"最後にたどり着いた星で、機械の体をめぐる大きな秘密を知った鉄郎は、人間の体のまま生きる道を選びます。",
"そしてメーテルとも別れ、自分の人生を自分の足で歩き始めるのです。"
]},
{ cat:"m_space", title:"宇宙海賊キャプテンハーロック", spine:"宇宙海賊|キャプテン|ハーロック", yomi:"うちゅうかいぞくキャプテンハーロック", sub:"松本零士", author:"松本零士", authorYomi:"まつもとれいじ", icon:"🏴‍☠️", text:[
"遠い未来の地球では、人々は豊かな暮らしに慣れ、宇宙で起きていることにほとんど興味を持たなくなっていました。",
"そんな中、宇宙海賊キャプテンハーロックだけは、自由に生きていました。",
"ハーロックの船は「アルカディア号」。",
"仲間たちと宇宙を旅しています。",
"そこへ、「マゾーン」という謎の女性たちの軍団が地球をねらっていることがわかります。",
"でも地球の政府は危険を信じようとしません。",
"ハーロックは、「だれかに命令されたからではない。自分が守りたいから守るんだ」と、一人でも戦う道を選びます。",
"父を殺された少年・台羽正もアルカディア号へ乗り、ハーロックとともに戦います。",
"最後にはマゾーンの女王ラフレシアとの大きな戦いになります。",
"ハーロックは地球に認められなくても、自分が信じる自由と仲間を守り、また宇宙へ旅立っていくのです。"
]},
{ cat:"m_space", title:"クイーン・エメラルダス", spine:"クイーン・|エメラルダス", sub:"松本零士", author:"松本零士", authorYomi:"まつもとれいじ", icon:"💎", text:[
"宇宙には、「クイーン・エメラルダス号」という恐ろしいほど強い宇宙船がありました。",
"その船に乗っているのが、顔に傷を持つ女性・エメラルダスです。",
"人々は彼女を「宇宙の魔女」と呼び、恐れています。",
"でもエメラルダスは、弱い人をむやみに傷つける人ではありません。",
"勇気を持ち、自分の夢へ向かって進む人には、静かに手を貸します。",
"そんなエメラルダスが出会うのが、自分でつくった宇宙船に乗って宇宙へ出た少年・海野広です。",
"まだ未熟な広ですが、「いつか自分の力で宇宙を旅したい」と夢を持っています。",
"エメラルダス自身にも、大山トチローという大切な人との思い出があります。",
"愛する人を失っても、その思いを胸に宇宙を進み続けます。",
"孤独な女海賊が、広い宇宙で夢を持つ人々を見守りながら旅を続ける物語です。"
]},
{ cat:"m_space", title:"1000年女王", yomi:"せんねんじょおう", sub:"松本零士", author:"松本零士", authorYomi:"まつもとれいじ", icon:"👸", text:[
"地球のそばへ、「ラーメタル」という巨大な星が近づいていました。",
"もしその星が地球へ近づきすぎれば、大きな災害が起こります。",
"少年・雨森始は、叔父の天文学者といっしょに、その星について調べ始めます。",
"そのころ始の学校には、雪野弥生という美しい女性がいました。",
"じつは弥生には大きな秘密があります。",
"彼女こそ、ラーメタルから地球へ送られた「1000年女王」だったのです。",
"千年ごとに交代しながら、地球を見守る役目を持っていました。",
"最初、弥生はラーメタル側の人間です。",
"でも長いあいだ地球で暮らし、人間たちを愛するようになっていました。",
"「自分の故郷を守るのか。それとも地球を守るのか」。",
"弥生は二つの星のあいだで悩みます。",
"そして始たちとともに、少しでも多くの命を救う道を探していくのです。"
]},
{ cat:"m_history", title:"ザ・コクピット", sub:"松本零士", author:"松本零士", authorYomi:"まつもとれいじ", icon:"🛩️", text:[
"この作品には、一人の主人公はいません。",
"第二次世界大戦を中心に、飛行機や戦車、船に乗ったさまざまな兵士たちのお話が描かれます。",
"ある話では、日本の戦闘機に乗る若いパイロット。",
"別の話では、ドイツ軍の兵士。",
"また別の話では、敵どうしだった二人の飛行士が空で出会います。",
"戦争では、昨日まで普通に家族と暮らしていた若者が、突然「敵を倒せ」と言われます。",
"でも空の上で戦っている相手にも、同じように家族や夢があります。",
"勝った人が必ず幸せになるわけでもありません。",
"負けた人が必ず悪い人だったわけでもありません。",
"一つ一つは短いお話ですが、その中に「戦争の中でも、人は人間らしくいられるのか」という問いがあります。",
"戦争で生きた名もない人たちを、静かに描いた短編集です。"
]},
{ cat:"m_daily", title:"男おいどん", yomi:"おとこおいどん", sub:"松本零士", author:"松本零士", authorYomi:"まつもとれいじ", icon:"🍄", text:[
"九州から東京へやってきた大山昇太は、「いつか立派な男になるぞ」と大きな夢を持っていました。",
"でも現実はなかなかうまくいきません。",
"四畳半の古い下宿に住み、お金はほとんどありません。",
"仕事で失敗してクビになり、学校もやめることになり、恋をしてもなかなか実りません。",
"押し入れには洗っていない下着がたまり、そこから「サルマタケ」という不思議なキノコまで生えてきます。",
"それでも昇太は、",
"「今日がだめでも、明日はきっと何とかなる」",
"と生きていきます。",
"大家のおばさんやラーメン屋のおじさんも、そんな昇太をなんだかんだ言いながら助けてくれます。",
"大成功する英雄の話ではありません。",
"失敗ばかりの普通の若者が、貧しくても夢を捨てずに一日一日を生きる物語です。"
]},
{ cat:"m_daily", title:"聖凡人伝", yomi:"せいぼんじんでん", sub:"松本零士", author:"松本零士", authorYomi:"まつもとれいじ", icon:"🛏️", text:[
"出戻始という、あまりさえない青年がいました。",
"始は人生がうまくいかず、「もう死んでしまおう」と思ったことさえあります。",
"ところが結局死ぬこともできず、会社もやめ、古いアパートへ戻ってきます。",
"そこから始の、なんとも変わった毎日が始まります。",
"お金はない。",
"仕事も長続きしない。",
"アパートでは変な事件ばかり起こります。",
"隣の人や大家さん、きれいな女性など、変わった人たちも次々と現れます。",
"始は何度失敗しても、なんとなく次の日まで生きています。",
"「立派な人間にならなくても、生きていればいろいろある」。",
"そんな少し力の抜けた人生観が、この漫画には流れています。",
"宇宙を旅する英雄ではなく、狭い四畳半でゴロゴロしている普通の男を主人公にした、笑えて少しさびしい人生のお話です。"
]},
{ cat:"m_work", title:"HOTEL", yomi:"ホテル", sub:"石ノ森章太郎", author:"石ノ森章太郎", authorYomi:"いしのもりしょうたろう", icon:"🏨", text:[
"東京に、大きなホテル「プラトン」がありました。",
"ホテルには毎日、いろいろなお客さんがやってきます。",
"結婚式をする人。",
"家族旅行に来た人。",
"仕事で泊まる人。",
"外国から来た人。",
"そしてホテルで働く人たちは、「お客さんに気持ちよく過ごしてもらうには、どうすればいいだろう」と考えながら働いています。",
"中心となるのは、赤川一平や東堂克生たちホテルマンです。",
"予約のまちがい、なくし物、病気、夫婦げんか。",
"毎日のように小さな事件が起こります。",
"それでもホテルマンは、お客さんに「来てよかった」と思ってもらえるよう走り回ります。",
"ホテルは、ほんの一晩だけ知らない人どうしが同じ建物で過ごす不思議な場所です。",
"そこで出会う人たちの喜びや悲しみを、一つずつ描いていくお仕事漫画です。"
]},
{ cat:"m_drama", title:"沈黙の艦隊", yomi:"ちんもくのかんたい", sub:"かわぐちかいじ", author:"かわぐちかいじ", authorYomi:"かわぐちかいじ", icon:"⚓", text:[
"日本とアメリカがひそかにつくった、最新の原子力潜水艦がありました。",
"艦長は海江田四郎。",
"ところが海江田は、航海の途中で突然命令に従うことをやめます。",
"そして潜水艦を「やまと」と名づけ、",
"「この船は、どこの国にも属さない一つの独立国家だ」",
"と宣言します。",
"海江田が目指していたのは、世界から戦争をなくすことでした。",
"でも世界中の国々は、「核兵器を持つ潜水艦が勝手に動き回っている」と恐れます。",
"アメリカ海軍を中心に、やまとを捕まえようとたくさんの艦隊が動きます。",
"海江田は潜水艦の知識と大胆な作戦で、それらを次々とかわしながらニューヨークを目指します。",
"そして最後には国際社会へ向かって、「国と国が武器を持ってにらみ合う世界を、本当に続けていいのか」と問いかけます。",
"やまとは沈みますが、海江田が世界へ投げかけた問いは残ります。",
"最後の演説の途中、一発の銃声が響くところで、長い航海は幕を閉じます。"
]},
{ cat:"m_history", title:"ジパング", sub:"かわぐちかいじ", author:"かわぐちかいじ", authorYomi:"かわぐちかいじ", icon:"🚢", text:[
"海上自衛隊の最新鋭護衛艦「みらい」が、太平洋を航海していました。",
"ところが突然、ものすごい嵐に巻きこまれます。",
"嵐を抜けると、まわりの景色がおかしくなっていました。",
"目の前に現れたのは、第二次世界大戦中の日本海軍。",
"「みらい」は、現代から1942年へタイムスリップしてしまったのです。",
"副長の角松洋介たちは悩みます。",
"「未来のことを昔の人に教えたら、歴史が変わってしまう」。",
"ところが海で一人の日本軍人・草加拓海を助けたことで、歴史は動き始めます。",
"未来の日本を知った草加は、",
"「日本が負ける未来を、そのまま受け入れる必要はない」",
"と考え、自分の理想の国「ジパング」をつくろうとします。",
"角松は、「未来を知っているからといって、勝手に歴史を変えていいのか」と草加を止めようとします。",
"やがて草加は原子爆弾まで手にし、戦艦「大和」と「みらい」は最後の戦いへ向かいます。",
"大和もみらいも沈み、草加も命を落とします。",
"角松は元の時代へ簡単に帰ることはできません。",
"それでも残された世界で、「この時代をどう生きるか」を選びます。",
"未来を知る人間が過去へ行ったら、歴史を直すべきなのか。それとも、歴史も一人ひとりの人生も、その時代の人に任せるべきなのか。そんな大きな問いを描いた物語です。"
]},
{ cat:"m_drama", title:"太陽の黙示録", yomi:"たいようのもくしろく", sub:"かわぐちかいじ", author:"かわぐちかいじ", authorYomi:"かわぐちかいじ", icon:"☀️", text:[
"2002年、日本をとても大きな地震が襲いました。富士山も噴火し、さらにいくつもの巨大地震が続きます。日本列島は南と北に分断され、それまでの国のしくみまで壊れてしまいました。",
"その大災害を生きのびた少年・柳舷一郎は、家族を探しながら、たくさんの人と出会います。日本を離れて中国や台湾などへ逃げた人もいれば、残った土地で新しい社会をつくろうとする人もいました。",
"年月がたつと、日本はアメリカや中国の影響を受けながら、北と南に分かれていきます。舷一郎は、「昔の日本をそのまま取り戻すのではなく、みんながもう一度暮らせる新しい国をつくろう」と考えるようになります。",
"しかし同じように日本を救おうとする宗方操とは、方法が違いました。二人は何度もぶつかります。それでも最後には、殺し合うより、話し合って未来を決める道へ進みます。大きな災害ですべてを失った人々が、「国とは何だろう」と一から考え直す物語です。"
]},
{ cat:"m_drama", title:"空母いぶき", yomi:"くうぼいぶき", sub:"作者：かわぐちかいじ　協力：惠谷治", author:"かわぐちかいじ／惠谷治", authorYomi:"かわぐちかいじ", icon:"🛳️", text:[
"少し未来の日本。尖閣諸島の近くで、日本と中国の軍艦がぶつかりそうになる事件が起こりました。",
"「このままでは、本当に戦争になるかもしれない」。",
"日本は新しく、戦闘機を乗せることのできる空母「いぶき」をつくります。その艦長になったのが、秋津竜太です。",
"やがて中国軍が島々を占領し、日本人を人質にします。「いぶき」の艦隊は、島を取り戻すため出動します。しかし相手の兵士も人間です。むやみに攻撃すれば、戦争はどんどん大きくなってしまいます。",
"秋津たちは、「必要なところだけ戦い、全面戦争にはしない」という、とても難しい戦いを続けます。空でも海でも激しい戦闘になりますが、政治家たちも同時に外交で戦争を止めようとします。",
"最後には両国がさらに大きな戦争へ進む前に、戦いは終わります。勝つことより、「戦争をどこで止めるのか」が大切なのだと問いかける物語です。"
]},
{ cat:"m_horror", title:"ヤマタイカ", sub:"星野之宣", author:"星野之宣", authorYomi:"ほしのゆきのぶ", icon:"🔔", text:[
"沖縄の久高島に、伊耶輪神子という少女がいました。神子の家は、むかしから神さまへ祈りをささげる女性たちの家系でした。",
"ある日、神子は自分の中に、とても古い記憶のようなものがあることに気づきます。それは、邪馬台国の女王・卑弥呼へとつながる記憶でした。",
"神子は九州へ向かい、巨大な銅鐸「オモイカネ」の秘密を追います。そして「昔の日本には、火を大切にした人々と、太陽を大切にした人々の大きな争いがあったのではないか」という謎へたどり着いていきます。",
"やがて、人々の強い思いによって巨大な祭器が動き出し、海に沈んでいた戦艦大和までよみがえります。日本各地では火山が噴火し、大勢の人々が東京へ向かい始めます。",
"現代の日本そのものを舞台に、古代の「大きな祭り」がもう一度始まろうとしていたのです。「日本人はどこから来たのだろう」という歴史の謎を、とてつもなく大きな伝奇物語にした作品です。"
]},
{ cat:"m_horror", title:"宗像教授異考録", spine:"宗像教授|異考録", yomi:"むなかたきょうじゅいこうろく", sub:"星野之宣", author:"星野之宣", authorYomi:"ほしのゆきのぶ", icon:"🏺", text:[
"宗像伝奇という大学教授がいました。",
"宗像先生が研究しているのは、日本や世界に残る昔話、神話、伝説です。",
"「鬼のお話は、ほんとうにただの作り話なのかな？」",
"「この地方に同じような神さまの話が残っているのは、なぜだろう？」",
"宗像先生は古い本を読み、遺跡を歩き、お祭りを調べます。すると、有名な昔話の裏から、忘れられた歴史が見えてくることがあります。",
"ときには宝物をねらう悪人や、古い秘密を守ろうとする人たちとの事件にも巻きこまれます。",
"最後にはイギリスの大英博物館まで舞台となり、世界中から集められた歴史の品々をめぐる大事件に挑みます。",
"「昔の人が残したお話には、本当の歴史が少しだけ隠れているかもしれない」。そんな想像を楽しみながら、宗像先生といっしょに歴史の謎を解いていく物語です。"
]},
{ cat:"m_history", title:"海帝", yomi:"かいてい", sub:"星野之宣", author:"星野之宣", authorYomi:"ほしのゆきのぶ", icon:"⛵", text:[
"15世紀の中国・明の時代に、鄭和という男がいました。",
"鄭和は皇帝・永楽帝に仕え、とても大きな船団を率いて海へ出ます。その船団は、のちのコロンブスたちよりもずっと早く、アジアからインド洋まで旅をしました。",
"鄭和はベトナム、ジャワ、スマトラ、インドなど、さまざまな土地へ向かいます。海賊に襲われたり、外国の王どうしの争いに巻きこまれたりしながらも、「戦うだけではなく、話し合いと交易で国を結ぶ」道を探します。",
"でも鄭和の心には、永楽帝への複雑な思いがありました。鄭和は若いころ、故郷も家族も、自分の体の大切なものまで奪われていたからです。",
"何度も大海原を旅した鄭和は、最後には自分からすべてを奪った皇帝とも向き合います。",
"「海の向こうには何があるのだろう」。そんな人間の好奇心と、世界をつなぐ大航海を描いた物語です。"
]},
{ cat:"m_history", title:"ナポレオン―獅子の時代―", spine:"ナポレオン|―獅子の時代―", yomi:"ナポレオン ししのじだい", sub:"長谷川哲也", author:"長谷川哲也", authorYomi:"はせがわてつや", icon:"🦁", text:[
"フランスで大きな革命が起こり、王さまたちの時代が揺れていたころ、一人の若い軍人が現れました。",
"名前はナポレオン・ボナパルトです。",
"ナポレオンは身分の高い家の生まれではありませんでした。でも大砲の使い方や戦い方にすぐれ、どんなに苦しい戦場でも大胆な作戦を考えます。",
"フランス革命の混乱の中で頭角を現し、イタリアの戦いでは次々と敵軍を破ります。",
"「自分ならフランスをもっと強い国にできる」。",
"ナポレオンは軍人から政治家へ、そしてついにはフランス皇帝にまでのぼっていきます。",
"でも、強くなればなるほど敵も増えます。",
"この『獅子の時代』では、若かったナポレオンが革命の時代を走り抜け、皇帝へ近づいていくまでが中心に描かれます。その後の皇帝としての戦いは、続編『覇道進撃』へ続いていきます。"
]},
{ cat:"m_history", title:"アンゴルモア 元寇合戦記", spine:"アンゴルモア|元寇合戦記", yomi:"アンゴルモア げんこうかっせんき", sub:"たかぎ七彦", author:"たかぎ七彦", authorYomi:"たかぎななひこ", icon:"🏹", text:[
"1274年、海の向こうから、モンゴル帝国を中心とした大軍が日本へやってきました。",
"その途中にある対馬へ送られていた罪人の一人に、朽井迅三郎という武士がいました。",
"突然、対馬へ大軍が攻めこんできます。",
"「こんな少ない人数で、どうやって戦えばいいんだ」。",
"迅三郎は島の姫・輝日や、同じ流人たち、島の武士たちと力を合わせます。山や城を利用しながら、大軍を相手に必死に戦いました。",
"対馬での戦いを生きのびた迅三郎の物語は、その後「博多編」へ続きます。",
"七年後には、さらに大きなモンゴル軍がやってきます。迅三郎と輝日は家族となっていますが、今度は二人の子どもまで戦いに巻きこまれてしまいます。",
"日本を襲った「元寇」を、一人の流人武士の目から描いた物語です。"
]},
{ cat:"m_history", title:"達人伝―9万里を風に乗り―", spine:"達人伝|―9万里を|風に乗り―", yomi:"たつじんでん きゅうまんりをかぜにのり", sub:"王欣太", author:"王欣太", authorYomi:"きんぐごんた", icon:"🌬️", text:[
"むかし、中国にまだ秦、趙、楚など、たくさんの国があったころのお話です。",
"荘丹という若者がいました。",
"荘丹は、昔の偉い思想家・荘子の子孫です。",
"秦という国の昭王は、天下を自分のものにしようとしていました。荘丹はそんな秦の大きな力に立ち向かうため、仲間を探す旅へ出ます。",
"旅の途中で出会うのは、剣の達人、弓の名人、思想家、将軍など、変わったすごい人たちばかりです。",
"やがて荘丹は、白起という秦の恐ろしい名将や、戦国時代を動かしたたくさんの人物と関わっていきます。",
"でも荘丹が求めているのは、「自分が王になること」ではありません。",
"力の強い一つの国が、すべての人を押さえつける世界ではなく、人間が自由に生きられる道を探しています。",
"古代中国を舞台に、強さだけではなく「人はどう生きればよいか」を描く、とても大きな歴史物語です。"
]},
{ cat:"m_history", title:"ファラオの墓", yomi:"ファラオのはか", sub:"竹宮惠子", author:"竹宮惠子", authorYomi:"たけみやけいこ", icon:"🐪", text:[
"むかし、古代エジプトにエステーリアという小さな国がありました。",
"ところが強い国ウルジナに攻められ、国は滅ぼされてしまいます。",
"エステーリアの王子サリオキスは生きのびるため身分を隠し、ファラオの墓をつくる奴隷になります。妹のナイルキアも、敵の国で身を隠して暮らすことになりました。",
"サリオキスはそこで、アンケスエンという美しい女性と出会い、恋をします。",
"でもアンケスエンは、エステーリアを滅ぼした王スネフェルの婚約者でした。",
"その一方で、スネフェル自身も、正体を知らないままナイルキアを愛するようになります。",
"サリオキスはやがて、ウルジナに苦しめられている人々を集め、「砂漠の鷹」と呼ばれる戦士になります。",
"二つの国の戦争と、敵どうしの人を好きになってしまった四人の恋がからみ合います。",
"国を愛する気持ちと、一人の人を愛する気持ち。どちらも捨てられない人々の、悲しく大きな歴史ロマンです。"
]},
{ cat:"m_sf", title:"百億の昼と千億の夜", spine:"百億の昼と|千億の夜", yomi:"ひゃくおくのひるとせんおくのよる", sub:"原作：光瀬龍　漫画：萩尾望都", author:"光瀬龍／萩尾望都", authorYomi:"みつせりゅう", icon:"🌌", text:[
"むかし、哲学者プラトンは、「海に沈んだというアトランティスは、本当にあったのだろうか」と考えていました。",
"調べていくうち、プラトンは不思議な力によって、遠い過去と未来を旅することになります。",
"そして時代は大きく変わります。",
"仏教を開く前のシッダールタ、戦いの神・阿修羅王、そしてイエス・キリストまで現れます。",
"彼らが追いかけているのは、「なぜ文明は生まれては滅びるのか」「宇宙は、どこへ向かっているのか」という、とても大きな謎です。",
"星が生まれ、文明が栄え、そして滅んでいく。",
"その裏には、宇宙そのものを滅びへ導いている何かがあるらしいのです。",
"阿修羅王たちは、何十億年という時間を越えて、その正体を追い続けます。",
"人間のお話から始まり、最後には宇宙の終わりまで行ってしまう、とてつもなく大きなSF物語です。"
]},
{ cat:"m_sf", title:"スター・レッド", sub:"萩尾望都", author:"萩尾望都", authorYomi:"はぎおもと", icon:"🔴", text:[
"遠い未来、星という十五歳の少女が地球で暮らしていました。",
"星には秘密があります。",
"白い髪と赤い目を持つ、火星人だったのです。",
"小さいころ、戦争の起きた火星から逃がされ、地球人のシュウに育てられました。",
"しかし地球の人々は、火星を自分たちの土地として開発しようとします。",
"火星人たちは、「ここは私たちの故郷だ」と抵抗します。",
"星は自分が何者なのかを知るため、火星へ向かいます。",
"そこで、地球人と火星人の長い争い、自分の家族、そして火星そのものに隠された秘密を知ります。",
"戦いの中で星は、大切な人たちを失います。",
"そして最後には、一人の少女の命を越えた形で、火星の未来へつながっていきます。",
"「故郷とは、生まれた場所なのか。それとも、自分を愛してくれた人がいる場所なのか」。そんなことを問いかける宇宙の物語です。"
]},
{ cat:"m_sf", title:"銀の三角", yomi:"ぎんのさんかく", sub:"萩尾望都", author:"萩尾望都", authorYomi:"はぎおもと", icon:"🔺", text:[
"遠い未来の宇宙に、「銀の三角」と呼ばれる不思議な民族がいました。",
"彼らは未来を感じ取り、美しい音楽を奏でる力を持っていました。",
"ところが、その力を争いに利用され、やがて民族そのものが滅んだと考えられていました。",
"それから三万年もたったころ、マーリーという男が、「銀の三角の人間がまだ存在しているらしい」という謎を追い始めます。",
"そこへラグトーリンという不思議な吟遊詩人が現れます。",
"マーリーは殺されては新しい体へ再生され、時間を何度も行き来します。",
"同じ人が何人も現れたり、起こったはずの出来事が消えたりして、歴史そのものが変わっていきます。",
"最後には、銀の三角という民族が存在した歴史そのものさえ消えてしまいます。",
"でも、彼らがつくった歌と夢だけは残りました。",
"「人が消えても、その人が残したものは本当に消えるのだろうか」。そんな不思議なSF物語です。"
]},
{ cat:"m_sf", title:"マージナル", sub:"萩尾望都", author:"萩尾望都", authorYomi:"はぎおもと", icon:"🌏", text:[
"西暦2999年。",
"地球には、ほとんど男しかいなくなっていました。",
"病気のため、地球の人々は普通に子どもをつくれなくなっていたのです。",
"人々は、「ホウリ・マザ」というただ一人の母が、すべての子どもを生んでいると信じていました。",
"でも、それは本当ではありませんでした。",
"月に住む人々が、地球を大きな実験場として使っていたのです。",
"そんな世界で、キラという特別な少年が生まれます。",
"キラには人の心を感じたり、不思議な夢を見る力がありました。",
"グリンジャやアシジンたちは、世界の秘密を知り、地球を支配しているしくみへ立ち向かいます。",
"やがて、人間だけではなく、地球そのものが弱っていることがわかります。",
"最後にキラは、青い海を取り戻したいという地球の夢と一つになります。",
"キラ自身は消えてしまいますが、その力によって地球は再び命を取り戻していくのです。"
]},
{ cat:"m_drama", title:"メッシュ", sub:"萩尾望都", author:"萩尾望都", authorYomi:"はぎおもと", icon:"🗼", text:[
"パリに、メッシュという十六歳くらいの少年がいました。",
"メッシュは悪い仲間とつきあい、薬の売買など危険な世界にいました。",
"ある日、その仲間から逃げようとしてひどいけがをします。",
"そんなメッシュを拾ったのが、ミロンという画家でした。",
"ミロンは、有名な絵をそっくりに描く「贋作」をつくって生活しています。",
"メッシュはミロンの家で暮らしながら、いろいろな人と出会います。",
"画家、モデル、歌手、お金持ち、犯罪者。",
"みんなきれいに見えても、心の中には悩みや秘密を持っています。",
"メッシュ自身も、家族とのつらい過去を抱えていました。",
"でもミロンや周囲の人たちとの暮らしの中で、「だれかに大切にされてもいいんだ」と少しずつ知っていきます。",
"一人の傷ついた少年が、芸術の町パリで、自分の居場所を探していく物語です。"
]},
{ cat:"m_drama", title:"半神", yomi:"はんしん", sub:"萩尾望都", author:"萩尾望都", authorYomi:"はぎおもと", icon:"👯", text:[
"ユージーとユーシーは、体がつながって生まれてきた双子の姉妹でした。",
"姉のユージーは頭がよく、勉強が得意です。",
"妹のユーシーは、とても美しい顔をしていました。",
"けれども妹は自分では何もできないため、ユージーがいつも世話をしなければなりません。",
"まわりの人は、「ユーシーは本当にきれいね」と妹ばかりほめます。",
"ユージーはだんだん、",
"「どうして私ばかり苦労しなければいけないの」",
"と思うようになります。",
"十三歳になるころ、二人の体は、このままではどちらも生きられないほど弱ってしまいます。",
"医者は、二人を手術で分けることにします。",
"でも助かることができるのは、ユージーだけでした。",
"妹がいなくなったあと、ユージーは自由になります。",
"ところが鏡を見ると、自分の顔がだんだん美しくなっていました。",
"「私は妹を嫌っていた。でも、私は妹を愛していた」。",
"愛と憎しみが同時に心の中にあることを描いた、とても短く悲しい物語です。"
]},
{ cat:"m_drama", title:"イグアナの娘", yomi:"イグアナのむすめ", sub:"萩尾望都", author:"萩尾望都", authorYomi:"はぎおもと", icon:"🦎", text:[
"リカという女の子が生まれました。",
"お父さんには、かわいい赤ちゃんに見えます。",
"でもなぜか、お母さんにだけは、リカが「イグアナ」に見えてしまいました。",
"お母さんはリカをかわいがることができません。",
"あとから生まれた妹のマミは普通の人間に見えたので、母は妹ばかり大切にします。",
"リカはずっと、",
"「私は本当にみにくいのかな」",
"「どうしたらお母さんに好きになってもらえるのかな」",
"と悩みながら育ちます。",
"大人になり、恋をして、自分も母親になります。",
"そして自分の母が亡くなったとき、リカは初めて母の本当の姿を知ります。",
"じつは母自身も、心の中では自分を「イグアナのような存在」だと思っていたのです。",
"母は自分自身を嫌う気持ちを、娘のリカへ向けてしまっていました。",
"リカはそのことを知り、ようやく母を少し理解します。",
"「自分を嫌う心は、いちばん近い人まで傷つけてしまう」。そんな親子のお話です。"
]},
{ cat:"m_drama", title:"残酷な神が支配する", spine:"残酷な神が|支配する", yomi:"ざんこくなかみがしはいする", sub:"萩尾望都", author:"萩尾望都", authorYomi:"はぎおもと", icon:"⛓️", text:[
"ジェルミという少年は、母サンドラと二人で暮らしていました。",
"ある日、母がグレッグというお金持ちの男性と恋をします。",
"ジェルミは、「お母さんが幸せになれるなら」と二人の結婚を受け入れます。",
"ところがグレッグは、家族の前ではやさしい紳士なのに、裏ではジェルミをひどく傷つける人でした。",
"ジェルミは母を悲しませたくなくて、だれにも本当のことを言えません。",
"ついに追いつめられたジェルミは、グレッグを事故に見せかけて殺そうとします。",
"でもその車には母も乗っていて、二人とも亡くなってしまいます。",
"グレッグの息子イアンは、やがて父がジェルミに何をしていたかを知ります。",
"イアンは傷つき、逃げ、自分を壊そうとするジェルミを何とか助けようとします。",
"すぐに元気になることはできません。",
"それでもジェルミは少しずつ自分の過去と向き合い、「傷ついたあとでも、人はもう一度生きることができるのか」を探していきます。"
]},
{ cat:"m_sf", title:"バルバラ異界", yomi:"バルバラいかい", sub:"萩尾望都", author:"萩尾望都", authorYomi:"はぎおもと", icon:"💤", text:[
"2052年、渡会時夫という男性がいました。",
"時夫には、人の夢の中へ入ることができる特別な能力があります。",
"ある日、七年間も眠り続けている少女・青羽の夢を調べてほしいと頼まれます。",
"青羽の夢の中には、「バルバラ」という美しい島がありました。",
"そこでは青羽は、とても幸せに暮らしています。",
"ところが現実の青羽には、とても恐ろしい過去がありました。",
"両親が亡くなった事件と、青羽自身にまつわる不思議なうわさ。",
"時夫が調べていくと、青羽の夢と現実、さらに時夫自身の家族までがつながっていきます。",
"「夢の世界が本物なのか、現実の世界が本物なのか」。",
"調べれば調べるほど、二つの世界の境目がわからなくなります。",
"人間の夢が、未来そのものを変えてしまうかもしれない。",
"そんな大きな謎へ進んでいくSFミステリーです。"
]},
{ cat:"m_drama", title:"バナナブレッドのプディング", spine:"バナナブレッドの|プディング", sub:"大島弓子", author:"大島弓子", authorYomi:"おおしまゆみこ", icon:"🍌", text:[
"衣良という、少し変わった女子高校生がいました。",
"衣良は普通の恋愛がなんとなくこわくて、",
"「自分を恋愛の相手として見ない男の人なら安心できるのに」",
"と考えていました。",
"そのため、男性を好きになる男性こそ理想だと思っています。",
"そんな衣良のまわりに、いろいろな人たちが現れます。",
"恋をする人、うまく人を好きになれない人、自分が何を望んでいるのかわからない人。",
"衣良自身も、人との関わりの中で、自分の心が思っていたよりずっと複雑なことに気づいていきます。",
"「好き」という気持ちは、きれいに説明できるものではありません。",
"悲しくなったり、おかしくなったり、逃げたくなったりします。",
"少女の心の中を、そのままふわふわと言葉にしたような、不思議でやさしい青春物語です。"
]},
{ cat:"m_horror", title:"四月怪談", yomi:"しがつかいだん", sub:"大島弓子", author:"大島弓子", authorYomi:"おおしまゆみこ", icon:"👻", text:[
"国下初子という普通の女子高校生がいました。",
"ある四月の日、初子は事故にあい、なんと死んでしまいます。",
"気がつくと、自分の体から魂が抜けていました。",
"「えっ、私、死んじゃったの？」",
"初子はびっくりします。",
"でもまだ完全にあの世へ行ったわけではありません。",
"幽霊になった初子は、自分の家族や友だち、好きな人たちが、自分がいなくなったあとどうしているのかを見て回ります。",
"そして、生きていたころには気づかなかった、みんなの本当の気持ちを知っていきます。",
"初子は、",
"「やっぱり、まだ死にたくない。もう一度みんなと話したい」",
"と強く願うようになります。",
"死んで初めて、生きている毎日がどれほど大切だったかを知る少女のお話です。"
]},
{ cat:"m_history", title:"摩利と新吾", yomi:"まりとしんご", sub:"木原敏江", author:"木原敏江", authorYomi:"きはらとしえ", icon:"🎓", text:[
"明治から大正へ移り変わるころ、鷹塔摩利と印南新吾という二人の少年がいました。",
"二人は同じ学校で学び、かけがえのない親友になります。",
"性格は違っていても、いつもおたがいを助けます。",
"学生寮では、友だちとけんかをしたり、恋をしたり、将来について悩んだりします。",
"でも二人が生きているのは、日本が急いで西洋の文化を取り入れていた時代です。",
"学校を出れば、それぞれ別の人生を歩まなければなりません。",
"摩利にとって、新吾はただの友だちという言葉では足りないほど大切な人でした。",
"それでも人は、いつまでも同じ場所にいることはできません。",
"少年だった二人が大人になり、別れや再会をくり返しながら、それぞれの人生を歩いていきます。",
"青春の時間は終わっても、心の中の友情は消えない。そんな長い友情の物語です。"
]},
{ cat:"m_drama", title:"エロイカより愛をこめて", spine:"エロイカより|愛をこめて", yomi:"エロイカよりあいをこめて", sub:"青池保子", author:"青池保子", authorYomi:"あおいけやすこ", icon:"🎩", text:[
"ドリアン・レッド・グローリア伯爵は、とても美しいものが大好きな大泥棒です。",
"怪盗としての名前は「エロイカ」。",
"世界中の名画や宝石を、華麗に盗んでいきます。",
"そのエロイカが何度も出会うのが、NATOの情報部で働くクラウス・ハインツ・フォン・デム・エーベルバッハ少佐です。",
"クラウスはとてもまじめで、仕事一筋。",
"派手で自由なエロイカとは、何もかも正反対です。",
"「またお前か！」",
"「まあ少佐、そんなに怒らなくても」",
"二人は会うたびにけんかになります。",
"ところが大きなスパイ事件が起きると、敵なのか味方なのかわからないまま、なぜかいっしょに事件を解決することになります。",
"世界各国を飛び回り、スパイ、泥棒、軍人たちが入り乱れる中で、エロイカと少佐の奇妙な追いかけっこはずっと続いていくのです。"
]},
{ cat:"m_horror", title:"悪魔の花嫁", yomi:"あくまのはなよめ", sub:"原作：池田悦子　作画：あしべゆうほ", author:"池田悦子／あしべゆうほ", authorYomi:"いけだえつこ", icon:"👰", text:[
"悪魔デイモスには、ヴィーナスという美しい妹がいました。",
"二人は愛し合ってしまった罰として、神々から恐ろしい運命を与えられます。",
"ヴィーナスは体を少しずつ失い、永遠に苦しむことになりました。",
"妹を救うため、デイモスはヴィーナスとそっくりな美しい少女を探します。",
"そして見つけたのが、美奈子という少女でした。",
"「美奈子を死なせ、その体をヴィーナスに渡せば、妹を救える」。",
"デイモスはそう考えます。",
"けれども美奈子と過ごすうちに、デイモス自身も彼女へ特別な感情を持つようになります。",
"美奈子のまわりでは、人間の欲や嫉妬から、さまざまな恐ろしい事件が起こります。",
"悪魔であるデイモスより、人間のほうがずっと恐ろしく見えることさえあります。",
"美奈子を犠牲にしたいのに、守りたくもなる。",
"そんなデイモスの迷いを中心に、長く続いていく怪奇ロマンです。"
]},
{ cat:"m_drama", title:"ガラスの城", yomi:"ガラスのしろ", sub:"わたなべまさこ", author:"わたなべまさこ", authorYomi:"わたなべまさこ", icon:"🏰", text:[
"ロンドンの貧しい町に、イサドラとマリサという姉妹が暮らしていました。",
"二人の母が亡くなったあと、ある秘密がわかります。",
"じつはマリサは、行方不明になっていた伯爵家の娘だったのです。",
"ところがイサドラは、",
"「私が伯爵の娘になれば、お金持ちになれる」",
"と考え、その秘密を隠して自分が伯爵令嬢のふりをします。",
"マリサは本当の身分を知らないまま苦しい人生を歩み、イサドラはうそを守るため、さらに大きなうそを重ねていきます。",
"やがて人をだますだけでは足りず、命にかかわることまで起こします。",
"二人にはそれぞれ娘も生まれます。",
"すると、母親たちの争いは次の世代にまで続いてしまいます。",
"まるで美しいガラスのお城のように、きらきらした生活。",
"でも、うその上につくった幸せは、とてもこわれやすい。",
"一つのうそから始まった、長く悲しい姉妹の物語です。"
]},
{ cat:"m_art", title:"デザイナー", sub:"一条ゆかり", author:"一条ゆかり", authorYomi:"いちじょうゆかり", icon:"👗", text:[
"亜美という若い女性は、ファッションモデルとして働いていました。",
"美しく、才能もあり、まわりからはうらやましがられます。",
"でも亜美の本当の夢は、服を着る人ではなく、「服をつくる人」になることでした。",
"亜美はデザイナーの世界へ入り、厳しい競争の中で、自分の服をつくろうとします。",
"ところがファッションの世界には、才能だけではなく、お金や名声、人間どうしの嫉妬もあります。",
"さらに亜美は、自分の生まれに隠された大きな秘密を知っていきます。",
"愛する人との関係も、その秘密によって苦しいものになります。",
"「成功すれば幸せになれる」と思っていた亜美ですが、成功と引きかえに大切なものを次々と失っていきます。",
"華やかなドレスの裏側にある、人間の欲や孤独を描いた、とても激しい物語です。"
]},
{ cat:"m_love", title:"砂の城", yomi:"すなのしろ", sub:"一条ゆかり", author:"一条ゆかり", authorYomi:"いちじょうゆかり", icon:"🏖️", text:[
"お金持ちの家に生まれたナタリーは、家の前に捨てられていた少年フランシスと、兄妹のように育ちました。",
"二人は大きくなるにつれ、おたがいを恋人として愛するようになります。",
"でも家族は二人の結婚を許してくれません。",
"絶望した二人は、いっしょに海へ身を投げます。",
"ところが二人とも助かっていました。",
"別々に生きのびた二人は、何年かたって再会します。",
"そこから二人は、離れたり、また近づいたりします。",
"別の人を好きになろうとしたり、仕事を始めたりしても、心の中から相手を消すことができません。",
"長い年月をへて、ようやく二人は静かな暮らしを手に入れます。",
"でも「ずっといっしょにいたい」という願いは、簡単にはかなえられません。",
"砂でつくったお城が波でくずれるように、幸せが何度も壊れてしまう、長く切ない恋のお話です。"
]},
{ cat:"m_drama", title:"おにいさまへ…", yomi:"おにいさまへ", sub:"池田理代子", author:"池田理代子", authorYomi:"いけだりよこ", icon:"✉️", text:[
"御苑生奈々子は、高校へ入学したばかりの女の子です。",
"奈々子は学校で起こったことを、「おにいさま」と呼んで慕っている年上の男性へ手紙で知らせるようになります。",
"ところが入学した学校には、「ソロリティ」と呼ばれる特別な集まりがありました。",
"家柄がよく、美しく、優秀な少女だけが入れるとされています。",
"奈々子はなぜかそのソロリティへ選ばれます。",
"そのため、まわりの少女からねたまれたり、いじめられたりします。",
"奈々子はそこで、薫の君、サン・ジュスト、蕗子という、とても強く美しい先輩たちと出会います。",
"でも彼女たちも、外から見えるほど幸せではありません。",
"家族、恋、病気、孤独。",
"それぞれが深い悩みを抱えています。",
"奈々子は彼女たちと関わりながら、「美しく見える人にも、見えない悲しみがある」と知っていくのです。"
]},
{ cat:"m_horror", title:"聖ロザリンド", yomi:"せいロザリンド", sub:"わたなべまさこ", author:"わたなべまさこ", authorYomi:"わたなべまさこ", icon:"🎀", text:[
"ロザリンドという、とてもかわいらしい少女がいました。",
"大きな目でにっこり笑う、普通の女の子に見えます。",
"ところがロザリンドには、大きな問題がありました。",
"自分が人を傷つけても、それがどれほど恐ろしいことなのか、よくわからないのです。",
"「この人がいなくなれば、私の欲しいものが手に入る」",
"そう思うと、ロザリンドはためらわずに恐ろしいことをしてしまいます。",
"でも本人には、大人の悪人のような「悪いことをしてやろう」という気持ちさえあまりありません。",
"だからこそ、まわりの人はロザリンドをますます恐れます。",
"事件が重なるにつれ、人々は少しずつ「あの少女がおかしいのではないか」と気づきます。",
"天使のようにかわいい少女と、その心の中にある恐ろしさ。",
"その大きな違いを描いた、昔の少女漫画を代表するホラー作品です。"
]},
{ cat:"m_battle", title:"スケバン刑事", yomi:"スケバンデカ", sub:"和田慎二", author:"和田慎二", authorYomi:"わだしんじ", icon:"🪀", text:[
"麻宮サキという少女は、不良として警察につかまっていました。",
"サキのお母さんも牢屋に入っています。",
"そこへ警察の男がやってきて言いました。",
"「お母さんを助けたければ、警察のために働け」。",
"こうしてサキは、学校へもぐりこんで事件を調べる「スケバン刑事」になります。",
"武器はヨーヨーです。",
"でも普通のヨーヨーではありません。",
"中には警察の印があり、悪人を捕まえるための強い武器になります。",
"サキは学校に隠れている犯罪や、大きな悪の組織と戦います。",
"最大の敵の一つとなるのが、海槌麗巳たちです。",
"戦いが大きくなるほど、サキは仲間を失い、自分自身も深く傷つきます。",
"最初は母を助けるために始めた仕事でした。",
"でも最後には、「自分と同じように苦しんでいる人を守りたい」という気持ちで戦う少女になっていくのです。"
]},
{ cat:"m_fantasy", title:"ピグマリオ", sub:"和田慎二", author:"和田慎二", authorYomi:"わだしんじ", icon:"🗿", text:[
"クルトという少年は、小さな国の王子でした。",
"でもクルトのお母さんは、石の像にされていました。",
"悪い神メデューサの力によって、石に変えられてしまったのです。",
"「お母さんを元に戻したい！」",
"クルトは剣を持ち、旅へ出ます。",
"旅の途中では、妖精や魔物、神さま、さまざまな国の人々と出会います。",
"クルト自身にも、普通の人間とは違う大きな力があることがわかってきます。",
"でも、本当に強い力を手に入れるほど、",
"「この力を何のために使うのか」",
"が大切になります。",
"クルトは仲間を失ったり、悲しい真実を知ったりしながらも、母を救うため進み続けます。",
"少年の小さな冒険から始まり、最後には神々の世界まで巻きこむ、とても大きなファンタジー物語です。"
]},
{ cat:"m_sports", title:"ふたり鷹", yomi:"ふたりたか", sub:"新谷かおる", author:"新谷かおる", authorYomi:"しんたにかおる", icon:"🏁", text:[
"沢渡鷹と東条鷹という、同じ「鷹」の名前を持つ二人の若者がいました。",
"二人ともオートバイが大好きです。",
"道路やレース場で出会った二人は、最初は強いライバルになります。",
"「絶対にあいつには負けたくない」。",
"そう思いながら、何度も競い合います。",
"でもレースは、一人だけではできません。",
"オートバイを整備する人、応援する人、家族や仲間たち。",
"たくさんの人の力が必要です。",
"そして二人の間には、ただのライバルでは終わらない、家族にまつわる深い秘密もありました。",
"事故で大けがをしたり、大切な人を失ったりしても、二人はまたバイクへ戻ります。",
"「速く走りたい」。",
"その一つの思いを追いかけながら、少年だった二人が本物のレーサーへ成長していく物語です。"
]},
{ cat:"m_battle", title:"エリア88", yomi:"エリアはちじゅうはち", sub:"新谷かおる", author:"新谷かおる", authorYomi:"しんたにかおる", icon:"✈️", text:[
"風間真は、飛行機のパイロットになることを夢見る青年でした。",
"大きな航空会社の社長の娘・涼子とも愛し合い、幸せな未来が待っているはずでした。",
"ところが親友だと思っていた神崎にだまされ、真は外国の戦争に参加する契約書へサインしてしまいます。",
"連れていかれたのは、砂漠の中にある傭兵部隊「エリア88」。",
"そこでは戦闘機に乗り、敵を倒さなければ生きて帰れません。",
"真は最初、",
"「日本へ帰りたい。涼子のところへ帰りたい」",
"と願います。",
"でも戦いが続くうち、仲間もできます。",
"ミッキー、サキなど、命を預け合う人々です。",
"やがて真は優秀な戦闘機乗りになります。",
"しかし戦争で生きる時間が長くなるほど、平和だったころの自分から遠ざかっていきます。",
"空を飛ぶ美しさと、戦争の悲しさをいっしょに描いた物語です。"
]},
{ cat:"m_battle", title:"砂の薔薇", yomi:"すなのばら", sub:"新谷かおる", author:"新谷かおる", authorYomi:"しんたにかおる", icon:"🏜️", text:[
"マリーという、とても強い女性がいました。",
"彼女は「CAT」という特別なチームを率いています。",
"CATの仕事は、世界中で起こる危険な事件から人々を救うこと。",
"飛行機の乗っ取り、爆弾、テロリストとの戦いなど、とても危険な任務ばかりです。",
"マリーがそこまで戦うのには理由がありました。",
"昔、マリーには愛する夫と子どもがいました。",
"でも爆弾テロによって、大切な家族を失ってしまったのです。",
"「同じ悲しみを、ほかの人には味わわせたくない」。",
"その思いでマリーは戦います。",
"強い女性ですが、悲しくないわけではありません。",
"仲間の前では笑っていても、心の中には家族の思い出があります。",
"砂漠のように厳しい世界の中で、それでも一輪の薔薇のように生きる女性たちの物語です。"
]},
{ cat:"m_sf", title:"紅い牙", yomi:"あかいきば", sub:"柴田昌弘", author:"柴田昌弘", authorYomi:"しばたまさひろ", icon:"🔮", text:[
"小松崎蘭という少女には、秘密の力がありました。",
"心の力によって、普通ではできないことを起こせる超能力です。",
"でも、その力を持っているために、蘭は悪い組織からねらわれます。",
"彼女の力を研究し、兵器のように利用しようとする者がいるのです。",
"蘭は自分と同じように特別な力を持つ人々と出会い、何度も追われながら戦います。",
"そして「タロン」と呼ばれる大きな陰謀へ近づいていきます。",
"蘭は強い力を持っています。",
"でも本当に欲しいのは、戦うことではありません。",
"好きな人と笑い、普通の女の子として暮らしたいだけなのです。",
"「特別な力があることは、本当に幸せなのだろうか」。",
"超能力を持つ少女が、自分の人生を守るために戦い続けるSFサスペンスです。"
]},
{ cat:"m_sf", title:"超少女明日香", spine:"超少女|明日香", yomi:"ちょうしょうじょあすか", sub:"和田慎二", author:"和田慎二", authorYomi:"わだしんじ", icon:"🌿", text:[
"砂姫明日香という女の子がいました。",
"明日香は見た目は普通の少女ですが、自然の力を感じ取ることができます。",
"植物、大地、水。",
"自然そのものから力を借り、とても大きな能力を使うことができるのです。",
"明日香が戦う相手は、自然をこわし、人々を自分の思いどおりにしようとする者たちです。",
"その中でも大きな敵となるのが、「芙蓉夫人」という恐ろしい女性でした。",
"明日香は都会へ出たり、家政婦として働いたりしながら、正体を隠して生活します。",
"普段は少し不器用で、おとなしい少女。",
"でも誰かが自然や人を傷つけると、明日香は「超少女」として立ち上がります。",
"人間も自然の一部であり、自然を苦しめれば、いつか人間自身へ返ってくる。",
"そんな考えが流れている、不思議な少女ヒーローの物語です。"
]},
{ cat:"m_fantasy", title:"妖精国の騎士", yomi:"アルフヘイムのきし", sub:"中山星香", author:"中山星香", authorYomi:"なかやませいか", icon:"🧚", text:[
"ローゼリィという少女は、不思議な力を持って生まれました。",
"彼女が暮らす世界には、人間だけではなく、妖精や魔法使い、神々のような存在もいます。",
"しかしその世界へ、暗い力が広がり始めます。",
"国どうしが争い、魔法の力も戦争に使われます。",
"ローゼリィは、仲間たちといっしょに旅へ出ます。",
"旅の中で、王子や騎士、妖精たちと出会います。",
"「だれが味方で、だれが敵なの？」",
"最初はわからなかったことも、少しずつ明らかになります。",
"ローゼリィ自身にも、世界の運命を変えるほど大きな秘密がありました。",
"恋をし、仲間を失い、それでも前へ進みます。",
"小さな少女の旅から始まり、国と国、光と闇の戦いへ広がっていく、とても長く壮大なファンタジーです。"
]},
{ cat:"m_daily", title:"ここはグリーン・ウッド", spine:"ここは|グリーン・ウッド", sub:"那州雪絵", author:"那州雪絵", authorYomi:"なすゆきえ", icon:"🌲", text:[
"蓮川一也は、高校へ入るのを楽しみにしていました。",
"ところが病気で入学が一か月遅れてしまいます。",
"しかも、好きだった女性は自分のお兄さんと結婚してしまいました。",
"「もう家にはいたくない！」",
"一也は学校の寮へ入ります。",
"その寮の名前が「緑林寮」、通称グリーン・ウッドでした。",
"ところがそこには、変わった生徒ばかり住んでいます。",
"女の子のようにかわいい男の子、いつも楽しそうないたずら者、頼りになる先輩。",
"一也も毎日のように騒動へ巻きこまれます。",
"最初は「なんでこんなところに来たんだ」と思っていました。",
"でも、けんかしたり笑ったりするうち、寮のみんなが家族のような存在になっていきます。",
"恋をしたり、進路に悩んだりしながら、高校生活は過ぎていきます。",
"「帰る場所は、家だけじゃないんだ」と思わせてくれる青春物語です。"
]},
{ cat:"m_love", title:"なんて素敵にジャパネスク", spine:"なんて素敵に|ジャパネスク", yomi:"なんてすてきにジャパネスク", sub:"原作：氷室冴子　漫画：山内直実", author:"氷室冴子／山内直実", authorYomi:"ひむろさえこ", icon:"🎎", text:[
"平安時代の京都に、瑠璃姫という元気なお姫さまがいました。",
"普通のお姫さまなら、家で静かに暮らし、親の決めた相手と結婚します。",
"でも瑠璃姫は、",
"「そんなのいや。私は自分の好きな人と結婚する！」",
"と言います。",
"そんな瑠璃の幼なじみが、高彬です。",
"高彬はずっと瑠璃を大切に思っていました。",
"二人はようやく婚約しますが、そこから事件が次々と起こります。",
"宮中の陰謀、行方不明の人、帝をめぐる争い。",
"瑠璃はお姫さまなのに、じっと待ってはいません。",
"自分で走り回って事件を調べます。",
"そのせいで高彬はいつも心配します。",
"二人はけんかをしながらも、少しずつ本当の夫婦になっていきます。",
"昔の平安時代を舞台にした、恋と冒険のにぎやかな物語です。"
]},
{ cat:"m_love", title:"花咲ける青少年", yomi:"はなさけるせいしょうねん", sub:"樹なつみ", author:"樹なつみ", authorYomi:"いつきなつみ", icon:"🌷", text:[
"花鹿という少女は、大金持ちの父に育てられました。",
"ある日、父がとんでもないことを言います。",
"「お前の結婚相手を、私が三人選んでおいた。その中から、自分で夫を見つけなさい」。",
"こうして花鹿の「夫探しゲーム」が始まります。",
"花鹿の前には、ユージィン、ルマティ、カールなど、世界でも特別な立場にいる青年たちが現れます。",
"そして幼いころから花鹿を守ってきた立人もいます。",
"ところが、ただの恋愛ゲームだと思っていた話は、だんだん大きな政治の争いへ変わります。",
"花鹿自身にも、ラギネイ王国の王位につながる秘密があったのです。",
"王国では王をめぐる争いが起こり、ルマティも命をねらわれます。",
"花鹿たちはそれぞれの立場で戦います。",
"そして最後に花鹿が気づくのは、ずっと自分のそばにいた立人への気持ちでした。",
"立人も家の地位を捨て、花鹿と生きる道を選びます。"
]},
{ cat:"m_sf", title:"OZ", yomi:"オズ", sub:"樹なつみ", author:"樹なつみ", authorYomi:"いつきなつみ", icon:"🛰️", text:[
"未来の世界では、大きな戦争によって文明が壊れていました。",
"傭兵の武藤徉は、ある少女を守る仕事を頼まれます。",
"少女の名前はフィリシア。",
"とても頭のよい科学者です。",
"フィリシアは、「OZ」と呼ばれる場所を探していました。",
"OZには、昔の高度な科学技術がそのまま残っているというのです。",
"旅には、まるで人間のように話す機械の兵士も加わります。",
"荒れ果てた土地を進みながら、徉たちはOZの秘密へ近づきます。",
"そこは本当に夢の国なのでしょうか。",
"それとも、人間がまた同じまちがいをくり返すための場所なのでしょうか。",
"最後には、科学の力をだれが使うのかという問題に向き合います。",
"戦争で壊れた世界で、人間と機械が「心とは何だろう」と考えていくSF物語です。"
]},
{ cat:"m_horror", title:"八雲立つ", yomi:"やくもたつ", sub:"樹なつみ", author:"樹なつみ", authorYomi:"いつきなつみ", icon:"☁️", text:[
"七地健生という大学生が、島根県の山奥へ行きました。",
"そこで出会ったのが、布椎闇己という美しい少年です。",
"闇己の家には、古代から伝わる不思議な剣がありました。",
"その剣には、人間の強い感情や怨みを集める力があります。",
"そして日本各地には、同じような神剣が七本存在していました。",
"二人は散らばった神剣を集め、人々の心にたまった悪い「念」を静める旅へ出ます。",
"ところが闇己自身にも、とても大きな力があります。",
"その力を利用しようとする者も現れます。",
"七地は特別な能力を持っているわけではありません。",
"でも闇己が一人で暗い世界へ落ちそうになるたび、そばで支えます。",
"最後には神剣をめぐる大きな戦いが起こり、二人は命をかけて向き合います。",
"なお、その後の二人を描く続編『八雲立つ 灼』も続いています。"
]},
{ cat:"m_sf", title:"輝夜姫", yomi:"かぐやひめ", sub:"清水玲子", author:"清水玲子", authorYomi:"しみずれいこ", icon:"🌙", text:[
"晶という少女は、子どものころ「御陵島」という島で育ちました。",
"そこには晶と同じように、親のいない子どもたちが暮らしています。",
"ところが御陵島には、恐ろしい秘密がありました。",
"子どもたちはただ育てられていたのではありません。",
"将来、世界の特別な人たちのために体を使われる「ドナー」として育てられていたのです。",
"晶たちは島から逃げます。",
"でも大人になってからも、島の秘密は追いかけてきます。",
"仲間たちの体には、さらに不思議な秘密が隠されていました。",
"話はやがて、月、宇宙、人類の未来にまで広がります。",
"「自分の体は、だれのものなの？」",
"「人の命を、別の人のために勝手に使っていいの？」",
"最初は少女たちの脱出のお話だったものが、最後には人類そのものの運命をめぐるSFへ変わっていく大長編です。"
]},
{ cat:"m_sf", title:"月の子 MOON CHILD", spine:"月の子|MOON CHILD", yomi:"つきのこ ムーンチャイルド", sub:"清水玲子", author:"清水玲子", authorYomi:"しみずれいこ", icon:"🧜", text:[
"海の中には、人間に知られずに暮らしている人魚たちがいました。",
"人魚は、とても長い時間をかけて子孫を残します。",
"そしてあるとき、ベンジャミンという不思議な少年が人間の世界へ現れます。",
"ベンジャミンは純粋で、少し子どものような心を持っています。",
"でも、その体には人魚の一族にとって、とても大切な秘密がありました。",
"その秘密をめぐって、セツやティルトなど、さまざまな人魚たちが現れます。",
"人を愛する者。",
"人間を嫌う者。",
"自分の一族を残すためなら、何をしてもよいと考える者。",
"ベンジャミンは人間と人魚のあいだで揺れます。",
"やがて、人魚たちの子孫を残すための大きな運命が動き始めます。",
"「愛する人と生きること」と「種族を残すこと」は、同じではありません。",
"海と月を舞台にした、悲しく美しいSF恋愛物語です。"
]},
{ cat:"m_horror", title:"ゴーストハント", sub:"原作：小野不由美　漫画：いなだ詩穂", author:"小野不由美／いなだ詩穂", authorYomi:"おのふゆみ", icon:"🔦", text:[
"谷山麻衣は、ごく普通の高校生でした。",
"ある日、学校の古い校舎に幽霊が出るという話を聞きます。",
"そこで麻衣は、渋谷一也――みんなから「ナル」と呼ばれる少年と出会います。",
"ナルは「渋谷サイキック・リサーチ」という、幽霊や心霊現象を調べる会社の所長でした。",
"麻衣が調査用の機械を壊してしまったため、ナルの手伝いをすることになります。",
"そこから二人は、幽霊の出る家、呪われた学校、たくさんの人が消えた洋館など、こわい事件を次々と調べます。",
"坊さん、巫女、霊媒師、外国人の神父など、変わった仲間も集まります。",
"でも「幽霊だ！」と思ったら人間の思いこみだったり、反対に本当に恐ろしい霊だったりします。",
"最後の大きな事件では、廃校に閉じこめられ、仲間が次々と消えていきます。",
"麻衣は恐怖に負けず、仲間といっしょに最後まで謎を追うのです。"
]},
{ cat:"m_horror", title:"海の闇、月の影", spine:"海の闇、|月の影", yomi:"うみのやみつきのかげ", sub:"篠原千絵", author:"篠原千絵", authorYomi:"しのはらちえ", icon:"🌊", text:[
"流水と流風は、とても仲のよい双子の姉妹でした。",
"顔もそっくりで、いつもいっしょ。",
"二人とも同じ男性・克之を好きになりますが、それでも最初は大切な姉妹でした。",
"ところがある日、二人は古い墓の中で、不思議なウイルスに感染します。",
"それから二人には、普通の人にはない力が現れました。",
"空を飛んだり、人間を簡単に傷つけたりできるほどの力です。",
"流風はその力をこわがります。",
"でも流水は、",
"「これだけ強い力があれば、欲しいものを全部手に入れられる」",
"と考えるようになります。",
"同じ顔をした姉妹が、正反対の道へ進んでしまうのです。",
"克之をめぐる恋も加わり、二人はついに敵として戦うことになります。",
"大好きだった姉妹が、どうして殺し合わなければならなくなったのか。",
"愛と嫉妬が大きな悲劇へ変わっていく物語です。"
]},
{ cat:"m_horror", title:"闇のパープル・アイ", spine:"闇の|パープル・アイ", yomi:"やみのパープルアイ", sub:"篠原千絵", author:"篠原千絵", authorYomi:"しのはらちえ", icon:"🐆", text:[
"尾崎倫子は、普通の女子高校生でした。",
"ところがある日、倫子の体に不思議な変化が起こります。",
"目が紫色に光り、体が大きなヒョウへ変わってしまったのです。",
"倫子の家系には、昔から動物へ変身できる人間の血が流れていました。",
"その秘密を知った科学者・曽根原は、倫子を研究材料にしようと追いかけます。",
"倫子は恋人の慎也と逃げながら、自分の体の秘密を探します。",
"でも追っ手はどこまでもやってきます。",
"やがて倫子には娘が生まれ、その娘にも同じ力が受けつがれます。",
"物語は、母から娘へと移っていきます。",
"「普通に暮らしたい」と願う家族と、「特別な力を利用したい」と考える人々。",
"二つの思いが、世代をこえて戦い続けるサスペンス物語です。"
]},
{ cat:"m_horror", title:"陵子の心霊事件簿", spine:"陵子の|心霊事件簿", yomi:"りょうこのしんれいじけんぼ", sub:"篠原千絵", author:"篠原千絵", authorYomi:"しのはらちえ", icon:"🌳", text:[
"陵子という少女の家には、大きな木がありました。",
"その木には、不思議な力が宿っています。",
"ある出来事をきっかけに、陵子は幽霊や、人には見えないものが見えるようになります。",
"そして死んだ人の思いや、悪い霊たちが彼女のまわりへ集まり始めます。",
"陵子を守ってくれるのは、猫の姿をした不思議な存在や、彼女を心配する人々です。",
"でも霊の中には、ただ人を驚かせたいだけではなく、",
"「だれかに自分の気持ちをわかってほしい」",
"と思っている者もいます。",
"陵子はこわがりながらも、霊たちが残した思いを一つずつ知っていきます。",
"そして自分の家と木に隠された秘密にも近づいていきます。",
"こわい幽霊のお話でありながら、「死んだ人の思いをどう受け止めるか」を描いた物語です。"
]},
{ cat:"m_fantasy", title:"彼方から", yomi:"かなたから", sub:"ひかわきょうこ", author:"ひかわきょうこ", authorYomi:"ひかわきょうこ", icon:"🌠", text:[
"立木典子という普通の女子高校生がいました。",
"ある日、町で突然大きな爆発に巻きこまれます。",
"気がつくと、そこは日本ではありませんでした。",
"見たことのない森。",
"見たことのない動物。",
"そして、人々の言葉もまったくわかりません。",
"典子は、異世界へ飛ばされてしまったのです。",
"そこでイザークという強い青年に助けられます。",
"二人は最初、言葉さえ通じません。",
"それでもいっしょに旅をするうち、少しずつ心が通じるようになります。",
"ところが典子には、自分でも知らない役目がありました。",
"世界を大きく変える「目覚め」と呼ばれる存在だったのです。",
"そしてイザークにも、恐ろしい力が眠っています。",
"二人は世界を支配しようとする者たちから追われながら、「決められた運命どおりではなく、自分たちで未来を選ぶ」ために戦います。"
]},
{ cat:"m_fantasy", title:"ふしぎ遊戯", yomi:"ふしぎゆうぎ", sub:"渡瀬悠宇", author:"渡瀬悠宇", authorYomi:"わたせゆう", icon:"📕", text:[
"夕城美朱と本郷唯は、図書館で一冊の古い本を見つけました。",
"『四神天地書』という、不思議な中国のお話です。",
"本を開くと、二人はその中の世界へ吸いこまれてしまいます。",
"美朱はそこで、「朱雀の巫女」と呼ばれる存在になります。",
"朱雀という神さまを呼び出すため、七人の仲間「朱雀七星士」を探さなければなりません。",
"その一人、鬼宿と美朱は恋をします。",
"でも親友だった唯は、敵の国で「青龍の巫女」となってしまいます。",
"誤解や嫉妬によって、二人の親友は敵どうしになります。",
"仲間も戦いの中で次々と命を落とします。",
"それでも美朱は最後まで唯を見捨てません。",
"やがて二人は本当の気持ちを取り戻し、大きな戦いに決着をつけます。",
"そして美朱と鬼宿の恋も、世界の壁を越えて続いていくのです。"
]},
{ cat:"m_love", title:"花ざかりの君たちへ", spine:"花ざかりの|君たちへ", yomi:"はなざかりのきみたちへ", sub:"中条比紗也", author:"中条比紗也", authorYomi:"なかじょうひさや", icon:"🌼", text:[
"芦屋瑞稀は、アメリカで暮らしている女の子でした。",
"瑞稀が大好きなのは、日本の高校生・佐野泉がする走り高跳びです。",
"「佐野くんの近くで、もう一度跳んでもらいたい！」",
"そう思った瑞稀は、日本へやってきます。",
"でも佐野が通う学校は男子校でした。",
"そこで瑞稀は髪を短く切り、男の子のふりをして入学してしまいます。",
"しかも、なんと佐野と同じ部屋で暮らすことになります。",
"瑞稀は「女の子だとばれたら学校にいられない」と毎日ひやひやします。",
"クラスメイトの中津は、瑞稀を男の子だと思ったまま好きになり、",
"「俺は男が好きなのか!?」",
"と一人で大混乱します。",
"一方、佐野は早いころから瑞稀の秘密に気づきますが、何も言わずにそばにいます。",
"やがて瑞稀の正体が学校に知られ、別れのときがやってきます。",
"それでも佐野と瑞稀の気持ちは離れません。",
"男の子のふりから始まった学園生活が、本当の恋へ変わっていく、明るくにぎやかな青春物語です。"
]},
/* ---------- まんが（ついか ぶん２） ---------- */
{ cat:"m_fantasy", title:"学園アリス", yomi:"がくえんアリス", sub:"樋口橘", author:"樋口橘", authorYomi:"ひぐちたちばな", icon:"🎀", text:[
"佐倉蜜柑は、山の中の小さな学校に通う、明るく元気な女の子です。いちばんの親友・今井蛍が、ある日とつぜん東京の「アリス学園」へ転校してしまいました。さびしくてたまらない蜜柑は、ひとりで蛍を追いかけます。",
"ところがアリス学園は、ふつうの学校ではありません。「火を出す」「動物と話す」など、不思議な力を持つ子どもだけが集められた学校でした。そして蜜柑にも、ほかの人の能力を消してしまう「無効化のアリス」があることがわかります。こうして蜜柑も学園の生徒になり、蛍や乃木流架、そしていつもこわい顔をしている日向棗たちと暮らし始めました。",
"はじめは蜜柑につめたかった棗ですが、じつは学園から危険な仕事をさせられ、家族を守るために苦しんでいました。蜜柑はそんな棗を知り、少しずつ彼を好きになります。やがて蜜柑自身の両親もアリス学園と深い関係を持っていたことがわかり、学園の暗い秘密や、蜜柑の母・柚香をめぐる戦いへと物語は進んでいきます。",
"たくさんの別れと悲しみのあと、蜜柑は学園を離れ、そのころの大切な記憶まで失ってしまいます。それでも蛍や棗たちは蜜柑を忘れません。長い時間をかけて仲間たちはふたたび蜜柑のもとへ集まり、失われた思い出も少しずつつながっていきます。離ればなれになっても消えなかった友情と恋が、もう一度みんなを結びつけるところで物語は終わります。"
]},
{ cat:"m_love", title:"桜蘭高校ホスト部", spine:"桜蘭高校|ホスト部", yomi:"おうらんこうこうホストぶ", sub:"葉鳥ビスコ", author:"葉鳥ビスコ", authorYomi:"はとりびすこ", icon:"🌹", text:[
"藤岡ハルヒは、とても頭がよく、奨学金でお金持ちばかりが通う桜蘭高校へ入学しました。ある日、静かな場所で勉強しようと第三音楽室へ入ると、そこには女の子を楽しませる「ホスト部」の男の子たちがいました。",
"びっくりしたハルヒは、そこにあった高価な花びんを割ってしまいます。お金を返せないハルヒは、借金を返すためホスト部で働くことになりました。短い髪と服装のせいで男の子だと思われていましたが、ハルヒは女の子でした。部長の須王環をはじめ、鳳鏡夜、双子の光と馨、ハニー先輩、モリ先輩たちは、そんなハルヒを仲間として受け入れていきます。",
"はじめはにぎやかな仲間のひとりだった環ですが、いつしかハルヒを本気で好きになります。ハルヒもまた、明るくておせっかいで、だれより人を大切にする環にひかれていきました。一方、環には父や祖母、離れて暮らす母とのつらい事情があり、家の問題のためホスト部まで失いそうになります。",
"それでも仲間たちは環をひとりにしません。環は母とも向き合い、ハルヒと環はようやくおたがいの恋心を認めます。やがてハルヒはアメリカへ留学することになりますが、なんと環やホスト部の仲間たちまで海外へ集まってきます。大さわぎばかりだったホスト部は、最後までにぎやかなまま、新しい場所へ進んでいくのでした。"
]},
{ cat:"m_love", title:"会長はメイド様!", spine:"会長は|メイド様!", yomi:"かいちょうはメイドさま", sub:"藤原ヒロ", author:"藤原ヒロ", authorYomi:"ふじわらひろ", icon:"🎀", text:[
"鮎沢美咲は、男子ばかりだった星華高校で、はじめて女性の生徒会長になった女の子です。まじめで強く、だらしない男子にはいつも「しっかりしなさい！」としかっています。",
"けれども美咲には、学校のみんなにはぜったいに知られたくない秘密がありました。家があまり裕福ではないため、放課後にはメイド喫茶で働いていたのです。そんな姿を、学校一の人気者・碓氷拓海に見つかってしまいます。「学校で言わないで！」とあわてる美咲でしたが、碓氷は秘密を守ってくれました。",
"それから碓氷は、何かと美咲の前にあらわれます。困っていれば助け、危ないときには守ってくれる碓氷に、美咲も少しずつ心を開いていきます。けれど碓氷には、イギリスの名家につながる複雑な生い立ちがありました。家の事情から自由になれず、とうとう美咲から離れてイギリスへ行くことになります。",
"美咲は「待っているだけなんていやだ」と、自分から碓氷を追いかけます。ふたりは家柄や立場のちがいをこえて、おたがいを選びました。そして年月がたち、美咲は外交官に、碓氷は医者になります。ずっとけんかをしながらも大好きだったふたりは、最後には結婚し、笑顔で新しい人生を始めるのでした。"
]},
{ cat:"m_daily", title:"君と僕。", yomi:"きみとぼく", sub:"堀田きいち", author:"堀田きいち", authorYomi:"ほったきいち", icon:"🌸", text:[
"浅羽悠太と祐希は双子の兄弟。そこに、まじめで少し怒りっぽい塚原要と、やさしくて女の子のような顔をした松岡春が加わり、四人は小さいころからずっと一緒に育ってきました。",
"高校生になっても四人は相変わらずです。教室でくだらない話をしたり、昼休みに遊んだり、ときには恋のことで悩んだりします。そこへ、ドイツから帰ってきた元気いっぱいの橘千鶴も仲間になります。千鶴は小さくて気の強い佐藤茉咲を好きになりますが、茉咲の心は春へ向いていました。",
"この物語には、世界を救うような大事件はありません。そのかわり、「友だちが好きな人を自分も好きになってしまった」「卒業したら、もう毎日会えなくなる」「言いたいことがあるのに言えない」といった、小さくて大切な出来事がたくさん起こります。",
"やがて高校生活は終わりに近づきます。ずっと同じ場所にいた五人にも、それぞれ別の未来が待っています。それでも、いっしょに笑った時間や、何でもない毎日はなくなりません。大げさなさよならではなく、「また明日」と言うようなやさしさの中で、少年たちは少しずつ大人になっていきます。"
]},
{ cat:"m_love", title:"となりの怪物くん", yomi:"となりのかいぶつくん", sub:"ろびこ", author:"ろびこ", authorYomi:"ろびこ", icon:"👹", text:[
"水谷雫は、友だちや恋愛よりも勉強が大事な女の子です。「いい成績をとって、いい仕事につく」。それだけを考えて高校生活を送っていました。",
"ある日、先生にたのまれて、学校を休んでいる吉田春へプリントを届けます。春は入学早々けんかをして、それから学校へ来なくなった「問題児」でした。ところが春は、雫が会いに来てくれただけで大よろこび。「雫は友だちだ！」と勝手に決め、すぐに「好きだ」とまで言い出します。",
"人づきあいが苦手な雫と、人との距離のとり方がわからない春。ふたりは好きになったり、すれちがったり、また近づいたりをくり返します。夏目あさ子、佐々原宗平、山口賢二などの友だちもでき、春も雫も「だれかと一緒にいること」を少しずつ覚えていきます。",
"春には家族とのむずかしい問題もありましたが、雫たちと出会ったことで、自分の人生を自分で考えるようになります。ふたりは高校を卒業し、それぞれの道へ進みます。そしてその後も関係は続き、やがて結婚するところまで成長します。ひとりでいるほうが楽だった二人が、最後には「この人と一緒に生きたい」と思えるようになる物語です。"
]},
{ cat:"m_love", title:"たいようのいえ", sub:"タアモ", author:"タアモ", authorYomi:"たあも", icon:"🏠", text:[
"本宮真魚は、家にいても心が落ちつかない女の子です。両親が離婚し、父親は新しい家庭をつくりました。自分の居場所がなくなったように感じた真魚は、いつもひとりでさびしい思いをしていました。",
"そんな真魚を助けてくれたのが、幼なじみの中村基です。基の家は、昔は家族みんなで笑って暮らす、あたたかい家でした。けれど両親を亡くし、弟と妹も家を離れてしまい、今は基ひとりです。基は真魚に「うちへ来ればいい」と言い、ふたりの同居生活が始まります。",
"真魚は基と暮らしながら、家族とは何なのかを考えるようになります。基もまた、ばらばらになった弟や妹をもう一度家へ戻したいと願います。ふたりはけんかをしたり、すれちがったりしながら、少しずつ中村家をもう一度「家族の帰ってこられる場所」にしていきました。",
"真魚も、自分をさびしくさせた父親と少しずつ向き合っていきます。そして基への気持ちも、兄のような安心から恋へと変わっていきました。壊れてしまった家族を昔と同じ形に戻すのではなく、それぞれが新しい関係を作りなおしていく。最後には真魚も基も、自分の帰る場所を見つけます。"
]},
{ cat:"m_love", title:"高台家の人々", yomi:"こうだいけのひとびと", sub:"森本梢子", author:"森本梢子", authorYomi:"もりもとこずえ", icon:"💭", text:[
"平野木絵は、ごくふつうの会社員です。ただし木絵には、とても大きな特技がありました。それは、頭の中でとんでもなくおかしな空想をすることです。",
"ある日、会社に高台光正という、とてもかっこいい男性がやってきます。木絵は「こんな人と自分が話すことなんてない」と思っていました。ところが、なぜか光正は木絵に興味をもちます。じつは光正には、人の心を読む力があったのです。木絵のおかしな空想が全部聞こえてしまい、光正はそれがおもしろくてたまりません。",
"しかも心を読めるのは光正だけではありません。妹の茂子と弟の和正にも同じ力がありました。そのため高台家の人々は、口ではやさしいことを言いながら心では悪口を言う人も、すぐにわかってしまいます。そんな中で、表も裏もあまり変わらず、空想ばかりしている木絵は、光正にとってとても安心できる人でした。",
"名家である高台家との身分のちがいや、光正の母からの反対もあります。それでも光正は木絵を選びます。木絵も「自分なんか」と逃げるのをやめました。ふたりはとうとう結婚し、高台家の兄弟たちの恋もそれぞれ動き出します。人の心が読めても読めなくても、いちばん大切なのは信じることだと教えてくれる物語です。"
]},
{ cat:"m_love", title:"アシガール", sub:"森本梢子", author:"森本梢子", authorYomi:"もりもとこずえ", icon:"🏃‍♀️", text:[
"速川唯は、勉強もおしゃれもあまり得意ではない女子高校生です。でも、走ることだけはものすごく速い女の子でした。",
"ある日、天才の弟・尊が作った機械をさわってしまい、唯は戦国時代へ飛ばされます。そこで唯は、羽木家の若君・羽木九八郎忠清と出会いました。かっこよくてやさしい若君に、唯はひと目で恋をします。ところが現代へ戻って歴史を調べると、若君は戦で死ぬ運命だとわかりました。",
"「だったら私が守る！」。唯は男の子のふりをして足軽になり、何度も戦場を走り回ります。現代と戦国時代を行ったり来たりしながら、若君を救うためなら何でもする唯。そのまっすぐさに、若君もだんだん唯を大切に思うようになります。",
"敵との戦いや政略結婚、タイムマシンが使えなくなる危機など、ふたりには何度も別れがやってきます。それでも唯はあきらめません。とうとう唯は若君の正式な相手として認められ、婚礼を迎えます。",
"安全な現代へ帰ることもできる唯でしたが、最後に選んだのは、大好きな若君のいる戦国時代でした。走ることしか取りえがないと思っていた女の子が、その足で自分の運命そのものを変えてしまう物語です。"
]},
{ cat:"m_daily", title:"プリンセスメゾン", sub:"池辺葵", author:"池辺葵", authorYomi:"いけべあおい", icon:"🏘️", text:[
"沼越幸は、東京で働く二十代の女性です。年収はそれほど高くなく、結婚の予定もありません。それでも沼ちゃんには、大きな夢がありました。「いつか、自分ひとりの力で、自分の家を買いたい」。",
"休日になると、沼ちゃんはマンションのモデルルームを見て回ります。広い部屋、駅から近い部屋、日当たりのよい部屋。でも家はとても高い買い物です。不動産会社の人たちは、毎週のようにやってくる沼ちゃんを少し変わったお客さんだと思いながらも、だんだん本気で応援するようになります。",
"沼ちゃんは節約し、お金をため、ローンについて調べ、「本当にここで暮らしたいのか」を何度も考えます。そしてついに、自分のマンションを買います。けれど家を買えば、人生がそこで終わるわけではありません。ローンを払い、家具をそろえ、仕事をして、毎日のご飯を食べる生活が続いていきます。",
"この漫画は「すてきな王子さまと結婚して、お城に住みました」というお話ではありません。自分のお金で、自分のための小さなお城を手に入れる女性のお話です。沼ちゃんは、自分の人生を自分で選び、自分の家で静かに暮らしていくのでした。"
]},
{ cat:"m_art", title:"かくかくしかじか", sub:"東村アキコ", author:"東村アキコ", authorYomi:"ひがしむらあきこ", icon:"🖌️", text:[
"高校生の林明子は、絵が得意な女の子でした。「私は絵がうまい。きっと漫画家にもなれる」と、かなり自信を持っていました。",
"ところが、美術大学へ入るために通い始めた絵画教室で、日高健三先生に出会います。日高先生は竹刀を持ち、「描け！」「手を動かせ！」と、とにかくきびしく教える先生でした。明子が少しくらい上手でも、まったくほめてくれません。",
"明子は先生にしかられながら美術大学へ入り、やがて漫画家になる夢を追いかけます。しかし大学生活や友だち、恋や仕事に夢中になるうちに、先生のところへ行く回数は少なくなっていきました。それでも日高先生は、ずっと明子が絵を描くことを応援していました。",
"やがて明子は、本当に漫画家・東村アキコになります。そのころ、先生は重い病気になっていました。明子は「いつでも会える」と思い、十分に会いに行かないまま、先生を亡くしてしまいます。",
"大人になった明子は、先生に言えなかった「ありがとう」と「ごめんなさい」を、この漫画に描きます。「先生、私はちゃんと描いています」。笑える思い出をたくさん語りながら、最後には大切な人を思う気持ちが静かに残る、自伝のお話です。"
]},
{ cat:"m_daily", title:"ママはテンパリスト", yomi:"ママはテンパリスト", sub:"東村アキコ", author:"東村アキコ", authorYomi:"ひがしむらあきこ", icon:"👶", text:[
"漫画家の東村アキコは、男の子を出産しました。名前は悟空、みんなからは「ごっちゃん」と呼ばれています。",
"赤ちゃんが生まれる前、アキコ先生は「子育てって、まあ何とかなるだろう」と思っていました。ところが実際には、夜は眠れない、おっぱいをあげなければならない、おむつは何度も替える、泣いている理由はわからない。「こんなに大変だったの!?」と毎日大あわてです。",
"そしてごっちゃんが大きくなると、今度は思いもよらないことを言ったり、変な遊びを始めたり、大人がびっくりするような行動をするようになります。アキコ先生は、ときには本気で怒り、ときには子ども相手に作戦を立て、ときにはあまりのおもしろさに笑ってしまいます。",
"この漫画には、大きな悪者も、感動的な最終決戦もありません。赤ちゃんだったごっちゃんが少しずつ言葉を覚え、自分で考え、元気な子どもになっていく。それを母親が「大変だ、大変だ」と言いながら見守っていくお話です。",
"最後まで子育ては思いどおりになりません。それでも、ごっちゃんはちゃんと育っていきます。"
]},
{ cat:"m_love", title:"きょうは会社休みます。", spine:"きょうは|会社休みます。", yomi:"きょうはかいしゃやすみます", sub:"藤村真理", author:"藤村真理", authorYomi:"ふじむらまり", icon:"🏢", text:[
"青石花笑は、三十三歳の会社員です。まじめに働いてきましたが、これまで一度も男の人と付き合ったことがありませんでした。",
"三十三歳の誕生日、花笑は会社のアルバイトで二十一歳の大学生・田之倉悠斗とお酒を飲みます。そして次の朝、目を覚ますと、となりには田之倉がいました。びっくりする花笑に、田之倉はごく自然に「付き合いませんか」と言います。",
"十歳以上も年下の田之倉と付き合い始めた花笑は、何もかもが初めてです。デートをするだけでも緊張し、メールの返事ひとつで悩みます。そこへ、大人で仕事もできる朝尾侑も花笑に興味を持ち、恋はますますややこしくなっていきました。",
"田之倉にも大学卒業や将来の夢があります。花笑は「自分のために彼の人生を変えさせていいのだろうか」と悩みます。何度もすれちがいますが、ふたりは年齢ではなく、「この人と一緒にいたい」という気持ちを選びます。",
"ずっと恋を知らなかった花笑は、恋をしたことで少しずつ自分の気持ちを言えるようになります。そして最後には田之倉と結婚し、「ひとりで何でもできる人生」から「大切な人と相談しながら歩く人生」へ進んでいきます。"
]},
{ cat:"m_food", title:"かしましめし", sub:"おかざき真里", author:"おかざき真里", authorYomi:"おかざきまり", icon:"🍲", text:[
"千春、ナカムラ、英治は、美術大学時代の同級生です。三人はもう若い学生ではなく、それぞれ仕事や恋、人間関係に悩む大人になっていました。",
"そんな三人をもう一度つないだのは、同級生の死でした。「人って、いついなくなるかわからないんだ」。心にぽっかり穴があいた三人は、千春の家に集まり、ご飯を作って食べるようになります。そしていつしか、一緒に暮らすようになりました。",
"仕事がいやになった日も、恋人とうまくいかない日も、自分が何をしたいのかわからない日もあります。そんなとき三人は、大きな鍋を囲んだり、揚げ物をしたり、おいしいものを作ります。「いただきます」と言って一緒に食べているあいだだけは、少しだけ心がやわらかくなるのです。",
"三人には、それぞれ別の恋や悩みがあります。だれかが結婚すれば幸せ、仕事で成功すれば幸せ、という簡単な答えはありません。",
"それでも、「今日はつらかったね。それなら何か食べよう」と言ってくれる人がいる。『かしましめし』は、そんな食卓を中心に、大人たちが少しずつ自分の人生を立て直していく物語です。"
]},
{ cat:"m_drama", title:"たそがれたかこ", sub:"入江喜和", author:"入江喜和", authorYomi:"いりえきわ", icon:"🎧", text:[
"片岡たかこは四十五歳。離婚を経験し、年をとった母親と二人で暮らしています。仕事へ行き、家へ帰り、ご飯を食べて眠る。毎日は静かに過ぎていきます。",
"たかこは人と話すのがあまり得意ではありません。別れた夫とのあいだには娘がいますが、娘との関係もうまくいかず、「私はこのまま年をとっていくのかな」と思っていました。",
"そんなたかこの心を動かしたのが、音楽でした。若いロックバンドの歌に出会い、「こんなに好きになれるものが、まだ自分の中にあったんだ」と気づきます。ライブへ行ったり、人と知り合ったりするうちに、止まっていたようなたかこの毎日が少しずつ動き始めます。",

"それでもたかこは、「四十五歳だからもう遅い」と考えるのをやめていきます。好きな音楽を聴き、人に会い、自分の気持ちを話す。小さな一歩を重ねながら、自分の人生をもう一度生き直していく物語です。"

{ cat:"m_love", title:"おひとり様物語", yomi:"おひとりさまものがたり", sub:"谷川史子", author:"谷川史子", authorYomi:"たにかわふみこ", icon:"☕", text:[

"恋人がいなくても毎日を楽しんでいる書店員さん。初めての彼氏にふられて、どうしたらいいかわからなくなった大学生。恋人と一緒に暮らしているのに、生活する時間がちがって、ほとんど顔を合わせられない女性。いろいろな「ひとり」が登場します。",
"ある人は恋を始め、ある人は恋を終わらせます。結婚していても心の中ではひとりぼっちの人もいれば、一人暮らしでも家族や友だちに大切にされている人もいます。",
"「ひとりでいること」と「さびしいこと」は、同じではありません。また、恋人ができれば何もかも幸せになるわけでもありません。",
"十巻にわたって、たくさんの人の人生が描かれます。そして最後まで、「こう生きるのが正解です」という答えは出しません。今ひとりの人も、昔ひとりだった人も、自分の人生をちゃんと歩いている。そんな人たちを、そっと応援するように物語は終わります。"

{ cat:"m_work", title:"サプリ", sub:"おかざき真里", author:"おかざき真里", authorYomi:"おかざきまり", icon:"💼", text:[
"藤井ミナミは、広告会社で働く二十代の女性です。毎日遅くまで働き、仕事のことならいくらでも考えられます。でも、自分の恋や人生のことになると、急にわからなくなってしまいます。",

"広告の仕事は華やかに見えますが、その裏では夜遅くまで案を考え、失敗すればやり直し、競争もしなければなりません。ミナミは「女として幸せになること」と「仕事を続けること」のあいだで何度も悩みます。",

{ cat:"m_love", title:"& -アンド-", yomi:"アンド", sub:"おかざき真里", author:"おかざき真里", authorYomi:"おかざきまり", icon:"💅", text:[
"青木薫は、昼は病院で働き、夜にはネイルサロンを開いている女性です。人の手にふれ、爪をきれいにする仕事が好きですが、自分自身は人に心や体を近づけられることが少し苦手でした。",
"そんな薫の前に、病院の医師・矢飼が現れます。矢飼は頭がよく、大人で、どこかさびしそうな男性です。薫は彼にひかれていきますが、矢飼もまた人との関係に傷を抱えていました。",
"ふたりは近づいたり離れたりします。「好きなら一緒にいればいい」というほど、大人の恋は簡単ではありません。仕事、年齢、過去の傷、ほかの人への気持ち。いくつものものが二人のあいだに入ってきます。",

"タイトルの「&」は、「仕事と恋」「自分とだれか」のように、どちらか一つではなく、いくつものものを抱えて生きていくこと。薫は迷いながらも、自分の人生を自分で選んでいくのでした。"

{ cat:"m_art", title:"坂道のアポロン", yomi:"さかみちのアポロン", sub:"小玉ユキ", author:"小玉ユキ", authorYomi:"こだまゆき", icon:"🎹", text:[
"西見薫は、高校一年生の夏、九州の町へ引っ越してきました。父親の仕事のため何度も転校してきた薫は、人と仲良くなることをあきらめ、いつも一人でいました。",
"そんな薫が出会ったのが、けんかっ早くて「不良」と呼ばれている川渕千太郎です。千太郎はドラムをたたき、ジャズが大好きでした。クラシックピアノを習っていた薫も、千太郎と一緒にジャズを演奏するようになります。",
"薫は千太郎の幼なじみ・律子を好きになります。けれど律子の心は千太郎へ向いていました。さらに千太郎にも好きな人ができ、友情と恋はどんどんすれちがっていきます。それでも地下室で楽器を鳴らしているときだけ、薫と千太郎は言葉がなくてもわかり合えました。",
"ところが高校生活の終わり近く、大きな出来事をきっかけに千太郎は姿を消します。薫も町を離れ、長い年月が流れました。",
"大人になった薫は医者になります。そしてある日、遠い島で神父になっていた千太郎を見つけます。二人は何年ぶりかで楽器の前に座り、昔のようにジャズを演奏します。離れていた時間を、音楽が一気につないでくれたのでした。"
]},
{ cat:"m_love", title:"娚の一生", yomi:"おとこのいっしょう", sub:"西炯子", author:"西炯子", authorYomi:"にしけいこ", icon:"🏡", text:[
"堂薗つぐみは、都会で働いてきた三十代の女性です。祖母の家で静かに暮らそうと田舎へ戻りますが、その祖母が亡くなってしまいます。",
"葬儀が終わり、ひとりになったはずの家へ帰ると、見知らぬ男性がいました。海江田醇、五十代の大学教授です。なぜか祖母の家の鍵まで持っています。",
"「どうしてあなたがここにいるんですか」と困るつぐみ。ところが海江田はなかなか出ていきません。年も性格もまったくちがう二人は、同じ家で奇妙な生活を始めることになります。",
"つぐみは過去の恋で傷つき、「もうだれかを本気で好きになるのはいやだ」と思っていました。海江田はそんなつぐみに、強引ながらもまっすぐ気持ちを伝えます。",
"最初は海江田を遠ざけていたつぐみですが、一緒に暮らし、日々を重ねるうちに、自分も彼を大切に思っていることに気づきます。大きな災害や別れの不安も経験し、二人は「今、一緒に生きられる時間」を大事にするようになります。",
"そして最後には夫婦となり、年齢の差をこえて、自分たちなりの家族を作っていくのでした。"
]},
{ cat:"m_love", title:"姉の結婚", yomi:"あねのけっこん", sub:"西炯子", author:"西炯子", authorYomi:"にしけいこ", icon:"📚", text:[
"岩谷ヨリは、四十歳を前にして故郷へ戻り、図書館で働き始めた女性です。若いころのような恋はもうしなくていい。ひとりで静かに暮らせれば、それでいいと思っていました。",
"ところがそこへ、中学生時代の同級生・真木誠が現れます。真木は医者になっていました。そして昔からヨリのことを忘れられず、何度もしつこいほど気持ちを伝えてきます。",
"しかし真木には妻がいました。ヨリは「そんな関係にはなりたくない」と思いながらも、真木にひかれていきます。大人になれば恋は簡単になると思っていたのに、むしろ若いころより事情は複雑です。",
"ヨリは真木だけでなく、家族や仕事、自分が年をとっていくこととも向き合います。「結婚すれば幸せ」「ひとりなら不幸」という答えはありません。",
"何度も離れようとしながら、ヨリは最後には、自分が本当は何を望んでいるのかを認めます。だれかに選ばれるのを待つのではなく、自分で相手と人生を選ぶ。題名の「姉の結婚」は、そんな大人の女性がもう一度人を愛するまでのお話です。"
]},
{ cat:"m_work", title:"繕い裁つ人", yomi:"つくろいたつひと", sub:"池辺葵", author:"池辺葵", authorYomi:"いけべあおい", icon:"🧵", text:[
"南市江は、祖母から受けついだ小さな洋裁店をひとりで守っています。市江の仕事は、新しい服をたくさん作って売ることではありません。",
"昔、祖母が作った服を直したり、破れた服を繕ったり、その人の体に合うように仕立て直したりします。何十年も着ている服には、その人の思い出がつまっています。市江は、そんな服を大切にしていました。",
"ある日、百貨店で働く藤井という男性がやってきます。「あなたの服をブランドにして、もっとたくさんの人に売りませんか」と言います。しかし市江は断ります。一着ずつ、その人のために作ることが大事だと思っていたからです。",
"それでも藤井と出会ったことで、市江は「祖母のやり方を守るだけでいいのだろうか」と考えるようになります。",
"昔のものを大切にすることと、新しいものを作ること。その二つは、ほんとうは敵ではありません。市江は少しずつ、自分自身の服も作り始めます。祖母の仕事をただまねるのではなく、自分の手で次の時代へつないでいく仕立て屋になっていく物語です。"
]},
{ cat:"m_drama", title:"先生の白い嘘", yomi:"せんせいのしろいうそ", sub:"鳥飼茜", author:"鳥飼茜", authorYomi:"とりかいあかね", icon:"🤍", text:[
"原美鈴は、高校で国語を教えている先生です。学校では落ちついた大人に見えますが、心の中にはだれにも言えない大きな傷がありました。",
"美鈴は以前、親しい友だちの恋人・早藤から、いやがっているのに無理やり傷つけられたことがありました。しかし「こんなことを話したら、自分まで悪く思われるのではないか」と考え、ずっとだれにも言えずにいました。",
"そのため美鈴は、「男だから」「女だから」と決めつけられることや、人が人を力で支配することについて、いつも苦しんでいました。そんな美鈴の前に、彼女へまっすぐな気持ちを向ける男子生徒・新妻が現れます。",
"けれど新妻も、美鈴をただ救ってくれる王子さまではありません。彼自身も未熟で、人を傷つけてしまうことがあります。美鈴は、だれか一人に助けてもらうのではなく、自分で自分の傷と向き合わなければならなくなります。",
"最後には、美鈴は長いあいだ隠してきたことから目をそらさず、「自分がいやだったことは、いやだった」と認めます。重く苦しい物語ですが、「傷つけられた人が、もう一度自分の人生を自分のものにしていく」までを描いた作品です。"
]},
{ cat:"m_drama", title:"私の少年", yomi:"わたしのしょうねん", sub:"高野ひと深", author:"高野ひと深", authorYomi:"たかのひとみ", icon:"⚽", text:[

"ある夜、公園でサッカーボールをけっている、とてもきれいな少年と出会います。少年の名前は早見真修。まだ十二歳でした。サッカーがうまくなりたい真修に、聡子は練習を教えるようになります。",
"真修の家では父親が忙しく、真修はどこかさびしそうでした。聡子もまた、自分を必要としてくれる真修と会う時間に救われます。年齢は大きく離れていますが、ふたりにとって相手は大切な存在になっていきました。",
"しかし周囲の大人から見ると、三十歳の女性と十二歳の少年がいつも一緒にいることは、簡単に理解できるものではありません。聡子は真修を守るためにも距離を置き、二人は離ればなれになります。",

"二人の関係を「親子」「姉弟」「恋人」と一つの言葉だけで決めることはできません。それでも、たしかにおたがいの人生を変えた大切な人なのだと認め、前へ進んでいく物語です。"

{ cat:"m_love", title:"失恋ショコラティエ", yomi:"しつれんショコラティエ", sub:"水城せとな", author:"水城せとな", authorYomi:"みずしろせとな", icon:"🍫", text:[

{ cat:"m_love", title:"きみはペット", yomi:"きみはペット", sub:"小川彌生", author:"小川彌生", authorYomi:"おがわやよい", icon:"🐶", text:[

{ cat:"m_food", title:"おいピータン!!", sub:"伊藤理佐", author:"伊藤理佐", authorYomi:"いとうりさ", icon:"🥚", text:[

{ cat:"m_drama", title:"ゆりあ先生の赤い糸", spine:"ゆりあ先生の|赤い糸", yomi:"ゆりあせんせいのあかいいと", sub:"入江喜和", author:"入江喜和", authorYomi:"いりえきわ", icon:"🧶", text:[

{ cat:"m_drama", title:"傘寿まり子", yomi:"さんじゅまりこ", sub:"おざわゆき", author:"おざわゆき", authorYomi:"おざわゆき", icon:"👵", text:[

{ cat:"m_love", title:"花野井くんと恋の病", spine:"花野井くんと|恋の病", yomi:"はなのいくんとこいのやまい", sub:"森野萌", author:"森野萌", authorYomi:"もりのめぐみ", icon:"☂️", text:[
"日生ほたるは、食べることや家族、友だちは大好きですが、「恋をする気持ち」がよくわからない高校生です。",
"ある雪の日、ほたるは公園でひとり座っている花野井くんを見つけ、そっと傘を貸してあげます。すると次の日、花野井くんは学校のみんなの前で、ほたるに「付き合ってください」と告白しました。",
"花野井くんは、とても一途です。ただし一途すぎて、ほたるのためなら自分のことを何でも後回しにしてしまいます。ほたるは「好きって、相手のために全部することなのかな」と考えながら、まずはお試しで付き合い始めます。",
"一緒に過ごすうち、ほたるも少しずつ「この人と一緒にいたい」という気持ちを知っていきます。一方の花野井くんも、愛することは相手を独り占めすることではなく、相手の気持ちや人生を大切にすることだと学びます。",
"ふたりは一度離れることもありますが、ほたるは自分から花野井くんを追いかけ、もう一度気持ちを伝えます。",
"そして時は流れ、二十五歳になったふたりは結婚しています。",
"恋を知らなかったほたると、恋を重く抱えすぎていた花野井くん。ふたりがちょうどよい愛し方を一緒に覚えていく物語です。"
]},
{ cat:"m_daily", title:"スキップとローファー", sub:"高松美咲", author:"高松美咲", authorYomi:"たかまつみさき", icon:"🏫", text:[
"岩倉美津未は、石川県の小さな町で育った女の子です。将来は東京大学へ行き、国の役人になって故郷をよくする、という大きな夢を持っています。",
"高校進学のため東京へ出てきた美津未は、勉強には自信がありました。でも都会の電車や、人の多い学校、同じ年の子とのつきあいには慣れていません。入学式の日から道に迷ってしまい、そこで志摩聡介という男の子に助けてもらいます。",
"美津未は少し変わっていて、失敗しても一生懸命です。そんなまっすぐさに、志摩、結月、誠、ミカたちも少しずつ心を開いていきます。",
"いつも笑っている志摩にも、子役をしていたころのつらい思い出がありました。美津未は、志摩の明るい顔の奥にあるさびしさにも気づいていきます。二人は一度付き合いますが、まだ自分の気持ちがよくわからない志摩と話し合い、友だちへ戻ります。",
"それでも一緒に過ごす時間は続きます。そして現在、志摩のほうが美津未への思いをどんどん強くしています。",
"物語はまだ連載中です。恋だけでなく、友だち同士が少しずつ大人になっていく毎日そのものを描いたお話です。"
]},
{ cat:"m_fantasy", title:"星降る王国のニナ", spine:"星降る王国の|ニナ", yomi:"ほしふるおうこくのニナ", sub:"リカチ", author:"リカチ", authorYomi:"りかち", icon:"⭐", text:[
"ニナは、町で貧しく暮らしていた青い目の少女です。ある日、亡くなった王女と同じ色の目をしていたことから、王子アズールに連れていかれます。",
"じつは国では、他国へ嫁ぐはずだった王女が亡くなっていました。そこでニナは、王女になりすまし、遠いガルガダ王国の王子セトと結婚する役目を与えられます。",
"最初は「逃げたい」と思っていたニナですが、自分を教育してくれるアズールをだんだん好きになります。それでも国を守るため、ニナはセトのもとへ向かいました。",
"セトは冷たく、人を信じない王子でした。しかしニナはこわがらず何度もぶつかっていきます。するとセトも少しずつニナを信じ、彼女を愛するようになります。",
"こうしてニナの心には、アズールとセトという二人の大切な人が生まれます。",
"さらに物語が進むと、ニナの青い瞳や「星の民」に大きな秘密があることがわかります。人間だけではなく、神々の力まで国々の争いにかかわってきます。",
"現在は、獣の神に体を奪われかけたアズールをニナが救い、アズールとセトの二人が、それぞれのやり方でニナを過酷な運命から自由にしようとしています。物語はまだ続いています。"
]},
{ cat:"m_love", title:"恋せよまやかし天使ども", spine:"恋せよ|まやかし天使ども", yomi:"こいせよまやかしてんしども", sub:"卯月ココ", author:"卯月ココ", authorYomi:"うづきここ", icon:"👼", text:[
"桂おとぎは、学校中から「天使」と呼ばれるほど、きれいでやさしくて完璧な女の子です。",
"でも本当のおとぎは、もっと口が悪く、負けずぎらい。「みんなが望む完璧な女の子」を、小さいころからずっと演じてきたのでした。",
"そんなおとぎが気になっていたのが、同じクラスの一刻です。一もまた、顔がよく、頭もよく、やさしい完璧男子です。",
"ところがある日、おとぎは一に自分の「裏の顔」を見られてしまいます。「終わった……」と思ったおとぎでしたが、なんと一にも秘密がありました。彼もまた、学校で見せるおだやかな顔とはちがう、少し荒っぽい一面を隠していたのです。",
"「おたがいの秘密は守ろう」。こうして二人だけの秘密の関係が始まります。おとぎは一を好きになりますが、一度はふられてしまいます。それでもあきらめません。",
"一もやがて、自分がおとぎを好きなのだと気づきます。すれちがいながらも、夏の旅行をきっかけに二人はとうとう恋人になります。",
"現在は、完璧なふりをしてきた二人が、恋人の前では少しずつ本当の自分を見せるようになるところまで進んでいます。物語はまだ連載中です。"
]},
{ cat:"m_drama", title:"あの子の子ども", yomi:"あのこのこども", sub:"蒼井まもる", author:"蒼井まもる", authorYomi:"あおいまもる", icon:"🍼", text:[
"高校生の福と宝は、幼なじみで恋人同士です。学校へ行き、友だちと笑い、進路を考える、ごく普通の高校生活を送っていました。",
"ところがある日、福は自分の体に変化を感じます。調べてみると、妊娠していることがわかりました。",
"福も宝も、まだ高校生です。「子どもを産むのか」「産まないのか」「学校はどうするのか」「親になんて話せばいいのか」。考えなければならないことが、一度に押し寄せてきます。",
"宝は福を大切に思い、「一緒に考える」と言います。しかし、妊娠して体が変わっていくのは福です。二人が同じ気持ちでも、同じ立場ではないことを福は知っていきます。",
"家族に話すと、当然大きな驚きや反対もあります。学校生活や進路も変わってしまいます。それでも福は、周りに決めてもらうのではなく、自分で考え、自分で選ぼうとします。",
"そして福と宝は、現実の大変さから逃げず、子どもを迎える道へ進みます。",
"「好きだから大丈夫」というだけでは子どもは育てられません。それでも、若い二人が家族や周囲とぶつかりながら、命と自分の未来について考えていく物語です。"
]},
{ cat:"m_love", title:"きみの横顔を見ていた", spine:"きみの横顔を|見ていた", yomi:"きみのよこがおをみていた", sub:"いちのへ瑠美", author:"いちのへ瑠美", authorYomi:"いちのへるみ", icon:"👀", text:[
"この物語には、高校生の男女が何人も登場します。そして、みんながだれかを好きなのに、その気持ちはなかなか好きな人へ届きません。",
"最初の主人公・光は、自分を「どこにでもいる平凡な女の子」だと思っています。美人の親友・麻里にはすてきな恋をしてほしいと考え、クラスの大谷や朝霧を「麻里に合いそう」と勝手に想像しています。",
"ところが大谷が好きなのは、光が思っていた相手とはちがいます。さらに、朝霧にもだれにも言えない思いがあります。",
"物語は一人だけの目から進むのではなく、主人公が変わっていきます。「あの子はこんなことを考えていたんだ」と、さっきまで脇役に見えていた人の心が見えてきます。",
"好きな人にふられる人もいます。気持ちを伝えられない人もいます。それでも、恋がかなわなかったからといって、その時間がむだになるわけではありません。",
"それぞれが自分の気持ちを知り、相手の気持ちも知り、少しずつ前へ進みます。本編は完結し、最終巻では周囲の人物たちの物語も描かれました。",
"みんなの片思いが、みんなを少しだけ大人にしていく青春のお話です。"
]},
{ cat:"m_love", title:"PとJK", yomi:"ピーとジェイケー", sub:"三次マキ", author:"三次マキ", authorYomi:"みつぎまき", icon:"👮", text:[
"本谷歌子、通称カコは十六歳の女子高校生です。",
"ある日、友だちに誘われて年齢をごまかし、大人の集まりへ行きます。そこで佐賀野功太という青年と出会い、おたがいにひかれます。",
"ところが功太は警察官でした。そしてカコが本当は高校生だと知ると、「未成年とは付き合えない」と離れようとします。",
"それでも二人は好き同士です。そこで功太が出した答えは、なんと「付き合うのではなく、結婚する」というものでした。",
"こうして「Police＝P」と「女子高校生＝JK」の夫婦生活が始まります。",
"とはいっても、カコはまだ高校生。毎日一緒に暮らすわけではなく、学校へ通いながら少しずつ夫婦になっていきます。功太にも、過去の事件で心に残った傷がありました。",
"友だちの大神や家族、警察官の仲間たちとの出来事を通して、カコも功太も成長していきます。",
"最初は勢いで始まったような結婚でしたが、何度も危機を乗りこえ、二人は本当の意味で家族になっていきます。高校生だったカコも卒業し、二人の結婚生活は「秘密の特別なもの」から、ふつうの日常へ変わっていくのでした。"
]},
{ cat:"m_love", title:"わたしに××しなさい!", spine:"わたしに|××しなさい!", yomi:"わたしにばつばつしなさい", sub:"遠山えま", author:"遠山えま", authorYomi:"とおやまえま", icon:"📱", text:[
"氷室雪菜は、するどい目つきのせいで、学校のみんなから「雪女」とこわがられています。",
"でも雪菜には秘密がありました。じつは雪菜は、若い女の子たちに大人気の携帯小説を書いている作家だったのです。",
"ところが雪菜には困ったことがありました。恋をした経験がないため、読者から「恋愛の場面がぜんぜんドキドキしない」と言われてしまったのです。",
"そこで雪菜は、学校で人気者の北見時雨の秘密をつかみ、「私に恋愛を教えなさい」と命令します。",
"最初は小説を書くための「実験」でした。手をつないだり、近くで見つめたりしながら、「これがドキドキというものなのか」と雪菜は調べます。",
"ところが、実験を続けるうちに、本当に時雨を好きになってしまいます。時雨のほうも雪菜を気にするようになります。",
"さらに雪菜の幼なじみ・晶や、時雨の身近な人たちも恋にかかわり、関係はどんどん複雑になります。",
"最後には雪菜は、人の恋を小説の材料として外から見るだけではなく、自分自身が恋をする人になります。命令から始まった二人の関係は、本当の恋へと変わっていくのでした。"
]},
{ cat:"m_fantasy", title:"シュガシュガルーン", sub:"安野モヨコ", author:"安野モヨコ", authorYomi:"あんのもよこ", icon:"🍬", text:[
"ショコラとバニラは、魔界に住む二人の小さな魔女です。二人は大の親友ですが、同時に、次の魔界の女王を決めるライバルでもありました。",
"女王になるための試験は、人間界へ行き、人の「ハート」を集めることです。二人は人間の学校へ通いながら、男の子たちの恋する気持ちを集めることになりました。",
"明るく元気なショコラは、魔界では人気者でした。ところが人間界では、おとなしくてかわいいバニラのほうが人気です。ショコラはあせります。",
"そんなとき、学校でいちばん人気の美少年・ピエールと出会います。ショコラは、ハートを取るどころか、自分のほうがピエールを好きになってしまいます。",
"やがてバニラは心のさびしさにつけこまれ、闇の勢力「オグル」の側へ行ってしまいます。ショコラは女王の座を争う相手であるはずのバニラを、命がけで助けます。",
"そしてショコラには、黒い心をきれいにする特別な力があることもわかります。最後の大きな戦いでは、ショコラとバニラは力を合わせて魔界を救います。",
"女王に選ばれるのはバニラです。しかしショコラは大切な友だちとピエールを守り、自分にしかできない役目を見つけます。勝ち負けより大切なものを知る魔女たちのお話です。"
]},
{ cat:"m_fantasy", title:"ミルモでポン!", yomi:"ミルモでポン", sub:"篠塚ひろむ", author:"篠塚ひろむ", authorYomi:"しのづかひろむ", icon:"🧚", text:[
"南楓は、ごく普通の中学生の女の子です。楓には、結木摂という好きな男の子がいました。でも、なかなか気持ちを伝えられません。",
"ある日、楓は不思議なマグカップを買います。家でココアを入れて願いごとをすると、なんと小さな妖精・ミルモが飛び出してきました。",
"ミルモは妖精の国の王子さま。でも、まじめな王子さまとはほど遠く、お菓子が大好きで、わがままで、すぐにさぼります。",
"「私の恋を手伝って！」と頼む楓ですが、ミルモが魔法を使うたびに、かえって大さわぎになることもたくさんあります。",
"やがて、ミルモの婚約者リルム、ライバルのヤシチ、弟のムルモなど、たくさんの妖精たちが人間界へやってきます。",
"楓の恋にも、結木を好きな女の子や、楓を好きになる男の子があらわれます。魔法を使えば簡単に恋をかなえられそうですが、本当の気持ちは魔法では作れません。",
"たくさんの騒動のあと、楓は自分の気持ちをきちんと伝え、結木との恋を実らせます。",
"ミルモたちも妖精の世界へ帰る日を迎えます。さびしい別れですが、一緒に過ごした時間は消えません。人間と妖精、それぞれが少し成長して自分の世界へ帰っていくのでした。"
]},
{ cat:"m_love", title:"恋文日和", yomi:"こいぶみびより", sub:"ジョージ朝倉", author:"ジョージ朝倉", authorYomi:"じょーじあさくら", icon:"💌", text:[
"「好きです」。その一言を口で言うのは、とても勇気がいります。",
"だから、人はときどき手紙を書きます。",
"『恋文日和』は、一つの長い物語ではありません。毎回ちがう若者たちが登場し、「恋の手紙」をきっかけに物語が始まります。",
"好きな人の机に、こっそり手紙を入れる女の子。知らない人からラブレターをもらう人。昔好きだった人の手紙を、ずっと捨てられずに持っている人。",
"手紙を書いたからといって、必ず恋がかなうわけではありません。返事が来ないこともあります。思っていた相手とはちがう人から手紙が届くこともあります。",
"それでも、文字にすると、自分でも知らなかった気持ちが見えてきます。",
"「本当はずっと好きだった」「さよならを言いたかった」「ありがとうと言いたかった」。",
"恋文は、相手に気持ちを伝えるためのものですが、同時に、自分自身の心を知るためのものでもあります。",
"うれしい恋も、せつない恋も、終わってしまう恋もあります。いろいろな恋を一通の手紙からそっと描いていく、短い物語の集まりです。"
]},
{ cat:"m_love", title:"僕と君の大切な話", spine:"僕と君の|大切な話", yomi:"ぼくときみのたいせつなはなし", sub:"ろびこ", author:"ろびこ", authorYomi:"ろびこ", icon:"💬", text:[
"相沢のぞみは、同じ学年の東司朗をずっと好きでした。",
"ある日、駅のホームで勇気を出し、「好きです」と告白します。ところが東から返ってきたのは、のぞみが想像していたようなロマンチックな答えではありませんでした。",
"東はちょっと変わった理屈ばかり話す男の子だったのです。",
"それでも二人は、駅のホーム、学校の中庭、部室、喫茶店、図書室など、いろいろな場所で話を続けます。「男の人ってどうしてこうなの？」「女の人ってどうしてそう考えるの？」と、二人の話はいつも少しずれています。",
"話しているだけなのに、だんだん相手のことがわかってきます。東ものぞみを特別な存在として見るようになりました。",
"そしてとうとう、今度は東のほうからのぞみに告白します。",
"ところが、そこでもすぐ普通の恋人にはなりません。二人はまた話し合います。",
"たくさんしゃべり、たくさん勘違いし、少しずつわかり合う。最後には二人は、相手を自分の考えどおりにするのではなく、「ちがう人だからこそおもしろい」と思えるようになります。会話から始まり、会話で育っていく恋のお話です。"
]},
{ cat:"m_love", title:"潔く柔く", yomi:"いさぎよくやわく", sub:"いくえみ綾", author:"いくえみ綾", authorYomi:"いくえみりょう", icon:"🌙", text:[
"瀬戸カンナとハルタは、同じ団地で育った幼なじみです。高校へ入ると、真山や朝美とも仲良くなり、四人で楽しい毎日を送るようになります。",
"カンナとハルタは、おたがいを特別に思っていました。でも、まだ自分の気持ちをきちんと言葉にはできません。",
"そんなある夜、ハルタはカンナのことを考えながら出かけ、事故で亡くなってしまいます。",
"カンナは「自分のせいかもしれない」と心のどこかで思い続けます。時間がたっても、恋をしても、ハルタの死を完全に忘れることはできません。",
"物語はカンナだけでなく、彼女の友人、その友人の恋人、そのまた知り合いへと主人公を変えながら進みます。いくつもの恋の物語が、少しずつ一本につながっていきます。",
"そしてカンナは、大切な人を亡くした経験を持つ赤沢禄と出会います。禄もまた、過去に置いてきた悲しみを抱えていました。",
"二人は、相手に過去を消してもらうのではありません。「忘れなくても、生きていていい」と少しずつ知っていきます。",
"亡くなった人を大切に思いながら、新しい人を好きになってもいい。カンナが罪悪感から自由になり、もう一度未来へ歩き出すまでの物語です。"
]},
{ cat:"m_drama", title:"Piece", yomi:"ピース", sub:"芦原妃名子", author:"芦原妃名子", authorYomi:"あしはらひなこ", icon:"🧩", text:[
"須賀水帆は、あまり人に深くかかわらない大学生です。",
"ある日、高校時代の同級生・折口はるかが病気で亡くなったという知らせが届きます。お葬式へ行くと、はるかの母親から「娘が高校生のころ付き合っていた男の子を探してほしい」と頼まれました。",
"水帆は、ほとんど話したこともなかったはるかの過去を調べ始めます。",
"すると、「おとなしくて目立たない子」だと思っていたはるかにも、だれにも見せていなかった気持ちや秘密があったことがわかってきます。",
"さらに調べていくうち、水帆自身が高校時代に付き合っていた成海皓の家族にも、大きな秘密があることが見えてきます。",
"人の記憶は、パズルのピースのようなものです。一人の話だけ聞いても、本当の姿はわかりません。",
"「あの人はこういう人だった」と思っていたことも、別の人の話を聞くとまったくちがって見えます。",
"水帆は、亡くなったはるかのことを知ろうとするうちに、自分自身がずっと人と深くかかわることを避けてきたことにも気づきます。",
"すべてのピースがそろったとき、水帆は他人の心を完全に理解することはできなくても、知ろうとすることはできるのだと学びます。"
]},
